# Publishes one folder to Cloudflare Pages on every push to main.
#
# Until launch that folder is coming-soon/, a self-contained teaser that holds
# the domain. The full site is not deployed from here yet: assets/dist and
# vendor/ are a snapshot of Portrayal, which is still private, and the repo
# root also carries prototypes, harness pages and check scripts that were
# never meant to be served. Going live means building a publish folder that
# holds only the public pages, then pointing PUBLISH_DIR at it.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # never abandon a deploy halfway

env:
  PUBLISH_DIR: coming-soon
  PAGES_PROJECT: portrayal

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Mapped here so the step can test for them: `if:` cannot read secrets.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Only the publish folder is needed, and assets/dist is ~286 MB of
      # committed build output, so check out that one folder.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: ${{ env.PUBLISH_DIR }}

      # Until the Cloudflare account exists this says so and passes, rather
      # than turning every push to main red.
      - name: say so if Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy of $PUBLISH_DIR"

      - name: deploy ${{ env.PUBLISH_DIR }} to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.PUBLISH_DIR }} --project-name=${{ env.PAGES_PROJECT }} --branch=main
