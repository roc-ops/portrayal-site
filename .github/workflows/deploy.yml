# Publishes the site to Cloudflare (Workers static assets, which is what
# Cloudflare Pages became) on every push to main. wrangler.jsonc says which
# folder: assets.directory, which is public/ - built here, from tracked files
# only, by tools/build-public.py. The repo root is never served as-is.
#
# Rolling back to the teaser is wrangler.jsonc's directory set to
# ./coming-soon; the build step then does no harm.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party and actions/* steps are pinned to a full commit SHA, with the
# release it was resolved from in a trailing comment: a tag can be moved, a
# commit cannot. Bump by resolving the new tag's commit, not by editing the tag.

concurrency:
  group: deploy
  cancel-in-progress: false   # never abandon a deploy halfway

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # the first full-site upload is ~6,600 files; later ones send only changes
    permissions:
      contents: read
    env:
      # Mapped here so the step can test for them: `if:` cannot read secrets.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The whole tree: the build copies pages, site/, brand/, assets/ and
      # vendor/. Depth 1 - assets/dist is ~286 MB of committed build output,
      # and the build needs no history, only `git ls-files`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1

      - name: build public/
        run: python3 tools/build-public.py

      # Until the Cloudflare account exists this says so and passes, rather
      # than turning every push to main red.
      - name: say so if Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy"

      - name: deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          # The action's default is 3.90.0, which predates wrangler.jsonc and
          # fails asking for a Worker entry point. Pinned to what deploys
          # locally, so a manual deploy and this one behave the same.
          wranglerVersion: '4.141.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
