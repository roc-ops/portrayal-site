# What this repository already knew how to check, run without being asked.
#
# Both of these existed before this workflow: check-contract.py has been the
# last step of refresh-assets.sh since it was written, and the marks harness
# has had its 25 checks for as long - behind a button, on a page, which meant
# they ran when somebody remembered. The sync in this branch is the argument
# for running them here instead: it passed both of the guards that existed and
# still shipped a site where every page 404s on its first import.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  # By hand, to run a branch again without a commit - how a flake is told from a
  # fix: several green runs of the same tip.
  workflow_dispatch:

# A second push supersedes the first: these checks say whether the tip of a
# branch is sound, and a queue of runs against commits nobody will look at
# again is just latency on the answer to that.
# READ-ONLY TOKEN. Nothing here writes to the repository, comments, or
# publishes: every job reads the checkout and runs checks against it. A job that
# ever needs more gets its own narrow permissions block, not this one widened.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# TWO KINDS OF JOB, side by side. Every check run on a commit has to end green
# for it to land, so nothing here is allowed to end any other way on a good
# commit: no job waits on another, and none is skipped or cancelled by design.
jobs:
  # THE FILES, and the pure modules: nothing to install but the interpreters,
  # and an answer in under a minute.
  files:
    name: contract and modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # depth 1 deliberately: assets/dist is ~286 MB of committed build output
      # and none of these checks reads a second commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {fetch-depth: 1}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: '3.12'}

      # Run first and on its own step so a contract break is legible as one,
      # rather than as whichever page happened to fall over because of it.
      - name: the contract with Portrayal
        run: python3 check-contract.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: {node-version: '22'}

      # THE PURE MODULES, on their own - the rack model, Annotate's document-to-
      # scene - no browser, a second or two. Every tests/<area>/ folder runs.
      - name: the site's pure modules
        run: node --test tests/*/*.test.mjs

  # THE PAGES, opened - in five jobs at once. As one job on a 2-CPU runner the
  # pass had grown to twenty minutes and into its own timeout; no check in it
  # waits on another, so check-browser.py deals them into shards balanced by
  # how long each takes (see THE SHARDS there, and tools/shard-weights.py for
  # how the seconds it deals by are measured) and each job runs one. Four
  # shards of measured time were still about a quarter of an hour each, too
  # close to the timeout below; five are about twelve minutes of checks.
  #
  # The list below and the n after the slash say the same thing twice, and
  # check-contract.py fails if they stop agreeing - a shard nobody runs is a
  # fifth of the checks gone quiet. fail-fast is off because a cancelled
  # shard says nothing about its checks, and one red shard is not the whole
  # answer to what a commit broke.
  browser:
    name: browser (${{ matrix.shard }} of 5)
    runs-on: ubuntu-latest
    # PLAYWRIGHT'S OWN IMAGE, so there is no browser to install: Chromium, the
    # system libraries it needs and Python 3.12 come in it, built for Playwright
    # 1.63.0 - the tag and the pip pin below say the same version, and the
    # package of another version would look for a browser build the image does
    # not have. The tag resolved to sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
    # when this was written (the pull's log prints the digest). It replaces a step that
    # pip-installed Playwright, apt-installed its libraries and downloaded a
    # browser, about half a minute in every job. The image runs as root, which
    # is what Playwright's image expects; --ipc=host is what its documentation
    # asks of Chromium, whose 3D pages would otherwise share the 64 MB /dev/shm
    # a container gets by default.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    # The slowest shard is about twelve minutes of checks; the stage rail alone
    # is most of five and cannot be split.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {fetch-depth: 1}

      # No setup-python: the image's own python3 is the interpreter, and this
      # prints which, so a run log says what the checks ran under. The image
      # carries the browsers but not the Python package that drives them (the
      # first run of this job found none), so that is the one thing installed,
      # pinned to the image's version: a few seconds, no browser, no apt. The
      # system python is marked externally managed, hence the flag - the
      # container is thrown away after the job.
      - name: the interpreter, and Playwright pinned to the image's version
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check --break-system-packages playwright==1.63.0
          python3 -c "import importlib.metadata as m; print('playwright', m.version('playwright'))"

      # check-browser.py starts its own serve.py on a free port, so there is
      # nothing to start or stop around it here.
      - name: the pages, and the marks harness
        run: |
          echo "runner: $(nproc) CPUs, $(free -m | awk '/Mem:/ {print $2}') MB"
          python3 check-browser.py --shard ${{ matrix.shard }}/5
