name: Page request
description: Ask for something the site should do - a page, a control, an export, a kit example
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: The task, in your own terms, rather than the control you imagine. "Hand a cabling plan to a contractor as one file" says more than "a PDF button".
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which page, if one
      placeholder: rack.html
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: The workaround, if there is one, and what it costs you.
  - type: dropdown
    id: intent
    attributes:
      label: Are you building it yourself?
      options: ["Requesting only", "I am building it, this issue claims it"]
    validations:
      required: true
