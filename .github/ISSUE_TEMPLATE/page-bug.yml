name: Page bug
description: A page on portrayal.dev misbehaves, fails to load, or shows something wrong that is not the drawing itself
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page and URL
      description: The full URL, including any hash or query, so the same state can be opened again.
      placeholder: https://portrayal.dev/explorer.html?device=as7726-32x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The clicks or keys, in order, from opening that URL.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What happened, and what you expected
      description: A screenshot of the page helps. If the drawing itself is wrong (a port, a lamp, a dimension), that is a modelling defect for Portrayal instead.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything red in the browser's developer console.
      render: text
  - type: input
    id: env
    attributes:
      label: Browser and platform
      placeholder: Chrome 141, macOS 15
    validations:
      required: true
