blank_issues_enabled: true
contact_links:
  - name: A device is drawn wrong, or a device is missing
    url: https://github.com/roc-ops/Portrayal/issues/new/choose
    about: The drawings, the DCIM exports and the viewer modules come from Portrayal; modelling defects and device requests are filed there.
  - name: Ask a question or share an idea
    url: https://github.com/roc-ops/Portrayal/discussions
    about: Questions about using Portrayal or the site, and ideas that aren't yet a bug.
  - name: Report a security issue
    url: https://github.com/roc-ops/portrayal-site/security/advisories/new
    about: Privately, never as an issue. See SECURITY.md.
