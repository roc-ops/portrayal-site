<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Portrayal">
  <title>Portrayal</title>
  <!-- The quiet field: four elements plus one tall one, irregular on purpose so
       it reads as a device rather than a grid. Domain-neutral: these could be
       ports, bays, slots or cells. -->
  <g fill="#6B727A">
    <rect x="8"  y="14" width="15" height="16" rx="1.5"/>
    <rect x="8"  y="34" width="15" height="16" rx="1.5"/>
    <rect x="26" y="34" width="15" height="16" rx="1.5"/>
    <rect x="44" y="14" width="12" height="36" rx="1.5"/>
  </g>
  <!-- The one that is singled out. -->
  <rect x="26" y="14" width="15" height="16" rx="1.5" fill="#C79350"/>
  <rect x="22.25" y="10.25" width="22.5" height="23.5" rx="3"
        fill="none" stroke="#C79350" stroke-width="1.5"/>
</svg>
