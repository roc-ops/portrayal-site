<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="currentColor" role="img" aria-label="Portrayal">
  <title>Portrayal</title>
  <!-- For inline use where the mark must take the surrounding colour: one ink,
       separated by opacity. Works on stamps, print, and single-colour contexts. -->
  <g opacity="0.32">
    <rect x="8"  y="14" width="15" height="16" rx="1.5"/>
    <rect x="8"  y="34" width="15" height="16" rx="1.5"/>
    <rect x="26" y="34" width="15" height="16" rx="1.5"/>
    <rect x="44" y="14" width="12" height="36" rx="1.5"/>
  </g>
  <rect x="26" y="14" width="15" height="16" rx="1.5"/>
  <rect x="22.25" y="10.25" width="22.5" height="23.5" rx="3"
        fill="none" stroke="currentColor" stroke-width="1.5"/>
</svg>
