<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     shape-rendering="crispEdges" role="img" aria-label="Portrayal">
  <title>Portrayal</title>
  <!-- Redrawn on the pixel grid, not scaled from the 64px mark. Every edge
       lands on a whole pixel and the ring keeps a full 1px of dark ground
       between itself and the lit element, or the two blur into one blob. -->
  <g fill="#6B727A">
    <rect x="1"  y="2"  width="2" height="3"/>
    <rect x="1"  y="7"  width="2" height="3"/>
    <rect x="6"  y="11" width="4" height="3"/>
    <rect x="13" y="2"  width="2" height="12"/>
  </g>
  <rect x="6" y="4" width="4" height="4" fill="#C79350"/>
  <rect x="4.5" y="2.5" width="7" height="7"
        fill="none" stroke="#C79350" stroke-width="1"/>
</svg>
