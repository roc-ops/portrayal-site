  </g>
  <g id="led-pon" data-path="led-pon" data-class="led" data-ref="common/led-dot@1:1.1.0" data-rel-pos="2" transform="translate(118.6,72.5)" data-group="leds" data-group-role="indicator" data-description="the four lamps on the top face" data-states="off ranged synchronising" data-for="/rear/pon">
