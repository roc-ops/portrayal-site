    <text x="117.3" y="60.69" font-family="sans-serif" font-size="2.6" text-anchor="start" fill="#9a9da1" transform="rotate(180 117.3 60.69)" data-path="silk:2" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="led-alarm">ALARM</text>
    <text x="117.3" y="48.69" font-family="sans-serif" font-size="2.6" text-anchor="start" fill="#9a9da1" transform="rotate(180 117.3 48.69)" data-path="silk:3" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="led-data">DATA</text>
  </g>
