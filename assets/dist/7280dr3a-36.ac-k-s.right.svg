<svg xmlns="http://www.w3.org/2000/svg" width="611.8mm" height="87.9mm" viewBox="0 0 611.8 87.9" data-device="7280dr3a-36" data-view="right" data-weight-note="24.1 kg (53.1 lbs) per Table 1 of the guide; &quot;53.1 lbs (24.09 kg)&quot; per the data sheet" data-size-over-ears="48.3 x 8.8 x 61.2 cm (19 x 3.50 x 24.1 inches) per Table 1 of the guide, which includes the rack ears; the data sheet gives 43.99 x 8.79 x 61.18 cm &quot;inc. handles&quot;" data-throughput="14.4 (28.8) Tbps full duplex" data-packets-per-second="5.4 Bpps" data-latency="from 3.8 us" data-packet-buffer="16 GB" data-max-400g-ports="36" data-max-100g-ports="144" data-max-50g-ports="232" data-max-40g-ports="36" data-max-25-10g-ports="232" data-max-total-interfaces="232" data-power-draw-typical-w="643" data-power-draw-max-w="1283" data-power-draw-note="Table 4 of the guide: &quot;643 W / 1283 W&quot; for the DR3A-36, DR3AM-36 and DR3AK-36; the data sheet measures the typical at 25 C ambient with 50 percent load on all ports, excluding transceivers" data-airflow="front-to-back" data-operating-temp="0 to 40 C (32 to 104 F)" data-storage-temp="-25 to 70 C (-13 to 158 F)" data-storage-temp-datasheet="-40 to 70 C (-40 to 158 F), per the data sheet" data-altitude="0 to 3,000 m (0 to 10,000 ft)" data-humidity="5 to 90 percent, non-condensing" data-cpu="Eight-core x86" data-system-memory="64 GB" data-ssd-storage="480 GB" data-software="EOS; minimum release 4.30.0 per the data sheet" data-feature-license="EOS Feature Licenses Group 5" data-optics-qsfp-dd="datasheet: each QSFP-DD port runs 400G, or 200G, 100G, 50G, 40G (QSFP+) and 25/10G modes by breakout; maximum values are uni-dimensional and may need breakout cables or transceivers." data-optics-osfp="datasheet: the two OSFP-LS (line-system) ports are &quot;for dense 400G-ZR deployment&quot;, and &quot;Arista's R3A platforms are optimized to support high power 400ZR OSFP and QSFP-DD optical modules&quot;." data-osfp-ls="2 x OSFP-LS ports for dense 400G-ZR deployment" data-precision-timing="PTP and SyncE with OCXO and PPS/10M/ToD inputs" data-encryption="none on the DR3A-36; all ports (MACsec and TunnelSec) on the DR3AM-36 and DR3AK-36" data-console="RJ-45 serial (RS-232), 9600 baud, 8 data bits, no parity, 1 stop bit, no flow control" data-oob="10/100/1000 Ethernet management port" data-safety="EN 62368-1:2020+A11:2020, IEC 62368-1:2018, CSA/UL 62368-1:2019, AS/NZS 62368.1:2022" data-emissions="FCC Class A, ICES-003 Issue 7, EN 55032:2015, VCCI-CISPR 32:2016, AS/NZS CISPR 32:2015" data-regulatory-model-number="AN1760 (DCS-7280DR3A-36, DCS-7280DR3AM-36, DCS-7280DR3AK-36), guide Table 14" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
