<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9610-36d" data-view="top" data-switching-capacity="14.4 Tbps" data-deep-buffer="16 GB" data-power-typical-w="767" data-power-max-w="2073" data-power-envelope="bare" data-input-ac="200 to 240 V, 16 A" data-input-dc="-40 to -72 V, 80 A" data-psu-redundancy="1+1 hot-swappable" data-fan-redundancy="3+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Jericho2c+ BCM88850" data-tcam="Broadcom OP2 BCM16K" data-cpu="Intel Skylake-D 8-core @ 1.9 GHz" data-memory="64 GB DDR4, expandable to 128 GB" data-storage="1x 128 GB SSD, expandable to 2x 128 GB" data-bmc="Aspeed AST2620" data-oscillator="Stratum 3E OCXO with optional holdover" data-optics-qsfp-dd="400G QSFP-DD OpenZR+/ZR/SR8/FR4/LR4/ER4/DR4/DR4+/PLR4; 200G QSFP56 SR4/FR4; 100G QSFP28 SR4/LR4/ER4/ZR4 (datasheet compatible transceiver list); the HIG's port table gives a maximum supported distance of 600 km" data-optics-sfp-plus="10G SFP+ (datasheet port list, 2 x 10G SFP+ management ports)" data-zr-ports="the eighteen EVEN-numbered ports, 0 to 34, are the OpenZR+/ZR set - HIG Figure 9a shades exactly the upper row and captions it 'The ports highlighted in brown support OpenZR+ and ZR'" data-op2-disabled-ports="ports 1, 17, 19 and 35 lose their service-port function when the OP2 statistics counter is enabled, leaving 32 service ports (HIG Figure 8b)" data-segment-routing="full Segment Routing over IPv6 (SRv6)" data-macsec="point-to-point MACsec" data-timing-cable="50 ohm SMB coaxial with a 10-32UNF-2A connector, for 1PPS and 10MHz" data-timing="1PPS and 10MHz SMB, each input/output; SyncE and IEEE 1588v2 with the G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2, T-BC/OC and T-TC profiles, Class C accuracy" data-console="RJ45 RS-232 plus a micro-USB serial console, 115200 8N1" data-oob="1x RJ45 100/1000M" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; VCCI CISPR 32, Class A" data-environment="WEEE" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
