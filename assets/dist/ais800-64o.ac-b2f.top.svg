<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440.0mm" height="649.2mm" viewBox="0 0 440.0 649.2" data-device="ais800-64o" data-view="top" data-weight-note="20.5 kg (45.19 lb) with 2 PSUs and 4 fans installed (quick start guide); the datasheet says 21.5 kg (47.4 lb)" data-switching-capacity="51.2 Tbps (102.4 Tbps full duplex)" data-jumbo-frames="up to 9416 bytes" data-power-draw-max-w="2775" data-power-budget-per-port-w="30" data-operating-temp="0 to 40 C (front-to-back); 0 to 35 C (back-to-front), subject to used optics" data-storage-temp="-40 to 70 C" data-humidity="Operating: 5% to 95% non-condensing" data-altitude="Operating: 1800 m" data-cpu="Intel Xeon D-1713NTE Ice Lake D, 4-core 2.2 GHz, COM Type 7" data-switch-silicon="Broadcom BCM78900 Tomahawk 5" data-bmc="AST2600 running OpenBMC, secured by an AST1060 root of trust" data-memory="32 GB DDR4 SO-DIMM with ECC" data-storage="240 GB M.2 2280 NVMe SSD" data-boot-flash="64 MB SPI flash x 2" data-tpm="TPM 2.0 SPI" data-software="ONIE preloaded; no NOS image ships on the device" data-timing="1PPS, 10 MHz and ToD ports, SyncE and IEEE 1588v2 PTP" data-optics-osfp="datasheet: each OSFP800 port takes 1 x 800G on 8 lanes of 100G PAM4, or breaks out to 2 x 400G, 4 x 200G or 8 x 100G; on 50G PAM4 it takes 1 x 400G or breaks out to 2 x 200G, 4 x 100G or 8 x 50G; and it takes 1 x 100G on 4 lanes of 25G NRZ." data-emissions="EN 55032 Class A, AS/NZS CISPR32, EN 61000-3-2, EN 61000-3-3, FCC Class A, ICES-003, VCCI-CISPR32" data-immunity="EN 55035, IEC 61000-4-2/3/4/5/6/8/11" data-safety="UL (CSA 22.2 No 62368-1 &amp; UL 62368-1), CB (IEC/EN 62368-1)" data-nebs="GR63-CORE (Pre-test)" data-eol="none-announced" data-airflow="back-to-front" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
