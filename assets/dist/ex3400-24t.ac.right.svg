<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350.0mm" height="43.7mm" viewBox="0 0 350.0 43.7" data-device="ex3400-24t" data-view="right" data-weight="4.43 kg (9.76 lb) without power supplies or fan modules (Table 3)" data-weight-fru="JPSU-150-AC-AFO 0.65 kg, fan module 0.72 kg (Table 3)" data-depth-with-power-supply="382.4 mm (15.05 in.) with a power supply installed (Table 3)" data-width-with-brackets="482 mm (19 in.) with the mounting brackets attached (Table 3)" data-power-max-w="100" data-power-max-dc-w="110" data-power-envelope="unstated" data-power-input-ac="100 through 240 VAC, 50 or 60 Hz (Table 19)" data-power-current-max="3 A at 100 VAC and 1.5 A at 240 VAC (Table 19)" data-operating-temp="0 to 45 C (32 to 113 F) (Table 22)" data-altitude="no performance degradation up to 3048 m (10,000 ft) (Table 22)" data-humidity="10 to 85 percent, noncondensing (Table 22)" data-first-junos-release="15.1X53-D50 (Table 1)" data-macsec="IEEE 802.1AE MACsec on all Gigabit and 10 Gigabit Ethernet ports, 88 Gbps of encryption" data-virtual-chassis="up to 10 switches. The QSFP+ ports are Virtual Chassis ports by default" data-uplink-ports="four SFP or SFP+ ports on the front and two QSFP+ ports on the rear" data-optics-sfp-plus="the front uplink ports take SFP and SFP+ transceivers, singly or mixed. The supported list is in Juniper's Hardware Compatibility Tool, which the guide names and which is not held here" data-optics-qsfp="the rear uplink ports take QSFP+ transceivers. The supported list is in Juniper's Hardware Compatibility Tool, which the guide names and which is not held here" data-oob="management Ethernet RJ-45 on the rear panel, with a Link/Activity lamp and a Status lamp" data-console="RJ-45 console on the rear panel and Mini-USB Type-B console on the front, both labelled CON" data-usb="one USB port on the rear panel" data-seismic="Complies with Zone 4 earthquake requirements per GR-63, Issue 4 (Table 22)" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
