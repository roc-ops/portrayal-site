<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="438.4mm" height="300.0mm" viewBox="0 0 438.4 300.0" data-device="csr440" data-view="top" data-switching-capacity="800 Gbps" data-processing-rate="600 Mpps" data-power-max-w="383.6" data-power-envelope="as-tested" data-input-ac="100V-240V, 6.0-2.4 A per PS" data-input-dc="-44 to -60 V, 15.5-9.6 A per PS" data-airflow="front-to-back" data-cooling="six hot-swappable rear fan modules, 5+1 redundant" data-temperature-operating="-40 C to 65 C (-40 F to 149 F)" data-temperature-storage="-40 C to 70 C (-40 F to 158 F)" data-humidity-operating="5% to 95% non-condensing" data-asic="Broadcom BCM88843 Qumran-2A" data-cpu="Intel Xeon D-1539, 8-core 1.6 GHz" data-memory="DDR4 SO-DIMM, 2 x 8 GB with ECC" data-storage="128 GB mSATA SSD" data-software="ONIE installer pre-loaded; Open Network Linux (ONL) compatible" data-standards="O-RAN fronthaul; IEEE 802.1CM TSN in hardware" data-timing="IEEE1588v2 and SyncE in hardware; integrated GNSS" data-timing-ports="BITS (RJ-45), ToD (RJ-45), 1PPS I/O (SMB), 10MHz I/O (SMB), GNSS antenna (SMA)" data-optics-qsfp-dd="50, 100, 200 or 400 GbE per port; 400GBASE-SR8/DR4/FR4/ZR/ZR+" data-optics-qsfp28="40 GbE or 100 GbE per port; 100GBASE-SR4/LR4/ER4/ZR4/PSM4-2" data-optics-sfp28="1, 10 or 25 GbE per port; 25GBASE-SR/LR, 10GBASE-SR/LR/ER/ZR, 1000BASE-SX/LX/EX/ZX" data-port-leds-qsfp-dd="blue 400G, cyan 200G, green 100G, yellow 50G" data-port-leds-qsfp28="green 100G, cyan 50G, magenta 40G, blue 25G, yellow 10G" data-port-leds-sfp28="blue 25G, green 10G, cyan 1G" data-zr-caveat="ZR/ZR+ transceivers are supported to 55 C ambient with an 85 C transceiver case limit, not across the chassis's full -40 to 65 C range" data-mgmt-ports="1x RJ-45 1000BASE-T management, 1x RJ-45 serial console, 1x RJ-45 alarm, 1x USB Type-C storage, 1x micro-USB console" data-emissions="CE Mark, EN 55032 Class A, FCC Title 47 Part 15 Subpart B Class A, VCCI Class A" data-immunity="EN 55024, EN 55035 Class A" data-safety="UL (CAN/CSA 22.2 No 62368-1 &amp; UL62368-1), CB (IEC/EN60950-1 &amp; IEC/EN62368-1), BSMI CNS15598-1" data-rohs="RoHS 2.0" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
