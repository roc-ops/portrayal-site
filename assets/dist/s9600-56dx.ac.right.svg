<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="762mm" height="87.7mm" viewBox="0 0 762 87.7" data-device="s9600-56dx" data-view="right" data-switching-capacity="4.8 Tbps" data-packet-buffer="8 GB" data-power-typical-w="481" data-power-max-w="1497" data-power-envelope="bare" data-input-ac="200 to 240 V, 12.5 A" data-input-dc="-40 to -72 V, 60 A" data-psu-redundancy="1+1 hot-swappable" data-fan-redundancy="3+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Qumran2c BCM88820" data-cpu="Intel Icelake-D 8-core @ 2.1 GHz" data-memory="32 GB DDR4" data-storage="128 GB SSD" data-bmc="Aspeed AST2620" data-timing="Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 with an additional licence), T-GM, T-BC/OC, T-TC, Time Sensitive Networking; NOS integration is required to activate any of it" data-gnss="internal GNSS receiver for master-clock implementations; edge Grandmaster with PRTC" data-optics-qsfp-dd="400G QSFP-DD SR/LR/ER/ZR/OpenZR+, up to 600 km (datasheet port table)" data-optics-qsfp28="100G QSFP28 SR/LR/ER/ZR, up to 80 km; 40G" data-optics-sfp28="25G SFP28 SR/LR/ER up to 40 km; 10G SFP+ SR/LR/ER; 1G SFP SX/LX/EX" data-sfp28-sharing="the four SFP28 ports are in-band port share with 100GE port 0 (datasheet)" data-timing-cable="50 ohm SMA coaxial with a 1/4-36UNS-2B connector for GNSS, 50 ohm SMB coaxial with a 10-32UNF-2A connector for 1PPS and 10MHz, shielded RJ45 for ToD (datasheet Compatible Timing Cable Types)" data-antenna="an active GNSS antenna is required - 50 ohm impedance match, 5 V DC, noise figure 1.5 dB maximum, internal LNA gain 35-42 dB (HIG Installing an Antenna)" data-timing-interfaces="GNSS in on SMA, 10MHz in/out on SMB, 1PPS in/out on SMB, ToD in/out on RJ45" data-console="RJ45 RS-232 plus a micro-USB serial console" data-oob="1x RJ45 100/1000M" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; EN 301 489; EN 303 413; EN 62479; EN 50663" data-environment="RoHS; WEEE" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
