      <rect x="10" y="36" width="199" height="5" rx="1" />
      <rect x="10" y="48" width="180" height="5" rx="1" />
      <rect x="10" y="60" width="199" height="5" rx="1" />
      <rect x="10" y="72" width="150" height="5" rx="1" />
      <rect x="10" y="96" width="199" height="5" rx="1" />
      <rect x="10" y="108" width="185" height="5" rx="1" />
      <rect x="10" y="120" width="199" height="5" rx="1" />
