      <polygon points="10.60,10.53 6.84,12.70 3.08,10.53 3.08,6.19 6.84,4.02 10.60,6.19" fill="#d4d8dc" stroke="#8d939a" stroke-width="0.35" stroke-linejoin="round" />
      <g stroke="#7f858c" stroke-width="0.60" stroke-linecap="round">
