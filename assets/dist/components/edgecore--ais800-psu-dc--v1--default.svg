      </pattern>
      <pattern id="ais800-psu-dc--ais800-dc-slots" width="3.40" height="3.75" patternUnits="userSpaceOnUse">
        <rect x="0.45" y="0.80" width="2.50" height="2.15" rx="0.2" fill="#15181b" />
      </pattern>
    </defs>
