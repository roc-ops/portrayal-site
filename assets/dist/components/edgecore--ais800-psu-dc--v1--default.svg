      <rect id="ais800-psu-dc--terminal-pocket-2" x="20.48" y="17.32" width="13.45" height="15.15" rx="0.3" fill="#5f656c" data-depth="3.2" data-wall="#3a3e43" />
      <g stroke="#7f858c" stroke-width="0.55" stroke-linecap="round">
        <circle cx="10.76" cy="24.89" r="3.42" fill="#d4d8dc" stroke="#8d939a" stroke-width="0.3" />
        <line x1="10.76" y1="22.04" x2="10.76" y2="27.74" />
        <line x1="7.91" y1="24.89" x2="13.61" y2="24.89" />
        <circle cx="27.21" cy="24.89" r="3.42" fill="#d4d8dc" stroke="#8d939a" stroke-width="0.3" />
        <line x1="27.21" y1="22.04" x2="27.21" y2="27.74" />
        <line x1="24.36" y1="24.89" x2="30.06" y2="24.89" />
      </g>
