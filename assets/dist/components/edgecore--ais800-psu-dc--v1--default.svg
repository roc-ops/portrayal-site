    <g id="ais800-psu-dc--vent-top" data-path="ais800-psu-dc/vent-top" data-class="vent" data-z-vent="24">
      <rect x="18.47" y="8.87" width="26.67" height="3.75" rx="0.25" fill="#aeb4bb" />
      <rect x="18.47" y="8.87" width="26.67" height="3.75" fill="url(#ais800-psu-dc--ais800-dc-slots)" />
    </g>
    <g id="ais800-psu-dc--vent-field" data-path="ais800-psu-dc/vent-field" data-class="vent" data-z-vent="24">
      <rect x="37.62" y="15.01" width="13.68" height="20.12" rx="0.3" fill="#aeb4bb" />
      <rect x="37.62" y="15.01" width="13.68" height="20.12" fill="url(#ais800-psu-dc--ais800-dc-lattice)" />
      <rect x="37.62" y="15.01" width="13.68" height="20.12" rx="0.3" fill="none" stroke="#8d939a" stroke-width="0.25" />
    </g>
    <g id="ais800-psu-dc--terminal" data-path="ais800-psu-dc/terminal" data-class="terminal">
