      <text x="1.9" y="27.7" transform="rotate(-90 1.9 27.7)" font-family="sans-serif" font-size="1.1" fill="#e8eaec" text-anchor="middle">47-63Hz</text>
      <text x="4.6" y="65.0" transform="rotate(-90 4.6 65.0)" font-family="sans-serif" font-size="1.1" fill="#e8eaec" text-anchor="middle">200-220V 16A</text>
      <text x="3.2" y="65.0" transform="rotate(-90 3.2 65.0)" font-family="sans-serif" font-size="1.1" fill="#e8eaec" text-anchor="middle">220-240V 16A</text>
