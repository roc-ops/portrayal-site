    <circle id="qfx10000-pwr-ac--led-pwr-ok" cx="58.9" cy="10.7" r="1.5" fill="var(--led-color, #0f1113)" stroke="#33373c" stroke-width="0.25" data-path="qfx10000-pwr-ac/led-pwr-ok" data-class="led" data-states="off ok warning" />
    <circle id="qfx10000-pwr-ac--led-inp2" cx="66.2" cy="10.7" r="1.5" fill="var(--led-color, #0f1113)" stroke="#33373c" stroke-width="0.25" data-path="qfx10000-pwr-ac/led-inp2" data-class="led" data-states="off ok warning" />
    <circle id="qfx10000-pwr-ac--led-inp1" cx="73.2" cy="10.7" r="1.5" fill="var(--led-color, #0f1113)" stroke="#33373c" stroke-width="0.25" data-path="qfx10000-pwr-ac/led-inp1" data-class="led" data-states="off ok warning" />
