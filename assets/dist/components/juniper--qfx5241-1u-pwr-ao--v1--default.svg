<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.7mm" height="39.6mm" viewBox="0 0 54.7 39.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5241-1u-pwr-ao@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5241-1u-pwr-ao@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5241-1u-pwr-ao" data-path="qfx5241-1u-pwr-ao" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5241-1u-pwr-ao@1:1.0.0" data-airflow="front-to-back" data-input="200 to 240 VAC at 15 A, or 100 to 127 VAC at 12 A with 1000 W output, 50 to 60 Hz (guide Table 6)" data-model="QFX5241-1U-PWR-AO" data-power-output-w="2400" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5241-1u-pwr-ao</title>
    <defs>
      <pattern id="qfx5241-1u-pwr-ao--holes" width="2.6" height="2.6" patternUnits="userSpaceOnUse">
        <rect x="0.4" y="0.4" width="1.8" height="1.8" fill="#15161a" />
      </pattern>
    </defs>
    <rect id="qfx5241-1u-pwr-ao--face" x="0" y="0" width="54.7" height="39.6" rx="0.6" fill="#b8bbc0" stroke="#6b6f75" stroke-width="0.3" />
    <rect id="qfx5241-1u-pwr-ao--grille" x="0.5" y="0.4" width="28.6" height="38.8" fill="#c9ccd1" />
    <rect x="9.0" y="0.4" width="20.1" height="38.8" fill="url(#qfx5241-1u-pwr-ao--holes)" />
    <rect x="0.5" y="9.4" width="8.5" height="29.8" fill="url(#qfx5241-1u-pwr-ao--holes)" />
    <rect id="qfx5241-1u-pwr-ao--inlet-bay" x="29.3" y="0.4" width="24.1" height="34.0" rx="1.2" fill="#0e0f11" stroke="#2b2e32" stroke-width="0.3" />
    <circle id="qfx5241-1u-pwr-ao--led-pwr" cx="6.6" cy="5.5" r="2.0" fill="var(--led-color, #8a8d93)" stroke="#6b6f75" stroke-width="0.3" data-path="qfx5241-1u-pwr-ao/led-pwr" data-class="led" data-states="green amber off" />
    <g id="qfx5241-1u-pwr-ao--release-latch" data-path="qfx5241-1u-pwr-ao/release-latch" data-class="latch">
      <rect x="39.1" y="35.3" width="10.2" height="4.2" rx="0.9" fill="#e8731f" stroke="#b95812" stroke-width="0.3" />
    </g>
    <g id="qfx5241-1u-pwr-ao--handle" data-path="qfx5241-1u-pwr-ao/handle" data-class="latch" data-z-out="1.6" data-z-color="#e8731f">
      <path d="M 21.2 4.6 L 4.3 36.4" fill="none" stroke="#b95812" stroke-width="5.4" stroke-linecap="round" />
      <path d="M 21.2 4.6 L 4.3 36.4" fill="none" stroke="#e8731f" stroke-width="4.6" stroke-linecap="round" />
    </g>
    <g id="qfx5241-1u-pwr-ao--inlet" data-path="qfx5241-1u-pwr-ao/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(25.15,5.2) rotate(90 16.2 12.2)">
      <title>qfx5241-1u-pwr-ao--inlet</title>
      <rect id="qfx5241-1u-pwr-ao--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="qfx5241-1u-pwr-ao/inlet/opening" data-class="cutout" />
      <rect id="qfx5241-1u-pwr-ao--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="qfx5241-1u-pwr-ao--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="qfx5241-1u-pwr-ao--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="qfx5241-1u-pwr-ao--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
