<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="56.0mm" height="40.0mm" viewBox="0 0 56.0 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="psu-dc-650" data-path="psu-dc-650" data-class="psu" data-ref="common/psu-dc-650@1:1.3.0" data-input="dc" data-power-output-w="650" data-voltage="-48v" data-states="ok fail absent" transform="translate(0,0)">
    <title>psu-dc-650</title>
    <defs>
      <pattern id="psu-dc-650--mesh" width="2.4" height="2.4" patternUnits="userSpaceOnUse">
        <rect x="0.25" y="0.25" width="1.9" height="1.9" fill="#3c4046" />
      </pattern>
    </defs>
    <rect id="psu-dc-650--body" x="0" y="0" width="56" height="40" rx="0.8" fill="#b9bec4" stroke="#7a8087" stroke-width="0.4" />
    <rect id="psu-dc-650--vent-field" x="1.2" y="1.5" width="53.6" height="37" fill="url(#psu-dc-650--mesh)" />
    <rect id="psu-dc-650--latch" x="2" y="14" width="6" height="7" rx="0.8" fill="#3d7bd6" data-path="psu-dc-650/latch" data-class="latch" />
    <g id="psu-dc-650--handle" data-path="psu-dc-650/handle" data-class="handle">
      <rect id="psu-dc-650--handle-bar" x="10" y="8" width="5" height="24" rx="1.6" fill="#2b2f33" stroke="#171a1d" stroke-width="0.35" />
      <rect id="psu-dc-650--handle-grip" x="11.2" y="10" width="2.6" height="20" rx="1.2" fill="#0d0f11" />
    </g>
    <g id="psu-dc-650--dc-inlet" data-path="psu-dc-650/dc-inlet" data-class="inlet">
      <rect id="psu-dc-650--dc-inlet-frame" x="20.5" y="4" width="23" height="32" rx="1.0" fill="#e6e9ec" stroke="#7a8087" stroke-width="0.35" />
      <rect id="psu-dc-650--dc-inlet-body" x="22.5" y="6" width="19" height="28" rx="0.8" fill="#0d0f11" stroke="#33373c" stroke-width="0.4" />
      <rect id="psu-dc-650--dc-term-cover" x="24.5" y="8.5" width="15" height="10.5" rx="1.2" fill="#3d7bd6" stroke="#2a5aa8" stroke-width="0.4" />
      <rect id="psu-dc-650--dc-term-cover-rib" x="26.5" y="10" width="11" height="1.4" rx="0.7" fill="#2a5aa8" />
      <rect id="psu-dc-650--dc-lug-neg" x="26" y="21" width="5.2" height="6.5" rx="0.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.3" />
      <rect id="psu-dc-650--dc-lug-pos" x="33" y="21" width="5.2" height="6.5" rx="0.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.3" />
      <text x="28.6" y="31.8" font-family="sans-serif" font-size="3.4" text-anchor="middle" fill="#e6e9ec">-</text>
      <text x="35.6" y="31.8" font-family="sans-serif" font-size="3.4" text-anchor="middle" fill="#e6e9ec">+</text>
    </g>
  </g>
</svg>
