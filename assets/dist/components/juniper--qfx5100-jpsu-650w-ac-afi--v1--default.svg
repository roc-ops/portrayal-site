<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.8mm" height="39.8mm" viewBox="0 0 54.8 39.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5100-jpsu-650w-ac-afi@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5100-jpsu-650w-ac-afi@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5100-jpsu-650w-ac-afi" data-path="qfx5100-jpsu-650w-ac-afi" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5100-jpsu-650w-ac-afi@1:1.0.0" data-airflow="back-to-front" data-input="110 to 240 VAC single phase (datasheet); the 1RU rating table of the guide is empty" data-model="JPSU-650W-AC-AFI" data-part-number-older="QFXC01-PWRACI-650A" data-power-output-w="650" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5100-jpsu-650w-ac-afi</title>
    <defs>
      <pattern id="qfx5100-jpsu-650w-ac-afi--grid" width="5.9" height="8.1" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4.9" height="7.1" fill="#07080a" />
      </pattern>
    </defs>
    <rect id="qfx5100-jpsu-650w-ac-afi--face" x="0" y="0" width="54.8" height="39.8" rx="0.8" fill="#1c1e21" stroke="#181b1f" stroke-width="0.4" />
    <g id="qfx5100-jpsu-650w-ac-afi--vents">
      <rect x="2.6" y="2.8" width="17.7" height="16.2" rx="0.5" fill="#2b2e32" />
      <rect x="2.6" y="2.8" width="17.7" height="16.2" rx="0.5" fill="url(#qfx5100-jpsu-650w-ac-afi--grid)" />
    </g>
    <rect id="qfx5100-jpsu-650w-ac-afi--inlet-bay" x="31.0" y="6.4" width="23.0" height="30.0" rx="1.2" fill="#121416" stroke="#2b2e32" stroke-width="0.3" />
    <g id="qfx5100-jpsu-650w-ac-afi--silkscreen" font-family="sans-serif" font-size="2.3" font-weight="bold" fill="#d9dde1">
      <text x="8.4" y="22.7">AC</text>
      <text x="8.4" y="29.7">DC</text>
      <text x="8.9" y="36.8">!</text>
      <path d="M 8.6 24.6 q 0.8 -1.0 1.6 0 t 1.6 0" fill="none" stroke="#d9dde1" stroke-width="0.3" />
      <path d="M 8.6 31.4 h 3.2 M 8.6 32.3 h 0.8 m 0.8 0 h 0.8 m 0.8 0 h 0.8" fill="none" stroke="#d9dde1" stroke-width="0.3" />
    </g>
    <g id="qfx5100-jpsu-650w-ac-afi--lamps">
      <circle id="qfx5100-jpsu-650w-ac-afi--led-ac" cx="5.5" cy="21.9" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5100-jpsu-650w-ac-afi/led-ac" data-class="led" data-states="green off" />
      <circle id="qfx5100-jpsu-650w-ac-afi--led-dc" cx="5.5" cy="28.9" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5100-jpsu-650w-ac-afi/led-dc" data-class="led" data-states="green off" />
      <circle id="qfx5100-jpsu-650w-ac-afi--led-fault" cx="5.5" cy="35.9" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5100-jpsu-650w-ac-afi/led-fault" data-class="led" data-states="amber off" />
    </g>
    <g id="qfx5100-jpsu-650w-ac-afi--handle-silkscreen" font-family="sans-serif" font-size="2.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="25.05" y="6.7">AFI</text>
    </g>
    <g id="qfx5100-jpsu-650w-ac-afi--lever" data-path="qfx5100-jpsu-650w-ac-afi/lever" data-class="latch">
      <rect x="48.9" y="19.8" width="5.8" height="20.0" rx="1.2" fill="#232528" stroke="#3a3e43" stroke-width="0.35" />
      <rect x="50.9" y="24.3" width="1.6" height="9.0" rx="0.6" fill="#08090a" />
    </g>
    <g id="qfx5100-jpsu-650w-ac-afi--latch" data-path="qfx5100-jpsu-650w-ac-afi/latch" data-class="latch" data-z-out="1.6" data-z-color="#6ab3da">
      <rect x="21.0" y="0.6" width="8.1" height="39.0" rx="1.2" fill="#6ab3da" stroke="#3f86ad" stroke-width="0.4" />
    </g>
    <g id="qfx5100-jpsu-650w-ac-afi--inlet" data-path="qfx5100-jpsu-650w-ac-afi/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(32.4,7.4) rotate(270 14.0 10.0)">
      <title>qfx5100-jpsu-650w-ac-afi--inlet</title>
      <rect id="qfx5100-jpsu-650w-ac-afi--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="qfx5100-jpsu-650w-ac-afi/inlet/opening" data-class="cutout" />
      <path id="qfx5100-jpsu-650w-ac-afi--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="qfx5100-jpsu-650w-ac-afi--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx5100-jpsu-650w-ac-afi--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx5100-jpsu-650w-ac-afi--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
