<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="42.2mm" height="39.7mm" viewBox="0 0 42.2 39.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="amx-3200-fan" data-path="amx-3200-fan" data-class="fan" data-behaviour="fills" data-ref="edgecore/amx-3200-fan@1:1.0.0" data-wall="#15181b" data-airflow="front-to-back" data-model="AMX-3200-FAN" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>amx-3200-fan</title>
    <defs>
      <pattern id="amx-3200-fan--amx-fan-mesh" width="4.340" height="7.517" patternUnits="userSpaceOnUse">
        <path d="M 0.000 -2.123 L -1.838 -1.061 L -1.838 1.061 L 0.000 2.123 L 1.838 1.061 L 1.838 -1.061 Z" fill="#0b0d0f" />
        <path d="M 4.340 -2.123 L 2.502 -1.061 L 2.502 1.061 L 4.340 2.123 L 6.178 1.061 L 6.178 -1.061 Z" fill="#0b0d0f" />
        <path d="M 2.170 1.635 L 0.332 2.697 L 0.332 4.819 L 2.170 5.881 L 4.008 4.819 L 4.008 2.697 Z" fill="#0b0d0f" />
        <path d="M 0.000 5.394 L -1.838 6.456 L -1.838 8.578 L 0.000 9.640 L 1.838 8.578 L 1.838 6.456 Z" fill="#0b0d0f" />
        <path d="M 4.340 5.394 L 2.502 6.456 L 2.502 8.578 L 4.340 9.640 L 6.178 8.578 L 6.178 6.456 Z" fill="#0b0d0f" />
      </pattern>
    </defs>
    <rect id="amx-3200-fan--body" x="0" y="0" width="42.2" height="39.7" rx="0.5" fill="#2b2f34" stroke="#1b1e22" stroke-width="0.35" />
    <g id="amx-3200-fan--grille" data-path="amx-3200-fan/grille" data-class="rotor" data-z-vent="60">
      <rect x="1.20" y="1.20" width="39.80" height="37.30" fill="#80868d" />
      <rect x="1.20" y="1.20" width="39.80" height="37.30" fill="url(#amx-3200-fan--amx-fan-mesh)" />
      <circle cx="21.10" cy="19.85" r="16.0" fill="#e6eaec" fill-opacity="0.16" />
    </g>
    <g id="amx-3200-fan--handle" data-path="amx-3200-fan/handle" data-class="handle">
      <path d="M 0.8 15.2 L 12.0 15.2 C 19.0 15.2, 21.0 24.0, 28.0 24.0 L 41.4 24.0 L 41.4 32.7 L 28.0 32.7 C 21.0 32.7, 19.0 23.9, 12.0 23.9 L 0.8 23.9 Z" fill="#c7282c" stroke="#7d1b1e" stroke-width="0.3" data-fill-from="handle-finish" />
      <rect id="amx-3200-fan--handle-bar" x="0.8" y="22.8" width="40.6" height="5.0" fill="none" data-z-uhandle="18" data-z-dia="5.0" />
      <rect x="17.6" y="20.2" width="6.4" height="7.4" rx="0.6" fill="#e0575b" stroke="#7d1b1e" stroke-width="0.2" />
    </g>
    <circle id="amx-3200-fan--status" cx="5.0" cy="3.3" r="1.1" fill="#9aa0a6" stroke="#5b6167" stroke-width="0.15" data-path="amx-3200-fan/status" data-class="led" />
  </g>
</svg>
