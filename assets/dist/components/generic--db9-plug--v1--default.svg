<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="31mm" height="15.6mm" viewBox="0 0 31 15.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="db9-plug" data-path="db9-plug" data-class="port" data-ref="generic/db9-plug@1:1.0.0" data-connector="db9" data-gender="female" data-media="db9" transform="translate(0,0)">
    <title>db9-plug</title>
    <path id="db9-plug--shell" fill="#c9cdd1" d="M7.749 6.197 A2.000 2.000 0 0 1 9.719 3.850 L21.281 3.850 A2.000 2.000 0 0 1 23.251 6.197 L22.563 10.097 A2.000 2.000 0 0 1 20.594 11.750 L10.406 11.750 A2.000 2.000 0 0 1 8.437 10.097 Z" data-z-out="6.73" data-z-lift="0.55" data-z-color="#c9cdd1" data-z-shape="1" />
    <rect id="db9-plug--hood-front" x="0" y="0" width="31" height="15.6" rx="1" fill="#b4b8bd" stroke="#6d7379" stroke-width="0.2" data-z-out="14.47" data-z-lift="6.73" data-z-color="#b4b8bd" data-z-shape="1" />
    <rect id="db9-plug--hood" x="5.55" y="0" width="19.9" height="15.6" rx="1" fill="#b9bdc2" stroke="#6d7379" stroke-width="0.2" data-z-out="34.63" data-z-lift="14.47" data-z-color="#b9bdc2" data-z-shape="1" />
    <rect id="db9-plug--hood-rear" x="7.22" y="0.77" width="16.56" height="14.06" rx="1" fill="#aeb2b7" stroke="#6d7379" stroke-width="0.2" data-z-out="51.69" data-z-lift="34.63" data-z-color="#aeb2b7" data-z-shape="1" />
    <circle id="db9-plug--screw-l" cx="3.005" cy="7.8" r="2.005" fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2" data-z-cyl="31.24" data-z-lift="14.47" data-z-color="#cfd3d7" />
    <circle id="db9-plug--screw-r" cx="27.995" cy="7.8" r="2.005" fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2" data-z-cyl="31.24" data-z-lift="14.47" data-z-color="#cfd3d7" />
    <circle id="db9-plug--stub" cx="15.5" cy="7.8" r="3.1" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-r-from="cable-od" data-fill-from="jacket-color" data-z-cyl="30" data-z-lift="51.69" />
    <g data-cp="cable" data-cp-at="15.5 7.8" data-cp-dir="front" data-cp-on="db9-plug--stub" />
    <g data-cp="mate" data-cp-at="15.5 7.8" data-cp-dir="front" />
  </g>
</svg>
