<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="41.5mm" height="42.0mm" viewBox="0 0 41.5 42.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ex4300-48mp-fan-afo" data-path="ex4300-48mp-fan-afo" data-class="fan" data-behaviour="fills" data-ref="juniper/ex4300-48mp-fan-afo@1:1.0.0" data-airflow="front-to-back" data-airflow-label="AIR OUT (AFO)" data-model="EX4300-48MP-FAN" data-part-number="EX4300-48MP-FAN" data-role="fan-module" data-weight-kg="0.15" data-states="absent" transform="translate(0,0)">
    <title>ex4300-48mp-fan-afo</title>
    <defs>
      <pattern id="ex4300-48mp-fan-afo--hex" x="0" y="0" width="3.2" height="2.77" patternUnits="userSpaceOnUse">
        <polygon points="1.6,0.2 2.9,0.95 2.9,2.45 1.6,3.2 0.3,2.45 0.3,0.95" fill="#0e1012" transform="scale(0.85) translate(0.1 -0.2)" />
      </pattern>
    </defs>
    <rect id="ex4300-48mp-fan-afo--face" x="0" y="0" width="41.5" height="42.0" rx="1.2" fill="#454a4f" stroke="#2b2e35" stroke-width="0.4" />
    <g id="ex4300-48mp-fan-afo--grille-top">
      <rect x="7.0" y="3.2" width="28.0" height="10.6" rx="1.6" fill="#1c1f22" />
      <rect x="7.0" y="3.2" width="28.0" height="10.6" rx="1.6" fill="url(#ex4300-48mp-fan-afo--hex)" />
    </g>
    <g id="ex4300-48mp-fan-afo--grille-bottom">
      <rect x="7.0" y="27.6" width="28.0" height="11.2" rx="1.8" fill="#1c1f22" />
      <rect x="7.0" y="27.6" width="28.0" height="11.2" rx="1.8" fill="url(#ex4300-48mp-fan-afo--hex)" />
    </g>
    <g id="ex4300-48mp-fan-afo--handle" data-path="ex4300-48mp-fan-afo/handle" data-class="latch" data-z-out="2.0" data-z-color="#2b2e35">
      <rect x="1.0" y="14.4" width="39.5" height="12.4" rx="3.6" fill="#2b2e35" stroke="#15171a" stroke-width="0.4" />
      <rect x="3.2" y="16.2" width="35.1" height="8.8" rx="2.8" fill="#3a3f45" />
      <rect id="ex4300-48mp-fan-afo--airout-chip" x="12.8" y="16.4" width="15.9" height="8.0" rx="0.9" fill="#5b6066" />
      <g fill="#8a8f95">
        <circle cx="16.4" cy="20.4" r="0.9" />
        <circle cx="15.2" cy="19.3" r="0.8" />
        <circle cx="17.6" cy="19.3" r="0.8" />
        <circle cx="15.2" cy="21.5" r="0.8" />
        <circle cx="17.6" cy="21.5" r="0.8" />
      </g>
      <g id="ex4300-48mp-fan-afo--silkscreen">
        <text x="23.4" y="19.7" font-family="Arial" font-size="2.3" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="23.4" y="22.8" font-family="Arial" font-size="2.3" fill="#e8eaec" text-anchor="middle">OUT</text>
      </g>
    </g>
    <g id="ex4300-48mp-fan-afo--screw" data-path="ex4300-48mp-fan-afo/screw" data-class="screw" data-z-cyl="2.4" data-z-knurl="1">
      <circle cx="4.0" cy="4.0" r="2.4" fill="#111214" stroke="#5a5f66" stroke-width="0.35" />
      <circle cx="4.0" cy="4.0" r="1.0" fill="#26292d" />
    </g>
  </g>
</svg>
