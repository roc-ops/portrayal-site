          <path d="M 5.88 2.598 L 5.19 3.793 L 3.81 3.793 L 3.12 2.598 L 3.81 1.403 L 5.19 1.403 Z" />
          <path d="M 3.63 1.299 L 2.94 2.494 L 1.56 2.494 L 0.87 1.299 L 1.56 0.104 L 2.94 0.104 Z" />
          <path d="M 3.63 -1.299 L 2.94 -0.104 L 1.56 -0.104 L 0.87 -1.299 L 1.56 -2.494 L 2.94 -2.494 Z" />
          <path d="M 3.63 3.897 L 2.94 5.092 L 1.56 5.092 L 0.87 3.897 L 1.56 2.702 L 2.94 2.702 Z" />
        </g>
      </pattern>
    </defs>
    <rect id="nc57-c3-fan2-fw--body" x="0" y="0" width="66" height="126" rx="0.6" fill="#c3c7cc" stroke="#6b7076" stroke-width="0.3" />
    <g id="nc57-c3-fan2-fw--fan-a" data-path="nc57-c3-fan2-fw/fan-a" data-class="rotor">
      <circle cx="31" cy="33.5" r="28" fill="url(#nc57-c3-fan2-fw--nc57-fan2-hex)" />
      <g fill="none" stroke="#e6e8ea" stroke-width="1.2">
        <circle cx="31" cy="33.5" r="28" />
        <circle cx="31" cy="33.5" r="18.3" />
        <path d="M 31 5.5 V 61.5 M 3 33.5 H 59 M 11.2 13.7 L 50.8 53.3 M 50.8 13.7 L 11.2 53.3" />
      </g>
      <circle cx="31" cy="33.5" r="7.7" fill="#2b2f33" stroke="#e6e8ea" stroke-width="1.1" />
      <circle cx="31" cy="33.5" r="2.3" fill="#8d9298" />
    </g>
    <g id="nc57-c3-fan2-fw--fan-b" data-path="nc57-c3-fan2-fw/fan-b" data-class="rotor">
      <circle cx="31" cy="93" r="28" fill="url(#nc57-c3-fan2-fw--nc57-fan2-hex)" />
      <g fill="none" stroke="#e6e8ea" stroke-width="1.2">
        <circle cx="31" cy="93" r="28" />
        <circle cx="31" cy="93" r="18.3" />
        <path d="M 31 65 V 121 M 3 93 H 59 M 11.2 73.2 L 50.8 112.8 M 50.8 73.2 L 11.2 112.8" />
      </g>
      <circle cx="31" cy="93" r="7.7" fill="#2b2f33" stroke="#e6e8ea" stroke-width="1.1" />
