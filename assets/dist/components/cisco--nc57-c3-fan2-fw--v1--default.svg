    <circle id="nc57-c3-fan2-fw--status" cx="6.9" cy="119.5" r="1.8" fill="var(--led-color, #3a3f44)" stroke="#e6e8ea" stroke-width="0.4" data-path="nc57-c3-fan2-fw/status" data-class="led" data-states="off ok failed" />
  </g>
