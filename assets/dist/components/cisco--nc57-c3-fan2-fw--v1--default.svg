        <g fill="#0d0f11">
          <path d="M 1.38 0 L 0.69 1.195 L -0.69 1.195 L -1.38 0 L -0.69 -1.195 L 0.69 -1.195 Z" />
          <path d="M 1.38 2.598 L 0.69 3.793 L -0.69 3.793 L -1.38 2.598 L -0.69 1.403 L 0.69 1.403 Z" />
