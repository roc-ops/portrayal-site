    </g>
    <circle id="drive-tray-35--lamp-activity" cx="99.5" cy="4.1" r="1.1" fill="var(--led-color, #232a36)" stroke="#3c4146" stroke-width="0.25" data-path="drive-tray-35/lamp-activity" data-class="led" data-states="off idle-sas activity" data-description="Activity. Solid blue - idle SAS or NVMe drive installed; blinking blue - I/O activity; off - idle SATA drive. The blink rate is not stated and is drawn at 4 Hz." />
    <circle id="drive-tray-35--lamp-status" cx="99.5" cy="9.8" r="1.1" fill="var(--led-color, #33262a)" stroke="#3c4146" stroke-width="0.25" data-path="drive-tray-35/lamp-status" data-class="led" data-states="off fault rebuild identify" data-description="Status. Solid red - drive failure; red 1 Hz - rebuild; red 4 Hz - identify (each with VROC support). The hot-spare and power-on patterns are not drawn." />
    <path id="drive-tray-35--handle" d="M8.1 15.0 H76.0 Q80.8 15.0 80.8 18.9 Q80.8 22.9 76.0 22.9 H8.1 Z" fill="#2f3337" stroke="#101214" stroke-width="0.3" data-path="drive-tray-35/handle" data-class="handle" />
    <rect id="drive-tray-35--release" x="80.8" y="15.4" width="11.2" height="7.1" rx="0.7" fill="#8e3b3d" data-fill-from="release-color" stroke="#572425" data-stroke-derive="release-color" stroke-width="0.3" data-path="drive-tray-35/release" data-class="latch" data-z-out="1.5" />
