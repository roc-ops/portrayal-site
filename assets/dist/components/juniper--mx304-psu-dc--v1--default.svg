<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="66.0mm" height="40.1mm" viewBox="0 0 66.0 40.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mx304-psu-dc" data-path="mx304-psu-dc" data-class="psu" data-behaviour="fills" data-ref="juniper/mx304-psu-dc@1:1.0.1" data-body-depth="198.5" data-envelope="73.5 x 40.1 x 198.5 mm (Table 22)" data-inlet="dc-terminal" data-input="-48/-60 VDC nominal (operating -40 to -72 VDC), 50 A maximum" data-model="MX304 DC PSU" data-power-output-w="2200" data-redundancy="1+1" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>mx304-psu-dc</title>
    <rect id="mx304-psu-dc--face" x="0" y="0" width="66.0" height="40.1" rx="0.8" fill="#26292d" stroke="#17191c" stroke-width="0.4" />
    <g id="mx304-psu-dc--rotor">
      <circle cx="17.0" cy="20.0" r="15.2" fill="#101214" stroke="#3a3e43" stroke-width="0.5" />
      <circle cx="17.0" cy="20.0" r="4.4" fill="#26292d" stroke="#3a3e43" stroke-width="0.4" />
      <g stroke="#3a3e43" stroke-width="0.9" fill="none">
        <path d="M 17 5.6 A 14.4 14.4 0 0 1 17 34.4" />
        <path d="M 2.8 20 A 14.4 14.4 0 0 1 31.2 20" />
        <path d="M 7.0 9.8 A 14.4 14.4 0 0 1 27.2 30.2" />
        <path d="M 7.0 30.2 A 14.4 14.4 0 0 1 27.2 9.8" />
      </g>
    </g>
    <g id="mx304-psu-dc--handle" data-path="mx304-psu-dc/handle" data-class="latch" data-z-out="2.0" data-z-color="#e8731f">
      <rect x="1.2" y="24.4" width="10.5" height="13.0" rx="2.4" fill="#e8731f" stroke="#b95812" stroke-width="0.4" />
      <rect x="3.4" y="27.0" width="6.0" height="8.0" rx="1.8" fill="#d3661a" />
    </g>
    <circle id="mx304-psu-dc--led-status" cx="35.0" cy="5.2" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.3" />
    <g id="mx304-psu-dc--terminals" data-path="mx304-psu-dc/terminals" data-class="terminal" data-z-out="2.0" data-z-color="#111316">
      <rect id="mx304-psu-dc--terminal-plate" x="35.0" y="9.0" width="28.0" height="24.0" rx="1.2" fill="#111316" stroke="#3a3e43" stroke-width="0.4" />
      <g id="mx304-psu-dc--stud-0" data-z-cyl="5.0" data-z-lift="2.0" data-z-thread="1.0">
        <circle cx="43.5" cy="21.0" r="3.2" fill="#4a4f55" stroke="#6d7379" stroke-width="0.4" />
        <circle cx="43.5" cy="21.0" r="1.8" fill="#33373c" />
      </g>
      <g id="mx304-psu-dc--stud-1" data-z-cyl="5.0" data-z-lift="2.0" data-z-thread="1.0">
        <circle cx="54.5" cy="21.0" r="3.2" fill="#4a4f55" stroke="#6d7379" stroke-width="0.4" />
        <circle cx="54.5" cy="21.0" r="1.8" fill="#33373c" />
      </g>
    </g>
    <g id="mx304-psu-dc--silkscreen" font-family="Arial" font-size="1.7" fill="#c7ccd1" text-anchor="middle">
      <text x="43.5" y="12.8">-48V</text>
      <text x="54.5" y="12.8">RTN</text>
    </g>
  </g>
</svg>
