    <rect id="da15-plug--hood-rear" x="9.6" y="0.52" width="20.7" height="14.26" rx="1" fill="#aeb2b7" stroke="#6d7379" stroke-width="0.2" data-z-out="52.63" data-z-lift="33.93" data-z-color="#aeb2b7" data-z-shape="1" />
    <circle id="da15-plug--screw-l" cx="3.29" cy="7.65" r="2.005" fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2" data-z-cyl="31.24" data-z-lift="14.73" data-z-color="#cfd3d7" />
    <circle id="da15-plug--screw-r" cx="36.61" cy="7.65" r="2.005" fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2" data-z-cyl="31.24" data-z-lift="14.73" data-z-color="#cfd3d7" />
    <circle id="da15-plug--stub" cx="19.95" cy="7.65" r="3.605" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-r-from="cable-od" data-fill-from="jacket-color" data-z-cyl="30" data-z-lift="52.63" />
    <g data-cp="cable" data-cp-at="19.95 7.65" data-cp-dir="front" data-cp-on="da15-plug--stub" />
    <g data-cp="mate" data-cp-at="19.95 7.65" data-cp-dir="front" />
  </g>
</svg>
