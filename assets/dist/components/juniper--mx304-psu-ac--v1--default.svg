<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="66.0mm" height="40.1mm" viewBox="0 0 66.0 40.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mx304-psu-ac" data-path="mx304-psu-ac" data-class="psu" data-behaviour="fills" data-ref="juniper/mx304-psu-ac@1:1.0.0" data-body-depth="198.5" data-envelope="73.5 x 40.1 x 198.5 mm (Table 22)" data-input="100-240 VAC nominal (operating 90-264 VAC), 47-63 Hz, 13 A" data-model="MX304 AC PSU" data-power-output-low-line-w="1100" data-power-output-w="2200" data-redundancy="1+1" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>mx304-psu-ac</title>
    <rect id="mx304-psu-ac--face" x="0" y="0" width="66.0" height="40.1" rx="0.8" fill="#26292d" stroke="#17191c" stroke-width="0.4" />
    <g id="mx304-psu-ac--rotor">
      <circle cx="17.0" cy="20.0" r="15.2" fill="#101214" stroke="#3a3e43" stroke-width="0.5" />
      <circle cx="17.0" cy="20.0" r="4.4" fill="#26292d" stroke="#3a3e43" stroke-width="0.4" />
      <g stroke="#3a3e43" stroke-width="0.9" fill="none">
        <path d="M 17 5.6 A 14.4 14.4 0 0 1 17 34.4" />
        <path d="M 2.8 20 A 14.4 14.4 0 0 1 31.2 20" />
        <path d="M 7.0 9.8 A 14.4 14.4 0 0 1 27.2 30.2" />
        <path d="M 7.0 30.2 A 14.4 14.4 0 0 1 27.2 9.8" />
      </g>
    </g>
    <circle id="mx304-psu-ac--led-status" cx="35.0" cy="5.2" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.3" />
    <g id="mx304-psu-ac--handle" data-path="mx304-psu-ac/handle" data-class="latch" data-z-out="2.0" data-z-color="#e8731f">
      <rect x="1.2" y="24.4" width="10.5" height="13.0" rx="2.4" fill="#e8731f" stroke="#b95812" stroke-width="0.4" />
      <rect x="3.4" y="27.0" width="6.0" height="8.0" rx="1.8" fill="#d3661a" />
    </g>
    <g id="mx304-psu-ac--inlet" data-path="mx304-psu-ac/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(32.6,7.8)">
      <title>mx304-psu-ac--inlet</title>
      <rect id="mx304-psu-ac--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="mx304-psu-ac/inlet/opening" data-class="cutout" />
      <rect id="mx304-psu-ac--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="mx304-psu-ac--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="mx304-psu-ac--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="mx304-psu-ac--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
