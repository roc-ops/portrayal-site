      <path d="M 9.6 5.2 H 12.4 M 11.0 3.8 V 6.6" stroke="#6b6f75" stroke-width="0.4" />
      <circle cx="87.6" cy="5.2" r="1.8" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.35" />
      <path d="M 86.2 5.2 H 89.0 M 87.6 3.8 V 6.6" stroke="#6b6f75" stroke-width="0.4" />
    </g>
    <g id="ex6200-pwr-ac5000--enable-switch" data-path="ex6200-pwr-ac5000/enable-switch" data-class="button">
      <rect x="9.0" y="13.0" width="17.0" height="11.0" rx="1.0" fill="#2b2e32" stroke="#14161a" stroke-width="0.4" />
      <rect x="12.0" y="15.2" width="11.0" height="6.6" rx="0.6" fill="#8e9298" stroke="#5d6167" stroke-width="0.3" />
    </g>
    <circle id="ex6200-pwr-ac5000--led-input-1-ok" cx="44.3" cy="23.0" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3" data-path="ex6200-pwr-ac5000/led-input-1-ok" data-class="led" data-states="off ok out-of-range" />
    <circle id="ex6200-pwr-ac5000--led-input-2-ok" cx="57.4" cy="23.0" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3" data-path="ex6200-pwr-ac5000/led-input-2-ok" data-class="led" data-states="off ok out-of-range" />
    <circle id="ex6200-pwr-ac5000--led-output-ok" cx="69.5" cy="23.0" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3" data-path="ex6200-pwr-ac5000/led-output-ok" data-class="led" data-states="off ok fault" />
    <circle id="ex6200-pwr-ac5000--led-fail" cx="80.6" cy="23.0" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3" data-path="ex6200-pwr-ac5000/led-fail" data-class="led" data-states="off failed" />
    <g id="ex6200-pwr-ac5000--silkscreen" font-family="sans-serif" fill="#2b2e32" text-anchor="middle">
      <text x="17.5" y="11.4" font-size="1.5">ENABLE</text>
      <text x="17.5" y="27.2" font-size="1.4">STANDBY / ON</text>
      <text x="44.3" y="19.0" font-size="1.2">INPUT 1</text>
      <text x="44.3" y="20.4" font-size="1.2">OK</text>
      <text x="57.4" y="19.0" font-size="1.2">INPUT 2</text>
      <text x="57.4" y="20.4" font-size="1.2">OK</text>
      <text x="69.5" y="19.0" font-size="1.2">OUTPUT</text>
      <text x="69.5" y="20.4" font-size="1.2">OK</text>
      <text x="80.6" y="20.4" font-size="1.2">FAIL</text>
      <text x="24.0" y="119.2" font-size="1.4">INPUT 1</text>
      <text x="68.0" y="119.2" font-size="1.4">INPUT 2</text>
    </g>
    <g id="ex6200-pwr-ac5000--handle" data-path="ex6200-pwr-ac5000/handle" data-class="latch" data-z-out="2.0">
      <rect x="4.0" y="73.0" width="92.7" height="6.0" rx="3.0" fill="#6b6f75" stroke="#4a4e54" stroke-width="0.3" />
      <rect x="6.0" y="74.6" width="88.7" height="2.8" rx="1.4" fill="#aeb2b7" />
    </g>
    <g id="ex6200-pwr-ac5000--inlet-1" data-path="ex6200-pwr-ac5000/inlet-1" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(7.8,121.8)">
      <title>ex6200-pwr-ac5000--inlet-1</title>
      <rect id="ex6200-pwr-ac5000--inlet-1--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="ex6200-pwr-ac5000/inlet-1/opening" data-class="cutout" />
      <rect id="ex6200-pwr-ac5000--inlet-1--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="ex6200-pwr-ac5000--inlet-1--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex6200-pwr-ac5000--inlet-1--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex6200-pwr-ac5000--inlet-1--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
    <g id="ex6200-pwr-ac5000--inlet-2" data-path="ex6200-pwr-ac5000/inlet-2" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(51.8,121.8)">
      <title>ex6200-pwr-ac5000--inlet-2</title>
