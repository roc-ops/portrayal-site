    <rect id="fan-40802825--grille" x="0.9" y="0.9" width="42.2" height="83.5" fill="url(#fan-40802825--hex40802825)" data-z-vent="25" />
    <rect id="fan-40802825--handle" x="11.9" y="30.3" width="3.7" height="29.3" rx="1.85" fill="#c02a24" stroke="#7d1a16" stroke-width="0.3" data-path="fan-40802825/handle" data-class="handle" data-z-uhandle="25" />
