    <circle id="fan-40802825--status-led" cx="48.6" cy="77.1" r="1.2" fill="var(--led-color, #3a3f44)" data-path="fan-40802825/status-led" data-class="led" data-description="the lamp at the bottom of the right-hand flange, lit green on all five modules in the vendor's rear render. No UfiSpace document published for this platform tables its states, so none are claimed - see provenance.led-states" data-z-dome="0.4" />
