<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="71.2mm" height="39.0mm" viewBox="0 0 71.2 39.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex3400-jpsu-920-ac-afo@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='juniper/ex3400-jpsu-920-ac-afo@'] .state-red { --led-color: #e03a2f; }</style>
  <g id="ex3400-jpsu-920-ac-afo" data-path="ex3400-jpsu-920-ac-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/ex3400-jpsu-920-ac-afo@1:1.0.0" data-airflow="front-to-back" data-input="100 through 240 VAC, 50 or 60 Hz" data-power-output-w="920" data-role="ac-power-supply" data-weight-kg="0.85" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex3400-jpsu-920-ac-afo</title>
    <rect id="ex3400-jpsu-920-ac-afo--face" x="0" y="0" width="71.2" height="39.0" rx="0.8" fill="#c9cccf" stroke="#8d9195" stroke-width="0.4" />
    <g id="ex3400-jpsu-920-ac-afo--fan">
      <circle cx="15.7" cy="19.8" r="14.4" fill="#1d1f22" />
      <g transform="translate(15.7 19.8)" fill="#c9cccf" stroke="#8d9195" stroke-width="0.2">
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(0)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(51.4)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(102.8)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(154.2)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(205.6)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(257)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(308.4)" />
        <circle r="4.6" stroke="none" />
      </g>
      <rect id="ex3400-jpsu-920-ac-afo--airout-chip" x="9.2" y="16.3" width="13.0" height="7.0" rx="0.9" fill="#5b6066" />
      <circle cx="11.6" cy="19.8" r="1.5" fill="#ee6a1f" />
    </g>
    <g id="ex3400-jpsu-920-ac-afo--screws">
      <circle cx="3.9" cy="5.1" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
      <circle cx="4.5" cy="35.2" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
    </g>
    <rect id="ex3400-jpsu-920-ac-afo--label-strip" x="39.8" y="1.2" width="26.4" height="6.6" rx="0.4" fill="#b5b9bc" />
    <rect id="ex3400-jpsu-920-ac-afo--inlet-housing" x="38.5" y="8.8" width="27.5" height="29.2" rx="0.8" fill="#15171a" />
    <g id="ex3400-jpsu-920-ac-afo--lamps">
      <circle id="ex3400-jpsu-920-ac-afo--led-dc" cx="43.0" cy="4.5" r="1.1" fill="var(--led-color, #3d4044)" stroke="#2a2d30" stroke-width="0.3" data-path="ex3400-jpsu-920-ac-afo/led-dc" data-class="led" data-states="green red off" />
      <circle id="ex3400-jpsu-920-ac-afo--led-ac" cx="60.9" cy="4.5" r="1.1" fill="var(--led-color, #3d4044)" stroke="#2a2d30" stroke-width="0.3" data-path="ex3400-jpsu-920-ac-afo/led-ac" data-class="led" data-states="green off" />
    </g>
    <g id="ex3400-jpsu-920-ac-afo--silkscreen" font-family="Arial" font-size="2.0" fill="#2a2d30" font-weight="bold">
      <text x="45.6" y="4.0">DC</text>
      <text x="45.6" y="6.7">OK</text>
      <text x="63.4" y="4.0">AC</text>
      <text x="63.4" y="6.7">OK</text>
      <text x="15.0" y="19.4" text-anchor="start" font-size="2.2" fill="#e8eaec">AIR</text>
      <text x="15.0" y="22.1" text-anchor="start" font-size="2.2" fill="#e8eaec">OUT</text>
    </g>
    <g id="ex3400-jpsu-920-ac-afo--latch" data-path="ex3400-jpsu-920-ac-afo/latch" data-class="latch" data-z-out="1.6" data-z-color="#ee6a1f">
      <rect x="29.5" y="1.2" width="9.8" height="36.6" rx="1.2" fill="#ee6a1f" stroke="#b9500f" stroke-width="0.35" />
      <circle cx="34.2" cy="5.1" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
      <circle cx="34.2" cy="35.2" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
    </g>
    <g id="ex3400-jpsu-920-ac-afo--inlet" data-path="ex3400-jpsu-920-ac-afo/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(38.0,12.5)">
      <title>ex3400-jpsu-920-ac-afo--inlet</title>
      <rect id="ex3400-jpsu-920-ac-afo--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="ex3400-jpsu-920-ac-afo/inlet/opening" data-class="cutout" />
      <path id="ex3400-jpsu-920-ac-afo--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="ex3400-jpsu-920-ac-afo--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex3400-jpsu-920-ac-afo--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex3400-jpsu-920-ac-afo--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
