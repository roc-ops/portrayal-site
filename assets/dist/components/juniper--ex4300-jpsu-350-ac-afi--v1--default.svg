<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="84.0mm" height="42.0mm" viewBox="0 0 84.0 42.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex4300-jpsu-350-ac-afi@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='juniper/ex4300-jpsu-350-ac-afi@'] .state-red { --led-color: #ef4444; }</style>
  <g id="ex4300-jpsu-350-ac-afi" data-path="ex4300-jpsu-350-ac-afi" data-class="psu" data-behaviour="fills" data-ref="juniper/ex4300-jpsu-350-ac-afi@1:1.0.0" data-airflow="back-to-front" data-airflow-label="AIR IN (AFI)" data-input-current="4 A at low line, 2 A at high line" data-input-voltage="100-120 VAC low line or 200-240 VAC high line, 50-60 Hz" data-model="JPSU-350-AC-AFI-A" data-part-number="JPSU-350-AC-AFI-A" data-power-output-w="350" data-role="ac-power-supply" data-weight-kg="1.1" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex4300-jpsu-350-ac-afi</title>
    <defs>
      <pattern id="ex4300-jpsu-350-ac-afi--hex" x="0" y="0" width="3.2" height="2.77" patternUnits="userSpaceOnUse">
        <polygon points="1.6,0.2 2.9,0.95 2.9,2.45 1.6,3.2 0.3,2.45 0.3,0.95" fill="#0e1012" transform="scale(0.85) translate(0.1 -0.2)" />
      </pattern>
    </defs>
    <rect id="ex4300-jpsu-350-ac-afi--face" x="0" y="0" width="84.0" height="42.0" rx="0.8" fill="#6e737a" stroke="#3d4147" stroke-width="0.4" />
    <g id="ex4300-jpsu-350-ac-afi--vents">
      <rect x="3.0" y="20.5" width="28.0" height="19.0" rx="0.6" fill="#1c1f22" />
      <rect x="3.0" y="20.5" width="28.0" height="19.0" rx="0.6" fill="url(#ex4300-jpsu-350-ac-afi--hex)" />
      <rect x="40.0" y="33.0" width="42.0" height="7.0" rx="0.6" fill="#5d6269" />
    </g>
    <g id="ex4300-jpsu-350-ac-afi--airflow-label" font-family="sans-serif" fill="#1d2023">
      <rect id="ex4300-jpsu-350-ac-afi--plate" x="3.0" y="12.8" width="13.4" height="6.8" rx="0.5" fill="#d6d9dc" stroke="#9ba0a6" stroke-width="0.25" />
      <g id="ex4300-jpsu-350-ac-afi--fan-glyph" transform="translate(6.6 17.4) scale(1.1)">
        <circle r="0.2" />
        <ellipse cx="0" cy="-0.45" rx="0.3" ry="0.45" />
        <ellipse cx="0" cy="-0.45" rx="0.3" ry="0.45" transform="rotate(120)" />
        <ellipse cx="0" cy="-0.45" rx="0.3" ry="0.45" transform="rotate(240)" />
      </g>
    </g>
    <g id="ex4300-jpsu-350-ac-afi--lamps">
      <circle id="ex4300-jpsu-350-ac-afi--led-in-ok" cx="7.9" cy="8.6" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4300-jpsu-350-ac-afi/led-in-ok" data-class="led" data-states="green off" />
      <circle id="ex4300-jpsu-350-ac-afi--led-out-ok" cx="19.2" cy="8.6" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4300-jpsu-350-ac-afi/led-out-ok" data-class="led" data-states="green red off" />
    </g>
    <g id="ex4300-jpsu-350-ac-afi--silkscreen" font-family="sans-serif" fill="#1d2023">
      <text x="7.9" y="5.7" font-size="1.5" text-anchor="middle">IN OK</text>
      <text x="19.2" y="5.7" font-size="1.5" text-anchor="middle">OUT OK</text>
      <text class="airflow" x="9.7" y="15.6" font-size="2.0" font-weight="bold" text-anchor="middle">AIR IN</text>
      <text class="airflow" x="8.1" y="18.2" font-size="2.0" font-weight="bold" text-anchor="start">(AFI)</text>
    </g>
    <g id="ex4300-jpsu-350-ac-afi--latch" data-path="ex4300-jpsu-350-ac-afi/latch" data-class="latch" data-z-out="2.0" data-z-color="#2b2e35">
      <rect x="32.8" y="3.4" width="5.6" height="35.0" rx="2.4" fill="#2b2e35" stroke="#15171a" stroke-width="0.35" />
      <rect x="34.2" y="6.0" width="2.8" height="29.8" rx="1.2" fill="#3a3f45" />
    </g>
    <g id="ex4300-jpsu-350-ac-afi--inlet" data-path="ex4300-jpsu-350-ac-afi/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(47.0,10.5)">
      <title>ex4300-jpsu-350-ac-afi--inlet</title>
      <rect id="ex4300-jpsu-350-ac-afi--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="ex4300-jpsu-350-ac-afi/inlet/opening" data-class="cutout" />
      <path id="ex4300-jpsu-350-ac-afi--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="ex4300-jpsu-350-ac-afi--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex4300-jpsu-350-ac-afi--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex4300-jpsu-350-ac-afi--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
