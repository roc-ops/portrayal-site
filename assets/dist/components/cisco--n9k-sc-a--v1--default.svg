<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="198.37mm" height="36.07mm" viewBox="0 0 198.37 36.07">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/n9k-sc-a@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/n9k-sc-a@'] .state-blue { --led-color: #2a7de1; }
    g[data-ref^='cisco/n9k-sc-a@'] .state-blue { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='cisco/n9k-sc-a@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/n9k-sc-a@'] .state-red { --led-color: #d0021b; }
    g[data-ref^='cisco/n9k-sc-a@'] .state-red { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="n9k-sc-a" data-path="n9k-sc-a" data-class="supervisor" data-behaviour="fills" data-ref="cisco/n9k-sc-a@1:1.0.0" data-body-depth="272.8" data-eol="unknown" data-hot-swappable="True" data-model="N9K-SC-A" data-power-draw-max-w="25" data-power-draw-typical-w="14" data-role="system-controller" transform="translate(0,0)">
    <title>n9k-sc-a</title>
    <rect id="n9k-sc-a--plate" x="0.4" y="0.4" width="197.57" height="35.27" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3" />
    <g id="n9k-sc-a--ejector-left">
      <rect x="1.5" y="3" width="7" height="30" rx="1.5" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <g id="n9k-sc-a--ejector-right">
      <rect x="189.9" y="3" width="7" height="30" rx="1.5" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <rect id="n9k-sc-a--vent" x="40" y="4" width="140" height="28" rx="1" fill="#34373a" />
    <circle id="n9k-sc-a--bcn" cx="13.5" cy="15.5" r="1.5" fill="var(--led-color, #2a7de1)" stroke="#9aa0a6" stroke-width="0.25" data-path="n9k-sc-a/bcn" data-class="led" data-states="blue off" data-description="BCN lamp, left side of the module." />
    <circle id="n9k-sc-a--sts" cx="19.5" cy="15.5" r="1.5" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="n9k-sc-a/sts" data-class="led" data-states="green amber red off" data-description="STS lamp." />
    <circle id="n9k-sc-a--act" cx="25.5" cy="15.5" r="1.5" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="n9k-sc-a/act" data-class="led" data-states="green amber off" data-description="ACT lamp. Green when active, amber when standby." />
    <g id="n9k-sc-a--silkscreen">
      <text x="13.5" y="22" font-family="sans-serif" font-size="2.1" text-anchor="middle" fill="#231f20">BCN</text>
      <text x="19.5" y="22" font-family="sans-serif" font-size="2.1" text-anchor="middle" fill="#231f20">STS</text>
      <text x="25.5" y="22" font-family="sans-serif" font-size="2.1" text-anchor="middle" fill="#231f20">ACT</text>
    </g>
  </g>
</svg>
