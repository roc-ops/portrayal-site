        <path d="M 1.275 0 L 0.6375 1.104 L -0.6375 1.104 L -1.275 0 L -0.6375 -1.104 L 0.6375 -1.104 Z" fill="#1c1f23" />
        <path d="M 5.705 0 L 5.0675 1.104 L 3.7925 1.104 L 3.155 0 L 3.7925 -1.104 L 5.0675 -1.104 Z" fill="#1c1f23" />
        <path d="M 3.49 1.2775 L 2.8525 2.3815 L 1.5775 2.3815 L 0.94 1.2775 L 1.5775 0.1735 L 2.8525 0.1735 Z" fill="#1c1f23" />
        <path d="M 1.275 2.555 L 0.6375 3.659 L -0.6375 3.659 L -1.275 2.555 L -0.6375 1.451 L 0.6375 1.451 Z" fill="#1c1f23" />
        <path d="M 5.705 2.555 L 5.0675 3.659 L 3.7925 3.659 L 3.155 2.555 L 3.7925 1.451 L 5.0675 1.451 Z" fill="#1c1f23" />
      </pattern>
    </defs>
    <rect id="psu-102-ac--body" x="0" y="0" width="52.9" height="39.7" rx="0.6" fill="#c0c4c9" stroke="#7d838a" stroke-width="0.4" />
    <rect id="psu-102-ac--vent-field" x="3.4" y="2.0" width="13.6" height="35.7" fill="url(#psu-102-ac--hex102ac)" data-z-vent="30" />
    <path id="psu-102-ac--inlet-frame" fill-rule="evenodd" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.3" d="M 25.9 1.4 h 21.5 a 0.8 0.8 0 0 1 0.8 0.8 v 28.5 a 0.8 0.8 0 0 1 -0.8 0.8 h -21.5 a 0.8 0.8 0 0 1 -0.8 -0.8 v -28.5 a 0.8 0.8 0 0 1 0.8 -0.8 z        M 26.6 2.4 h 20.0 v 28.0 h -20.0 z" />
    <g id="psu-102-ac--inlet" data-path="psu-102-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(22.6,6.4) rotate(90 14.0 10.0)">
      <title>psu-102-ac--inlet</title>
      <rect id="psu-102-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-102-ac/inlet/opening" data-class="cutout" />
      <path id="psu-102-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
