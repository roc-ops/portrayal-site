      <rect id="psu-102-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-102-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
    </g>
    <rect id="psu-102-ac--latch" x="40.0" y="31.5" width="10.9" height="5.5" rx="0.8" fill="#2f66b5" stroke="#234b8c" stroke-width="0.3" data-path="psu-102-ac/latch" data-class="latch" data-z-out="2.2" />
    <rect id="psu-102-ac--handle" x="17.6" y="2.5" width="5.5" height="34.5" rx="2.4" fill="#2a2d31" stroke="#17191c" stroke-width="0.3" data-path="psu-102-ac/handle" data-class="handle" data-z-uhandle="27" />
    <circle id="psu-102-ac--status-led" cx="8.5" cy="8.6" r="1.2" fill="var(--led-color, #3a3f44)" data-path="psu-102-ac/status-led" data-class="led" data-description="the lamp inside the top-left corner of the vent field, lit green on both modules in the vendor's front render. No UfiSpace document published for this platform tables its states, so none are claimed - see provenance.led-states" data-z-dome="0.4" />
  </g>
</svg>
