    <g id="webcardlx--reset" data-path="webcardlx/reset" data-class="button" data-ref="common/reset-button@1:1.1.0" data-depth="2.5" data-wall="#101214" data-cavity="recess" transform="translate(30.7,21.8)" data-group="buttons" data-group-role="service">
