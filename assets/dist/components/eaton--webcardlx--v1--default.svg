        <title>webcardlx--lan--jack</title>
        <path id="webcardlx--lan--jack--housing" fill-rule="evenodd" fill="#b0b5bb" data-fill-from="finish" stroke="#1c1f23" stroke-width="0.15" d="     M 0.4 0 h 15.0 a 0.4 0.4 0 0 1 0.4 0.4 v 12.4 a 0.4 0.4 0 0 1 -0.4 0.4 h -15.0 a 0.4 0.4 0 0 1 -0.4 -0.4 v -12.4 a 0.4 0.4 0 0 1 0.4 -0.4 z     M 1.945 2.0 h 11.91 v 6.83 h -2.805 v 1.69 h -1.12 v 2.68 h -4.06 v -2.68 h -1.12 v -1.69 h -2.805 z" />
        <path id="webcardlx--lan--jack--cavity" fill="#0a0c0e" d="     M 1.945 2.0 h 11.91 v 6.83 h -2.805 v 1.69 h -1.12 v 2.68 h -4.06 v -2.68 h -1.12 v -1.69 h -2.805 z" />
        <path id="webcardlx--lan--jack--opening" fill="none" d="M 1.945 2.0 h 11.91 v 11.2 h -11.91 z" data-path="webcardlx/lan/jack/opening" data-class="cutout" />
        <g id="webcardlx--lan--jack--pins" fill="#a8873c">
          <rect x="4.10" y="2.6" width="0.46" height="2.3" />
          <rect x="5.12" y="2.6" width="0.46" height="2.3" />
          <rect x="6.14" y="2.6" width="0.46" height="2.3" />
          <rect x="7.16" y="2.6" width="0.46" height="2.3" />
          <rect x="8.18" y="2.6" width="0.46" height="2.3" />
          <rect x="9.20" y="2.6" width="0.46" height="2.3" />
          <rect x="10.22" y="2.6" width="0.46" height="2.3" />
          <rect x="11.24" y="2.6" width="0.46" height="2.3" />
