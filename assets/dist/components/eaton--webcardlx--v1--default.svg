    <g id="webcardlx--lan" data-path="webcardlx/lan" data-class="port" data-ref="common/rj45-eth@1:1.2.0" data-depth="18.6" data-media="rj45" data-role="mgmt" data-speed="100m" transform="translate(25.6,8.2)" data-group="mgmt" data-group-role="management">
