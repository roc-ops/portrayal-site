      <path id="webcardlx--lan--face" fill-rule="evenodd" fill="#b0b5bb" data-fill-from="finish" d="     M 0.4 0 h 15.0 a 0.4 0.4 0 0 1 0.4 0.4 v 12.4 a 0.4 0.4 0 0 1 -0.4 0.4 h -15.0 a 0.4 0.4 0 0 1 -0.4 -0.4 v -12.4 a 0.4 0.4 0 0 1 0.4 -0.4 z     M 1.945 2.0 h 11.91 v 6.83 h -2.805 v 1.69 h -1.12 v 2.68 h -4.06 v -2.68 h -1.12 v -1.69 h -2.805 z" />
      <rect id="webcardlx--lan--led-a" x="1.2" y="11.83" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)" data-path="webcardlx/lan/led-a" data-class="led" data-states="off activity" data-z-out="0.3" data-z-color="#0d0f11" />
      <rect id="webcardlx--lan--led-b" x="12.6" y="11.83" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)" data-path="webcardlx/lan/led-b" data-class="led" data-states="off speed-100m" data-z-out="0.3" data-z-color="#0d0f11" />
      <g data-cp="net" data-cp-at="7.9 6.6" data-cp-dir="front" />
