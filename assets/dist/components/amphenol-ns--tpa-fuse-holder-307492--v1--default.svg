    <circle id="tpa-fuse-holder-307492--eye" cx="8.9" cy="9.8" r="3.2" fill="#070808" stroke="#2c3033" stroke-width="0.4" data-path="tpa-fuse-holder-307492/eye" data-class="mechanical" data-depth="3.0" data-wall="#0f1112" />
