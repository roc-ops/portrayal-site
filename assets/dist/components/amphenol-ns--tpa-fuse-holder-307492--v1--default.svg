    </g>
    <g id="tpa-fuse-holder-307492--silkscreen">
      <g id="tpa-fuse-holder-307492--carried" display="none">
        <text id="tpa-fuse-holder-307492--fuse-rating" data-from="fuse-rating" x="8.9" y="18.5" font-size="3" text-anchor="middle" fill="#e8e8e4">0</text>
      </g>
