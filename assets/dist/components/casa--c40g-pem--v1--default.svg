        <circle id="c40g-pem--nut-pos-l" cx="27.0" cy="54.0" r="3.6" fill="#8a8d90" stroke="#4a4f55" stroke-width="0.5" data-z-cyl="2.2" />
        <circle id="c40g-pem--nut-pos-r" cx="45.0" cy="54.0" r="3.6" fill="#8a8d90" stroke="#4a4f55" stroke-width="0.5" data-z-cyl="2.2" />
