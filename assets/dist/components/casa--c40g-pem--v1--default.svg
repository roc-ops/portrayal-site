      <rect id="c40g-pem--lever-b" x="70.0" y="45.0" width="16.0" height="3.6" rx="1.8" fill="#c9cbcd" stroke="#8a8d90" stroke-width="0.3" data-z-out="4.2" />
      <g id="c40g-pem--warning" data-z-out="0.2">
        <rect x="90.0" y="44.0" width="62.0" height="15.0" fill="#f7d117" stroke="#b99c10" stroke-width="0.3" />
        <path d="M 97 47.5 L 102 56 L 92 56 Z" fill="none" stroke="#231f20" stroke-width="0.7" />
        <rect x="105.0" y="47.5" width="42.0" height="2.0" fill="#231f20" />
        <rect x="105.0" y="51.5" width="44.0" height="1.4" fill="#4a4f55" />
