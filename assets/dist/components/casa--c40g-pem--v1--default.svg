        <rect x="55.0" y="33.2" width="6.0" height="1.6" fill="#231f20" />
        <circle id="c40g-pem--nut-neg-l" cx="27.0" cy="34.0" r="3.6" fill="#8a8d90" stroke="#4a4f55" stroke-width="0.5" data-z-cyl="2.2" />
