<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90.0mm" height="41.5mm" viewBox="0 0 90.0 41.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex4200-pwr-190-dc@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='juniper/ex4200-pwr-190-dc@'] .state-red { --led-color: #e03a2f; }</style>
  <g id="ex4200-pwr-190-dc" data-path="ex4200-pwr-190-dc" data-class="psu" data-behaviour="fills" data-ref="juniper/ex4200-pwr-190-dc@1:1.0.1" data-depth-beyond-chassis-mm="0" data-inlet="dc-terminal" data-input-current="7 A maximum" data-input-voltage="36-72 VDC, dual feed" data-part-number="EX-PWR-190-DC" data-power-output-w="190" data-role="dc-power-supply" data-weight-kg="1.1" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex4200-pwr-190-dc</title>
    <defs>
      <pattern id="ex4200-pwr-190-dc--hex" x="0" y="0" width="3.2" height="2.77" patternUnits="userSpaceOnUse">
        <polygon points="1.6,0.2 2.9,0.95 2.9,2.45 1.6,3.2 0.3,2.45 0.3,0.95" fill="#0e1012" transform="scale(0.85) translate(0.1 -0.2)" />
      </pattern>
    </defs>
    <rect id="ex4200-pwr-190-dc--face" x="0" y="0" width="90.0" height="41.5" rx="0.8" fill="#3b3e46" stroke="#1d2024" stroke-width="0.4" />
    <g id="ex4200-pwr-190-dc--vents">
      <rect x="14.0" y="3.0" width="46.0" height="36.5" rx="0.6" fill="#1c1f22" />
      <rect x="14.0" y="3.0" width="46.0" height="36.5" rx="0.6" fill="url(#ex4200-pwr-190-dc--hex)" />
    </g>
    <g id="ex4200-pwr-190-dc--lamps">
      <circle id="ex4200-pwr-190-dc--led-a" cx="6.0" cy="19.0" r="1.1" fill="var(--led-color, #0f1113)" stroke="#6b7078" stroke-width="0.25" data-path="ex4200-pwr-190-dc/led-a" data-class="led" data-states="green red off" />
      <circle id="ex4200-pwr-190-dc--led-b" cx="6.0" cy="28.5" r="1.1" fill="var(--led-color, #0f1113)" stroke="#6b7078" stroke-width="0.25" data-path="ex4200-pwr-190-dc/led-b" data-class="led" data-states="green red off" />
    </g>
    <g id="ex4200-pwr-190-dc--latch" data-path="ex4200-pwr-190-dc/latch" data-class="latch" data-z-out="2.0" data-z-color="#9ba0a6">
      <rect x="1.5" y="3.0" width="8.2" height="9.6" rx="1.4" fill="#9ba0a6" stroke="#4b5057" stroke-width="0.3" />
      <circle cx="5.6" cy="7.8" r="2.4" fill="#d6d9dc" stroke="#4b5057" stroke-width="0.3" />
      <path d="M 4.0 7.8 H 7.2" stroke="#4b5057" stroke-width="0.35" />
    </g>
    <g id="ex4200-pwr-190-dc--handle" data-path="ex4200-pwr-190-dc/handle" data-class="latch" data-z-out="3.0" data-z-color="#c9ccd0">
      <path d="M 15.26 36.37 L 55.26 8.37 L 54.74 7.63 L 14.74 35.63 Z" fill="none" stroke="#9ba0a6" stroke-width="0.25" stroke-linejoin="round" />
    </g>
    <g id="ex4200-pwr-190-dc--terminals">
      <rect x="63.0" y="2.5" width="24.0" height="36.5" rx="0.8" fill="#15171a" stroke="#6b7078" stroke-width="0.3" />
      <g fill="#9ba0a6" stroke="#4b5057" stroke-width="0.3">
        <circle cx="80.0" cy="8.0" r="2.5" />
        <circle cx="80.0" cy="17.0" r="2.5" />
        <circle cx="80.0" cy="26.0" r="2.5" />
        <circle cx="80.0" cy="35.0" r="2.5" />
      </g>
      <g stroke="#4b5057" stroke-width="0.35">
        <path d="M 78.4 8.0 H 81.6 M 78.4 17.0 H 81.6 M 78.4 26.0 H 81.6 M 78.4 35.0 H 81.6" />
      </g>
    </g>
    <g id="ex4200-pwr-190-dc--silkscreen" font-family="sans-serif" fill="#d6d9dc">
      <text x="9.0" y="19.5" font-size="1.3">LED-A</text>
      <text x="9.0" y="29.0" font-size="1.3">LED-B</text>
      <text x="73.0" y="8.5" font-size="1.6" text-anchor="middle">A+</text>
      <text x="73.0" y="17.5" font-size="1.6" text-anchor="middle">B+</text>
      <text x="73.0" y="26.5" font-size="1.6" text-anchor="middle">A-</text>
      <text x="73.0" y="35.5" font-size="1.6" text-anchor="middle">B-</text>
    </g>
  </g>
</svg>
