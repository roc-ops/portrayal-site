      <path d="M 12.9 56.5 h 2.6 M 14.2 55.2 v 2.6" stroke="#2a2c2f" stroke-width="0.4" />
      <rect x="2.8" y="17.3" width="19.7" height="35.1" fill="#101112" stroke="#2a2c2f" stroke-width="0.25" />
    </g>
    <g id="eb-breaker-20a-2p--silkscreen" font-family="sans-serif" fill="#e6e6e6">
      <text x="28.7" y="35.1" font-size="10.6" text-anchor="middle" transform="rotate(90 28.7 35.1)" data-from="bank" data-fill-from="ink">B1</text>
