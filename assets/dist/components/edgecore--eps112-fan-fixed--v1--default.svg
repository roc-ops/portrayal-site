      <circle id="eps112-fan-fixed--rotor-disc" cx="12.55" cy="12.55" r="8.40" fill="#dfe3e6" stroke="#8d9298" stroke-width="0.3" />
      <g id="eps112-fan-fixed--spider" stroke="#5a6167" stroke-width="0.60" fill="none">
