    <circle id="qfx5700-fan--led-fan1" cx="10.6" cy="29.9" r="1.0" fill="var(--led-color, #8a8d93)" stroke="#2f3236" stroke-width="0.3" data-path="qfx5700-fan/led-fan1" data-class="led" data-states="off initialising ok fault" />
