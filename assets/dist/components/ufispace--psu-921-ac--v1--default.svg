<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.0mm" height="40.0mm" viewBox="0 0 73.0 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-921-ac@'] .state-critical { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-921-ac@'] .state-input-lost { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-921-ac@'] .state-input-lost { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-921-ac@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-921-ac@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-921-ac@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-921-ac@'] .state-warning { --led-color: #22c55e; --led-color-alt: #eab308; }
    g[data-ref^='ufispace/psu-921-ac@'] .state-warning { animation: portrayal-alternate 1s linear infinite; }</style>
  <g id="psu-921-ac" data-path="psu-921-ac" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-921-ac@1:1.0.0" data-airflow="exhaust" data-input="ac" data-model="PSU-921-AECR1" data-power-output-w="920" transform="translate(0,0)">
    <title>psu-921-ac</title>
    <rect id="psu-921-ac--body" x="0" y="0" width="73" height="40" rx="0.6" fill="#b9bec4" stroke="#8d9297" stroke-width="0.4" />
    <g id="psu-921-ac--rotor-grille" data-z-vent="25">
      <circle cx="16.2" cy="20" r="13.6" fill="#17191c" />
      <g fill="#2e3339">
        <path d="M 16.2 20 L 16.2 7.2 A 12.8 12.8 0 0 1 27.3 13.6 Z" />
        <path d="M 16.2 20 L 27.3 13.6 A 12.8 12.8 0 0 1 27.3 26.4 Z" />
        <path d="M 16.2 20 L 27.3 26.4 A 12.8 12.8 0 0 1 16.2 32.8 Z" />
        <path d="M 16.2 20 L 16.2 32.8 A 12.8 12.8 0 0 1 5.1 26.4 Z" />
        <path d="M 16.2 20 L 5.1 26.4 A 12.8 12.8 0 0 1 5.1 13.6 Z" />
        <path d="M 16.2 20 L 5.1 13.6 A 12.8 12.8 0 0 1 16.2 7.2 Z" />
      </g>
    </g>
    <g id="psu-921-ac--screws" fill="#8d9297" stroke="#6e7378" stroke-width="0.25">
      <circle cx="3.4" cy="3.4" r="1.2" />
      <circle cx="3.4" cy="36.6" r="1.2" />
      <circle cx="29.6" cy="3.4" r="1.2" />
      <circle cx="29.6" cy="36.6" r="1.2" />
    </g>
    <g id="psu-921-ac--vents" fill="#33373c">
      <rect x="39.2" y="12.6" width="2.4" height="5.6" rx="0.5" />
      <rect x="39.2" y="21.8" width="2.4" height="5.6" rx="0.5" />
    </g>
    <g id="psu-921-ac--rotor-bulge" data-z-dome="3.2">
      <circle cx="16.2" cy="20" r="5.4" fill="#9ba1a7" stroke="#7d8288" stroke-width="0.3" />
      <circle cx="16.2" cy="20" r="1.1" fill="#17191c" />
    </g>
    <rect id="psu-921-ac--handle" x="33.2" y="2.5" width="3.6" height="35" rx="1.7" fill="#17191c" stroke="#0d0f11" stroke-width="0.3" data-path="psu-921-ac/handle" data-class="handle" data-z-uhandle="38" />
    <rect id="psu-921-ac--latch" x="63.8" y="4.5" width="8.6" height="9.5" rx="0.6" fill="#c8102e" stroke="#8f0b21" stroke-width="0.3" data-path="psu-921-ac/latch" data-class="latch" data-z-out="2.2" />
    <circle id="psu-921-ac--status-led" cx="69" cy="20.5" r="1.4" fill="var(--led-color, #3a3f44)" data-path="psu-921-ac/status-led" data-class="led" data-states="off ok standby critical input-lost warning" data-description="HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output ON and OK), Blinking Green (standby state input power present; the table's second Blinking Green row, firmware updating in boot-loader mode, is visually identical and shares this state), Yellow (critical event causing shutdown - failure, over current, short circuit, over voltage, fan failure, over temperature), Blinking Yellow (AC cord unplugged or AC lost with the second supply still fed), Blinking between Green and Yellow (warning events where the supply keeps operating - high temp, high power, high current, slow fan)" data-z-dome="0.4" />
    <g id="psu-921-ac--inlet" data-path="psu-921-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(39.5,10.5) rotate(90 14.0 10.0)">
      <title>psu-921-ac--inlet</title>
      <rect id="psu-921-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-921-ac/inlet/opening" data-class="cutout" />
      <path id="psu-921-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-921-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-921-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-921-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
    </g>
  </g>
</svg>
