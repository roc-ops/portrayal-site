<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="74.1mm" height="40.6mm" viewBox="0 0 74.1 40.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx10002-jpsu-1600w-ac-afo@'] .state-fault { --led-color: #f59e0b; }
    g[data-ref^='juniper/qfx10002-jpsu-1600w-ac-afo@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='juniper/qfx10002-jpsu-1600w-ac-afo@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='juniper/qfx10002-jpsu-1600w-ac-afo@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/qfx10002-jpsu-1600w-ac-afo@'] .state-warning { --led-color: #f59e0b; }
    g[data-ref^='juniper/qfx10002-jpsu-1600w-ac-afo@'] .state-warning { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="qfx10002-jpsu-1600w-ac-afo" data-path="qfx10002-jpsu-1600w-ac-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx10002-jpsu-1600w-ac-afo@1:1.0.0" data-body-depth="185.0" data-airflow="front-to-back" data-hot-swap="yes" data-input-frequency="50-60 Hz" data-input-voltage="100-127 VAC low line, 200-240 VAC high line" data-output="12 VDC with a 12 VDC standby output" data-power-output-w="1600" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx10002-jpsu-1600w-ac-afo</title>
    <rect id="qfx10002-jpsu-1600w-ac-afo--face" x="0" y="0" width="74.1" height="40.6" rx="0.8" fill="#d2d4d3" stroke="#8f9093" stroke-width="0.4" />
    <g id="qfx10002-jpsu-1600w-ac-afo--fan">
      <circle cx="22.3" cy="19.4" r="18.2" fill="#14100f" />
      <circle cx="22.3" cy="19.4" r="14.4" fill="none" stroke="#6b6e70" stroke-width="1.2" />
      <path d="M 22.3 1.4 V 8.4 M 22.3 30.4 V 37.4 M 4.3 19.4 H 11.3 M 33.3 19.4 H 40.3" stroke="#6b6e70" stroke-width="1.1" fill="none" />
      <circle cx="22.3" cy="19.4" r="8.9" fill="#2eb5d0" stroke="#1f7f93" stroke-width="0.5" />
    </g>
    <g id="qfx10002-jpsu-1600w-ac-afo--screws" fill="#c9cacc" stroke="#7c7d80" stroke-width="0.3">
      <circle cx="6.8" cy="3.9" r="3.1" />
      <circle cx="38.5" cy="3.9" r="3.1" />
      <path d="M 5.3 3.9 H 8.3 M 6.8 2.4 V 5.4 M 37.0 3.9 H 40.0 M 38.5 2.4 V 5.4" fill="none" stroke="#5b5d60" stroke-width="0.4" />
    </g>
    <rect id="qfx10002-jpsu-1600w-ac-afo--inlet-housing" x="42.8" y="2.8" width="23.9" height="30.1" rx="1.0" fill="#2a2523" />
    <g id="qfx10002-jpsu-1600w-ac-afo--hazard">
      <rect x="67.4" y="3.6" width="3.6" height="3.6" rx="0.3" fill="#f2c200" />
      <path d="M 69.2 4.3 L 70.5 6.6 H 67.9 Z" fill="#14100f" />
    </g>
    <circle cx="54.8" cy="37.1" r="1.5" fill="#14100f" stroke="#7c7d80" stroke-width="0.3" />
    <circle cx="67.8" cy="37.1" r="1.7" fill="#c9cacc" stroke="#7c7d80" stroke-width="0.3" />
    <circle id="qfx10002-jpsu-1600w-ac-afo--led" cx="67.8" cy="37.1" r="1.0" fill="var(--led-color, #3a4a3a)" stroke="#5c5e60" stroke-width="0.25" data-path="qfx10002-jpsu-1600w-ac-afo/led" data-class="led" data-states="off ok standby warning fault" />
    <g id="qfx10002-jpsu-1600w-ac-afo--silkscreen" font-family="sans-serif" font-weight="bold" fill="#1f5f70" text-anchor="middle">
      <text x="22.3" y="18.2" font-size="2.6">ACDC</text>
      <text x="22.3" y="21.6" font-size="2.6">1600W</text>
    </g>
    <path id="qfx10002-jpsu-1600w-ac-afo--handle" d="M 3.9 28.7 V 37.4 Q 3.9 38.0 4.5 38.0 H 40.4 Q 41.0 38.0 41.0 37.4 V 28.7" fill="none" stroke="#f2581a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-stroke-from="handle-finish" data-path="qfx10002-jpsu-1600w-ac-afo/handle" data-class="handle" data-z-out="6.0" />
    <g id="qfx10002-jpsu-1600w-ac-afo--latch" data-path="qfx10002-jpsu-1600w-ac-afo/latch" data-class="latch" data-z-out="1.4" data-z-color="#9a9b9d">
      <rect x="62.6" y="12.2" width="3.8" height="17.9" rx="1.6" fill="#1d1d1d" stroke="#0b0b0b" stroke-width="0.3" />
      <rect x="66.6" y="13.2" width="6.1" height="15.7" fill="#c0c2c4" stroke="#8d8f91" stroke-width="0.3" />
    </g>
    <g id="qfx10002-jpsu-1600w-ac-afo--inlet" data-path="qfx10002-jpsu-1600w-ac-afo/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(41.0,8.2) rotate(270 14.0 10.0)">
      <title>qfx10002-jpsu-1600w-ac-afo--inlet</title>
      <rect id="qfx10002-jpsu-1600w-ac-afo--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="qfx10002-jpsu-1600w-ac-afo/inlet/opening" data-class="cutout" />
      <path id="qfx10002-jpsu-1600w-ac-afo--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="qfx10002-jpsu-1600w-ac-afo--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx10002-jpsu-1600w-ac-afo--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx10002-jpsu-1600w-ac-afo--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="55 18.2" data-cp-dir="rear" />
  </g>
</svg>
