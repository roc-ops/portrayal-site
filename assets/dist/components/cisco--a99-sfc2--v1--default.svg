<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="41.4mm" height="395.7mm" viewBox="0 0 41.4 395.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/a99-sfc2@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/a99-sfc2@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/a99-sfc2@'] .state-red { --led-color: #d0021b; }</style>
  <g id="a99-sfc2" data-path="a99-sfc2" data-class="fabric" data-behaviour="fills" data-ref="cisco/a99-sfc2@1:1.0.0" data-chassis="ASR 9912, ASR 9922" data-fabric-bandwidth="230 Gbps per fabric card" data-generation="2nd" data-model="A99-SFC2" data-power-draw-max-w="165" data-role="switch-fabric" transform="translate(0,0)">
    <title>a99-sfc2</title>
    <rect id="a99-sfc2--plate" x="0" y="18.97" width="41.4" height="358.8" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3" />
    <g id="a99-sfc2--vent-field">
      <rect x="5.5" y="44" width="30.4" height="290" rx="1.2" fill="#3a3e43" stroke="#6d7278" stroke-width="0.3" />
      <path d="M 20.7 45.5 V 332.5" stroke="#6d7278" stroke-width="28" stroke-dasharray="0.7 1.3" />
    </g>
    <g id="a99-sfc2--lever-top">
      <rect x="3" y="2" width="35.4" height="17.5" rx="2.2" fill="#8a8f95" stroke="#6d7278" stroke-width="0.4" />
      <rect x="14" y="13.2" width="13.4" height="3.4" rx="1.2" fill="#44484d" />
    </g>
    <g id="a99-sfc2--lever-bottom">
      <rect x="3" y="377.2" width="35.4" height="17.5" rx="2.2" fill="#8a8f95" stroke="#6d7278" stroke-width="0.4" />
      <rect x="14" y="380.1" width="13.4" height="3.4" rx="1.2" fill="#44484d" />
    </g>
    <g id="a99-sfc2--screw-top">
      <circle cx="20.7" cy="8.2" r="2.4" fill="#b0b4b9" stroke="#7d8288" stroke-width="0.35" />
      <path d="M 19.1 8.2 L 22.3 8.2 M 20.7 6.6 L 20.7 9.8" stroke="#3a3e43" stroke-width="0.4" />
    </g>
    <g id="a99-sfc2--screw-bottom">
      <circle cx="20.7" cy="387.5" r="2.4" fill="#b0b4b9" stroke="#7d8288" stroke-width="0.35" />
      <path d="M 19.1 387.5 L 22.3 387.5 M 20.7 385.9 L 20.7 389.1" stroke="#3a3e43" stroke-width="0.4" />
    </g>
    <rect id="a99-sfc2--logo-zone" x="8" y="22" width="25" height="8" fill="none" data-path="a99-sfc2/logo-zone" data-class="label" />
    <g id="a99-sfc2--silkscreen">
      <rect x="5.6" y="347.4" width="27.5" height="4.2" fill="#e1e100" />
      <text x="19.35" y="350.76" font-family="sans-serif" font-size="3.2" font-weight="bold" text-anchor="middle" fill="#231f20">A99-SFC2</text>
      <text x="34.0" y="357.0" transform="rotate(90 34.0 357.0)" font-family="sans-serif" font-size="2.0" fill="#231f20">STATUS</text>
    </g>
    <circle id="a99-sfc2--status" cx="36.0" cy="355.0" r="1.6" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="a99-sfc2/status" data-class="led" data-states="green amber red off" data-description="the single tri-colour Status LED (Table 9, 'FC Card LED Display Definitions'): green powered on and FPGA programmed; red fault; amber powered on but fabric not active; off powered off via CLI" />
  </g>
</svg>
