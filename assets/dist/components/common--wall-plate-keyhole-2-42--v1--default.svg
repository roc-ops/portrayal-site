    <path id="wall-plate-keyhole-2-42--keyhole-2" fill="#15181b" d="M 32.6 8.9 a 1.4 1.4 0 0 1 2.8 0 V 15.1 a 2.8 2.8 0 1 1 -2.8 0 Z" data-path="wall-plate-keyhole-2-42/keyhole-2" data-class="mechanical" data-z-out="0.2" data-z-color="#15181b" />
    <circle id="wall-plate-keyhole-2-42--screw-1" cx="11.0" cy="3.6" r="1.7" fill="#1f2226" stroke="#6b7177" stroke-width="0.25" data-path="wall-plate-keyhole-2-42/screw-1" data-class="mechanical" data-z-cyl="0.8" data-z-lift="1.5" data-z-color="#1f2226" />
    <circle id="wall-plate-keyhole-2-42--screw-2" cx="31.0" cy="3.6" r="1.7" fill="#1f2226" stroke="#6b7177" stroke-width="0.25" data-path="wall-plate-keyhole-2-42/screw-2" data-class="mechanical" data-z-cyl="0.8" data-z-lift="1.5" data-z-color="#1f2226" />
    <path d="M 10.2 3.6 H 11.8 M 11.0 2.8 V 4.4 M 30.2 3.6 H 31.8 M 31.0 2.8 V 4.4" stroke="#8a9096" stroke-width="0.3" />
