    <rect id="a9k-1600w-ac--latch" x="66.30" y="11.80" width="3.60" height="15.60" rx="1.2" fill="#e9ecef" stroke="#9aa0a6" stroke-width="0.25" data-z-out="4.2" />
    <circle id="a9k-1600w-ac--ok" cx="65.80" cy="4.70" r="1.5" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.3" data-path="a9k-1600w-ac/ok" data-class="led" data-states="green green-blink amber amber-blink off" data-description="the module's OK lamp - Cisco's legend for this chassis, where the ASR 9902 and ASR 9903 modules print STATUS. One per module." data-z-dome="0.3" />
    <g id="a9k-1600w-ac--inlet" data-path="a9k-1600w-ac/inlet" data-class="inlet" data-ref="std/saf-d-grid@1:1.1.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(38.13,6.51) rotate(90 13.4 9.95)">
