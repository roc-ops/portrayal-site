<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="43.9mm" height="41.1mm" viewBox="0 0 43.9 41.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/fan-t2@'] .state-fault { --led-color: #f59e0b; }
    g[data-ref^='cisco/fan-t2@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-t2" data-path="fan-t2" data-class="fan" data-behaviour="fills" data-ref="cisco/fan-t2@1:1.0.0" data-wall="#15171a" data-airflow="front-to-back" data-airflow-cfm="20" data-fans="1" data-model="FAN-T2" data-power-absent="not-published" data-voltage="12 V" data-states="absent" transform="translate(0,0)">
    <title>fan-t2</title>
    <defs>
      <pattern id="fan-t2--t2-mesh" width="6.6" height="3.82" patternUnits="userSpaceOnUse">
        <path d="M 1.9 0 L 0.95 1.65 L -0.95 1.65 L -1.9 0 L -0.95 -1.65 L 0.95 -1.65 Z" fill="#e4e7ea" />
        <path d="M 8.5 0 L 7.55 1.65 L 5.65 1.65 L 4.7 0 L 5.65 -1.65 L 7.55 -1.65 Z" fill="#e4e7ea" />
        <path d="M 5.2 1.91 L 4.25 3.56 L 2.35 3.56 L 1.4 1.91 L 2.35 0.26 L 4.25 0.26 Z" fill="#e4e7ea" />
        <path d="M 1.9 3.82 L 0.95 5.47 L -0.95 5.47 L -1.9 3.82 L -0.95 2.17 L 0.95 2.17 Z" fill="#e4e7ea" />
        <path d="M 8.5 3.82 L 7.55 5.47 L 5.65 5.47 L 4.7 3.82 L 5.65 2.17 L 7.55 2.17 Z" fill="#e4e7ea" />
      </pattern>
    </defs>
    <rect id="fan-t2--body" x="0" y="0" width="43.9" height="41.1" rx="0.6" fill="#2a2c30" stroke="#0d0f11" stroke-width="0.4" />
    <g id="fan-t2--fan" data-path="fan-t2/fan" data-class="rotor" data-z-vent="24">
      <rect id="fan-t2--fan-back" x="2.0" y="2.0" width="39.9" height="37.1" rx="2.0" fill="#15171a" />
      <circle id="fan-t2--fan-hub" cx="21.95" cy="20.55" r="16.5" fill="#15171a" />
      <circle id="fan-t2--fan-grille" cx="21.95" cy="20.55" r="16.5" fill="url(#fan-t2--t2-mesh)" opacity="0.9" />
    </g>
    <rect id="fan-t2--handle" x="0.0" y="15.0" width="43.9" height="11.1" rx="3.5" fill="#202225" stroke="#4a4d51" stroke-width="0.3" data-path="fan-t2/handle" data-class="handle" />
    <circle id="fan-t2--fan-led" cx="4.3" cy="4.3" r="1.3" fill="var(--led-color, #4a4d51)" stroke="#9aa1a8" stroke-width="0.2" data-path="fan-t2/fan-led" data-class="led" data-states="off ok fault" />
  </g>
</svg>
