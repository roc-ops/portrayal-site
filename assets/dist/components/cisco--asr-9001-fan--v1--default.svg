<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.76mm" height="88.19mm" viewBox="0 0 54.76 88.19">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/asr-9001-fan@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/asr-9001-fan@'] .state-red { --led-color: #d0021b; }
    g[data-ref^='cisco/asr-9001-fan@'] .state-yellow { --led-color: #f5c518; }</style>
  <g id="asr-9001-fan" data-path="asr-9001-fan" data-class="fan" data-behaviour="fills" data-ref="cisco/asr-9001-fan@1:1.1.1" data-wall="#4a4f55" data-eol="none-announced" data-fans="14 fans" data-model="ASR-9001-FAN" data-power-absent="not-published" data-role="fan-module" transform="translate(0,0)">
    <title>asr-9001-fan</title>
    <rect id="asr-9001-fan--plate" x="0" y="0" width="54.76" height="88.19" rx="1.0" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.35" />
    <rect id="asr-9001-fan--vent" x="31.44" y="24.41" width="7.86" height="38.32" rx="3.9" fill="#262626" data-z-vent="26" />
    <g id="asr-9001-fan--screw-t" data-z-cyl="1.6">
      <circle cx="7.94" cy="12.53" r="2.6" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="7.94" cy="12.53" r="1.2" fill="#6d7379" />
    </g>
    <g id="asr-9001-fan--screw-b" data-z-cyl="1.6">
      <circle cx="7.94" cy="79.45" r="2.6" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="7.94" cy="79.45" r="1.2" fill="#6d7379" />
    </g>
    <circle id="asr-9001-fan--status" cx="9.58" cy="43.7" r="1.5" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="asr-9001-fan/status" data-class="led" data-states="green yellow red off" data-description="the fan tray's Run/Fail status LED, one per tray." data-z-dome="0.3" />
    <g id="asr-9001-fan--silkscreen">
      <text x="12.28" y="44.39" font-family="sans-serif" font-size="2.8" font-weight="bold" fill="#231f20">STATUS</text>
      <text x="17.87" y="84.29" font-family="sans-serif" font-size="3.0" font-weight="bold" fill="#231f20">ASR-9001 FAN</text>
    </g>
  </g>
</svg>
