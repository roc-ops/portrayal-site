      </g>
      <g data-cp="mate" data-cp-at="3.175 3.175" data-cp-dir="front" />
    </g>
    <g id="core-lte-modem--wwan1" data-path="core-lte-modem/wwan1" data-class="port" data-ref="std/sma@1:1.1.0" data-media="coax-sma" transform="translate(101.1,7.1)" data-group="antennas" data-group-role="traffic" data-description="the two WWAN antenna jacks of the module plate, printed WWAN2 and WWAN1">
      <title>core-lte-modem--wwan1</title>
      <circle id="core-lte-modem--wwan1--opening" cx="3.175" cy="3.175" r="3.175" fill="#8a7118" data-path="core-lte-modem/wwan1/opening" data-class="cutout" />
      <g id="core-lte-modem--wwan1--barrel" data-z-cyl="5.0" data-z-color="#c9a227" data-z-thread="0.706">
