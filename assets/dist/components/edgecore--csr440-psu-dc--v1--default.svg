      <rect x="2.00" y="7.00" width="44.00" height="30.50" fill="url(#csr440-psu-dc--csr440-dc-grid)" />
    </g>
    <g id="csr440-psu-dc--ground-stud" data-path="csr440-psu-dc/ground-stud" data-class="terminal" data-z-out="3.0">
      <rect x="6.00" y="24.00" width="15.00" height="8.00" rx="0.5" fill="#9f9f9e" stroke="#858584" stroke-width="0.3" />
      <circle cx="12.70" cy="28.00" r="2.40" fill="#b8b8b7" stroke="#858584" stroke-width="0.3" />
      <circle cx="12.70" cy="28.00" r="1.10" fill="#858584" />
    </g>
    <g id="csr440-psu-dc--terminal" data-path="csr440-psu-dc/terminal" data-class="terminal" data-z-out="9.5">
