      </pattern>
    </defs>
    <rect id="csr440-psu-dc--body" x="0" y="0" width="53.8" height="39.4" rx="0.5" fill="#525252" stroke="#9a9fa4" stroke-width="0.45" />
    <rect x="0.8" y="0.8" width="52.2" height="37.8" rx="0.35" fill="none" stroke="#6c7075" stroke-width="0.22" />
