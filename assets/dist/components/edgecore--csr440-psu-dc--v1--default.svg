        <circle cx="4.05" cy="4.05" r="3.2" fill="none" stroke="#8d9298" stroke-width="0.2" />
      </g>
      <circle id="csr440-psu-dc--earth--stud" cx="4.05" cy="4.05" r="2.0" fill="#9aa0a6" stroke="#5d6268" stroke-width="0.2" data-z-cyl="6.0" data-z-color="#9aa0a6" />
      <g data-cp="mate" data-cp-at="4.05 4.05" data-cp-dir="front" data-cp-on="csr440-psu-dc--earth--stud" />
