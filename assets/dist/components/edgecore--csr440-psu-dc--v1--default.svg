    <g id="csr440-psu-dc--earth" data-path="csr440-psu-dc/earth" data-class="ground" data-behaviour="mounts" data-ref="common/ground-stud@1:1.0.1" transform="translate(8.65,23.95)" data-z-lift="3.0">
