      <rect id="csr440-psu-dc--pole-1" x="30.00" y="19.50" width="4.40" height="9.00" rx="0.4" fill="#3a3d40" stroke="#5f6468" stroke-width="0.25" />
      <rect id="csr440-psu-dc--pole-2" x="39.50" y="19.50" width="4.40" height="9.00" rx="0.4" fill="#3a3d40" stroke="#5f6468" stroke-width="0.25" />
    </g>
    <g id="csr440-psu-dc--handle" data-path="csr440-psu-dc/handle" data-class="handle" data-z-uhandle="27.0" data-z-dia="5.0">
      <rect x="47.60" y="4.00" width="4.40" height="24.00" rx="2.20" fill="none" stroke="#474747" stroke-width="2.40" />
      <rect x="47.60" y="4.00" width="4.40" height="24.00" rx="2.20" fill="none" stroke="#8a8a8a" stroke-width="0.35" />
    </g>
    <g id="csr440-psu-dc--latch" data-path="csr440-psu-dc/latch" data-class="latch" data-z-out="2.5">
      <rect x="4.50" y="1.60" width="10.50" height="4.60" rx="0.8" fill="#6f585b" stroke="#4e3b3d" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" />
      <path d="M 8.80 2.40 V 5.40 M 10.60 2.40 V 5.40 M 12.40 2.40 V 5.40" stroke="#4e3b3d" stroke-width="0.35" fill="none" />
    </g>
    <g id="csr440-psu-dc--pole-batt" data-path="csr440-psu-dc/pole-batt" data-class="screw" data-ref="common/terminal-screw-34@1:1.0.1" transform="translate(30.5,22.3)" data-z-lift="9.5">
      <title>csr440-psu-dc--pole-batt</title>
      <circle id="csr440-psu-dc--pole-batt--head" cx="1.7" cy="1.7" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" data-z-cyl="1.2" data-z-color="#c3c9cf" />
      <path id="csr440-psu-dc--pole-batt--slot" d="M 0.35 1.7 H 3.05 M 1.7 0.35 V 3.05" fill="none" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round" />
      <g data-cp="mate" data-cp-at="1.7 1.7" data-cp-dir="front" data-cp-on="csr440-psu-dc--pole-batt--head" />
    </g>
    <g id="csr440-psu-dc--pole-rtn" data-path="csr440-psu-dc/pole-rtn" data-class="screw" data-ref="common/terminal-screw-34@1:1.0.1" transform="translate(40.0,22.3)" data-z-lift="9.5">
      <title>csr440-psu-dc--pole-rtn</title>
      <circle id="csr440-psu-dc--pole-rtn--head" cx="1.7" cy="1.7" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" data-z-cyl="1.2" data-z-color="#c3c9cf" />
      <path id="csr440-psu-dc--pole-rtn--slot" d="M 0.35 1.7 H 3.05 M 1.7 0.35 V 3.05" fill="none" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round" />
      <g data-cp="mate" data-cp-at="1.7 1.7" data-cp-dir="front" data-cp-on="csr440-psu-dc--pole-rtn--head" />
