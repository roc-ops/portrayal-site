      <path d="M 53.0 15.0 V 21.0" stroke="#e8eaec" stroke-width="0.8" />
      <circle cx="53.0" cy="28.0" r="1.5" fill="none" stroke="#e8eaec" stroke-width="0.6" />
    </g>
    <g id="ex9214-pwr-mx960-4100-ac--inlet" data-path="ex9214-pwr-mx960-4100-ac/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-function="AC-1 inlet" data-input="ac" data-media="ac" transform="translate(4.3,12.55)">
      <title>ex9214-pwr-mx960-4100-ac--inlet</title>
