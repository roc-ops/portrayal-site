      <text x="14.0" y="74.2" font-family="sans-serif" font-size="1.5" fill="#222" text-anchor="start">AC-2 OK</text>
      <text x="14.0" y="80.3" font-family="sans-serif" font-size="1.5" fill="#222" text-anchor="start">DC OK</text>
      <text x="14.0" y="85.7" font-family="sans-serif" font-size="1.5" fill="#222" text-anchor="start">PS FAIL</text>
      <text x="53.75" y="65.0" font-family="sans-serif" font-size="2.0" fill="#222" text-anchor="middle">UP</text>
    </g>
    <g id="ex9214-pwr-mx960-4100-ac--handle" data-path="ex9214-pwr-mx960-4100-ac/handle" data-class="latch" data-z-out="2.4" data-z-color="#9aa0a6">
      <rect x="46.6" y="135.0" width="10.2" height="111.0" rx="5.1" fill="#9aa0a6" stroke="#6d7378" stroke-width="0.5" />
    </g>
    <g id="ex9214-pwr-mx960-4100-ac--switch" data-path="ex9214-pwr-mx960-4100-ac/switch" data-class="switch" data-z-out="2.4" data-z-color="#26292d">
