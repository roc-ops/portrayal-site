      <rect id="ex9214-pwr-mx960-4100-ac--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="ex9214-pwr-mx960-4100-ac--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex9214-pwr-mx960-4100-ac--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex9214-pwr-mx960-4100-ac--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
