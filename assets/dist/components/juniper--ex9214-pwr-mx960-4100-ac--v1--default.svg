<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="368.3mm" viewBox="0 0 101.6 368.3">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex9214-pwr-mx960-4100-ac@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='juniper/ex9214-pwr-mx960-4100-ac@'] .state-red { --led-color: #d0021b; }</style>
  <g id="ex9214-pwr-mx960-4100-ac" data-path="ex9214-pwr-mx960-4100-ac" data-class="psu" data-behaviour="fills" data-ref="juniper/ex9214-pwr-mx960-4100-ac@1:1.0.0" data-input-voltage="200-240 VAC" data-power-output-one-feed-w="1700" data-power-output-w="4100" data-redundancy="1+1 per zone" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex9214-pwr-mx960-4100-ac</title>
    <rect id="ex9214-pwr-mx960-4100-ac--face" x="0" y="0" width="101.6" height="368.3" rx="1.0" fill="#b4bbbc" stroke="#8a8f94" stroke-width="0.4" />
    <rect x="0" y="0" width="101.6" height="3.0" fill="#9aa1a3" />
    <rect x="46.6" y="46.0" width="14.3" height="20.0" fill="#f2f3f4" stroke="#8a8f94" stroke-width="0.2" />
    <path d="M 53.75 49.0 L 58.5 54.5 H 55.5 V 62.0 H 52.0 V 54.5 H 49.0 Z" fill="none" stroke="#333" stroke-width="0.4" />
    <rect x="4.5" y="63.0" width="26.0" height="25.0" fill="#f2f3f4" stroke="#8a8f94" stroke-width="0.2" />
    <g id="ex9214-pwr-mx960-4100-ac--lamps">
      <circle id="ex9214-pwr-mx960-4100-ac--led-ac1-ok" cx="10.8" cy="67.3" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25" data-path="ex9214-pwr-mx960-4100-ac/led-ac1-ok" data-class="led" data-states="green off" />
      <circle id="ex9214-pwr-mx960-4100-ac--led-ac2-ok" cx="10.8" cy="73.5" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25" data-path="ex9214-pwr-mx960-4100-ac/led-ac2-ok" data-class="led" data-states="green off" />
      <circle id="ex9214-pwr-mx960-4100-ac--led-dc-ok" cx="10.8" cy="79.6" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25" data-path="ex9214-pwr-mx960-4100-ac/led-dc-ok" data-class="led" data-states="green off" />
      <circle id="ex9214-pwr-mx960-4100-ac--led-ps-fail" cx="10.8" cy="85.0" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25" data-path="ex9214-pwr-mx960-4100-ac/led-ps-fail" data-class="led" data-states="red off" />
    </g>
    <rect x="4.3" y="90.0" width="10.0" height="31.0" rx="3.0" fill="#aeb4b6" stroke="#8a8f94" stroke-width="0.4" />
    <ellipse cx="9.3" cy="100.0" rx="2.6" ry="4.0" fill="#8f979a" />
    <g id="ex9214-pwr-mx960-4100-ac--screws">
      <circle cx="7.0" cy="340.0" r="1.4" fill="#8a9096" stroke="#5a5f64" stroke-width="0.3" />
      <circle cx="94.6" cy="340.0" r="1.4" fill="#8a9096" stroke="#5a5f64" stroke-width="0.3" />
      <circle cx="50.0" cy="351.0" r="1.4" fill="#8a9096" stroke="#5a5f64" stroke-width="0.3" />
    </g>
    <g id="ex9214-pwr-mx960-4100-ac--silkscreen">
