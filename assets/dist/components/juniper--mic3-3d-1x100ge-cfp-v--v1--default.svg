<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="27.0mm" height="168.0mm" viewBox="0 0 27.0 168.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mic3-3d-1x100ge-cfp-v" data-path="mic3-3d-1x100ge-cfp-v" data-class="line-card" data-behaviour="fills" data-ref="juniper/mic3-3d-1x100ge-cfp-v@1:1.1.2" data-model="MIC3-3D-1X100GE-CFP" data-power-draw-max-w="40" data-states="ok fail absent" transform="translate(0,0)">
    <title>mic3-3d-1x100ge-cfp-v</title>
    <rect id="mic3-3d-1x100ge-cfp-v--face" x="0" y="0" width="27.0" height="168.0" rx="0.6" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.4" />
    <g id="mic3-3d-1x100ge-cfp-v--lamps">
      <circle id="mic3-3d-1x100ge-cfp-v--led-ok-fail" cx="5.0" cy="5.0" r="0.8" fill="var(--led-color, #3a3f44)" stroke="#33373c" stroke-width="0.25" />
    </g>
    <g id="mic3-3d-1x100ge-cfp-v--silkscreen">
      <g id="mic3-3d-1x100ge-cfp-v--t1114-silkscreen">
        <text x="7.60" y="5.70" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="start">OK</text>
      </g>
      <g id="mic3-3d-1x100ge-cfp-v--t1115-silkscreen">
        <text x="13.50" y="160.00" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="middle" transform="rotate(-90 13.50 160.00)">MIC3-3D-1X100GE-CFP</text>
      </g>
    </g>
    <g id="mic3-3d-1x100ge-cfp-v--port-0-0" data-path="mic3-3d-1x100ge-cfp-v/port-0-0" data-class="port" data-ref="std/cfp@2:2.0.0" data-depth="126.15" data-wall="#aab0b7" data-cavity="cavity" data-media="cfp" transform="translate(-27.9,46.4) rotate(90 41.4 7.4)">
      <title>mic3-3d-1x100ge-cfp-v--port-0-0</title>
      <rect id="mic3-3d-1x100ge-cfp-v--port-0-0--opening" x="0" y="0" width="82.8" height="14.8" rx="0.5" fill="#17191c" data-path="mic3-3d-1x100ge-cfp-v/port-0-0/opening" data-class="cutout" />
      <rect id="mic3-3d-1x100ge-cfp-v--port-0-0--cavity" x="2.8" y="0.6" width="77.2" height="13.6" rx="0.6" fill="#0a0c0e" />
      <rect id="mic3-3d-1x100ge-cfp-v--port-0-0--module-slot" x="4.0" y="5.9" width="74.8" height="3.0" rx="0.4" fill="#000000" />
      <path id="mic3-3d-1x100ge-cfp-v--port-0-0--collar" fill-rule="evenodd" fill="#9aa0a8" d="M 0.05 0.05 h 82.7 v 14.7 h -82.7 z M 0.6 0.6 h 81.6 v 13.6 h -81.6 z" data-z-out="1.0" data-z-color="#7d848c" />
      <g data-cp="mate" data-cp-at="41.4 7.4" data-cp-dir="front" />
    </g>
  </g>
</svg>
