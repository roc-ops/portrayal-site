      <rect id="rear-io-board-dlc-16g--idrac--led-b" x="9.5" y="9.63" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)" data-path="rear-io-board-dlc-16g/idrac/led-b" data-class="led" data-states="off activity" data-z-out="0.3" data-z-color="#0d0f11" />
