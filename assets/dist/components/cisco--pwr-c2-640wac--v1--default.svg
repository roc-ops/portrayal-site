<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="95.25mm" height="40.13mm" viewBox="0 0 95.25 40.13">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/pwr-c2-640wac@'] .state-fault { --led-color: #ef4444; }
    g[data-ref^='cisco/pwr-c2-640wac@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="pwr-c2-640wac" data-path="pwr-c2-640wac" data-class="psu" data-behaviour="fills" data-ref="cisco/pwr-c2-640wac@1:1.0.0" data-airflow="front-to-back" data-inlet="c14" data-input="ac" data-input-current-max="8 to 4 A" data-input-frequency="50 to 60 Hz" data-input-voltage="100 to 240 VAC, autoranging" data-model="PWR-C2-640WAC" data-output="+12 V at 20.83 A and -54 V at 7.36 A" data-power-output-w="640" data-weight-kg="1.41" data-states="absent" transform="translate(0,0)">
    <title>pwr-c2-640wac</title>
    <defs>
      <pattern id="pwr-c2-640wac--c2-mesh" width="3.4" height="2.0" patternUnits="userSpaceOnUse">
        <path d="M 0.5 0 L 1.1 0.5 L 1.1 1.0 L 0.5 1.5 L -0.1 1.0 L -0.1 0.5 Z" fill="#2b2e31" />
        <path d="M 2.2 1.0 L 2.8 1.5 L 2.8 2.0 L 2.2 2.5 L 1.6 2.0 L 1.6 1.5 Z" fill="#2b2e31" />
      </pattern>
    </defs>
    <rect id="pwr-c2-640wac--body" x="0" y="0" width="95.25" height="40.13" rx="0.5" fill="#c4c7ca" stroke="#7a8087" stroke-width="0.4" />
    <g id="pwr-c2-640wac--vent">
      <rect id="pwr-c2-640wac--vent-left" x="2.0" y="11.5" width="37.0" height="22.0" fill="url(#pwr-c2-640wac--c2-mesh)" />
      <rect id="pwr-c2-640wac--vent-right" x="72.5" y="4.0" width="19.5" height="9.0" fill="url(#pwr-c2-640wac--c2-mesh)" />
      <rect id="pwr-c2-640wac--vent-lower-right" x="48.0" y="32.0" width="40.0" height="6.0" fill="url(#pwr-c2-640wac--c2-mesh)" />
    </g>
    <circle id="pwr-c2-640wac--ac-ok" cx="9.6" cy="8.2" r="1.2" fill="var(--led-color, #2b2e31)" stroke="#7a8087" stroke-width="0.2" data-path="pwr-c2-640wac/ac-ok" data-class="led" data-states="off ok" />
    <circle id="pwr-c2-640wac--ps-ok" cx="22.6" cy="8.2" r="1.2" fill="var(--led-color, #2b2e31)" stroke="#7a8087" stroke-width="0.2" data-path="pwr-c2-640wac/ps-ok" data-class="led" data-states="off ok fault" />
    <g id="pwr-c2-640wac--retainer" data-path="pwr-c2-640wac/retainer" data-class="handle">
      <rect x="3.0" y="34.4" width="42.0" height="4.6" rx="1.0" fill="#8d949b" stroke="#5c6167" stroke-width="0.3" />
      <rect x="12.0" y="33.0" width="8.0" height="3.6" rx="0.8" fill="#6d7379" />
      <rect x="30.0" y="33.0" width="8.0" height="3.6" rx="0.8" fill="#6d7379" />
    </g>
    <g id="pwr-c2-640wac--latch" data-path="pwr-c2-640wac/latch" data-class="handle">
      <rect x="75.0" y="15.0" width="9.0" height="12.0" rx="1.0" fill="#e0e2e4" stroke="#5c6167" stroke-width="0.3" />
      <path d="M 79.0 16.5 V 25.5 M 80.4 16.5 V 25.5 M 81.8 16.5 V 25.5" stroke="#8d949b" stroke-width="0.35" />
    </g>
    <g id="pwr-c2-640wac--silkscreen" font-family="sans-serif" fill="#2b2e31">
      <text id="pwr-c2-640wac--silk-ac-ok" x="9.6" y="5.4" font-size="1.3" text-anchor="middle">AC OK</text>
      <text id="pwr-c2-640wac--silk-ps-ok" x="22.6" y="5.4" font-size="1.3" text-anchor="middle">PS OK</text>
      <text id="pwr-c2-640wac--silk-model" x="75.0" y="3.2" font-size="1.5" text-anchor="middle">PWR-C2-640WAC</text>
    </g>
    <g id="pwr-c2-640wac--inlet" data-path="pwr-c2-640wac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(42.0,10.5)">
      <title>pwr-c2-640wac--inlet</title>
      <rect id="pwr-c2-640wac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="pwr-c2-640wac/inlet/opening" data-class="cutout" />
      <path id="pwr-c2-640wac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="pwr-c2-640wac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="pwr-c2-640wac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="pwr-c2-640wac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
