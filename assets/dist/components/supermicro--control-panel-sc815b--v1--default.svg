<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64.5mm" height="13.1mm" viewBox="0 0 64.5 13.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='supermicro/control-panel-sc815b@'] .state-activity { --led-color: #eab308; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-activity { animation: portrayal-blink 0.25s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-bmc-reset { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-bmc-reset { animation: portrayal-blink 0.5s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-checking { --led-color: #22c55e; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-checking { animation: portrayal-blink 0.25s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-fan-fail { --led-color: #ef4444; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-fan-fail { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-identify { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-on { --led-color: #22c55e; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-overheat { --led-color: #ef4444; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-power-fail { --led-color: #ef4444; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-power-fail { animation: portrayal-blink 4s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-uid-local { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-uid-remote { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc815b@'] .state-uid-remote { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="control-panel-sc815b" data-path="control-panel-sc815b" data-class="control-panel" data-ref="supermicro/control-panel-sc815b@1:1.0.0" transform="translate(0,0)">
    <title>control-panel-sc815b</title>
    <rect id="control-panel-sc815b--plate" x="0.15" y="0.15" width="64.2" height="12.8" rx="0.8" fill="#131415" stroke="#3c4146" stroke-width="0.3" />
    <circle id="control-panel-sc815b--lamp-info" cx="11.2" cy="10.9" r="1.3" fill="var(--led-color, #3a3d36)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc815b/lamp-info" data-class="led" data-states="off overheat fan-fail power-fail uid-local uid-remote bmc-reset" data-description="Information LED. Solid red - overheat; red 1 Hz - fan failure; red 0.25 Hz - power failure; solid blue - UID activated locally; blue 1 Hz - UID activated from the BMC; blue 2 Hz - BMC resetting. Also red solid with the power LED blinking green - fault; blue and red at 10 Hz - recovery mode; blue 4 Hz - BMC setting factory defaults; blue 10 Hz with the power LED blinking green - BMC or BIOS firmware updating." />
    <circle id="control-panel-sc815b--lamp-lan2" cx="16.6" cy="10.9" r="1.3" fill="var(--led-color, #3a3d36)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc815b/lamp-lan2" data-class="led" data-states="off activity" data-description="LAN2 LED. Flashing - network activity on LAN port 2. The rate is not stated; drawn at 4 Hz, green as photographed." />
    <circle id="control-panel-sc815b--lamp-lan1" cx="22.8" cy="10.9" r="1.3" fill="var(--led-color, #3a3d36)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc815b/lamp-lan1" data-class="led" data-states="off activity" data-description="LAN1 LED. Flashing - network activity on LAN port 1. The rate is not stated; drawn at 4 Hz, green as photographed." />
    <circle id="control-panel-sc815b--lamp-drive" cx="28.8" cy="10.9" r="1.3" fill="var(--led-color, #3a3d36)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc815b/lamp-drive" data-class="led" data-states="off activity" data-description="Drive LED. Flashing - activity on the storage drives. The rate is not stated; drawn at 4 Hz, yellow as photographed." />
    <circle id="control-panel-sc815b--lamp-power" cx="34.8" cy="10.9" r="1.3" fill="var(--led-color, #3a3d36)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc815b/lamp-power" data-class="led" data-states="off on checking" data-description="Power LED. Steady on - power on; blinking at 4 Hz - checking BIOS/BMC integrity. Also 4 Hz with the information LED blue - BIOS firmware updating; two blinks and a pause - BMC firmware updating; 1 Hz with the information LED red - fault detected." />
    <g id="control-panel-sc815b--btn-uid" data-path="control-panel-sc815b/btn-uid" data-class="button" data-description="UID LED button. Turns the blue UID indicators on at the front and the rear; also resets the BMC (manual section 7.8).">
      <circle cx="4.6" cy="10.4" r="1.7" fill="#2b2e31" stroke="#7d848b" stroke-width="0.3" />
      <circle id="control-panel-sc815b--lamp-uid" cx="4.6" cy="10.4" r="0.8" fill="var(--led-color, #4a4e53)" data-path="control-panel-sc815b/lamp-uid" data-class="led" data-states="off identify" data-description="the UID lamp in the button. Blue when the unit identifier is activated." />
    </g>
    <circle id="control-panel-sc815b--btn-reset" cx="43.4" cy="6.4" r="2.5" fill="#7a2f3a" stroke="#4d1c23" stroke-width="0.3" data-path="control-panel-sc815b/btn-reset" data-class="button" data-description="Reset button. Reboots the system." />
    <circle id="control-panel-sc815b--btn-power" cx="51.9" cy="6.9" r="3.2" fill="#8f3a3f" stroke="#5c2327" stroke-width="0.3" data-path="control-panel-sc815b/btn-power" data-class="button" data-description="Power button. Applies or removes primary power, standby power stays; hold four seconds to force a shutdown." />
    <g id="control-panel-sc815b--silkscreen" fill="none" stroke="#c9ced3" stroke-width="0.25" font-family="sans-serif">
      <text x="4.6" y="7.4" font-size="2.4" text-anchor="middle" fill="#c9ced3" stroke="none">UID</text>
      <text x="11.2" y="7.6" font-size="2.8" font-style="italic" font-weight="bold" text-anchor="middle" fill="#c9ced3" stroke="none">i</text>
      <path d="M15.2 7.6 H18.0 L16.6 5.2 Z" />
      <text x="18.7" y="6.0" font-size="1.4" text-anchor="middle" fill="#c9ced3" stroke="none">2</text>
      <path d="M21.4 7.6 H24.2 L22.8 5.2 Z" />
      <text x="24.9" y="6.0" font-size="1.4" text-anchor="middle" fill="#c9ced3" stroke="none">1</text>
      <path d="M27.8 5.4 H29.8 V7.6 H27.8 Z M27.8 5.4 A1.0 0.4 0 0 1 29.8 5.4" />
      <path d="M34.8 5.0 A0.9 0.9 0 0 1 35.3 6.7 V7.6 H34.3 V6.7 A0.9 0.9 0 0 1 34.8 5.0 Z" />
      <text x="43.4" y="12.6" font-size="1.6" text-anchor="middle" fill="#c9ced3" stroke="none">RESET</text>
    </g>
  </g>
</svg>
