<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.2mm" height="39.8mm" viewBox="0 0 73.2 39.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="psu-322-ac" data-path="psu-322-ac" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-322-ac@1:1.0.0" data-airflow="exhaust" data-input="ac" data-model="PSU-322-AECR-NN" data-power-output-w="3200" transform="translate(0,0)">
    <title>psu-322-ac</title>
    <rect id="psu-322-ac--body" x="0" y="0" width="73.2" height="39.8" rx="0.6" fill="#1c1f22" stroke="#0d0f11" stroke-width="0.4" />
    <g id="psu-322-ac--fan-frame">
      <rect x="0.4" y="0.3" width="38.4" height="39.2" rx="1.2" fill="#0b0d0f" stroke="#c9ced4" stroke-width="0.9" />
      <g stroke="#c9ced4" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M 5.4 6.0 L 14.8 14.8" />
        <path d="M 34.2 6.0 L 24.8 14.8" />
        <path d="M 5.4 34.6 L 14.8 26.0" />
        <path d="M 34.2 34.6 L 24.8 26.0" />
      </g>
    </g>
    <g id="psu-322-ac--rotor-grille">
      <circle cx="20.8" cy="20.5" r="14.4" fill="#17191c" stroke="#2b2f33" stroke-width="0.4" />
    </g>
    <g id="psu-322-ac--rotor-bulge">
      <circle cx="20.8" cy="20.5" r="6.6" fill="#101315" stroke="#2b2f33" stroke-width="0.3" />
    </g>
    <g id="psu-322-ac--captive-screws">
      <circle cx="5.3" cy="3.5" r="2.9" fill="#b9bec4" stroke="#7d8288" stroke-width="0.25" />
      <circle cx="34.8" cy="3.5" r="2.9" fill="#b9bec4" stroke="#7d8288" stroke-width="0.25" />
      <g stroke="#2b2f33" stroke-width="0.85" stroke-linecap="round">
        <path d="M 5.3 1.5 L 5.3 5.5" />
        <path d="M 3.3 3.5 L 7.3 3.5" />
        <path d="M 34.8 1.5 L 34.8 5.5" />
        <path d="M 32.8 3.5 L 36.8 3.5" />
      </g>
    </g>
    <rect id="psu-322-ac--edge-strip" x="66.4" y="0.6" width="6.2" height="38.6" rx="0.5" fill="#c9ced4" />
    <rect id="psu-322-ac--inlet-bracket" x="40.2" y="36.9" width="26.4" height="2.3" rx="0.4" fill="#c9ced4" />
    <rect id="psu-322-ac--latch" x="67.2" y="12.3" width="4.5" height="17.9" rx="1.2" fill="#c8102e" stroke="#8f0b21" stroke-width="0.3" data-path="psu-322-ac/latch" data-class="latch" />
    <circle id="psu-322-ac--status-led" cx="70.25" cy="8.35" r="1.2" fill="var(--led-color, #3a3f44)" stroke="#8d9297" stroke-width="0.2" data-path="psu-322-ac/status-led" data-class="led" data-description="the supply's single status lamp, above the release latch. The datasheet tables no LED vocabulary for this SKU and there is no hardware installation guide for the S9620 family, so it carries no states - see the device's psu-led-states gap." />
    <g id="psu-322-ac--inlet" data-path="psu-322-ac/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.3.0" data-depth="15.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(37.6,7.25) rotate(270 16.2 12.2)">
      <title>psu-322-ac--inlet</title>
      <rect id="psu-322-ac--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="psu-322-ac/inlet/opening" data-class="cutout" />
      <rect id="psu-322-ac--inlet--inlet-face" x="2.7" y="2.7" width="27.0" height="19.0" rx="3" fill="#0d0f11" />
      <rect id="psu-322-ac--inlet--pin-earth" x="14.8" y="5.8" width="2.8" height="5.4" rx="0.3" fill="#7a8087" data-z-top="14.2" data-z-color="#c0c5cb" />
      <rect id="psu-322-ac--inlet--pin-line" x="7.6" y="12.4" width="2.8" height="5.4" rx="0.3" fill="#7a8087" data-z-top="14.2" data-z-color="#c0c5cb" />
      <rect id="psu-322-ac--inlet--pin-neutral" x="22.0" y="12.4" width="2.8" height="5.4" rx="0.3" fill="#7a8087" data-z-top="14.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
