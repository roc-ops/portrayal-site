    </g>
    <rect id="psu-ac-1300--body" x="8" y="0.8" width="48.2" height="38.4" rx="0.8" fill="#b9bec4" stroke="#7a8087" stroke-width="0.4" />
    <rect id="psu-ac-1300--vent-field" x="9" y="1.8" width="46.2" height="36.4" fill="url(#psu-ac-1300--mesh1300b)" data-z-vent="30" />
    <g id="psu-ac-1300--handle" data-path="psu-ac-1300/handle" data-class="handle">
