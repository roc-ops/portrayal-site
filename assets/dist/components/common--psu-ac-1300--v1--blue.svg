    <path id="psu-ac-1300--inlet-frame" fill-rule="evenodd" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.35" d="     M 24.8 8.8 h 31.4 a 1.0 1.0 0 0 1 1.0 1.0 v 22.4 a 1.0 1.0 0 0 1 -1.0 1.0 h -31.4 a 1.0 1.0 0 0 1 -1.0 -1.0 v -22.4 a 1.0 1.0 0 0 1 1.0 -1.0 z     M 26 10 h 28 v 20 h -28 z" data-z-out="3.4" />
    <path id="psu-ac-1300--face-frame" fill-rule="evenodd" fill="#b9bec4" stroke="#7a8087" stroke-width="0.3" d="M 8.8 0.8 h 46.6 a 0.8 0.8 0 0 1 0.8 0.8 v 36.8 a 0.8 0.8 0 0 1 -0.8 0.8 h -46.6        a 0.8 0.8 0 0 1 -0.8 -0.8 v -36.8 a 0.8 0.8 0 0 1 0.8 -0.8 z        M 9 1.8 h 46.2 v 36.4 h -46.2 z" data-z-out="1.6" />
    <g id="psu-ac-1300--inlet" data-path="psu-ac-1300/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(26.0,10.0)">
