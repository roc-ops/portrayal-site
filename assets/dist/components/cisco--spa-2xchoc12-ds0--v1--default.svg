      <text x="11.45" y="157.8" transform="rotate(90 11.45 157.8)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">STATUS</text>
      <text x="3.73" y="139.01" transform="rotate(90 3.73 139.01)" font-family="sans-serif" font-size="1.7" font-weight="bold" fill="#231f20">SPA-2XCHOC12/DS0</text>
    </g>
    <rect id="spa-2xchoc12-ds0--led-car-p0" x="19.26" y="93.98" width="2.2" height="1.4" rx="0.3" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.15" data-path="spa-2xchoc12-ds0/led-car-p0" data-class="led" data-states="green amber off" data-description="the port's CAR (Carrier/Alarm) lamp. Table 11 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, and there is a valid SONET signal without any alarms; amber on - port is enabled by software, and there is at least one alarm." data-z-dome="0.3" />
    <rect id="spa-2xchoc12-ds0--led-act-p0" x="23.78" y="93.98" width="2.2" height="1.4" rx="0.3" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.15" data-path="spa-2xchoc12-ds0/led-act-p0" data-class="led" data-states="green amber off" data-description="the port's ACT (Active Loopback) lamp. Table 11 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, loopback is off; amber on - port is enabled by software, loopback is on." data-z-dome="0.3" />
    <rect id="spa-2xchoc12-ds0--led-car-p1" x="19.26" y="150.38" width="2.2" height="1.4" rx="0.3" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.15" data-path="spa-2xchoc12-ds0/led-car-p1" data-class="led" data-states="green amber off" data-description="the port's CAR (Carrier/Alarm) lamp. Table 11 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, and there is a valid SONET signal without any alarms; amber on - port is enabled by software, and there is at least one alarm." data-z-dome="0.3" />
    <rect id="spa-2xchoc12-ds0--led-act-p1" x="23.78" y="150.38" width="2.2" height="1.4" rx="0.3" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.15" data-path="spa-2xchoc12-ds0/led-act-p1" data-class="led" data-states="green amber off" data-description="the port's ACT (Active Loopback) lamp. Table 11 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, loopback is off; amber on - port is enabled by software, loopback is on." data-z-dome="0.3" />
    <circle id="spa-2xchoc12-ds0--status" cx="9.05" cy="157.8" r="1.1" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.2" data-path="spa-2xchoc12-ds0/status" data-class="led" data-states="green amber off" data-description="the SPA's STATUS lamp, the one lamp every SPA in this guide carries. Table 11 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - SPA power is off; green on - SPA is ready and operational; amber on - SPA power is on and good, and the SPA is being configured." data-z-dome="0.3" />
