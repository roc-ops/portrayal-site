<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32.8mm" height="44mm" viewBox="0 0 32.8 44">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="cmh-5dr1u-ring" data-path="cmh-5dr1u-ring" data-class="mechanical" data-behaviour="mounts" data-ref="fs/cmh-5dr1u-ring@1:1.0.0" data-guide="ring" data-guide-run="x" data-guide-aperture="26.8 68.3" data-flammability="UL 94V-2" data-material="PC" transform="translate(0,0)">
    <title>cmh-5dr1u-ring</title>
    <circle id="cmh-5dr1u-ring--seat" cx="16.4" cy="22" r="16.4" fill="#151719" data-path="cmh-5dr1u-ring/seat" data-class="bezel" data-z-cyl="1.5" data-z-color="#151719" />
    <rect id="cmh-5dr1u-ring--base" x="11.45" y="0.2" width="9.9" height="43.6" rx="1.5" fill="#111315" data-path="cmh-5dr1u-ring/base" data-class="bezel" data-z-out="9.0" data-z-color="#111315" />
    <rect id="cmh-5dr1u-ring--top" x="11.45" y="0.2" width="9.9" height="8.3" rx="1.5" fill="#0d0f10" data-path="cmh-5dr1u-ring/top" data-class="bezel" data-z-out="85.5" data-z-color="#111315" />
    <rect id="cmh-5dr1u-ring--bottom" x="11.45" y="35.3" width="9.9" height="8.5" rx="1.5" fill="#0d0f10" data-path="cmh-5dr1u-ring/bottom" data-class="bezel" data-z-out="67.8" data-z-color="#111315" />
    <rect id="cmh-5dr1u-ring--front" x="11.45" y="0.2" width="9.9" height="43.6" rx="1.5" fill="#0d0f10" data-path="cmh-5dr1u-ring/front" data-class="bezel" data-z-out="85.5" data-z-lift="77.3" data-z-color="#111315" />
    <rect id="cmh-5dr1u-ring--foot" x="11.45" y="35.3" width="9.9" height="8.5" rx="1.5" fill="#101214" data-path="cmh-5dr1u-ring/foot" data-class="bezel" data-z-out="77.3" data-z-lift="71.9" data-z-color="#111315" />
  </g>
</svg>
