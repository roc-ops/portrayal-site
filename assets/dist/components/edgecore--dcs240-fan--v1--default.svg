<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48.5mm" height="40.0mm" viewBox="0 0 48.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="dcs240-fan" data-path="dcs240-fan" data-class="fan" data-behaviour="fills" data-ref="edgecore/dcs240-fan@1:1.0.2" data-wall="#15181b" data-airflow="front-to-back" data-model="FAN-1U-1x1N" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>dcs240-fan</title>
    <defs>
      <pattern id="dcs240-fan--dcs240-mesh" width="4.10" height="2.37" patternUnits="userSpaceOnUse">
        <path d="M 1.18 0 L 0.59 1.02 L -0.59 1.02 L -1.18 0 L -0.59 -1.02 L 0.59 -1.02 Z" fill="#0d0f11" />
        <path d="M 5.28 0 L 4.69 1.02 L 3.51 1.02 L 2.92 0 L 3.51 -1.02 L 4.69 -1.02 Z" fill="#0d0f11" />
        <path d="M 3.23 1.185 L 2.64 2.205 L 1.46 2.205 L 0.87 1.185 L 1.46 0.165 L 2.64 0.165 Z" fill="#0d0f11" />
        <path d="M 1.18 2.37 L 0.59 3.39 L -0.59 3.39 L -1.18 2.37 L -0.59 1.35 L 0.59 1.35 Z" fill="#0d0f11" />
        <path d="M 5.28 2.37 L 4.69 3.39 L 3.51 3.39 L 2.92 2.37 L 3.51 1.35 L 4.69 1.35 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="dcs240-fan--body" x="0" y="0" width="48.5" height="40" rx="0.5" fill="#33373c" stroke="#22262a" stroke-width="0.4" />
    <rect x="0.8" y="0.8" width="46.9" height="38.4" rx="0.35" fill="none" stroke="#45494f" stroke-width="0.22" />
    <g id="dcs240-fan--grille" data-path="dcs240-fan/grille" data-class="rotor" data-z-vent="26">
      <rect id="dcs240-fan--grille-back" x="8.0" y="2.6" width="32.5" height="30.0" rx="0.4" fill="#16191c" />
      <circle id="dcs240-fan--rotor-disc" cx="24.25" cy="17.6" r="13.6" fill="#1d2125" stroke="#3a3e43" stroke-width="0.3" />
      <circle id="dcs240-fan--rotor-hub" cx="24.25" cy="17.6" r="4.3" fill="#26292d" stroke="#3a3e43" stroke-width="0.25" />
      <rect id="dcs240-fan--grille-holes" x="8.0" y="2.6" width="32.5" height="30.0" fill="url(#dcs240-fan--dcs240-mesh)" />
      <rect x="8.0" y="2.6" width="32.5" height="30.0" rx="0.4" fill="none" stroke="#4a4f55" stroke-width="0.3" />
    </g>
    <rect id="dcs240-fan--handle" x="4.9" y="18.4" width="38.75" height="3.2" rx="1.3" fill="#c22f2f" data-fill-from="handle-finish" data-path="dcs240-fan/handle" data-class="latch" data-z-lift="1.0" data-z-bar="3.0" data-z-color="#2b2f33" />
    <circle id="dcs240-fan--screw" cx="43.9" cy="35.6" r="1.1" fill="#8a9099" stroke="#4a4f55" stroke-width="0.22" />
    <g id="dcs240-fan--silkscreen">
      <text id="dcs240-fan--silk-airflow" x="24.25" y="37.6" font-family="sans-serif" font-size="1.8" text-anchor="middle" fill="#c7ccd1" data-from="airflow-legend">F2B</text>
    </g>
  </g>
</svg>
