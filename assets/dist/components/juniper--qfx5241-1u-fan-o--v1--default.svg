<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40.5mm" height="40.2mm" viewBox="0 0 40.5 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qfx5241-1u-fan-o" data-path="qfx5241-1u-fan-o" data-class="fan" data-behaviour="fills" data-ref="juniper/qfx5241-1u-fan-o@1:1.0.0" data-airflow="front-to-back" data-model="QFX5241-1U-FAN-O" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>qfx5241-1u-fan-o</title>
    <defs>
      <pattern id="qfx5241-1u-fan-o--hex" width="4.0" height="6.93" patternUnits="userSpaceOnUse">
        <polygon points="2.0,0.03 3.47,0.88 3.47,2.58 2.0,3.43 0.53,2.58 0.53,0.88" fill="#0a0b0d" />
        <polygon points="0,3.5 1.47,4.35 1.47,6.05 0,6.9 -1.47,6.05 -1.47,4.35" fill="#0a0b0d" />
        <polygon points="4.0,3.5 5.47,4.35 5.47,6.05 4.0,6.9 2.53,6.05 2.53,4.35" fill="#0a0b0d" />
      </pattern>
    </defs>
    <rect id="qfx5241-1u-fan-o--face" x="0" y="0" width="40.5" height="40.2" rx="0.6" fill="#5a6069" stroke="#3a3e45" stroke-width="0.3" />
    <rect id="qfx5241-1u-fan-o--grille" x="2.4" y="1.6" width="35.7" height="37.0" fill="#2c3036" />
    <rect x="2.4" y="1.6" width="35.7" height="37.0" fill="url(#qfx5241-1u-fan-o--hex)" />
    <g id="qfx5241-1u-fan-o--handle" data-path="qfx5241-1u-fan-o/handle" data-class="latch" data-z-out="1.6" data-z-color="#e8731f">
      <path d="M 0 15.7 C 10 15.7, 28 20.5, 40.3 22.4 V 32.4 C 28 30.0, 10 25.4, 0 25.2 Z" fill="#e8731f" stroke="#b95812" stroke-width="0.3" />
      <g fill="#d3661a">
        <rect x="3.0" y="17.0" width="9.5" height="2.6" rx="0.8" />
        <rect x="3.0" y="20.6" width="9.5" height="2.6" rx="0.8" />
        <rect x="27.5" y="23.4" width="9.5" height="2.6" rx="0.8" />
        <rect x="27.5" y="27.0" width="9.5" height="2.6" rx="0.8" />
      </g>
      <rect id="qfx5241-1u-fan-o--airout-chip" x="15.3" y="20.6" width="5.9" height="6.9" rx="0.6" fill="#15161a" />
      <g fill="#e8731f">
        <circle cx="18.25" cy="23.0" r="0.4" />
        <ellipse cx="18.25" cy="22.0" rx="0.6" ry="1.0" />
        <ellipse cx="18.25" cy="22.0" rx="0.6" ry="1.0" transform="rotate(90 18.25 23.0)" />
        <ellipse cx="18.25" cy="22.0" rx="0.6" ry="1.0" transform="rotate(180 18.25 23.0)" />
        <ellipse cx="18.25" cy="22.0" rx="0.6" ry="1.0" transform="rotate(270 18.25 23.0)" />
      </g>
      <g id="qfx5241-1u-fan-o--silkscreen">
        <text x="18.25" y="25.9" font-family="sans-serif" font-size="1.2" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="18.25" y="27.1" font-family="sans-serif" font-size="1.2" fill="#e8eaec" text-anchor="middle">OUT</text>
      </g>
    </g>
    <g id="qfx5241-1u-fan-o--screw" data-path="qfx5241-1u-fan-o/screw" data-class="screw" data-z-cyl="1.0">
      <circle cx="4.2" cy="3.1" r="1.5" fill="#15161a" stroke="#3a3e45" stroke-width="0.3" />
    </g>
  </g>
</svg>
