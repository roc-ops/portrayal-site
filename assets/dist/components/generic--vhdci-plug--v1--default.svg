<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="43.4mm" height="9.0mm" viewBox="0 0 43.4 9.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="vhdci-plug" data-path="vhdci-plug" data-class="port" data-ref="generic/vhdci-plug@1:1.0.0" data-connector="vhdci" data-media="vhdci" transform="translate(0,0)">
    <title>vhdci-plug</title>
    <rect id="vhdci-plug--shell" x="4.16" y="1.6" width="35.08" height="5.8" rx="1" fill="#c9cdd1" data-z-out="7.44" data-z-lift="0.34" data-z-color="#c9cdd1" data-z-shape="1" />
    <rect id="vhdci-plug--hood" x="0" y="0" width="43.4" height="9" rx="1" fill="#26282b" stroke="#4a4d52" stroke-width="0.12" data-z-out="25.14" data-z-lift="7.44" data-z-color="#26282b" data-z-shape="1" />
    <rect id="vhdci-plug--hood-rear" x="8.6" y="0" width="26.2" height="9" rx="1" fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12" data-z-out="41.14" data-z-lift="25.14" data-z-color="#2c2e32" data-z-shape="1" />
    <rect id="vhdci-plug--relief-boot" x="9.5" y="0" width="24.4" height="9" rx="1" fill="#202225" stroke="#4a4d52" stroke-width="0.12" data-z-out="55.44" data-z-lift="41.14" data-z-color="#202225" data-z-shape="1" />
    <circle id="vhdci-plug--screw-l" cx="2.85" cy="4.5" r="2.5" fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2" data-z-cyl="20.2" data-z-lift="25.14" data-z-color="#cfd3d7" />
    <circle id="vhdci-plug--screw-r" cx="40.55" cy="4.5" r="2.5" fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2" data-z-cyl="20.2" data-z-lift="25.14" data-z-color="#cfd3d7" />
    <circle id="vhdci-plug--stub" cx="21.7" cy="4.5" r="5" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-r-from="cable-od" data-fill-from="jacket-color" data-z-cyl="30" data-z-lift="55.44" />
    <g data-cp="cable" data-cp-at="21.7 4.5" data-cp-dir="front" data-cp-on="vhdci-plug--stub" />
    <g data-cp="mate" data-cp-at="21.7 4.5" data-cp-dir="front" />
  </g>
</svg>
