    </g>
    <g id="lpwr-f--led-pwr" data-path="lpwr-f/led-pwr" data-class="led" data-ref="common/led-dot@1:1.1.0" transform="translate(19.6,29.3)" data-group="status-leds" data-group-role="indicator" data-description="the one PWR lamp, under the connector block door">
      <title>lpwr-f--led-pwr</title>
      <circle id="lpwr-f--led-pwr--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="lpwr-f--led-pwr--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="lpwr-f/led-pwr/lamp" data-class="led" data-states="off on fault" data-z-dome="0.3" />
