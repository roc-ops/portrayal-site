      </g>
      <rect id="lpwr-f--door" x="9.6" y="3.2" width="101.0" height="32.0" rx="2.6" fill="#232527" fill-opacity="0.5" stroke="#0e0f10" stroke-width="0.3" />
      <path d="M 9.6 5.9 H 110.6" stroke="#0e0f10" stroke-width="0.3" />
      <circle id="lpwr-f--door-lock" cx="13.6" cy="30.4" r="1.8" fill="#2f3134" stroke="#0e0f10" stroke-width="0.3" />
      <circle cx="13.6" cy="30.4" r="0.8" fill="none" stroke="#55585c" stroke-width="0.25" />
      <g id="lpwr-f--hazard-label">
        <rect x="70.6" y="7.3" width="36.3" height="23.6" rx="0.5" fill="#8a8c8f" stroke="#55585c" stroke-width="0.25" />
        <path d="M 75.8 19.1 L 84.6 14.3 L 84.6 23.9 Z" fill="#f2c200" stroke="#1b1c1e" stroke-width="0.5" stroke-linejoin="round" />
        <path d="M 83.0 19.1 H 80.0" stroke="#1b1c1e" stroke-width="0.7" stroke-linecap="round" />
        <circle cx="78.6" cy="19.1" r="0.4" fill="#1b1c1e" />
        <g id="lpwr-f--hazard-silkscreen" font-family="Arial, Helvetica, sans-serif" fill="#1b1c1e">
          <text x="91.4" y="19.1" font-size="2.3" font-weight="bold" text-anchor="middle" transform="rotate(-90 91.4 19.1)">ENERGY</text>
          <text x="94.3" y="19.1" font-size="2.3" font-weight="bold" text-anchor="middle" transform="rotate(-90 94.3 19.1)">HAZARD</text>
          <text x="98.6" y="19.1" font-size="1.5" text-anchor="middle" transform="rotate(-90 98.6 19.1)">Disconnect</text>
          <text x="100.7" y="19.1" font-size="1.5" text-anchor="middle" transform="rotate(-90 100.7 19.1)">before service</text>
        </g>
      </g>
    </g>
    <g id="lpwr-f--screw-left" data-path="lpwr-f/screw-left" data-class="screw" data-z-cyl="2.0">
