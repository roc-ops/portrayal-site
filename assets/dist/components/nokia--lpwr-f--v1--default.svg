      <text x="22.4" y="31.1" font-size="1.9" fill="#9a9da1">PWR</text>
      <text x="46.6" y="12.3" font-size="1.9" fill="#77797d">BAT</text>
    </g>
    <g id="lpwr-f--connector-block" data-path="lpwr-f/connector-block" data-class="terminal" data-z-out="27.95" data-z-color="#232527">
      <rect x="9.6" y="3.2" width="101.0" height="32.0" rx="2.6" fill="#1b1c1e" stroke="#0e0f10" stroke-width="0.3" />
      <g id="lpwr-f--bat-terminal" opacity="0.55">
        <path d="M 22.2 8.2 L 47.7 17.8 L 44.3 29.6 L 16.6 21.6 Z" fill="#5a5d61" stroke="#3a3c3f" stroke-width="0.25" />
        <circle cx="25.6" cy="15.5" r="4.3" fill="#8b8e92" stroke="#3a3c3f" stroke-width="0.3" />
        <path d="M 23.1 15.5 H 28.1 M 25.6 13.0 V 18.0" stroke="#3a3c3f" stroke-width="0.5" />
        <circle cx="39.6" cy="21.4" r="4.3" fill="#8b8e92" stroke="#3a3c3f" stroke-width="0.3" />
