    <rect id="serial-jack-10p--led-b" x="12.4" y="13.3" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)" data-path="serial-jack-10p/led-b" data-class="led" data-states="off on" data-z-out="0.3" data-z-color="#0d0f11" />
