<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="338.1mm" height="29.2mm" viewBox="0 0 338.1 29.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mic3-100g-dwdm" data-path="mic3-100g-dwdm" data-class="line-card" data-behaviour="fills" data-ref="juniper/mic3-100g-dwdm@2:2.0.0" data-model="MIC3-100G-DWDM" data-power-draw-max-w="91" data-states="ok fail absent" transform="translate(0,0)">
    <title>mic3-100g-dwdm</title>
    <rect id="mic3-100g-dwdm--face" x="0" y="0" width="338.1" height="29.2" rx="0.6" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.4" />
    <g id="mic3-100g-dwdm--lamps">
      <circle id="mic3-100g-dwdm--led-ok-fail" cx="5.90" cy="5.50" r="0.8" fill="var(--led-color, #3a3f44)" stroke="#33373c" stroke-width="0.25" />
    </g>
    <g id="mic3-100g-dwdm--silkscreen">
      <g id="mic3-100g-dwdm--t1126-silkscreen">
        <text x="8.40" y="6.20" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="start">OK</text>
      </g>
      <g id="mic3-100g-dwdm--t1127-silkscreen">
        <text x="165.40" y="26.70" font-family="Arial" font-size="1.3" fill="#3a3e43" text-anchor="end">MIC3-100G-DWDM</text>
      </g>
      <g id="mic3-100g-dwdm--t1124-silkscreen">
        <text x="37.15" y="23.40" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="middle">0</text>
      </g>
      <g id="mic3-100g-dwdm--t1125-silkscreen">
        <text x="15.20" y="26.70" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="end">0/</text>
      </g>
    </g>
    <g id="mic3-100g-dwdm--port-0-0" data-path="mic3-100g-dwdm/port-0-0" data-class="port" data-ref="std/cfp2@2:2.0.0" data-depth="87.5" data-wall="#aab0b7" data-cavity="cavity" data-media="cfp2" transform="translate(16.4,7.45)">
      <title>mic3-100g-dwdm--port-0-0</title>
      <rect id="mic3-100g-dwdm--port-0-0--opening" x="0" y="0" width="41.5" height="14.3" rx="0.5" fill="#17191c" data-path="mic3-100g-dwdm/port-0-0/opening" data-class="cutout" />
      <rect id="mic3-100g-dwdm--port-0-0--cavity" x="0" y="0.95" width="41.5" height="12.4" rx="0.5" fill="#0a0c0e" />
      <rect id="mic3-100g-dwdm--port-0-0--module-slot" x="2.0" y="5.75" width="37.5" height="2.8" rx="0.4" fill="#000000" />
      <path id="mic3-100g-dwdm--port-0-0--collar" fill-rule="evenodd" fill="#9aa0a8" d="M 0.05 0.05 h 41.4 v 14.2 h -41.4 z M 0.6 0.6 h 40.3 v 13.1 h -40.3 z" data-z-out="1.0" data-z-color="#7d848c" />
      <g data-cp="mate" data-cp-at="20.75 7.15" data-cp-dir="front" />
    </g>
  </g>
</svg>
