    <g id="irig-b--rs-422-out" data-path="irig-b/rs-422-out" data-class="port" data-ref="std/rj45-ganged@2:2.1.0" data-depth="18.6" data-wall="#3a3f45" data-cavity="cavity" data-media="rj45-sync" transform="translate(91.5,4.65)" data-group="timing" data-group-role="traffic" data-description="the card's time-code interfaces. Only the RS-422 output composes a library part; the isolated IRIG input (BNC), the IRIG optical output, the ten IRIG outputs (a high-density D-sub) and the alarm/pulse relay (a terminal block) are drawn in the card's own art as addressable elements, because no library part draws them as they look (2023 data sheet, IRIG line card).">
