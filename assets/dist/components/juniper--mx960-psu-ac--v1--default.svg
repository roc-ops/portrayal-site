<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="103.0mm" height="480.0mm" viewBox="0 0 103.0 480.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mx960-psu-ac" data-path="mx960-psu-ac" data-class="psu" data-behaviour="fills" data-ref="juniper/mx960-psu-ac@1:1.0.0" data-model="MX960 AC PSU" data-power-output-w="1700" data-redundancy="2+2" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>mx960-psu-ac</title>
    <rect id="mx960-psu-ac--face" x="0" y="0" width="103.0" height="480.0" rx="1.0" fill="#a7abaf" stroke="#8a8f95" stroke-width="0.5" />
    <g id="mx960-psu-ac--up-chip">
      <rect x="41.0" y="28.0" width="21.0" height="26.0" rx="1.2" fill="#f0f1f2" stroke="#c0c4c8" stroke-width="0.4" />
      <path d="M 51.5 34.0 l 5.0 8.0 l -3.0 0 l 0 6.0 l -4.0 0 l 0 -6.0 l -3.0 0 Z" fill="#6d7278" />
      <g id="mx960-psu-ac--up-silkscreen">
        <text x="51.5" y="51.5" font-family="Arial" font-size="3.0" fill="#6d7278" text-anchor="middle">UP</text>
      </g>
    </g>
    <g id="mx960-psu-ac--handle">
      <rect x="41.0" y="230.0" width="21.0" height="42.0" rx="7.0" fill="none" stroke="#565b61" stroke-width="3.2" />
    </g>
    <g id="mx960-psu-ac--label-patch">
      <rect x="12.0" y="290.0" width="30.0" height="150.0" rx="1.6" fill="#f0f1f2" stroke="#c0c4c8" stroke-width="0.4" />
      <rect x="52.0" y="330.0" width="38.0" height="70.0" rx="1.6" fill="#e6e8ea" stroke="#c0c4c8" stroke-width="0.4" />
    </g>
    <g id="mx960-psu-ac--lamps">
      <circle id="mx960-psu-ac--led-ps-fail" cx="40.0" cy="452.0" r="1.1" fill="#0f1113" stroke="#33373c" stroke-width="0.25" />
      <circle id="mx960-psu-ac--led-dc-ok" cx="50.0" cy="452.0" r="1.1" fill="#0f1113" stroke="#33373c" stroke-width="0.25" />
      <circle id="mx960-psu-ac--led-ac-ok" cx="60.0" cy="452.0" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#33373c" stroke-width="0.25" />
    </g>
    <g id="mx960-psu-ac--fan">
      <circle cx="51.5" cy="466.0" r="9.5" fill="#26292d" stroke="#17191c" stroke-width="0.5" />
      <circle cx="51.5" cy="466.0" r="2.6" fill="#44484d" />
    </g>
    <g id="mx960-psu-ac--silkscreen">
      <g id="mx960-psu-ac--t89-silkscreen">
        <text x="40.0" y="448.4" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="middle">PS</text>
      </g>
      <g id="mx960-psu-ac--t90-silkscreen">
        <text x="50.0" y="448.4" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="middle">DC</text>
      </g>
      <g id="mx960-psu-ac--t91-silkscreen">
        <text x="60.0" y="448.4" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="middle">AC</text>
      </g>
    </g>
  </g>
</svg>
