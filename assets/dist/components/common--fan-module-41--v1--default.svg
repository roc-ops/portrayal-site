      <pattern id="fan-module-41--mesh41" width="8.86" height="5.11" patternUnits="userSpaceOnUse">
        <path d="M 2.55 0 L 1.275 2.208 L -1.275 2.208 L -2.55 0 L -1.275 -2.208 L 1.275 -2.208 Z" fill="#0d0f11" />
        <path d="M 11.41 0 L 10.135 2.208 L 7.585 2.208 L 6.31 0 L 7.585 -2.208 L 10.135 -2.208 Z" fill="#0d0f11" />
        <path d="M 6.98 2.555 L 5.705 4.763 L 3.155 4.763 L 1.88 2.555 L 3.155 0.347 L 5.705 0.347 Z" fill="#0d0f11" />
        <path d="M 2.55 5.11 L 1.275 7.318 L -1.275 7.318 L -2.55 5.11 L -1.275 2.902 L 1.275 2.902 Z" fill="#0d0f11" />
        <path d="M 11.41 5.11 L 10.135 7.318 L 7.585 7.318 L 6.31 5.11 L 7.585 2.902 L 10.135 2.902 Z" fill="#0d0f11" />
      </pattern>
      <mask id="fan-module-41--fan-web-mask41" maskUnits="userSpaceOnUse">
        <circle cx="20.45" cy="19.2" r="18.6" fill="white" />
        <rect x="0.9" y="0.6" width="39.1" height="38.8" fill="url(#fan-module-41--mesh41)" />
      </mask>
    </defs>
    <rect id="fan-module-41--body" x="0" y="0" width="40.9" height="40" fill="#33373c" stroke="#22262a" stroke-width="0.4" />
    <g id="fan-module-41--rotor" data-path="fan-module-41/rotor" data-class="rotor">
      <circle id="fan-module-41--rotor-behind" cx="20.45" cy="19.2" r="18.6" fill="#0b0d0f" data-z-vent="25" />
      <path id="fan-module-41--rotor-grille" fill-rule="evenodd" fill="url(#fan-module-41--mesh41)" d="M 0.9 0.6 h 39.1 v 38.8 h -39.1 z          M 20.45 0.6 a 18.6 18.6 0 1 0 0.001 0 z" data-z-vent="25" />
      <g id="fan-module-41--rotor-bulge" data-z-dome="3.2">
        <circle cx="20.45" cy="19.2" r="18.6" fill="#17191c" mask="url(#fan-module-41--fan-web-mask41)" />
        <circle id="fan-module-41--rotor-hub" cx="20.45" cy="19.2" r="5.2" fill="#22262a" />
