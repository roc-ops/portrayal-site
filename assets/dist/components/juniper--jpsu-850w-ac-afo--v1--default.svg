<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.8mm" height="40.2mm" viewBox="0 0 54.8 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/jpsu-850w-ac-afo@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/jpsu-850w-ac-afo@'] .state-green { --led-color: #39b54a; }</style>
  <g id="jpsu-850w-ac-afo" data-path="jpsu-850w-ac-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/jpsu-850w-ac-afo@1:1.0.0" data-airflow="front-to-back" data-input="100 to 240 VAC, 50 to 60 Hz, 7.5 A at 100 VAC or 3 A at 240 VAC (QFX5120-48YM, guide Table 30)" data-model="JPSU-850W-AC-AFO" data-power-output-w="850" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>jpsu-850w-ac-afo</title>
    <defs>
      <pattern id="jpsu-850w-ac-afo--grid" width="3.6" height="3.6" patternUnits="userSpaceOnUse">
        <rect x="0.4" y="0.4" width="2.8" height="2.8" fill="#07080a" />
      </pattern>
    </defs>
    <rect id="jpsu-850w-ac-afo--face" x="0" y="0" width="54.8" height="40.2" rx="0.8" fill="#1c1e21" stroke="#181b1f" stroke-width="0.4" />
    <g id="jpsu-850w-ac-afo--vents">
      <rect x="2.4" y="2.6" width="15.8" height="28.0" rx="0.5" fill="#2b2e32" />
      <rect x="2.4" y="2.6" width="15.8" height="28.0" rx="0.5" fill="url(#jpsu-850w-ac-afo--grid)" />
    </g>
    <rect id="jpsu-850w-ac-afo--inlet-bay" x="28.0" y="3.4" width="21.0" height="31.0" rx="1.2" fill="#121416" stroke="#2b2e32" stroke-width="0.3" />
    <g id="jpsu-850w-ac-afo--silkscreen" font-family="sans-serif" font-size="2.1" fill="#d9dde1">
      <text x="8.2" y="21.9">AC</text>
      <text x="8.2" y="28.3">DC</text>
      <text x="8.2" y="34.5">!</text>
    </g>
    <g id="jpsu-850w-ac-afo--lamps">
      <circle id="jpsu-850w-ac-afo--led-ac" cx="5.5" cy="21.2" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="jpsu-850w-ac-afo/led-ac" data-class="led" data-states="green off" />
      <circle id="jpsu-850w-ac-afo--led-dc" cx="5.5" cy="27.6" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="jpsu-850w-ac-afo/led-dc" data-class="led" data-states="green off" />
      <circle id="jpsu-850w-ac-afo--led-fault" cx="5.5" cy="33.8" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="jpsu-850w-ac-afo/led-fault" data-class="led" data-states="amber off" />
    </g>
    <path id="jpsu-850w-ac-afo--retainer" d="M 29.5 3.0 V 13.5 H 36.8 V 12.2 A 2.2 2.2 0 1 1 41.2 12.2 V 13.5 H 48.0 V 3.0" fill="none" stroke="#a9afb5" stroke-width="0.7" stroke-linejoin="round" />
    <g id="jpsu-850w-ac-afo--lever" data-path="jpsu-850w-ac-afo/lever" data-class="latch">
      <rect x="49.0" y="19.9" width="5.8" height="20.3" rx="1.2" fill="#232528" stroke="#3a3e43" stroke-width="0.35" />
      <rect x="51.0" y="24.4" width="1.6" height="9.0" rx="0.6" fill="#08090a" />
    </g>
    <g id="jpsu-850w-ac-afo--latch" data-path="jpsu-850w-ac-afo/latch" data-class="latch" data-z-out="1.6" data-z-color="#e8731f">
      <rect x="18.2" y="0.8" width="9.7" height="39.0" rx="1.4" fill="#e8731f" stroke="#b95812" stroke-width="0.4" />
      <rect x="20.6" y="4.6" width="4.9" height="31.0" rx="1.2" fill="#d3661a" />
    </g>
    <g id="jpsu-850w-ac-afo--inlet" data-path="jpsu-850w-ac-afo/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(24.5,8.7) rotate(270 14.0 10.0)">
      <title>jpsu-850w-ac-afo--inlet</title>
      <rect id="jpsu-850w-ac-afo--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="jpsu-850w-ac-afo/inlet/opening" data-class="cutout" />
      <path id="jpsu-850w-ac-afo--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="jpsu-850w-ac-afo--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="jpsu-850w-ac-afo--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="jpsu-850w-ac-afo--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
