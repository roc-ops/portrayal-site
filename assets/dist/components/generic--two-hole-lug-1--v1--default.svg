    <rect id="two-hole-lug-1--barrel" x="45.72" y="2.16" width="20.57" height="7.87" rx="0.6" fill="#c9cdd1" stroke="#7b7d7f" stroke-width="0.15" data-fill-from="barrel-color" data-stroke-derive="barrel-color" data-z-bar="7.87" />
    <rect id="two-hole-lug-1--wire" x="66.29" y="2.16" width="10" height="7.87" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.15" data-fill-from="wire-color" data-z-bar="7.87" />
    <g id="two-hole-lug-1--head-1" data-z-cyl="1.4" data-z-lift="2.03" data-z-color="#c3c9cf">
      <circle cx="6.095" cy="6.095" r="4.875" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" />
      <path d="M 3.4137 6.095 H 8.7763 M 6.095 3.4137 V 8.7763" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round" />
    </g>
    <g id="two-hole-lug-1--head-2" data-z-cyl="1.4" data-z-lift="2.03" data-z-color="#c3c9cf">
      <circle cx="31.495" cy="6.095" r="4.875" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" />
      <path d="M 28.8137 6.095 H 34.1762 M 31.495 3.4137 V 8.7763" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round" />
    </g>
    <g data-cp="cable" data-cp-at="76.29 6.095" data-cp-dir="right" />
