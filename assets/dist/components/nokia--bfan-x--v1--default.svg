    <rect id="bfan-x--logo-zone" x="4.0" y="200.0" width="16.0" height="8.0" fill="none" data-path="bfan-x/logo-zone" data-class="label" />
    <g id="bfan-x--silkscreen">
      <path d="M 7.2 135.2 L 10.8 133.1 L 10.8 137.3 Z" fill="none" stroke="#1d2023" stroke-width="0.35" />
      <text x="15.6" y="134.0" font-family="Arial" font-weight="bold" font-size="3.1" fill="#1d2023" text-anchor="middle" transform="rotate(-90 15.6 134.0)">CAUTION</text>
      <text x="21.1" y="132.4" font-family="Arial" font-weight="bold" font-size="3.0" fill="#1d2023" text-anchor="middle" transform="rotate(-90 21.1 132.4)">ROTATING FAN BLADES</text>
    </g>
    <g id="bfan-x--fan-clips" stroke="#1d2023" stroke-width="0.2" data-path="bfan-x/fan-clips" data-class="fastener" data-z-out="3.0">
      <rect x="11.2" y="83.5" width="13.6" height="11.5" rx="2.5" fill="#b3b7bc" />
      <rect x="11.2" y="96.5" width="13.6" height="11.5" rx="2.5" fill="#b3b7bc" />
      <circle cx="14.6" cy="89.2" r="1.3" fill="#8d9298" />
      <circle cx="14.6" cy="102.2" r="1.3" fill="#8d9298" />
      <rect x="18.2" y="84.5" width="1.8" height="22.5" rx="0.6" fill="#2e3236" />
    </g>
    <g id="bfan-x--led-status" data-path="bfan-x/led-status" data-class="led" data-ref="common/led-indicator@1:1.2.0" transform="translate(14.3,192.5)" data-group="status-leds" data-group-role="indicator" data-description="the fan unit's single status lamp">
      <title>bfan-x--led-status</title>
      <circle id="bfan-x--led-status--bezel" cx="2" cy="2" r="1.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.2" />
      <circle id="bfan-x--led-status--lamp" cx="2" cy="2" r="1.0" fill="var(--led-color, #3a3f44)" data-path="bfan-x/led-status/lamp" data-class="led" data-states="off starting on closed-loop fail" data-z-dome="0.45" />
    </g>
    <g data-cp="mate" data-cp-at="16.55 106.75" data-cp-dir="rear" />
  </g>
</svg>
