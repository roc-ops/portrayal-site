    <rect id="bfan-x--window-right" x="13.6" y="13.1" width="8.9" height="60.0" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25" data-path="bfan-x/window-right" data-class="window" />
    <rect id="bfan-x--caution-label" x="3.8" y="113.7" width="18.7" height="41.7" fill="#e9eaeb" stroke="#1d2023" stroke-width="0.25" data-path="bfan-x/caution-label" data-class="label" />
    <g id="bfan-x--esd-mark" data-path="bfan-x/esd-mark" data-class="label">
      <circle cx="12.7" cy="163.5" r="3.2" fill="none" stroke="#1d2023" stroke-width="0.35" />
      <path d="M 12.7 161.3 L 14.7 164.9 L 10.7 164.9 Z" fill="#1d2023" />
    </g>
    <rect id="bfan-x--label-window" x="3.8" y="170.6" width="9.6" height="27.7" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25" data-path="bfan-x/label-window" data-class="label" />
    <g id="bfan-x--cover-screw" data-path="bfan-x/cover-screw" data-class="fastener">
      <circle cx="16.0" cy="175.8" r="1.9" fill="#8d9298" stroke="#3a3f44" stroke-width="0.3" />
      <line x1="16.0" y1="174.4" x2="16.0" y2="177.2" stroke="#3a3f44" stroke-width="0.35" />
