          <circle cx="8.0" cy="11.6" r="2.1" fill="#33373c" stroke="#565b60" stroke-width="0.3" />
        </g>
        <g id="mx204-psu-dc--stud-1" data-z-cyl="5.5" data-z-lift="2.2" data-z-thread="1.0">
