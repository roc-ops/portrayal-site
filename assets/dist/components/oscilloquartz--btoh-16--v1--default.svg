<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="113.5mm" height="20.6mm" viewBox="0 0 113.5 20.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='oscilloquartz/btoh-16@'] .state-fail { --led-color: #d0342c; }
    g[data-ref^='oscilloquartz/btoh-16@'] .state-initializing { --led-color: #39b54a; }
    g[data-ref^='oscilloquartz/btoh-16@'] .state-initializing { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='oscilloquartz/btoh-16@'] .state-loading { --led-color: #e0b21b; }
    g[data-ref^='oscilloquartz/btoh-16@'] .state-loading { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='oscilloquartz/btoh-16@'] .state-normal { --led-color: #39b54a; }
    g[data-ref^='oscilloquartz/btoh-16@'] .state-power-ok { --led-color: #39b54a; }
    g[data-ref^='oscilloquartz/btoh-16@'] .state-power-up { --led-color: #e0b21b; }</style>
  <g id="btoh-16" data-path="btoh-16" data-class="line-card" data-behaviour="fills" data-ref="oscilloquartz/btoh-16@1:1.0.0" data-model="BTOH-16" data-outputs="16" data-part-number="1078904679-01" data-signal="E1, T1 (DS1) or 2.048 MHz per output" data-states="absent" transform="translate(0,0)">
    <title>btoh-16</title>
    <rect id="btoh-16--plate" x="0.1" y="0.1" width="113.3" height="20.4" rx="0.4" fill="#dcdee1" stroke="#6b7076" stroke-width="0.2" />
    <rect x="7.2" y="0" width="1.5" height="0.9" fill="#15171a" />
    <rect x="7.2" y="19.7" width="1.5" height="0.9" fill="#15171a" />
    <circle cx="3.4" cy="6.8" r="1.2" fill="none" stroke="#c3c6ca" stroke-width="0.25" />
    <g id="btoh-16--thumbscrew" data-path="btoh-16/thumbscrew" data-class="fastener">
      <circle cx="3.3" cy="12.35" r="3.2" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.25" />
      <circle cx="3.3" cy="12.35" r="2.6" fill="none" stroke="#9ca1a6" stroke-width="0.5" stroke-dasharray="0.3 0.3" />
      <path d="M 1.9 12.35 L 2.6 11.1 H 4.0 L 4.7 12.35 L 4.0 13.6 H 2.6 Z" fill="#e2e5e8" stroke="#8a8f95" stroke-width="0.2" />
    </g>
    <g id="btoh-16--handle" data-path="btoh-16/handle" data-class="handle">
      <rect x="105.3" y="0.55" width="7.0" height="19.25" rx="1.3" fill="#e3e5e8" stroke="#8d9298" stroke-width="0.2" />
      <rect x="106.5" y="1.8" width="4.6" height="16.75" rx="1.1" fill="#d3d6da" />
    </g>
    <g id="btoh-16--silkscreen" font-family="Helvetica, Arial, sans-serif" font-style="italic" fill="#26407a">
      <text x="1.7" y="3.9" font-size="2.4" font-weight="bold">BTOH-16</text>
      <text x="16.6" y="8.2" font-size="1.7" text-anchor="end">PWR</text>
      <text x="16.6" y="13.4" font-size="1.7" text-anchor="end">STA</text>
      <text x="57.5" y="18.2" font-size="1.8" text-anchor="middle">16 BITS-OUT</text>
    </g>
    <g id="btoh-16--led-pwr" data-path="btoh-16/led-pwr" data-class="led" data-ref="common/led-indicator@1:1.2.0" transform="translate(17.1,5.5)">
      <title>btoh-16--led-pwr</title>
      <circle id="btoh-16--led-pwr--bezel" cx="2" cy="2" r="1.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.2" />
      <circle id="btoh-16--led-pwr--lamp" cx="2" cy="2" r="1.0" fill="var(--led-color, #3a3f44)" data-path="btoh-16/led-pwr/lamp" data-class="led" data-states="off power-ok" data-z-dome="0.45" />
    </g>
    <g id="btoh-16--led-sta" data-path="btoh-16/led-sta" data-class="led" data-ref="common/led-indicator@1:1.2.0" transform="translate(17.1,10.7)">
      <title>btoh-16--led-sta</title>
      <circle id="btoh-16--led-sta--bezel" cx="2" cy="2" r="1.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.2" />
      <circle id="btoh-16--led-sta--lamp" cx="2" cy="2" r="1.0" fill="var(--led-color, #3a3f44)" data-path="btoh-16/led-sta/lamp" data-class="led" data-states="off normal initializing power-up loading fail" data-z-dome="0.45" />
    </g>
    <g id="btoh-16--bits-out" data-path="btoh-16/bits-out" data-class="port" data-ref="common/vhdci-receptacle@1:1.0.0" data-media="vhdci" transform="translate(37.3,9.2)" data-group="outputs" data-group-role="traffic" data-description="ONE CONNECTOR, SIXTEEN OUTPUTS. The VHDCI carries all sixteen BITS outputs to a patch panel over one high-density cable (1036005401-01 or 1036005402-01), and the outputs are numbered 1-16 on the panel's ports, not on this face. A timing output is the work a grandmaster is bought to do, so the group is traffic.">
      <title>btoh-16--bits-out</title>
      <rect id="btoh-16--bits-out--flange" x="2.4" y="3.5" width="35.6" height="1.5" rx="0.3" fill="#b9bdc2" stroke="#8a8f95" stroke-width="0.15" />
      <path id="btoh-16--bits-out--shell" d="M 5.4 0.2 H 35.1 L 35.7 1.0 V 3.7 H 4.8 V 1.0 Z" fill="#c9cdd1" stroke="#7d8288" stroke-width="0.18" />
      <rect id="btoh-16--bits-out--opening" x="6.2" y="1.7" width="28.2" height="1.3" rx="0.2" fill="#111417" data-path="btoh-16/bits-out/opening" data-class="opening" />
      <g fill="#f4f5f6">
        <rect x="10.8" y="0.35" width="2.6" height="0.35" />
        <rect x="19.0" y="0.35" width="2.6" height="0.35" />
        <rect x="27.2" y="0.35" width="2.6" height="0.35" />
      </g>
      <g fill="#bfc4c9" stroke="#6f747a" stroke-width="0.18">
        <circle id="btoh-16--bits-out--screw-l" cx="1.6" cy="2.35" r="1.4" data-path="btoh-16/bits-out/screw-l" data-class="fastener" />
        <circle id="btoh-16--bits-out--screw-r" cx="38.8" cy="2.35" r="1.4" data-path="btoh-16/bits-out/screw-r" data-class="fastener" />
      </g>
      <g stroke="#6f747a" stroke-width="0.2" fill="none">
        <path d="M 0.9 2.35 H 2.3" />
        <path d="M 38.1 2.35 H 39.5" />
      </g>
      <g data-cp="mate" data-cp-at="20.2 2.35" data-cp-dir="front" />
    </g>
    <g data-cp="mate" data-cp-at="56.75 10.3" data-cp-dir="rear" />
  </g>
</svg>
