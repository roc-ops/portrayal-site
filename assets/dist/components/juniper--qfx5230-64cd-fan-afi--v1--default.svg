    <rect id="qfx5230-64cd-fan-afi--grille" x="5.0" y="3.0" width="71.0" height="74.0" rx="5.0" fill="#16171a" />
    <rect x="5.0" y="3.0" width="71.0" height="74.0" rx="5.0" fill="url(#qfx5230-64cd-fan-afi--hex)" />
    <g id="qfx5230-64cd-fan-afi--handle" data-path="qfx5230-64cd-fan-afi/handle" data-class="latch" data-z-out="2.0" data-z-color="#6ea301">
      <path d="M 0 28.7 C 20 28.7, 52 36.0, 79.6 36.6 V 52.3 C 55 46.0, 25 44.5, 0 43.9 Z" fill="#6ea301" stroke="#4d7500" stroke-width="0.4" />
      <g fill="#5d8c00">
        <rect x="7.0" y="30.9" width="19.0" height="4.2" rx="1.2" />
