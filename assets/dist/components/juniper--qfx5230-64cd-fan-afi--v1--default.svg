      <rect id="qfx5230-64cd-fan-afi--airin-chip" x="31.4" y="37.2" width="13.4" height="6.9" rx="0.8" fill="#5b6066" />
      <g fill="#6ea301">
        <circle cx="35.0" cy="40.65" r="0.5" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" transform="rotate(90 35.0 40.65)" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" transform="rotate(180 35.0 40.65)" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" transform="rotate(270 35.0 40.65)" />
      </g>
      <g id="qfx5230-64cd-fan-afi--silkscreen">
        <text x="40.6" y="40.0" font-family="sans-serif" font-size="2.4" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="40.6" y="43.0" font-family="sans-serif" font-size="2.4" fill="#e8eaec" text-anchor="middle">IN</text>
      </g>
    </g>
    <g id="qfx5230-64cd-fan-afi--screw" data-path="qfx5230-64cd-fan-afi/screw" data-class="screw" data-z-cyl="2.0" data-z-knurl="1">
