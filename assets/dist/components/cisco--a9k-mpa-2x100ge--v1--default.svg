<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="34.54mm" height="161.8mm" viewBox="0 0 34.54 161.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/a9k-mpa-2x100ge@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/a9k-mpa-2x100ge@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/a9k-mpa-2x100ge@'] .state-red { --led-color: #d0021b; }</style>
  <g id="a9k-mpa-2x100ge" data-path="a9k-mpa-2x100ge" data-class="line-card" data-ref="cisco/a9k-mpa-2x100ge@1:1.0.0" data-body-depth="170.18" data-wall="#4a4f55" data-cfp2="2" data-eol="none-announced" data-media="CFP2, 100 Gigabit Ethernet" data-model="A9K-MPA-2X100GE" data-role="modular-port-adapter" data-weight-kg="1.09" transform="translate(0,0)">
    <title>a9k-mpa-2x100ge</title>
    <rect id="a9k-mpa-2x100ge--plate" x="0" y="0" width="34.54" height="161.8" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3" />
    <rect id="a9k-mpa-2x100ge--cfp2-0" x="10.45" y="20.81" width="15.23" height="37.13" rx="0.5" fill="#2b2f33" stroke="#4a4f55" stroke-width="0.3" data-path="a9k-mpa-2x100ge/cfp2-0" data-class="cutout" data-description="CFP2 port 0. A drawn opening, not a composed aperture - see provenance.aperture." />
    <rect id="a9k-mpa-2x100ge--cfp2-1" x="10.45" y="105.54" width="15.23" height="37.13" rx="0.5" fill="#2b2f33" stroke="#4a4f55" stroke-width="0.3" data-path="a9k-mpa-2x100ge/cfp2-1" data-class="cutout" data-description="CFP2 port 1. A drawn opening, not a composed aperture - see provenance.aperture." />
    <rect id="a9k-mpa-2x100ge--led-p0" x="21.63" y="11.37" width="3.48" height="2.94" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="a9k-mpa-2x100ge/led-p0" data-class="led" data-states="green amber off" data-description="the port's A/L (Active/Link) indicator. The master draws it as a TRIANGLE rather than a rectangle or a circle, with its 'A/L' legend beside it as outlined glyphs - see provenance.outlined-glyphs. No per-card LED table exists for this MPA, so the three states are the family's and are a BORROWING, flagged as one." data-z-dome="0.3" />
    <rect id="a9k-mpa-2x100ge--led-p1" x="21.63" y="100.71" width="3.48" height="2.94" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="a9k-mpa-2x100ge/led-p1" data-class="led" data-states="green amber off" data-description="the port's A/L (Active/Link) indicator. The master draws it as a TRIANGLE rather than a rectangle or a circle, with its 'A/L' legend beside it as outlined glyphs - see provenance.outlined-glyphs. No per-card LED table exists for this MPA, so the three states are the family's and are a BORROWING, flagged as one." data-z-dome="0.3" />
    <g>
      <circle cx="4.21" cy="76.9" r="4.06" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="4.21" cy="76.9" r="1.83" fill="#6d7379" />
    </g>
    <g>
      <circle cx="27.45" cy="78.25" r="2.69" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="27.45" cy="78.25" r="1.21" fill="#6d7379" />
    </g>
    <g>
      <circle cx="2.18" cy="88.11" r="2.69" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="2.18" cy="88.11" r="1.21" fill="#6d7379" />
    </g>
    <circle id="a9k-mpa-2x100ge--status" cx="15.6" cy="148.42" r="1.59" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-mpa-2x100ge/status" data-class="led" data-states="green amber red off" data-description="the card's Status LED. Table 32, 'Port Status and Line Card Status LEDs', of the Ethernet Line Card Installation Guide, section 'Card Status LED (one per card)'. Green: line card has booted properly and is ready to pass or is passing traffic. Steady amber: boot process underway. Blinking amber: software configuration error that prevents the card passing traffic - it may still be passing traffic with some degradation. Red: hardware error, not passing traffic. Off: powered off. Steady and blinking amber share one colour and are not two states; the distinction is recorded because it is the difference between a card booting and a card misconfigured." data-z-dome="0.3" />
    <g id="a9k-mpa-2x100ge--silkscreen">
      <rect x="30.47" y="1.0" width="4.07" height="35.31" fill="#ffef5c" />
      <text x="31.28" y="18.66" transform="rotate(90 31.28 18.66)" font-family="sans-serif" font-size="2.3" font-weight="bold" text-anchor="middle" fill="#231f20">A9K-MPA-2X100GE</text>
      <text x="15.61" y="2.53" transform="rotate(90 15.61 2.53)" font-family="sans-serif" font-size="2.1" fill="#231f20">CLASS 1 LASER</text>
      <text x="18.6" y="151.42" transform="rotate(90 18.6 151.42)" font-family="sans-serif" font-size="1.9" fill="#231f20">STATUS</text>
      <text x="26.71" y="39.0" transform="rotate(90 26.71 39.0)" font-family="sans-serif" font-size="2.3" fill="#231f20">0</text>
      <text x="26.91" y="123.9" transform="rotate(90 26.91 123.9)" font-family="sans-serif" font-size="2.3" fill="#231f20">1</text>
    </g>
  </g>
</svg>
