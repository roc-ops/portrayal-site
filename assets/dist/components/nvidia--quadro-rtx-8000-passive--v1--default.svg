      <g id="quadro-rtx-8000-passive--screw-2" data-path="quadro-rtx-8000-passive/screw-2" data-class="screw">
        <circle cx="88.25" cy="24.7" r="2.15" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.3" />
        <circle cx="88.25" cy="24.7" r="0.8" fill="#4a4f55" />
