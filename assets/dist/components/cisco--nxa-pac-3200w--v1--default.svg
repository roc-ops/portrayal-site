<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="89.2mm" height="43.2mm" viewBox="0 0 89.2 43.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/nxa-pac-3200w@'] .state-fault { --led-color: #f59e0b; }
    g[data-ref^='cisco/nxa-pac-3200w@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='cisco/nxa-pac-3200w@'] .state-warning { --led-color: #f59e0b; }</style>
  <g id="nxa-pac-3200w" data-path="nxa-pac-3200w" data-class="psu" data-behaviour="fills" data-ref="cisco/nxa-pac-3200w@1:1.0.0" data-wall="#3a3e43" data-airflow="front-to-back" data-efficiency="90% or greater (20 to 100% load)" data-inlet="c20" data-input="ac" data-input-voltage="AC range 100-120 VAC, 16 A max, 50/60 Hz; HVAC range 200-240 VAC, 16 A max, 50/60 Hz; HVDC range 240 VDC, 14.5 max; input voltage row 264 to 300 VAC; 47 to 63 Hz" data-model="NXA-PAC-3200W" data-power-output-w="3200" data-weight-kg="1.63" data-states="absent" transform="translate(0,0)">
    <title>nxa-pac-3200w</title>
    <rect id="nxa-pac-3200w--body" x="0" y="0" width="89.2" height="43.2" rx="0.6" fill="#c3c7cc" stroke="#7a8087" stroke-width="0.4" />
    <g id="nxa-pac-3200w--fan" data-path="nxa-pac-3200w/fan" data-class="rotor" data-z-vent="24">
      <circle cx="23.8" cy="21.3" r="19.0" fill="#0d0f11" />
      <path d="M 8.9 8.4 L 38.7 34.2 M 38.7 8.4 L 8.9 34.2" stroke="#c3c7cc" stroke-width="2.0" />
      <circle cx="23.8" cy="21.3" r="10.0" fill="#5b8fd9" />
      <circle cx="23.8" cy="21.3" r="8.0" fill="#f4f6f8" />
    </g>
    <path id="nxa-pac-3200w--strap" d="M 8.5 37.7 L 39.7 5.5" stroke="#9aa1a8" stroke-width="6.0" stroke-linecap="round" opacity="0.9" />
    <g fill="#d5d9dd" stroke="#7a8087" stroke-width="0.3">
      <circle cx="8.4" cy="5.5" r="2.3" />
      <circle cx="39.7" cy="5.5" r="2.3" />
      <circle cx="8.4" cy="37.7" r="2.3" />
      <circle cx="39.7" cy="37.7" r="2.3" />
    </g>
    <g stroke="#5c6167" stroke-width="0.4">
      <path d="M 7.1 5.5 H 9.7 M 8.4 4.2 V 6.8" />
      <path d="M 38.4 5.5 H 41.0 M 39.7 4.2 V 6.8" />
      <path d="M 7.1 37.7 H 9.7 M 8.4 36.4 V 39.0" />
      <path d="M 38.4 37.7 H 41.0 M 39.7 36.4 V 39.0" />
    </g>
    <circle id="nxa-pac-3200w--lamp-1" cx="49.7" cy="10.5" r="1.3" fill="var(--led-color, #3a4046)" stroke="#5c6167" stroke-width="0.2" data-path="nxa-pac-3200w/lamp-1" data-class="led" data-states="off ok warning fault" />
    <g id="nxa-pac-3200w--mid-mark" fill="none" stroke="#1b1d20" stroke-width="0.3">
      <circle cx="49.7" cy="15.7" r="0.9" />
      <path d="M 49.1 15.7 H 50.3" />
    </g>
    <circle id="nxa-pac-3200w--lamp-2" cx="49.7" cy="21.6" r="1.3" fill="var(--led-color, #3a4046)" stroke="#5c6167" stroke-width="0.2" data-path="nxa-pac-3200w/lamp-2" data-class="led" data-states="off ok warning fault" />
    <rect id="nxa-pac-3200w--inlet-surround" x="53.1" y="5.0" width="27.8" height="35.2" rx="1.2" fill="#3a3e43" />
    <g id="nxa-pac-3200w--latch" data-path="nxa-pac-3200w/latch" data-class="latch" data-z-out="3.0">
      <rect x="81.4" y="9.9" width="6.9" height="14.4" rx="1.2" fill="#ac2f54" stroke="#6e1c2c" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" />
    </g>
    <g id="nxa-pac-3200w--inlet" data-path="nxa-pac-3200w/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(51.3,10.3) rotate(90 16.2 12.2)">
      <title>nxa-pac-3200w--inlet</title>
      <rect id="nxa-pac-3200w--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="nxa-pac-3200w/inlet/opening" data-class="cutout" />
      <rect id="nxa-pac-3200w--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="nxa-pac-3200w--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="nxa-pac-3200w--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="nxa-pac-3200w--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
