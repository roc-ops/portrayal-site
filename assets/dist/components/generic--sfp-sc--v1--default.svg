<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="14mm" height="12.05mm" viewBox="-0.225 -2.1 14 12.05">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="sfp-sc" data-path="sfp-sc" data-class="transceiver" data-behaviour="occupies" data-ref="generic/sfp-sc@1:1.0.0" data-depth="47.5" data-face="sc" data-form-factor="sfp" data-media="fiber" data-power-absent="not-applicable" transform="translate(0,0)">
    <title>sfp-sc</title>
    <rect id="sfp-sc--body" x="-0.125" y="-2.0" width="13.8" height="11.85" rx="0.5" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2" data-z-out="20.0" data-z-color="#9aa0a8" />
    <g id="sfp-sc--silkscreen">
      <text id="sfp-sc--label" x="6.775" y="-0.75" font-family="sans-serif" font-size="0.9" text-anchor="middle" fill="#2a2f34" data-from="label" />
    </g>
    <rect id="sfp-sc--bail" x="2.575" y="8.6" width="8.4" height="1.3" rx="0.65" fill="#6f6f6f" stroke="#444444" stroke-width="0.18" data-fill-from="latch-color" data-stroke-derive="latch-color" data-z-lift="20.0" data-z-bar="1.3" />
    <g id="sfp-sc--sc" data-path="sfp-sc/sc" data-class="port" data-ref="std/sc-bore@1:1.0.0" data-depth="6.0" data-wall="#4a4f55" data-cavity="bore" data-connector="sc" data-media="fiber" transform="translate(2.58,-0.355) rotate(270 4.195 4.5)" data-z-lift="20.0">
      <title>sfp-sc--sc</title>
      <path id="sfp-sc--sc--bore" fill="#15181b" d="     M 0.89 0 H 8.39 V 9 H 0.89 V 5.55 H 0 V 3.45 H 0.89 Z" data-path="sfp-sc/sc/bore" data-class="cutout" />
      <rect id="sfp-sc--sc--hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <rect id="sfp-sc--sc--hook-lower" x="1.9" y="7.2" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <circle id="sfp-sc--sc--collar" cx="4.64" cy="4.5" r="2.34" fill="#262a2f" stroke="#3a4046" stroke-width="0.12" data-z-top="3.8" />
      <circle id="sfp-sc--sc--sleeve" cx="4.64" cy="4.5" r="1.65" fill="#1e2226" />
      <circle id="sfp-sc--sc--ferrule" cx="4.64" cy="4.5" r="1.25" fill="#e8ecef" data-z-top="4.8" data-z-color="#e8ecef" />
      <g data-cp="mate" data-cp-at="4.64 4.5" data-cp-dir="front" />
    </g>
    <g data-cp="mate" data-cp-at="6.775 4.275" data-cp-dir="front" />
    <g data-cp="optical" data-cp-at="6.775 3.7" data-cp-dir="front" />
  </g>
</svg>
