      <circle id="qfx5210-jpsu-1100w-ac-afi--led-power" cx="40.2" cy="35.3" r="1.2" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5210-jpsu-1100w-ac-afi/led-power" data-class="led" data-states="green red off" />
