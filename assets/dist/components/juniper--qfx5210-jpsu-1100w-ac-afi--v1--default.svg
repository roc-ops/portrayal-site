      <rect x="37.4" y="14.7" width="3.6" height="4.8" rx="0.4" />
      <rect x="42.0" y="14.7" width="4.6" height="4.8" rx="0.4" />
      <rect x="37.4" y="20.5" width="3.6" height="4.8" rx="0.4" />
