      <rect x="13.2" y="35.2" width="4.8" height="3.0" rx="0.4" />
      <circle cx="21.0" cy="36.7" r="1.5" />
      <rect x="24.0" y="35.2" width="4.8" height="3.0" rx="0.4" />
    </g>
    <rect id="qfx5210-jpsu-1100w-ac-afi--inlet-bay" x="7.8" y="4.3" width="21.8" height="29.5" rx="1.2" fill="#121416" stroke="#2b2e32" stroke-width="0.3" />
    <path id="qfx5210-jpsu-1100w-ac-afi--retainer" d="M 9.3 3.4 V 13.9 H 16.6 V 12.6 A 2.2 2.2 0 1 1 21.0 12.6 V 13.9 H 27.8 V 3.4" fill="none" stroke="#3b3f45" stroke-width="1.0" stroke-linejoin="round" />
    <g id="qfx5210-jpsu-1100w-ac-afi--lamps">
