      <rect x="31.0" y="6.0" width="5.0" height="29.6" rx="1.0" fill="#2380bf" />
    </g>
    <g id="qfx5210-jpsu-1100w-ac-afi--inlet" data-path="qfx5210-jpsu-1100w-ac-afi/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(4.7,9.1) rotate(270 14.0 10.0)">
