<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="447.09mm" height="41.07mm" viewBox="0 0 447.09 41.07">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/asr-9910-fan@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/asr-9910-fan@'] .state-red { --led-color: #d0021b; }
    g[data-ref^='cisco/asr-9910-fan@'] .state-yellow { --led-color: #f5c518; }</style>
  <g id="asr-9910-fan" data-path="asr-9910-fan" data-class="cooling" data-behaviour="fills" data-ref="cisco/asr-9910-fan@1:1.1.1" data-wall="#4a4f55" data-eol="none-announced" data-fans="12 x 134 mm axial" data-model="ASR-9910-FAN" data-power-draw-max-w="3000" data-role="fan-tray" data-weight-kg="12.04" transform="translate(0,0)">
    <title>asr-9910-fan</title>
    <rect id="asr-9910-fan--plate" x="2.99" y="2.98" width="441.1" height="36.33" rx="1.2" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.4" />
    <rect x="8.47" y="1.26" width="431.8" height="2.74" fill="#c8cdd2" />
    <rect x="8.47" y="38.33" width="429.68" height="2.74" fill="#c8cdd2" />
    <g id="asr-9910-fan--grip-l" data-z-out="4.2">
      <rect x="0" y="8.9" width="15.48" height="18.95" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <g id="asr-9910-fan--grip-r" data-z-out="4.2">
      <rect x="431.6" y="8.9" width="15.48" height="18.96" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <g id="asr-9910-fan--handle" data-z-uhandle="8.0">
      <rect x="168.7" y="16.85" width="109.85" height="7.16" rx="2.4" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="0.35" />
      <rect x="165.1" y="16.43" width="8.04" height="8.0" rx="1.2" fill="#c8cdd2" stroke="#9aa0a6" stroke-width="0.3" />
      <rect x="274.32" y="16.43" width="7.83" height="7.79" rx="1.2" fill="#c8cdd2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <circle id="asr-9910-fan--status" cx="25.11" cy="9.39" r="1.5" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="asr-9910-fan/status" data-class="led" data-states="green yellow red off" data-description="the fan tray's Run/Fail status LED, one per tray." data-z-dome="0.3" />
    <g id="asr-9910-fan--silkscreen">
      <text x="30.43" y="10.09" font-family="sans-serif" font-size="3.4" font-weight="bold" fill="#231f20">FAN STATUS</text>
      <rect x="106.16" y="14.81" width="28.57" height="13.43" rx="0.6" fill="#ffff99" stroke="#8a7a00" stroke-width="0.3" />
      <text x="120.44" y="25.28" font-family="sans-serif" font-size="9.68" font-weight="bold" text-anchor="middle" fill="#231f20">!</text>
      <rect x="391.91" y="6.13" width="36.91" height="4.74" fill="#ffffff" stroke="#6d7379" stroke-width="0.25" />
      <text x="410.33" y="9.79" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">ASR-9910-FAN</text>
    </g>
  </g>
</svg>
