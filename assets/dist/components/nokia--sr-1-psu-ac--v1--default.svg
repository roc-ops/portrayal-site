<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.7mm" height="40.6mm" viewBox="0 0 73.7 40.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='nokia/sr-1-psu-ac@'] .state-fault { --led-color: #f5a623; }
    g[data-ref^='nokia/sr-1-psu-ac@'] .state-on { --led-color: #39b54a; }</style>
  <g id="sr-1-psu-ac" data-path="sr-1-psu-ac" data-class="psu" data-behaviour="fills" data-ref="nokia/sr-1-psu-ac@1:1.0.0" data-body-depth="302.3" data-input="ac" data-model="7750 SR-1 AC Power Supply" data-part-number="3HE12301AA" data-power-output-w="1600" data-weight-kg="1.18" transform="translate(0,0)">
    <title>sr-1-psu-ac</title>
    <rect id="sr-1-psu-ac--face" x="0" y="0" width="73.7" height="40.6" rx="0.6" fill="#a3a9b0" stroke="#3a3f44" stroke-width="0.4" />
    <rect id="sr-1-psu-ac--inlet-bezel" x="42.0" y="3.3" width="23.0" height="29.6" rx="1.4" fill="#959ba2" stroke="#3a3f44" stroke-width="0.3" />
    <g id="sr-1-psu-ac--fan-guard" data-path="sr-1-psu-ac/fan-guard" data-class="vent" data-z-vent="8.0">
      <circle cx="21.7" cy="20.3" r="16.5" fill="#1a1c1f" />
      <path d="M 21.7 20.3 L 10.5 9.1 A 15.8 15.8 0 0 1 32.9 9.1 Z" fill="#c9cdd2" />
      <path d="M 21.7 20.3 L 32.9 9.1 A 15.8 15.8 0 0 1 32.9 31.5 Z" fill="#c9cdd2" />
      <path d="M 21.7 20.3 L 32.9 31.5 A 15.8 15.8 0 0 1 10.5 31.5 Z" fill="#c9cdd2" />
      <path d="M 21.7 20.3 L 10.5 31.5 A 15.8 15.8 0 0 1 10.5 9.1 Z" fill="#c9cdd2" />
      <path d="M 10.0 8.6 L 33.4 32.0 M 33.4 8.6 L 10.0 32.0 M 21.7 4.0 V 36.6 M 5.4 20.3 H 38.0" stroke="#1a1c1f" stroke-width="1.3" />
      <circle cx="21.7" cy="20.3" r="7.2" fill="#1a1c1f" />
      <circle cx="21.7" cy="20.3" r="6.2" fill="#c9cdd2" stroke="#1a1c1f" stroke-width="0.3" />
      <circle cx="21.7" cy="20.3" r="16.5" fill="none" stroke="#3a3f44" stroke-width="0.5" />
    </g>
    <g id="sr-1-psu-ac--guard-screws" fill="#8a9097" stroke="#3a3f44" stroke-width="0.3">
      <circle cx="6.2" cy="5.5" r="2.9" />
      <circle cx="38.0" cy="5.5" r="2.9" />
      <circle cx="6.2" cy="35.9" r="2.9" />
      <circle cx="38.0" cy="35.9" r="2.9" />
      <path d="M 4.6 5.5 H 7.8 M 6.2 3.9 V 7.1 M 36.4 5.5 H 39.6 M 38.0 3.9 V 7.1 M 4.6 35.9 H 7.8 M 6.2 34.3 V 37.5 M 36.4 35.9 H 39.6 M 38.0 34.3 V 37.5" fill="none" stroke-width="0.45" />
    </g>
    <rect id="sr-1-psu-ac--latch-slot" x="68.1" y="5.9" width="1.5" height="6.6" rx="0.5" fill="#2a2d31" />
    <rect id="sr-1-psu-ac--clei-label" x="43.3" y="33.4" width="18.8" height="5.6" fill="#eceef0" stroke="#3a3f44" stroke-width="0.25" data-path="sr-1-psu-ac/clei-label" data-class="label" />
    <g id="sr-1-psu-ac--handle" data-path="sr-1-psu-ac/handle" data-class="handle" data-z-uhandle="14.0" data-z-dia="3.0">
      <path d="M 4.1 12.0 V 24.6 Q 4.1 26.1 5.6 26.1 H 38.2 Q 39.7 26.1 39.7 24.6 V 12.0" fill="none" stroke="#2a2d31" stroke-width="3.0" stroke-linecap="round" />
      <path d="M 4.1 12.0 V 24.6 Q 4.1 26.1 5.6 26.1 H 38.2 Q 39.7 26.1 39.7 24.6 V 12.0" fill="none" stroke="#5a6067" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <rect id="sr-1-psu-ac--latch" x="65.2" y="14.2" width="3.8" height="14.4" rx="1.9" fill="#6f757c" stroke="#2a2d31" stroke-width="0.35" data-path="sr-1-psu-ac/latch" data-class="latch" data-z-out="1.5" />
    <g id="sr-1-psu-ac--inlet" data-path="sr-1-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(39.5,8.1) rotate(90 14.0 10.0)" data-group="inlets" data-group-role="service" data-description="the supply's single IEC C14 AC inlet">
      <title>sr-1-psu-ac--inlet</title>
      <rect id="sr-1-psu-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="sr-1-psu-ac/inlet/opening" data-class="cutout" />
      <path id="sr-1-psu-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="sr-1-psu-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="sr-1-psu-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="sr-1-psu-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g id="sr-1-psu-ac--led-status" data-path="sr-1-psu-ac/led-status" data-class="led" data-ref="common/led-dot@1:1.1.0" transform="translate(66.6,31.5)" data-group="status-leds" data-group-role="indicator" data-description="the supply's single status lamp, lower right of the face">
      <title>sr-1-psu-ac--led-status</title>
      <circle id="sr-1-psu-ac--led-status--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="sr-1-psu-ac--led-status--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="sr-1-psu-ac/led-status/lamp" data-class="led" data-states="off on fault" data-z-dome="0.3" />
    </g>
    <g data-cp="mate" data-cp-at="36.85 20.3" data-cp-dir="rear" />
  </g>
</svg>
