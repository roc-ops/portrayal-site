<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="82mm" height="14mm" viewBox="-2.4 -0.2 82 14">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="cfp-sc" data-path="cfp-sc" data-class="transceiver" data-behaviour="occupies" data-ref="generic/cfp-sc@1:1.0.1" data-depth="130.25" data-face="sc-duplex" data-form-factor="cfp" data-media="fiber" data-power-absent="not-applicable" transform="translate(0,0)">
    <title>cfp-sc</title>
    <rect id="cfp-sc--body" x="-2.3" y="-0.1" width="81.8" height="13.8" rx="0.6" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2" data-z-out="14.5" data-z-color="#9aa0a8" />
    <g font-family="sans-serif" font-size="0.9" fill="#2a2f34" text-anchor="middle">
      <g id="cfp-sc--silkscreen">
        <text x="32.25" y="12.1">T</text>
        <text x="44.95" y="12.1">R</text>
        <text id="cfp-sc--label" x="38.6" y="13.3" data-from="label" font-size="0.7" />
      </g>
    </g>
    <g id="cfp-sc--tx" data-path="cfp-sc/tx" data-class="port" data-ref="std/sc-bore@1:1.0.0" data-depth="6.0" data-wall="#4a4f55" data-cavity="bore" data-connector="sc" data-media="fiber" transform="translate(28.055,1.855) rotate(90 4.195 4.5)" data-z-lift="14.5">
      <title>cfp-sc--tx</title>
      <path id="cfp-sc--tx--bore" fill="#15181b" d="     M 0.89 0 H 8.39 V 9 H 0.89 V 5.55 H 0 V 3.45 H 0.89 Z" data-path="cfp-sc/tx/bore" data-class="cutout" />
      <rect id="cfp-sc--tx--hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <rect id="cfp-sc--tx--hook-lower" x="1.9" y="7.2" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <circle id="cfp-sc--tx--collar" cx="4.64" cy="4.5" r="2.34" fill="#262a2f" stroke="#3a4046" stroke-width="0.12" data-z-top="3.8" />
      <circle id="cfp-sc--tx--sleeve" cx="4.64" cy="4.5" r="1.65" fill="#1e2226" />
      <circle id="cfp-sc--tx--ferrule" cx="4.64" cy="4.5" r="1.25" fill="#e8ecef" data-z-top="4.8" data-z-color="#e8ecef" />
      <g data-cp="mate" data-cp-at="4.64 4.5" data-cp-dir="front" />
    </g>
    <g id="cfp-sc--rx" data-path="cfp-sc/rx" data-class="port" data-ref="std/sc-bore@1:1.0.0" data-depth="6.0" data-wall="#4a4f55" data-cavity="bore" data-connector="sc" data-media="fiber" transform="translate(40.755,1.855) rotate(90 4.195 4.5)" data-z-lift="14.5">
      <title>cfp-sc--rx</title>
      <path id="cfp-sc--rx--bore" fill="#15181b" d="     M 0.89 0 H 8.39 V 9 H 0.89 V 5.55 H 0 V 3.45 H 0.89 Z" data-path="cfp-sc/rx/bore" data-class="cutout" />
      <rect id="cfp-sc--rx--hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <rect id="cfp-sc--rx--hook-lower" x="1.9" y="7.2" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <circle id="cfp-sc--rx--collar" cx="4.64" cy="4.5" r="2.34" fill="#262a2f" stroke="#3a4046" stroke-width="0.12" data-z-top="3.8" />
      <circle id="cfp-sc--rx--sleeve" cx="4.64" cy="4.5" r="1.65" fill="#1e2226" />
      <circle id="cfp-sc--rx--ferrule" cx="4.64" cy="4.5" r="1.25" fill="#e8ecef" data-z-top="4.8" data-z-color="#e8ecef" />
      <g data-cp="mate" data-cp-at="4.64 4.5" data-cp-dir="front" />
    </g>
    <g id="cfp-sc--screw-l" data-path="cfp-sc/screw-l" data-class="screw" data-ref="common/cfp-thumbscrew@1:1.0.0" data-role="fastener" transform="translate(-2.0,2.2)" data-z-lift="14.5">
      <title>cfp-sc--screw-l</title>
      <circle id="cfp-sc--screw-l--knob" cx="4.6" cy="4.6" r="4.6" fill="#6f6f6f" stroke="#444444" stroke-width="0.18" data-fill-from="latch-color" data-stroke-derive="latch-color" data-path="cfp-sc/screw-l/knob" data-class="screw" data-z-cyl="9.5" data-z-knurl="1" />
      <path id="cfp-sc--screw-l--cross" d="M 2.3 4.6 H 6.9 M 4.6 2.3 V 6.9" fill="none" stroke="#2a2f34" stroke-width="0.5" stroke-linecap="round" />
    </g>
    <g id="cfp-sc--screw-r" data-path="cfp-sc/screw-r" data-class="screw" data-ref="common/cfp-thumbscrew@1:1.0.0" data-role="fastener" transform="translate(70.0,2.2)" data-z-lift="14.5">
      <title>cfp-sc--screw-r</title>
      <circle id="cfp-sc--screw-r--knob" cx="4.6" cy="4.6" r="4.6" fill="#6f6f6f" stroke="#444444" stroke-width="0.18" data-fill-from="latch-color" data-stroke-derive="latch-color" data-path="cfp-sc/screw-r/knob" data-class="screw" data-z-cyl="9.5" data-z-knurl="1" />
      <path id="cfp-sc--screw-r--cross" d="M 2.3 4.6 H 6.9 M 4.6 2.3 V 6.9" fill="none" stroke="#2a2f34" stroke-width="0.5" stroke-linecap="round" />
    </g>
    <g data-cp="mate" data-cp-at="38.6 6.8" data-cp-dir="front" />
    <g data-cp="optical-rx" data-cp-at="44.95 6.8" data-cp-dir="front" />
    <g data-cp="optical-tx" data-cp-at="32.25 6.8" data-cp-dir="front" />
  </g>
</svg>
