      <rect id="breaker-1ru--guard-occupant--hood" x="1.4" y="2.6" width="15.0" height="33.9" rx="2.2" fill="#1b1e20" stroke="#08090a" stroke-width="0.25" data-path="breaker-1ru/guard-occupant/hood" data-class="mechanical" data-z-out="14.7" data-z-color="#17191b" data-z-shape="1" />
