<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="13.1mm" viewBox="0 -3.2 18.35 13.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qsfp28-passive-dac" data-path="qsfp28-passive-dac" data-class="transceiver" data-behaviour="occupies" data-ref="amphenol/qsfp28-passive-dac@1:1.1.0" data-body-depth="52.4" data-cable-kind="dac" data-model="NDAAFR" data-power-absent="not-published" data-rate="qsfp28" data-speed="100g" transform="translate(0,0)">
    <title>qsfp28-passive-dac</title>
    <g id="qsfp28-passive-dac--body" data-path="qsfp28-passive-dac/body" data-class="transceiver" data-behaviour="occupies" data-ref="generic/qsfp-cable@1:1.0.1" data-depth="52.4" data-face="cable" data-form-factor="qsfp" data-latch-color="#009a44" data-power-absent="not-applicable" transform="translate(0,0)">
      <title>qsfp28-passive-dac--body</title>
      <rect id="qsfp28-passive-dac--body--head" x="0" y="-3.2" width="18.35" height="13.10" rx="0.6" fill="#9aa0a6" stroke="#5f656b" stroke-width="0.18" data-z-out="19.8" data-z-color="#9aa0a6" />
      <circle id="qsfp28-passive-dac--body--relief-boot" cx="9.175" cy="4.25" r="5.5" fill="#2b2b2b" stroke="#161616" stroke-width="0.15" data-z-cyl="15" data-z-lift="19.8" data-z-color="#2b2b2b" />
      <circle id="qsfp28-passive-dac--body--stub" cx="9.175" cy="4.25" r="3.45" fill="#1c1c1c" stroke="#111111" stroke-width="0.12" data-r-from="cable-od" data-fill-from="jacket-color" data-z-cyl="30" data-z-lift="34.8" />
      <rect id="qsfp28-passive-dac--body--strap" x="5.3" y="-2.05" width="7.75" height="0.8" rx="0.2" fill="#009a44" stroke="#005e29" stroke-width="0.12" data-fill-from="latch-color" data-stroke-derive="latch-color" data-z-out="63.5" data-z-lift="19.8" />
      <rect id="qsfp28-passive-dac--body--strap-ring" x="0.275" y="-2.475" width="17.8" height="1.65" rx="0.4" fill="#009a44" stroke="#005e29" stroke-width="0.12" data-fill-from="latch-color" data-stroke-derive="latch-color" data-z-out="81.3" data-z-lift="63.5" />
      <g data-cp="cable" data-cp-at="9.175 4.25" data-cp-dir="front" data-cp-on="qsfp28-passive-dac--body--stub" />
      <g data-cp="mate" data-cp-at="9.175 4.25" data-cp-dir="front" />
    </g>
    <g data-cp="mate" data-cp-at="9.175 4.25" data-cp-dir="front" />
  </g>
</svg>
