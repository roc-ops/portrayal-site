      <rect x="10" y="44.4" width="142.8" height="206.6" rx="19" fill="none" stroke="#d6d8da" stroke-width="0.6" stroke-dasharray="3 2" />
    </g>
    <g id="3fe54221-interior--retainer-top" data-path="3fe54221-interior/retainer-top" data-class="latch">
