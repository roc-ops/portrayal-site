      <rect x="1.275" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78" data-fill-from="housing-finish" />
      <rect x="3.495" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78" data-fill-from="housing-finish" />
    </g>
    <g id="lc-duplex-shuttered-adapter--shutter-rx">
      <rect x="7.525" y="3.65" width="4.3" height="4.3" fill="#0f1318" />
      <rect x="7.525" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78" data-fill-from="housing-finish" />
      <rect x="9.745" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78" data-fill-from="housing-finish" />
    </g>
    <path id="lc-duplex-shuttered-adapter--bezel" fill-rule="evenodd" fill="#368ad4" stroke="#215481" stroke-width="0.15" data-fill-from="housing-finish" data-stroke-derive="housing-finish" d="M 0.1 0.1 h 12.9 v 11.4 h -12.9 z            M 2.105 1.85 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7              h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z            M 8.355 1.85 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7              h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z" data-z-out="3.175" />
    <g data-cp="optical" data-cp-at="6.55 5.8" data-cp-dir="front" />
