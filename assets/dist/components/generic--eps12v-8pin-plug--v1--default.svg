    <circle id="eps12v-8pin-plug--stub" cx="6.3" cy="9" r="4.5" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-r-from="cable-od" data-fill-from="jacket-color" data-z-cyl="22.1" data-z-lift="28.0" />
