<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40.0mm" viewBox="0 0 73.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="dcp-2-psu-ac" data-path="dcp-2-psu-ac" data-class="psu" data-behaviour="fills" data-ref="smartoptics/dcp-2-psu-ac@1:1.0.0" data-airflow="front-to-back" data-input="ac" data-model="DCP-2-PSU-AC-FB" data-power-output-w="460" data-states="ok fail absent" transform="translate(0,0)">
    <title>dcp-2-psu-ac</title>
    <defs>
      <linearGradient id="dcp-2-psu-ac--metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c3c8cd" />
        <stop offset="0.55" stop-color="#a8aeb4" />
        <stop offset="1" stop-color="#8d9399" />
      </linearGradient>
      <radialGradient id="dcp-2-psu-ac--fanwell" cx="0.5" cy="0.45" r="0.62">
        <stop offset="0" stop-color="#2a2e32" />
        <stop offset="1" stop-color="#111417" />
      </radialGradient>
    </defs>
    <rect id="dcp-2-psu-ac--body" x="0" y="0" width="73.5" height="40" rx="0.8" fill="url(#dcp-2-psu-ac--metal)" stroke="#6d7278" stroke-width="0.3" />
    <g id="dcp-2-psu-ac--fan-aperture" data-path="dcp-2-psu-ac/fan-aperture" data-class="vent">
      <rect x="8.45" y="8" width="34.1" height="30" rx="1.4" fill="url(#dcp-2-psu-ac--fanwell)" stroke="#70767c" stroke-width="0.35" />
      <circle cx="25.5" cy="23" r="13.4" fill="none" stroke="#3d4247" stroke-width="0.5" />
      <circle cx="25.5" cy="23" r="10.0" fill="none" stroke="#33373b" stroke-width="0.45" />
      <circle cx="25.5" cy="23" r="6.2" fill="none" stroke="#33373b" stroke-width="0.45" />
      <circle cx="25.5" cy="23" r="3.7" fill="#4a5055" />
      <g stroke="#3d4247" stroke-width="0.4">
        <path d="M 25.5 9.6 V 36.4" />
        <path d="M 12.1 23 H 38.9" />
        <path d="M 16.0 13.5 L 35.0 32.5" />
        <path d="M 35.0 13.5 L 16.0 32.5" />
      </g>
    </g>
    <g id="dcp-2-psu-ac--handle" data-path="dcp-2-psu-ac/handle" data-class="handle">
      <rect x="4.5" y="3.5" width="35.5" height="5" rx="2.4" fill="#26292c" stroke="#141618" stroke-width="0.25" />
      <rect x="6.6" y="4.9" width="31.3" height="2.2" rx="1.1" fill="#3a3e42" />
    </g>
    <g id="dcp-2-psu-ac--latch" data-path="dcp-2-psu-ac/latch" data-class="latch">
      <rect x="66" y="14.5" width="7" height="22.5" rx="1.6" fill="#e2621d" stroke="#a8430f" stroke-width="0.3" />
      <rect x="67.4" y="17.0" width="4.2" height="17.5" rx="1.1" fill="#f07a33" />
    </g>
    <g id="dcp-2-psu-ac--screws" fill="#9aa0a6" stroke="#5f646a" stroke-width="0.28">
      <circle id="dcp-2-psu-ac--screw-left" cx="8.0" cy="37.0" r="1.8" data-path="dcp-2-psu-ac/screw-left" data-class="fastener" />
      <circle id="dcp-2-psu-ac--screw-mid" cx="39.5" cy="37.0" r="1.8" data-path="dcp-2-psu-ac/screw-mid" data-class="fastener" />
    </g>
    <g stroke="#5f646a" stroke-width="0.3" fill="none">
      <path d="M 6.8 35.8 L 9.2 38.2 M 9.2 35.8 L 6.8 38.2" />
      <path d="M 38.3 35.8 L 40.7 38.2 M 40.7 35.8 L 38.3 38.2" />
    </g>
    <circle id="dcp-2-psu-ac--lamp-status" cx="57.4" cy="37.2" r="1.8" fill="#1d2124" stroke="#5f646a" stroke-width="0.3" data-path="dcp-2-psu-ac/lamp-status" data-class="indicator" />
    <g id="dcp-2-psu-ac--inlet" data-path="dcp-2-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(41.5,10.0) rotate(270 14.0 10.0)">
      <title>dcp-2-psu-ac--inlet</title>
      <rect id="dcp-2-psu-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="dcp-2-psu-ac/inlet/opening" data-class="cutout" />
      <path id="dcp-2-psu-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="dcp-2-psu-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="dcp-2-psu-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="dcp-2-psu-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
    </g>
  </g>
</svg>
