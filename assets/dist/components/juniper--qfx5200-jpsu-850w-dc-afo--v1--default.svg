<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.8mm" height="40.2mm" viewBox="0 0 54.8 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5200-jpsu-850w-dc-afo@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5200-jpsu-850w-dc-afo@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5200-jpsu-850w-dc-afo" data-path="qfx5200-jpsu-850w-dc-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5200-jpsu-850w-dc-afo@1:1.0.0" data-airflow="front-to-back" data-inlet="dc-terminal" data-input="rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (QFX5200-32C, guide Table 25)" data-model="JPSU-850W-DC-AFO" data-power-output-w="850" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5200-jpsu-850w-dc-afo</title>
    <rect id="qfx5200-jpsu-850w-dc-afo--face" x="0" y="0" width="54.8" height="40.2" rx="0.8" fill="#1c1e21" stroke="#181b1f" stroke-width="0.4" />
    <g id="qfx5200-jpsu-850w-dc-afo--terminals" data-path="qfx5200-jpsu-850w-dc-afo/terminals" data-class="terminal" data-z-out="2.2" data-z-color="#111316">
      <rect id="qfx5200-jpsu-850w-dc-afo--terminal-plate" x="11.8" y="5.6" width="33.0" height="10.2" rx="1.0" fill="#111316" stroke="#3a3e43" stroke-width="0.4" />
      <g id="qfx5200-jpsu-850w-dc-afo--studs">
        <g id="qfx5200-jpsu-850w-dc-afo--stud-0" data-z-cyl="5.0" data-z-lift="2.2" data-z-thread="1.0">
          <polygon points="17.7,10.6 16.45,12.77 13.95,12.77 12.7,10.6 13.95,8.43 16.45,8.43" fill="#4a4f55" stroke="#6d7379" stroke-width="0.35" />
          <circle cx="15.2" cy="10.6" r="1.7" fill="#33373c" stroke="#565b60" stroke-width="0.3" />
        </g>
        <g id="qfx5200-jpsu-850w-dc-afo--stud-1" data-z-cyl="5.0" data-z-lift="2.2" data-z-thread="1.0">
          <polygon points="26.1,10.6 24.85,12.77 22.35,12.77 21.1,10.6 22.35,8.43 24.85,8.43" fill="#4a4f55" stroke="#6d7379" stroke-width="0.35" />
          <circle cx="23.6" cy="10.6" r="1.7" fill="#33373c" stroke="#565b60" stroke-width="0.3" />
        </g>
        <g id="qfx5200-jpsu-850w-dc-afo--stud-2" data-z-cyl="5.0" data-z-lift="2.2" data-z-thread="1.0">
          <polygon points="34.5,10.6 33.25,12.77 30.75,12.77 29.5,10.6 30.75,8.43 33.25,8.43" fill="#4a4f55" stroke="#6d7379" stroke-width="0.35" />
          <circle cx="32.0" cy="10.6" r="1.7" fill="#33373c" stroke="#565b60" stroke-width="0.3" />
        </g>
        <g id="qfx5200-jpsu-850w-dc-afo--stud-3" data-z-cyl="5.0" data-z-lift="2.2" data-z-thread="1.0">
          <polygon points="42.9,10.6 41.65,12.77 39.15,12.77 37.9,10.6 39.15,8.43 41.65,8.43" fill="#4a4f55" stroke="#6d7379" stroke-width="0.35" />
          <circle cx="40.4" cy="10.6" r="1.7" fill="#33373c" stroke="#565b60" stroke-width="0.3" />
        </g>
      </g>
    </g>
    <g id="qfx5200-jpsu-850w-dc-afo--earth-screw">
      <circle cx="48.0" cy="10.6" r="1.8" fill="#3a3e43" stroke="#6d7379" stroke-width="0.3" />
      <path d="M 46.9 10.6 H 49.1 M 48.0 9.5 V 11.7" stroke="#8b9097" stroke-width="0.3" />
    </g>
    <g id="qfx5200-jpsu-850w-dc-afo--silkscreen" font-family="sans-serif" font-size="1.9" fill="#c7ccd1" text-anchor="middle">
      <text x="15.2" y="4.6">V-</text>
      <text x="23.6" y="4.6">V-</text>
      <text x="32.0" y="4.6">V+</text>
      <text x="40.4" y="4.6">V+</text>
      <text x="19.3" y="19.6" text-anchor="start">IN</text>
      <text x="26.5" y="19.6" text-anchor="start">OUT</text>
      <text x="33.7" y="19.6" text-anchor="start">!</text>
      <path d="M 46.4 35.0 V 32.6 M 44.8 35.0 H 48.0 M 45.4 36.2 H 47.4 M 46.0 37.4 H 46.8" stroke="#c7ccd1" stroke-width="0.3" fill="none" />
    </g>
    <g id="qfx5200-jpsu-850w-dc-afo--vents">
      <rect x="11.8" y="23.0" width="5.6" height="4.2" rx="0.6" fill="#101214" />
      <rect x="19.4" y="23.0" width="5.6" height="4.2" rx="0.6" fill="#101214" />
      <rect x="27.0" y="23.0" width="5.6" height="4.2" rx="0.6" fill="#101214" />
      <rect x="11.8" y="29.4" width="5.6" height="4.2" rx="0.6" fill="#101214" />
      <rect x="19.4" y="29.4" width="5.6" height="4.2" rx="0.6" fill="#101214" />
      <rect x="27.0" y="29.4" width="5.6" height="4.2" rx="0.6" fill="#101214" />
      <circle cx="41.5" cy="32.2" r="2.8" fill="#101214" />
    </g>
    <g id="qfx5200-jpsu-850w-dc-afo--lamps">
      <circle id="qfx5200-jpsu-850w-dc-afo--led-in" cx="17.5" cy="17.1" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5200-jpsu-850w-dc-afo/led-in" data-class="led" data-states="green off" />
      <circle id="qfx5200-jpsu-850w-dc-afo--led-out" cx="24.7" cy="17.1" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5200-jpsu-850w-dc-afo/led-out" data-class="led" data-states="green off" />
      <circle id="qfx5200-jpsu-850w-dc-afo--led-fault" cx="31.9" cy="17.1" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5200-jpsu-850w-dc-afo/led-fault" data-class="led" data-states="amber off" />
    </g>
    <g id="qfx5200-jpsu-850w-dc-afo--latch" data-path="qfx5200-jpsu-850w-dc-afo/latch" data-class="latch" data-z-out="1.6" data-z-color="#e8731f">
      <rect x="0.7" y="1.5" width="10.3" height="22.3" rx="1.4" fill="#e8731f" stroke="#b95812" stroke-width="0.4" />
      <rect x="3.6" y="7.0" width="2.4" height="9.4" rx="0.8" fill="#d3661a" />
