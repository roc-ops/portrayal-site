<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="55.0mm" height="41.1mm" viewBox="0 0 55.0 41.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5130-jpsu-1600-ac-afi@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5130-jpsu-1600-ac-afi@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5130-jpsu-1600-ac-afi" data-path="qfx5130-jpsu-1600-ac-afi" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5130-jpsu-1600-ac-afi@1:1.0.0" data-airflow="back-to-front" data-input="100 to 127 VAC 12 A, 200 to 240 VAC 8 A (QFX5130-32CD) or 9 A (QFX5130-48C and -48CM), 50 to 60 Hz (guide Tables 19, 20)" data-model="JPSU-1600W-1UACAFI" data-power-output-w="1600" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5130-jpsu-1600-ac-afi</title>
    <defs>
      <pattern id="qfx5130-jpsu-1600-ac-afi--grid" width="3.8" height="3.8" patternUnits="userSpaceOnUse">
        <rect x="0.45" y="0.45" width="2.9" height="2.9" fill="#07080a" />
      </pattern>
    </defs>
    <rect id="qfx5130-jpsu-1600-ac-afi--face" x="0" y="0" width="55.0" height="41.1" rx="0.8" fill="#1c1e21" stroke="#181b1f" stroke-width="0.4" />
    <g id="qfx5130-jpsu-1600-ac-afi--vents">
      <rect x="0.8" y="0.8" width="25.8" height="39.5" fill="#2b2e32" />
      <rect x="0.8" y="0.8" width="25.8" height="39.5" fill="url(#qfx5130-jpsu-1600-ac-afi--grid)" />
      <rect x="26.6" y="33.2" width="25.6" height="7.1" fill="#2b2e32" />
      <rect x="26.6" y="33.2" width="25.6" height="7.1" fill="url(#qfx5130-jpsu-1600-ac-afi--grid)" />
      <rect x="49.9" y="0.8" width="3.8" height="32.4" fill="#2b2e32" />
      <rect x="49.9" y="0.8" width="3.8" height="32.4" fill="url(#qfx5130-jpsu-1600-ac-afi--grid)" />
    </g>
    <rect id="qfx5130-jpsu-1600-ac-afi--inlet-bay" x="26.6" y="2.4" width="23.2" height="30.6" rx="0.8" fill="#121416" stroke="#2b2e32" stroke-width="0.3" />
    <circle cx="38.2" cy="36.1" r="1.6" fill="#07080a" />
    <g id="qfx5130-jpsu-1600-ac-afi--silkscreen" font-family="sans-serif" font-size="1.9" fill="#e8eaec">
      <text x="9.2" y="15.5">AC</text>
      <text x="9.2" y="20.9">DC</text>
      <text x="9.2" y="27.1">!</text>
    </g>
    <g id="qfx5130-jpsu-1600-ac-afi--lamps">
      <circle id="qfx5130-jpsu-1600-ac-afi--led-ac" cx="7.1" cy="14.8" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5130-jpsu-1600-ac-afi/led-ac" data-class="led" data-states="green amber off" />
      <circle id="qfx5130-jpsu-1600-ac-afi--led-dc" cx="7.1" cy="20.2" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5130-jpsu-1600-ac-afi/led-dc" data-class="led" data-states="green off" />
      <circle id="qfx5130-jpsu-1600-ac-afi--led-fault" cx="7.1" cy="26.4" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5130-jpsu-1600-ac-afi/led-fault" data-class="led" data-states="amber off" />
    </g>
    <g id="qfx5130-jpsu-1600-ac-afi--release-latch" data-path="qfx5130-jpsu-1600-ac-afi/release-latch" data-class="latch">
      <rect x="44.9" y="19.8" width="8.9" height="21.0" rx="1.6" fill="#232528" stroke="#3a3e43" stroke-width="0.35" />
      <rect x="48.4" y="24.4" width="1.8" height="10.6" rx="0.6" fill="#08090a" />
    </g>
    <g id="qfx5130-jpsu-1600-ac-afi--latch" data-path="qfx5130-jpsu-1600-ac-afi/latch" data-class="latch" data-z-out="1.6" data-z-color="#2a8bd8">
      <rect x="12.0" y="1.2" width="6.1" height="38.7" rx="3.0" fill="#2a8bd8" stroke="#1d5f96" stroke-width="0.4" />
      <rect x="12.0" y="1.2" width="9.0" height="5.0" rx="2.4" fill="#2a8bd8" stroke="#1d5f96" stroke-width="0.4" />
      <rect x="12.0" y="34.9" width="9.0" height="5.0" rx="2.4" fill="#2a8bd8" stroke="#1d5f96" stroke-width="0.4" />
      <rect x="13.8" y="5.0" width="2.6" height="31.0" rx="1.3" fill="#2579bf" />
    </g>
    <g id="qfx5130-jpsu-1600-ac-afi--inlet" data-path="qfx5130-jpsu-1600-ac-afi/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(24.3,7.7) rotate(90 14.0 10.0)">
      <title>qfx5130-jpsu-1600-ac-afi--inlet</title>
      <rect id="qfx5130-jpsu-1600-ac-afi--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="qfx5130-jpsu-1600-ac-afi/inlet/opening" data-class="cutout" />
      <path id="qfx5130-jpsu-1600-ac-afi--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="qfx5130-jpsu-1600-ac-afi--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx5130-jpsu-1600-ac-afi--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx5130-jpsu-1600-ac-afi--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
