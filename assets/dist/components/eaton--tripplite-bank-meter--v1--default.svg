    g[data-ref^='eaton/tripplite-bank-meter@'] .state-4 [data-seg='f'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-4 [data-seg='g'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-4 [data-seg='b'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-4 [data-seg='c'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-4 [data-seg='a'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-4 [data-seg='d'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-4 [data-seg='e'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-5 [data-seg='a'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-5 [data-seg='f'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-5 [data-seg='g'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-5 [data-seg='c'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-5 [data-seg='d'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-5 [data-seg='b'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-5 [data-seg='e'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-6 [data-seg='a'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-6 [data-seg='f'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-6 [data-seg='g'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-6 [data-seg='e'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-6 [data-seg='c'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-6 [data-seg='d'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-6 [data-seg='b'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-7 [data-seg='a'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-7 [data-seg='b'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-7 [data-seg='c'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-7 [data-seg='d'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-7 [data-seg='e'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-7 [data-seg='f'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-7 [data-seg='g'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-8 [data-seg='a'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-8 [data-seg='b'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-8 [data-seg='c'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-8 [data-seg='d'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-8 [data-seg='e'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-8 [data-seg='f'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-8 [data-seg='g'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-9 [data-seg='a'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-9 [data-seg='b'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-9 [data-seg='c'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-9 [data-seg='d'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-9 [data-seg='f'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-9 [data-seg='g'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-9 [data-seg='e'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-bank-meter@'] .state-blank [data-seg='a'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-blank [data-seg='b'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-blank [data-seg='c'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-blank [data-seg='d'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-blank [data-seg='e'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-blank [data-seg='f'] ,g[data-ref^='eaton/tripplite-bank-meter@'] .state-blank [data-seg='g'] { opacity: 0; }</style>
  <g id="tripplite-bank-meter" data-path="tripplite-bank-meter" data-class="display" data-ref="eaton/tripplite-bank-meter@1:1.0.0" transform="translate(0,0)">
    <title>tripplite-bank-meter</title>
    <circle id="tripplite-bank-meter--screw-top" cx="10.8" cy="3.3" r="2.4" fill="#1f2022" stroke="#4a4d51" stroke-width="0.2" />
    <circle id="tripplite-bank-meter--screw-bottom" cx="10.8" cy="28.5" r="2.4" fill="#1f2022" stroke="#4a4d51" stroke-width="0.2" />
