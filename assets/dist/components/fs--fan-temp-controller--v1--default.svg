<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="78.0mm" height="34.7mm" viewBox="0 0 78.0 34.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='fs/fan-temp-controller@'] .state-setting { --led-color: #e5242b; }
    g[data-ref^='fs/fan-temp-controller@'] .state-setting { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='fs/fan-temp-controller@'] .state-waiting { --led-color: #e5242b; }
    g[data-ref^='fs/fan-temp-controller@'] .state-waiting { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='fs/fan-temp-controller@'] .state-working { --led-color: #e5242b; }</style>
  <g id="fan-temp-controller" data-path="fan-temp-controller" data-class="control-panel" data-ref="fs/fan-temp-controller@1:1.0.0" data-output="one relay, 10 A / 220 VAC" data-power-draw-max-w="3" data-range="-40 to 99 C" data-sensor="one NTC" transform="translate(0,0)">
    <title>fan-temp-controller</title>
    <rect id="fan-temp-controller--bezel" x="0" y="0" width="78" height="34.7" rx="1.2" fill="#2b2e31" stroke="#141618" stroke-width="0.4" />
    <rect x="2.2" y="2.2" width="73.6" height="30.3" rx="0.8" fill="#34383c" />
    <rect id="fan-temp-controller--display" x="18.3" y="8.1" width="41.0" height="18.1" fill="#1a0b0c" stroke="#0b0c0d" stroke-width="0.4" data-path="fan-temp-controller/display" data-class="display" data-characters="2" data-messages="HH LL __ HC" />
    <circle id="fan-temp-controller--lamp-load" cx="25.0" cy="11.9" r="1.0" fill="var(--led-color, #3a1a1b)" data-path="fan-temp-controller/lamp-load" data-class="led" data-states="off working waiting" />
    <circle id="fan-temp-controller--lamp-set" cx="25.0" cy="22.0" r="1.0" fill="var(--led-color, #3a1a1b)" data-path="fan-temp-controller/lamp-set" data-class="led" data-states="off setting" />
    <g id="fan-temp-controller--key-set" data-path="fan-temp-controller/key-set" data-class="button">
      <rect x="7.0" y="9.7" width="9.2" height="4.2" rx="0.8" fill="#8d9298" />
    </g>
    <g id="fan-temp-controller--key-power" data-path="fan-temp-controller/key-power" data-class="button">
      <rect x="7.0" y="20.6" width="9.2" height="4.2" rx="0.8" fill="#8d9298" />
    </g>
    <g id="fan-temp-controller--key-up" data-path="fan-temp-controller/key-up" data-class="button">
      <rect x="61.8" y="9.7" width="9.2" height="4.2" rx="0.8" fill="#8d9298" />
    </g>
    <g id="fan-temp-controller--key-down" data-path="fan-temp-controller/key-down" data-class="button">
      <rect x="61.8" y="20.6" width="9.2" height="4.2" rx="0.8" fill="#8d9298" />
    </g>
    <g id="fan-temp-controller--silkscreen" fill="#d9dcdf" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="11.6" y="12.9" font-size="2.4" fill="#2b2e31">SET</text>
      <path d="M10.6,21.7 A1.4,1.4 0 1 0 12.6,21.7 M11.6,21.2 V22.6" fill="none" stroke="#2b2e31" stroke-width="0.35" />
      <path d="M65.2,12.6 L66.4,11.0 L67.6,12.6" fill="none" stroke="#2b2e31" stroke-width="0.4" />
      <path d="M65.2,21.9 L66.4,23.5 L67.6,21.9" fill="none" stroke="#2b2e31" stroke-width="0.4" />
      <text x="38.8" y="6.8" font-size="1.8">WORK</text>
      <text x="38.8" y="29.4" font-size="1.8">SET</text>
      <text x="72.8" y="5.6" font-size="2.0">°C</text>
    </g>
  </g>
</svg>
