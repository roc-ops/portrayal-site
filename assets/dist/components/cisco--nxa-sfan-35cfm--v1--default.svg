<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40.8mm" height="40.7mm" viewBox="0 0 40.8 40.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/nxa-sfan-35cfm@'] .state-fault { --led-color: #ef4444; }
    g[data-ref^='cisco/nxa-sfan-35cfm@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="nxa-sfan-35cfm" data-path="nxa-sfan-35cfm" data-class="fan" data-behaviour="fills" data-ref="cisco/nxa-sfan-35cfm@1:1.0.0" data-wall="#15181b" data-airflow="front-to-back" data-model="NXA-SFAN-35CFM" data-power-absent="not-published" data-rotors="2" data-weight-kg="0.13" data-states="absent" transform="translate(0,0)">
    <title>nxa-sfan-35cfm</title>
    <defs>
      <pattern id="nxa-sfan-35cfm--nxa-sfan-mesh" width="4.43" height="2.56" patternUnits="userSpaceOnUse">
        <path d="M 1.275 0 L 0.638 1.104 L -0.638 1.104 L -1.275 0 L -0.638 -1.104 L 0.638 -1.104 Z" fill="#0d0f11" />
        <path d="M 5.705 0 L 5.068 1.104 L 3.792 1.104 L 3.155 0 L 3.792 -1.104 L 5.068 -1.104 Z" fill="#0d0f11" />
        <path d="M 3.49 1.278 L 2.853 2.382 L 1.577 2.382 L 0.94 1.278 L 1.577 0.174 L 2.853 0.174 Z" fill="#0d0f11" />
        <path d="M 1.275 2.556 L 0.638 3.66 L -0.638 3.66 L -1.275 2.556 L -0.638 1.452 L 0.638 1.452 Z" fill="#0d0f11" />
        <path d="M 5.705 2.556 L 5.068 3.66 L 3.792 3.66 L 3.155 2.556 L 3.792 1.452 L 5.068 1.452 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="nxa-sfan-35cfm--body" x="0" y="0" width="40.8" height="40.7" rx="0.5" fill="#26292d" stroke="#15181b" stroke-width="0.4" />
    <g id="nxa-sfan-35cfm--grille" data-path="nxa-sfan-35cfm/grille" data-class="rotor" data-z-vent="26">
      <rect id="nxa-sfan-35cfm--grille-back" x="2.5" y="1.5" width="35.9" height="37.8" rx="0.5" fill="#d9dcdf" />
      <rect id="nxa-sfan-35cfm--grille-holes" x="2.5" y="1.5" width="35.9" height="37.8" fill="url(#nxa-sfan-35cfm--nxa-sfan-mesh)" />
      <rect x="2.5" y="1.5" width="35.9" height="37.8" rx="0.5" fill="none" stroke="#4a4f55" stroke-width="0.3" />
    </g>
    <rect id="nxa-sfan-35cfm--hub" x="13.3" y="15.5" width="14.2" height="9.6" rx="0.8" fill="#4a4f55" />
    <rect id="nxa-sfan-35cfm--latch-left" x="0.4" y="13.2" width="13.0" height="14.1" rx="1.4" fill="#8b9197" stroke="#4a4f55" stroke-width="0.3" data-path="nxa-sfan-35cfm/latch-left" data-class="latch" data-z-out="6.0" />
    <rect id="nxa-sfan-35cfm--latch-right" x="27.4" y="13.2" width="13.0" height="14.1" rx="1.4" fill="#8b9197" stroke="#4a4f55" stroke-width="0.3" data-path="nxa-sfan-35cfm/latch-right" data-class="latch" data-z-out="6.0" />
    <rect id="nxa-sfan-35cfm--pull-left" x="9.4" y="13.2" width="4.6" height="14.1" rx="1.9" fill="#ac2f54" stroke="#6e1c2c" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" data-path="nxa-sfan-35cfm/pull-left" data-class="latch" data-z-out="7.0" />
    <rect id="nxa-sfan-35cfm--pull-right" x="27.0" y="13.2" width="4.6" height="14.1" rx="1.9" fill="#ac2f54" stroke="#6e1c2c" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" data-path="nxa-sfan-35cfm/pull-right" data-class="latch" data-z-out="7.0" />
    <circle id="nxa-sfan-35cfm--status" cx="4.2" cy="4.2" r="1.5" fill="var(--led-color, #3a4046)" stroke="#15181b" stroke-width="0.2" data-path="nxa-sfan-35cfm/status" data-class="led" data-states="off ok fault" />
    <g id="nxa-sfan-35cfm--silkscreen">
      <g id="nxa-sfan-35cfm--grip-marks" fill="#4a4f55">
        <ellipse cx="6.1" cy="18.2" rx="0.45" ry="0.9" />
        <ellipse cx="7.8" cy="18.2" rx="0.45" ry="0.9" />
        <ellipse cx="6.1" cy="22.2" rx="0.45" ry="0.9" />
        <ellipse cx="7.8" cy="22.2" rx="0.45" ry="0.9" />
      </g>
    </g>
  </g>
</svg>
