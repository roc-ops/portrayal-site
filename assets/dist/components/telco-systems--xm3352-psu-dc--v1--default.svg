<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="49.8mm" height="21.6mm" viewBox="0 0 49.8 21.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="xm3352-psu-dc" data-path="xm3352-psu-dc" data-class="psu" data-behaviour="fills" data-ref="telco-systems/xm3352-psu-dc@1:1.0.0" data-input="dc" data-input-voltage="-48 VDC nominal (face &quot;-48V&quot;); 48-60 VDC (data sheet)" data-model="XM-3352-DCPS" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>xm3352-psu-dc</title>
    <rect id="xm3352-psu-dc--plate" x="0.1" y="0.1" width="49.6" height="21.4" rx="0.5" fill="#d7d9db" stroke="#8d9298" stroke-width="0.25" />
    <g id="xm3352-psu-dc--thumbscrew" data-path="xm3352-psu-dc/thumbscrew" data-class="fastener">
      <circle cx="4.3" cy="12.1" r="3.2" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.3" />
      <circle cx="4.3" cy="12.1" r="2.2" fill="#b2b7bc" />
      <path d="M 3.0 12.1 H 5.6 M 4.3 10.8 V 13.4" stroke="#3a3d41" stroke-width="0.5" />
    </g>
    <g id="xm3352-psu-dc--silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#2f3337">
      <text x="1.3" y="4.4" font-size="2.2" font-weight="bold">-48V</text>
      <path d="M 7.6 3.4 H 10.2 M 7.6 4.2 H 8.1 M 8.9 4.2 H 9.4" stroke="#2f3337" stroke-width="0.25" />
      <text x="26.05" y="5.0" font-size="2.2" text-anchor="middle">-</text>
      <text x="36.05" y="5.0" font-size="2.2" text-anchor="middle">+</text>
    </g>
    <g id="xm3352-psu-dc--dc-in" data-path="xm3352-psu-dc/dc-in" data-class="inlet" data-behaviour="mounts" data-ref="telco-systems/xm3352-dc-plug@1:1.0.0" data-body-depth="15.0" data-media="dc-terminal" transform="translate(18.7,6.6)">
      <title>xm3352-psu-dc--dc-in</title>
      <rect x="0" y="1.6" width="23.4" height="7.6" rx="0.6" fill="#4fb57e" stroke="#2f7a52" stroke-width="0.3" />
      <rect id="xm3352-psu-dc--dc-in--body" x="5.0" y="0" width="13.4" height="13.9" rx="0.4" fill="#57c188" stroke="#2f7a52" stroke-width="0.3" data-path="xm3352-psu-dc/dc-in/body" data-class="connector" />
      <circle cx="3.0" cy="5.4" r="1.6" fill="#b9bdc2" stroke="#5c6167" stroke-width="0.3" />
      <path d="M 2.0 5.4 H 4.0 M 3.0 4.4 V 6.4" stroke="#3a3d41" stroke-width="0.4" />
      <circle cx="20.4" cy="5.4" r="1.6" fill="#b9bdc2" stroke="#5c6167" stroke-width="0.3" />
      <path d="M 19.4 5.4 H 21.4 M 20.4 4.4 V 6.4" stroke="#3a3d41" stroke-width="0.4" />
      <rect x="6.1" y="8.2" width="3.2" height="4.6" rx="0.3" fill="#1f3a2a" />
      <rect x="10.1" y="8.2" width="3.2" height="4.6" rx="0.3" fill="#1f3a2a" />
      <rect x="14.1" y="8.2" width="3.2" height="4.6" rx="0.3" fill="#1f3a2a" />
    </g>
  </g>
</svg>
