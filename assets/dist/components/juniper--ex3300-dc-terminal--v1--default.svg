    <g id="ex3300-dc-terminal--lug-4" data-path="ex3300-dc-terminal/lug-4" data-class="screw" data-ref="common/terminal-screw-34@1:1.0.1" transform="translate(23.9,4.0)" data-z-lift="7.9">
