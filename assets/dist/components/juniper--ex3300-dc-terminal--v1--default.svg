    <rect id="ex3300-dc-terminal--pole-3" x="15.7" y="1.2" width="5.6" height="9.0" rx="0.3" fill="#eef1f4" stroke="#6e757c" stroke-width="0.18" data-path="ex3300-dc-terminal/pole-3" data-class="terminal" data-z-out="7.9" data-z-color="#7d848c" />
    <rect id="ex3300-dc-terminal--pole-4" x="22.8" y="1.2" width="5.6" height="9.0" rx="0.3" fill="#eef1f4" stroke="#6e757c" stroke-width="0.18" data-path="ex3300-dc-terminal/pole-4" data-class="terminal" data-z-out="7.9" data-z-color="#7d848c" />
