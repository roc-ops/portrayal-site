<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="195.0mm" height="514.0mm" viewBox="0 0 195.0 514.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ex6210-fan" data-path="ex6210-fan" data-class="fan" data-behaviour="fills" data-ref="juniper/ex6210-fan@1:1.0.0" data-airflow="front-to-back" data-fans="6" data-power-draw-max-w="300" data-role="fan-tray" data-states="absent" transform="translate(0,0)">
    <title>ex6210-fan</title>
    <defs>
      <pattern id="ex6210-fan--perf" width="3.0" height="3.0" patternUnits="userSpaceOnUse">
        <circle cx="1.5" cy="1.5" r="0.9" fill="#101214" />
      </pattern>
    </defs>
    <rect id="ex6210-fan--face" x="0" y="0" width="195" height="514" rx="1.6" fill="#c9ccd0" stroke="#7d8186" stroke-width="0.5" />
    <g id="ex6210-fan--grilles">
      <circle cx="114.6" cy="94.8" r="60" fill="#2b2e32" stroke="#14161a" stroke-width="0.5" />
      <circle cx="114.6" cy="94.8" r="57" fill="url(#ex6210-fan--perf)" />
      <circle cx="114.6" cy="227.6" r="60" fill="#2b2e32" stroke="#14161a" stroke-width="0.5" />
      <circle cx="114.6" cy="227.6" r="57" fill="url(#ex6210-fan--perf)" />
      <circle cx="114.6" cy="357.2" r="60" fill="#2b2e32" stroke="#14161a" stroke-width="0.5" />
      <circle cx="114.6" cy="357.2" r="57" fill="url(#ex6210-fan--perf)" />
    </g>
    <g id="ex6210-fan--screws">
      <circle cx="8.0" cy="9.0" r="2.6" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.4" />
      <path d="M 5.8 9.0 H 10.2 M 8.0 6.8 V 11.2" stroke="#6b6f75" stroke-width="0.5" />
      <circle cx="186.0" cy="9.0" r="2.6" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.4" />
      <path d="M 183.8 9.0 H 188.2 M 186.0 6.8 V 11.2" stroke="#6b6f75" stroke-width="0.5" />
      <circle cx="8.0" cy="505.0" r="2.6" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.4" />
      <path d="M 5.8 505.0 H 10.2 M 8.0 502.8 V 507.2" stroke="#6b6f75" stroke-width="0.5" />
      <circle cx="186.0" cy="505.0" r="2.6" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.4" />
      <path d="M 183.8 505.0 H 188.2 M 186.0 502.8 V 507.2" stroke="#6b6f75" stroke-width="0.5" />
    </g>
    <g id="ex6210-fan--handle-top" data-path="ex6210-fan/handle-top" data-class="latch" data-z-out="2.0">
      <rect x="4.0" y="7.5" width="164.0" height="5.0" rx="2.5" fill="#6b6f75" stroke="#4a4e54" stroke-width="0.3" />
      <rect x="6.0" y="8.9" width="160.0" height="2.2" rx="1.1" fill="#aeb2b7" />
    </g>
    <g id="ex6210-fan--handle-bottom" data-path="ex6210-fan/handle-bottom" data-class="latch" data-z-out="2.0">
      <rect x="4.0" y="494.5" width="164.0" height="5.0" rx="2.5" fill="#6b6f75" stroke="#4a4e54" stroke-width="0.3" />
      <rect x="6.0" y="495.9" width="160.0" height="2.2" rx="1.1" fill="#aeb2b7" />
    </g>
  </g>
</svg>
