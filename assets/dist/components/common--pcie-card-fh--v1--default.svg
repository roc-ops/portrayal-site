      <path id="pcie-card-fh--bracket--flange-fold" d="M119.16 2.94 V18.02" stroke="#5f666d" stroke-width="0.3" fill="none" data-z-out="9.4" data-z-color="#9aa1a8" />
      <path d="M5.08 4.41 V14.01" stroke="#5f666d" stroke-width="0.3" fill="none" />
    </g>
    <rect id="pcie-card-fh--pcb-edge" x="19.96" y="9.8" width="89.9" height="1.2" fill="#2f7a4e" data-path="pcie-card-fh/pcb-edge" data-class="bezel" />
  </g>
</svg>
