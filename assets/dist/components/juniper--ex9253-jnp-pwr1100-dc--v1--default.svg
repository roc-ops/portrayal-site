<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86.7mm" height="39.6mm" viewBox="0 0 86.7 39.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex9253-jnp-pwr1100-dc@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="ex9253-jnp-pwr1100-dc" data-path="ex9253-jnp-pwr1100-dc" data-class="psu" data-behaviour="fills" data-ref="juniper/ex9253-jnp-pwr1100-dc@1:1.0.0" data-airflow="front-to-back" data-inlet="dc-terminal" data-input="operating -40 to -72 VDC, nominal -48 and -60 VDC; 32 A at -48 VDC (guide Table 12)" data-power-output-w="1100" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex9253-jnp-pwr1100-dc</title>
    <rect id="ex9253-jnp-pwr1100-dc--face" x="0.2" y="0.2" width="86.3" height="39.2" rx="1.0" fill="#2b2e32" stroke="#14161a" stroke-width="0.4" />
    <rect x="9.0" y="3.4" width="31.0" height="32.8" rx="0.8" fill="#3a3e43" stroke="#5d6167" stroke-width="0.3" />
    <rect x="11.2" y="5.8" width="26.6" height="13.0" fill="#2f3338" />
    <rect x="11.2" y="21.0" width="26.6" height="13.0" fill="#2f3338" />
    <g id="ex9253-jnp-pwr1100-dc--term-a" data-path="ex9253-jnp-pwr1100-dc/term-a" data-class="screw" data-z-cyl="1.2">
      <circle cx="25.9" cy="11.9" r="4.3" fill="#8a9096" stroke="#4a4e54" stroke-width="0.4" />
      <circle cx="25.9" cy="11.9" r="2.2" fill="#c0c4c8" stroke="#4a4e54" stroke-width="0.3" />
    </g>
    <g id="ex9253-jnp-pwr1100-dc--term-b" data-path="ex9253-jnp-pwr1100-dc/term-b" data-class="screw" data-z-cyl="1.2">
      <circle cx="25.9" cy="27.1" r="4.3" fill="#8a9096" stroke="#4a4e54" stroke-width="0.4" />
      <circle cx="25.9" cy="27.1" r="2.2" fill="#c0c4c8" stroke="#4a4e54" stroke-width="0.3" />
    </g>
    <circle cx="5.2" cy="33.4" r="1.6" fill="#8a9096" stroke="#4a4e54" stroke-width="0.3" />
    <g id="ex9253-jnp-pwr1100-dc--fan">
      <rect x="42.5" y="2.4" width="36.0" height="34.8" rx="2.0" fill="#1a1d20" stroke="#3a3e43" stroke-width="0.3" />
      <circle cx="60.5" cy="19.8" r="15.6" fill="#101214" stroke="#3a3e43" stroke-width="0.4" />
      <circle cx="60.5" cy="19.8" r="11.2" fill="none" stroke="#2f3338" stroke-width="0.9" />
      <circle cx="60.5" cy="19.8" r="6.2" fill="#1c1f22" stroke="#3a3e43" stroke-width="0.4" />
      <circle cx="46.2" cy="5.6" r="1.6" fill="#3a3e43" />
      <circle cx="74.8" cy="5.6" r="1.6" fill="#3a3e43" />
      <circle cx="74.8" cy="34.0" r="1.6" fill="#3a3e43" />
      <circle cx="46.2" cy="34.0" r="1.6" fill="#3a3e43" />
    </g>
    <g id="ex9253-jnp-pwr1100-dc--handle" data-path="ex9253-jnp-pwr1100-dc/handle" data-class="latch" data-z-out="2.0">
      <path d="M 48.2 33.6 L 73.8 5.8" stroke="#4a4e54" stroke-width="3.6" stroke-linecap="round" />
      <path d="M 48.2 33.6 L 73.8 5.8" stroke="#6a6f76" stroke-width="1.0" stroke-linecap="round" />
      <circle cx="48.2" cy="33.6" r="1.5" fill="#1a1d20" />
      <circle cx="73.8" cy="5.8" r="1.5" fill="#1a1d20" />
    </g>
    <rect id="ex9253-jnp-pwr1100-dc--tab" x="1.8" y="12.4" width="4.6" height="12.8" rx="0.8" fill="#9aa0a6" stroke="#5d6167" stroke-width="0.3" data-path="ex9253-jnp-pwr1100-dc/tab" data-class="latch" data-z-out="1.6" />
    <circle id="ex9253-jnp-pwr1100-dc--led-status" cx="6.3" cy="7.4" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex9253-jnp-pwr1100-dc/led-status" data-class="led" data-states="ok off" />
  </g>
</svg>
