<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="11.0mm" height="37.5mm" viewBox="0 0 11.0 37.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="rear-bay-screw-tab-14g" data-path="rear-bay-screw-tab-14g" data-class="mechanical" data-behaviour="mounts" data-ref="dell/rear-bay-screw-tab-14g@1:1.1.0" data-body-depth="4.0" data-wall="#4a5057" transform="translate(0,0)">
    <title>rear-bay-screw-tab-14g</title>
    <rect id="rear-bay-screw-tab-14g--screw-pad" x="0.00" y="1.16" width="11.0" height="13.25" rx="1.1" fill="#a9b0b7" stroke="#7d848c" stroke-width="0.25" data-path="rear-bay-screw-tab-14g/screw-pad" data-class="bezel" />
    <g id="rear-bay-screw-tab-14g--screw" data-path="rear-bay-screw-tab-14g/screw" data-class="screw" data-behaviour="mounts" data-ref="dell/thumbscrew-blue-14g@1:1.0.1" data-body-depth="16.0" data-wall="#15181b" transform="translate(0.4,2.26)">
      <title>rear-bay-screw-tab-14g--screw</title>
      <g id="rear-bay-screw-tab-14g--screw--ring" data-z-cyl="16.0" data-z-lift="8.1" data-z-color="#6d92b5">
        <circle cx="5.75" cy="5.75" r="5.75" fill="#6d92b5" stroke="#4d6a87" stroke-width="0.3" />
        <circle id="rear-bay-screw-tab-14g--screw--collar" cx="5.75" cy="5.75" r="4.60" fill="#6d92b5" stroke="#5b7c9c" stroke-width="0.35" />
        <circle id="rear-bay-screw-tab-14g--screw--head" cx="5.75" cy="5.75" r="3.40" fill="#9aa1a8" stroke="#3f4448" stroke-width="0.35" data-path="rear-bay-screw-tab-14g/screw/head" data-class="fastener" />
        <g id="rear-bay-screw-tab-14g--screw--cross" stroke="#3f4448" stroke-width="0.85" stroke-linecap="round">
          <path d="M3.85 5.75 h3.8 M5.75 3.85 v3.8" />
        </g>
      </g>
    </g>
  </g>
</svg>
