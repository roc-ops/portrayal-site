    <rect id="xcu-drawer-plan--floor" x="0" y="0" width="431.35" height="250.0" fill="#202326" stroke="#0c0d0e" stroke-width="0.4" />
    <rect id="xcu-drawer-plan--rail-left" x="0" y="42" width="5" height="208.0" fill="#aab0b6" />
    <rect id="xcu-drawer-plan--rail-right" x="426.35" y="42" width="5" height="208.0" fill="#aab0b6" />
    <rect id="xcu-drawer-plan--front-plate" x="0" y="0" width="431.35" height="40" fill="#2b2f33" stroke="#0c0d0e" stroke-width="0.3" />
    <g id="xcu-drawer-plan--screws">
      <circle cx="9.0" cy="10" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="9.0" cy="30" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="112.5" cy="10" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="112.5" cy="30" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="215.7" cy="10" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="215.7" cy="30" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="318.9" cy="10" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="318.9" cy="30" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
      <circle cx="422.3" cy="10" r="1.6" fill="#b8bdc2" stroke="#6d7379" stroke-width="0.3" />
