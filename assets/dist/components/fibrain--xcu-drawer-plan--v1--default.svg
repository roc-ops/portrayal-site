      <rect x="118.18" y="85.0" width="195.0" height="93.6" rx="3" fill="#3a3d41" stroke="#6b7177" stroke-width="0.5" />
      <circle cx="158.18" cy="131.8" r="30" fill="none" stroke="#6b7177" stroke-width="1.4" />
      <circle cx="273.18" cy="131.8" r="30" fill="none" stroke="#6b7177" stroke-width="1.4" />
      <rect id="xcu-drawer-plan--splice-holder-a" x="198.68" y="99.0" width="34" height="26" rx="1" fill="#e2443a" />
      <rect id="xcu-drawer-plan--splice-holder-b" x="198.68" y="141.0" width="34" height="26" rx="1" fill="#e2443a" />
    </g>
  </g>
</svg>
