    <g id="7280r3-pwr-1500-dc--pole-pos" data-path="7280r3-pwr-1500-dc/pole-pos" data-class="screw" data-ref="common/terminal-screw-34@1:1.0.1" transform="translate(49.5,27.1)">
      <title>7280r3-pwr-1500-dc--pole-pos</title>
