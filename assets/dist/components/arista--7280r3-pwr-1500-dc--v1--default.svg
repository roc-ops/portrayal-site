      <circle cx="37.9" cy="3.1" r="2.0" />
      <circle cx="6.2" cy="35.0" r="2.0" />
      <circle cx="37.9" cy="35.0" r="2.0" />
    </g>
    <g id="7280r3-pwr-1500-dc--holes">
