      </g>
      <g id="mic3-3d-1x100ge-cxp--t1119-silkscreen">
        <text x="165.40" y="26.70" font-family="Arial" font-size="1.3" fill="#3a3e43" text-anchor="end">MIC3-3D-1X100GE-CXP</text>
      </g>
      <g id="mic3-3d-1x100ge-cxp--t1116-silkscreen">
        <text x="29.90" y="22.20" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="middle">0</text>
      </g>
      <g id="mic3-3d-1x100ge-cxp--t1117-silkscreen">
        <text x="15.20" y="26.70" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="end">0/</text>
      </g>
    </g>
    <g id="mic3-3d-1x100ge-cxp--port-0-0" data-path="mic3-3d-1x100ge-cxp/port-0-0" data-class="port" data-ref="std/cxp@2:2.0.0" data-depth="28.96" data-wall="#aab0b7" data-cavity="cavity" data-media="cxp" transform="translate(18.15,8.55)">
      <title>mic3-3d-1x100ge-cxp--port-0-0</title>
      <rect id="mic3-3d-1x100ge-cxp--port-0-0--opening" x="0" y="0" width="23.5" height="12.1" rx="0.3" fill="#17191c" data-path="mic3-3d-1x100ge-cxp/port-0-0/opening" data-class="cutout" />
      <rect id="mic3-3d-1x100ge-cxp--port-0-0--cavity" x="0.95" y="0.95" width="21.6" height="10.2" rx="0.3" fill="#0a0c0e" />
      <rect id="mic3-3d-1x100ge-cxp--port-0-0--card-slot-upper" x="2.65" y="3.49" width="18.2" height="1.2" rx="0.2" fill="#000000" />
      <rect id="mic3-3d-1x100ge-cxp--port-0-0--card-slot-lower" x="2.65" y="7.99" width="18.2" height="1.2" rx="0.2" fill="#000000" />
      <path id="mic3-3d-1x100ge-cxp--port-0-0--collar" fill-rule="evenodd" fill="#9aa0a8" d="M 0.05 0.05 h 23.4 v 12 h -23.4 z M 0.95 0.95 h 21.6 v 10.2 h -21.6 z" data-z-out="1.0" data-z-color="#7d848c" />
      <g data-cp="mate" data-cp-at="11.75 6.05" data-cp-dir="front" />
    </g>
  </g>
</svg>
