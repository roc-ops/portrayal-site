    <rect id="mx2000-sfb2-v--label-recess-0" x="19" y="60" width="12" height="60" rx="1" fill="#5b6066" stroke="#33373c" stroke-width="0.3" />
    <rect id="mx2000-sfb2-v--label-recess-1" x="19" y="180" width="12" height="60" rx="1" fill="#5b6066" stroke="#33373c" stroke-width="0.3" />
    <rect id="mx2000-sfb2-v--logo-zone" x="17" y="255" width="14" height="6" fill="none" data-path="mx2000-sfb2-v/logo-zone" data-class="label" />
  </g>
</svg>
