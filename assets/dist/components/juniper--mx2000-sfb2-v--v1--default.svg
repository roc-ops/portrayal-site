      <rect x="8.5" y="148" width="5" height="14" rx="2.5" fill="#44484d" />
      <rect x="8.5" y="257" width="5" height="14" rx="2.5" fill="#44484d" />
      <rect x="8.5" y="311" width="5" height="14" rx="2.5" fill="#44484d" />
    </g>
    <g id="mx2000-sfb2-v--handle-top">
      <rect x="5" y="2" width="30" height="22" rx="4" fill="#8a8f95" stroke="#6d7278" stroke-width="0.4" />
      <rect x="16" y="6" width="6" height="14" rx="2.5" fill="#44484d" />
    </g>
    <g id="mx2000-sfb2-v--handle-bottom">
