    <g id="m1-10gb-xp-xfp--stat" data-path="m1-10gb-xp-xfp/stat" data-class="led" data-ref="common/led-indicator@1:1.2.0" data-description="Stat - green blinking: initializing; green: operationally up, administratively up; amber: operationally down, administratively up; unlit: administratively down" transform="translate(9.36,4.37)" data-group="status-leds" data-group-role="indicator">
