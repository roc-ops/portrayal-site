<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.7mm" height="40.5mm" viewBox="0 0 54.7 40.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex4600-jpsu-650-ac-afo@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/ex4600-jpsu-650-ac-afo@'] .state-green { --led-color: #39b54a; }</style>
  <g id="ex4600-jpsu-650-ac-afo" data-path="ex4600-jpsu-650-ac-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/ex4600-jpsu-650-ac-afo@1:1.0.0" data-airflow="front-to-back" data-input="100 to 240 VAC, 50 to 60 Hz (guide Table 16)" data-power-output-w="650" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex4600-jpsu-650-ac-afo</title>
    <rect id="ex4600-jpsu-650-ac-afo--face" x="0" y="0" width="54.7" height="40.5" rx="0.8" fill="#1c1e21" stroke="#131518" stroke-width="0.4" />
    <g id="ex4600-jpsu-650-ac-afo--vents">
      <rect x="3.2" y="3.6" width="19.6" height="17.8" rx="0.6" fill="#2b2e32" />
      <g fill="#08090a">
        <rect x="3.8" y="4.2" width="5.8" height="7.8" />
        <rect x="10.5" y="4.2" width="5.6" height="7.8" />
        <rect x="17.0" y="4.2" width="5.2" height="7.8" />
        <rect x="3.8" y="13.4" width="5.8" height="7.3" />
        <rect x="10.5" y="13.4" width="5.6" height="7.3" />
        <rect x="17.0" y="13.4" width="5.2" height="7.3" />
      </g>
    </g>
    <g id="ex4600-jpsu-650-ac-afo--lamps">
      <circle cx="6.0" cy="22.9" r="2.0" fill="#111315" stroke="#2b2e32" stroke-width="0.3" />
      <circle cx="6.0" cy="29.6" r="2.0" fill="#111315" stroke="#2b2e32" stroke-width="0.3" />
      <circle cx="6.0" cy="36.9" r="2.0" fill="#111315" stroke="#2b2e32" stroke-width="0.3" />
      <circle id="ex4600-jpsu-650-ac-afo--led-ac" cx="6.0" cy="22.9" r="1.2" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4600-jpsu-650-ac-afo/led-ac" data-class="led" data-states="green off" />
      <circle id="ex4600-jpsu-650-ac-afo--led-dc" cx="6.0" cy="29.6" r="1.2" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4600-jpsu-650-ac-afo/led-dc" data-class="led" data-states="green off" />
      <circle id="ex4600-jpsu-650-ac-afo--led-fault" cx="6.0" cy="36.9" r="1.2" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4600-jpsu-650-ac-afo/led-fault" data-class="led" data-states="amber off" />
    </g>
    <rect id="ex4600-jpsu-650-ac-afo--inlet-bay" x="30.2" y="3.4" width="22.0" height="34.5" rx="1.2" fill="#121416" stroke="#2b2e32" stroke-width="0.3" />
    <g id="ex4600-jpsu-650-ac-afo--lever" data-path="ex4600-jpsu-650-ac-afo/lever" data-class="latch">
      <rect x="48.8" y="20.5" width="5.9" height="19.5" rx="1.2" fill="#232528" stroke="#3a3e43" stroke-width="0.35" />
      <rect x="50.8" y="24.8" width="1.6" height="9.0" rx="0.6" fill="#08090a" />
    </g>
    <g id="ex4600-jpsu-650-ac-afo--silkscreen" font-family="sans-serif" font-size="3.0" fill="#d9dde1">
      <text x="9.0" y="24.3">AC</text>
      <text x="9.0" y="31.1">DC</text>
      <text x="9.4" y="38.4">!</text>
      <path d="M 9.2 26.0 C 10.0 25.0 10.9 25.0 11.5 26.0 C 12.1 27.0 13.0 27.0 13.8 26.0" fill="none" stroke="#d9dde1" stroke-width="0.3" />
      <path d="M 9.2 32.8 H 13.6 M 9.2 33.6 H 10.4 M 11.4 33.6 H 12.6 M 13.0 33.6 H 13.8" fill="none" stroke="#d9dde1" stroke-width="0.3" />
      <text x="26.55" y="8.8" font-size="2.8" font-weight="bold" fill="#0c1013" text-anchor="middle">AFO</text>
    </g>
    <rect id="ex4600-jpsu-650-ac-afo--latch" x="23.1" y="1.3" width="6.9" height="39.0" rx="0.8" fill="#e8731f" stroke="#8e4613" stroke-width="0.35" data-fill-from="handle-finish" data-stroke-derive="handle-finish" data-path="ex4600-jpsu-650-ac-afo/latch" data-class="latch" data-z-out="1.6" />
    <g id="ex4600-jpsu-650-ac-afo--inlet" data-path="ex4600-jpsu-650-ac-afo/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(26.5,11.6) rotate(270 14.0 10.0)">
      <title>ex4600-jpsu-650-ac-afo--inlet</title>
      <rect id="ex4600-jpsu-650-ac-afo--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="ex4600-jpsu-650-ac-afo/inlet/opening" data-class="cutout" />
      <path id="ex4600-jpsu-650-ac-afo--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="ex4600-jpsu-650-ac-afo--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex4600-jpsu-650-ac-afo--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex4600-jpsu-650-ac-afo--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
