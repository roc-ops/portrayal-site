      <rect id="pcie-card-lp--bracket--opening" x="15.63" y="3.18" width="54.53" height="12.06" rx="1.0" fill="#1b1f22" stroke="#41474d" stroke-width="0.35" data-path="pcie-card-lp/bracket/opening" data-class="cutout" data-description="the connector opening, 54.53 by 12.06, sitting 3.18 in from each long edge" />
      <path id="pcie-card-lp--bracket--flange-fold" d="M78.34 0.40 V16.01" stroke="#5f666d" stroke-width="0.3" fill="none" data-z-out="9.4" data-z-color="#9aa1a8" />
      <path d="M5.08 4.41 V14.01" stroke="#5f666d" stroke-width="0.3" fill="none" />
    </g>
    <rect id="pcie-card-lp--pcb-edge" x="19.96" y="9.8" width="45.4" height="1.2" fill="#2f7a4e" data-path="pcie-card-lp/pcb-edge" data-class="bezel" />
  </g>
</svg>
