<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="81.0mm" height="81.5mm" viewBox="0 0 81.0 81.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/fan-803816-hc@'] .state-fault { --led-color: #eab308; }
    g[data-ref^='ufispace/fan-803816-hc@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-803816-hc" data-path="fan-803816-hc" data-class="fan" data-behaviour="fills" data-ref="ufispace/fan-803816-hc@1:1.0.0" data-airflow="exhaust" data-model="FAN-803816-HC" data-power-absent="not-published" transform="translate(0,0)">
    <title>fan-803816-hc</title>
    <defs>
      <pattern id="fan-803816-hc--hex803hc" width="4.2" height="2.42" patternUnits="userSpaceOnUse">
        <path d="M 1.21 0 L 0.605 1.047 L -0.605 1.047 L -1.21 0 L -0.605 -1.047 L 0.605 -1.047 Z" fill="#0d0f11" />
        <path d="M 5.41 0 L 4.805 1.047 L 3.595 1.047 L 2.99 0 L 3.595 -1.047 L 4.805 -1.047 Z" fill="#0d0f11" />
        <path d="M 3.31 1.21 L 2.705 2.257 L 1.495 2.257 L 0.89 1.21 L 1.495 0.163 L 2.705 0.163 Z" fill="#0d0f11" />
        <path d="M 1.21 2.42 L 0.605 3.467 L -0.605 3.467 L -1.21 2.42 L -0.605 1.373 L 0.605 1.373 Z" fill="#0d0f11" />
        <path d="M 5.41 2.42 L 4.805 3.467 L 3.595 3.467 L 2.99 2.42 L 3.595 1.373 L 4.805 1.373 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="fan-803816-hc--body" x="0" y="0" width="81" height="81.5" rx="0.8" fill="#33383d" stroke="#1a1d20" stroke-width="0.5" />
    <rect id="fan-803816-hc--grille" x="10.5" y="1.2" width="69.3" height="79.1" rx="0.6" fill="url(#fan-803816-hc--hex803hc)" data-z-vent="30" />
    <g id="fan-803816-hc--handle" data-z-uhandle="25">
      <rect x="26.0" y="23.3" width="6.6" height="40.4" rx="3.3" fill="#c94a4a" />
      <rect x="32.6" y="23.7" width="6.5" height="4.0" rx="2.0" fill="#c94a4a" />
      <rect x="32.6" y="57.6" width="6.5" height="4.0" rx="2.0" fill="#c94a4a" />
    </g>
    <rect id="fan-803816-hc--release-tab" x="0.8" y="31.8" width="8.8" height="22.3" rx="1.2" fill="#d65252" data-z-out="2.0" />
    <g id="fan-803816-hc--silkscreen">
      <rect x="11.8" y="4.7" width="7.9" height="7.1" rx="0.7" fill="#e01414" />
      <text x="15.75" y="10.6" font-family="sans-serif" font-size="6.0" font-weight="bold" text-anchor="middle" fill="#0d0f11">E</text>
    </g>
    <circle id="fan-803816-hc--status-led" cx="18.5" cy="21.0" r="1.3" fill="var(--led-color, #3a3f44)" data-path="fan-803816-hc/status-led" data-class="led" data-states="off ok fault" data-description="HIG section 10, Fan FRU LED table - Off (BMC is not up), Green (fan FRU function normal), Amber (fan FRU is abnormal, the fan speed is under 4500 rpm). Three rows and no blink states; transcribed as it stands rather than filled out from a sibling guide's longer table" data-z-dome="0.4" />
  </g>
</svg>
