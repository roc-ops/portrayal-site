<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="17.29mm" height="167.87mm" viewBox="0 0 17.29 167.87">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/spa-1xchstm1-oc3@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/spa-1xchstm1-oc3@'] .state-green { --led-color: #39b54a; }</style>
  <g id="spa-1xchstm1-oc3" data-path="spa-1xchstm1-oc3" data-class="line-card" data-ref="cisco/spa-1xchstm1-oc3@1:1.0.0" data-wall="#4a4f55" data-eol="none-announced" data-form-factor="single-width, single-height (one SIP-700 subslot)" data-media="SFP, OC-3/STM-1 channelised to DS0" data-min-hardware-revision="1.0" data-min-ios-xr="4.0.1" data-model="SPA-1XCHSTM1/OC3" data-ports="1" data-role="shared-port-adapter" transform="translate(0,0)">
    <title>spa-1xchstm1-oc3</title>
    <rect id="spa-1xchstm1-oc3--plate" x="0" y="0" width="17.29" height="167.87" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3" />
    <g>
      <circle cx="8.645" cy="3.4" r="2.2" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="8.645" cy="3.4" r="1.0" fill="#6d7379" />
    </g>
    <g>
      <circle cx="8.645" cy="164.47" r="2.2" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="8.645" cy="164.47" r="1.0" fill="#6d7379" />
    </g>
    <g id="spa-1xchstm1-oc3--silkscreen">
      <text x="4.99" y="18.69" transform="rotate(90 4.99 18.69)" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#231f20">0</text>
      <text x="5.39" y="36.27" transform="rotate(90 5.39 36.27)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">C/A</text>
      <text x="9.38" y="36.27" transform="rotate(90 9.38 36.27)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">A/L</text>
      <text x="11.08" y="165.25" transform="rotate(90 11.08 165.25)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">STATUS</text>
      <text x="13.34" y="139.01" transform="rotate(90 13.34 139.01)" font-family="sans-serif" font-size="1.7" font-weight="bold" fill="#231f20">SPA-1XCHSTM1/OC3</text>
    </g>
    <g id="spa-1xchstm1-oc3--p0" data-path="spa-1xchstm1-oc3/p0" data-class="port" data-ref="std/sfp@1:1.4.0" data-depth="41.0" data-wall="#aab0b7" data-cavity="cavity" data-media="sfp" transform="translate(-0.6,13.69) rotate(90 7.25 5.0)">
      <title>spa-1xchstm1-oc3--p0</title>
      <rect id="spa-1xchstm1-oc3--p0--opening" x="0" y="0" width="14.5" height="10" rx="0.3" fill="#17191c" data-path="spa-1xchstm1-oc3/p0/opening" data-class="cutout" />
      <rect id="spa-1xchstm1-oc3--p0--cavity" x="0.5" y="0.75" width="13.5" height="8.5" rx="0.3" fill="#0a0c0e" />
      <rect id="spa-1xchstm1-oc3--p0--cage-lip" x="1.0" y="1.2" width="12.5" height="1.2" rx="0.3" fill="#2b2f33" />
      <rect id="spa-1xchstm1-oc3--p0--module-slot" x="1.0" y="3.6" width="12.5" height="2.6" rx="0.4" fill="#000000" />
      <path id="spa-1xchstm1-oc3--p0--collar" fill-rule="evenodd" fill="#9aa0a8" d="M 0.05 0.05 h 14.4 v 9.9 h -14.4 z M 0.75 0.75 h 13 v 8.5 h -13 z" data-z-out="1.0" data-z-color="#7d848c" />
    </g>
    <rect id="spa-1xchstm1-oc3--led-ca-p0" x="1.89" y="35.57" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-1xchstm1-oc3/led-ca-p0" data-class="led" data-states="green amber off" data-description="the port's C/A (Carrier/Alarm) lamp. Table 25 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, and there is a valid signal without any alarms; amber on - port is enabled by software, and there is at least one alarm." data-z-dome="0.3" />
    <rect id="spa-1xchstm1-oc3--led-al-p0" x="5.88" y="35.57" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-1xchstm1-oc3/led-al-p0" data-class="led" data-states="green amber off" data-description="the port's A/L (Active/Loopback) lamp. Table 25 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, loopback is off; amber on - port is enabled by software, loopback is on." data-z-dome="0.3" />
    <circle id="spa-1xchstm1-oc3--status" cx="6.98" cy="165.25" r="1.1" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="spa-1xchstm1-oc3/status" data-class="led" data-states="green amber off" data-description="the SPA's STATUS lamp, the one lamp every SPA in this guide carries. Table 25 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - SPA power is off; green on - SPA is ready and operational; amber on - SPA power is on and good, and the SPA is being configured." data-z-dome="0.3" />
  </g>
</svg>
