<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.0mm" viewBox="0 0 50.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-132-dc@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-132-dc@'] .state-input-lost { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-132-dc@'] .state-input-lost { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-132-dc@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-132-dc@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-132-dc@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-132-dc@'] .state-warning { --led-color: #22c55e; --led-color-alt: #ef4444; }
    g[data-ref^='ufispace/psu-132-dc@'] .state-warning { animation: portrayal-alternate 1s linear infinite; }</style>
  <g id="psu-132-dc" data-path="psu-132-dc" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-132-dc@1:1.1.0" data-inlet="dc-terminal" data-input="dc" data-model="PSU-132-DESR" data-power-output-w="1300" transform="translate(0,0)">
    <title>psu-132-dc</title>
    <defs>
      <pattern id="psu-132-dc--sqvent" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
        <rect x="0.4" y="0.4" width="2.2" height="2.2" fill="#17191c" />
      </pattern>
    </defs>
    <rect id="psu-132-dc--body" x="0" y="0" width="50.5" height="40" rx="0.6" fill="#a4aab1" stroke="#6a7076" stroke-width="0.4" />
    <rect id="psu-132-dc--vent-field" x="7.0" y="2.2" width="34.0" height="5.8" fill="url(#psu-132-dc--sqvent)" data-z-vent="30" />
    <rect id="psu-132-dc--latch" x="0.6" y="3.5" width="4.2" height="14.5" rx="0.8" fill="#c22f2f" stroke="#8c2323" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" data-path="psu-132-dc/latch" data-class="latch" data-z-out="2.2" />
    <g id="psu-132-dc--terminal-block" data-path="psu-132-dc/terminal-block" data-class="inlet" data-z-out="8">
      <rect x="13.0" y="8.0" width="24.0" height="28.0" rx="0.8" fill="#24272b" stroke="#0d0f11" stroke-width="0.35" />
      <rect x="14.4" y="9.2" width="21.2" height="3.4" rx="0.5" fill="#17191c" />
      <rect x="15.6" y="13.6" width="8.4" height="18.0" rx="0.6" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <rect x="26.0" y="13.6" width="8.4" height="18.0" rx="0.6" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <path d="M 18.2 18.4 a 4.6 4.6 0 0 0 0 8.4" fill="none" stroke="#33373c" stroke-width="0.7" />
      <path d="M 21.4 18.4 a 4.6 4.6 0 0 1 0 8.4" fill="none" stroke="#33373c" stroke-width="0.7" />
      <path d="M 28.6 18.4 a 4.6 4.6 0 0 0 0 8.4" fill="none" stroke="#33373c" stroke-width="0.7" />
      <path d="M 31.8 18.4 a 4.6 4.6 0 0 1 0 8.4" fill="none" stroke="#33373c" stroke-width="0.7" />
      <rect x="14.4" y="32.0" width="21.2" height="2.6" rx="0.5" fill="#17191c" />
    </g>
    <g id="psu-132-dc--slot-column">
      <rect x="43.6" y="6.0" width="3.4" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="43.6" y="10.4" width="3.4" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="43.6" y="14.8" width="3.4" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="43.6" y="19.2" width="3.4" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="43.6" y="23.6" width="3.4" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="43.6" y="28.0" width="3.4" height="2.6" rx="0.3" fill="#17191c" />
    </g>
    <path id="psu-132-dc--handle" d="M 40.4 4.4 a 1.6 1.6 0 0 1 1.6 1.6 L 42.0 25.4 a 1.6 1.6 0 0 1 -1.6 1.6" fill="none" stroke="#17191c" stroke-width="2.2" stroke-linecap="round" data-path="psu-132-dc/handle" data-class="handle" data-z-uhandle="38" />
    <circle id="psu-132-dc--status-led" cx="7.9" cy="32.9" r="1.5" fill="var(--led-color, #3a3f44)" data-path="psu-132-dc/status-led" data-class="led" data-states="off ok standby fail input-lost warning" data-description="HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output on and OK), Blinking Green (standby state / only +5VSB on, or firmware updating), Red (critical event causing shutdown - failure, over current, short circuit, over voltage, fan failure, over temperature), Blinking Red (input power lost with a second supply in parallel still powered), Blinking between Green and Red (warning event, supply continues to operate - high temp, high power, high current, slow fan)" data-z-dome="0.4" />
    <g data-cp="power" data-cp-at="25 24" data-cp-dir="front" />
  </g>
</svg>
