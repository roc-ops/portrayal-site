    <path id="cmbrush1u-panel--floor-lit" fill="#fff" fill-opacity="0.12" fill-rule="evenodd" d="     M0,0 H482 V43.7 H0 Z     M55,12.4 H427 A5,5 0 0 1 432,17.4 V30.7 A5,5 0 0 1 427,35.7 H55 A5,5 0 0 1 50,30.7 V17.4 A5,5 0 0 1 55,12.4 Z     M7,2.5 H10 A3.5,3.5 0 0 1 10,9.5 H7 A3.5,3.5 0 0 1 7,2.5 Z     M7,34.2 H10 A3.5,3.5 0 0 1 10,41.2 H7 A3.5,3.5 0 0 1 7,34.2 Z     M472,2.5 H475 A3.5,3.5 0 0 1 475,9.5 H472 A3.5,3.5 0 0 1 472,2.5 Z     M472,34.2 H475 A3.5,3.5 0 0 1 475,41.2 H472 A3.5,3.5 0 0 1 472,34.2 Z" />
  </g>
