<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="41.65mm" height="40.6mm" viewBox="0 0 41.65 40.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ais800-fan" data-path="ais800-fan" data-class="fan" data-behaviour="fills" data-ref="edgecore/ais800-fan@1:1.0.3" data-wall="#15181b" data-airflow="front-to-back" data-model="FAN-1U-1X1P" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>ais800-fan</title>
    <defs>
      <pattern id="ais800-fan--ais800-mesh" width="4.10" height="2.37" patternUnits="userSpaceOnUse">
        <path d="M 1.18 0 L 0.59 1.02 L -0.59 1.02 L -1.18 0 L -0.59 -1.02 L 0.59 -1.02 Z" fill="#0b0d0f" />
        <path d="M 5.28 0 L 4.69 1.02 L 3.51 1.02 L 2.92 0 L 3.51 -1.02 L 4.69 -1.02 Z" fill="#0b0d0f" />
        <path d="M 3.23 1.185 L 2.64 2.205 L 1.46 2.205 L 0.87 1.185 L 1.46 0.165 L 2.64 0.165 Z" fill="#0b0d0f" />
        <path d="M 1.18 2.37 L 0.59 3.39 L -0.59 3.39 L -1.18 2.37 L -0.59 1.35 L 0.59 1.35 Z" fill="#0b0d0f" />
        <path d="M 5.28 2.37 L 4.69 3.39 L 3.51 3.39 L 2.92 2.37 L 3.51 1.35 L 4.69 1.35 Z" fill="#0b0d0f" />
      </pattern>
    </defs>
    <rect id="ais800-fan--body" x="0" y="0" width="41.65" height="40.6" rx="0.5" fill="#2b2f34" stroke="#1b1e22" stroke-width="0.4" />
    <rect x="0.7" y="0.7" width="40.25" height="39.2" rx="0.35" fill="none" stroke="#3d4147" stroke-width="0.22" />
    <g id="ais800-fan--grille" data-path="ais800-fan/grille" data-class="rotor" data-z-vent="26">
      <rect id="ais800-fan--grille-back" x="2.40" y="3.00" width="36.85" height="34.50" rx="0.4" fill="#141719" />
      <circle id="ais800-fan--rotor-disc" cx="20.825" cy="20.25" r="15.6" fill="#1b1f22" stroke="#34383d" stroke-width="0.3" />
      <circle id="ais800-fan--rotor-hub" cx="20.825" cy="20.25" r="4.8" fill="#23272b" stroke="#34383d" stroke-width="0.25" />
      <rect id="ais800-fan--grille-holes" x="2.40" y="3.00" width="36.85" height="34.50" fill="url(#ais800-fan--ais800-mesh)" />
      <rect x="2.40" y="3.00" width="36.85" height="34.50" rx="0.4" fill="none" stroke="#43484e" stroke-width="0.3" />
    </g>
    <g id="ais800-fan--handle" data-path="ais800-fan/handle" data-class="handle" data-z-lift="1.0" data-z-bar="3.0">
      <rect x="1.20" y="23.00" width="39.25" height="7.00" rx="1.6" fill="#c0453f" stroke="#8f2f2a" stroke-width="0.25" data-fill-from="handle-finish" />
      <rect id="ais800-fan--handle-pad" x="18.10" y="24.80" width="5.40" height="3.40" rx="0.5" fill="#3a3e43" stroke="#2a2d31" stroke-width="0.2" />
    </g>
    <g id="ais800-fan--status" data-path="ais800-fan/status" data-class="led" data-z-dome="0.3">
      <circle cx="4.90" cy="4.00" r="1.70" fill="#1c1f22" stroke="#43484e" stroke-width="0.25" />
      <circle id="ais800-fan--status-lens" cx="4.90" cy="4.00" r="1.15" fill="#c8ccd0" />
    </g>
  </g>
</svg>
