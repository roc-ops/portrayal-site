<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="9.7mm" height="34.2mm" viewBox="0 0 9.7 34.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="p40-plug" data-path="p40-plug" data-class="port" data-ref="amphenol-ns/p40-plug@1:1.0.0" data-connector="P40" data-contact-mm="4" data-media="p40" data-positions="2" transform="translate(0,0)">
    <title>p40-plug</title>
    <rect id="p40-plug--latch-top" x="1.45" y="0" width="6.8" height="4.0" rx="0.3" fill="#1a1b1d" stroke="#101012" stroke-width="0.2" data-fill-from="body-color" data-stroke-derive="body-color" data-z-out="22.3" />
    <rect id="p40-plug--latch-bottom" x="1.45" y="30.2" width="6.8" height="4.0" rx="0.3" fill="#1a1b1d" stroke="#101012" stroke-width="0.2" data-fill-from="body-color" data-stroke-derive="body-color" data-z-out="22.3" />
    <path id="p40-plug--body" fill-rule="evenodd" fill="#1a1b1d" stroke="#101012" stroke-width="0.2" data-fill-from="body-color" data-stroke-derive="body-color" d="M 0 4.0 H 9.7 V 30.2 H 0 Z M 0.85 12.0 a 4.0 4.0 0 1 0 8.0 0 a 4.0 4.0 0 1 0 -8.0 0 Z M 0.85 21.8 a 4.0 4.0 0 1 0 8.0 0 a 4.0 4.0 0 1 0 -8.0 0 Z" data-z-out="22.3" data-z-shape="1" />
    <circle id="p40-plug--entry-1" cx="4.85" cy="12.0" r="4.0" fill="#0b0c0d" data-z-out="20.8" data-z-color="#0b0c0d" />
    <circle id="p40-plug--entry-2" cx="4.85" cy="21.8" r="4.0" fill="#0b0c0d" data-z-out="20.8" data-z-color="#0b0c0d" />
    <circle id="p40-plug--wire-1" cx="4.85" cy="12.0" r="4.0" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-r-from="wire-od" data-fill-from="wire-color" data-z-cyl="30" data-z-lift="22.3" />
    <circle id="p40-plug--wire-2" cx="4.85" cy="21.8" r="4.0" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-r-from="wire-od" data-fill-from="wire-color" data-z-cyl="30" data-z-lift="22.3" />
    <g data-cp="mate" data-cp-at="4.85 16.9" data-cp-dir="front" />
    <g data-cp="wire-1" data-cp-at="4.85 12" data-cp-dir="front" data-cp-on="p40-plug--wire-1" />
    <g data-cp="wire-2" data-cp-at="4.85 21.8" data-cp-dir="front" data-cp-on="p40-plug--wire-2" />
  </g>
</svg>
