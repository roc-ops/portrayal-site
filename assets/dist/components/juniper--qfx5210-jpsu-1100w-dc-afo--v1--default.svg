      <rect x="13.2" y="35.2" width="4.8" height="3.0" rx="0.4" />
    </g>
    <g id="qfx5210-jpsu-1100w-dc-afo--terminals" data-path="qfx5210-jpsu-1100w-dc-afo/terminals" data-class="terminal" data-z-out="2.2" data-z-color="#111316">
      <rect id="qfx5210-jpsu-1100w-dc-afo--terminal-plate" x="6.8" y="4.4" width="10.9" height="29.9" rx="0.8" fill="#111316" stroke="#3a3e43" stroke-width="0.4" />
      <path d="M 8.0 14.0 L 10.0 11.6 V 8.0 M 15.9 9.0 V 18.0 L 14.4 19.6 L 15.9 21.2 V 29.0" fill="none" stroke="#2b2e32" stroke-width="0.4" />
