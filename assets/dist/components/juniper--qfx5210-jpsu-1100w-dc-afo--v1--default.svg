      <rect x="20.0" y="28.4" width="3.6" height="4.8" rx="0.4" />
      <rect x="24.6" y="28.4" width="4.6" height="4.8" rx="0.4" />
      <rect x="37.4" y="3.1" width="3.6" height="4.8" rx="0.4" />
