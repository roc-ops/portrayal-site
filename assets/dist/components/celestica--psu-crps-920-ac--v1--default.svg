<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40.0mm" viewBox="0 0 73.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='celestica/psu-crps-920-ac@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='celestica/psu-crps-920-ac@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='celestica/psu-crps-920-ac@'] .state-peer-ac-fault { --led-color: #ef4444; }
    g[data-ref^='celestica/psu-crps-920-ac@'] .state-peer-ac-fault { animation: portrayal-blink 2s linear infinite; }
    g[data-ref^='celestica/psu-crps-920-ac@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='celestica/psu-crps-920-ac@'] .state-standby { animation: portrayal-blink 2s linear infinite; }</style>
  <g id="psu-crps-920-ac" data-path="psu-crps-920-ac" data-class="psu" data-behaviour="fills" data-ref="celestica/psu-crps-920-ac@1:1.0.0" data-body-depth="185.0" data-form-factor="crps-1u" data-input="ac" data-power-output-w="920" data-states="ok fail absent" transform="translate(0,0)">
    <title>psu-crps-920-ac</title>
    <rect id="psu-crps-920-ac--body" x="0" y="0" width="73.5" height="40" rx="0.5" fill="#c3c7cc" stroke="#8a9099" stroke-width="0.35" />
    <rect id="psu-crps-920-ac--fan-surround" x="2.3" y="0.6" width="38.0" height="31.6" rx="3.0" fill="#2a2d31" />
    <g id="psu-crps-920-ac--fan">
      <circle id="psu-crps-920-ac--fan-bore" cx="21.3" cy="16.4" r="14.5" fill="#15171a" />
      <circle cx="21.3" cy="16.4" r="6.2" fill="#6f757c" />
      <g id="psu-crps-920-ac--fan-guard" fill="none" stroke="#dfe2e5" stroke-width="0.8">
        <circle cx="21.3" cy="16.4" r="14.0" />
        <circle cx="21.3" cy="16.4" r="7.0" />
        <line x1="6.3" y1="2.7" x2="36.3" y2="30.1" />
        <line x1="35.2" y1="2.7" x2="6.3" y2="30.1" />
      </g>
      <circle id="psu-crps-920-ac--guard-screw-a" cx="6.3" cy="2.7" r="1.9" fill="#d4d7da" stroke="#8a9099" stroke-width="0.25" />
      <circle id="psu-crps-920-ac--guard-screw-b" cx="35.2" cy="2.7" r="1.9" fill="#d4d7da" stroke="#8a9099" stroke-width="0.25" />
    </g>
    <rect id="psu-crps-920-ac--inlet-frame" x="42.3" y="0.5" width="25.0" height="29.2" rx="1.6" fill="#1a1c1f" stroke="#0d0f11" stroke-width="0.3" />
    <circle id="psu-crps-920-ac--release" cx="56.7" cy="36.6" r="1.5" fill="#15171a" />
    <g id="psu-crps-920-ac--handle" fill="#1d1f22" stroke="#0d0f11" stroke-width="0.3" data-path="psu-crps-920-ac/handle" data-class="handle" data-z-uhandle="10.0">
      <path d="M 1.8 28.0 h 2.5 v 5.3 h 34.4 v -5.3 h 2.5 v 10.8 h -39.4 z" />
    </g>
    <g id="psu-crps-920-ac--latch" data-path="psu-crps-920-ac/latch" data-class="latch" data-z-out="2.5">
      <rect x="67.0" y="13.8" width="4.6" height="18.2" rx="1.0" fill="#202326" stroke="#0d0f11" stroke-width="0.3" />
    </g>
    <circle id="psu-crps-920-ac--led-dc-ok" cx="45.3" cy="36.6" r="1.5" fill="var(--led-color, #3a3f44)" stroke="#2a2d31" stroke-width="0.3" data-path="psu-crps-920-ac/led-dc-ok" data-class="led" data-states="off ok standby fail" data-z-dome="0.3" />
    <circle id="psu-crps-920-ac--led-ac-ok" cx="68.1" cy="36.6" r="1.5" fill="var(--led-color, #3a3f44)" stroke="#2a2d31" stroke-width="0.3" data-path="psu-crps-920-ac/led-ac-ok" data-class="led" data-states="off ok peer-ac-fault" data-z-dome="0.3" />
    <g id="psu-crps-920-ac--inlet" data-path="psu-crps-920-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(40.75,5.1) rotate(90 14.0 10.0)">
      <title>psu-crps-920-ac--inlet</title>
      <rect id="psu-crps-920-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-crps-920-ac/inlet/opening" data-class="cutout" />
      <path id="psu-crps-920-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-crps-920-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-crps-920-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-crps-920-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="54.8 15.1" data-cp-dir="rear" />
  </g>
</svg>
