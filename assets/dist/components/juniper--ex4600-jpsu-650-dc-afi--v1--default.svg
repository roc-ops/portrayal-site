      <circle id="ex4600-jpsu-650-dc-afi--led-out" cx="24.0" cy="22.0" r="1.5" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4600-jpsu-650-dc-afi/led-out" data-class="led" data-states="green off" />
