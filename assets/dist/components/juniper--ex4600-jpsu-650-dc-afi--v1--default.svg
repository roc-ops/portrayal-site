      <rect x="41.5" y="25.4" width="5.5" height="5.2" />
      <rect x="13.7" y="33.5" width="6.6" height="5.1" />
      <rect x="23.8" y="33.5" width="6.6" height="5.1" />
      <rect x="33.9" y="33.5" width="6.6" height="5.1" />
