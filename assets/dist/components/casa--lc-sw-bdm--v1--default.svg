      <text id="lc-sw-bdm--model" x="15.23" y="26.5" font-family="sans-serif" font-size="2.6" font-weight="bold" text-anchor="middle" fill="#231f20">LC-SW-BDM</text>
    </g>
    <g id="lc-sw-bdm--screw-t" data-z-cyl="1.6">
      <circle cx="15.23" cy="6.00" r="2.4" fill="#8d949c" stroke="#5f6469" stroke-width="0.3" />
      <circle cx="15.23" cy="6.00" r="1.5" fill="#6d7379" />
      <path d="M 14.04 4.80 L 16.43 7.20 M 14.04 7.20 L 16.43 4.80" stroke="#3a4046" stroke-width="0.45" fill="none" />
    </g>
    <g id="lc-sw-bdm--screw-b" data-z-cyl="1.6">
      <circle cx="15.23" cy="339.50" r="2.4" fill="#8d949c" stroke="#5f6469" stroke-width="0.3" />
      <circle cx="15.23" cy="339.50" r="1.5" fill="#6d7379" />
      <path d="M 14.04 338.30 L 16.43 340.70 M 14.04 340.70 L 16.43 338.30" stroke="#3a4046" stroke-width="0.45" fill="none" />
    </g>
    <g id="lc-sw-bdm--latch-t" data-z-out="4.2">
      <rect x="2.0" y="11.00" width="3.2" height="16.00" rx="1.5" fill="#231f20" />
      <circle cx="3.6" cy="11.00" r="1.5" fill="#3a4046" stroke="#15181b" stroke-width="0.25" />
    </g>
    <g id="lc-sw-bdm--latch-b" data-z-out="4.2">
      <rect x="2.0" y="318.50" width="3.2" height="16.00" rx="1.5" fill="#231f20" />
