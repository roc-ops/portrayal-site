<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="9.2mm" height="6.0mm" viewBox="0 0 9.2 6.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qsfpdd-led-pair" data-path="qsfpdd-led-pair" data-class="led" data-ref="ufispace/qsfpdd-led-pair@1:1.0.0" transform="translate(0,0)">
    <title>qsfpdd-led-pair</title>
    <g id="qsfpdd-led-pair--win-left" data-path="qsfpdd-led-pair/win-left" data-class="led" data-states="off on" data-z-out="0.4">
      <rect x="0" y="0" width="2.6" height="6" rx="0.4" fill="#2f3a46" stroke="#1a1d20" stroke-width="0.15" />
      <rect id="qsfpdd-led-pair--win-left-lens" x="0.25" y="0.25" width="2.1" height="5.5" rx="0.3" fill="var(--led-color, #6590c4)" />
      <line x1="0.25" y1="3" x2="2.35" y2="3" stroke="#1a1d20" stroke-width="0.22" />
    </g>
    <circle id="qsfpdd-led-pair--lamp-upper" cx="4.6" cy="1.0" r="0.7" fill="var(--led-color, #326f08)" stroke="#1a1d20" stroke-width="0.12" data-path="qsfpdd-led-pair/lamp-upper" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-pair--lamp-lower" cx="4.6" cy="5.0" r="0.7" fill="var(--led-color, #326f08)" stroke="#1a1d20" stroke-width="0.12" data-path="qsfpdd-led-pair/lamp-lower" data-class="led" data-states="off on" />
    <g id="qsfpdd-led-pair--win-right" data-path="qsfpdd-led-pair/win-right" data-class="led" data-states="off on" data-z-out="0.4">
      <rect x="6.6" y="0" width="2.6" height="6" rx="0.4" fill="#2f3a46" stroke="#1a1d20" stroke-width="0.15" />
      <rect id="qsfpdd-led-pair--win-right-lens" x="6.85" y="0.25" width="2.1" height="5.5" rx="0.3" fill="var(--led-color, #6590c4)" />
      <line x1="6.85" y1="3" x2="8.95" y2="3" stroke="#1a1d20" stroke-width="0.22" />
    </g>
  </g>
</svg>
