<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.2mm" viewBox="0 0 50.5 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-151-dc@'] .state-critical { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-fw-update { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-fw-update { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-input-lost { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-input-lost { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-warning { --led-color: #22c55e; --led-color-alt: #eab308; }
    g[data-ref^='ufispace/psu-151-dc@'] .state-warning { animation: portrayal-alternate 1s linear infinite; }</style>
  <g id="psu-151-dc" data-path="psu-151-dc" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-151-dc@1:1.1.0" data-inlet="dc-terminal" data-input="dc" data-model="PSU-151-DESR" data-power-output-w="150" transform="translate(0,0)">
    <title>psu-151-dc</title>
    <defs>
      <pattern id="psu-151-dc--sq" width="3.0" height="3.0" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="2.0" height="2.0" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="psu-151-dc--body" x="0" y="0" width="50.5" height="40.2" rx="0.6" fill="#9aa0a8" stroke="#5a6068" stroke-width="0.4" />
    <rect id="psu-151-dc--vent-field" x="2.0" y="2.2" width="25.0" height="13.0" fill="url(#psu-151-dc--sq)" data-z-vent="30" />
    <rect id="psu-151-dc--vent-col" x="40.5" y="10.0" width="7.5" height="22.0" fill="url(#psu-151-dc--sq)" />
    <rect id="psu-151-dc--latch" x="0.4" y="0.6" width="6.4" height="3.6" rx="0.8" fill="#c22f2f" stroke="#8c1f1f" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" data-path="psu-151-dc/latch" data-class="latch" data-z-out="2.2" />
    <g id="psu-151-dc--terminal-block" data-path="psu-151-dc/terminal-block" data-class="inlet" data-z-out="8">
      <rect x="3.0" y="16.5" width="24.6" height="19.2" rx="0.8" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.35" />
      <circle cx="9.5" cy="26.1" r="3.1" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <circle cx="17.0" cy="26.1" r="3.1" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <circle cx="24.5" cy="26.1" r="3.1" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <line x1="7.3" y1="26.1" x2="11.7" y2="26.1" stroke="#4a4f55" stroke-width="0.5" />
      <line x1="14.8" y1="26.1" x2="19.2" y2="26.1" stroke="#4a4f55" stroke-width="0.5" />
      <line x1="22.3" y1="26.1" x2="26.7" y2="26.1" stroke="#4a4f55" stroke-width="0.5" />
      <rect x="7.9" y="33.4" width="3.2" height="1.2" fill="#8a9099" />
      <rect x="15.4" y="33.4" width="3.2" height="1.2" fill="#8a9099" />
      <rect x="22.9" y="33.4" width="3.2" height="1.2" fill="#8a9099" />
    </g>
    <rect id="psu-151-dc--handle" x="28.0" y="2.0" width="4.6" height="36.5" rx="2.2" fill="#17191c" stroke="#0d0f11" stroke-width="0.3" data-path="psu-151-dc/handle" data-class="handle" data-z-uhandle="38" />
    <circle id="psu-151-dc--led-bezel" cx="45.0" cy="6.7" r="2.6" fill="#22262a" />
    <circle id="psu-151-dc--status-led" cx="45.0" cy="6.7" r="1.6" fill="var(--led-color, #3a3f44)" data-path="psu-151-dc/status-led" data-class="led" data-states="off ok standby fw-update critical input-lost warning" data-description="S6301-56ST HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output ON and OK), Blinking Green 1/sec (standby state, input present, only +5VSB on), Blinking Green 2/sec (power supply firmware updating, boot-loader mode - same colour and behaviour token as standby, the table separates them only by blink rate), Yellow (critical event causing shutdown: failure, over current, short circuit, over voltage, fan failure, over temperature), Blinking Yellow 1/sec (DC power cord unplugged or DC power lost with the second supply still fed; or DC present with 5VSB and 12V off via system control), Blinking between Green and Yellow (warning events where the supply continues to operate: high temp, high power, high current, slow fan)" data-z-dome="0.4" />
    <g data-cp="power" data-cp-at="15.3 26.1" data-cp-dir="front" />
  </g>
</svg>
