      <rect x="2.9" y="29.7" width="7" height="7.4" rx="0.5" fill="#16181a" />
      <rect x="11.2" y="3.6" width="7" height="7.4" rx="0.5" fill="#16181a" />
      <rect x="11.2" y="12.3" width="7" height="7.4" rx="0.5" fill="#16181a" />
