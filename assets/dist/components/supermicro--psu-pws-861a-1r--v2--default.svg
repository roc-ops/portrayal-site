    <path id="psu-pws-861a-1r--inlet-bezel" fill-rule="evenodd" d="M27.3 2.6 h24 v30 h-24 Z M29.3 3.6 h20 v28 h-20 Z" fill="#2a2d30" stroke="#17191b" stroke-width="0.3" data-path="psu-pws-861a-1r/inlet-bezel" data-class="inlet" />
    <circle cx="28.5" cy="36.0" r="1.9" fill="#b4b9be" stroke="#8f969d" stroke-width="0.3" />
    <circle id="psu-pws-861a-1r--lamp" cx="28.5" cy="36.0" r="1.1" fill="var(--led-color, #6b5a4c)" stroke="#17191b" stroke-width="0.2" data-path="psu-pws-861a-1r/lamp" data-class="led" data-states="off ok standby warning fault" data-description="Power supply status. Solid green - on; blinking green - plugged in, turned off by the system; blinking amber at 1 Hz - warning, still operating; solid amber - abnormal state. The green blink rate is not stated and is drawn at 1 Hz." />
    <circle cx="35.3" cy="36.0" r="1.5" fill="#17191b" />
    <rect id="psu-pws-861a-1r--release" x="38.4" y="35.6" width="11.6" height="4.4" rx="0.9" fill="#b0434d" stroke="#7a2c33" stroke-width="0.3" data-path="psu-pws-861a-1r/release" data-class="latch" data-z-out="4.0" data-z-color="#b0434d" />
