        <rect x="3.57" y="1.1" width="0.46" height="2.0" />
        <rect x="4.59" y="1.1" width="0.46" height="2.0" />
        <rect x="5.61" y="1.1" width="0.46" height="2.0" />
        <rect x="6.63" y="1.1" width="0.46" height="2.0" />
        <rect x="7.65" y="1.1" width="0.46" height="2.0" />
