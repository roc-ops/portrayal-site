    <rect id="rj45-ganged-link--led-a" x="9.5" y="9.63" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)" data-path="rj45-ganged-link/led-a" data-class="led" data-states="off link activity" data-z-out="0.3" data-z-color="#0d0f11" />
    <g data-cp="net" data-cp-at="6.35 5.1" data-cp-dir="front" />
