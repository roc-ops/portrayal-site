      <path id="rj45-ganged-link--jack--opening" fill="none" d="M 0.395 0.5 h 11.91 v 10.5 h -11.91 z" data-path="rj45-ganged-link/jack/opening" data-class="cutout" />
      <g id="rj45-ganged-link--jack--pins" fill="#a8873c">
