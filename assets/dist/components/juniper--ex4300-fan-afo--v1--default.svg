<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48.6mm" height="42.0mm" viewBox="0 0 48.6 42.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ex4300-fan-afo" data-path="ex4300-fan-afo" data-class="fan" data-behaviour="fills" data-ref="juniper/ex4300-fan-afo@1:1.0.0" data-airflow="front-to-back" data-airflow-label="AIR OUT (AFO)" data-model="EX4300-FAN" data-part-number="EX4300-FAN" data-role="fan-module" data-weight-kg="0.15" data-states="absent" transform="translate(0,0)">
    <title>ex4300-fan-afo</title>
    <defs>
      <pattern id="ex4300-fan-afo--hex" x="0" y="0" width="3.2" height="2.77" patternUnits="userSpaceOnUse">
        <polygon points="1.6,0.2 2.9,0.95 2.9,2.45 1.6,3.2 0.3,2.45 0.3,0.95" fill="#0e1012" transform="scale(0.85) translate(0.1 -0.2)" />
      </pattern>
    </defs>
    <rect id="ex4300-fan-afo--face" x="0" y="0" width="48.6" height="42.0" rx="0.8" fill="#454a4f" stroke="#2b2e35" stroke-width="0.4" />
    <g id="ex4300-fan-afo--grille">
      <rect x="12.0" y="4.0" width="26.0" height="34.0" rx="0.8" fill="#1c1f22" />
      <rect x="12.0" y="4.0" width="26.0" height="34.0" rx="0.8" fill="url(#ex4300-fan-afo--hex)" />
    </g>
    <g id="ex4300-fan-afo--handle" data-path="ex4300-fan-afo/handle" data-class="latch" data-z-out="3.0" data-z-color="#2b2e35">
      <rect x="1.6" y="5.0" width="8.8" height="32.0" rx="3.4" fill="none" stroke="#2b2e35" stroke-width="2.2" />
      <rect x="1.6" y="5.0" width="8.8" height="32.0" rx="3.4" fill="none" stroke="#3a3f45" stroke-width="0.6" />
    </g>
    <g id="ex4300-fan-afo--screw-top" data-path="ex4300-fan-afo/screw-top" data-class="screw" data-z-cyl="2.5" data-z-knurl="1">
      <circle cx="41.4" cy="5.1" r="2.5" fill="#111214" stroke="#5a5f66" stroke-width="0.35" />
      <circle cx="41.4" cy="5.1" r="1.0" fill="#26292d" />
    </g>
    <g id="ex4300-fan-afo--screw-bottom" data-path="ex4300-fan-afo/screw-bottom" data-class="screw">
      <circle cx="41.4" cy="36.6" r="2.0" fill="#111214" stroke="#5a5f66" stroke-width="0.35" />
      <circle cx="41.4" cy="36.6" r="0.8" fill="#26292d" />
    </g>
    <g id="ex4300-fan-afo--airflow-label" font-family="sans-serif" fill="#1d2023">
      <rect id="ex4300-fan-afo--plate" x="42.0" y="16.0" width="5.6" height="16.0" rx="0.6" fill="#d6d9dc" stroke="#9ba0a6" stroke-width="0.25" />
      <g id="ex4300-fan-afo--fan-glyph" transform="translate(46.25 28.5) scale(1.0)">
        <circle r="0.2" />
        <ellipse cx="0" cy="-0.45" rx="0.3" ry="0.45" />
        <ellipse cx="0" cy="-0.45" rx="0.3" ry="0.45" transform="rotate(120)" />
        <ellipse cx="0" cy="-0.45" rx="0.3" ry="0.45" transform="rotate(240)" />
      </g>
    </g>
    <g id="ex4300-fan-afo--silkscreen" font-family="sans-serif" fill="#1d2023">
      <text class="airflow" x="44.4" y="28.5" font-size="1.5" font-weight="bold" text-anchor="start" transform="rotate(-90 44.4 28.5)">AIR OUT</text>
      <text class="airflow" x="46.8" y="26.2" font-size="1.5" font-weight="bold" text-anchor="start" transform="rotate(-90 46.8 26.2)">(AFO)</text>
    </g>
  </g>
</svg>
