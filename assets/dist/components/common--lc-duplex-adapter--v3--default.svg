<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="13.2mm" height="11.0mm" viewBox="0 0 13.2 11.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="lc-duplex-adapter" data-path="lc-duplex-adapter" data-class="port" data-ref="common/lc-duplex-adapter@3:3.1.0" data-connector="lc-duplex" data-media="fiber" transform="translate(0,0)">
    <title>lc-duplex-adapter</title>
    <rect id="lc-duplex-adapter--cap-tx-inset" x="1.95" y="4.15" width="2.7" height="2.7" rx="0.7" fill="#d3d8dd" data-z-sink="0.9" data-z-lift="9.525" />
    <rect id="lc-duplex-adapter--cap-rx-inset" x="8.55" y="4.15" width="2.7" height="2.7" rx="0.7" fill="#d3d8dd" data-z-sink="0.9" data-z-lift="9.525" />
    <path id="lc-duplex-adapter--bezel" fill-rule="evenodd" fill="#2b3035" stroke="#585f66" stroke-width="0.2" d="M 0.1 0.1 h 13 v 10.8 h -13 z            M 0.95 3.15 h 4.7 v 4.7 h -4.7 z            M 7.55 3.15 h 4.7 v 4.7 h -4.7 z" data-z-out="3.175" />
    <rect id="lc-duplex-adapter--cap-tx" x="0.95" y="3.15" width="4.7" height="4.7" rx="1.1" fill="#e9ecef" stroke="#b6bcc2" stroke-width="0.12" data-path="lc-duplex-adapter/cap-tx" data-class="cap" data-z-out="6.35" data-z-lift="3.175" data-z-color="#e9ecef" />
    <rect id="lc-duplex-adapter--cap-rx" x="7.55" y="3.15" width="4.7" height="4.7" rx="1.1" fill="#e9ecef" stroke="#b6bcc2" stroke-width="0.12" data-path="lc-duplex-adapter/cap-rx" data-class="cap" data-z-out="6.35" data-z-lift="3.175" data-z-color="#e9ecef" />
    <g id="lc-duplex-adapter--tx" data-path="lc-duplex-adapter/tx" data-class="port" data-ref="std/lc-bore@2:2.0.0" data-depth="4.5" data-wall="#4a4f55" data-cavity="bore" data-connector="lc" data-media="fiber" transform="translate(0.95,3.15)" data-z-lift="3.175">
      <title>lc-duplex-adapter--tx</title>
      <rect id="lc-duplex-adapter--tx--bore" x="0" y="0" width="4.7" height="4.7" rx="0.35" fill="#15181b" data-path="lc-duplex-adapter/tx/bore" data-class="cutout" />
      <circle id="lc-duplex-adapter--tx--sleeve" cx="2.35" cy="2.35" r="1.2" fill="#22262a" stroke="#3a4046" stroke-width="0.12" />
      <circle id="lc-duplex-adapter--tx--ferrule" cx="2.35" cy="2.35" r="0.625" fill="#e8ecef" data-z-top="3.6" data-z-color="#e8ecef" />
    </g>
    <g id="lc-duplex-adapter--rx" data-path="lc-duplex-adapter/rx" data-class="port" data-ref="std/lc-bore@2:2.0.0" data-depth="4.5" data-wall="#4a4f55" data-cavity="bore" data-connector="lc" data-media="fiber" transform="translate(7.55,3.15)" data-z-lift="3.175">
      <title>lc-duplex-adapter--rx</title>
      <rect id="lc-duplex-adapter--rx--bore" x="0" y="0" width="4.7" height="4.7" rx="0.35" fill="#15181b" data-path="lc-duplex-adapter/rx/bore" data-class="cutout" />
      <circle id="lc-duplex-adapter--rx--sleeve" cx="2.35" cy="2.35" r="1.2" fill="#22262a" stroke="#3a4046" stroke-width="0.12" />
      <circle id="lc-duplex-adapter--rx--ferrule" cx="2.35" cy="2.35" r="0.625" fill="#e8ecef" data-z-top="3.6" data-z-color="#e8ecef" />
    </g>
  </g>
</svg>
