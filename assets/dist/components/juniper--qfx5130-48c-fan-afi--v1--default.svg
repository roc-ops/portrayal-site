<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40.7mm" height="40.8mm" viewBox="0 0 40.7 40.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5130-48c-fan-afi@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5130-48c-fan-afi@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5130-48c-fan-afi" data-path="qfx5130-48c-fan-afi" data-class="fan" data-behaviour="fills" data-ref="juniper/qfx5130-48c-fan-afi@1:1.0.0" data-airflow="back-to-front" data-hot-swap="yes" data-model="QFX5130-48C-FANAI" data-power-absent="not-published" data-role="chassis-fan" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5130-48c-fan-afi</title>
    <defs>
      <pattern id="qfx5130-48c-fan-afi--hex" width="3.9" height="6.75" patternUnits="userSpaceOnUse">
        <polygon points="1.95,0.0 3.4,0.84 3.4,2.53 1.95,3.37 0.5,2.53 0.5,0.84" fill="#0e1012" />
        <polygon points="0,3.38 1.45,4.22 1.45,5.91 0,6.75 -1.45,5.91 -1.45,4.22" fill="#0e1012" />
        <polygon points="3.9,3.38 5.35,4.22 5.35,5.91 3.9,6.75 2.45,5.91 2.45,4.22" fill="#0e1012" />
      </pattern>
    </defs>
    <rect id="qfx5130-48c-fan-afi--face" x="0.2" y="0.2" width="40.3" height="40.4" rx="2.2" fill="#2a8bd8" stroke="#1d5f96" stroke-width="0.4" />
    <g id="qfx5130-48c-fan-afi--grille-top">
      <path d="M 9.8 3.9 H 30.6 L 37.6 10.6 V 23.2 H 3.1 V 12.0 Z" fill="#1c1f22" />
      <path d="M 9.8 3.9 H 30.6 L 37.6 10.6 V 23.2 H 3.1 V 12.0 Z" fill="url(#qfx5130-48c-fan-afi--hex)" />
    </g>
    <g id="qfx5130-48c-fan-afi--windows">
      <path d="M 4.3 24.8 L 9.8 25.4 V 28.9 L 5.5 30.7 Z" fill="#1c1f22" />
      <path d="M 4.3 24.8 L 9.8 25.4 V 28.9 L 5.5 30.7 Z" fill="url(#qfx5130-48c-fan-afi--hex)" />
      <path d="M 29.5 25.2 L 35.8 24.6 L 35.4 29.7 L 32.2 30.7 Z" fill="#1c1f22" />
      <path d="M 29.5 25.2 L 35.8 24.6 L 35.4 29.7 L 32.2 30.7 Z" fill="url(#qfx5130-48c-fan-afi--hex)" />
    </g>
    <g id="qfx5130-48c-fan-afi--grille-bottom">
      <path d="M 7.3 31.7 L 31.1 31.1 L 33.4 34.6 L 30.8 38.2 H 10.6 L 7.3 34.6 Z" fill="#1c1f22" />
      <path d="M 7.3 31.7 L 31.1 31.1 L 33.4 34.6 L 30.8 38.2 H 10.6 L 7.3 34.6 Z" fill="url(#qfx5130-48c-fan-afi--hex)" />
    </g>
    <g id="qfx5130-48c-fan-afi--handle" data-path="qfx5130-48c-fan-afi/handle" data-class="latch" data-z-out="2.0" data-z-color="#2a8bd8">
      <path d="M 0.8 22.0 H 39.9 L 36.3 24.2 H 4.4 Z" fill="#2a8bd8" stroke="#1d5f96" stroke-width="0.3" />
      <rect id="qfx5130-48c-fan-afi--airin-chip" x="13.0" y="23.8" width="13.1" height="6.5" rx="0.8" fill="#4a5562" />
      <g fill="#2a8bd8">
        <circle cx="16.4" cy="27.1" r="0.5" />
        <ellipse cx="16.4" cy="25.7" rx="0.8" ry="1.3" />
        <ellipse cx="16.4" cy="25.7" rx="0.8" ry="1.3" transform="rotate(90 16.4 27.1)" />
        <ellipse cx="16.4" cy="25.7" rx="0.8" ry="1.3" transform="rotate(180 16.4 27.1)" />
        <ellipse cx="16.4" cy="25.7" rx="0.8" ry="1.3" transform="rotate(270 16.4 27.1)" />
      </g>
      <g id="qfx5130-48c-fan-afi--silkscreen">
        <text x="21.9" y="27.0" font-family="sans-serif" font-size="2.5" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="21.9" y="29.8" font-family="sans-serif" font-size="2.5" fill="#e8eaec" text-anchor="middle">IN</text>
      </g>
    </g>
    <g id="qfx5130-48c-fan-afi--screw" data-path="qfx5130-48c-fan-afi/screw" data-class="screw" data-z-cyl="2.5" data-z-knurl="1">
      <circle cx="4.1" cy="4.7" r="3.1" fill="#111214" stroke="#3a3e43" stroke-width="0.35" />
      <circle cx="4.1" cy="4.7" r="1.2" fill="#26292d" />
      <path d="M 2.9 4.7 H 5.3 M 4.1 3.5 V 5.9" stroke="#5a5f66" stroke-width="0.4" />
    </g>
    <circle id="qfx5130-48c-fan-afi--led" cx="36.1" cy="37.1" r="1.4" fill="var(--led-color, #b8bcc2)" stroke="#8d9196" stroke-width="0.3" data-path="qfx5130-48c-fan-afi/led" data-class="led" data-states="green amber off" />
  </g>
</svg>
