    <g id="psu-1100w-dc-14g--silkscreen-lamp" fill="none" stroke="#c9ced3" stroke-width="0.30">
      <path d="M1.50 3.20 l0.85 0 0.50 -1.35 0.65 2.65 0.50 -1.30 0.75 0" />
    </g>
    <circle id="psu-1100w-dc-14g--lamp-status" cx="7.40" cy="3.20" r="1.35" fill="var(--led-color, #2c3a30)" stroke="#454b51" stroke-width="0.3" data-path="psu-1100w-dc-14g/lamp-status" data-class="led" data-states="off ok fault updating mismatch" data-description="The translucent handle, lit from within. ISM table 12 entire: green - a valid source is connected and the supply is operational; blinking amber - a problem with the supply; not illuminated - no power connected; blinking green - firmware is being updated. `mismatch` IS WHY THE SEQUENCE MECHANISM EXISTS, for the fourth time on this chassis: Dell's wording is &quot;the PSU handle blinks green five times at a rate of 4 Hz and turns off&quot;, which gives the phase length exactly - 4 Hz is 0.125 s lit and 0.125 s dark - and then a dark tail that the article does not time. The five blinks and their rate are Dell's; the 2 second tail is this library's reading of &quot;and turns off&quot;. NO RATE IS PUBLISHED for the amber fault or the firmware blink, so 1 Hz is a reading and not a figure - unlike the mismatch, where 4 Hz is stated." />
    <circle id="psu-1100w-dc-14g--fan-label" cx="62.16" cy="19.45" r="9.10" fill="#141719" stroke="#3a4046" stroke-width="0.4" />
