    <path id="psu-1100w-dc-14g--fan" d="M51.63 1.80 H71.93 L80.53 10.40 V28.90 L72.63 36.80 H51.63 L43.03 28.20 V10.40 Z" fill="#141719" stroke="#41474d" stroke-width="0.4" data-path="psu-1100w-dc-14g/fan" data-class="vent" data-description="the exhaust aperture" />
    <g stroke="#2c3237" stroke-width="1.1" fill="none" stroke-linecap="round">
      <path d="M48.19 6.96 L53.56 11.76 M75.37 6.96 L70.55 11.52 M75.79 32.06 L70.63 27.29 M48.19 31.64 L53.46 27.04" />
