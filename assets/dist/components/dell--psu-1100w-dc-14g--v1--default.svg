      <rect id="psu-1100w-dc-14g--terminal--shoulder" x="1.4" y="1.4" width="28.2" height="24.7" rx="0.8" fill="none" stroke="#2b3137" stroke-width="0.5" />
      <g id="psu-1100w-dc-14g--terminal--openings" data-path="psu-1100w-dc-14g/terminal/openings" data-class="cutout">
