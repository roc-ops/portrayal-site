    <path id="psu-1100w-dc-14g--body" fill-rule="evenodd" d="M0.2 1.2 a1 1 0 0 1 1 -1 h83.90 a1 1 0 0 1 1 1 v36.70 a1 1 0 0 1 -1 1 h-83.90 a1 1 0 0 1 -1 -1 Z M10.0 5.5 h31.0 v27.5 h-31.0 Z" fill="#8d949c" stroke="#5f666d" stroke-width="0.4" />
