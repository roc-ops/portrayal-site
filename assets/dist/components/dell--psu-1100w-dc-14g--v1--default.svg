      <circle id="psu-1100w-dc-14g--screw-1" cx="45.73" cy="3.50" r="3.1" fill="#c3c8cd" stroke="#8b9299" stroke-width="0.3" data-z-dome="1.6" data-z-color="#c3c8cd" />
