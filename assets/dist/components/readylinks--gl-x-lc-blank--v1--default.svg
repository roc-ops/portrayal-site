    <circle cx="11.8" cy="9.7" r="2.2" fill="#1f2226" stroke="#3a3e43" stroke-width="0.2" />
    <circle cx="269.7" cy="9.7" r="2.2" fill="#1f2226" stroke="#3a3e43" stroke-width="0.2" />
    <g id="gl-x-lc-blank--thumbscrew-left" data-path="gl-x-lc-blank/thumbscrew-left" data-class="fastener" data-z-cyl="13.7" data-z-color="#b9bec3">
      <circle cx="3.99" cy="9.64" r="3.9" fill="#b9bec3" stroke="#7d8388" stroke-width="0.25" stroke-dasharray="0.35 0.25" />
      <circle cx="3.99" cy="9.64" r="3.1" fill="#cfd3d7" />
      <rect x="2.29" y="9.24" width="3.4" height="0.8" fill="#26292d" />
      <rect x="3.59" y="7.94" width="0.8" height="3.4" fill="#26292d" />
    </g>
    <g id="gl-x-lc-blank--thumbscrew-right" data-path="gl-x-lc-blank/thumbscrew-right" data-class="fastener" data-z-cyl="13.7" data-z-color="#b9bec3">
      <circle cx="277.49" cy="9.64" r="3.9" fill="#b9bec3" stroke="#7d8388" stroke-width="0.25" stroke-dasharray="0.35 0.25" />
      <circle cx="277.49" cy="9.64" r="3.1" fill="#cfd3d7" />
      <rect x="275.79" y="9.24" width="3.4" height="0.8" fill="#26292d" />
      <rect x="277.09" y="7.94" width="0.8" height="3.4" fill="#26292d" />
    </g>
    <g data-cp="mate" data-cp-at="140.75 9.775" data-cp-dir="rear" />
  </g>
</svg>
