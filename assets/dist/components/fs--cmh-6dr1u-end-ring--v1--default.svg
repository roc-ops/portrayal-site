<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86mm" height="12mm" viewBox="0 0 86 12">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="cmh-6dr1u-end-ring" data-path="cmh-6dr1u-end-ring" data-class="mechanical" data-behaviour="mounts" data-ref="fs/cmh-6dr1u-end-ring@1:1.0.0" data-guide="ring" data-guide-run="y" data-guide-aperture="83.6 75.6" data-material="Steel, Powder-coated Black" transform="translate(0,0)">
    <title>cmh-6dr1u-end-ring</title>
    <rect id="cmh-6dr1u-end-ring--back" x="0" y="0" width="86" height="12" fill="#16181b" data-path="cmh-6dr1u-end-ring/back" data-class="bezel" data-z-out="1.2" data-z-color="#0c0d0f" />
    <rect id="cmh-6dr1u-end-ring--leg-left" x="0" y="0" width="1.2" height="12" fill="#0c0d0f" data-path="cmh-6dr1u-end-ring/leg-left" data-class="bezel" data-z-out="78.0" data-z-color="#0c0d0f" />
    <rect id="cmh-6dr1u-end-ring--leg-right" x="84.8" y="0" width="1.2" height="12" fill="#0c0d0f" data-path="cmh-6dr1u-end-ring/leg-right" data-class="bezel" data-z-out="78.0" data-z-color="#0c0d0f" />
    <rect id="cmh-6dr1u-end-ring--front-left" x="0" y="0" width="36.8" height="12" fill="#101214" data-path="cmh-6dr1u-end-ring/front-left" data-class="bezel" data-z-out="78.0" data-z-lift="76.8" data-z-color="#0c0d0f" />
    <rect id="cmh-6dr1u-end-ring--front-right" x="50" y="0" width="36" height="12" fill="#101214" data-path="cmh-6dr1u-end-ring/front-right" data-class="bezel" data-z-out="78.0" data-z-lift="76.8" data-z-color="#0c0d0f" />
    <rect id="cmh-6dr1u-end-ring--curl-root" x="48.8" y="0" width="1.2" height="12" fill="#0c0d0f" data-path="cmh-6dr1u-end-ring/curl-root" data-class="bezel" data-z-out="84.8" data-z-lift="78.0" data-z-color="#0c0d0f" />
    <rect id="cmh-6dr1u-end-ring--curl-tip" x="40" y="0" width="10" height="12" rx="0.6" fill="#0c0d0f" data-path="cmh-6dr1u-end-ring/curl-tip" data-class="bezel" data-z-out="86.0" data-z-lift="84.8" data-z-color="#0c0d0f" />
  </g>
</svg>
