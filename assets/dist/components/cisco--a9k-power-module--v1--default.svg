    <circle id="a9k-power-module--input" cx="127.48" cy="9.31" r="1.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-power-module/input" data-class="led" data-states="off on blinking" data-description="Input LED. ON continuously when the input voltage is present and within the correct range; BLINKING when the input voltage is out of acceptable range; OFF when no input voltage is present. Cisco states no colour for it." data-z-dome="0.3" />
    <circle id="a9k-power-module--output" cx="127.48" cy="15.92" r="1.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-power-module/output" data-class="led" data-states="off on blinking" data-description="Output LED. ON when the power module output voltage is present; BLINKING when the power module is in a power limit or overcurrent condition. Cisco states no colour for it." data-z-dome="0.3" />
    <circle id="a9k-power-module--fault" cx="127.48" cy="22.53" r="1.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-power-module/fault" data-class="led" data-states="off on" data-description="Fault LED. ON indicates that a power supply failure has occurred. Cisco states no colour for it, and gives no off-state sentence." data-z-dome="0.3" />
