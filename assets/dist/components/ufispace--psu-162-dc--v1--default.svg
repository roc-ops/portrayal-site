<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.0mm" viewBox="0 0 50.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="psu-162-dc" data-path="psu-162-dc" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-162-dc@1:1.0.0" data-airflow="exhaust" data-input="dc" data-model="PSU-162-DESR" data-power-output-w="1600" transform="translate(0,0)">
    <title>psu-162-dc</title>
    <defs>
      <pattern id="psu-162-dc--mesh162dc" width="4.0" height="4.0" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="3.0" height="3.0" rx="0.3" fill="#101315" />
      </pattern>
    </defs>
    <rect id="psu-162-dc--body" x="0" y="0" width="50.5" height="40" rx="0.6" fill="#1c1f22" stroke="#0d0f11" stroke-width="0.4" />
    <g id="psu-162-dc--mesh-grille" data-z-vent="25">
      <rect x="1.5" y="2.0" width="20.5" height="36.0" rx="0.5" fill="#c9ced4" />
      <rect x="1.5" y="2.0" width="20.5" height="36.0" rx="0.5" fill="url(#psu-162-dc--mesh162dc)" />
      <rect x="1.5" y="2.0" width="20.5" height="36.0" rx="0.5" fill="none" stroke="#8d9297" stroke-width="0.35" />
    </g>
    <circle id="psu-162-dc--status-led" cx="8.5" cy="4.9" r="1.5" fill="var(--led-color, #3a3f44)" stroke="#0d0f11" stroke-width="0.2" data-path="psu-162-dc/status-led" data-class="led" data-states="off on" data-description="Present in HIG Figure 7 and given no table anywhere in this guide, so the states are the component default rather than a vocabulary borrowed from another platform" data-z-dome="0.4" />
    <g id="psu-162-dc--handle" fill="none" stroke="#c8102e" stroke-width="2.8" stroke-linecap="round" data-path="psu-162-dc/handle" data-class="handle" data-z-uhandle="30">
      <path d="M 12.0 4.4 L 17.0 8.0 L 17.0 32.0 L 12.0 35.6" />
    </g>
    <g id="psu-162-dc--dc-input" data-path="psu-162-dc/dc-input" data-class="inlet" data-z-out="0.8">
      <rect x="24.0" y="4.0" width="19.0" height="32.0" rx="0.8" fill="#101315" stroke="#4a4f55" stroke-width="0.4" />
      <rect x="26.5" y="8.0" width="14.0" height="8.5" rx="0.5" fill="#8d9297" />
      <rect x="26.5" y="23.5" width="14.0" height="8.5" rx="0.5" fill="#8d9297" />
      <rect x="26.5" y="18.6" width="14.0" height="2.8" rx="0.3" fill="#2b2f33" />
    </g>
    <g id="psu-162-dc--silkscreen" fill="#c9ced4" font-family="sans-serif" font-size="2.2" text-anchor="middle">
      <text x="33.5" y="7.2">+</text>
      <text x="33.5" y="38.6">-</text>
    </g>
    <rect id="psu-162-dc--edge-strip" x="43.5" y="0.6" width="6.4" height="38.8" rx="0.5" fill="#3a3f44" />
    <rect id="psu-162-dc--latch" x="44.0" y="2.0" width="5.5" height="14.0" rx="1.0" fill="#c8102e" stroke="#8f0b21" stroke-width="0.3" data-path="psu-162-dc/latch" data-class="latch" data-z-out="1.2" />
  </g>
</svg>
