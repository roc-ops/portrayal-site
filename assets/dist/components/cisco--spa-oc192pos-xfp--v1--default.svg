<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="17.29mm" height="167.87mm" viewBox="0 0 17.29 167.87">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/spa-oc192pos-xfp@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/spa-oc192pos-xfp@'] .state-green { --led-color: #39b54a; }</style>
  <g id="spa-oc192pos-xfp" data-path="spa-oc192pos-xfp" data-class="line-card" data-behaviour="fills" data-ref="cisco/spa-oc192pos-xfp@1:1.0.0" data-wall="#4a4f55" data-eol="none-announced" data-form-factor="single-width, single-height (one SIP-700 subslot)" data-media="XFP, OC-192c/STM-64 POS/RPR" data-min-hardware-revision="1.0" data-min-ios-xr="4.0.0" data-model="SPA-OC192POS-XFP" data-ports="1" data-power-absent="not-published" data-role="shared-port-adapter" transform="translate(0,0)">
    <title>spa-oc192pos-xfp</title>
    <rect id="spa-oc192pos-xfp--plate" x="0" y="0" width="17.29" height="167.87" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3" />
    <rect id="spa-oc192pos-xfp--rpr-mate" x="4.99" y="94.77" width="7.6899999999999995" height="38.2" rx="0.4" fill="#3f4448" stroke="#2a2e31" stroke-width="0.25" />
    <g>
      <circle cx="8.645" cy="3.4" r="2.2" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="8.645" cy="3.4" r="1.0" fill="#6d7379" />
    </g>
    <g>
      <circle cx="8.645" cy="164.47" r="2.2" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="8.645" cy="164.47" r="1.0" fill="#6d7379" />
    </g>
    <g id="spa-oc192pos-xfp--silkscreen">
      <text x="4.23" y="40.41" transform="rotate(90 4.23 40.41)" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#231f20">0</text>
      <text x="6.63" y="7.35" transform="rotate(90 6.63 7.35)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">WRAP</text>
      <text x="8.33" y="13.59" transform="rotate(90 8.33 13.59)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">PASSTHRU</text>
      <text x="10.03" y="19.47" transform="rotate(90 10.03 19.47)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">MATESYNC</text>
      <text x="6.63" y="69.06" transform="rotate(90 6.63 69.06)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">CARRIER</text>
      <text x="8.33" y="76.04" transform="rotate(90 8.33 76.04)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">ACTIVE</text>
      <text x="9.7" y="166.03" transform="rotate(90 9.7 166.03)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">STATUS</text>
      <text x="14.98" y="139.01" transform="rotate(90 14.98 139.01)" font-family="sans-serif" font-size="1.7" font-weight="bold" fill="#231f20">SPA-OC192POS-XFP</text>
    </g>
    <g id="spa-oc192pos-xfp--p0" data-path="spa-oc192pos-xfp/p0" data-class="port" data-ref="std/xfp@1:1.0.0" data-depth="61.7" data-wall="#aab0b7" data-media="xfp" transform="translate(-1.11,35.56) rotate(90 9.75 4.85)">
      <title>spa-oc192pos-xfp--p0</title>
      <rect id="spa-oc192pos-xfp--p0--opening" x="0" y="0" width="19.5" height="9.7" rx="0.5" fill="#17191c" data-path="spa-oc192pos-xfp/p0/opening" data-class="cutout" />
      <rect id="spa-oc192pos-xfp--p0--collar" x="0.5" y="0.5" width="18.5" height="8.7" rx="0.4" fill="#0d0f11" data-z-out="1.0" data-z-color="#7d848c" />
      <rect id="spa-oc192pos-xfp--p0--module-slot" x="1.4" y="1.5" width="16.7" height="2.2" rx="0.3" fill="#2b2f33" />
      <rect id="spa-oc192pos-xfp--p0--latch-window" x="1.4" y="5.4" width="16.7" height="2.6" rx="0.3" fill="#000000" />
    </g>
    <g id="spa-oc192pos-xfp--rpr-screw-0" data-z-cyl="1.6">
      <circle cx="8.84" cy="88.89" r="1.5" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.25" />
      <circle cx="8.84" cy="88.89" r="0.6" fill="#6d7379" />
    </g>
    <g id="spa-oc192pos-xfp--rpr-screw-1" data-z-cyl="1.6">
      <circle cx="8.84" cy="137.01" r="1.5" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.25" />
      <circle cx="8.84" cy="137.01" r="0.6" fill="#6d7379" />
    </g>
    <rect id="spa-oc192pos-xfp--led-wrap" x="3.13" y="6.65" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-oc192pos-xfp/led-wrap" data-class="led" data-states="green amber off" data-description="the SPA's WRAP lamp, which describes the RPR ring rather than the port. Table 17 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not in wrap mode; green on - port is in wrap mode somewhere on the ring; amber on - port is in wrap mode locally. Cisco: 'The WRAP, PASSTHRU, and MATESYNC LEDs apply to the SPA in RPR/SRP mode only.'" data-z-dome="0.3" />
    <rect id="spa-oc192pos-xfp--led-passthru" x="3.13" y="12.89" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-oc192pos-xfp/led-passthru" data-class="led" data-states="amber off" data-description="the SPA's PASSTHRU lamp. Table 17 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not in pass-through mode; amber on - port is in pass-through mode. Cisco: 'The WRAP, PASSTHRU, and MATESYNC LEDs apply to the SPA in RPR/SRP mode only.'" data-z-dome="0.3" />
    <rect id="spa-oc192pos-xfp--led-matesync" x="3.13" y="18.77" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-oc192pos-xfp/led-matesync" data-class="led" data-states="green off" data-description="the SPA's MATESYNC lamp, which describes the mate link through the 40-pin connector. Table 17 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - mate port is not synchronized; green on - mate port is synchronized. Cisco: 'The WRAP, PASSTHRU, and MATESYNC LEDs apply to the SPA in RPR/SRP mode only.'" data-z-dome="0.3" />
    <rect id="spa-oc192pos-xfp--led-carrier-p0" x="3.13" y="68.36" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-oc192pos-xfp/led-carrier-p0" data-class="led" data-states="green amber off" data-description="the port's CARRIER lamp. Table 17 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, and there is a valid SONET signal without alarms; amber on - at least one alarm (LOS, LOF, RDI, and so on); blinking - SRP mode mismatch alarm is indicated. The blinking row carries no colour of its own and is recorded here rather than added to the vocabulary." data-z-dome="0.3" />
    <rect id="spa-oc192pos-xfp--led-active-p0" x="3.13" y="75.34" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-oc192pos-xfp/led-active-p0" data-class="led" data-states="green amber off" data-description="the port's ACTIVE lamp. Table 17 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, and loopback is off; amber on - port is enabled by software, and loopback is on." data-z-dome="0.3" />
    <circle id="spa-oc192pos-xfp--status" cx="7.3" cy="166.03" r="1.1" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="spa-oc192pos-xfp/status" data-class="led" data-states="green amber off" data-description="the SPA's STATUS lamp, the one lamp every SPA in this guide carries. Table 17 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - SPA power is off; green on - SPA is ready and operational; amber on - SPA power is on and good, and the SPA is being configured." data-z-dome="0.3" />
  </g>
</svg>
