    </g>
    <g id="eps201-psu-150w--retainer" fill="none" stroke="#2b2f34" stroke-width="0.65" stroke-linecap="round">
      <path d="M 46.6 19.5 V 33.0" />
      <path d="M 46.6 19.5 H 42.6" />
      <path d="M 46.6 33.0 H 42.6" />
    </g>
    <g id="eps201-psu-150w--latch" data-path="eps201-psu-150w/latch" data-class="latch" data-z-out="0.9">
      <rect x="0.60" y="12.00" width="2.60" height="15.00" rx="1.10" fill="#ef3927" stroke="#2b2f34" stroke-width="0.25" data-fill-from="latch-finish" />
    </g>
    <g id="eps201-psu-150w--inlet" data-path="eps201-psu-150w/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(20.0,16.2)">
      <title>eps201-psu-150w--inlet</title>
      <rect id="eps201-psu-150w--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="eps201-psu-150w/inlet/opening" data-class="cutout" />
      <path id="eps201-psu-150w--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="eps201-psu-150w--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="eps201-psu-150w--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="eps201-psu-150w--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
