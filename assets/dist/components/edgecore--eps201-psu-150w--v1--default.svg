      <rect x="4.20" y="7.50" width="6.40" height="27.00" fill="url(#eps201-psu-150w--eps201-psu-mesh)" />
      <rect x="4.20" y="7.50" width="6.40" height="27.00" rx="0.3" fill="none" stroke="#5d6267" stroke-width="0.25" />
    </g>
    <g id="eps201-psu-150w--slot" data-path="eps201-psu-150w/slot" data-class="handle" data-depth="2.0" data-wall="#3a3e43">
      <rect x="12.00" y="8.40" width="33.00" height="4.20" rx="2.10" fill="#16181b" stroke="#5d6267" stroke-width="0.28" />
    </g>
    <circle id="eps201-psu-150w--face-screw" cx="14.60" cy="4.60" r="1.70" fill="#d7dbdf" stroke="#6e757c" stroke-width="0.22" />
    <g id="eps201-psu-150w--inlet-well" data-path="eps201-psu-150w/inlet-well" data-class="bezel" data-depth="2.2" data-wall="#3a3e43">
