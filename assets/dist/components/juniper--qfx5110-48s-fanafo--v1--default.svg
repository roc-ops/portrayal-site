      <rect x="8.6" y="29.7" width="26.8" height="8.0" rx="1.0" fill="url(#qfx5110-48s-fanafo--hex)" />
    </g>
    <g id="qfx5110-48s-fanafo--handle" data-path="qfx5110-48s-fanafo/handle" data-class="latch" data-z-out="2.0" data-z-color="#e8731f">
      <rect x="1.2" y="12.6" width="38.5" height="16.4" rx="3.0" fill="#e8731f" stroke="#b95812" stroke-width="0.4" />
