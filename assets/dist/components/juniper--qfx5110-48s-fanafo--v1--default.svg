      <rect id="qfx5110-48s-fanafo--airout-chip" x="12.9" y="17.4" width="15.0" height="6.6" rx="0.8" fill="#5b6066" />
      <g fill="#e8731f">
        <circle cx="16.3" cy="20.7" r="0.5" />
        <ellipse cx="16.3" cy="19.4" rx="0.7" ry="1.1" />
        <ellipse cx="16.3" cy="19.4" rx="0.7" ry="1.1" transform="rotate(120 16.3 20.7)" />
        <ellipse cx="16.3" cy="19.4" rx="0.7" ry="1.1" transform="rotate(240 16.3 20.7)" />
