    </g>
    <g id="qfx5110-48s-fanafo--screw" data-path="qfx5110-48s-fanafo/screw" data-class="screw" data-z-cyl="2.5" data-z-knurl="1">
      <circle cx="4.7" cy="4.9" r="3.0" fill="#111214" stroke="#3a3e43" stroke-width="0.35" />
      <circle cx="4.7" cy="4.9" r="1.2" fill="#26292d" />
