      <g id="qfx5110-48s-fanafo--silkscreen">
        <text x="22.4" y="19.9" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="22.4" y="22.5" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">OUT</text>
