    <rect id="bfan-h--label-2" x="332.6" y="17.9" width="59.6" height="9.3" rx="0.8" fill="#e9eaeb" stroke="#3a3f44" stroke-width="0.25" data-path="bfan-h/label-2" data-class="label" />
    <rect id="bfan-h--label-3" x="332.6" y="28.9" width="59.6" height="8.9" rx="0.8" fill="#e9eaeb" stroke="#3a3f44" stroke-width="0.25" data-path="bfan-h/label-3" data-class="label" />
