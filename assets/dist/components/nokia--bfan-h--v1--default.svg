    <rect id="bfan-h--plate" x="1.1" y="0" width="490.7" height="49.2" rx="0.5" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.3" />
    <g id="bfan-h--lip-rails" fill="#8d9298" stroke="#6f757b" stroke-width="0.2">
      <rect x="9.6" y="49.2" width="4.1" height="7.8" />
      <rect x="479.2" y="49.2" width="4.1" height="7.8" />
    </g>
