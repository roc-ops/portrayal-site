    <g id="bfan-h--led-alm" data-path="bfan-h/led-alm" data-class="led" data-ref="common/led-indicator@1:1.2.0" transform="translate(244.4,18.2)" data-group="status-leds" data-group-role="indicator" data-description="the fan tray's single status lamp, legend ALM">
