      <circle id="bfan-h--led-alm--lamp" cx="2" cy="2" r="1.0" fill="var(--led-color, #3a3f44)" data-path="bfan-h/led-alm/lamp" data-class="led" data-states="off starting on closed-loop fail" data-z-dome="0.45" />
