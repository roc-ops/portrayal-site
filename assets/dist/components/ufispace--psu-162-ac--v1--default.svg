<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.0mm" viewBox="0 0 50.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="psu-162-ac" data-path="psu-162-ac" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-162-ac@1:1.0.0" data-airflow="exhaust" data-input="ac" data-model="PSU-162-AESR" data-power-output-w="1600" transform="translate(0,0)">
    <title>psu-162-ac</title>
    <defs>
      <pattern id="psu-162-ac--mesh162" width="4.0" height="4.0" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="3.0" height="3.0" rx="0.3" fill="#101315" />
      </pattern>
    </defs>
    <rect id="psu-162-ac--body" x="0" y="0" width="50.5" height="40" rx="0.6" fill="#1c1f22" stroke="#0d0f11" stroke-width="0.4" />
    <g id="psu-162-ac--mesh-grille" data-z-vent="25">
      <rect x="1.5" y="2.0" width="20.5" height="36.0" rx="0.5" fill="#c9ced4" />
      <rect x="1.5" y="2.0" width="20.5" height="36.0" rx="0.5" fill="url(#psu-162-ac--mesh162)" />
      <rect x="1.5" y="2.0" width="20.5" height="36.0" rx="0.5" fill="none" stroke="#8d9297" stroke-width="0.35" />
    </g>
    <rect id="psu-162-ac--edge-strip" x="43.5" y="0.6" width="6.4" height="38.8" rx="0.5" fill="#3a3f44" />
    <g id="psu-162-ac--handle" fill="none" stroke="#c8102e" stroke-width="2.8" stroke-linecap="round" data-path="psu-162-ac/handle" data-class="handle" data-z-uhandle="30">
      <path d="M 12.0 4.4 L 17.0 8.0 L 17.0 32.0 L 12.0 35.6" />
    </g>
    <rect id="psu-162-ac--latch" x="44.0" y="2.0" width="5.5" height="14.0" rx="1.0" fill="#c8102e" stroke="#8f0b21" stroke-width="0.3" data-path="psu-162-ac/latch" data-class="latch" data-z-out="1.2" />
    <circle id="psu-162-ac--status-led" cx="8.5" cy="4.9" r="1.5" fill="var(--led-color, #3a3f44)" stroke="#0d0f11" stroke-width="0.2" data-path="psu-162-ac/status-led" data-class="led" data-states="off on" data-description="Present in HIG Figure 7 and given no table anywhere in this guide, so the states are the component default rather than a vocabulary borrowed from another platform" data-z-dome="0.4" />
    <g id="psu-162-ac--inlet" data-path="psu-162-ac/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(17.6,7.9) rotate(270 16.2 12.2)">
      <title>psu-162-ac--inlet</title>
      <rect id="psu-162-ac--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="psu-162-ac/inlet/opening" data-class="cutout" />
      <rect id="psu-162-ac--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="psu-162-ac--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-162-ac--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-162-ac--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
