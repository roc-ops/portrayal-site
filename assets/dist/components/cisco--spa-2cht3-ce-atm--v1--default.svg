      <text x="5.83" y="72.36" transform="rotate(90 5.83 72.36)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">C/A</text>
      <text x="9.63" y="72.36" transform="rotate(90 9.63 72.36)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">A/L</text>
      <text x="11.04" y="165.3" transform="rotate(90 11.04 165.3)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">STATUS</text>
      <text x="14.16" y="139.01" transform="rotate(90 14.16 139.01)" font-family="sans-serif" font-size="1.7" font-weight="bold" fill="#231f20">SPA-2CHT3-CE-ATM</text>
