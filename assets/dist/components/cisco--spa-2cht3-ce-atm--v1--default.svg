      <circle cx="8.64" cy="49.59" r="0.9" fill="#3f4448" />
    </g>
    <g id="spa-2cht3-ce-atm--p1-rx">
      <circle cx="8.64" cy="61.34" r="2.3" fill="#b8bdc2" stroke="#7d848c" stroke-width="0.25" />
      <circle cx="8.64" cy="61.34" r="0.9" fill="#3f4448" />
    </g>
    <rect id="spa-2cht3-ce-atm--led-ca-p0" x="0.63" y="37.87" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-2cht3-ce-atm/led-ca-p0" data-class="led" data-states="green amber off" data-description="the port's C/A (Carrier/Alarm) lamp. Table 37 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software; amber on - port is enabled by software and there is at least one alarm. NOTE the green row is the short form in this part's table - it does not mention a valid signal." data-z-dome="0.3" />
    <rect id="spa-2cht3-ce-atm--led-al-p0" x="4.43" y="37.87" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-2cht3-ce-atm/led-al-p0" data-class="led" data-states="green amber off" data-description="the port's A/L (Active/Loopback) lamp. Table 37 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, loopback is off; amber on - port is enabled by software, loopback is on." data-z-dome="0.3" />
    <rect id="spa-2cht3-ce-atm--led-ca-p1" x="0.63" y="71.66" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-2cht3-ce-atm/led-ca-p1" data-class="led" data-states="green amber off" data-description="the port's C/A (Carrier/Alarm) lamp. Table 37 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software; amber on - port is enabled by software and there is at least one alarm. NOTE the green row is the short form in this part's table - it does not mention a valid signal." data-z-dome="0.3" />
    <rect id="spa-2cht3-ce-atm--led-al-p1" x="4.43" y="71.66" width="2.2" height="1.4" rx="0.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.15" data-path="spa-2cht3-ce-atm/led-al-p1" data-class="led" data-states="green amber off" data-description="the port's A/L (Active/Loopback) lamp. Table 37 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, loopback is off; amber on - port is enabled by software, loopback is on." data-z-dome="0.3" />
    <circle id="spa-2cht3-ce-atm--status" cx="8.64" cy="165.3" r="1.1" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="spa-2cht3-ce-atm/status" data-class="led" data-states="green amber off" data-description="the SPA's STATUS lamp, the one lamp every SPA in this guide carries. Table 37 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - SPA power is off; green on - SPA is ready and operational; amber on - SPA power is on and good, and the SPA is being configured." data-z-dome="0.3" />
    <g>
