      <text x="5.04" y="49.59" transform="rotate(90 5.04 49.59)" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#231f20">1</text>
      <text x="4.13" y="38.57" transform="rotate(90 4.13 38.57)" font-family="sans-serif" font-size="1.3" text-anchor="middle" fill="#231f20">C/A</text>
