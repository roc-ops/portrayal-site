    <rect id="spa-2cht3-ce-atm--led-al-p0" x="4.43" y="37.87" width="2.2" height="1.4" rx="0.3" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.15" data-path="spa-2cht3-ce-atm/led-al-p0" data-class="led" data-states="green amber off" data-description="the port's A/L (Active/Loopback) lamp. Table 37 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not enabled by software; green on - port is enabled by software, loopback is off; amber on - port is enabled by software, loopback is on." data-z-dome="0.3" />
