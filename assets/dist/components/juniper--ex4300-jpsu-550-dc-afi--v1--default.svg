      <circle id="ex4300-jpsu-550-dc-afi--led-out-ok" cx="69.0" cy="7.4" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4300-jpsu-550-dc-afi/led-out-ok" data-class="led" data-states="green red off" />
