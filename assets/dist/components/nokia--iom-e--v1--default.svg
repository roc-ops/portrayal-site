      <circle cx="251.3" cy="7.9" r="1.92" fill="none" stroke="#6f757c" stroke-width="0.3" />
      <path d="M 246.35 6.25 L 256.25 9.55 M 249.65 12.85 L 252.95 2.95" stroke="#6f757c" stroke-width="0.35" />
    </g>
    <g id="iom-e--lever-left" data-path="iom-e/lever-left" data-class="latch" data-z-out="4.2" data-z-color="#5a6066">
      <rect x="10.7" y="65.9" width="64.30" height="3.50" rx="0.4" fill="#5a6066" stroke="#1d2023" stroke-width="0.25" />
      <line x1="11.70" y1="67.65" x2="74.00" y2="67.65" stroke="#454a50" stroke-width="0.3" />
    </g>
    <g id="iom-e--lever-right" data-path="iom-e/lever-right" data-class="latch" data-z-out="4.2" data-z-color="#5a6066">
      <rect x="193.4" y="65.9" width="59.10" height="3.50" rx="0.4" fill="#5a6066" stroke="#1d2023" stroke-width="0.25" />
      <line x1="194.40" y1="67.65" x2="251.50" y2="67.65" stroke="#454a50" stroke-width="0.3" />
    </g>
    <g id="iom-e--led-pwr-stat" data-path="iom-e/led-pwr-stat" data-class="led" data-ref="common/led-dot@1:1.1.0" transform="translate(39.6,61.3)" data-group="status-leds" data-group-role="indicator" data-description="the one Pwr/Stat lamp">
      <title>iom-e--led-pwr-stat</title>
      <circle id="iom-e--led-pwr-stat--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="iom-e--led-pwr-stat--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="iom-e/led-pwr-stat/lamp" data-class="led" data-states="off loading operational" data-z-dome="0.3" />
    </g>
    <g data-cp="mate" data-cp-at="129.55 35.4" data-cp-dir="rear" />
  </g>
</svg>
