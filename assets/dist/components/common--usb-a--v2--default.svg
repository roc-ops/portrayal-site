<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="17.0mm" height="7.0mm" viewBox="0 0 17.0 7.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="usb-a" data-path="usb-a" data-class="port" data-ref="common/usb-a@2:2.0.0" data-depth="13.7" data-media="usb-a" transform="translate(0,0)">
    <title>usb-a</title>
    <g id="usb-a--symbol" stroke="#c7ccd1" stroke-width="0.32" fill="none" data-path="usb-a/symbol" data-class="silkscreen">
      <line x1="1.7" y1="5.6" x2="1.7" y2="2.0" />
      <circle cx="1.7" cy="5.8" r="0.35" fill="#c7ccd1" stroke="none" />
      <path d="M 1.7 3.4 l -1.1 -0.9" />
      <circle cx="0.5" cy="2.4" r="0.3" fill="#c7ccd1" stroke="none" />
      <path d="M 1.7 4.4 l 1.1 -1.0" />
      <rect x="2.5" y="3.0" width="0.6" height="0.6" fill="#c7ccd1" stroke="none" />
      <path d="M 1.7 2.0 l -0.45 0.7 h 0.9 z" fill="#c7ccd1" stroke="none" />
    </g>
    <rect id="usb-a--receptacle" x="3.5" y="0.7" width="13" height="5.6" rx="0.4" fill="#0c0e10" stroke="#4a4f55" stroke-width="0.3" data-path="usb-a/receptacle" data-class="jack" />
    <g id="usb-a--port" data-path="usb-a/port" data-class="port" data-ref="std/usb-a@1:1.2.0" data-depth="13.7" data-wall="#a7adb4" data-media="usb-a" transform="translate(4.0,1.25)">
      <title>usb-a--port</title>
      <rect id="usb-a--port--opening" x="0" y="0" width="12" height="4.5" fill="#17191c" data-path="usb-a/port/opening" data-class="cutout" />
      <rect id="usb-a--port--tongue" x="0.9" y="0.8" width="10.2" height="1.5" rx="0.2" fill="#2b6cb0" data-z-top="12.1" data-z-color="#2b6cb0" />
    </g>
  </g>
</svg>
