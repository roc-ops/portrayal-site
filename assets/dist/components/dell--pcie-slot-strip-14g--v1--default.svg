<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10.75mm" height="62.0mm" viewBox="0 0 10.75 62.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="pcie-slot-strip-14g" data-path="pcie-slot-strip-14g" data-class="mechanical" data-behaviour="mounts" data-ref="dell/pcie-slot-strip-14g@1:1.1.0" data-depth="2.0" transform="translate(0,0)">
    <title>pcie-slot-strip-14g</title>
    <rect id="pcie-slot-strip-14g--strip" x="0" y="0" width="10.75" height="62.0" rx="0.8" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.3" data-path="pcie-slot-strip-14g/strip" data-class="bezel" />
    <g id="pcie-slot-strip-14g--silkscreen">
      <text x="9.38" y="9.00" font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="#4a5057">1</text>
      <text x="9.38" y="29.00" font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="#4a5057">2</text>
      <text x="9.38" y="49.00" font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="#4a5057">3</text>
    </g>
    <g id="pcie-slot-strip-14g--clip-1" data-path="pcie-slot-strip-14g/clip-1" data-class="latch" data-behaviour="mounts" data-ref="dell/pcie-retention-clip-14g@1:1.0.0" data-depth="3.0" transform="translate(-1.0,3.75)">
      <title>pcie-slot-strip-14g--clip-1</title>
      <g id="pcie-slot-strip-14g--clip-1--tabs" fill="#3a4045" stroke="#23282c" stroke-width="0.3" data-path="pcie-slot-strip-14g/clip-1/tabs" data-class="latch">
        <rect x="0" y="0" width="7.5" height="3.0" rx="0.6" />
        <rect x="0" y="13.5" width="7.5" height="3.0" rx="0.6" />
      </g>
    </g>
    <g id="pcie-slot-strip-14g--clip-2" data-path="pcie-slot-strip-14g/clip-2" data-class="latch" data-behaviour="mounts" data-ref="dell/pcie-retention-clip-14g@1:1.0.0" data-depth="3.0" transform="translate(-1.0,23.75)">
      <title>pcie-slot-strip-14g--clip-2</title>
      <g id="pcie-slot-strip-14g--clip-2--tabs" fill="#3a4045" stroke="#23282c" stroke-width="0.3" data-path="pcie-slot-strip-14g/clip-2/tabs" data-class="latch">
        <rect x="0" y="0" width="7.5" height="3.0" rx="0.6" />
        <rect x="0" y="13.5" width="7.5" height="3.0" rx="0.6" />
      </g>
    </g>
    <g id="pcie-slot-strip-14g--clip-3" data-path="pcie-slot-strip-14g/clip-3" data-class="latch" data-behaviour="mounts" data-ref="dell/pcie-retention-clip-14g@1:1.0.0" data-depth="3.0" transform="translate(-1.0,43.75)">
      <title>pcie-slot-strip-14g--clip-3</title>
      <g id="pcie-slot-strip-14g--clip-3--tabs" fill="#3a4045" stroke="#23282c" stroke-width="0.3" data-path="pcie-slot-strip-14g/clip-3/tabs" data-class="latch">
        <rect x="0" y="0" width="7.5" height="3.0" rx="0.6" />
        <rect x="0" y="13.5" width="7.5" height="3.0" rx="0.6" />
      </g>
    </g>
  </g>
</svg>
