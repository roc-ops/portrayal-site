        <path d="M 4.25 0 L 3.775 0.823 L 2.825 0.823 L 2.35 0 L 2.825 -0.823 L 3.775 -0.823 Z" fill="#101214" />
        <path d="M 2.6 0.9525 L 2.125 1.7755 L 1.175 1.7755 L 0.7 0.9525 L 1.175 0.1295 L 2.125 0.1295 Z" fill="#101214" />
        <path d="M 0.95 1.905 L 0.475 2.728 L -0.475 2.728 L -0.95 1.905 L -0.475 1.082 L 0.475 1.082 Z" fill="#101214" />
        <path d="M 4.25 1.905 L 3.775 2.728 L 2.825 2.728 L 2.35 1.905 L 2.825 1.082 L 3.775 1.082 Z" fill="#101214" />
      </pattern>
    </defs>
    <rect id="psu-r3059-f8001--body" x="0" y="0" width="73.5" height="40" rx="0.5" fill="#c3c7cc" stroke="#7a8087" stroke-width="0.4" />
    <rect id="psu-r3059-f8001--guard-plate" x="3.9" y="2.0" width="37.1" height="32.5" rx="1.2" fill="#4a4e53" />
    <rect id="psu-r3059-f8001--fan-guard" x="3.9" y="2.0" width="37.1" height="32.5" rx="1.2" fill="url(#psu-r3059-f8001--psu-r3059-hex)" data-z-vent="20" />
    <circle id="psu-r3059-f8001--fan-hub" cx="22.5" cy="18.5" r="9.0" fill="#b9bec4" stroke="#8d949b" stroke-width="0.3" />
