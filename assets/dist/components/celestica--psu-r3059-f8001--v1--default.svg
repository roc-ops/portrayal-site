    <rect id="psu-r3059-f8001--latch" x="52.3" y="35.8" width="5.5" height="4.0" rx="0.6" fill="#1a1c1f" stroke="#050607" stroke-width="0.25" data-path="psu-r3059-f8001/latch" data-class="latch" data-z-out="2.4" />
    <circle id="psu-r3059-f8001--status-led" cx="68.1" cy="36.7" r="1.4" fill="var(--led-color, #22c55e)" stroke="#3a3f45" stroke-width="0.25" data-path="psu-r3059-f8001/status-led" data-class="led" data-states="off ok fail" data-description="DS2000 guide Table 4, PSU module row - Green all PSUs operating normally, Red PSU error(s) detected, Off PSU is off" data-z-dome="0.3" />
