      <title>psu-r3059-f8001--inlet</title>
      <rect id="psu-r3059-f8001--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-r3059-f8001/inlet/opening" data-class="cutout" />
      <path id="psu-r3059-f8001--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-r3059-f8001--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-r3059-f8001--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-r3059-f8001--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
