<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48.6mm" height="40.0mm" viewBox="0 0 48.6 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="fan-module" data-path="fan-module" data-class="fan" data-behaviour="fills" data-ref="common/fan-module@1:1.16.1" data-airflow="front-to-back" data-power-absent="not-applicable" data-states="absent" transform="translate(0,0)">
    <title>fan-module</title>
    <defs>
      <pattern id="fan-module--mesh" width="8.86" height="5.11" patternUnits="userSpaceOnUse">
        <path d="M 2.55 0 L 1.275 2.208 L -1.275 2.208 L -2.55 0 L -1.275 -2.208 L 1.275 -2.208 Z" fill="#0d0f11" />
        <path d="M 11.41 0 L 10.135 2.208 L 7.585 2.208 L 6.31 0 L 7.585 -2.208 L 10.135 -2.208 Z" fill="#0d0f11" />
        <path d="M 6.98 2.555 L 5.705 4.763 L 3.155 4.763 L 1.88 2.555 L 3.155 0.347 L 5.705 0.347 Z" fill="#0d0f11" />
        <path d="M 2.55 5.11 L 1.275 7.318 L -1.275 7.318 L -2.55 5.11 L -1.275 2.902 L 1.275 2.902 Z" fill="#0d0f11" />
        <path d="M 11.41 5.11 L 10.135 7.318 L 7.585 7.318 L 6.31 5.11 L 7.585 2.902 L 10.135 2.902 Z" fill="#0d0f11" />
      </pattern>
      <mask id="fan-module--fan-web-mask" maskUnits="userSpaceOnUse">
        <circle cx="26.3" cy="19.2" r="18.6" fill="white" />
        <rect x="5" y="0.8" width="42.6" height="38" fill="url(#fan-module--mesh)" />
      </mask>
    </defs>
    <rect id="fan-module--flange" x="1.2" y="0" width="3.2" height="40" fill="#33373c" stroke="#22262a" stroke-width="0.4" />
    <path id="fan-module--body" d="M 4 0 h 44.6 v 40 h -44.6 v -15.2 h -3.2 a 0.8 0.8 0 0 1 -0.8 -0.8 v -8 a 0.8 0.8 0 0 1 0.8 -0.8 h 3.2 z" fill="#33373c" stroke="#22262a" stroke-width="0.4" />
    <g id="fan-module--screw" data-path="fan-module/screw" data-class="screw" data-z-cyl="5" data-z-knurl="1">
      <circle id="fan-module--screw-head" cx="2" cy="19.5" r="1.6" fill="#8a9099" stroke="#4a4f55" stroke-width="0.25" />
      <line x1="0.9" y1="19.5" x2="3.1" y2="19.5" stroke="#4a4f55" stroke-width="0.35" />
      <line x1="2" y1="18.4" x2="2" y2="20.6" stroke="#4a4f55" stroke-width="0.35" />
    </g>
    <g id="fan-module--rotor" data-path="fan-module/rotor" data-class="rotor">
      <circle id="fan-module--rotor-behind" cx="26.3" cy="19.2" r="18.6" fill="#0b0d0f" data-z-vent="25" />
      <path id="fan-module--rotor-grille" fill-rule="evenodd" fill="url(#fan-module--mesh)" d="M 5 0.8 h 42.6 v 38 h -42.6 z          M 26.3 0.6 a 18.6 18.6 0 1 0 0.001 0 z          M 39.8 36.8 h 7.8 v 2 h -7.8 z" data-z-vent="25" />
      <g id="fan-module--rotor-bulge" data-z-dome="3.2">
        <circle cx="26.3" cy="19.2" r="18.6" fill="#17191c" mask="url(#fan-module--fan-web-mask)" />
        <circle id="fan-module--rotor-hub" cx="26.3" cy="19.2" r="5.2" fill="#22262a" />
        <circle id="fan-module--rotor-ring" cx="26.3" cy="19.2" r="18.6" fill="none" stroke="#4a4f55" stroke-width="0.45" />
      </g>
    </g>
    <rect id="fan-module--handle" x="8" y="27.4" width="36.6" height="3.3" rx="1.4" fill="#c22f2f" data-fill-from="handle-finish" data-path="fan-module/handle" data-class="latch" data-z-uhandle="12.7" />
    <g id="fan-module--silkscreen">
      <text id="fan-module--silk-airflow" x="47.2" y="39.4" font-family="sans-serif" font-size="1.8" text-anchor="end" fill="#c7ccd1" data-from="airflow-legend">F2B</text>
    </g>
  </g>
</svg>
