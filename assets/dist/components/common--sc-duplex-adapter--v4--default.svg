      <rect id="sc-duplex-adapter--tx--hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <rect id="sc-duplex-adapter--tx--hook-lower" x="1.9" y="7.2" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <circle id="sc-duplex-adapter--tx--collar" cx="4.64" cy="4.5" r="2.34" fill="#262a2f" stroke="#3a4046" stroke-width="0.12" data-z-top="3.8" />
      <circle id="sc-duplex-adapter--tx--sleeve" cx="4.64" cy="4.5" r="1.65" fill="#1e2226" />
