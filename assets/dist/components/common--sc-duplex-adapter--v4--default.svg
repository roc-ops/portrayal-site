    <g id="sc-duplex-adapter--rx" data-path="sc-duplex-adapter/rx" data-class="port" data-ref="std/sc-bore@1:1.0.0" data-depth="6.0" data-wall="#4a4f55" data-cavity="bore" data-connector="sc" data-media="fiber" transform="translate(0.06,1.85)" data-z-lift="1.0">
