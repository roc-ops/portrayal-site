        <rect x="1.0" y="19.68" width="10.6" height="0.5" />
        <rect x="1.0" y="22.76" width="10.6" height="0.5" />
        <rect x="1.0" y="25.84" width="10.6" height="0.5" />
        <rect x="1.0" y="28.92" width="10.6" height="0.5" />
