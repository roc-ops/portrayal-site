    <g id="tm810x-psu-ac--inlet" data-path="tm810x-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(20.54,7.05) rotate(270 14.0 10.0)">
      <title>tm810x-psu-ac--inlet</title>
      <rect id="tm810x-psu-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="tm810x-psu-ac/inlet/opening" data-class="cutout" />
      <path id="tm810x-psu-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
