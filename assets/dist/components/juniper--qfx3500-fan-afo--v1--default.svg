<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="87.3mm" height="40.6mm" viewBox="0 0 87.3 40.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx3500-fan-afo@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx3500-fan-afo@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx3500-fan-afo" data-path="qfx3500-fan-afo" data-class="fan" data-behaviour="fills" data-ref="juniper/qfx3500-fan-afo@1:1.0.0" data-airflow="front-to-back" data-model="QFX3500-FAN-AFO" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>qfx3500-fan-afo</title>
    <defs>
      <pattern id="qfx3500-fan-afo--hex" width="2.6" height="4.5" patternUnits="userSpaceOnUse">
        <polygon points="1.3,0.1 2.34,0.7 2.34,1.55 1.3,2.15 0.26,1.55 0.26,0.7" fill="#0b0c0e" />
        <polygon points="0,2.35 1.04,2.95 1.04,3.8 0,4.4 -1.04,3.8 -1.04,2.95" fill="#0b0c0e" />
        <polygon points="2.6,2.35 3.64,2.95 3.64,3.8 2.6,4.4 1.56,3.8 1.56,2.95" fill="#0b0c0e" />
      </pattern>
    </defs>
    <rect id="qfx3500-fan-afo--face" x="0" y="0" width="87.3" height="40.6" rx="0.8" fill="#2e3237" stroke="#1d2024" stroke-width="0.4" />
    <g id="qfx3500-fan-afo--grille">
      <rect x="1.6" y="1.4" width="84.1" height="25.0" rx="0.5" fill="#3a3f45" />
      <rect x="1.6" y="1.4" width="84.1" height="25.0" rx="0.5" fill="url(#qfx3500-fan-afo--hex)" />
    </g>
    <g id="qfx3500-fan-afo--silkscreen" font-family="sans-serif" font-size="1.8" fill="#d9dde1">
      <path d="M 10.2 29.0 m -1.3 0 a 1.3 1.3 0 1 0 2.6 0 a 1.3 1.3 0 1 0 -2.6 0 M 9.1 28.6 l 2.2 0.8 M 9.8 27.9 l 0.8 2.2" fill="none" stroke="#d9dde1" stroke-width="0.28" />
    </g>
    <g id="qfx3500-fan-afo--lamps">
      <circle id="qfx3500-fan-afo--led-fan" cx="5.2" cy="27.5" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx3500-fan-afo/led-fan" data-class="led" data-states="green amber off" />
    </g>
    <g id="qfx3500-fan-afo--handle" data-path="qfx3500-fan-afo/handle" data-class="latch">
      <rect x="2.0" y="33.0" width="34.0" height="4.5" rx="2.2" fill="#8d9399" stroke="#5f656b" stroke-width="0.4" />
      <rect x="64.0" y="31.5" width="9.0" height="5.0" rx="1.0" fill="#b4b9be" stroke="#6c7278" stroke-width="0.35" />
      <path d="M 71.0 34.0 h -5.0 m 1.6 -1.4 l -1.6 1.4 l 1.6 1.4" fill="none" stroke="#1d2024" stroke-width="0.35" />
    </g>
  </g>
</svg>
