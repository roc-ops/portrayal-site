<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="444.25mm" height="33.32mm" viewBox="0 0 444.25 33.32">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/asr-9010-fan@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/asr-9010-fan@'] .state-red { --led-color: #d0021b; }
    g[data-ref^='cisco/asr-9010-fan@'] .state-yellow { --led-color: #f5c518; }</style>
  <g id="asr-9010-fan" data-path="asr-9010-fan" data-class="fan" data-behaviour="fills" data-ref="cisco/asr-9010-fan@1:1.0.1" data-wall="#4a4f55" data-eol="none-announced" data-fans="12 x 120 mm axial" data-model="ASR-9010-FAN" data-power-draw-max-w="1100" data-role="fan-tray" data-weight-kg="6.29" transform="translate(0,0)">
    <title>asr-9010-fan</title>
    <rect id="asr-9010-fan--plate" x="0" y="0" width="444.25" height="33.32" rx="1.2" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.4" />
    <rect id="asr-9010-fan--handle" x="166.95" y="10.58" width="110.27" height="7.67" rx="2.4" fill="#f1f1f1" stroke="#9aa0a6" stroke-width="0.35" data-z-uhandle="8.0" />
    <rect x="163.51" y="10.05" width="8.46" height="8.46" rx="1.2" fill="#c8cdd2" stroke="#9aa0a6" stroke-width="0.3" />
    <rect x="272.46" y="10.05" width="8.46" height="8.46" rx="1.2" fill="#c8cdd2" stroke="#9aa0a6" stroke-width="0.3" />
    <rect id="asr-9010-fan--grip-l" x="21.41" y="19.04" width="15.07" height="12.10" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" data-z-out="4.2" />
    <rect id="asr-9010-fan--grip-r" x="407.75" y="19.04" width="15.07" height="12.10" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" data-z-out="4.2" />
    <g id="asr-9010-fan--screw-l" data-z-cyl="1.6">
      <circle cx="28.6" cy="25.1" r="3.2" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="28.6" cy="25.1" r="1.45" fill="#6d7379" />
    </g>
    <g id="asr-9010-fan--screw-r" data-z-cyl="1.6">
      <circle cx="415.6" cy="25.1" r="3.2" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="415.6" cy="25.1" r="1.45" fill="#6d7379" />
    </g>
    <circle id="asr-9010-fan--status" cx="18.0" cy="3.2" r="1.5" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="asr-9010-fan/status" data-class="led" data-states="green yellow red off" data-description="the fan tray's Run/Fail status LED, one per tray." data-z-dome="0.3" />
    <g id="asr-9010-fan--silkscreen">
      <text x="22.6" y="4.2" font-family="sans-serif" font-size="3.0" font-weight="bold" fill="#231f20">FAN STATUS</text>
      <rect x="187.21" y="0" width="71.40" height="7.93" rx="0.6" fill="#ffff99" stroke="#8a7a00" stroke-width="0.3" />
      <text x="222.9" y="6.1" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle" fill="#231f20">!</text>
      <rect x="407.75" y="0" width="32.52" height="4.76" fill="#ffffff" stroke="#6d7379" stroke-width="0.25" />
      <text x="424.0" y="3.7" font-family="sans-serif" font-size="3.0" font-weight="bold" text-anchor="middle" fill="#231f20">ASR-9010-FAN</text>
    </g>
  </g>
</svg>
