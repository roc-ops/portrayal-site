<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5.6mm" height="12.7mm" viewBox="0 0 5.6 12.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qsfpdd-led-strip-2x4" data-path="qsfpdd-led-strip-2x4" data-class="led" data-ref="ufispace/qsfpdd-led-strip-2x4@1:1.0.0" transform="translate(0,0)">
    <title>qsfpdd-led-strip-2x4</title>
    <g id="qsfpdd-led-strip-2x4--bezel" data-z-out="0.4">
      <rect x="0" y="0.5" width="5.6" height="11.7" rx="0.7" fill="#5b9bd5" stroke="#3a6ea5" stroke-width="0.25" />
      <rect x="1.6" y="0" width="2.4" height="1.0" rx="0.3" fill="#5b9bd5" />
      <rect x="1.6" y="11.7" width="2.4" height="1.0" rx="0.3" fill="#5b9bd5" />
    </g>
    <circle id="qsfpdd-led-strip-2x4--left-1" cx="1.6" cy="2.3" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/left-1" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-strip-2x4--left-2" cx="1.6" cy="5.1" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/left-2" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-strip-2x4--left-3" cx="1.6" cy="7.9" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/left-3" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-strip-2x4--left-4" cx="1.6" cy="10.7" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/left-4" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-strip-2x4--right-1" cx="4.0" cy="2.3" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/right-1" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-strip-2x4--right-2" cx="4.0" cy="5.1" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/right-2" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-strip-2x4--right-3" cx="4.0" cy="7.9" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/right-3" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-strip-2x4--right-4" cx="4.0" cy="10.7" r="0.8" fill="var(--led-color, #2a4a6b)" data-path="qsfpdd-led-strip-2x4/right-4" data-class="led" data-states="off on" />
  </g>
</svg>
