<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40.0mm" viewBox="0 0 73.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="psu-550w" data-path="psu-550w" data-class="psu" data-behaviour="fills" data-ref="maiaedge/psu-550w@1:1.0.0" data-body-depth="185.0" data-efficiency="platinum" data-form-factor="crps-1u" data-input="ac" data-input-voltage="100-240 VAC or 180-300 VDC" data-power-absent="not-published" data-power-output-w="550" data-states="ok fail absent" transform="translate(0,0)">
    <title>psu-550w</title>
    <rect id="psu-550w--body" x="0.2" y="0.2" width="73.1" height="39.6" rx="0.8" fill="#b9bec4" stroke="#8a9099" stroke-width="0.4" />
    <rect x="0.6" y="0.6" width="38.8" height="34.4" rx="1.0" fill="#c4c8cd" stroke="#8a9099" stroke-width="0.3" />
    <circle id="psu-550w--fan-bore" cx="20.0" cy="17.7" r="16.4" fill="#111316" />
    <path d="M20 17.7 L5.2 4.4 M20 17.7 L34.8 4.4 M20 17.7 L5.2 31.0 M20 17.7 L34.8 31.0" stroke="#c4c8cd" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="20.0" cy="17.7" r="9.05" fill="#2f7fd6" stroke="#1d5aa0" stroke-width="0.35" />
    <g id="psu-550w--rating-silkscreen">
      <text x="20.0" y="15.6" font-family="sans-serif" font-size="2.9" font-weight="bold" text-anchor="middle" fill="#0e2a52">550W</text>
      <text x="20.0" y="19.9" font-family="sans-serif" font-size="1.5" text-anchor="middle" fill="#0e2a52">CRPS Platinum</text>
    </g>
    <circle cx="5.4" cy="1.9" r="1.4" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.25" />
    <circle cx="36.8" cy="1.6" r="1.4" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.25" />
    <rect id="psu-550w--shroud" x="40.3" y="0.4" width="25.4" height="32.0" rx="0.6" fill="#15171a" />
    <circle id="psu-550w--vent-hole" cx="54.5" cy="36.6" r="2.3" fill="#0d0f11" />
    <circle id="psu-550w--led" cx="66.8" cy="36.6" r="2.3" fill="var(--led-color, #6d7278)" stroke="#8a9099" stroke-width="0.3" data-path="psu-550w/led" data-class="led" />
    <path id="psu-550w--handle" d="M0.6 30.4 L3.4 30.4 L3.4 36.8 L36.2 36.8 L36.2 30.4 L39.0 30.4 L39.0 39.6 L0.6 39.6 Z" fill="#16181b" data-path="psu-550w/handle" data-class="handle" data-z-out="2.5" />
    <rect id="psu-550w--latch" x="63.2" y="8.1" width="2.5" height="22.7" rx="0.6" fill="#3a3f8c" data-path="psu-550w/latch" data-class="latch" data-z-out="14.0" data-z-color="#2f3372" />
    <g id="psu-550w--inlet" data-path="psu-550w/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(38.55,5.75) rotate(90 14.0 10.0)">
      <title>psu-550w--inlet</title>
      <rect id="psu-550w--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-550w/inlet/opening" data-class="cutout" />
      <path id="psu-550w--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-550w--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-550w--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-550w--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="52.55 15.75" data-cp-dir="rear" />
  </g>
</svg>
