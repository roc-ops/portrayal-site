<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="82.8mm" height="83.1mm" viewBox="0 0 82.8 83.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='nokia/sr-1-fan-tray@'] .state-fault { --led-color: #f5a623; }
    g[data-ref^='nokia/sr-1-fan-tray@'] .state-fault { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='nokia/sr-1-fan-tray@'] .state-on { --led-color: #39b54a; }
    g[data-ref^='nokia/sr-1-fan-tray@'] .state-powering-up { --led-color: #2f6fd6; }</style>
  <g id="sr-1-fan-tray" data-path="sr-1-fan-tray" data-class="fan" data-behaviour="fills" data-ref="nokia/sr-1-fan-tray@1:1.0.0" data-body-depth="175.3" data-wall="#26292d" data-model="7750 SR-1 Fan Tray" data-part-number="3HE12300AA" data-weight-kg="0.82" transform="translate(0,0)">
    <title>sr-1-fan-tray</title>
    <defs>
      <pattern id="sr-1-fan-tray--honeycomb" width="3.9" height="2.25" patternUnits="userSpaceOnUse">
        <path d="M 0.9 0 L 0.45 0.78 L -0.45 0.78 L -0.9 0 L -0.45 -0.78 L 0.45 -0.78 Z" fill="#101214" />
        <path d="M 4.8 0 L 4.35 0.78 L 3.45 0.78 L 3.0 0 L 3.45 -0.78 L 4.35 -0.78 Z" fill="#101214" />
        <path d="M 2.85 1.125 L 2.4 1.905 L 1.5 1.905 L 1.05 1.125 L 1.5 0.345 L 2.4 0.345 Z" fill="#101214" />
        <path d="M 0.9 2.25 L 0.45 3.03 L -0.45 3.03 L -0.9 2.25 L -0.45 1.47 L 0.45 1.47 Z" fill="#101214" />
        <path d="M 4.8 2.25 L 4.35 3.03 L 3.45 3.03 L 3.0 2.25 L 3.45 1.47 L 4.35 1.47 Z" fill="#101214" />
      </pattern>
    </defs>
    <rect id="sr-1-fan-tray--face" x="0" y="0" width="82.8" height="83.1" rx="0.6" fill="#2e3135" stroke="#17191c" stroke-width="0.4" />
    <path id="sr-1-fan-tray--label-tab" d="M 2.2 2.0 H 26.9 Q 27.3 2.0 27.3 2.4 V 4.2 L 26.2 5.0 Q 11 11.5 6.2 27.1 H 2.6 Q 2.2 27.1 2.2 26.7 Z" fill="#3a3e43" stroke="#17191c" stroke-width="0.3" data-path="sr-1-fan-tray/label-tab" data-class="label" />
    <g id="sr-1-fan-tray--guard" data-path="sr-1-fan-tray/guard" data-class="vent" data-z-vent="6.0">
      <path d="M 27.2 4.9 H 55.8 A 39.3 39.3 0 0 1 78.1 27.2 V 55.8 A 39.3 39.3 0 0 1 55.8 78.1 H 27.2 A 39.3 39.3 0 0 1 4.9 55.8 V 27.2 A 39.3 39.3 0 0 1 27.2 4.9 Z" fill="#8a9097" stroke="#17191c" stroke-width="0.4" />
      <path d="M 27.2 4.9 H 55.8 A 39.3 39.3 0 0 1 78.1 27.2 V 55.8 A 39.3 39.3 0 0 1 55.8 78.1 H 27.2 A 39.3 39.3 0 0 1 4.9 55.8 V 27.2 A 39.3 39.3 0 0 1 27.2 4.9 Z" fill="url(#sr-1-fan-tray--honeycomb)" />
    </g>
    <g id="sr-1-fan-tray--silkscreen">
      <text x="3.0" y="5.3" font-family="Arial" font-weight="bold" font-size="2.9" fill="#e6e8ea">7750 SR-1</text>
      <text x="3.0" y="8.6" font-family="Arial" font-weight="bold" font-size="2.9" fill="#e6e8ea">Fan Tray</text>
      <text x="6.6" y="14.4" font-family="Arial" font-size="1.8" fill="#e6e8ea">Status</text>
    </g>
    <g id="sr-1-fan-tray--screw-top" data-path="sr-1-fan-tray/screw-top" data-class="fastener" data-z-cyl="5.0" data-z-knurl="1">
      <circle cx="76.4" cy="6.5" r="5.45" fill="#6f757c" stroke="#17191c" stroke-width="0.35" stroke-dasharray="0.7 0.45" />
      <circle cx="76.4" cy="6.5" r="3.6" fill="#8a9097" stroke="#17191c" stroke-width="0.3" />
      <path d="M 73.9 4.0 L 78.9 9.0 M 78.9 4.0 L 73.9 9.0" stroke="#17191c" stroke-width="0.35" />
      <circle cx="76.4" cy="6.5" r="1.1" fill="#6f757c" stroke="#17191c" stroke-width="0.3" />
    </g>
    <g id="sr-1-fan-tray--screw-bottom" data-path="sr-1-fan-tray/screw-bottom" data-class="fastener" data-z-cyl="5.0" data-z-knurl="1">
      <circle cx="6.5" cy="76.7" r="5.45" fill="#6f757c" stroke="#17191c" stroke-width="0.35" stroke-dasharray="0.7 0.45" />
      <circle cx="6.5" cy="76.7" r="3.6" fill="#8a9097" stroke="#17191c" stroke-width="0.3" />
      <path d="M 4.0 74.2 L 9.0 79.2 M 9.0 74.2 L 4.0 79.2" stroke="#17191c" stroke-width="0.35" />
      <circle cx="6.5" cy="76.7" r="1.1" fill="#6f757c" stroke="#17191c" stroke-width="0.3" />
    </g>
    <g id="sr-1-fan-tray--hex-fastener" data-path="sr-1-fan-tray/hex-fastener" data-class="fastener" data-z-cyl="1.5">
      <path d="M 76.5 72.6 L 79.9 74.55 L 79.9 78.45 L 76.5 80.4 L 73.1 78.45 L 73.1 74.55 Z" fill="#6f757c" stroke="#17191c" stroke-width="0.35" />
      <circle cx="76.5" cy="76.5" r="2.2" fill="#8a9097" stroke="#17191c" stroke-width="0.25" />
    </g>
    <g id="sr-1-fan-tray--led-status" data-path="sr-1-fan-tray/led-status" data-class="led" data-ref="common/led-dot@1:1.1.0" transform="translate(4.1,12.6)" data-group="status-leds" data-group-role="indicator" data-description="the tray's single Status lamp, top left of the face">
      <title>sr-1-fan-tray--led-status</title>
      <circle id="sr-1-fan-tray--led-status--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="sr-1-fan-tray--led-status--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="sr-1-fan-tray/led-status/lamp" data-class="led" data-states="off powering-up on fault" data-z-dome="0.3" />
    </g>
    <g data-cp="mate" data-cp-at="41.4 41.55" data-cp-dir="rear" />
  </g>
</svg>
