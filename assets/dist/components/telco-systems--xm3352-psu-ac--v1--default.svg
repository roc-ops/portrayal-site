<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="49.8mm" height="21.6mm" viewBox="0 0 49.8 21.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="xm3352-psu-ac" data-path="xm3352-psu-ac" data-class="psu" data-behaviour="fills" data-ref="telco-systems/xm3352-psu-ac@1:1.0.0" data-input="ac" data-input-voltage="100-240 VAC (face &quot;100-240V~&quot;)" data-model="XM-3352-ACPS-NA" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>xm3352-psu-ac</title>
    <rect id="xm3352-psu-ac--plate" x="0.1" y="0.1" width="49.6" height="21.4" rx="0.5" fill="#d7d9db" stroke="#8d9298" stroke-width="0.25" />
    <g id="xm3352-psu-ac--thumbscrew" data-path="xm3352-psu-ac/thumbscrew" data-class="fastener">
      <circle cx="4.3" cy="11.5" r="3.2" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.3" />
      <circle cx="4.3" cy="11.5" r="2.2" fill="#b2b7bc" />
      <path d="M 3.0 11.5 H 5.6 M 4.3 10.2 V 12.8" stroke="#3a3d41" stroke-width="0.5" />
    </g>
    <g id="xm3352-psu-ac--silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#2f3337">
      <text x="1.3" y="4.4" font-size="2.2" font-weight="bold">100-240V~</text>
    </g>
    <g id="xm3352-psu-ac--inlet" data-path="xm3352-psu-ac/inlet" data-class="inlet" data-behaviour="mounts" data-ref="telco-systems/xm3352-ac-inlet@1:1.0.0" data-body-depth="12.0" data-input="ac" data-media="ac" transform="translate(17.9,0.6)">
      <title>xm3352-psu-ac--inlet</title>
      <rect id="xm3352-psu-ac--inlet--body" x="0" y="0" width="22.6" height="20.5" rx="0.8" fill="#26292d" data-path="xm3352-psu-ac/inlet/body" data-class="connector" />
      <g fill="#101214" stroke="#3a3e43" stroke-width="0.3">
        <circle cx="7.4" cy="7.2" r="3.9" />
        <circle cx="15.2" cy="7.2" r="3.9" />
        <circle cx="11.3" cy="13.4" r="3.9" />
      </g>
      <rect x="7.4" y="6.8" width="7.8" height="6.6" fill="#101214" />
      <circle cx="7.4" cy="7.2" r="0.9" fill="#c9ccd0" />
      <circle cx="15.2" cy="7.2" r="0.9" fill="#c9ccd0" />
      <circle cx="11.3" cy="13.4" r="0.9" fill="#c9ccd0" />
    </g>
  </g>
</svg>
