<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86.7mm" height="41.4mm" viewBox="0 0 86.7 41.4">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mx10003-psu-ac" data-path="mx10003-psu-ac" data-class="psu" data-behaviour="fills" data-ref="juniper/mx10003-psu-ac@1:1.0.0" data-model="MX10003 AC PSM" data-power-output-low-line-w="800" data-power-output-w="1600" data-redundancy="n+n" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>mx10003-psu-ac</title>
    <rect id="mx10003-psu-ac--face" x="0" y="0" width="86.7" height="41.4" rx="0.6" fill="#7d8288" stroke="#5d6167" stroke-width="0.4" />
    <g id="mx10003-psu-ac--fan">
      <circle cx="66.0" cy="20.7" r="16.5" fill="#2b2f33" stroke="#1d2023" stroke-width="0.6" />
      <g stroke="#4a4f55" stroke-width="1.6" fill="none">
        <path d="M 66 6.5 A 14.2 14.2 0 0 1 66 34.9" />
        <path d="M 51.8 20.7 A 14.2 14.2 0 0 1 80.2 20.7" />
      </g>
      <circle cx="66.0" cy="20.7" r="4.2" fill="#5d6167" />
    </g>
    <g id="mx10003-psu-ac--lamps">
      <circle id="mx10003-psu-ac--led-ok" cx="44.0" cy="6.0" r="0.8" fill="var(--led-color, #3a3f44)" stroke="#33373c" stroke-width="0.25" />
    </g>
    <g id="mx10003-psu-ac--handle" data-z-out="3.0" data-z-color="#c7cacd">
      <rect x="36.0" y="14.0" width="9.0" height="14.0" rx="3.2" fill="#e6e8ea" stroke="#b0b4b8" stroke-width="0.5" />
      <rect x="38.6" y="16.4" width="3.8" height="9.2" rx="1.9" fill="#b8bcc0" />
    </g>
    <g id="mx10003-psu-ac--inlet" data-path="mx10003-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(6.0,10.7)">
      <title>mx10003-psu-ac--inlet</title>
      <rect id="mx10003-psu-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="mx10003-psu-ac/inlet/opening" data-class="cutout" />
      <path id="mx10003-psu-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="mx10003-psu-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="mx10003-psu-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="mx10003-psu-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
