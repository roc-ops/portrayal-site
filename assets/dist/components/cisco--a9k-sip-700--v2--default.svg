    </g>
    <g id="a9k-sip-700--bay-3" data-path="a9k-sip-700/bay-3" data-class="bay">
      <rect id="a9k-sip-700--bay-3--opening" x="6.77" y="195.59" width="17.29" height="167.87" rx="0.4" fill="#3f4448" stroke="#2a2e31" stroke-width="0.25" />
    </g>
    <g id="a9k-sip-700--bay-1" data-path="a9k-sip-700/bay-1" data-class="bay">
