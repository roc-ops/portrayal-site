      <circle cx="24.11" cy="8.26" r="1.4" fill="#6d7379" />
    </g>
    <g>
      <circle cx="24.11" cy="387.17" r="3.17" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="24.11" cy="387.17" r="1.4" fill="#6d7379" />
    </g>
    <circle id="a9k-sip-700--status" cx="26.8" cy="372.16" r="1.77" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.2" data-path="a9k-sip-700/status" data-class="led" data-states="green amber red off" data-description="the SIP's single Status lamp. Cisco: 'The Cisco ASR 9000 SIP-700 faceplate has one Status LED.' Its vocabulary is Table 32's Card Status LED - see provenance.status- lamp for why that table reaches a SIP." data-z-dome="0.3" />
    <g id="a9k-sip-700--silkscreen">
