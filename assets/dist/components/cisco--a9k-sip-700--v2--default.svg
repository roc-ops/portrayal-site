    </g>
    <rect x="17" y="2.25" width="13.41" height="16.94" rx="1.0" fill="#bfbfbf" stroke="#9aa0a6" stroke-width="0.25" />
    <rect x="17" y="377.31" width="13.41" height="15.87" rx="1.0" fill="#bfbfbf" stroke="#9aa0a6" stroke-width="0.25" />
    <g>
