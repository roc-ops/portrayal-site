      <text x="19.29" y="365.5" font-family="sans-serif" font-size="2.6" font-weight="bold" text-anchor="middle" fill="#231f20">A9K-SIP-700</text>
      <text x="29.61" y="375.18" transform="rotate(90 29.61 375.18)" font-family="sans-serif" font-size="2.0" fill="#231f20">STATUS</text>
      <text x="20.98" y="23.18" text-anchor="middle" font-family="sans-serif" font-size="2.8" fill="#231f20">2</text>
      <text x="37.2" y="23.18" text-anchor="middle" font-family="sans-serif" font-size="2.8" fill="#231f20">0</text>
      <text x="20.98" y="369.32" text-anchor="middle" font-family="sans-serif" font-size="2.8" fill="#231f20">3</text>
      <text x="37.2" y="369.32" text-anchor="middle" font-family="sans-serif" font-size="2.8" fill="#231f20">1</text>
