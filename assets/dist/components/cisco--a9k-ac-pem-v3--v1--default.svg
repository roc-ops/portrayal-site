<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="468.12mm" height="48.03mm" viewBox="0 0 468.12 48.03">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="a9k-ac-pem-v3" data-path="a9k-ac-pem-v3" data-class="power" data-behaviour="fills" data-ref="cisco/a9k-ac-pem-v3@1:1.1.0" data-wall="#4a4f55" data-eol="none-announced" data-generation="3" data-model="A9K-AC-PEM-V3" data-module-bays="3" data-power-absent="not-applicable" data-role="power-tray" transform="translate(0,0)">
    <title>a9k-ac-pem-v3</title>
    <rect id="a9k-ac-pem-v3--plate" x="0" y="0" width="468.12" height="48.03" rx="1.2" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.4" />
    <rect id="a9k-ac-pem-v3--grip-l" x="0.0" y="2.8" width="17.36" height="42.43" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" data-z-out="4.2" />
    <rect id="a9k-ac-pem-v3--grip-r" x="450.76" y="2.8" width="17.36" height="42.43" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" data-z-out="4.2" />
    <rect id="a9k-ac-pem-v3--bay-m0" x="25.95" y="2.56" width="135.98" height="40.34" rx="0.8" fill="#101214" />
    <rect id="a9k-ac-pem-v3--bay-m1" x="165.6" y="2.56" width="135.98" height="40.34" rx="0.8" fill="#101214" />
    <rect id="a9k-ac-pem-v3--bay-m2" x="305.24" y="2.56" width="135.98" height="40.34" rx="0.8" fill="#101214" />
    <rect id="a9k-ac-pem-v3--power-switch" x="434.86" y="8.44" width="7.63" height="30.82" rx="1.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
    <g id="a9k-ac-pem-v3--silkscreen">
      <text x="93.94" y="47.13" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">M0</text>
      <text x="233.59" y="47.13" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">M1</text>
      <text x="373.23" y="47.13" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">M2</text>
      <rect x="443.5" y="11.76" width="5.74" height="23.93" fill="#ffef5c" />
      <text x="446.41" y="13.01" transform="rotate(90 446.41 13.01)" font-family="sans-serif" font-size="2.4" font-weight="bold" fill="#231f20">ON/STANDBY</text>
    </g>
  </g>
</svg>
