<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100.7mm" height="101.8mm" viewBox="0 0 100.7 101.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex6200-pwr-ac2500@'] .state-failed { --led-color: #ef4444; }
    g[data-ref^='juniper/ex6200-pwr-ac2500@'] .state-fault { --led-color: #22c55e; }
    g[data-ref^='juniper/ex6200-pwr-ac2500@'] .state-fault { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/ex6200-pwr-ac2500@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='juniper/ex6200-pwr-ac2500@'] .state-out-of-range { --led-color: #22c55e; }
    g[data-ref^='juniper/ex6200-pwr-ac2500@'] .state-out-of-range { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="ex6200-pwr-ac2500" data-path="ex6200-pwr-ac2500" data-class="psu" data-behaviour="fills" data-ref="juniper/ex6200-pwr-ac2500@1:1.0.0" data-airflow="front-to-back" data-input="100 to 120 VAC (1250 W) or 200 to 240 VAC (2500 W), 50 to 60 Hz, 15 A per cord (guide Tables 20 and 25)" data-power-output-low-line-w="1250" data-power-output-w="2500" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex6200-pwr-ac2500</title>
    <defs>
      <pattern id="ex6200-pwr-ac2500--cells" width="3.8" height="3.8" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="2.6" height="2.6" fill="#101214" />
      </pattern>
    </defs>
    <rect id="ex6200-pwr-ac2500--face" x="0" y="0" width="100.7" height="101.8" rx="1.2" fill="#c9ccd0" stroke="#7d8186" stroke-width="0.4" />
    <g id="ex6200-pwr-ac2500--vents">
      <rect x="6.3" y="14.2" width="60.3" height="85.0" fill="url(#ex6200-pwr-ac2500--cells)" />
    </g>
    <g id="ex6200-pwr-ac2500--screws">
      <circle cx="11.0" cy="5.2" r="1.8" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.35" />
      <path d="M 9.6 5.2 H 12.4 M 11.0 3.8 V 6.6" stroke="#6b6f75" stroke-width="0.4" />
      <circle cx="87.6" cy="5.2" r="1.8" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.35" />
      <path d="M 86.2 5.2 H 89.0 M 87.6 3.8 V 6.6" stroke="#6b6f75" stroke-width="0.4" />
    </g>
    <g id="ex6200-pwr-ac2500--enable-switch" data-path="ex6200-pwr-ac2500/enable-switch" data-class="button">
      <rect x="76.0" y="62.0" width="17.0" height="11.0" rx="1.0" fill="#2b2e32" stroke="#14161a" stroke-width="0.4" />
      <rect x="79.0" y="64.2" width="11.0" height="6.6" rx="0.6" fill="#8e9298" stroke="#5d6167" stroke-width="0.3" />
    </g>
    <circle id="ex6200-pwr-ac2500--led-input-ok" cx="73.5" cy="98.1" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3" data-path="ex6200-pwr-ac2500/led-input-ok" data-class="led" data-states="off ok out-of-range" />
    <circle id="ex6200-pwr-ac2500--led-output-ok" cx="82.5" cy="98.1" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3" data-path="ex6200-pwr-ac2500/led-output-ok" data-class="led" data-states="off ok fault" />
    <circle id="ex6200-pwr-ac2500--led-fail" cx="90.0" cy="98.1" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3" data-path="ex6200-pwr-ac2500/led-fail" data-class="led" data-states="off failed" />
    <g id="ex6200-pwr-ac2500--silkscreen" font-family="sans-serif" fill="#2b2e32" text-anchor="middle">
      <text x="84.5" y="59.6" font-size="1.5">ENABLE</text>
      <text x="84.5" y="76.4" font-size="1.4">STANDBY / ON</text>
      <text x="73.5" y="94.2" font-size="1.3">INPUT</text>
      <text x="73.5" y="95.8" font-size="1.3">OK</text>
      <text x="82.5" y="94.2" font-size="1.3">OUTPUT</text>
      <text x="82.5" y="95.8" font-size="1.3">OK</text>
      <text x="90.0" y="95.8" font-size="1.3">FAIL</text>
    </g>
    <g id="ex6200-pwr-ac2500--handle" data-path="ex6200-pwr-ac2500/handle" data-class="latch" data-z-out="2.0">
      <path d="M 7.8 72.0 L 59.8 15.8" stroke="#6b6f75" stroke-width="3.6" stroke-linecap="round" fill="none" />
      <path d="M 7.8 72.0 L 59.8 15.8" stroke="#aeb2b7" stroke-width="1.4" stroke-linecap="round" fill="none" />
    </g>
    <g id="ex6200-pwr-ac2500--inlet" data-path="ex6200-pwr-ac2500/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(71.4,19.0) rotate(90 16.2 12.2)">
      <title>ex6200-pwr-ac2500--inlet</title>
      <rect id="ex6200-pwr-ac2500--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="ex6200-pwr-ac2500/inlet/opening" data-class="cutout" />
      <rect id="ex6200-pwr-ac2500--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="ex6200-pwr-ac2500--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex6200-pwr-ac2500--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex6200-pwr-ac2500--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
