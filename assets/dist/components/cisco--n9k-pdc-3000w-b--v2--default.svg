    <circle id="n9k-pdc-3000w-b--fail" cx="8.2" cy="5.2" r="2.0" fill="var(--led-color, #f5a623)" stroke="#9aa0a6" stroke-width="0.25" data-path="n9k-pdc-3000w-b/fail" data-class="led" data-states="amber flashing-amber off" data-description="FAIL or FAIL/ID lamp, at the top of the module, above the OK lamp." />
    <circle id="n9k-pdc-3000w-b--ok" cx="8.2" cy="12.0" r="2.0" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="n9k-pdc-3000w-b/ok" data-class="led" data-states="green flashing-green off" data-description="OK lamp, at the top of the module, below the FAIL lamp." />
    <g id="n9k-pdc-3000w-b--switch">
