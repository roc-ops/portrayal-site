        <path d="M 2.2 1.0 L 2.8 1.5 L 2.8 2.0 L 2.2 2.5 L 1.6 2.0 L 1.6 1.5 Z" fill="#4a4f55" />
      </pattern>
    </defs>
    <rect id="n9k-pdc-3000w-b--plate" x="0.4" y="0.4" width="43.65" height="132.55" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3" />
    <g id="n9k-pdc-3000w-b--vent">
