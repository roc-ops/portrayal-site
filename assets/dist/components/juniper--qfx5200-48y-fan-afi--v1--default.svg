<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48.1mm" height="40.6mm" viewBox="0 0 48.1 40.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qfx5200-48y-fan-afi" data-path="qfx5200-48y-fan-afi" data-class="fan" data-behaviour="fills" data-ref="juniper/qfx5200-48y-fan-afi@1:1.0.0" data-airflow="back-to-front" data-model="QFX520048Y-FAN-AI" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>qfx5200-48y-fan-afi</title>
    <defs>
      <pattern id="qfx5200-48y-fan-afi--hex" width="3.4" height="5.9" patternUnits="userSpaceOnUse">
        <polygon points="1.7,0.4 2.95,1.1 2.95,2.5 1.7,3.2 0.45,2.5 0.45,1.1" fill="#08090a" />
        <polygon points="0,3.35 1.25,4.05 1.25,5.45 0,6.15 -1.25,5.45 -1.25,4.05" fill="#08090a" />
        <polygon points="3.4,3.35 4.65,4.05 4.65,5.45 3.4,6.15 2.15,5.45 2.15,4.05" fill="#08090a" />
      </pattern>
    </defs>
    <rect id="qfx5200-48y-fan-afi--flange" x="0" y="0" width="8.3" height="40.6" fill="#2b2d31" stroke="#17191c" stroke-width="0.3" />
    <rect id="qfx5200-48y-fan-afi--face" x="8.3" y="0" width="39.8" height="40.6" rx="0.8" fill="#26282b" stroke="#17191c" stroke-width="0.3" />
    <g id="qfx5200-48y-fan-afi--grille">
      <rect x="9.6" y="1.5" width="37.2" height="37.6" rx="0.6" fill="#3a3c40" />
      <rect x="9.6" y="1.5" width="37.2" height="37.6" rx="0.6" fill="url(#qfx5200-48y-fan-afi--hex)" />
    </g>
    <g id="qfx5200-48y-fan-afi--handle" data-path="qfx5200-48y-fan-afi/handle" data-class="latch" data-z-out="3.0" data-z-color="#2a8bd8">
      <rect x="9.8" y="27.0" width="36.6" height="4.1" rx="2.0" fill="#2a8bd8" stroke="#1d5f96" stroke-width="0.3" />
    </g>
    <g id="qfx5200-48y-fan-afi--airflow-chip">
      <rect x="38.9" y="32.9" width="8.3" height="4.6" rx="0.8" fill="#4a4d52" />
      <g id="qfx5200-48y-fan-afi--silkscreen">
        <text x="43.05" y="36.1" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">AIR IN</text>
      </g>
    </g>
    <g id="qfx5200-48y-fan-afi--screw" data-path="qfx5200-48y-fan-afi/screw" data-class="screw" data-z-cyl="2.5" data-z-knurl="1">
      <circle cx="4.4" cy="19.2" r="2.7" fill="#b9bcc0" stroke="#6b6f74" stroke-width="0.35" />
      <circle cx="4.4" cy="19.2" r="1.3" fill="#8f9398" />
      <path d="M 3.2 19.2 H 5.6 M 4.4 18.0 V 20.4" stroke="#4a4d52" stroke-width="0.4" />
    </g>
  </g>
</svg>
