<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="94.0mm" height="42.0mm" viewBox="0 0 94.0 42.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="itps-psu" data-path="itps-psu" data-class="psu" data-behaviour="fills" data-ref="digi/itps-psu@1:1.0.0" data-wall="#17191b" data-input="ac" transform="translate(0,0)">
    <title>itps-psu</title>
    <rect id="itps-psu--body" x="0" y="0" width="94" height="42" rx="0.6" fill="#1b1d20" stroke="#0d0f11" stroke-width="0.3" />
    <g id="itps-psu--fan-grille" data-path="itps-psu/fan-grille" data-class="vent" data-z-vent="20.0">
      <circle cx="31.3" cy="21" r="19" fill="#0d0f11" />
      <circle cx="31.3" cy="21" r="14" fill="#3a3f45" />
      <circle cx="31.3" cy="21" r="14" fill="none" stroke="#6b7078" stroke-width="2.2" stroke-dasharray="1.4 1.2" />
      <circle cx="31.3" cy="21" r="16.8" fill="none" stroke="#2b2f33" stroke-width="2.6" stroke-dasharray="1.8 1.2" />
    </g>
    <g id="itps-psu--screws" fill="#2b2f33" stroke="#0d0f11" stroke-width="0.2">
      <circle cx="15.3" cy="5.0" r="1.3" />
      <circle cx="47.3" cy="5.0" r="1.3" />
      <circle cx="15.3" cy="37.0" r="1.3" />
      <circle cx="47.3" cy="37.0" r="1.3" />
    </g>
    <g id="itps-psu--silkscreen">
      <text x="82.4" y="21.0" transform="rotate(-90 82.4 21.0)" text-anchor="middle" font-family="sans-serif" font-size="1.5" fill="#d4d6d9">100-240V~/2.4A,50-60Hz</text>
    </g>
    <g id="itps-psu--thumbscrew-a" data-path="itps-psu/thumbscrew-a" data-class="fastener" data-z-cyl="5.0">
      <circle cx="4.0" cy="16.0" r="3.5" fill="#2a6fc9" stroke="#0d0f11" stroke-width="0.3" />
      <circle cx="4.0" cy="16.0" r="2.3" fill="#aeb3b9" stroke="#6e7378" stroke-width="0.25" />
      <path d="M 2.9 14.9 L 5.1 17.1 M 5.1 14.9 L 2.9 17.1" stroke="#4a4f55" stroke-width="0.4" />
    </g>
    <g id="itps-psu--thumbscrew-b" data-path="itps-psu/thumbscrew-b" data-class="fastener" data-z-cyl="5.0">
      <circle cx="90.0" cy="16.0" r="3.5" fill="#2a6fc9" stroke="#0d0f11" stroke-width="0.3" />
      <circle cx="90.0" cy="16.0" r="2.3" fill="#aeb3b9" stroke="#6e7378" stroke-width="0.25" />
      <path d="M 88.9 14.9 L 91.1 17.1 M 91.1 14.9 L 88.9 17.1" stroke="#4a4f55" stroke-width="0.4" />
    </g>
    <g id="itps-psu--inlet" data-path="itps-psu/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(53.5,11.0) rotate(90 14.0 10.0)">
      <title>itps-psu--inlet</title>
      <rect id="itps-psu--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="itps-psu/inlet/opening" data-class="cutout" />
      <path id="itps-psu--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="itps-psu--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="itps-psu--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="itps-psu--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="67.5 21" data-cp-dir="front" />
  </g>
</svg>
