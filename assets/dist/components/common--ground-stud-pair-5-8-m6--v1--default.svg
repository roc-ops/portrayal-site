    <g id="ground-stud-pair-5-8-m6--1" data-path="ground-stud-pair-5-8-m6/1" data-class="ground" data-ref="common/ground-screw-m6@1:1.0.0" data-connector="terminal-stud" transform="translate(0,0)">
      <title>ground-stud-pair-5-8-m6--1</title>
      <g id="ground-stud-pair-5-8-m6--1--head" data-z-cyl="4.6" data-z-color="#b9bec4">
        <circle cx="6" cy="6" r="5.9" fill="#b9bec4" stroke="#62686e" stroke-width="0.2" />
        <path d="M 3.36 6 H 8.64 M 6 3.36 V 8.64" fill="none" stroke="#4e5359" stroke-width="0.72" stroke-linecap="round" />
      </g>
      <g data-cp="mate" data-cp-at="6 6" data-cp-dir="front" data-cp-on="ground-stud-pair-5-8-m6--1--head" />
    </g>
    <g id="ground-stud-pair-5-8-m6--2" data-path="ground-stud-pair-5-8-m6/2" data-class="ground" data-ref="common/ground-screw-m6@1:1.0.0" data-connector="terminal-stud" transform="translate(15.875,0)">
      <title>ground-stud-pair-5-8-m6--2</title>
      <g id="ground-stud-pair-5-8-m6--2--head" data-z-cyl="4.6" data-z-color="#b9bec4">
        <circle cx="6" cy="6" r="5.9" fill="#b9bec4" stroke="#62686e" stroke-width="0.2" />
        <path d="M 3.36 6 H 8.64 M 6 3.36 V 8.64" fill="none" stroke="#4e5359" stroke-width="0.72" stroke-linecap="round" />
      </g>
      <g data-cp="mate" data-cp-at="6 6" data-cp-dir="front" data-cp-on="ground-stud-pair-5-8-m6--2--head" />
    </g>
    <g data-cp="mate" data-cp-at="13.9375 6" data-cp-dir="front" />
  </g>
</svg>
