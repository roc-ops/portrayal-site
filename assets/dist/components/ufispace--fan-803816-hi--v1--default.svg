<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="80.0mm" height="81.5mm" viewBox="0 0 80.0 81.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/fan-803816-hi@'] .state-fault { --led-color: #eab308; }
    g[data-ref^='ufispace/fan-803816-hi@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-803816-hi" data-path="fan-803816-hi" data-class="fan" data-behaviour="fills" data-ref="ufispace/fan-803816-hi@1:1.0.0" data-airflow="exhaust" data-model="FAN-803816-HI" data-power-absent="not-published" transform="translate(0,0)">
    <title>fan-803816-hi</title>
    <defs>
      <pattern id="fan-803816-hi--hex803" width="4.2" height="2.42" patternUnits="userSpaceOnUse">
        <path d="M 1.21 0 L 0.605 1.047 L -0.605 1.047 L -1.21 0 L -0.605 -1.047 L 0.605 -1.047 Z" fill="#0d0f11" />
        <path d="M 5.41 0 L 4.805 1.047 L 3.595 1.047 L 2.99 0 L 3.595 -1.047 L 4.805 -1.047 Z" fill="#0d0f11" />
        <path d="M 3.31 1.21 L 2.705 2.257 L 1.495 2.257 L 0.89 1.21 L 1.495 0.163 L 2.705 0.163 Z" fill="#0d0f11" />
        <path d="M 1.21 2.42 L 0.605 3.467 L -0.605 3.467 L -1.21 2.42 L -0.605 1.373 L 0.605 1.373 Z" fill="#0d0f11" />
        <path d="M 5.41 2.42 L 4.805 3.467 L 3.595 3.467 L 2.99 2.42 L 3.595 1.373 L 4.805 1.373 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="fan-803816-hi--body" x="0" y="0" width="80" height="81.5" rx="0.8" fill="#33383d" stroke="#1a1d20" stroke-width="0.5" />
    <rect id="fan-803816-hi--grille" x="1.8" y="1.8" width="76.4" height="77.9" rx="0.6" fill="url(#fan-803816-hi--hex803)" data-z-vent="30" />
    <g id="fan-803816-hi--handle" data-z-uhandle="29">
      <rect x="19.4" y="19.0" width="5.6" height="42.6" rx="2.8" fill="#c94a4a" />
      <rect x="14.0" y="19.0" width="6.2" height="3.6" rx="1.8" fill="#c94a4a" />
      <rect x="14.0" y="58.0" width="6.2" height="3.6" rx="1.8" fill="#c94a4a" />
    </g>
    <rect id="fan-803816-hi--release-tab" x="0.5" y="28.5" width="5.4" height="19.6" rx="1.2" fill="#d65252" data-z-out="2.0" />
    <g id="fan-803816-hi--silkscreen">
      <rect x="2.4" y="3.4" width="9.0" height="8.4" rx="0.8" fill="#e01414" />
      <text x="6.9" y="10.4" font-family="sans-serif" font-size="7.0" font-weight="bold" text-anchor="middle" fill="#0d0f11">E</text>
    </g>
    <circle id="fan-803816-hi--status-led" cx="9.1" cy="20.5" r="1.4" fill="var(--led-color, #3a3f44)" data-path="fan-803816-hi/status-led" data-class="led" data-states="off ok fault" data-description="HIG Fan FRU LED table - Off (no input power), Green (fan FRU function normal), Amber (fan FRU abnormal, service is required). Three rows, no blink states: this table is shorter than the S9510-28DC family's and is transcribed as it stands rather than filled out from a sibling" data-z-dome="0.4" />
  </g>
</svg>
