<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="372.0mm" height="41.27mm" viewBox="0 0 372.0 41.27">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="pbc-2000-bezel" data-path="pbc-2000-bezel" data-class="bezel" data-behaviour="mounts" data-ref="maiaedge/pbc-2000-bezel@2:2.0.0" transform="translate(0,0)">
    <title>pbc-2000-bezel</title>
    <defs>
      <linearGradient id="pbc-2000-bezel--pbc-bezel-slope" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#15181b" />
        <stop offset="0.3746" stop-color="#262a2f" />
        <stop offset="0.6179" stop-color="#262a2f" />
        <stop offset="1" stop-color="#121417" />
      </linearGradient>
    </defs>
    <g id="pbc-2000-bezel--bezel" data-z-out="11.25" data-z-profile-y="0:0,15.46:11.25,25.5:11.25,41.27:0" data-z-color="#1d2024" data-z-hole-color="#f7c600" data-z-shape="1">
      <path id="pbc-2000-bezel--bezel-plate" fill-rule="evenodd" fill="url(#pbc-2000-bezel--pbc-bezel-slope)" d="M0 0 L372.0 0 L372.0 41.27 L0 41.27 Z M36.00 2.46 L129.20 2.46 L148.20 15.46 L148.20 25.50 L129.20 38.50 L36.00 38.50 L17.00 25.50 L17.00 15.46 Z M259.20 2.46 L352.00 2.46 L369.60 15.46 L369.60 25.50 L352.00 38.50 L259.20 38.50 L241.60 25.50 L241.60 15.46 Z" />
      <path id="pbc-2000-bezel--bead-left" d="M36.31 3.46 L128.89 3.46 L147.20 15.99 L147.20 24.97 L128.89 37.50 L36.31 37.50 L18.00 24.97 L18.00 15.99 Z" fill="none" stroke="#f7c600" stroke-width="2" />
      <path id="pbc-2000-bezel--bead-right" d="M259.53 3.46 L351.67 3.46 L368.60 15.96 L368.60 25.00 L351.67 37.50 L259.53 37.50 L242.60 25.00 L242.60 15.96 Z" fill="none" stroke="#f7c600" stroke-width="2" />
      <rect id="pbc-2000-bezel--logo-zone" x="156.0" y="10.4" width="18.0" height="18.5" fill="none" data-path="pbc-2000-bezel/logo-zone" data-class="label" />
      <g id="pbc-2000-bezel--wordmark-silkscreen">
        <text id="pbc-2000-bezel--wordmark" x="178.4" y="22.0" font-family="sans-serif" font-size="10" textLength="54.4" lengthAdjust="spacingAndGlyphs" fill="#f7c21c">MaiaEdge</text>
      </g>
    </g>
    <g id="pbc-2000-bezel--status" data-path="pbc-2000-bezel/status" data-class="led" data-ref="common/led-indicator@1:1.2.0" transform="translate(362.6,31.65)" data-z-lift="5.44">
      <title>pbc-2000-bezel--status</title>
      <circle id="pbc-2000-bezel--status--bezel" cx="2" cy="2" r="1.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.2" />
      <circle id="pbc-2000-bezel--status--lamp" cx="2" cy="2" r="1.0" fill="var(--led-color, #3a3f44)" data-path="pbc-2000-bezel/status/lamp" data-class="led" data-states="off on" data-z-dome="0.45" />
    </g>
  </g>
</svg>
