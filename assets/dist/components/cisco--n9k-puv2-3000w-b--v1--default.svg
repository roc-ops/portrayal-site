<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="44.45mm" height="133.35mm" viewBox="0 0 44.45 133.35">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/n9k-puv2-3000w-b@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/n9k-puv2-3000w-b@'] .state-flashing-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/n9k-puv2-3000w-b@'] .state-flashing-amber { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='cisco/n9k-puv2-3000w-b@'] .state-flashing-green { --led-color: #39b54a; }
    g[data-ref^='cisco/n9k-puv2-3000w-b@'] .state-flashing-green { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='cisco/n9k-puv2-3000w-b@'] .state-green { --led-color: #39b54a; }</style>
  <g id="n9k-puv2-3000w-b" data-path="n9k-puv2-3000w-b" data-class="psu" data-behaviour="fills" data-ref="cisco/n9k-puv2-3000w-b@1:1.0.0" data-body-depth="450.85" data-airflow="port-side intake" data-efficiency="90% or greater (20 to 100% load)" data-eol="unknown" data-hot-swappable="True" data-inlet="other" data-input="ac-dc" data-input-frequency="50 to 60 Hz" data-input-voltage="180 to 305 VAC or 192 to 400 VDC" data-inputs="2" data-model="N9K-PUV2-3000W-B" data-power-output-w="3150" data-role="power-module" transform="translate(0,0)">
    <title>n9k-puv2-3000w-b</title>
    <rect id="n9k-puv2-3000w-b--plate" x="0.4" y="0.4" width="43.65" height="132.55" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3" />
    <rect id="n9k-puv2-3000w-b--vent" x="10.5" y="4" width="30" height="56" rx="1" fill="#2f3235" />
    <g id="n9k-puv2-3000w-b--handle">
      <rect x="33.5" y="10" width="5.5" height="44" rx="2.2" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="0.35" />
    </g>
    <circle id="n9k-puv2-3000w-b--ok" cx="5.7" cy="8.5" r="1.5" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="n9k-puv2-3000w-b/ok" data-class="led" data-states="green flashing-green off" data-description="OK lamp, upper left of the module." />
    <circle id="n9k-puv2-3000w-b--fail" cx="5.7" cy="14" r="1.5" fill="var(--led-color, #f5a623)" stroke="#9aa0a6" stroke-width="0.25" data-path="n9k-puv2-3000w-b/fail" data-class="led" data-states="amber flashing-amber off" data-description="FAIL or FAIL/ID lamp, below the OK lamp." />
    <g id="n9k-puv2-3000w-b--receptacle-a">
      <rect x="8" y="66" width="28.5" height="20" rx="1.5" fill="#3a3c3e" stroke="#9aa0a6" stroke-width="0.4" />
      <rect x="13" y="70" width="18.5" height="12" rx="1" fill="#1d1f21" />
    </g>
    <g id="n9k-puv2-3000w-b--receptacle-b">
      <rect x="8" y="90" width="28.5" height="20" rx="1.5" fill="#3a3c3e" stroke="#9aa0a6" stroke-width="0.4" />
      <rect x="13" y="94" width="18.5" height="12" rx="1" fill="#1d1f21" />
    </g>
    <g id="n9k-puv2-3000w-b--switch">
      <rect x="15" y="113" width="14.5" height="8" rx="1" fill="#c8cdd2" stroke="#9aa0a6" stroke-width="0.3" />
      <rect x="19" y="114.5" width="6.5" height="5" rx="0.8" fill="#3a3c3e" />
    </g>
    <g id="n9k-puv2-3000w-b--screw-bot">
      <circle cx="22.2" cy="127.5" r="2.8" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="22.2" cy="127.5" r="1.2" fill="#6d7379" />
    </g>
  </g>
</svg>
