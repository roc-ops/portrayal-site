<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="19.0mm" height="14.5mm" viewBox="0 0 19.0 14.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='common/qsfp28-cage@'] .state-link-100g { --led-color: #3b82f6; }
    g[data-ref^='common/qsfp28-cage@'] .state-link-10g { --led-color: #22c55e; }
    g[data-ref^='common/qsfp28-cage@'] .state-link-25g { --led-color: #f5f7fa; }
    g[data-ref^='common/qsfp28-cage@'] .state-link-40g { --led-color: #f97316; }</style>
  <g id="qsfp28-cage" data-path="qsfp28-cage" data-class="port" data-ref="common/qsfp28-cage@3:3.2.0" data-depth="37.0" data-lanes="4" data-media="qsfp28" data-speed="100g" transform="translate(0,0)">
    <title>qsfp28-cage</title>
    <rect id="qsfp28-cage--body" x="0" y="3.4" width="19" height="11.1" fill="#2b2f33" />
    <circle id="qsfp28-cage--led-1" cx="2.55" cy="1.5" r="0.8" fill="var(--led-color, #3a3f44)" data-path="qsfp28-cage/led-1" data-class="led" data-states="off link-100g link-40g link-25g link-10g fault" />
    <circle id="qsfp28-cage--led-2" cx="4.95" cy="1.5" r="0.8" fill="var(--led-color, #3a3f44)" data-path="qsfp28-cage/led-2" data-class="led" data-states="off link-100g link-40g link-25g link-10g fault" />
    <circle id="qsfp28-cage--led-3" cx="14.05" cy="1.5" r="0.8" fill="var(--led-color, #3a3f44)" data-path="qsfp28-cage/led-3" data-class="led" data-states="off link-100g link-40g link-25g link-10g fault" />
    <circle id="qsfp28-cage--led-4" cx="16.45" cy="1.5" r="0.8" fill="var(--led-color, #3a3f44)" data-path="qsfp28-cage/led-4" data-class="led" data-states="off link-100g link-40g link-25g link-10g fault" />
    <rect id="qsfp28-cage--cage" x="0.25" y="3.5" width="18.5" height="11" fill="#111316" stroke="#4a4f55" stroke-width="0.3" data-path="qsfp28-cage/cage" data-class="cage" />
    <g id="qsfp28-cage--aperture" data-path="qsfp28-cage/aperture" data-class="port" data-ref="std/qsfp-ganged@1:1.4.0" data-depth="37.0" data-wall="#aab0b7" data-cavity="module-bay" data-media="qsfp" transform="translate(0.25,4.2)">
      <title>qsfp28-cage--aperture</title>
      <rect id="qsfp28-cage--aperture--opening" x="0" y="0" width="18.5" height="9.58" rx="0.3" fill="#17191c" data-path="qsfp28-cage/aperture/opening" data-class="cutout" />
      <rect id="qsfp28-cage--aperture--module-bay" x="0.075" y="0.54" width="18.35" height="8.5" rx="0.3" fill="#0d0f11" />
      <rect id="qsfp28-cage--aperture--cage-lip" x="0.9" y="1.4" width="16.7" height="1.3" rx="0.3" fill="#2b2f33" />
      <rect id="qsfp28-cage--aperture--module-slot" x="0.9" y="4.0" width="16.7" height="2.6" rx="0.4" fill="#000000" />
      <g data-cp="mate" data-cp-at="9.25 4.79" data-cp-dir="front" />
    </g>
    <g data-cp="net" data-cp-at="9.5 9" data-cp-dir="front" />
  </g>
</svg>
