<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="83.06mm" height="40.39mm" viewBox="0 0 83.06 40.39">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/jpsu-1600-c-ac-afo@'] .state-blinking-green { --led-color: #39b54a; }
    g[data-ref^='juniper/jpsu-1600-c-ac-afo@'] .state-blinking-green { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/jpsu-1600-c-ac-afo@'] .state-green { --led-color: #39b54a; }</style>
  <g id="jpsu-1600-c-ac-afo" data-path="jpsu-1600-c-ac-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/jpsu-1600-c-ac-afo@1:1.0.0" data-body-depth="225.55" data-airflow="front-to-back" data-efficiency="80 Plus Platinum" data-hot-swap="yes" data-input-current="12 A at low line, 9 A at high line" data-input-frequency="50-60 Hz" data-input-voltage="100-120 VAC low line, 200-240 VAC high line" data-power-output-w="1600" data-role="ac-power-supply" data-weight-kg="0.91" data-states="ok fault absent" transform="translate(0,0)">
    <title>jpsu-1600-c-ac-afo</title>
    <rect id="jpsu-1600-c-ac-afo--face" x="0" y="0" width="83.06" height="40.39" rx="0.8" fill="#c6c7c9" stroke="#8f9093" stroke-width="0.4" />
    <g id="jpsu-1600-c-ac-afo--fan">
      <rect x="2.0" y="2.0" width="41.0" height="36.4" rx="1.2" fill="#b3b4b6" />
      <circle cx="22.5" cy="20.7" r="17.2" fill="#0f1011" />
      <circle cx="22.5" cy="20.7" r="13.6" fill="none" stroke="#a6a7a9" stroke-width="1.2" />
      <circle cx="22.5" cy="20.7" r="9.6" fill="#bdbebf" stroke="#9c9da0" stroke-width="0.5" />
      <path d="M 22.5 3.8 L 22.5 11.0 M 22.5 30.4 L 22.5 37.6 M 5.6 20.7 L 12.8 20.7 M 32.2 20.7 L 39.4 20.7" stroke="#a6a7a9" stroke-width="1.0" fill="none" />
    </g>
    <g id="jpsu-1600-c-ac-afo--screws" fill="#d2d3d5" stroke="#8d8e90" stroke-width="0.3">
      <circle cx="5.4" cy="4.2" r="1.9" />
      <circle cx="37.8" cy="4.2" r="1.9" />
      <circle cx="5.4" cy="37.3" r="1.9" />
      <circle cx="37.8" cy="37.3" r="1.9" />
    </g>
    <rect id="jpsu-1600-c-ac-afo--inlet-housing" x="49.6" y="1.3" width="23.6" height="31.1" rx="0.8" fill="#808183" />
    <g id="jpsu-1600-c-ac-afo--silkscreen" font-family="Arial" font-size="1.3" fill="#3a3b3d">
      <text x="45.6" y="5.6" text-anchor="middle">OUT.OK</text>
    </g>
    <circle id="jpsu-1600-c-ac-afo--led" cx="45.6" cy="8.4" r="1.2" fill="var(--led-color, #34503a)" stroke="#5c5e60" stroke-width="0.3" data-path="jpsu-1600-c-ac-afo/led" data-class="led" data-states="green blinking-green off" />
    <circle cx="62.4" cy="36.7" r="2.0" fill="#0f1011" />
    <g id="jpsu-1600-c-ac-afo--handle" data-path="jpsu-1600-c-ac-afo/handle" data-class="handle" data-z-out="6.0" data-z-color="#e8a010">
      <rect x="0.3" y="17.9" width="43.3" height="5.4" rx="0.5" fill="#e8a010" stroke="#b57c0a" stroke-width="0.3" />
      <polygon points="0.3,15.4 3.4,17.9 3.4,23.3 0.3,25.8" fill="#e8a010" stroke="#b57c0a" stroke-width="0.3" />
      <polygon points="43.6,15.4 40.5,17.9 40.5,23.3 43.6,25.8" fill="#e8a010" stroke="#b57c0a" stroke-width="0.3" />
    </g>
    <g id="jpsu-1600-c-ac-afo--latch" data-path="jpsu-1600-c-ac-afo/latch" data-class="latch" data-z-out="1.4" data-z-color="#9a9b9d">
      <rect x="73.1" y="10.4" width="3.6" height="18.1" rx="1.6" fill="#a9aaac" stroke="#808183" stroke-width="0.3" />
      <rect x="76.4" y="11.6" width="6.2" height="15.7" fill="#dcdcde" />
    </g>
    <g id="jpsu-1600-c-ac-afo--inlet" data-path="jpsu-1600-c-ac-afo/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(47.8,7.1) rotate(90 14.0 10.0)">
      <title>jpsu-1600-c-ac-afo--inlet</title>
      <rect id="jpsu-1600-c-ac-afo--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="jpsu-1600-c-ac-afo/inlet/opening" data-class="cutout" />
      <path id="jpsu-1600-c-ac-afo--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="jpsu-1600-c-ac-afo--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="jpsu-1600-c-ac-afo--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="jpsu-1600-c-ac-afo--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="61.8 17.1" data-cp-dir="rear" />
  </g>
</svg>
