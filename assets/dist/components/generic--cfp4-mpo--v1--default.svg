      <circle id="cfp4-mpo--mpo--11" cx="5.325" cy="4" r="0.0625" fill="#e8ecef" data-path="cfp4-mpo/mpo/11" data-class="fibre" />
      <circle id="cfp4-mpo--mpo--12" cx="5.075" cy="4" r="0.0625" fill="#e8ecef" data-path="cfp4-mpo/mpo/12" data-class="fibre" />
