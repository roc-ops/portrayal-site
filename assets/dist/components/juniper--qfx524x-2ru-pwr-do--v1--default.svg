<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.7mm" height="39.5mm" viewBox="0 0 73.7 39.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx524x-2ru-pwr-do@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx524x-2ru-pwr-do@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx524x-2ru-pwr-do" data-path="qfx524x-2ru-pwr-do" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx524x-2ru-pwr-do@1:1.0.0" data-airflow="front-to-back" data-inlet="other" data-input="-48 to -60 VDC, 80 A maximum per supply for 3 kW output; output 12.2 V (guide Tables 6 and 17)" data-model="QFX524X-2RU-PWR-DO" data-power-output-w="3000" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx524x-2ru-pwr-do</title>
    <defs>
      <pattern id="qfx524x-2ru-pwr-do--hex" width="2.6" height="4.5" patternUnits="userSpaceOnUse">
        <polygon points="1.3,0.2 2.1,0.65 2.1,1.65 1.3,2.1 0.5,1.65 0.5,0.65" fill="#2b2e32" />
        <polygon points="0,2.45 0.8,2.9 0.8,3.9 0,4.35 -0.8,3.9 -0.8,2.9" fill="#2b2e32" />
        <polygon points="2.6,2.45 3.4,2.9 3.4,3.9 2.6,4.35 1.8,3.9 1.8,2.9" fill="#2b2e32" />
      </pattern>
    </defs>
    <rect id="qfx524x-2ru-pwr-do--face" x="0" y="0" width="73.7" height="39.5" rx="0.8" fill="#a9adb3" stroke="#6b6f75" stroke-width="0.4" />
    <rect id="qfx524x-2ru-pwr-do--grille" x="18.8" y="1.4" width="45.2" height="36.7" fill="#b8bbc0" />
    <rect x="18.8" y="1.4" width="45.2" height="36.7" fill="url(#qfx524x-2ru-pwr-do--hex)" />
    <g id="qfx524x-2ru-pwr-do--handle" data-path="qfx524x-2ru-pwr-do/handle" data-class="latch" data-z-out="1.6" data-z-color="#1a1b1e">
      <rect x="10.9" y="3.1" width="7.2" height="35.1" rx="3.4" fill="#1a1b1e" stroke="#0e0f11" stroke-width="0.4" />
    </g>
    <g id="qfx524x-2ru-pwr-do--connector">
      <rect x="23.0" y="5.6" width="32.6" height="27.7" rx="1.4" fill="#2b2e32" stroke="#0e0f11" stroke-width="0.4" />
      <g fill="#15161a" stroke="#b8bbc0" stroke-width="0.35">
        <circle cx="32.6" cy="12.8" r="2.9" />
        <circle cx="41.1" cy="12.8" r="2.9" />
        <circle cx="50.0" cy="12.8" r="2.9" />
        <circle cx="32.6" cy="26.1" r="2.9" />
        <circle cx="41.1" cy="26.1" r="2.9" />
        <circle cx="50.0" cy="26.1" r="2.9" />
      </g>
      <g fill="#8a8d93">
        <circle cx="32.6" cy="12.8" r="1.3" />
        <circle cx="41.1" cy="12.8" r="1.3" />
        <circle cx="50.0" cy="12.8" r="1.3" />
        <circle cx="32.6" cy="26.1" r="1.3" />
        <circle cx="41.1" cy="26.1" r="1.3" />
        <circle cx="50.0" cy="26.1" r="1.3" />
      </g>
    </g>
    <g id="qfx524x-2ru-pwr-do--release-latch" data-path="qfx524x-2ru-pwr-do/release-latch" data-class="latch">
      <rect x="66.5" y="15.2" width="6.0" height="14.3" rx="1.0" fill="#202225" stroke="#0e0f11" stroke-width="0.35" />
    </g>
    <circle id="qfx524x-2ru-pwr-do--led-pwr" cx="70.1" cy="32.6" r="1.5" fill="var(--led-color, #8a8d93)" stroke="#6b6f75" stroke-width="0.3" data-path="qfx524x-2ru-pwr-do/led-pwr" data-class="led" data-states="green amber off" />
  </g>
</svg>
