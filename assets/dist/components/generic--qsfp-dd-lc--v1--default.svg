    <g id="qsfp-dd-lc--tx" data-path="qsfp-dd-lc/tx" data-class="port" data-ref="std/lc-bore@3:3.0.2" data-depth="4.5" data-wall="#4a4f55" data-cavity="bore" data-connector="lc" data-media="fiber" transform="translate(3.7,0.95) rotate(180 2.35 3.15)" data-z-lift="20.0">
