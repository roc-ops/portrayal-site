      <circle id="qsfp-dd-lc--rx--ferrule" cx="2.35" cy="2.35" r="0.625" fill="#e8ecef" data-z-top="3.6" data-z-color="#e8ecef" />
      <g data-cp="mate" data-cp-at="2.35 2.35" data-cp-dir="front" />
