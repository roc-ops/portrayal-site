    </g>
    <circle id="nxa-pac-1100w--ac-ok" cx="10.3" cy="8.3" r="2.2" fill="var(--led-color, #3a4046)" stroke="#5c6167" stroke-width="0.3" data-path="nxa-pac-1100w/ac-ok" data-class="led" data-states="off ok fault" />
    <circle id="nxa-pac-1100w--ps-ok" cx="32.0" cy="8.3" r="2.2" fill="var(--led-color, #3a4046)" stroke="#5c6167" stroke-width="0.3" data-path="nxa-pac-1100w/ps-ok" data-class="led" data-states="off ok fault" />
    <rect id="nxa-pac-1100w--inlet-surround" x="42.3" y="5.85" width="31.0" height="24.0" rx="1.2" fill="#3a3e43" />
    <g fill="#d5d9dd" stroke="#7a8087" stroke-width="0.3">
      <rect x="9.0" y="28.6" width="10.3" height="8.7" rx="0.4" />
      <rect x="28.0" y="28.6" width="14.0" height="8.7" rx="0.4" />
      <rect x="6.2" y="37.3" width="72.6" height="3.0" rx="0.4" />
