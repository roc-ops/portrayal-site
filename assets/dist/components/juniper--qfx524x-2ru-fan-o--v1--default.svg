<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="80.3mm" height="80.0mm" viewBox="0 0 80.3 80.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qfx524x-2ru-fan-o" data-path="qfx524x-2ru-fan-o" data-class="fan" data-behaviour="fills" data-ref="juniper/qfx524x-2ru-fan-o@1:1.0.0" data-airflow="front-to-back" data-model="QFX524X-2RU-FAN-O" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>qfx524x-2ru-fan-o</title>
    <defs>
      <pattern id="qfx524x-2ru-fan-o--hex" width="2.9" height="5.0" patternUnits="userSpaceOnUse">
        <polygon points="1.45,0.2 2.4,0.75 2.4,1.85 1.45,2.4 0.5,1.85 0.5,0.75" fill="#0a0b0d" />
        <polygon points="0,2.7 0.95,3.25 0.95,4.35 0,4.9 -0.95,4.35 -0.95,3.25" fill="#0a0b0d" />
        <polygon points="2.9,2.7 3.85,3.25 3.85,4.35 2.9,4.9 1.95,4.35 1.95,3.25" fill="#0a0b0d" />
      </pattern>
    </defs>
    <rect id="qfx524x-2ru-fan-o--face" x="0" y="0" width="80.3" height="80.0" rx="0.8" fill="#5a6069" stroke="#3a3e45" stroke-width="0.4" />
    <rect id="qfx524x-2ru-fan-o--grille" x="5.1" y="2.9" width="70.3" height="74.2" fill="#2c3036" />
    <rect x="5.1" y="2.9" width="70.3" height="74.2" fill="url(#qfx524x-2ru-fan-o--hex)" />
    <g id="qfx524x-2ru-fan-o--handle" data-path="qfx524x-2ru-fan-o/handle" data-class="latch" data-z-out="2.0" data-z-color="#e8731f">
      <path d="M 0 28.7 C 20 28.7, 52 36.0, 79.6 36.6 V 52.3 C 55 46.0, 25 44.5, 0 43.9 Z" fill="#e8731f" stroke="#b95812" stroke-width="0.4" />
      <g fill="#d3661a">
        <rect x="7.0" y="30.9" width="19.0" height="4.2" rx="1.2" />
        <rect x="7.0" y="36.6" width="19.0" height="4.2" rx="1.2" />
        <rect x="55.0" y="37.3" width="19.0" height="4.2" rx="1.2" />
        <rect x="55.0" y="43.0" width="19.0" height="4.2" rx="1.2" />
      </g>
      <rect id="qfx524x-2ru-fan-o--airout-chip" x="31.4" y="37.2" width="13.4" height="6.9" rx="0.8" fill="#5b6066" />
      <g fill="#e8731f">
        <circle cx="35.0" cy="40.65" r="0.5" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" transform="rotate(90 35.0 40.65)" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" transform="rotate(180 35.0 40.65)" />
        <ellipse cx="35.0" cy="39.3" rx="0.8" ry="1.3" transform="rotate(270 35.0 40.65)" />
      </g>
      <g id="qfx524x-2ru-fan-o--silkscreen">
        <text x="40.6" y="40.0" font-family="sans-serif" font-size="2.4" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="40.6" y="43.0" font-family="sans-serif" font-size="2.4" fill="#e8eaec" text-anchor="middle">OUT</text>
      </g>
    </g>
    <g id="qfx524x-2ru-fan-o--screw" data-path="qfx524x-2ru-fan-o/screw" data-class="screw" data-z-cyl="1.2">
      <circle cx="4.1" cy="4.1" r="1.7" fill="#15161a" stroke="#3a3e45" stroke-width="0.3" />
    </g>
  </g>
</svg>
