<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.4mm" height="39.7mm" viewBox="0 0 54.4 39.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-fan-failed { --led-color: #e53935; }
    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-fan-failed { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-fault { --led-color: #e53935; }
    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-standby { --led-color: #39b54a; }
    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-warning { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5200-48y-apsu-ao@'] .state-warning { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="qfx5200-48y-apsu-ao" data-path="qfx5200-48y-apsu-ao" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5200-48y-apsu-ao@1:1.0.0" data-airflow="front-to-back" data-input="100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC or 3.8 A at 200 to 240 VAC (QFX5200-48Y, guide Table 20)" data-model="QFX520048Y-APSU-AO" data-power-output-w="650" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5200-48y-apsu-ao</title>
    <defs>
      <pattern id="qfx5200-48y-apsu-ao--grid" width="3.6" height="4.4" patternUnits="userSpaceOnUse">
        <rect x="0.3" y="0.3" width="2.8" height="3.6" fill="#101214" />
      </pattern>
    </defs>
    <rect id="qfx5200-48y-apsu-ao--face" x="4.0" y="0" width="50.4" height="39.7" rx="0.6" fill="#a4a7ab" stroke="#6b6f74" stroke-width="0.4" />
    <g id="qfx5200-48y-apsu-ao--vents">
      <rect x="6.0" y="9.0" width="8.6" height="29.4" fill="url(#qfx5200-48y-apsu-ao--grid)" />
      <rect x="49.8" y="9.0" width="3.6" height="22.0" fill="url(#qfx5200-48y-apsu-ao--grid)" />
      <rect x="22.6" y="1.6" width="3.2" height="2.6" fill="#101214" />
      <rect x="38.4" y="1.6" width="3.2" height="2.6" fill="#101214" />
      <rect x="42.6" y="1.6" width="3.2" height="2.6" fill="#101214" />
      <circle cx="35.5" cy="3.9" r="2.3" fill="#101214" />
    </g>
    <rect id="qfx5200-48y-apsu-ao--inlet-bay" x="25.0" y="7.0" width="20.4" height="30.0" rx="1.2" fill="#121416" stroke="#2b2d31" stroke-width="0.3" />
    <g id="qfx5200-48y-apsu-ao--lamp">
      <circle cx="13.0" cy="5.3" r="1.9" fill="#d5d8db" stroke="#6b6f74" stroke-width="0.3" />
      <circle id="qfx5200-48y-apsu-ao--led" cx="13.0" cy="5.3" r="1.2" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5200-48y-apsu-ao/led" data-class="led" data-states="green standby warning fault fan-failed off" />
    </g>
    <g id="qfx5200-48y-apsu-ao--bail" data-path="qfx5200-48y-apsu-ao/bail" data-class="latch">
      <rect x="15.2" y="3.0" width="5.6" height="36.0" rx="2.8" fill="none" stroke="#17181a" stroke-width="2.2" />
    </g>
    <g id="qfx5200-48y-apsu-ao--latch" data-path="qfx5200-48y-apsu-ao/latch" data-class="latch" data-z-out="1.6" data-z-color="#e8444a">
      <rect x="0.0" y="2.5" width="9.4" height="21.0" rx="1.0" fill="#e8444a" stroke="#a8282e" stroke-width="0.4" />
      <rect x="3.6" y="9.0" width="2.0" height="7.4" rx="0.5" fill="#3a0e10" />
    </g>
    <g id="qfx5200-48y-apsu-ao--inlet" data-path="qfx5200-48y-apsu-ao/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(21.2,12.0) rotate(270 14.0 10.0)">
      <title>qfx5200-48y-apsu-ao--inlet</title>
      <rect id="qfx5200-48y-apsu-ao--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="qfx5200-48y-apsu-ao/inlet/opening" data-class="cutout" />
      <path id="qfx5200-48y-apsu-ao--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="qfx5200-48y-apsu-ao--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx5200-48y-apsu-ao--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="qfx5200-48y-apsu-ao--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
