<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="39.0mm" height="73.5mm" viewBox="0 0 39.0 73.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='celestica/psu-1300@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='celestica/psu-1300@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="psu-1300" data-path="psu-1300" data-class="psu" data-behaviour="fills" data-ref="celestica/psu-1300@1:1.0.0" data-form-factor="crps-1u" data-input="ac" data-power-output-w="1300" data-states="ok fail absent" transform="translate(0,0)">
    <title>psu-1300</title>
    <rect id="psu-1300--body" x="0" y="0" width="39" height="73.5" rx="0.5" fill="#c3c7cb" stroke="#8a9099" stroke-width="0.35" />
    <rect id="psu-1300--lamp-plate" x="0.6" y="0.6" width="37.8" height="6.2" rx="0.4" fill="#d6d9dc" />
    <g id="psu-1300--fan">
      <rect id="psu-1300--fan-bay" x="0.8" y="32.2" width="30.4" height="38.6" rx="0.6" fill="#26292d" />
      <circle id="psu-1300--fan-bore" cx="18.9" cy="50.5" r="17.6" fill="#101214" />
      <g id="psu-1300--fan-blades" fill="#3a3e43">
        <path d="M 18.9 50.5 L 30.5 38.2 A 17 17 0 0 1 35.6 47.2 Z" />
        <path d="M 18.9 50.5 L 35.3 55.6 A 17 17 0 0 1 29.4 63.8 Z" />
        <path d="M 18.9 50.5 L 24.1 66.7 A 17 17 0 0 1 13.2 66.5 Z" />
        <path d="M 18.9 50.5 L 6.5 61.8 A 17 17 0 0 1 2.1 52.3 Z" />
        <path d="M 18.9 50.5 L 2.6 45.2 A 17 17 0 0 1 8.3 37.1 Z" />
        <path d="M 18.9 50.5 L 13.7 34.3 A 17 17 0 0 1 24.6 34.5 Z" />
      </g>
      <circle id="psu-1300--fan-hub" cx="18.9" cy="50.5" r="10.0" fill="#dfe2e5" stroke="#b3b8bd" stroke-width="0.3" />
    </g>
    <circle id="psu-1300--screw-a" cx="3.5" cy="35.1" r="2.7" fill="#e2e5e8" stroke="#8a9099" stroke-width="0.3" />
    <circle id="psu-1300--screw-b" cx="3.5" cy="67.4" r="2.7" fill="#e2e5e8" stroke="#8a9099" stroke-width="0.3" />
    <path d="M 2.1 35.1 H 4.9 M 3.5 33.7 V 36.5 M 2.1 67.4 H 4.9 M 3.5 66.0 V 68.8" stroke="#8a9099" stroke-width="0.4" fill="none" />
    <path id="psu-1300--inlet-frame" fill-rule="evenodd" fill="#1a1c1f" stroke="#0b0c0e" stroke-width="0.25" d="M 1.2 7.4 H 31.9 V 29.4 L 30.1 31.2 H 3.0 L 1.2 29.4 Z        M 2.6 9.3 H 30.6 V 29.3 H 2.6 Z" data-z-out="1.6" />
    <g id="psu-1300--handle" fill="#1b1d20" data-path="psu-1300/handle" data-class="handle" data-z-uhandle="12">
      <rect x="35.2" y="31.2" width="3.8" height="39.9" rx="1.6" />
      <rect x="27.3" y="31.2" width="9.5" height="2.6" rx="1.2" />
      <rect x="27.3" y="68.5" width="9.5" height="2.6" rx="1.2" />
    </g>
    <circle id="psu-1300--status-led" cx="9.05" cy="3.68" r="1.4" fill="var(--led-color, #2fa64a)" stroke="#1b1d20" stroke-width="0.45" data-path="psu-1300/status-led" data-class="led" data-states="off ok fail" data-z-dome="0.4" />
    <g id="psu-1300--inlet" data-path="psu-1300/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(2.6,9.3) rotate(180 14.0 10.0)">
      <title>psu-1300--inlet</title>
      <rect id="psu-1300--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-1300/inlet/opening" data-class="cutout" />
      <path id="psu-1300--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-1300--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-1300--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-1300--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="16.6 19.3" data-cp-dir="rear" />
  </g>
</svg>
