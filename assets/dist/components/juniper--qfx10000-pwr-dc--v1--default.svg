<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="91.4mm" height="88.9mm" viewBox="0 0 91.4 88.9">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx10000-pwr-dc@'] .state-fault { --led-color: #ef4444; }
    g[data-ref^='juniper/qfx10000-pwr-dc@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='juniper/qfx10000-pwr-dc@'] .state-warning { --led-color: #f59e0b; }
    g[data-ref^='juniper/qfx10000-pwr-dc@'] .state-warning { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="qfx10000-pwr-dc" data-path="qfx10000-pwr-dc" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx10000-pwr-dc@1:1.0.0" data-body-depth="365.8" data-airflow="front-to-back" data-hot-swap="yes" data-inlet="dc-terminal" data-input-current-a="60" data-input-voltage="-40 to -72 VDC, -48 VDC nominal" data-model="QFX10000-PWR-DC" data-output="12 VDC" data-power-output-w="2500" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx10000-pwr-dc</title>
    <defs>
      <pattern id="qfx10000-pwr-dc--hex" x="0" y="0" width="4.6" height="3.98" patternUnits="userSpaceOnUse">
        <polygon points="2.0,0.995 1.575,1.73 0.725,1.73 0.3,0.995 0.725,0.26 1.575,0.26" fill="#3a3e43" />
        <polygon points="4.3,0.995 3.875,1.73 3.025,1.73 2.6,0.995 3.025,0.26 3.875,0.26" fill="#3a3e43" />
        <polygon points="0.85,2.985 0.425,3.72 -0.425,3.72 -0.85,2.985 -0.425,2.25 0.425,2.25" fill="#3a3e43" />
        <polygon points="3.15,2.985 2.725,3.72 1.875,3.72 1.45,2.985 1.875,2.25 2.725,2.25" fill="#3a3e43" />
        <polygon points="5.45,2.985 5.025,3.72 4.175,3.72 3.75,2.985 4.175,2.25 5.025,2.25" fill="#3a3e43" />
      </pattern>
    </defs>
    <rect id="qfx10000-pwr-dc--face" x="0" y="0" width="91.4" height="88.9" rx="0.8" fill="#565b61" stroke="#44484d" stroke-width="0.5" />
    <g id="qfx10000-pwr-dc--vents">
      <rect x="25.5" y="1.4" width="64.3" height="86.2" fill="url(#qfx10000-pwr-dc--hex)" />
    </g>
    <g id="qfx10000-pwr-dc--lugs">
      <rect x="1.9" y="1.4" width="22.5" height="85.6" rx="1.2" fill="#44484d" stroke="#2b2e32" stroke-width="0.4" />
      <circle cx="15.4" cy="19.8" r="6.0" fill="#17191c" />
      <circle cx="15.4" cy="19.8" r="3.4" fill="#8a8f95" />
      <circle cx="15.4" cy="36.4" r="6.0" fill="#17191c" />
      <circle cx="15.4" cy="36.4" r="3.4" fill="#8a8f95" />
      <circle cx="15.4" cy="52.9" r="6.0" fill="#17191c" />
      <circle cx="15.4" cy="52.9" r="3.4" fill="#8a8f95" />
      <circle cx="15.4" cy="69.5" r="6.0" fill="#17191c" />
      <circle cx="15.4" cy="69.5" r="3.4" fill="#8a8f95" />
    </g>
    <rect id="qfx10000-pwr-dc--handle" x="41.9" y="34.0" width="43.8" height="6.3" rx="3.15" fill="#2b2e32" stroke="#17191c" stroke-width="0.4" data-path="qfx10000-pwr-dc/handle" data-class="handle" />
    <g id="qfx10000-pwr-dc--dip">
      <rect x="45.7" y="51.0" width="6.9" height="10.1" rx="0.4" fill="#e8eaec" stroke="#17191c" stroke-width="0.3" />
      <rect x="46.9" y="53.2" width="1.9" height="3.6" fill="#17191c" />
      <rect x="49.6" y="53.2" width="1.9" height="3.6" fill="#17191c" />
    </g>
    <g id="qfx10000-pwr-dc--screw">
      <circle cx="54.3" cy="76.7" r="5.2" fill="#2b2e32" stroke="#17191c" stroke-width="0.4" />
      <circle cx="54.3" cy="76.7" r="3.5" fill="#8a8f95" />
    </g>
    <g id="qfx10000-pwr-dc--rocker">
      <rect x="63.6" y="64.0" width="13.2" height="18.1" rx="1.0" fill="#2b2e32" stroke="#17191c" stroke-width="0.4" />
      <rect x="65.4" y="65.8" width="9.6" height="14.5" rx="0.8" fill="#0b0c0d" />
    </g>
    <circle id="qfx10000-pwr-dc--led-inp1" cx="56.6" cy="43.8" r="1.5" fill="var(--led-color, #3a3f44)" stroke="#33373c" stroke-width="0.25" data-path="qfx10000-pwr-dc/led-inp1" data-class="led" data-states="off ok warning" />
    <circle id="qfx10000-pwr-dc--led-inp2" cx="56.6" cy="50.4" r="1.5" fill="var(--led-color, #0f1113)" stroke="#33373c" stroke-width="0.25" data-path="qfx10000-pwr-dc/led-inp2" data-class="led" data-states="off ok warning" />
    <circle id="qfx10000-pwr-dc--led-pwr-ok" cx="56.6" cy="57.0" r="1.5" fill="var(--led-color, #0f1113)" stroke="#33373c" stroke-width="0.25" data-path="qfx10000-pwr-dc/led-pwr-ok" data-class="led" data-states="off ok warning" />
    <circle id="qfx10000-pwr-dc--led-fault" cx="56.6" cy="63.8" r="1.5" fill="var(--led-color, #0f1113)" stroke="#33373c" stroke-width="0.25" data-path="qfx10000-pwr-dc/led-fault" data-class="led" data-states="off fault" />
    <g id="qfx10000-pwr-dc--silkscreen">
      <text x="60.9" y="43.8" transform="rotate(-90 60.9 43.8)" font-family="sans-serif" font-size="1.4" fill="#e8eaec" text-anchor="middle">INP1</text>
      <text x="60.9" y="50.4" transform="rotate(-90 60.9 50.4)" font-family="sans-serif" font-size="1.4" fill="#e8eaec" text-anchor="middle">INP2</text>
      <text x="60.9" y="57.0" transform="rotate(-90 60.9 57.0)" font-family="sans-serif" font-size="1.4" fill="#e8eaec" text-anchor="middle">PWR OK</text>
      <text x="60.9" y="63.8" transform="rotate(-90 60.9 63.8)" font-family="sans-serif" font-size="1.4" fill="#e8eaec" text-anchor="middle">FAULT</text>
      <text x="49.1" y="64.6" font-family="sans-serif" font-size="1.5" fill="#e8eaec" text-anchor="middle">ON</text>
      <text x="47.8" y="50.0" font-family="sans-serif" font-size="1.3" fill="#e8eaec" text-anchor="middle">2</text>
      <text x="50.5" y="50.0" font-family="sans-serif" font-size="1.3" fill="#e8eaec" text-anchor="middle">1</text>
      <text x="70.2" y="71.0" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">I</text>
      <text x="70.2" y="77.6" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">O</text>
    </g>
  </g>
</svg>
