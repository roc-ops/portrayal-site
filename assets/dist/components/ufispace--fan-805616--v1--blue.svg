<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="83.7mm" height="80.0mm" viewBox="0 0 83.7 80.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/fan-805616@'] .state-fault { --led-color: #eab308; }
    g[data-ref^='ufispace/fan-805616@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-805616" data-path="fan-805616" data-class="fan" data-behaviour="fills" data-ref="ufispace/fan-805616@1:1.0.1" data-airflow="exhaust" data-model="FAN-805616-HCE" data-power-absent="not-published" transform="translate(0,0)">
    <title>fan-805616</title>
    <defs>
      <pattern id="fan-805616--hex805616b" width="4.43" height="2.555" patternUnits="userSpaceOnUse">
        <path d="M 1.275 0 L 0.6375 1.104 L -0.6375 1.104 L -1.275 0 L -0.6375 -1.104 L 0.6375 -1.104 Z" fill="#0d0f11" />
        <path d="M 5.705 0 L 5.0675 1.104 L 3.7925 1.104 L 3.155 0 L 3.7925 -1.104 L 5.0675 -1.104 Z" fill="#0d0f11" />
        <path d="M 3.49 1.2775 L 2.8525 2.3815 L 1.5775 2.3815 L 0.94 1.2775 L 1.5775 0.1735 L 2.8525 0.1735 Z" fill="#0d0f11" />
        <path d="M 1.275 2.555 L 0.6375 3.659 L -0.6375 3.659 L -1.275 2.555 L -0.6375 1.451 L 0.6375 1.451 Z" fill="#0d0f11" />
        <path d="M 5.705 2.555 L 5.0675 3.659 L 3.7925 3.659 L 3.155 2.555 L 3.7925 1.451 L 5.0675 1.451 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="fan-805616--body" x="0" y="0" width="83.7" height="80" rx="0.8" fill="#2b2f33" stroke="#1a1d20" stroke-width="0.5" />
    <rect id="fan-805616--grille-bed" x="3.6" y="3.2" width="76.5" height="73.6" rx="1.0" fill="#3d4348" />
    <rect id="fan-805616--rotor-grille" x="3.6" y="3.2" width="76.5" height="73.6" rx="1.0" fill="url(#fan-805616--hex805616b)" data-z-vent="25" />
    <rect id="fan-805616--grille-edge" x="3.6" y="3.2" width="76.5" height="73.6" rx="1.0" fill="none" stroke="#4a5056" stroke-width="0.4" />
    <g id="fan-805616--airflow-label" data-path="fan-805616/airflow-label" data-class="label" data-z-out="0.3">
      <rect x="7.8" y="4.1" width="8.2" height="6.1" rx="0.6" fill="#1d5fa8" />
      <rect x="11.0" y="5.4" width="0.9" height="3.5" fill="#f5f7fa" />
      <rect x="9.8" y="5.4" width="3.3" height="0.9" fill="#f5f7fa" />
      <rect x="9.8" y="8.0" width="3.3" height="0.9" fill="#f5f7fa" />
    </g>
    <circle id="fan-805616--status-led" cx="13.75" cy="19.85" r="1.45" fill="var(--led-color, #3a3f44)" stroke="#1a1d20" stroke-width="0.2" data-path="fan-805616/status-led" data-class="led" data-states="off ok fault" data-description="HIG Fan FRU LED table - Off (no input power), Solid Green (fan is functioning normal), Solid Yellow (fan is abnormal, service is required)" data-z-dome="0.4" />
    <g id="fan-805616--release-tab" data-path="fan-805616/release-tab" data-class="latch" data-z-out="1.2">
      <rect x="0.8" y="30.2" width="9.0" height="20.4" rx="0.9" fill="#1d5fa8" stroke="#14406f" stroke-width="0.3" />
      <rect x="4.6" y="36.0" width="1.4" height="8.8" rx="0.5" fill="#17191c" />
    </g>
    <rect id="fan-805616--handle" x="27.0" y="21.6" width="5.7" height="37.1" rx="2.8" fill="#2f74c0" stroke="#14406f" stroke-width="0.35" data-path="fan-805616/handle" data-class="handle" data-z-uhandle="22" />
  </g>
</svg>
