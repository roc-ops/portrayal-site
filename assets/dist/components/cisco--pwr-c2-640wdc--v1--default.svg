    <circle id="pwr-c2-640wdc--dc-ok" cx="9.6" cy="8.2" r="1.2" fill="var(--led-color, #2b2e31)" stroke="#7a8087" stroke-width="0.2" data-path="pwr-c2-640wdc/dc-ok" data-class="led" data-states="off ok" />
    <circle id="pwr-c2-640wdc--ps-ok" cx="22.6" cy="8.2" r="1.2" fill="var(--led-color, #2b2e31)" stroke="#7a8087" stroke-width="0.2" data-path="pwr-c2-640wdc/ps-ok" data-class="led" data-states="off ok fault" />
