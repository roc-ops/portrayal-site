<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="42.4mm" height="27.4mm" viewBox="0 0 42.4 27.4">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="7010tx-dc-terminal" data-path="7010tx-dc-terminal" data-class="inlet" data-behaviour="mounts" data-ref="arista/7010tx-dc-terminal@1:1.0.0" data-media="dc-terminal" transform="translate(0,0)">
    <title>7010tx-dc-terminal</title>
    <g id="7010tx-dc-terminal--guards">
      <rect x="0" y="0" width="4.6" height="27.4" rx="0.5" fill="#c3c7ce" stroke="#8c919a" stroke-width="0.3" />
      <rect x="37.8" y="0" width="4.6" height="27.4" rx="0.5" fill="#c3c7ce" stroke="#8c919a" stroke-width="0.3" />
      <rect x="0" y="0" width="4.6" height="2.2" fill="#4a4d52" />
      <rect x="0" y="25.2" width="4.6" height="2.2" fill="#4a4d52" />
      <rect x="37.8" y="0" width="4.6" height="2.2" fill="#4a4d52" />
      <rect x="37.8" y="25.2" width="4.6" height="2.2" fill="#4a4d52" />
    </g>
    <rect id="7010tx-dc-terminal--block" x="10.9" y="2.0" width="20.6" height="23.4" rx="0.6" fill="#8d9097" stroke="#5f636a" stroke-width="0.3" />
    <rect id="7010tx-dc-terminal--pole-1" x="16.2" y="4.8" width="7.0" height="7.0" rx="0.8" fill="#6f737a" data-path="7010tx-dc-terminal/pole-1" data-class="terminal" />
    <rect id="7010tx-dc-terminal--pole-2" x="16.2" y="14.1" width="7.0" height="7.0" rx="0.8" fill="#6f737a" data-path="7010tx-dc-terminal/pole-2" data-class="terminal" />
    <rect id="7010tx-dc-terminal--barrier" x="10.9" y="12.6" width="20.6" height="0.9" fill="#4d5057" />
    <rect id="7010tx-dc-terminal--cover" x="9.4" y="0.6" width="23.6" height="26.2" rx="0.8" fill="#d9dde3" fill-opacity="0.35" stroke="#a9aeb7" stroke-width="0.3" />
    <g id="7010tx-dc-terminal--lug-1" data-path="7010tx-dc-terminal/lug-1" data-class="screw" data-ref="common/terminal-screw-34@1:1.0.1" transform="translate(18.0,6.6)">
      <title>7010tx-dc-terminal--lug-1</title>
      <circle id="7010tx-dc-terminal--lug-1--head" cx="1.7" cy="1.7" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" data-z-cyl="1.2" data-z-color="#c3c9cf" />
      <path id="7010tx-dc-terminal--lug-1--slot" d="M 0.35 1.7 H 3.05 M 1.7 0.35 V 3.05" fill="none" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round" />
      <g data-cp="mate" data-cp-at="1.7 1.7" data-cp-dir="front" data-cp-on="7010tx-dc-terminal--lug-1--head" />
    </g>
    <g id="7010tx-dc-terminal--lug-2" data-path="7010tx-dc-terminal/lug-2" data-class="screw" data-ref="common/terminal-screw-34@1:1.0.1" transform="translate(18.0,15.9)">
      <title>7010tx-dc-terminal--lug-2</title>
      <circle id="7010tx-dc-terminal--lug-2--head" cx="1.7" cy="1.7" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" data-z-cyl="1.2" data-z-color="#c3c9cf" />
      <path id="7010tx-dc-terminal--lug-2--slot" d="M 0.35 1.7 H 3.05 M 1.7 0.35 V 3.05" fill="none" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round" />
      <g data-cp="mate" data-cp-at="1.7 1.7" data-cp-dir="front" data-cp-on="7010tx-dc-terminal--lug-2--head" />
    </g>
    <g data-cp="dc-in" data-cp-at="21.2 13.7" data-cp-dir="front" />
  </g>
</svg>
