<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="12.7mm" height="12.7mm" viewBox="0 0 12.7 12.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="bnc-jack" data-path="bnc-jack" data-class="port" data-ref="common/bnc-jack@1:1.0.0" data-media="coax-bnc" transform="translate(0,0)">
    <title>bnc-jack</title>
    <path id="bnc-jack--flange" fill="#c0c4c8" fill-rule="evenodd" d="M 0 6.35 A 6.35 6.35 0 1 0 12.7 6.35 A 6.35 6.35 0 1 0 0 6.35 Z        M 1.525 6.35 A 4.825 4.825 0 1 0 11.175 6.35 A 4.825 4.825 0 1 0 1.525 6.35 Z" data-z-cyl="1.4" data-z-color="#c0c4c8" />
    <rect id="bnc-jack--lug-l" x="0.84" y="5.3575" width="0.885" height="1.985" fill="#d7dade" stroke="#7d8388" stroke-width="0.1" data-z-out="8.96" data-z-lift="6.97" data-z-color="#d7dade" />
    <rect id="bnc-jack--lug-r" x="10.975" y="5.3575" width="0.885" height="1.985" fill="#d7dade" stroke="#7d8388" stroke-width="0.1" data-z-out="8.96" data-z-lift="6.97" data-z-color="#d7dade" />
    <g id="bnc-jack--jack" data-path="bnc-jack/jack" data-class="port" data-inner="1" data-ref="std/bnc@1:1.0.0" data-media="coax-bnc" transform="translate(1.5,1.5)">
      <title>bnc-jack--jack</title>
      <path id="bnc-jack--jack--opening" d="M 2.107 8.85 A 4.85 4.85 0 1 1 7.593 8.85 Z" fill="#15181b" data-path="bnc-jack/jack/opening" data-class="cutout" />
      <g id="bnc-jack--jack--collar" data-z-cyl="10.8" data-z-lift="1.4" data-z-color="#d7dade">
        <circle cx="4.85" cy="4.85" r="4.825" fill="#d7dade" stroke="#7d8388" stroke-width="0.14" />
        <circle cx="4.85" cy="4.85" r="4.19" fill="#2b2f33" />
        <circle cx="4.85" cy="4.85" r="3.25" fill="#a8a392" />
        <circle cx="4.85" cy="4.85" r="2.36" fill="#e8e4d6" />
        <circle cx="4.85" cy="4.85" r="0.55" fill="#c9a227" />
        <circle cx="4.85" cy="4.85" r="0.22" fill="#3a3325" />
      </g>
      <g data-cp="mate" data-cp-at="4.85 4.85" data-cp-dir="front" />
    </g>
    <g data-cp="rf" data-cp-at="6.35 6.35" data-cp-dir="front" />
  </g>
</svg>
