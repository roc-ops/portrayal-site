    <rect id="psu-550w--latch" x="65" y="1.5" width="7" height="6" rx="1" fill="#3b4a8c" data-path="psu-550w/latch" data-class="latch" data-z-out="1.4" data-z-color="#3b4a8c" />
    <g id="psu-550w--inlet" data-path="psu-550w/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(42.0,10.0) rotate(90 14.0 10.0)">
      <title>psu-550w--inlet</title>
      <rect id="psu-550w--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-550w/inlet/opening" data-class="cutout" />
      <path id="psu-550w--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-550w--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-550w--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-550w--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
