    </g>
    <g id="bp-f2--input" data-path="bp-f2/input" data-class="port" data-ref="std/sc-bore@1:1.0.0" data-depth="6.0" data-wall="#4a4f55" data-cavity="bore" data-connector="SC/APC" data-media="fiber" data-role="optical-input" transform="translate(8.21,82.3) rotate(90 4.195 4.5)">
