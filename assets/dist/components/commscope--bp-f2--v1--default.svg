      <rect x="7.40" y="31.4" width="2.0" height="46.0" rx="1.0" />
      <rect x="11.70" y="31.4" width="2.0" height="46.0" rx="1.0" />
      <rect x="15.80" y="31.4" width="2.0" height="46.0" rx="1.0" />
      <rect x="20.10" y="31.4" width="2.0" height="46.0" rx="1.0" />
    </g>
