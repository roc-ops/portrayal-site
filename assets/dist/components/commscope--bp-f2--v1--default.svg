      <rect id="bp-f2--input--hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <rect id="bp-f2--input--hook-lower" x="1.9" y="7.2" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
      <circle id="bp-f2--input--collar" cx="4.64" cy="4.5" r="2.34" fill="#262a2f" stroke="#3a4046" stroke-width="0.12" data-z-top="3.8" />
      <circle id="bp-f2--input--sleeve" cx="4.64" cy="4.5" r="1.65" fill="#1e2226" />
      <circle id="bp-f2--input--ferrule" cx="4.64" cy="4.5" r="1.25" fill="#e8ecef" data-z-top="4.8" data-z-color="#e8ecef" />
      <g data-cp="mate" data-cp-at="4.64 4.5" data-cp-dir="front" />
    </g>
    <g id="bp-f2--output" data-path="bp-f2/output" data-class="port" data-ref="std/sc-bore@1:1.0.0" data-depth="6.0" data-wall="#4a4f55" data-cavity="bore" data-connector="SC/APC" data-media="fiber" data-role="optical-output" transform="translate(8.21,103.5) rotate(90 4.195 4.5)">
      <title>bp-f2--output</title>
      <path id="bp-f2--output--bore" fill="#15181b" d="     M 0.89 0 H 8.39 V 9 H 0.89 V 5.55 H 0 V 3.45 H 0.89 Z" data-path="bp-f2/output/bore" data-class="cutout" />
      <rect id="bp-f2--output--hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
