      <rect x="1.0" y="81.65" width="17.6" height="10.3" rx="0.4" fill="#2fa84f" stroke="#1d7a36" stroke-width="0.3" />
      <rect x="7.9" y="82.40" width="9.0" height="8.8" rx="0.3" fill="#f2d41c" stroke="#8a7a10" stroke-width="0.2" />
    </g>
    <g id="bp-f2--adapter-2" data-path="bp-f2/adapter-2" data-class="port">
      <rect x="1.0" y="102.85" width="17.6" height="10.3" rx="0.4" fill="#2fa84f" stroke="#1d7a36" stroke-width="0.3" />
      <rect x="7.9" y="103.60" width="9.0" height="8.8" rx="0.3" fill="#f2d41c" stroke="#8a7a10" stroke-width="0.2" />
    </g>
    <g id="bp-f2--screw-bottom" data-path="bp-f2/screw-bottom" data-class="fastener">
