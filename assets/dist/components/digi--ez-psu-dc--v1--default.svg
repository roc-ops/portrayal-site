      <circle cx="54.6" cy="4.0" r="1.3" />
      <circle cx="54.6" cy="37.5" r="1.3" />
    </g>
    <path id="ez-psu-dc--dc-terminal" fill-rule="evenodd" fill="#4fb548" stroke="#2f7a2a" stroke-width="0.3" d="M 57.5 16.45 H 69.66 V 25.05 H 57.5 Z M 59.10 18.085 h 3.88 v 5.26 h -3.88 Z M 64.18 18.085 h 3.88 v 5.26 h -3.88 Z" data-path="ez-psu-dc/dc-terminal" data-class="connector" data-z-out="2.5" data-z-color="#4fb548" data-z-shape="1" />
    <rect id="ez-psu-dc--dc-terminal-cell-1" x="59.10" y="18.085" width="3.88" height="5.26" rx="0.3" fill="#2f6e2a" data-z-out="0.8" data-z-color="#2f6e2a" />
    <rect id="ez-psu-dc--dc-terminal-pin-1" x="60.59" y="20.30" width="0.90" height="0.90" fill="#c9cdd2" data-z-out="1.6" data-z-color="#c9cdd2" />
    <rect id="ez-psu-dc--dc-terminal-cell-2" x="64.18" y="18.085" width="3.88" height="5.26" rx="0.3" fill="#2f6e2a" data-z-out="0.8" data-z-color="#2f6e2a" />
    <rect id="ez-psu-dc--dc-terminal-pin-2" x="65.67" y="20.30" width="0.90" height="0.90" fill="#c9cdd2" data-z-out="1.6" data-z-color="#c9cdd2" />
    <g id="ez-psu-dc--thumbscrew" data-path="ez-psu-dc/thumbscrew" data-class="fastener" data-z-cyl="6.2">
      <circle cx="91.5" cy="16.5" r="5.4" fill="#2b2f33" stroke="#0d0f11" stroke-width="0.3" />
      <circle cx="91.5" cy="16.5" r="3.4" fill="#aeb3b9" stroke="#6e7378" stroke-width="0.25" />
      <path d="M 89.6 14.6 L 93.4 18.4 M 93.4 14.6 L 89.6 18.4" stroke="#4a4f55" stroke-width="0.5" />
    </g>
    <g data-cp="power" data-cp-at="63.6 20.75" data-cp-dir="front" />
  </g>
</svg>
