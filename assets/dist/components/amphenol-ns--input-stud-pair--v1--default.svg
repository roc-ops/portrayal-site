<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="29.0mm" height="41.0mm" viewBox="0 0 29.0 41.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="input-stud-pair" data-path="input-stud-pair" data-class="inlet" data-ref="amphenol-ns/input-stud-pair@1:1.0.0" data-wall="#0c0d0e" data-lug-holes="2" data-stud-centres-mm="25.4" data-stud-thread="3/8-16" transform="translate(0,0)">
    <title>input-stud-pair</title>
    <rect id="input-stud-pair--well" x="0" y="0" width="29" height="41" rx="0.6" fill="#15171a" stroke="#050606" stroke-width="0.25" />
    <circle id="input-stud-pair--washer-top" cx="14.5" cy="9.0" r="9.0" fill="#c9cdd1" stroke="#70757a" stroke-width="0.3" data-z-out="2.0" data-z-color="#b9bdc1" data-z-shape="1" />
    <path id="input-stud-pair--nut-top" d="M 14.5 2.5999999999999996 l 5.54 3.2 v 6.4 l -5.54 3.2 l -5.54 -3.2 v -6.4 z" fill="#e3e6e8" stroke="#6a6f74" stroke-width="0.3" data-z-out="10.0" data-z-color="#d0d3d6" data-z-shape="1" />
    <circle id="input-stud-pair--stud-top" cx="14.5" cy="9.0" r="3.6" fill="#b4b9be" stroke="#5f6468" stroke-width="0.3" data-path="input-stud-pair/stud-top" data-class="inlet" data-z-cyl="24.0" data-z-color="#a4a9ae" data-z-thread="1.59" />
    <circle id="input-stud-pair--washer-bottom" cx="14.5" cy="32.0" r="9.0" fill="#c9cdd1" stroke="#70757a" stroke-width="0.3" data-z-out="2.0" data-z-color="#b9bdc1" data-z-shape="1" />
    <path id="input-stud-pair--nut-bottom" d="M 14.5 25.6 l 5.54 3.2 v 6.4 l -5.54 3.2 l -5.54 -3.2 v -6.4 z" fill="#e3e6e8" stroke="#6a6f74" stroke-width="0.3" data-z-out="10.0" data-z-color="#d0d3d6" data-z-shape="1" />
    <circle id="input-stud-pair--stud-bottom" cx="14.5" cy="32.0" r="3.6" fill="#b4b9be" stroke="#5f6468" stroke-width="0.3" data-path="input-stud-pair/stud-bottom" data-class="inlet" data-z-cyl="24.0" data-z-color="#a4a9ae" data-z-thread="1.59" />
  </g>
</svg>
