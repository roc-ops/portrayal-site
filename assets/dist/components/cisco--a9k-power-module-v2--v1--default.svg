    <rect id="a9k-power-module-v2--handle" x="46.84" y="6.11" width="8.65" height="30.24" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" data-z-uhandle="8.0" />
    <circle id="a9k-power-module-v2--input" cx="4.0" cy="9.31" r="1.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-power-module-v2/input" data-class="led" data-states="off on blinking" data-description="Input LED. ON continuously when the input voltage is present and within the correct range; BLINKING when the input voltage is out of acceptable range; OFF when no input voltage is present. Cisco states no colour for it." data-z-dome="0.3" />
    <circle id="a9k-power-module-v2--output" cx="4.0" cy="15.92" r="1.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-power-module-v2/output" data-class="led" data-states="off on blinking" data-description="Output LED. ON when the power module output voltage is present; BLINKING when the power module is in a power limit or overcurrent condition. Cisco states no colour for it." data-z-dome="0.3" />
    <circle id="a9k-power-module-v2--fault" cx="4.0" cy="22.53" r="1.3" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-power-module-v2/fault" data-class="led" data-states="off on" data-description="Fault LED. ON indicates that a power supply failure has occurred. Cisco states no colour for it, and gives no off-state sentence." data-z-dome="0.3" />
    <g id="a9k-power-module-v2--silkscreen">
