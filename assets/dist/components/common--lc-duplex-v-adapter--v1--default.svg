    <rect id="lc-duplex-v-adapter--port-tx" x="2.29" y="0.35" width="4.7" height="6.3" rx="0.2" fill="#1c1f22" />
    <rect id="lc-duplex-v-adapter--port-rx" x="2.29" y="7.10" width="4.7" height="6.3" rx="0.2" fill="#1c1f22" />
