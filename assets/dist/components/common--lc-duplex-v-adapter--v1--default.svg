      <rect id="lc-duplex-v-adapter--tx--key-neck" x="0.62" y="4.70" width="3.46" height="0.42" fill="#15181b" data-z-top="3.6" />
      <rect id="lc-duplex-v-adapter--tx--key-shoulder" x="0" y="5.12" width="4.7" height="0.49" fill="#15181b" data-z-top="2.9" />
      <rect id="lc-duplex-v-adapter--tx--key-tongue" x="1.03" y="5.61" width="2.64" height="0.69" fill="#15181b" data-z-top="2.2" />
      <circle id="lc-duplex-v-adapter--tx--sleeve" cx="2.35" cy="2.35" r="1.2" fill="#22262a" stroke="#3a4046" stroke-width="0.12" />
      <circle id="lc-duplex-v-adapter--tx--ferrule" cx="2.35" cy="2.35" r="0.625" fill="#e8ecef" data-z-top="3.6" data-z-color="#e8ecef" />
