    <g id="lc-duplex-v-adapter--rx" data-path="lc-duplex-v-adapter/rx" data-class="port" data-ref="std/lc-bore@3:3.0.0" data-depth="4.5" data-wall="#4a4f55" data-cavity="bore" data-connector="lc" data-media="fiber" transform="translate(2.29,7.1)">
      <title>lc-duplex-v-adapter--rx</title>
