      <rect x="45.2" y="27.6" width="4.6" height="4.2" rx="0.5" />
    </g>
    <rect id="csr440-psu-ac--handle" x="30.5" y="12.0" width="6.0" height="16.0" rx="3.0" fill="none" stroke="#2b2f33" stroke-width="1.5" data-path="csr440-psu-ac/handle" data-class="handle" data-z-uhandle="27.0" data-z-color="#2b2f33" />
    <rect id="csr440-psu-ac--latch" x="4.5" y="1.6" width="10.5" height="4.6" rx="0.8" fill="#7f1d4b" stroke="#4a122c" stroke-width="0.3" data-path="csr440-psu-ac/latch" data-class="latch" data-z-out="2.5" data-z-color="#7f1d4b" />
    <g id="csr440-psu-ac--inlet" data-path="csr440-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(2.6,4.7) rotate(270 14.0 10.0)">
      <title>csr440-psu-ac--inlet</title>
      <rect id="csr440-psu-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="csr440-psu-ac/inlet/opening" data-class="cutout" />
      <path id="csr440-psu-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="csr440-psu-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="csr440-psu-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
