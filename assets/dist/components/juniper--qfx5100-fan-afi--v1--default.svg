<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="41.5mm" height="41.3mm" viewBox="0 0 41.5 41.3">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qfx5100-fan-afi" data-path="qfx5100-fan-afi" data-class="fan" data-behaviour="fills" data-ref="juniper/qfx5100-fan-afi@1:1.0.0" data-airflow="back-to-front" data-model="QFX5100-FAN-AFI" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>qfx5100-fan-afi</title>
    <defs>
      <pattern id="qfx5100-fan-afi--hex" width="2.4" height="4.16" patternUnits="userSpaceOnUse">
        <polygon points="1.2,0 2.05,0.5 2.05,1.5 1.2,2 0.35,1.5 0.35,0.5" fill="#0d0f11" />
        <polygon points="0,2.08 0.85,2.58 0.85,3.58 0,4.08 -0.85,3.58 -0.85,2.58" fill="#0d0f11" />
        <polygon points="2.4,2.08 3.25,2.58 3.25,3.58 2.4,4.08 1.55,3.58 1.55,2.58" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="qfx5100-fan-afi--face" x="0.2" y="0.2" width="41.1" height="40.9" rx="2.6" fill="#6ab3da" stroke="#3f86ad" stroke-width="0.4" />
    <g id="qfx5100-fan-afi--grille-top">
      <rect x="5.9" y="4.2" width="29.7" height="10.4" rx="1.6" fill="#1b1e21" />
      <rect x="5.9" y="4.2" width="29.7" height="10.4" rx="1.6" fill="url(#qfx5100-fan-afi--hex)" />
    </g>
    <g id="qfx5100-fan-afi--grille-bottom">
      <rect x="5.9" y="26.7" width="29.7" height="10.4" rx="1.6" fill="#1b1e21" />
      <rect x="5.9" y="26.7" width="29.7" height="10.4" rx="1.6" fill="url(#qfx5100-fan-afi--hex)" />
    </g>
    <g id="qfx5100-fan-afi--handle" data-path="qfx5100-fan-afi/handle" data-class="latch" data-z-out="2.0" data-z-color="#6ab3da">
      <rect x="1.3" y="13.2" width="38.9" height="14.9" rx="3.2" fill="#6ab3da" stroke="#3f86ad" stroke-width="0.4" />
      <rect x="3.3" y="15.0" width="34.9" height="11.3" rx="2.6" fill="#59a2c9" />
      <rect id="qfx5100-fan-afi--airin-chip" x="13.7" y="17.4" width="14.1" height="6.6" rx="0.8" fill="#4a5562" />
      <g fill="#2f7fd0">
        <circle cx="16.1" cy="20.7" r="0.45" />
        <ellipse cx="16.1" cy="19.5" rx="0.65" ry="1.0" />
        <ellipse cx="16.1" cy="19.5" rx="0.65" ry="1.0" transform="rotate(120 16.1 20.7)" />
        <ellipse cx="16.1" cy="19.5" rx="0.65" ry="1.0" transform="rotate(240 16.1 20.7)" />
      </g>
      <g id="qfx5100-fan-afi--silkscreen" font-family="sans-serif" fill="#e8eaec" text-anchor="middle">
        <text x="20.4" y="19.7" font-size="1.9">AIR</text>
        <text x="24.0" y="19.7" font-size="1.9">IN</text>
        <text x="23.2" y="22.7" font-size="1.9">(AFI)</text>
      </g>
    </g>
  </g>
</svg>
