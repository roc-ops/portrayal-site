    <rect id="psu-302-dc--input-led" x="4.7" y="3.9" width="2.6" height="2.6" rx="1.3" fill="var(--led-color, #3a3f44)" data-path="psu-302-dc/input-led" data-class="led" data-states="off in-range" data-description="S9321-64E HIG PSU FRU LED table, Input LED - Green (input within range), Off (input out of range, or firmware upgrading)" data-z-dome="0.4" />
    <rect id="psu-302-dc--output-led" x="4.7" y="11.4" width="2.6" height="2.6" rx="1.3" fill="var(--led-color, #3a3f44)" data-path="psu-302-dc/output-led" data-class="led" data-states="off ok standby over-temp fault" data-description="S9321-64E HIG PSU FRU LED table, Output LED - Solid Green (12.3V main output OK), Blinking Green (12.3V main output in standby mode), Off (12.3V main output off due to input out of range), Blinking Amber (over temp warning, or fan error), Solid Amber (12.3V main output or 12VSB out of range; OTP, OVP, UVP, OCP)" data-z-dome="0.4" />
