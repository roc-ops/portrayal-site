<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.0mm" viewBox="0 0 50.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-132-ac@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-132-ac@'] .state-input-lost { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-132-ac@'] .state-input-lost { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-132-ac@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-132-ac@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-132-ac@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-132-ac@'] .state-warning { --led-color: #22c55e; --led-color-alt: #ef4444; }
    g[data-ref^='ufispace/psu-132-ac@'] .state-warning { animation: portrayal-alternate 1s linear infinite; }</style>
  <g id="psu-132-ac" data-path="psu-132-ac" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-132-ac@1:1.0.0" data-input="ac" data-model="PSU-132-AISB1" data-power-output-w="1300" transform="translate(0,0)">
    <title>psu-132-ac</title>
    <defs>
      <pattern id="psu-132-ac--sqvent" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
        <rect x="0.4" y="0.4" width="2.2" height="2.2" fill="#17191c" />
      </pattern>
    </defs>
    <rect id="psu-132-ac--body" x="0" y="0" width="50.5" height="40" rx="0.6" fill="#a4aab1" stroke="#6a7076" stroke-width="0.4" />
    <rect id="psu-132-ac--top-slot-1" x="21.5" y="2.2" width="5.4" height="2.6" rx="0.4" fill="#17191c" />
    <circle id="psu-132-ac--top-screw" cx="31.2" cy="3.5" r="1.9" fill="#33373c" stroke="#17191c" stroke-width="0.3" />
    <rect id="psu-132-ac--top-slot-2" x="35.2" y="2.2" width="5.4" height="2.6" rx="0.4" fill="#17191c" />
    <rect id="psu-132-ac--top-slot-3" x="43.0" y="2.2" width="4.4" height="2.6" rx="0.4" fill="#17191c" />
    <rect id="psu-132-ac--vent-field" x="5.6" y="16.5" width="12.6" height="21.0" fill="url(#psu-132-ac--sqvent)" data-z-vent="30" />
    <rect id="psu-132-ac--latch" x="0.6" y="3.5" width="4.2" height="14.5" rx="0.8" fill="#c22f2f" stroke="#8c2323" stroke-width="0.3" data-path="psu-132-ac/latch" data-class="latch" data-z-out="2.2" />
    <path id="psu-132-ac--handle" d="M 19.4 3.6 a 1.6 1.6 0 0 0 -1.6 1.6 L 17.8 34.8 a 1.6 1.6 0 0 0 1.6 1.6" fill="none" stroke="#17191c" stroke-width="2.4" stroke-linecap="round" data-path="psu-132-ac/handle" data-class="handle" data-z-uhandle="38" />
    <g id="psu-132-ac--inlet-recess" data-z-out="1.8">
      <rect x="19.6" y="7.2" width="28.6" height="31.4" rx="0.8" fill="#4a4f55" stroke="#33373c" stroke-width="0.3" />
      <rect x="42.6" y="9.0" width="3.6" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="42.6" y="13.4" width="3.6" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="42.6" y="17.8" width="3.6" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="42.6" y="22.2" width="3.6" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="42.6" y="26.6" width="3.6" height="2.6" rx="0.3" fill="#17191c" />
      <rect x="42.6" y="31.0" width="3.6" height="2.6" rx="0.3" fill="#17191c" />
    </g>
    <circle id="psu-132-ac--status-led" cx="10.2" cy="5.8" r="1.5" fill="var(--led-color, #3a3f44)" data-path="psu-132-ac/status-led" data-class="led" data-states="off ok standby fail input-lost warning" data-description="HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output on and OK), Blinking Green (standby state / only +5VSB on, or firmware updating), Red (critical event causing shutdown - failure, over current, short circuit, over voltage, fan failure, over temperature), Blinking Red (input power cord unplugged or input lost with a second supply still powered), Blinking between Green and Red (warning event, supply continues to operate - high temp, high power, high current, slow fan)" data-z-dome="0.4" />
    <g id="psu-132-ac--inlet" data-path="psu-132-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(20.5,10.0)">
      <title>psu-132-ac--inlet</title>
      <rect id="psu-132-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-132-ac/inlet/opening" data-class="cutout" />
      <path id="psu-132-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-132-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-132-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-132-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="34.5 20" data-cp-dir="front" />
  </g>
</svg>
