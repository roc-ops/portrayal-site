<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.7mm" height="39.5mm" viewBox="0 0 73.7 39.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5240-pwr-ac-ao@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5240-pwr-ac-ao@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5240-pwr-ac-ao" data-path="qfx5240-pwr-ac-ao" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5240-pwr-ac-ao@1:1.0.0" data-airflow="front-to-back" data-input="200 to 240 VAC, 50 to 60 Hz (guide Table 4); the guide's Table 13 gives an operating range of 200 to 277 VAC and the datasheet 180 to 264 VAC" data-model="QFX5240-PWR-AC-AO" data-power-output-w="3000" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5240-pwr-ac-ao</title>
    <rect id="qfx5240-pwr-ac-ao--face" x="0" y="0" width="73.7" height="39.5" rx="0.8" fill="#a9adb3" stroke="#6b6f75" stroke-width="0.4" />
    <rect id="qfx5240-pwr-ac-ao--guard" x="0.4" y="0.6" width="40.1" height="38.3" rx="1.2" fill="#202226" stroke="#15161a" stroke-width="0.4" />
    <g fill="none" stroke="#9a9ea5" stroke-width="0.9">
      <path d="M 8.5 4.0 H 32.5 L 37.4 8.8 V 28.4 L 32.5 33.2 H 8.5 L 3.6 28.4 V 8.8 Z" />
      <path d="M 20.5 3.4 V 12.0 M 20.5 25.2 V 33.2 M 3.6 18.6 H 10.5 M 30.5 18.6 H 37.4" stroke-width="1.1" />
    </g>
    <circle id="qfx5240-pwr-ac-ao--hub" cx="20.2" cy="18.9" r="10.2" fill="#b8bbc0" stroke="#7b7f86" stroke-width="0.4" />
    <g fill="#c9ccd1" stroke="#6b6f75" stroke-width="0.3">
      <circle cx="4.8" cy="2.9" r="2.2" />
      <circle cx="36.6" cy="2.9" r="2.2" />
    </g>
    <rect id="qfx5240-pwr-ac-ao--inlet-bay" x="42.0" y="1.5" width="24.4" height="32.4" rx="1.4" fill="#0e0f11" stroke="#2b2e32" stroke-width="0.3" />
    <g id="qfx5240-pwr-ac-ao--silkscreen">
      <text x="20.2" y="19.6" font-family="sans-serif" font-size="3.3" font-style="italic" font-weight="bold" fill="#5b6066" text-anchor="middle">3000W</text>
    </g>
    <circle id="qfx5240-pwr-ac-ao--led-pwr" cx="69.1" cy="35.2" r="1.4" fill="var(--led-color, #8a8d93)" stroke="#6b6f75" stroke-width="0.3" data-path="qfx5240-pwr-ac-ao/led-pwr" data-class="led" data-states="green amber off" />
    <g id="qfx5240-pwr-ac-ao--release-latch" data-path="qfx5240-pwr-ac-ao/release-latch" data-class="latch">
      <rect x="66.5" y="11.1" width="6.8" height="17.8" rx="1.2" fill="#202225" stroke="#0e0f11" stroke-width="0.35" />
    </g>
    <g id="qfx5240-pwr-ac-ao--latch" data-path="qfx5240-pwr-ac-ao/latch" data-class="latch" data-z-out="1.6" data-z-color="#1a1b1e">
      <rect x="0" y="29.5" width="40.5" height="10.0" rx="1.4" fill="#1a1b1e" stroke="#0e0f11" stroke-width="0.4" />
    </g>
    <g id="qfx5240-pwr-ac-ao--inlet" data-path="qfx5240-pwr-ac-ao/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(38.0,5.5) rotate(90 16.2 12.2)">
      <title>qfx5240-pwr-ac-ao--inlet</title>
      <rect id="qfx5240-pwr-ac-ao--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="qfx5240-pwr-ac-ao/inlet/opening" data-class="cutout" />
      <rect id="qfx5240-pwr-ac-ao--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="qfx5240-pwr-ac-ao--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="qfx5240-pwr-ac-ao--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="qfx5240-pwr-ac-ao--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
