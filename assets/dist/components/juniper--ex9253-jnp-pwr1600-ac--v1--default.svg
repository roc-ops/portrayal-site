<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86.7mm" height="39.6mm" viewBox="0 0 86.7 39.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex9253-jnp-pwr1600-ac@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="ex9253-jnp-pwr1600-ac" data-path="ex9253-jnp-pwr1600-ac" data-class="psu" data-behaviour="fills" data-ref="juniper/ex9253-jnp-pwr1600-ac@1:1.0.0" data-airflow="front-to-back" data-input="90 to 140 VAC (800 W) or 180 to 264 VAC (1600 W), 50 to 60 Hz; 10 A at 100 to 240 VAC (guide Table 10)" data-power-output-low-line-w="800" data-power-output-w="1600" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex9253-jnp-pwr1600-ac</title>
    <rect id="ex9253-jnp-pwr1600-ac--face" x="0.2" y="0.2" width="86.3" height="39.2" rx="1.0" fill="#2b2e32" stroke="#14161a" stroke-width="0.4" />
    <rect x="31.0" y="2.2" width="8.4" height="35.2" rx="0.8" fill="#34383d" />
    <circle cx="34.5" cy="19.0" r="1.9" fill="#1a1d20" stroke="#4a4e54" stroke-width="0.3" />
    <path d="M 33.6 19.0 H 35.4 M 34.5 18.1 V 19.9" stroke="#8a9096" stroke-width="0.3" />
    <g id="ex9253-jnp-pwr1600-ac--fan">
      <rect x="42.5" y="2.4" width="36.0" height="34.8" rx="2.0" fill="#1a1d20" stroke="#3a3e43" stroke-width="0.3" />
      <circle cx="60.5" cy="19.8" r="15.6" fill="#101214" stroke="#3a3e43" stroke-width="0.4" />
      <circle cx="60.5" cy="19.8" r="11.2" fill="none" stroke="#2f3338" stroke-width="0.9" />
      <circle cx="60.5" cy="19.8" r="6.2" fill="#1c1f22" stroke="#3a3e43" stroke-width="0.4" />
      <circle cx="46.2" cy="5.6" r="1.6" fill="#3a3e43" />
      <circle cx="74.8" cy="5.6" r="1.6" fill="#3a3e43" />
      <circle cx="74.8" cy="34.0" r="1.6" fill="#3a3e43" />
      <circle cx="46.2" cy="34.0" r="1.6" fill="#3a3e43" />
    </g>
    <circle id="ex9253-jnp-pwr1600-ac--led-status" cx="34.5" cy="8.7" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex9253-jnp-pwr1600-ac/led-status" data-class="led" data-states="ok off" />
    <rect id="ex9253-jnp-pwr1600-ac--tab" x="4.4" y="11.4" width="4.6" height="12.4" rx="0.8" fill="#9aa0a6" stroke="#5d6167" stroke-width="0.3" data-path="ex9253-jnp-pwr1600-ac/tab" data-class="latch" data-z-out="1.6" />
    <g id="ex9253-jnp-pwr1600-ac--handle" data-path="ex9253-jnp-pwr1600-ac/handle" data-class="latch" data-z-out="2.0">
      <path d="M 48.2 33.6 L 73.8 5.8" stroke="#4a4e54" stroke-width="3.6" stroke-linecap="round" />
      <path d="M 48.2 33.6 L 73.8 5.8" stroke="#6a6f76" stroke-width="1.0" stroke-linecap="round" />
      <circle cx="48.2" cy="33.6" r="1.5" fill="#1a1d20" />
      <circle cx="73.8" cy="5.8" r="1.5" fill="#1a1d20" />
    </g>
    <g id="ex9253-jnp-pwr1600-ac--inlet" data-path="ex9253-jnp-pwr1600-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(8.2,5.8) rotate(90 14.0 10.0)">
      <title>ex9253-jnp-pwr1600-ac--inlet</title>
      <rect id="ex9253-jnp-pwr1600-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="ex9253-jnp-pwr1600-ac/inlet/opening" data-class="cutout" />
      <path id="ex9253-jnp-pwr1600-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="ex9253-jnp-pwr1600-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex9253-jnp-pwr1600-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="ex9253-jnp-pwr1600-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
