        <polygon points="9.122,3.95 6.986,0.25 2.714,0.25 0.578,3.95 2.714,7.65 6.986,7.65" fill="#d7dade" stroke="#7d8388" stroke-width="0.16" />
      </g>
      <g id="bp-a5--rf-out--thread" data-z-cyl="10.6" data-z-lift="2.4" data-z-color="#c0c4c8" data-z-thread="0.794">
