      <title>bp-a5--optical-in-bore</title>
      <path id="bp-a5--optical-in-bore--bore" fill="#15181b" d="     M 0.89 0 H 8.39 V 9 H 0.89 V 5.55 H 0 V 3.45 H 0.89 Z" data-path="bp-a5/optical-in-bore/bore" data-class="cutout" />
      <rect id="bp-a5--optical-in-bore--hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b" data-z-top="5.2" />
