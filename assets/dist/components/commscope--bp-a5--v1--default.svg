      <circle id="bp-a5--optical-in-bore--sleeve" cx="4.64" cy="4.5" r="1.65" fill="#1e2226" />
      <circle id="bp-a5--optical-in-bore--ferrule" cx="4.64" cy="4.5" r="1.25" fill="#e8ecef" data-z-top="4.8" data-z-color="#e8ecef" />
