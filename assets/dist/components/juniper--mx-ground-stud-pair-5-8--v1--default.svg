<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="22.875mm" height="7mm" viewBox="0 0 22.875 7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mx-ground-stud-pair-5-8" data-path="mx-ground-stud-pair-5-8" data-class="ground" data-behaviour="mounts" data-ref="juniper/mx-ground-stud-pair-5-8@1:1.0.0" data-connector="stud-pair-5-8" transform="translate(0,0)">
    <title>mx-ground-stud-pair-5-8</title>
    <g id="mx-ground-stud-pair-5-8--pair" />
    <g id="mx-ground-stud-pair-5-8--1" data-path="mx-ground-stud-pair-5-8/1" data-class="ground" data-behaviour="mounts" data-ref="juniper/mx-ground-stud@1:1.0.1" data-wall="#4a4f55" data-model="MX earthing stud" transform="translate(0,0)">
      <title>mx-ground-stud-pair-5-8--1</title>
      <circle id="mx-ground-stud-pair-5-8--1--washer" cx="3.5" cy="3.5" r="3.4" fill="#aeb3b9" stroke="#7d8288" stroke-width="0.3" />
      <g id="mx-ground-stud-pair-5-8--1--stud" data-z-cyl="5.0" data-z-lift="3.0" data-z-thread="0.8">
        <circle cx="3.5" cy="3.5" r="2.4" fill="#8a8f95" stroke="#565b60" stroke-width="0.3" />
        <circle cx="3.5" cy="3.5" r="1.1" fill="#6d7278" />
      </g>
      <g data-cp="mate" data-cp-at="3.5 3.5" data-cp-dir="front" data-cp-on="mx-ground-stud-pair-5-8--1--stud" />
    </g>
    <g id="mx-ground-stud-pair-5-8--2" data-path="mx-ground-stud-pair-5-8/2" data-class="ground" data-behaviour="mounts" data-ref="juniper/mx-ground-stud@1:1.0.1" data-wall="#4a4f55" data-model="MX earthing stud" transform="translate(15.875,0)">
      <title>mx-ground-stud-pair-5-8--2</title>
      <circle id="mx-ground-stud-pair-5-8--2--washer" cx="3.5" cy="3.5" r="3.4" fill="#aeb3b9" stroke="#7d8288" stroke-width="0.3" />
      <g id="mx-ground-stud-pair-5-8--2--stud" data-z-cyl="5.0" data-z-lift="3.0" data-z-thread="0.8">
        <circle cx="3.5" cy="3.5" r="2.4" fill="#8a8f95" stroke="#565b60" stroke-width="0.3" />
        <circle cx="3.5" cy="3.5" r="1.1" fill="#6d7278" />
      </g>
      <g data-cp="mate" data-cp-at="3.5 3.5" data-cp-dir="front" data-cp-on="mx-ground-stud-pair-5-8--2--stud" />
    </g>
    <g data-cp="mate" data-cp-at="11.4375 3.5" data-cp-dir="front" />
  </g>
</svg>
