      <circle id="qfx3500-mb-sfp-afo--led-status" cx="93.55" cy="13.2" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx3500-mb-sfp-afo/led-status" data-class="led" data-states="green beacon error off" />
      <circle id="qfx3500-mb-sfp-afo--led-fan" cx="93.55" cy="17.9" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx3500-mb-sfp-afo/led-fan" data-class="led" data-states="green amber off" />
