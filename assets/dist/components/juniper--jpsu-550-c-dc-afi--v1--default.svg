<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="83.06mm" height="40.39mm" viewBox="0 0 83.06 40.39">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/jpsu-550-c-dc-afi@'] .state-blinking-green { --led-color: #39b54a; }
    g[data-ref^='juniper/jpsu-550-c-dc-afi@'] .state-blinking-green { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/jpsu-550-c-dc-afi@'] .state-green { --led-color: #39b54a; }</style>
  <g id="jpsu-550-c-dc-afi" data-path="jpsu-550-c-dc-afi" data-class="psu" data-behaviour="fills" data-ref="juniper/jpsu-550-c-dc-afi@1:1.0.0" data-body-depth="225.55" data-airflow="back-to-front" data-hot-swap="yes" data-inlet="other" data-input-connector="D-sub 3W3 - -48 VDC input (-), return (+) and ground" data-input-current="13 A" data-input-voltage="-48 VDC to -60 VDC rated operating voltage" data-power-output-w="550" data-role="dc-power-supply" data-weight-kg="0.75" data-states="ok fault absent" transform="translate(0,0)">
    <title>jpsu-550-c-dc-afi</title>
    <rect id="jpsu-550-c-dc-afi--face" x="0" y="0" width="83.06" height="40.39" rx="0.8" fill="#c6c7c9" stroke="#8f9093" stroke-width="0.4" />
    <g id="jpsu-550-c-dc-afi--fan">
      <rect x="2.0" y="2.0" width="41.0" height="36.4" rx="1.2" fill="#b3b4b6" />
      <circle cx="22.5" cy="20.7" r="17.2" fill="#0f1011" />
      <circle cx="22.5" cy="20.7" r="13.6" fill="none" stroke="#a6a7a9" stroke-width="1.2" />
      <circle cx="22.5" cy="20.7" r="9.6" fill="#bdbebf" stroke="#9c9da0" stroke-width="0.5" />
      <path d="M 22.5 3.8 L 22.5 11.0 M 22.5 30.4 L 22.5 37.6 M 5.6 20.7 L 12.8 20.7 M 32.2 20.7 L 39.4 20.7" stroke="#a6a7a9" stroke-width="1.0" fill="none" />
    </g>
    <g id="jpsu-550-c-dc-afi--screws" fill="#d2d3d5" stroke="#8d8e90" stroke-width="0.3">
      <circle cx="5.4" cy="4.2" r="1.9" />
      <circle cx="37.8" cy="4.2" r="1.9" />
      <circle cx="5.4" cy="37.3" r="1.9" />
      <circle cx="37.8" cy="37.3" r="1.9" />
    </g>
    <g id="jpsu-550-c-dc-afi--handle" data-path="jpsu-550-c-dc-afi/handle" data-class="handle" data-z-out="6.0" data-z-color="#2a8bd8">
      <rect x="0.3" y="17.9" width="43.3" height="5.4" rx="0.5" fill="#2a8bd8" stroke="#1c6aa8" stroke-width="0.3" />
      <polygon points="0.3,15.4 3.4,17.9 3.4,23.3 0.3,25.8" fill="#2a8bd8" stroke="#1c6aa8" stroke-width="0.3" />
      <polygon points="43.6,15.4 40.5,17.9 40.5,23.3 43.6,25.8" fill="#2a8bd8" stroke="#1c6aa8" stroke-width="0.3" />
    </g>
    <g id="jpsu-550-c-dc-afi--dc-input" data-path="jpsu-550-c-dc-afi/dc-input" data-class="inlet">
      <polygon points="62.2,2.2 65.6,2.2 67.3,5.0 65.6,7.0 62.2,7.0 60.5,5.0" fill="#cfd0d2" stroke="#9a9b9d" stroke-width="0.3" />
      <polygon points="62.2,32.6 65.6,32.6 67.3,35.4 65.6,38.2 62.2,38.2 60.5,35.4" fill="#cfd0d2" stroke="#9a9b9d" stroke-width="0.3" />
      <path d="M 59.8 7.1 H 68.1 Q 69.0 7.1 69.0 8.0 V 31.5 Q 69.0 32.4 68.1 32.4 H 59.8 Q 58.9 32.4 58.9 31.5 V 8.0 Q 58.9 7.1 59.8 7.1 Z" fill="#17181a" stroke="#b9babc" stroke-width="0.5" />
      <circle cx="63.9" cy="12.8" r="1.6" fill="#d9b13a" />
      <circle cx="63.9" cy="19.6" r="2.3" fill="#d9b13a" />
      <circle cx="63.9" cy="19.6" r="1.4" fill="#2a2415" />
      <circle cx="63.9" cy="26.2" r="1.6" fill="#d9b13a" />
    </g>
    <g id="jpsu-550-c-dc-afi--silkscreen" font-family="Arial" font-size="1.3" fill="#3a3b3d">
      <text x="70.8" y="4.5" text-anchor="middle">DC</text>
      <text x="70.8" y="6.1" text-anchor="middle">OK</text>
    </g>
    <g id="jpsu-550-c-dc-afi--led" data-path="jpsu-550-c-dc-afi/led" data-class="led" data-states="green blinking-green off">
      <circle cx="76.1" cy="5.3" r="2.6" fill="#1b1c1e" />
      <circle cx="76.1" cy="5.3" r="1.2" fill="var(--led-color, #8c9094)" stroke="#5c5e60" stroke-width="0.25" />
    </g>
    <g id="jpsu-550-c-dc-afi--latch" data-path="jpsu-550-c-dc-afi/latch" data-class="latch" data-z-out="1.4" data-z-color="#2d2e30">
      <rect x="74.4" y="9.3" width="6.1" height="17.9" rx="2.0" fill="#2d2e30" stroke="#17181a" stroke-width="0.3" />
    </g>
    <g data-cp="power" data-cp-at="63.9 19.6" data-cp-dir="rear" />
  </g>
</svg>
