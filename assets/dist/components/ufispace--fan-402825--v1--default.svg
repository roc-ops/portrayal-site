<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="51.5mm" height="42.2mm" viewBox="0 0 51.5 42.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/fan-402825@'] .state-fault { --led-color: #eab308; }
    g[data-ref^='ufispace/fan-402825@'] .state-fault { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/fan-402825@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-402825" data-path="fan-402825" data-class="fan" data-behaviour="fills" data-ref="ufispace/fan-402825@1:1.1.0" data-airflow="exhaust" data-model="FAN-402825-HD" data-power-absent="not-published" transform="translate(0,0)">
    <title>fan-402825</title>
    <defs>
      <pattern id="fan-402825--hex" width="4.43" height="2.555" patternUnits="userSpaceOnUse">
        <path d="M 1.275 0 L 0.6375 1.104 L -0.6375 1.104 L -1.275 0 L -0.6375 -1.104 L 0.6375 -1.104 Z" fill="#0d0f11" />
        <path d="M 5.705 0 L 5.0675 1.104 L 3.7925 1.104 L 3.155 0 L 3.7925 -1.104 L 5.0675 -1.104 Z" fill="#0d0f11" />
        <path d="M 3.49 1.2775 L 2.8525 2.3815 L 1.5775 2.3815 L 0.94 1.2775 L 1.5775 0.1735 L 2.8525 0.1735 Z" fill="#0d0f11" />
        <path d="M 1.275 2.555 L 0.6375 3.659 L -0.6375 3.659 L -1.275 2.555 L -0.6375 1.451 L 0.6375 1.451 Z" fill="#0d0f11" />
        <path d="M 5.705 2.555 L 5.0675 3.659 L 3.7925 3.659 L 3.155 2.555 L 3.7925 1.451 L 5.0675 1.451 Z" fill="#0d0f11" />
      </pattern>
      <mask id="fan-402825--fanmask" maskUnits="userSpaceOnUse">
        <circle cx="28.5" cy="21.1" r="16.8" fill="white" />
        <rect x="9" y="1.5" width="41" height="39.2" fill="url(#fan-402825--hex)" />
      </mask>
    </defs>
    <rect id="fan-402825--body" x="0" y="0" width="51.5" height="42.2" rx="0.6" fill="#2b2f33" stroke="#1a1d20" stroke-width="0.4" />
    <circle id="fan-402825--rotor-behind" cx="28.5" cy="21.1" r="16.8" fill="#0b0d0f" data-z-vent="25" />
    <path id="fan-402825--rotor-grille" fill-rule="evenodd" fill="url(#fan-402825--hex)" d="M 9 1.5 h 41 v 39.2 h -41 z        M 28.5 4.3 a 16.8 16.8 0 1 0 0.001 0 z" data-z-vent="25" />
    <g id="fan-402825--rotor-bulge" data-z-dome="3.2">
      <circle cx="28.5" cy="21.1" r="16.8" fill="#17191c" mask="url(#fan-402825--fanmask)" />
      <circle id="fan-402825--rotor-hub" cx="28.5" cy="21.1" r="4.6" fill="#22262a" />
      <circle id="fan-402825--rotor-ring" cx="28.5" cy="21.1" r="16.8" fill="none" stroke="#4a4f55" stroke-width="0.4" />
    </g>
    <rect id="fan-402825--handle" x="2.6" y="6" width="3.4" height="30" rx="1.6" fill="#c22f2f" data-z-uhandle="25" />
    <g id="fan-402825--thumbscrew" data-z-cyl="5" data-z-knurl="1">
      <circle cx="48.1" cy="21.1" r="1.9" fill="#8a9099" stroke="#4a4f55" stroke-width="0.25" />
      <line x1="46.8" y1="21.1" x2="49.4" y2="21.1" stroke="#4a4f55" stroke-width="0.35" />
      <line x1="48.1" y1="19.8" x2="48.1" y2="22.4" stroke="#4a4f55" stroke-width="0.35" />
    </g>
    <circle id="fan-402825--status-led" cx="3.5" cy="3.1" r="1.5" fill="var(--led-color, #3a3f44)" data-path="fan-402825/status-led" data-class="led" data-states="off ok fault" data-description="HIG Fan FRU LED table - Off (main board 3.3V power fail, or fan not present), Solid Green (fan present and interrupt de-assert), Blinking Yellow (fan present but interrupt assert). The table's Blinking Green and Solid Yellow rows read N/A and are deliberately not modelled" data-z-dome="0.4" />
  </g>
</svg>
