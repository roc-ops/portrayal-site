<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="74.8mm" height="40.2mm" viewBox="0 0 74.8 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5230-jnp-2400w-dc-afi@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5230-jnp-2400w-dc-afi@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5230-jnp-2400w-dc-afi" data-path="qfx5230-jnp-2400w-dc-afi" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5230-jnp-2400w-dc-afi@1:1.0.0" data-airflow="back-to-front" data-inlet="dc-terminal" data-input="-40 to -72 VDC, rated -48 to -60 VDC, 60 A maximum (guide Tables 18 and 21); output 12 V at 200 A and 12 V standby at 1 A" data-model="JNP-2400W-DC-AFI" data-power-output-w="2400" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5230-jnp-2400w-dc-afi</title>
    <rect id="qfx5230-jnp-2400w-dc-afi--face" x="0" y="0" width="74.8" height="40.2" rx="0.8" fill="#b7bac0" stroke="#7b7f86" stroke-width="0.4" />
    <circle id="qfx5230-jnp-2400w-dc-afi--guard" cx="21.8" cy="20.1" r="18.9" fill="#15161a" stroke="#3b3d42" stroke-width="0.4" />
    <g fill="none" stroke="#c9ccd1" stroke-width="0.35">
      <circle cx="21.8" cy="20.1" r="15.6" />
      <circle cx="21.8" cy="20.1" r="12.0" />
      <circle cx="21.8" cy="20.1" r="8.2" />
      <path d="M 6.5 3.7 L 37.1 36.5 M 37.1 3.7 L 6.5 36.5" stroke-width="0.5" />
    </g>
    <g fill="#c9ccd1" stroke="#6b6f75" stroke-width="0.3">
      <circle cx="6.5" cy="3.7" r="2.6" />
      <circle cx="37.1" cy="3.7" r="2.6" />
      <circle cx="6.5" cy="36.5" r="2.6" />
      <circle cx="37.1" cy="36.5" r="2.6" />
    </g>
    <g id="qfx5230-jnp-2400w-dc-afi--terminal-cover">
      <rect x="42.2" y="3.7" width="24.4" height="32.4" rx="1.4" fill="#2a2c30" stroke="#15161a" stroke-width="0.4" />
      <g fill="#3a3d42">
        <rect x="45.0" y="6.4" width="2.4" height="27.0" rx="0.8" />
        <rect x="49.6" y="6.4" width="2.4" height="27.0" rx="0.8" />
        <rect x="54.2" y="6.4" width="2.4" height="27.0" rx="0.8" />
        <rect x="58.8" y="6.4" width="2.4" height="27.0" rx="0.8" />
      </g>
    </g>
    <circle id="qfx5230-jnp-2400w-dc-afi--led-pwr" cx="69.4" cy="32.6" r="1.4" fill="var(--led-color, #8a8d93)" stroke="#6b6f75" stroke-width="0.3" data-path="qfx5230-jnp-2400w-dc-afi/led-pwr" data-class="led" data-states="green amber off" />
    <g id="qfx5230-jnp-2400w-dc-afi--release-latch" data-path="qfx5230-jnp-2400w-dc-afi/release-latch" data-class="latch">
      <rect x="68.5" y="13.6" width="6.3" height="13.6" rx="1.2" fill="#202225" stroke="#0e0f11" stroke-width="0.35" />
      <rect x="66.6" y="15.4" width="2.2" height="10.0" fill="#0b0c0d" />
    </g>
    <g id="qfx5230-jnp-2400w-dc-afi--latch" data-path="qfx5230-jnp-2400w-dc-afi/latch" data-class="latch" data-z-out="1.6" data-z-color="#6ea301">
      <rect x="1.9" y="15.6" width="41.3" height="8.5" rx="0.8" fill="#6ea301" stroke="#4d7500" stroke-width="0.4" />
    </g>
  </g>
</svg>
