      <rect id="qsfp-drawing--body-front" x="34.8" y="0" width="17.20" height="8.5" rx="0.5" fill="#a9b0b7" stroke="#767d84" stroke-width="0.25" />
      <rect id="qsfp-drawing--body-rear" x="52.0" y="0.42" width="61.80" height="7.65" rx="0.4" fill="#a9b0b7" stroke="#767d84" stroke-width="0.25" />
      <rect id="qsfp-drawing--rail" x="40.8" y="3.25" width="47.60" height="2.0" rx="0.4" fill="#8d949c" />
      <rect id="qsfp-drawing--shoulder" x="88.4" y="0.4" width="0.9" height="7.7" fill="#8d949c" />
      <rect id="qsfp-drawing--d-shell" x="113.80" y="0.42" width="4.20" height="2.94" fill="#8d949c" stroke="#767d84" stroke-width="0.2" />
      <rect id="qsfp-drawing--d-pcb" x="113.80" y="5.01" width="2.35" height="1.24" fill="#c9b98a" stroke="#767d84" stroke-width="0.2" />
      <rect id="qsfp-drawing--d-guide" x="113.80" y="7.14" width="1.11" height="0.93" fill="#6f767d" stroke="#767d84" stroke-width="0.2" />
    </g>
  </g>
</svg>
