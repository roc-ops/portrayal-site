<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40.0mm" viewBox="0 0 73.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-242-ac@'] .state-critical { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-242-ac@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-242-ac@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-242-ac@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-242-ac@'] .state-warning { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-242-ac@'] .state-warning { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="psu-242-ac" data-path="psu-242-ac" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-242-ac@1:1.1.0" data-airflow="exhaust" data-input="ac" data-model="PSU-242-AECRN" data-power-output-w="2400" transform="translate(0,0)">
    <title>psu-242-ac</title>
    <rect id="psu-242-ac--body" x="0" y="0" width="73.5" height="40" rx="0.6" fill="#1c1f22" stroke="#0d0f11" stroke-width="0.4" />
    <g id="psu-242-ac--fan-frame">
      <rect x="0.4" y="0.2" width="40.4" height="39.2" rx="1.2" fill="#0b0d0f" stroke="#c9ced4" stroke-width="0.9" />
      <g stroke="#c9ced4" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M 5.6 5.2 L 15.4 14.6" />
        <path d="M 35.6 5.2 L 25.8 14.6" />
        <path d="M 5.6 34.4 L 15.4 25.0" />
        <path d="M 35.6 34.4 L 25.8 25.0" />
      </g>
      <g fill="#0b0d0f" stroke="#c9ced4" stroke-width="1.3">
        <circle cx="4.6" cy="4.4" r="2.4" />
        <circle cx="36.6" cy="4.4" r="2.4" />
        <circle cx="4.6" cy="35.2" r="2.4" />
        <circle cx="36.6" cy="35.2" r="2.4" />
      </g>
    </g>
    <g id="psu-242-ac--rotor-grille" data-z-vent="25">
      <circle cx="20.6" cy="19.8" r="14.2" fill="#17191c" stroke="#2b2f33" stroke-width="0.4" />
    </g>
    <rect id="psu-242-ac--edge-strip" x="66.0" y="0.6" width="7.0" height="38.8" rx="0.5" fill="#c9ced4" />
    <rect id="psu-242-ac--inlet-bracket" x="43.3" y="36.7" width="22.1" height="2.5" rx="0.4" fill="#c9ced4" />
    <g id="psu-242-ac--rotor-bulge" data-z-dome="3.0">
      <circle cx="20.6" cy="19.8" r="6.4" fill="#101315" stroke="#2b2f33" stroke-width="0.3" />
    </g>
    <rect id="psu-242-ac--handle" x="1.2" y="15.9" width="40.4" height="6.6" rx="0.5" fill="#17191c" stroke="#0b0d0f" stroke-width="0.3" data-path="psu-242-ac/handle" data-class="handle" data-z-out="3.5" />
    <rect id="psu-242-ac--latch" x="67.0" y="11.4" width="4.5" height="18.4" rx="1.2" fill="#c8102e" stroke="#8f0b21" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" data-path="psu-242-ac/latch" data-class="latch" data-z-out="1.2" />
    <circle id="psu-242-ac--status-led" cx="70.05" cy="33.45" r="1.45" fill="var(--led-color, #3a3f44)" stroke="#8d9297" stroke-width="0.2" data-path="psu-242-ac/status-led" data-class="led" data-states="off ok standby critical warning" data-description="HIG PSU FRU LED table - Off (no input power to all power supplies), Solid Green (output ON and OK), Blinking Green (input power present / only +12VSB on; the 2 Hz firmware-updating row is visually identical and shares this state), Solid Amber (input out of range with a second supply in parallel still fed, and separately a critical event causing shutdown - OTP, OVP, UVP, OCP; the table prints both under one appearance), Blinking Amber at 1 Hz (warning events where the supply keeps operating - high temp, high power, high current, slow fan)" data-z-dome="0.4" />
    <g id="psu-242-ac--inlet" data-path="psu-242-ac/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(38.6,7.4) rotate(270 16.2 12.2)">
      <title>psu-242-ac--inlet</title>
      <rect id="psu-242-ac--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="psu-242-ac/inlet/opening" data-class="cutout" />
      <rect id="psu-242-ac--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="psu-242-ac--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-242-ac--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-242-ac--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
