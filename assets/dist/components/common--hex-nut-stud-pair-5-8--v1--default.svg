      <path id="hex-nut-stud-pair-5-8--2--nut" d="M 3.6 0.6 l 2.598 1.5 v 3 l -2.598 1.5 l -2.598 -1.5 v -3 z" fill="#e3e6e8" stroke="#6a6f74" stroke-width="0.25" data-z-out="7.6" data-z-color="#d0d3d6" data-z-shape="1" />
      <circle id="hex-nut-stud-pair-5-8--2--stud" cx="3.6" cy="3.6" r="1.2" fill="#b4b9be" stroke="#5f6468" stroke-width="0.25" data-z-cyl="7.0" data-z-color="#a4a9ae" />
      <g data-cp="mate" data-cp-at="3.6 3.6" data-cp-dir="front" data-cp-on="hex-nut-stud-pair-5-8--2--stud" />
    </g>
