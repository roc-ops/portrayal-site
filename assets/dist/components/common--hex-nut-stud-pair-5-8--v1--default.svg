      <circle id="hex-nut-stud-pair-5-8--1--stud" cx="3.6" cy="3.6" r="1.2" fill="#b4b9be" stroke="#5f6468" stroke-width="0.25" data-z-cyl="7.0" data-z-color="#a4a9ae" />
      <g data-cp="mate" data-cp-at="3.6 3.6" data-cp-dir="front" data-cp-on="hex-nut-stud-pair-5-8--1--stud" />
    </g>
    <g id="hex-nut-stud-pair-5-8--2" data-path="hex-nut-stud-pair-5-8/2" data-class="screw" data-ref="common/hex-nut-stud@1:1.0.0" transform="translate(15.875,0)" data-z-lift="3.6">
      <title>hex-nut-stud-pair-5-8--2</title>
