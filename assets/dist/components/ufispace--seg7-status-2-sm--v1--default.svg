<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="12.8mm" height="6.8mm" viewBox="0 0 12.8 6.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="seg7-status-2-sm" data-path="seg7-status-2-sm" data-class="display" data-ref="ufispace/seg7-status-2-sm@1:1.0.0" transform="translate(0,0)">
    <title>seg7-status-2-sm</title>
    <rect id="seg7-status-2-sm--bezel" x="0" y="0" width="12.8" height="6.8" rx="0.35" fill="#0b0d12" />
    <g id="seg7-status-2-sm--digit-1" fill="var(--display-color, #6ea8e8)" data-path="seg7-status-2-sm/digit-1" data-class="display">
      <rect x="1.9" y="1.2" width="2.4" height="0.6" rx="0.15" />
      <rect x="1.3" y="1.75" width="0.6" height="1.7" rx="0.15" />
      <rect x="4.3" y="1.75" width="0.6" height="1.7" rx="0.15" />
      <rect x="1.9" y="3.3" width="2.4" height="0.6" rx="0.15" />
      <rect x="1.3" y="3.85" width="0.6" height="1.7" rx="0.15" />
      <rect x="4.3" y="3.85" width="0.6" height="1.7" rx="0.15" />
      <rect x="1.9" y="5.4" width="2.4" height="0.6" rx="0.15" />
      <rect x="5.3" y="5.4" width="0.6" height="0.6" rx="0.15" />
    </g>
    <g id="seg7-status-2-sm--digit-2" fill="var(--display-color, #6ea8e8)" data-path="seg7-status-2-sm/digit-2" data-class="display">
      <rect x="8.0" y="1.2" width="2.4" height="0.6" rx="0.15" />
      <rect x="7.4" y="1.75" width="0.6" height="1.7" rx="0.15" />
      <rect x="10.4" y="1.75" width="0.6" height="1.7" rx="0.15" />
      <rect x="8.0" y="3.3" width="2.4" height="0.6" rx="0.15" />
      <rect x="7.4" y="3.85" width="0.6" height="1.7" rx="0.15" />
      <rect x="10.4" y="3.85" width="0.6" height="1.7" rx="0.15" />
      <rect x="8.0" y="5.4" width="2.4" height="0.6" rx="0.15" />
      <rect x="11.4" y="5.4" width="0.6" height="0.6" rx="0.15" />
    </g>
  </g>
</svg>
