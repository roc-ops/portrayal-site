<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="103.7mm" height="45.0mm" viewBox="0 0 103.7 45.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mx104-psu-dc" data-path="mx104-psu-dc" data-class="psu" data-behaviour="fills" data-ref="juniper/mx104-psu-dc@1:1.1.0" data-inlet="dc-terminal" data-input="24 VDC or -48 to -60 VDC, 40 A / 20 A per the nameplate" data-model="MX104 DC PSU" data-power-output-w="800" data-redundancy="1+1" data-role="dc-power-supply" data-states="absent" transform="translate(0,0)">
    <title>mx104-psu-dc</title>
    <rect id="mx104-psu-dc--face" x="0" y="0" width="103.7" height="45.0" rx="0.8" fill="#8b8f94" stroke="#6d7278" stroke-width="0.4" />
    <g id="mx104-psu-dc--screws">
      <circle cx="8.0" cy="6.5" r="2.2" fill="#b0b4b9" stroke="#7d8288" stroke-width="0.35" />
      <circle cx="95.0" cy="6.5" r="2.2" fill="#b0b4b9" stroke="#7d8288" stroke-width="0.35" />
    </g>
    <g id="mx104-psu-dc--warn-chip">
      <path d="M 62.0 8.0 l 4.6 8.2 l -9.2 0 Z" fill="#f2c93c" stroke="#8f7714" stroke-width="0.5" />
      <path d="M 62.0 10.6 l 0 3.0 M 62.0 15.0 l 0 0.4" stroke="#3a3226" stroke-width="0.7" fill="none" />
    </g>
    <g id="mx104-psu-dc--terminals" data-path="mx104-psu-dc/terminals" data-class="terminal" data-z-out="2.4" data-z-color="#17191c">
      <rect id="mx104-psu-dc--terminal-plate" x="8.0" y="20.0" width="42.0" height="20.0" rx="1.6" fill="#17191c" stroke="#0d0f11" stroke-width="0.5" />
      <g id="mx104-psu-dc--stud-0" data-z-cyl="6.0" data-z-lift="2.4" data-z-thread="1.0">
        <circle cx="20.0" cy="30.0" r="4.6" fill="#4a4f55" stroke="#6d7379" stroke-width="0.4" />
        <circle cx="20.0" cy="30.0" r="2.4" fill="#33373c" />
      </g>
      <g id="mx104-psu-dc--stud-1" data-z-cyl="6.0" data-z-lift="2.4" data-z-thread="1.0">
        <circle cx="38.0" cy="30.0" r="4.6" fill="#4a4f55" stroke="#6d7379" stroke-width="0.4" />
        <circle cx="38.0" cy="30.0" r="2.4" fill="#33373c" />
      </g>
    </g>
    <g id="mx104-psu-dc--silkscreen">
      <g id="mx104-psu-dc--t22-silkscreen">
        <text x="14.0" y="19.0" font-family="Arial" font-size="1.4" fill="#3a3e43" text-anchor="middle">V-</text>
      </g>
      <g id="mx104-psu-dc--t23-silkscreen">
        <text x="32.0" y="19.0" font-family="Arial" font-size="1.4" fill="#3a3e43" text-anchor="middle">V+</text>
      </g>
      <g id="mx104-psu-dc--t24-silkscreen">
        <text x="52.0" y="43.0" font-family="Arial" font-size="1.4" fill="#3a3e43" text-anchor="middle">24V=== / -48V~-60V=== 40A/20A</text>
      </g>
    </g>
  </g>
</svg>
