<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60.1mm" height="37.6mm" viewBox="0 0 60.1 37.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="agr-psu-ac" data-path="agr-psu-ac" data-class="psu" data-ref="edgecore/agr-psu-ac@1:1.0.0" data-body-depth="360.7" data-wall="#4a4f55" data-input="100-120 V 12 A or 200-240 V 7.5 A, 50-60 Hz per PSU" data-model="AGR PSU (AC)" transform="translate(0,0)">
    <title>agr-psu-ac</title>
    <rect id="agr-psu-ac--face" x="0" y="0" width="60.1" height="37.6" rx="1.0" fill="#b9bec3" stroke="#7d848c" stroke-width="0.4" />
    <g id="agr-psu-ac--inlet" data-path="agr-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(12.0,8.8)">
      <title>agr-psu-ac--inlet</title>
      <rect id="agr-psu-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="agr-psu-ac/inlet/opening" data-class="cutout" />
      <path id="agr-psu-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="agr-psu-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="agr-psu-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="agr-psu-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
    </g>
    <g id="agr-psu-ac--handle" data-z-uhandle="9.0">
      <rect id="agr-psu-ac--handle-bar" x="2.2" y="6.4" width="4.8" height="24.8" rx="2.2" fill="#2b2f33" stroke="#171a1d" stroke-width="0.35" />
      <rect id="agr-psu-ac--handle-grip" x="3.4" y="8.6" width="2.4" height="20.4" rx="1.2" fill="#0d0f11" />
    </g>
    <g id="agr-psu-ac--latch" data-z-out="4.2">
      <rect id="agr-psu-ac--latch-bar" x="47.0" y="7.6" width="5.0" height="22.4" rx="1.8" fill="#c22f2f" stroke="#7a1a1a" stroke-width="0.4" />
      <rect id="agr-psu-ac--latch-lip" x="48.2" y="10.0" width="2.6" height="17.6" rx="1.0" fill="#8e2018" />
    </g>
  </g>
</svg>
