<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="89.7mm" viewBox="0 0 101.6 89.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex9200-pwr-mx480-2400-dc@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='juniper/ex9200-pwr-mx480-2400-dc@'] .state-yellow { --led-color: #f5a623; }</style>
  <g id="ex9200-pwr-mx480-2400-dc" data-path="ex9200-pwr-mx480-2400-dc" data-class="psu" data-behaviour="fills" data-ref="juniper/ex9200-pwr-mx480-2400-dc@1:1.0.0" data-airflow="front-to-back (the supply draws air from the front of the chassis and exhausts at its own rear)" data-inlet="dc-terminal" data-input-current-a="60 (switch at 0), 70 (switch at 1)" data-input-voltage="-40.5 to -72 VDC, nominal -48 VDC" data-power-output-70a-w="2600" data-power-output-w="2400" data-redundancy="1+1" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex9200-pwr-mx480-2400-dc</title>
    <rect id="ex9200-pwr-mx480-2400-dc--flange" x="0" y="70.0" width="101.6" height="19.7" rx="0.8" fill="#a3a7ab" stroke="#7d8288" stroke-width="0.4" />
    <rect id="ex9200-pwr-mx480-2400-dc--face" x="0" y="0" width="101.6" height="74.0" rx="0.8" fill="#b3b7bb" stroke="#8a8f94" stroke-width="0.4" />
    <g id="ex9200-pwr-mx480-2400-dc--vents" fill="none" stroke="#2e3338" stroke-width="2.2">
      <path d="M 6.0 5.0 V 56.0" />
      <path d="M 11.0 5.0 V 56.0" />
      <path d="M 16.0 5.0 V 56.0" />
      <path d="M 21.0 5.0 V 56.0" />
    </g>
    <g id="ex9200-pwr-mx480-2400-dc--breaker" data-path="ex9200-pwr-mx480-2400-dc/breaker" data-class="switch" data-z-out="2.4" data-z-color="#26292d">
      <rect x="30.0" y="8.0" width="14.0" height="22.0" rx="1.6" fill="#1d2023" stroke="#0f1113" stroke-width="0.4" />
      <rect x="32.5" y="11.5" width="9.0" height="15.0" rx="1.2" fill="#4a4f55" />
    </g>
    <g id="ex9200-pwr-mx480-2400-dc--terminals">
      <rect x="28.0" y="38.0" width="34.0" height="24.0" rx="1.2" fill="#8a8f95" stroke="#5a5f64" stroke-width="0.4" />
      <circle cx="37.0" cy="50.0" r="3.6" fill="#c9ccd0" stroke="#5a5f64" stroke-width="0.4" />
      <circle cx="53.0" cy="50.0" r="3.6" fill="#c9ccd0" stroke="#5a5f64" stroke-width="0.4" />
    </g>
    <rect x="84.0" y="16.0" width="13.4" height="22.0" rx="0.6" fill="#f2f3f4" stroke="#8a8f94" stroke-width="0.2" />
    <g id="ex9200-pwr-mx480-2400-dc--lamps">
      <circle id="ex9200-pwr-mx480-2400-dc--led-power-ok" cx="91.8" cy="21.4" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25" data-path="ex9200-pwr-mx480-2400-dc/led-power-ok" data-class="led" data-states="green yellow off" />
      <circle id="ex9200-pwr-mx480-2400-dc--led-brkr-on" cx="91.8" cy="27.1" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25" data-path="ex9200-pwr-mx480-2400-dc/led-brkr-on" data-class="led" data-states="green off" />
      <circle id="ex9200-pwr-mx480-2400-dc--led-input-ok" cx="91.8" cy="32.8" r="1.1" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25" data-path="ex9200-pwr-mx480-2400-dc/led-input-ok" data-class="led" data-states="green yellow off" />
    </g>
    <g id="ex9200-pwr-mx480-2400-dc--handle" data-path="ex9200-pwr-mx480-2400-dc/handle" data-class="latch" data-z-out="2.2" data-z-color="#26292d">
      <rect x="52.3" y="63.0" width="42.0" height="6.4" rx="3.2" fill="#1d2023" stroke="#0f1113" stroke-width="0.4" />
    </g>
    <g id="ex9200-pwr-mx480-2400-dc--flange-hardware">
      <circle cx="25.6" cy="84.3" r="1.7" fill="#b0b4b9" stroke="#7d8288" stroke-width="0.3" />
      <circle cx="76.5" cy="84.3" r="1.7" fill="#b0b4b9" stroke="#7d8288" stroke-width="0.3" />
    </g>
    <g id="ex9200-pwr-mx480-2400-dc--silkscreen">
      <text x="89.6" y="21.8" font-family="sans-serif" font-size="1.2" fill="#222" text-anchor="end">POWER OK</text>
      <text x="89.6" y="27.5" font-family="sans-serif" font-size="1.2" fill="#222" text-anchor="end">BRKR ON</text>
      <text x="89.6" y="33.2" font-family="sans-serif" font-size="1.2" fill="#222" text-anchor="end">INPUT OK</text>
    </g>
  </g>
</svg>
