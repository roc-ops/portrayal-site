<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="81.0mm" height="36.0mm" viewBox="0 0 81.0 36.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='oscilloquartz/osa542x-psu-ac-40w@'] .state-fail { --led-color: #d0342c; }
    g[data-ref^='oscilloquartz/osa542x-psu-ac-40w@'] .state-ok { --led-color: #39b54a; }</style>
  <g id="osa542x-psu-ac-40w" data-path="osa542x-psu-ac-40w" data-class="psu" data-behaviour="fills" data-ref="oscilloquartz/osa542x-psu-ac-40w@1:1.0.0" data-input="ac" data-input-voltage="100-240 VAC, 47-63 Hz" data-power-output-w="40" data-states="absent" transform="translate(0,0)">
    <title>osa542x-psu-ac-40w</title>
    <rect id="osa542x-psu-ac-40w--notch" x="71.8" y="0" width="9.2" height="24.25" fill="#d2d4d7" />
    <rect id="osa542x-psu-ac-40w--plate" x="0.15" y="0.15" width="71.5" height="34.7" rx="0.4" fill="#d9dbde" stroke="#55595e" stroke-width="0.3" />
    <rect id="osa542x-psu-ac-40w--tab" x="70.1" y="24.25" width="10.75" height="11.6" rx="1.2" fill="#d9dbde" stroke="#55595e" stroke-width="0.3" />
    <rect x="70.3" y="24.5" width="1.6" height="10.2" fill="#d9dbde" />
    <g id="osa542x-psu-ac-40w--handle" data-path="osa542x-psu-ac-40w/handle" data-class="handle">
      <rect x="2.2" y="3.95" width="21.6" height="4.8" rx="2.4" fill="#aeb3b8" stroke="#6c7176" stroke-width="0.25" />
      <rect x="4.6" y="5.55" width="16.8" height="1.6" rx="0.8" fill="#eef0f2" />
    </g>
    <circle cx="64.9" cy="6.25" r="2.4" fill="#8e9398" />
    <circle id="osa542x-psu-ac-40w--lamp-status" cx="64.9" cy="6.25" r="1.6" fill="var(--led-color, #3a3f44)" data-path="osa542x-psu-ac-40w/lamp-status" data-class="led" data-states="off ok fail" />
    <rect id="osa542x-psu-ac-40w--flange" x="26.5" y="7.35" width="33.6" height="23.8" rx="2.2" fill="#1b1d20" stroke="#0b0c0d" stroke-width="0.2" />
    <g fill="#c4c8cc" stroke="#6c7176" stroke-width="0.2">
      <circle id="osa542x-psu-ac-40w--screw-flange-l" cx="23.9" cy="18.75" r="1.5" data-path="osa542x-psu-ac-40w/screw-flange-l" data-class="fastener" />
      <circle id="osa542x-psu-ac-40w--screw-flange-r" cx="63.7" cy="18.75" r="1.5" data-path="osa542x-psu-ac-40w/screw-flange-r" data-class="fastener" />
    </g>
    <g stroke="#6c7176" stroke-width="0.25">
      <path d="M 23.1 18.75 H 24.7 M 23.9 17.95 V 19.55" />
      <path d="M 62.9 18.75 H 64.5 M 63.7 17.95 V 19.55" />
    </g>
    <g id="osa542x-psu-ac-40w--thumbscrew" data-path="osa542x-psu-ac-40w/thumbscrew" data-class="fastener">
      <circle cx="76.6" cy="31.85" r="3.7" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.25" />
      <circle cx="76.6" cy="31.85" r="3.1" fill="none" stroke="#9ca1a6" stroke-width="0.5" stroke-dasharray="0.3 0.3" />
      <circle cx="76.6" cy="31.85" r="2.0" fill="#dfe2e5" stroke="#8a8f95" stroke-width="0.2" />
      <path d="M 75.5 31.85 H 77.7 M 76.6 30.75 V 32.95" stroke="#6c7176" stroke-width="0.35" />
    </g>
    <g id="osa542x-psu-ac-40w--silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#2f3a66">
      <text x="53.7" y="6.9" font-size="1.9" text-anchor="middle">Status</text>
      <text x="14.8" y="27.7" font-size="2.0">100-</text>
      <text x="14.8" y="30.3" font-size="2.0">240V AC</text>
    </g>
    <g id="osa542x-psu-ac-40w--inlet" data-path="osa542x-psu-ac-40w/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(29.3,9.25)">
      <title>osa542x-psu-ac-40w--inlet</title>
      <rect id="osa542x-psu-ac-40w--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="osa542x-psu-ac-40w/inlet/opening" data-class="cutout" />
      <path id="osa542x-psu-ac-40w--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="osa542x-psu-ac-40w--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="osa542x-psu-ac-40w--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="osa542x-psu-ac-40w--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="43.3 19.25" data-cp-dir="rear" />
  </g>
</svg>
