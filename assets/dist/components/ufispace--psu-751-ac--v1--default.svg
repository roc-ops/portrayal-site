<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.2mm" viewBox="0 0 50.5 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-751-ac@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-fw-update { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-fw-update { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-input-lost { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-input-lost { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-warning { --led-color: #22c55e; --led-color-alt: #ef4444; }
    g[data-ref^='ufispace/psu-751-ac@'] .state-warning { animation: portrayal-alternate 1s linear infinite; }</style>
  <g id="psu-751-ac" data-path="psu-751-ac" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-751-ac@1:1.0.0" data-input="ac" data-model="PSU-751-AESR" data-power-output-w="750" transform="translate(0,0)">
    <title>psu-751-ac</title>
    <rect id="psu-751-ac--body" x="0" y="0" width="50.5" height="40.2" rx="0.6" fill="#33373c" stroke="#22262a" stroke-width="0.4" />
    <g id="psu-751-ac--vent-field" data-z-vent="30">
      <rect x="16.6" y="2.6" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="21.9" y="2.6" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="27.2" y="2.6" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="31.9" y="2.6" width="3.4" height="5.2" fill="#0d0f11" />
      <rect x="5.8" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="11.1" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="16.6" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="21.9" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="27.2" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="31.9" y="9.8" width="3.4" height="5.2" fill="#0d0f11" />
    </g>
    <g id="psu-751-ac--slot-vents">
      <rect x="44.8" y="2.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="8.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="14.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="20.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="26.6" width="4.2" height="4.6" fill="#0d0f11" />
    </g>
    <rect id="psu-751-ac--spec-label" x="44.8" y="34.6" width="4.2" height="3.4" fill="#2e8b57" />
    <rect id="psu-751-ac--latch" x="0" y="4" width="2.5" height="12" rx="0.8" fill="#c22f2f" stroke="#8c1f1f" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" data-path="psu-751-ac/latch" data-class="latch" data-z-out="2.2" />
    <rect id="psu-751-ac--handle" x="36.2" y="2.5" width="3.6" height="35" rx="1.7" fill="#17191c" stroke="#0d0f11" stroke-width="0.3" data-path="psu-751-ac/handle" data-class="handle" data-z-uhandle="38" />
    <path id="psu-751-ac--inlet-frame" fill-rule="evenodd" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.3" d="     M 4.3 17.1 h 27.4 a 0.8 0.8 0 0 1 0.8 0.8 v 19.4 a 0.8 0.8 0 0 1 -0.8 0.8 h -27.4 a 0.8 0.8 0 0 1 -0.8 -0.8 v -19.4 a 0.8 0.8 0 0 1 0.8 -0.8 z     M 4.0 17.6 h 28 v 20 h -28 z" data-z-out="2.4" />
    <circle id="psu-751-ac--status-led" cx="12.8" cy="6.2" r="1.6" fill="var(--led-color, #3a3f44)" data-path="psu-751-ac/status-led" data-class="led" data-states="off ok fail standby fw-update input-lost warning" data-description="HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output ON and OK), Blinking Green 1/sec (standby state, only +5VSB on), Blinking Green 2/sec (power supply firmware updating, boot-loader mode), Red (critical event causing a shutdown - failure, over current, short circuit, over voltage, fan failure, over temperature), Blinking Red 1/sec (input power cord unplugged or input power lost with a second supply still fed), Blinking between Green and Red (warning while still operating - high temp, high power, high current, slow fan)" data-z-dome="0.4" />
    <g id="psu-751-ac--inlet" data-path="psu-751-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(4.0,17.6)">
      <title>psu-751-ac--inlet</title>
      <rect id="psu-751-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-751-ac/inlet/opening" data-class="cutout" />
      <path id="psu-751-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-751-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-751-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-751-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="18 27.6" data-cp-dir="front" />
  </g>
</svg>
