    </g>
    <circle id="csr310-psu-ac--vent-hole" cx="46.1" cy="30.6" r="1.1" fill="#1a1d21" stroke="#5b6167" stroke-width="0.22" />
    <rect id="csr310-psu-ac--handle" x="41.5" y="3.6" width="3.5" height="21.3" rx="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.3" data-path="csr310-psu-ac/handle" data-class="handle" data-z-out="8.0" data-z-color="#c3c9cf" />
    <rect id="csr310-psu-ac--latch" x="46.5" y="32.0" width="6.5" height="7.4" rx="0.8" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" data-path="csr310-psu-ac/latch" data-class="latch" data-z-out="4.0" data-z-color="#8a9099" />
    <g id="csr310-psu-ac--inlet" data-path="csr310-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(11.0,10.4)">
      <title>csr310-psu-ac--inlet</title>
      <rect id="csr310-psu-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="csr310-psu-ac/inlet/opening" data-class="cutout" />
      <path id="csr310-psu-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="csr310-psu-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="csr310-psu-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="csr310-psu-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
