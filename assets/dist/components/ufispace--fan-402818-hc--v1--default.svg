<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="51.5mm" height="42.2mm" viewBox="0 0 51.5 42.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/fan-402818-hc@'] .state-fault { --led-color: #eab308; }
    g[data-ref^='ufispace/fan-402818-hc@'] .state-fault { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/fan-402818-hc@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-402818-hc" data-path="fan-402818-hc" data-class="fan" data-behaviour="fills" data-ref="ufispace/fan-402818-hc@1:1.0.0" data-airflow="exhaust" data-model="FAN-402818-HC" data-power-absent="not-published" transform="translate(0,0)">
    <title>fan-402818-hc</title>
    <defs>
      <pattern id="fan-402818-hc--hex818" width="4.43" height="2.555" patternUnits="userSpaceOnUse">
        <path d="M 1.275 0 L 0.6375 1.104 L -0.6375 1.104 L -1.275 0 L -0.6375 -1.104 L 0.6375 -1.104 Z" fill="#0d0f11" />
        <path d="M 5.705 0 L 5.0675 1.104 L 3.7925 1.104 L 3.155 0 L 3.7925 -1.104 L 5.0675 -1.104 Z" fill="#0d0f11" />
        <path d="M 3.49 1.2775 L 2.8525 2.3815 L 1.5775 2.3815 L 0.94 1.2775 L 1.5775 0.1735 L 2.8525 0.1735 Z" fill="#0d0f11" />
        <path d="M 1.275 2.555 L 0.6375 3.659 L -0.6375 3.659 L -1.275 2.555 L -0.6375 1.451 L 0.6375 1.451 Z" fill="#0d0f11" />
        <path d="M 5.705 2.555 L 5.0675 3.659 L 3.7925 3.659 L 3.155 2.555 L 3.7925 1.451 L 5.0675 1.451 Z" fill="#0d0f11" />
      </pattern>
      <mask id="fan-402818-hc--fanmask818" maskUnits="userSpaceOnUse">
        <circle cx="24.0" cy="21.1" r="15.4" fill="white" />
        <rect x="8" y="2.4" width="32" height="37.4" fill="url(#fan-402818-hc--hex818)" />
      </mask>
    </defs>
    <rect id="fan-402818-hc--body" x="0" y="0" width="51.5" height="42.2" rx="0.6" fill="#2b2f33" stroke="#1a1d20" stroke-width="0.4" />
    <rect id="fan-402818-hc--bezel-seam" x="40.6" y="0.5" width="0.35" height="41.2" fill="#17191c" />
    <circle id="fan-402818-hc--rotor-behind" cx="24.0" cy="21.1" r="15.4" fill="#0b0d0f" data-z-vent="25" />
    <path id="fan-402818-hc--rotor-grille" fill-rule="evenodd" fill="url(#fan-402818-hc--hex818)" d="M 8 2.4 h 32 v 37.4 h -32 z        M 24.0 5.7 a 15.4 15.4 0 1 0 0.001 0 z" data-z-vent="25" />
    <g id="fan-402818-hc--rotor-bulge" data-z-dome="3.2">
      <circle cx="24.0" cy="21.1" r="15.4" fill="#17191c" mask="url(#fan-402818-hc--fanmask818)" />
      <circle id="fan-402818-hc--rotor-hub" cx="24.0" cy="21.1" r="4.2" fill="#22262a" />
      <circle id="fan-402818-hc--rotor-ring" cx="24.0" cy="21.1" r="15.4" fill="none" stroke="#4a4f55" stroke-width="0.4" />
    </g>
    <circle id="fan-402818-hc--boss" cx="35.5" cy="9.0" r="2.2" fill="#1c1f22" stroke="#3a3f44" stroke-width="0.25" />
    <g id="fan-402818-hc--handle" data-z-uhandle="25">
      <path d="M 13.5 6.0 L 7.0 6.0 A 2.0 2.0 0 0 0 5.0 8.0 L 5.0 30.5 A 2.0 2.0 0 0 0 7.0 32.5 L 13.5 32.5" fill="none" stroke="#c22f2f" stroke-width="2.6" stroke-linecap="round" />
    </g>
    <g id="fan-402818-hc--airflow-badge">
      <rect x="43.2" y="11.6" width="5.4" height="7.4" rx="0.4" fill="#d32020" />
      <g id="fan-402818-hc--silkscreen">
        <text x="45.9" y="17.6" font-family="Helvetica, Arial, sans-serif" font-size="5.6" font-weight="bold" text-anchor="middle" fill="#141618">E</text>
      </g>
    </g>
    <g id="fan-402818-hc--thumbscrew" data-z-cyl="5" data-z-knurl="1">
      <circle cx="45.9" cy="24.6" r="2.5" fill="#9aa1a8" stroke="#4a4f55" stroke-width="0.3" />
      <circle cx="45.9" cy="24.6" r="1.5" fill="none" stroke="#6b7178" stroke-width="0.3" />
    </g>
    <circle id="fan-402818-hc--status-led" cx="45.9" cy="32.4" r="1.4" fill="var(--led-color, #3a3f44)" data-path="fan-402818-hc/status-led" data-class="led" data-states="off ok fault" data-description="HIG Fan FRU LED table - Off (main board 3.3V power fail, or fan not present), Solid Green (fan present and interrupt de-assert), Blinking Yellow (fan present but interrupt assert). The table's Blinking Green and Solid Yellow rows read N/A and are deliberately not modelled" data-z-dome="0.4" />
  </g>
</svg>
