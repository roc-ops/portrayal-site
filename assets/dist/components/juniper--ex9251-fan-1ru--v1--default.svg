<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="41.7mm" height="41.7mm" viewBox="0 0 41.7 41.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ex9251-fan-1ru" data-path="ex9251-fan-1ru" data-class="fan" data-behaviour="fills" data-ref="juniper/ex9251-fan-1ru@1:1.0.0" data-airflow="front-to-back" data-power-absent="not-published" data-role="chassis-fan" data-states="absent" transform="translate(0,0)">
    <title>ex9251-fan-1ru</title>
    <defs>
      <pattern id="ex9251-fan-1ru--hex" width="2.6" height="4.5" patternUnits="userSpaceOnUse">
        <polygon points="1.3,0.1 2.25,0.65 2.25,1.75 1.3,2.3 0.35,1.75 0.35,0.65" fill="#050607" />
        <polygon points="0,2.35 0.95,2.9 0.95,4.0 0,4.55 -0.95,4.0 -0.95,2.9" fill="#050607" />
        <polygon points="2.6,2.35 3.55,2.9 3.55,4.0 2.6,4.55 1.65,4.0 1.65,2.9" fill="#050607" />
      </pattern>
    </defs>
    <rect id="ex9251-fan-1ru--face" x="0.2" y="0.2" width="41.3" height="41.3" rx="2.0" fill="#4a4e54" stroke="#2d3033" stroke-width="0.4" data-fill-from="handle-finish" data-stroke-derive="handle-finish" />
    <g id="ex9251-fan-1ru--grille-top">
      <rect x="7.8" y="4.4" width="26.9" height="11.0" rx="3.0" fill="#1a1d20" />
      <rect x="7.8" y="4.4" width="26.9" height="11.0" rx="3.0" fill="url(#ex9251-fan-1ru--hex)" />
    </g>
    <g id="ex9251-fan-1ru--grille-bottom">
      <rect x="7.8" y="26.3" width="26.9" height="11.0" rx="3.0" fill="#1a1d20" />
      <rect x="7.8" y="26.3" width="26.9" height="11.0" rx="3.0" fill="url(#ex9251-fan-1ru--hex)" />
    </g>
    <g id="ex9251-fan-1ru--handle" data-path="ex9251-fan-1ru/handle" data-class="latch" data-z-out="2.0">
      <rect x="4.8" y="15.6" width="32.1" height="10.4" rx="3.0" fill="#4a4e54" stroke="#2d3033" stroke-width="0.35" data-fill-from="handle-finish" data-stroke-derive="handle-finish" />
      <rect x="4.8" y="15.6" width="32.1" height="10.4" rx="3.0" fill="#ffffff" fill-opacity="0.18" />
      <rect x="0.6" y="18.4" width="5.2" height="4.8" rx="0.6" fill="#000000" fill-opacity="0.25" />
      <rect x="35.9" y="18.4" width="5.2" height="4.8" rx="0.6" fill="#000000" fill-opacity="0.25" />
      <rect id="ex9251-fan-1ru--airflow-chip" x="14.2" y="17.4" width="13.4" height="6.9" rx="0.7" fill="#6f7377" />
      <g id="ex9251-fan-1ru--fan-symbol">
        <circle cx="17.2" cy="20.9" r="0.45" fill="#4a4e54" data-fill-from="handle-finish" />
        <ellipse cx="17.2" cy="19.7" rx="0.65" ry="1.0" fill="#4a4e54" data-fill-from="handle-finish" />
        <ellipse cx="17.2" cy="19.7" rx="0.65" ry="1.0" fill="#4a4e54" data-fill-from="handle-finish" transform="rotate(90 17.2 20.9)" />
        <ellipse cx="17.2" cy="19.7" rx="0.65" ry="1.0" fill="#4a4e54" data-fill-from="handle-finish" transform="rotate(180 17.2 20.9)" />
        <ellipse cx="17.2" cy="19.7" rx="0.65" ry="1.0" fill="#4a4e54" data-fill-from="handle-finish" transform="rotate(270 17.2 20.9)" />
      </g>
      <g id="ex9251-fan-1ru--silkscreen">
        <text x="22.8" y="20.5" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="22.8" y="23.3" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">OUT</text>
      </g>
    </g>
    <g id="ex9251-fan-1ru--screw" data-path="ex9251-fan-1ru/screw" data-class="screw" data-z-cyl="2.5" data-z-knurl="1">
      <circle cx="4.4" cy="4.6" r="3.2" fill="#111214" stroke="#3a3e43" stroke-width="0.35" />
      <circle cx="4.4" cy="4.6" r="1.2" fill="#26292d" />
      <path d="M 3.2 4.6 H 5.6 M 4.4 3.4 V 5.8" stroke="#5a5f66" stroke-width="0.4" />
    </g>
  </g>
</svg>
