      <circle id="dcs520-psu-ac--status-lens" cx="35.60" cy="4.60" r="1.35" fill="var(--led-color, #5b6169)" />
    </g>
    <g id="dcs520-psu-ac--inlet-well" data-path="dcs520-psu-ac/inlet-well" data-class="bezel" data-depth="2.6" data-wall="#3a3e43">
      <rect x="6.30" y="28.90" width="28.20" height="21.30" rx="0.8" fill="#15181b" stroke="#7d848b" stroke-width="0.3" />
    </g>
    <g id="dcs520-psu-ac--handle" data-path="dcs520-psu-ac/handle" data-class="handle" data-z-bar="3.1">
      <path d="M 1.60 10.10 L 26.40 21.60" fill="none" stroke="#24272b" stroke-width="3.10" stroke-linecap="round" data-stroke-from="handle-finish" />
      <path d="M 26.40 21.60 L 27.90 17.40" fill="none" stroke="#24272b" stroke-width="3.10" stroke-linecap="round" data-stroke-from="handle-finish" />
    </g>
    <g id="dcs520-psu-ac--latch" data-path="dcs520-psu-ac/latch" data-class="latch" data-z-out="1.2">
      <rect x="0.40" y="41.20" width="3.10" height="8.60" rx="1.10" fill="#d5342c" stroke="#8a2420" stroke-width="0.25" data-fill-from="latch-finish" />
    </g>
