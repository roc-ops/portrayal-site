      <title>dcs520-psu-ac--inlet</title>
      <rect id="dcs520-psu-ac--inlet--opening" x="0" y="0" width="26.8" height="19.9" rx="2.5" fill="#858a90" data-path="dcs520-psu-ac/inlet/opening" data-class="cutout" />
