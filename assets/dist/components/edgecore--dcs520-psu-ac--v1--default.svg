      <rect id="dcs520-psu-ac--vent-back" x="2.20" y="2.10" width="31.60" height="23.40" rx="0.3" fill="#1d2126" />
      <path d="M 8.0 6.5 h 12 v 9 h -12 z" fill="#c8901f" opacity="0.85" />
      <path d="M 17.5 5.2 h 11 v 12 h -11 z" fill="#2f5fb5" opacity="0.85" />
      <rect id="dcs520-psu-ac--vent-grid" x="2.20" y="2.10" width="31.60" height="23.40" fill="url(#dcs520-psu-ac--dcs520-psu-grid)" />
      <rect x="2.20" y="2.10" width="31.60" height="23.40" rx="0.3" fill="none" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <g id="dcs520-psu-ac--status" data-path="dcs520-psu-ac/status" data-class="led" data-states="off ok fault">
