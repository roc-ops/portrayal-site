        <rect x="0" y="0" width="0.55" height="3.20" fill="#c9ced4" />
        <rect x="0" y="0" width="3.20" height="0.55" fill="#c9ced4" />
      </pattern>
    </defs>
    <rect id="dcs520-psu-ac--body" x="0" y="0" width="39.7" height="53.3" rx="0.5" fill="#2f3439" stroke="#1b1e22" stroke-width="0.4" />
