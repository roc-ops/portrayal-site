      <path id="dcs520-psu-ac--inlet--contact-web" fill="#858a90" d="M 8.80 5.25 L 18.00 5.25 L 18.00 8.45 L 22.10 8.45 L 23.10 9.45 L 23.10 10.35 L 18.00 10.35 L 18.00 13.75 L 23.10 13.75 L 23.10 15.55 L 16.00 15.55 L 16.00 10.05 L 16.80 9.25 L 17.20 9.25 L 17.20 7.05 L 9.60 7.05 L 9.60 9.25 L 10.00 9.25 L 10.80 10.05 L 10.80 15.55 L 3.70 15.55 L 3.70 13.75 L 8.80 13.75 L 8.80 10.35 L 3.70 10.35 L 3.70 9.45 L 4.70 8.45 L 8.80 8.45 Z" data-z-top="14.0" data-z-color="#858a90" />
      <g data-cp="mate" data-cp-at="13.4 9.95" data-cp-dir="front" />
    </g>
  </g>
</svg>
