    <g id="m1-10gb-hs-xfp--laser-1" data-path="m1-10gb-hs-xfp/laser-1" data-class="led" data-ref="common/led-indicator@1:1.2.0" data-description="Laser Disabled, port 1 - amber: laser disabled; off: laser on" transform="translate(14.38,4.54)" data-group="port-leds" data-group-role="indicator">
