<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86.3mm" height="41.0mm" viewBox="0 0 86.3 41.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='dell/psu-2400w-ac-86mm@'] .state-fault { --led-color: #eab308; }
    g[data-ref^='dell/psu-2400w-ac-86mm@'] .state-fault { animation: portrayal-blink 1s linear infinite; }
    @keyframes portrayal-seq-dell-psu-2400w-ac-86mm-mismatch {
      0%, 3.9% { opacity: 1; fill: #22c55e; }
      4%, 7.9% { opacity: 0; }
      8%, 11.9% { opacity: 1; fill: #22c55e; }
      12%, 15.9% { opacity: 0; }
      16%, 19.9% { opacity: 1; fill: #22c55e; }
      20%, 23.9% { opacity: 0; }
      24%, 27.9% { opacity: 1; fill: #22c55e; }
      28%, 31.9% { opacity: 0; }
      32%, 35.9% { opacity: 1; fill: #22c55e; }
      36%, 99.9% { opacity: 0; }
    }
    g[data-ref^='dell/psu-2400w-ac-86mm@'] .state-mismatch { animation: portrayal-seq-dell-psu-2400w-ac-86mm-mismatch 3.125s steps(1, end) infinite; }
    g[data-ref^='dell/psu-2400w-ac-86mm@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='dell/psu-2400w-ac-86mm@'] .state-updating { --led-color: #22c55e; }
    g[data-ref^='dell/psu-2400w-ac-86mm@'] .state-updating { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="psu-2400w-ac-86mm" data-path="psu-2400w-ac-86mm" data-class="psu" data-behaviour="fills" data-ref="dell/psu-2400w-ac-86mm@1:1.0.0" data-body-depth="195.5" data-wall="#3a4045" data-form-factor="86mm" data-inlet="c20" data-input="mixed-mode" data-power-output-w="2400" transform="translate(0,0)">
    <title>psu-2400w-ac-86mm</title>
    <g id="psu-2400w-ac-86mm--inlet" data-path="psu-2400w-ac-86mm/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(49.7,8.4) rotate(90 16.2 12.2)">
      <title>psu-2400w-ac-86mm--inlet</title>
      <rect id="psu-2400w-ac-86mm--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="psu-2400w-ac-86mm/inlet/opening" data-class="cutout" />
      <rect id="psu-2400w-ac-86mm--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="psu-2400w-ac-86mm--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-2400w-ac-86mm--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-2400w-ac-86mm--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
    <path id="psu-2400w-ac-86mm--body" fill-rule="evenodd" d="M0.2 1.2 a1 1 0 0 1 1 -1 h83.90 a1 1 0 0 1 1 1 v38.60 a1 1 0 0 1 -1 1 h-83.90 a1 1 0 0 1 -1 -1 Z M53.7 4.4 h24.4 v32.4 h-24.4 Z" fill="#dfe2e5" stroke="#8d949c" stroke-width="0.35" />
    <path id="psu-2400w-ac-86mm--fan" d="M13.0 2.5 H28.2 L36.2 10.5 V30.1 L28.2 38.1 H13.0 L5.0 30.1 V10.5 Z" fill="#141719" stroke="#41474d" stroke-width="0.4" data-path="psu-2400w-ac-86mm/fan" data-class="vent" data-description="the exhaust fan opening" />
    <path d="M9.0 6.5 L16.5 14.0 M32.2 6.5 L24.7 14.0 M9.0 34.1 L16.5 26.6 M32.2 34.1 L24.7 26.6" stroke="#e9ecef" stroke-width="1.0" fill="none" stroke-linecap="round" />
    <circle cx="20.6" cy="20.3" r="9.9" fill="#e8ebee" stroke="#9aa0a6" stroke-width="0.35" />
    <g fill="#3d4247">
      <circle cx="7.1" cy="4.0" r="3.0" />
      <circle cx="38.7" cy="4.0" r="3.0" />
      <circle cx="7.1" cy="35.7" r="3.0" />
      <circle cx="38.7" cy="35.7" r="3.0" />
    </g>
    <path id="psu-2400w-ac-86mm--inlet-bezel" fill-rule="evenodd" d="M53.7 3.5 H78.1 a1.2 1.2 0 0 1 1.2 1.2 V36.5 a1.2 1.2 0 0 1 -1.2 1.2 H53.7 a1.2 1.2 0 0 1 -1.2 -1.2 V4.7 a1.2 1.2 0 0 1 1.2 -1.2 Z M53.7 4.4 h24.4 v32.4 h-24.4 Z" fill="#1b1f22" stroke="#41474d" stroke-width="0.35" data-path="psu-2400w-ac-86mm/inlet-bezel" data-class="inlet" data-description="the recess the C20 sits in. The connector is std/c20-inlet@1, composed." />
    <rect x="35.1" y="3.1" width="17.0" height="36.5" rx="2.6" fill="#f1f3f5" fill-opacity="0.55" stroke="#b5bbc1" stroke-width="0.35" />
    <rect x="41.2" y="8.0" width="4.4" height="26.5" rx="2.0" fill="#ffffff" fill-opacity="0.45" />
    <rect x="80.0" y="13.2" width="5.2" height="0.6" fill="#1b1e21" />
    <rect x="80.0" y="28.8" width="5.2" height="0.6" fill="#1b1e21" />
    <path id="psu-2400w-ac-86mm--grip" d="M39.5 3.9 h8.7 l1.2 1.2 v32.9 l-1.2 1.2 h-8.7 l-1.2 -1.2 v-32.9 Z" fill="var(--led-color, #e9ecef)" stroke="#b5bbc1" stroke-width="0.35" data-path="psu-2400w-ac-86mm/grip" data-class="led" data-states="off ok fault updating mismatch" data-description="The translucent handle, lit from within: green - a valid source is connected and the supply is operational; blinking amber - a problem with the supply; not illuminated - no power connected; blinking green - firmware is being updated; five green blinks at 4 Hz then off - a mismatch with the other supply. The codes are the R660's table 136 (dell/psu-1400w-ac-60mm@1); no rate is published for the amber fault or the firmware blink, so 1 Hz is a reading." data-z-uhandle="35.6" data-z-color="#e9ecef" />
    <rect id="psu-2400w-ac-86mm--latch" x="76.5" y="13.9" width="5.8" height="14.9" rx="0.6" fill="#d9661a" stroke="#9c4610" stroke-width="0.3" data-path="psu-2400w-ac-86mm/latch" data-class="latch" data-description="the orange release latch, pressed to withdraw the supply" data-z-out="14.7" data-z-color="#d9661a" />
  </g>
</svg>
