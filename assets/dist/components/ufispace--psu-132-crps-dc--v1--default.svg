<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40.0mm" viewBox="0 0 73.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-132-crps-dc@'] .state-critical { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-132-crps-dc@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-132-crps-dc@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-132-crps-dc@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-132-crps-dc@'] .state-warning { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-132-crps-dc@'] .state-warning { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="psu-132-crps-dc" data-path="psu-132-crps-dc" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-132-crps-dc@1:1.0.2" data-airflow="exhaust" data-inlet="dc-terminal" data-input="dc" data-model="PSU-132-DEGR-NN" data-power-output-w="1300" transform="translate(0,0)">
    <title>psu-132-crps-dc</title>
    <rect id="psu-132-crps-dc--body" x="0" y="0" width="73.5" height="40" rx="0.6" fill="#1c1f22" stroke="#0d0f11" stroke-width="0.4" />
    <g id="psu-132-crps-dc--fan-frame">
      <rect x="0.8" y="0.8" width="40.2" height="38.4" rx="1.2" fill="#0b0d0f" stroke="#c9ced4" stroke-width="0.9" />
      <g stroke="#c9ced4" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M 5.8 5.6 L 15.6 14.8" />
        <path d="M 35.8 5.6 L 26.0 14.8" />
        <path d="M 5.8 34.4 L 15.6 25.2" />
        <path d="M 35.8 34.4 L 26.0 25.2" />
      </g>
      <g fill="#0b0d0f" stroke="#c9ced4" stroke-width="1.3">
        <circle cx="4.8" cy="4.8" r="2.3" />
        <circle cx="37.0" cy="4.8" r="2.3" />
        <circle cx="4.8" cy="35.2" r="2.3" />
        <circle cx="37.0" cy="35.2" r="2.3" />
      </g>
    </g>
    <g id="psu-132-crps-dc--rotor-grille" data-z-vent="25">
      <circle cx="20.9" cy="20.0" r="14.3" fill="#17191c" stroke="#2b2f33" stroke-width="0.4" />
    </g>
    <g id="psu-132-crps-dc--rotor-bulge" data-z-dome="3.0">
      <circle cx="20.9" cy="20.0" r="6.4" fill="#101315" stroke="#2b2f33" stroke-width="0.3" />
    </g>
    <rect id="psu-132-crps-dc--handle" x="1.2" y="16.4" width="40.4" height="6.6" rx="0.5" fill="#17191c" stroke="#0b0d0f" stroke-width="0.3" data-path="psu-132-crps-dc/handle" data-class="handle" data-z-out="3.5" />
    <g id="psu-132-crps-dc--dc-input" data-path="psu-132-crps-dc/dc-input" data-class="terminal" data-z-out="2.0">
      <rect x="41.7" y="6.0" width="20.0" height="28.0" rx="0.8" fill="#101315" stroke="#4a4f55" stroke-width="0.4" />
      <g fill="#8d9297">
        <rect x="45.2" y="8.8" width="6.2" height="8.2" rx="0.4" />
        <rect x="52.4" y="8.8" width="6.2" height="8.2" rx="0.4" />
        <rect x="45.2" y="22.6" width="6.2" height="8.2" rx="0.4" />
        <rect x="52.4" y="22.6" width="6.2" height="8.2" rx="0.4" />
      </g>
      <rect x="43.4" y="18.4" width="16.6" height="2.6" rx="0.3" fill="#2b2f33" />
      <rect x="42.6" y="6.9" width="18.2" height="26.2" rx="0.6" fill="#c9ced4" fill-opacity="0.18" stroke="#c9ced4" stroke-width="0.25" />
    </g>
    <g id="psu-132-crps-dc--silkscreen" fill="#c9ced4" font-family="sans-serif" font-size="2.0" text-anchor="middle">
      <text x="51.7" y="5.4">V+</text>
      <text x="51.7" y="37.4">V-</text>
    </g>
    <rect id="psu-132-crps-dc--edge-strip" x="61.9" y="0.8" width="10.8" height="38.4" rx="0.5" fill="#c9ced4" />
    <rect id="psu-132-crps-dc--latch" x="62.5" y="12.7" width="5.3" height="18.8" rx="1.3" fill="#e0405f" stroke="#9c1d36" stroke-width="0.3" data-path="psu-132-crps-dc/latch" data-class="latch" data-z-out="1.2" />
    <circle id="psu-132-crps-dc--status-led" cx="68.0" cy="8.8" r="1.5" fill="var(--led-color, #3a3f44)" stroke="#8d9297" stroke-width="0.2" data-path="psu-132-crps-dc/status-led" data-class="led" data-states="off ok standby critical warning" data-description="HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output ON and OK), Blinking Green (standby: input power present with only +12VSB on, or the supply in smart standby; the boot-loader firmware-update row is visually identical and shares this state), Amber (a critical event causing shutdown - failure, overcurrent, short circuit, overvoltage, fan failure, overtemperature - and separately an input feed lost with a second supply still fed), Blinking Amber (warning events where the supply keeps operating - high temp, high power, high current, slow fan). The HIG's own DC procedure adds the plain-language version: 'when turned on, the LED on the PSU will light up with a Green color designating normal operation.'" data-z-dome="0.4" />
  </g>
</svg>
