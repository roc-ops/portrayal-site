<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="39.3mm" height="39.0mm" viewBox="0 0 39.3 39.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='celestica/fan-40@'] .state-fault { --led-color: #f59e0b; }
    g[data-ref^='celestica/fan-40@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-40" data-path="fan-40" data-class="fan" data-behaviour="fills" data-ref="celestica/fan-40@1:1.0.0" data-power-absent="not-published" transform="translate(0,0)">
    <title>fan-40</title>
    <defs>
      <pattern id="fan-40--fan40-hex" width="3.3" height="1.905" patternUnits="userSpaceOnUse">
        <path d="M 0.95 0 L 0.475 0.823 L -0.475 0.823 L -0.95 0 L -0.475 -0.823 L 0.475 -0.823 Z" fill="#0b0d0f" />
        <path d="M 4.25 0 L 3.775 0.823 L 2.825 0.823 L 2.35 0 L 2.825 -0.823 L 3.775 -0.823 Z" fill="#0b0d0f" />
        <path d="M 2.6 0.9525 L 2.125 1.7755 L 1.175 1.7755 L 0.7 0.9525 L 1.175 0.1295 L 2.125 0.1295 Z" fill="#0b0d0f" />
        <path d="M 0.95 1.905 L 0.475 2.728 L -0.475 2.728 L -0.95 1.905 L -0.475 1.082 L 0.475 1.082 Z" fill="#0b0d0f" />
        <path d="M 4.25 1.905 L 3.775 2.728 L 2.825 2.728 L 2.35 1.905 L 2.825 1.082 L 3.775 1.082 Z" fill="#0b0d0f" />
      </pattern>
    </defs>
    <rect id="fan-40--body" x="0" y="0" width="39.3" height="39" rx="1.6" fill="#17191c" stroke="#0b0d0f" stroke-width="0.3" data-fill-from="face-finish" />
    <path id="fan-40--grille-wire" fill="#a3a9b0" d="M 8.7 2.1 H 30.6 L 37.1 8.6 V 30.8 L 30.6 37.3 H 8.7 L 2.2 30.8 V 8.6 Z" />
    <path id="fan-40--grille-mesh" fill="url(#fan-40--fan40-hex)" d="M 8.7 2.1 H 30.6 L 37.1 8.6 V 30.8 L 30.6 37.3 H 8.7 L 2.2 30.8 V 8.6 Z" data-z-vent="20" />
    <rect id="fan-40--handle" x="0.4" y="16.2" width="38.5" height="6.7" rx="0.8" fill="#0e1012" stroke="#050607" stroke-width="0.25" data-fill-from="handle-finish" data-path="fan-40/handle" data-class="handle" data-z-out="5.0" />
    <rect id="fan-40--latch" x="0.3" y="16.9" width="1.7" height="5.3" rx="0.6" fill="#2f7fc1" data-fill-from="latch-finish" data-path="fan-40/latch" data-class="latch" data-z-out="5.4" />
    <circle id="fan-40--status-led" cx="3.7" cy="3.6" r="1.2" fill="var(--led-color, #c9ced3)" stroke="#4a4f55" stroke-width="0.2" data-path="fan-40/status-led" data-class="led" data-states="off ok fault" data-description="DS4000/DS4001 installation guide, Rear Panel Status LEDs, Fan module row - Green (all fans operating normally), Amber (fan(s) operating abnormally), Off (fan absent)" data-z-dome="0.4" />
  </g>
</svg>
