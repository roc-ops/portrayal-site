<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90.0mm" height="40.0mm" viewBox="0 0 90.0 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='arista/7010tx-fan@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='arista/7010tx-fan@'] .state-red { --led-color: #ef4444; }</style>
  <g id="7010tx-fan" data-path="7010tx-fan" data-class="fan" data-behaviour="fills" data-ref="arista/7010tx-fan@1:1.0.0" data-hot-swap="yes" data-redundancy="dual inline fans in one module" data-role="chassis-fan" data-states="ok fault absent" transform="translate(0,0)">
    <title>7010tx-fan</title>
    <rect id="7010tx-fan--slot" x="0" y="0" width="90" height="40" rx="0.8" fill="#3c4047" />
    <g id="7010tx-fan--labels">
      <rect id="7010tx-fan--label-inlet" x="0" y="0.6" width="10" height="38.8" rx="0.6" fill="#154269" />
      <rect id="7010tx-fan--label-exit" x="79.1" y="0.6" width="8.9" height="38.8" rx="0.6" fill="#832841" />
    </g>
    <g id="7010tx-fan--mod-b2f" data-show-from="airflow" data-show="back-to-front" display="none" transform="translate(15 1.3)">
      <rect id="7010tx-fan--plate-b2f" x="0" y="0" width="73" height="38.2" rx="1.2" fill="#bfc2cb" stroke="#7d818a" stroke-width="0.3" />
      <rect x="35" y="3.4" width="15.5" height="30.5" rx="1.0" fill="#202226" />
      <rect x="36.3" y="5.6" width="11.8" height="26.8" rx="0.6" fill="#dcdde2" />
      <rect x="36.8" y="4.4" width="3.2" height="3.8" rx="0.4" fill="#767a82" />
      <rect x="36.8" y="29.6" width="3.2" height="3.8" rx="0.4" fill="#767a82" />
      <rect x="30.5" y="11.4" width="15" height="14.5" rx="1.4" fill="#c4c7d0" stroke="#2b2d33" stroke-width="0.5" />
      <circle id="7010tx-fan--led-b2f" cx="5.0" cy="18.6" r="0.7" fill="var(--led-color, #1c1e22)" data-path="7010tx-fan/led-b2f" data-class="led" data-states="green red off" />
      <g fill="#2b4a7a" transform="translate(10.3 18.8)">
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(30)" />
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(120)" />
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(210)" />
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(300)" />
      </g>
      <g id="7010tx-fan--b2f-silkscreen">
        <text x="39.4" y="18.65" font-family="sans-serif" font-size="2.6" font-weight="bold" fill="#2b3a67" text-anchor="middle" transform="rotate(-90 39.4 18.65)">FAN</text>
        <text x="43.2" y="18.65" font-family="sans-serif" font-size="2.6" font-weight="bold" fill="#2b3a67" text-anchor="middle" transform="rotate(-90 43.2 18.65)">7010X</text>
      </g>
    </g>
    <g id="7010tx-fan--mod-f2b" data-show-from="airflow" data-show="front-to-back" transform="translate(2.3 1.3) rotate(180 36.5 19.1)">
      <rect id="7010tx-fan--plate-f2b" x="0" y="0" width="73" height="38.2" rx="1.2" fill="#bfc2cb" stroke="#7d818a" stroke-width="0.3" />
      <rect x="35" y="3.4" width="15.5" height="30.5" rx="1.0" fill="#202226" />
      <rect x="36.3" y="5.6" width="11.8" height="26.8" rx="0.6" fill="#dcdde2" />
      <rect x="36.8" y="4.4" width="3.2" height="3.8" rx="0.4" fill="#767a82" />
      <rect x="36.8" y="29.6" width="3.2" height="3.8" rx="0.4" fill="#767a82" />
      <rect x="30.5" y="11.4" width="15" height="14.5" rx="1.4" fill="#c4c7d0" stroke="#2b2d33" stroke-width="0.5" />
      <circle id="7010tx-fan--led-f2b" cx="5.0" cy="18.6" r="0.7" fill="var(--led-color, #1c1e22)" data-path="7010tx-fan/led-f2b" data-class="led" data-states="green red off" />
      <g fill="#2b4a7a" transform="translate(10.3 18.8)">
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(30)" />
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(120)" />
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(210)" />
        <ellipse cx="0" cy="-1.1" rx="0.6" ry="1.2" transform="rotate(300)" />
      </g>
      <g id="7010tx-fan--f2b-silkscreen">
        <text x="39.4" y="18.65" font-family="sans-serif" font-size="2.6" font-weight="bold" fill="#2b3a67" text-anchor="middle" transform="rotate(-90 39.4 18.65)">FAN</text>
        <text x="43.2" y="18.65" font-family="sans-serif" font-size="2.6" font-weight="bold" fill="#2b3a67" text-anchor="middle" transform="rotate(-90 43.2 18.65)">7010X</text>
      </g>
    </g>
    <g id="7010tx-fan--band-inlet" data-show-from="airflow" data-show="back-to-front" display="none">
      <path d="M 2.2 23.9 H 5.0 V 22.3 L 7.6 24.6 L 5.0 26.9 V 25.3 H 2.2 Z M 8.2 22.4 V 26.8" fill="#d8dde6" stroke="#d8dde6" stroke-width="0.5" />
      <g id="7010tx-fan--inlet-silkscreen">
        <text x="5.0" y="13.2" font-family="sans-serif" font-size="2.2" font-weight="bold" fill="#e4e8ee" text-anchor="middle">AIR</text>
        <text x="5.0" y="16.2" font-family="sans-serif" font-size="2.2" font-weight="bold" fill="#e4e8ee" text-anchor="middle">INLET</text>
      </g>
    </g>
    <g id="7010tx-fan--band-exit" data-show-from="airflow" data-show="front-to-back">
      <path d="M 87.0 23.9 H 84.2 V 22.3 L 81.6 24.6 L 84.2 26.9 V 25.3 H 87.0 Z M 81.0 22.4 V 26.8" fill="#e3d4da" stroke="#e3d4da" stroke-width="0.5" />
      <g id="7010tx-fan--exit-silkscreen">
        <text x="84.1" y="13.2" font-family="sans-serif" font-size="2.2" font-weight="bold" fill="#f0e3e8" text-anchor="middle">AIR</text>
        <text x="84.1" y="16.2" font-family="sans-serif" font-size="2.2" font-weight="bold" fill="#f0e3e8" text-anchor="middle">EXIT</text>
      </g>
    </g>
  </g>
</svg>
