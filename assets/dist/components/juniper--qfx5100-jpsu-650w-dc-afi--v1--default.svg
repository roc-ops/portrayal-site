<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54.8mm" height="39.8mm" viewBox="0 0 54.8 39.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/qfx5100-jpsu-650w-dc-afi@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/qfx5100-jpsu-650w-dc-afi@'] .state-green { --led-color: #39b54a; }</style>
  <g id="qfx5100-jpsu-650w-dc-afi" data-path="qfx5100-jpsu-650w-dc-afi" data-class="psu" data-behaviour="fills" data-ref="juniper/qfx5100-jpsu-650w-dc-afi@1:1.0.0" data-airflow="back-to-front" data-inlet="dc-terminal" data-input="rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide, Table 17)" data-model="JPSU-650W-DC-AFI" data-power-output-w="650" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>qfx5100-jpsu-650w-dc-afi</title>
    <rect id="qfx5100-jpsu-650w-dc-afi--face" x="0" y="0" width="54.8" height="39.8" rx="0.8" fill="#1c1e21" stroke="#181b1f" stroke-width="0.4" />
    <g id="qfx5100-jpsu-650w-dc-afi--vents" fill="#101214" stroke="#2b2e32" stroke-width="0.25">
      <rect x="13.8" y="24.6" width="6.6" height="5.0" rx="0.3" />
      <rect x="23.8" y="24.6" width="6.6" height="5.0" rx="0.3" />
      <rect x="34.2" y="24.6" width="6.6" height="5.0" rx="0.3" />
      <rect x="13.8" y="32.3" width="6.6" height="4.0" rx="0.3" />
      <rect x="23.8" y="32.3" width="6.6" height="4.0" rx="0.3" />
      <rect x="34.2" y="32.3" width="6.6" height="4.0" rx="0.3" />
      <rect x="43.0" y="19.6" width="4.4" height="4.8" rx="0.3" />
      <rect x="43.0" y="25.6" width="4.4" height="4.8" rx="0.3" />
    </g>
    <g id="qfx5100-jpsu-650w-dc-afi--terminal-block" data-path="qfx5100-jpsu-650w-dc-afi/terminal-block" data-class="terminal">
      <rect x="10.6" y="5.6" width="34.5" height="12.3" rx="0.6" fill="#33363b" stroke="#4a4e54" stroke-width="0.3" />
      <g fill="#8b9097" stroke="#5a5f66" stroke-width="0.3">
        <circle cx="14.8" cy="11.7" r="3.2" />
        <circle cx="23.2" cy="11.7" r="3.2" />
        <circle cx="31.5" cy="11.7" r="3.2" />
        <circle cx="39.8" cy="11.7" r="3.2" />
      </g>
      <g fill="none" stroke="#2b2e32" stroke-width="0.5">
        <path d="M 12.8 11.7 H 16.8 M 14.8 9.7 V 13.7" />
        <path d="M 21.2 11.7 H 25.2 M 23.2 9.7 V 13.7" />
        <path d="M 29.5 11.7 H 33.5 M 31.5 9.7 V 13.7" />
        <path d="M 37.8 11.7 H 41.8 M 39.8 9.7 V 13.7" />
      </g>
    </g>
    <circle id="qfx5100-jpsu-650w-dc-afi--terminal-screw" cx="49.1" cy="11.7" r="2.2" fill="#6b7077" stroke="#4a4e54" stroke-width="0.3" />
    <g id="qfx5100-jpsu-650w-dc-afi--silkscreen" font-family="sans-serif" font-weight="bold" fill="#d9dde1" text-anchor="middle">
      <text x="14.8" y="4.8" font-size="2.7">V-</text>
      <text x="23.2" y="4.8" font-size="2.7">V-</text>
      <text x="31.5" y="4.8" font-size="2.7">V+</text>
      <text x="39.8" y="4.8" font-size="2.7">V+</text>
      <text x="19.4" y="22.2" font-size="2.7">IN</text>
      <text x="29.7" y="22.2" font-size="2.7">OUT</text>
      <text x="39.3" y="22.2" font-size="2.7">!</text>
      <path d="M 51.3 32.8 V 36.4 M 49.7 36.4 H 52.9 M 50.3 37.3 H 52.3 M 50.8 38.2 H 51.8" fill="none" stroke="#d9dde1" stroke-width="0.35" />
    </g>
    <g id="qfx5100-jpsu-650w-dc-afi--lamps">
      <circle cx="14.7" cy="21.2" r="2.1" fill="#101214" stroke="#3a3e43" stroke-width="0.3" />
      <circle cx="24.1" cy="21.2" r="2.1" fill="#101214" stroke="#3a3e43" stroke-width="0.3" />
      <circle cx="35.1" cy="21.2" r="2.1" fill="#101214" stroke="#3a3e43" stroke-width="0.3" />
      <circle id="qfx5100-jpsu-650w-dc-afi--led-in" cx="14.7" cy="21.2" r="1.25" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5100-jpsu-650w-dc-afi/led-in" data-class="led" data-states="green off" />
      <circle id="qfx5100-jpsu-650w-dc-afi--led-out" cx="24.1" cy="21.2" r="1.25" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5100-jpsu-650w-dc-afi/led-out" data-class="led" data-states="green off" />
      <circle id="qfx5100-jpsu-650w-dc-afi--led-fault" cx="35.1" cy="21.2" r="1.25" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="qfx5100-jpsu-650w-dc-afi/led-fault" data-class="led" data-states="amber off" />
    </g>
    <circle id="qfx5100-jpsu-650w-dc-afi--esd-point" cx="45.5" cy="34.8" r="3.3" fill="#2b2e32" stroke="#4a4e54" stroke-width="0.4" />
    <g id="qfx5100-jpsu-650w-dc-afi--latch" data-path="qfx5100-jpsu-650w-dc-afi/latch" data-class="latch" data-z-out="1.6" data-z-color="#6ab3da">
      <rect x="2.4" y="0.9" width="8.0" height="38.4" rx="1.2" fill="#6ab3da" stroke="#3f86ad" stroke-width="0.4" />
    </g>
    <g id="qfx5100-jpsu-650w-dc-afi--lever" data-path="qfx5100-jpsu-650w-dc-afi/lever" data-class="latch">
      <rect x="48.5" y="10.9" width="6.3" height="19.4" rx="1.0" fill="#232528" stroke="#3a3e43" stroke-width="0.35" />
      <rect x="50.6" y="13.9" width="1.8" height="13.4" rx="0.6" fill="#08090a" />
    </g>
  </g>
</svg>
