<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="395.3mm" height="36.0mm" viewBox="0 0 395.3 36.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex8208-sf320@'] .state-failed { --led-color: #eab308; }
    g[data-ref^='juniper/ex8208-sf320@'] .state-offline { --led-color: #22c55e; }
    g[data-ref^='juniper/ex8208-sf320@'] .state-offline { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/ex8208-sf320@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='juniper/ex8208-sf320@'] .state-waiting { --led-color: #22c55e; }
    g[data-ref^='juniper/ex8208-sf320@'] .state-waiting { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="ex8208-sf320" data-path="ex8208-sf320" data-class="fabric" data-behaviour="fills" data-ref="juniper/ex8208-sf320@1:1.0.0" data-power-draw-max-w="100" data-role="switch-fabric" data-states="ok fail absent" transform="translate(0,0)">
    <title>ex8208-sf320</title>
    <rect id="ex8208-sf320--face" x="10.4" y="3.5" width="374.2" height="29.1" rx="0.6" fill="#d3d6d9" stroke="#8a8f94" stroke-width="0.4" />
    <rect id="ex8208-sf320--lever-left" x="7.2" y="28.8" width="117.8" height="3.5" rx="0.8" fill="#9ba0a6" stroke="#6d7278" stroke-width="0.3" data-path="ex8208-sf320/lever-left" data-class="latch" />
    <rect id="ex8208-sf320--lever-right" x="270.3" y="28.8" width="117.8" height="3.5" rx="0.8" fill="#9ba0a6" stroke="#6d7278" stroke-width="0.3" data-path="ex8208-sf320/lever-right" data-class="latch" />
    <g id="ex8208-sf320--screws" fill="#9ba0a6" stroke="#4a4f55" stroke-width="0.3">
      <circle cx="16.1" cy="4.7" r="2.1" />
      <circle cx="16.1" cy="16.6" r="2.1" />
      <circle cx="378.0" cy="3.9" r="2.1" />
      <circle cx="378.0" cy="15.5" r="2.1" />
      <circle cx="5.7" cy="16.0" r="2.4" />
      <circle cx="389.0" cy="16.0" r="2.4" />
    </g>
    <circle id="ex8208-sf320--led-st" cx="26.0" cy="12.2" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex8208-sf320/led-st" data-class="led" data-states="off ok waiting failed" />
    <circle id="ex8208-sf320--led-sf" cx="26.0" cy="16.6" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex8208-sf320/led-sf" data-class="led" data-states="off ok offline failed" />
    <g id="ex8208-sf320--silkscreen" font-family="sans-serif" fill="#2b2e33">
      <g font-size="1.5" text-anchor="start">
        <text x="28.0" y="12.7">ST</text>
        <text x="28.0" y="17.1">SF</text>
      </g>
      <text x="48.0" y="21.8" font-size="2.6">EX8208  SF320</text>
    </g>
  </g>
</svg>
