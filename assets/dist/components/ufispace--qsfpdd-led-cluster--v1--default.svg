<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="19.8mm" height="5.8mm" viewBox="0 0 19.8 5.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="qsfpdd-led-cluster" data-path="qsfpdd-led-cluster" data-class="led" data-ref="ufispace/qsfpdd-led-cluster@1:1.0.0" transform="translate(0,0)">
    <title>qsfpdd-led-cluster</title>
    <g id="qsfpdd-led-cluster--pipe-l" data-z-out="0.4">
      <rect x="0" y="0" width="2.2" height="5.8" rx="0.4" fill="#2f3a46" stroke="#1a1d20" stroke-width="0.15" />
      <rect id="qsfpdd-led-cluster--pipe-l-1" x="0.2" y="0.2" width="1.8" height="4.1" rx="0.3" fill="var(--led-color, #4a86c8)" data-path="qsfpdd-led-cluster/pipe-l-1" data-class="led" data-states="off on" />
      <rect id="qsfpdd-led-cluster--pipe-l-2" x="0.2" y="4.5" width="1.8" height="1.1" rx="0.25" fill="var(--led-color, #d6dde4)" data-path="qsfpdd-led-cluster/pipe-l-2" data-class="led" data-states="off on" />
    </g>
    <circle id="qsfpdd-led-cluster--lamp-l" cx="3.45" cy="1.85" r="0.95" fill="var(--led-color, #3f8a4a)" stroke="#1a1d20" stroke-width="0.15" data-path="qsfpdd-led-cluster/lamp-l" data-class="led" data-states="off on" />
    <circle id="qsfpdd-led-cluster--lamp-r" cx="16.15" cy="1.85" r="0.95" fill="var(--led-color, #3f8a4a)" stroke="#1a1d20" stroke-width="0.15" data-path="qsfpdd-led-cluster/lamp-r" data-class="led" data-states="off on" />
    <g id="qsfpdd-led-cluster--pipe-r" data-z-out="0.4">
      <rect x="17.6" y="0" width="2.2" height="5.8" rx="0.4" fill="#2f3a46" stroke="#1a1d20" stroke-width="0.15" />
      <rect id="qsfpdd-led-cluster--pipe-r-1" x="17.8" y="0.2" width="1.8" height="4.1" rx="0.3" fill="var(--led-color, #4a86c8)" data-path="qsfpdd-led-cluster/pipe-r-1" data-class="led" data-states="off on" />
      <rect id="qsfpdd-led-cluster--pipe-r-2" x="17.8" y="4.5" width="1.8" height="1.1" rx="0.25" fill="var(--led-color, #d6dde4)" data-path="qsfpdd-led-cluster/pipe-r-2" data-class="led" data-states="off on" />
    </g>
  </g>
</svg>
