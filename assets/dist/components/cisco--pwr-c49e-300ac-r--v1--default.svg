<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="115.7mm" height="39.5mm" viewBox="0 0 115.7 39.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/pwr-c49e-300ac-r@'] .state-fault { --led-color: #ef4444; }
    g[data-ref^='cisco/pwr-c49e-300ac-r@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="pwr-c49e-300ac-r" data-path="pwr-c49e-300ac-r" data-class="psu" data-behaviour="fills" data-ref="cisco/pwr-c49e-300ac-r@1:1.0.1" data-wall="#2b2e31" data-airflow="front-to-back" data-inlet="c14" data-input="ac" data-input-current-max="4 A at 100 VAC, 2 A at 240 VAC" data-input-frequency="47 to 63 Hz" data-input-voltage="low-line 85 to 132 VAC, high-line 170 to 264 VAC" data-model="PWR-C49E-300AC-R" data-output="25 A at +12 VDC" data-power-output-w="300" data-weight-kg="0.9" data-states="absent" transform="translate(0,0)">
    <title>pwr-c49e-300ac-r</title>
    <defs>
      <pattern id="pwr-c49e-300ac-r--c49e-mesh" width="6.6" height="3.82" patternUnits="userSpaceOnUse">
        <path d="M 1.9 0 L 0.95 1.65 L -0.95 1.65 L -1.9 0 L -0.95 -1.65 L 0.95 -1.65 Z" fill="#0d0f11" />
        <path d="M 8.5 0 L 7.55 1.65 L 5.65 1.65 L 4.7 0 L 5.65 -1.65 L 7.55 -1.65 Z" fill="#0d0f11" />
        <path d="M 5.2 1.91 L 4.25 3.56 L 2.35 3.56 L 1.4 1.91 L 2.35 0.26 L 4.25 0.26 Z" fill="#0d0f11" />
        <path d="M 1.9 3.82 L 0.95 5.47 L -0.95 5.47 L -1.9 3.82 L -0.95 2.17 L 0.95 2.17 Z" fill="#0d0f11" />
        <path d="M 8.5 3.82 L 7.55 5.47 L 5.65 5.47 L 4.7 3.82 L 5.65 2.17 L 7.55 2.17 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="pwr-c49e-300ac-r--body" x="0" y="0" width="115.7" height="39.5" rx="0.6" fill="#656469" stroke="#2b2e31" stroke-width="0.4" />
    <g id="pwr-c49e-300ac-r--screw" data-path="pwr-c49e-300ac-r/screw" data-class="screw">
      <circle cx="6.3" cy="19.4" r="3.0" fill="#d5d9dd" stroke="#7a8087" stroke-width="0.3" />
      <path d="M 4.6 19.4 H 8.0 M 6.3 17.7 V 21.1" stroke="#5c6167" stroke-width="0.45" />
    </g>
    <rect id="pwr-c49e-300ac-r--switch-surround" x="17.8" y="0.5" width="29.0" height="36.8" rx="1.0" fill="#4a4d51" />
    <g id="pwr-c49e-300ac-r--fan" data-path="pwr-c49e-300ac-r/fan" data-class="rotor" data-z-vent="24">
      <rect id="pwr-c49e-300ac-r--fan-back" x="50.5" y="1.2" width="38.1" height="37.2" rx="0.6" fill="#9aa1a8" />
      <rect id="pwr-c49e-300ac-r--fan-holes" x="50.5" y="1.2" width="38.1" height="37.2" fill="url(#pwr-c49e-300ac-r--c49e-mesh)" />
    </g>
    <circle id="pwr-c49e-300ac-r--input-ok" cx="94.8" cy="34.0" r="1.2" fill="var(--led-color, #2b2e31)" stroke="#9aa1a8" stroke-width="0.2" data-path="pwr-c49e-300ac-r/input-ok" data-class="led" data-states="off ok fault" />
    <circle id="pwr-c49e-300ac-r--output-ok" cx="103.2" cy="34.0" r="1.2" fill="var(--led-color, #2b2e31)" stroke="#9aa1a8" stroke-width="0.2" data-path="pwr-c49e-300ac-r/output-ok" data-class="led" data-states="off ok fault" />
    <g id="pwr-c49e-300ac-r--silkscreen" font-family="sans-serif" fill="#e4e7ea">
      <text id="pwr-c49e-300ac-r--silk-model" x="99.0" y="4.6" font-size="1.5" text-anchor="middle">PWR-C49E-300AC-R</text>
      <text id="pwr-c49e-300ac-r--silk-volts" x="99.0" y="19.8" font-size="1.4" text-anchor="middle">100 - 240VAC</text>
      <text id="pwr-c49e-300ac-r--silk-amps" x="99.0" y="22.0" font-size="1.4" text-anchor="middle">4 - 2 A</text>
      <text id="pwr-c49e-300ac-r--silk-hertz" x="99.0" y="24.2" font-size="1.4" text-anchor="middle">50 - 60 Hz</text>
      <text id="pwr-c49e-300ac-r--silk-input" x="94.8" y="28.6" font-size="1.3" text-anchor="middle">INPUT</text>
      <text id="pwr-c49e-300ac-r--silk-input-ok" x="94.8" y="30.6" font-size="1.3" text-anchor="middle">OK</text>
      <text id="pwr-c49e-300ac-r--silk-output" x="103.2" y="28.6" font-size="1.3" text-anchor="middle">OUTPUT</text>
      <text id="pwr-c49e-300ac-r--silk-output-ok" x="103.2" y="30.6" font-size="1.3" text-anchor="middle">OK</text>
    </g>
    <rect id="pwr-c49e-300ac-r--handle" x="110.2" y="6.3" width="4.4" height="28.7" rx="2.2" fill="none" stroke="#2b2e31" stroke-width="1.2" data-path="pwr-c49e-300ac-r/handle" data-class="handle" data-z-uhandle="18.0" data-z-color="#3a3d41" />
    <g id="pwr-c49e-300ac-r--power-switch" data-path="pwr-c49e-300ac-r/power-switch" data-class="button" data-ref="common/rocker-switch@1:1.2.0" transform="translate(21.3,1.0)">
      <title>pwr-c49e-300ac-r--power-switch</title>
      <defs>
        <linearGradient id="pwr-c49e-300ac-r--power-switch--rise-left" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3b4045" />
          <stop offset="1" stop-color="#1c1f22" />
        </linearGradient>
        <linearGradient id="pwr-c49e-300ac-r--power-switch--rise-right" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#1c1f22" />
          <stop offset="1" stop-color="#3b4045" />
        </linearGradient>
      </defs>
      <g id="pwr-c49e-300ac-r--power-switch--bezel" data-z-out="1.5" data-z-color="#1d2023">
        <rect x="0.1" y="0.1" width="20.8" height="14.8" rx="0.8" fill="#1d2023" stroke="#55595e" stroke-width="0.2" />
      </g>
      <g id="pwr-c49e-300ac-r--power-switch--rocker" data-path="pwr-c49e-300ac-r/power-switch/rocker" data-class="button">
        <g id="pwr-c49e-300ac-r--power-switch--rocker-off" data-show-from="state" data-show="off" data-z-out="4.9" data-z-profile="0:4.9,17.5:2.2">
          <rect x="1.75" y="1.75" width="17.5" height="11.5" rx="0.5" fill="url(#pwr-c49e-300ac-r--power-switch--rise-left)" stroke="#44484d" stroke-width="0.2" />
          <rect x="1.75" y="1.75" width="17.5" height="11.5" rx="0.5" fill="none" fill-opacity="0.85" data-fill-from="rocker-color" />
          <line x1="4.4" y1="7.5" x2="7.2" y2="7.5" stroke="#e9ecef" stroke-width="0.6" />
          <circle cx="15.2" cy="7.5" r="1.35" fill="none" stroke="#e9ecef" stroke-width="0.5" />
        </g>
        <g id="pwr-c49e-300ac-r--power-switch--rocker-on" data-show-from="state" data-show="on" display="none" data-z-out="4.9" data-z-profile="0:2.2,17.5:4.9">
          <rect x="1.75" y="1.75" width="17.5" height="11.5" rx="0.5" fill="url(#pwr-c49e-300ac-r--power-switch--rise-right)" stroke="#44484d" stroke-width="0.2" />
          <rect x="1.75" y="1.75" width="17.5" height="11.5" rx="0.5" fill="none" fill-opacity="0.85" data-fill-from="rocker-color" />
          <line x1="4.4" y1="7.5" x2="7.2" y2="7.5" stroke="#e9ecef" stroke-width="0.6" />
          <circle cx="15.2" cy="7.5" r="1.35" fill="none" stroke="#e9ecef" stroke-width="0.5" />
        </g>
      </g>
    </g>
    <g id="pwr-c49e-300ac-r--inlet" data-path="pwr-c49e-300ac-r/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(18.3,16.6) rotate(180 14.0 10.0)">
      <title>pwr-c49e-300ac-r--inlet</title>
      <rect id="pwr-c49e-300ac-r--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="pwr-c49e-300ac-r/inlet/opening" data-class="cutout" />
      <path id="pwr-c49e-300ac-r--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="pwr-c49e-300ac-r--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="pwr-c49e-300ac-r--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="pwr-c49e-300ac-r--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
