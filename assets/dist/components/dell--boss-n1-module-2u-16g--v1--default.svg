        <rect id="boss-n1-module-2u-16g--carrier-0--module--led-activity" x="14.80" y="4.36" width="1.3" height="1.3" rx="0.15" fill="var(--led-color, #8a8e92)" data-path="boss-n1-module-2u-16g/carrier-0/module/led-activity" data-class="led" data-states="off activity" data-description="the activity lamp, beside the activity icon; blinks green on I/O and rebuild" />
