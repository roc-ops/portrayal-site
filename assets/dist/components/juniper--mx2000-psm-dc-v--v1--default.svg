<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="44.0mm" height="430.0mm" viewBox="0 0 44.0 430.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="mx2000-psm-dc-v" data-path="mx2000-psm-dc-v" data-class="psu" data-behaviour="fills" data-ref="juniper/mx2000-psm-dc-v@1:1.0.0" data-model="MX2000 DC PSM (-48 V)" data-redundancy="8+1" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>mx2000-psm-dc-v</title>
    <rect id="mx2000-psm-dc-v--face" x="0" y="0" width="44.0" height="430.0" rx="0.8" fill="#9a9ea3" stroke="#7d8288" stroke-width="0.5" />
    <g id="mx2000-psm-dc-v--breaker">
      <rect id="mx2000-psm-dc-v--switch" x="14.0" y="18.0" width="16.0" height="24.0" rx="2.0" fill="#26292d" stroke="#17191c" stroke-width="0.5" />
      <rect x="18.5" y="24.0" width="7.0" height="12.0" rx="1.4" fill="#565b61" />
    </g>
    <g id="mx2000-psm-dc-v--side-up">
      <rect x="14.5" y="62.0" width="15.0" height="42.0" rx="1.2" fill="#f0f1f2" stroke="#c0c4c8" stroke-width="0.4" />
      <g id="mx2000-psm-dc-v--t60-silkscreen">
        <text x="22.0" y="83.0" font-family="Arial" font-size="1.3" fill="#6d7278" text-anchor="middle" transform="rotate(-90 22.0 83.0)">THIS SIDE UP</text>
      </g>
    </g>
    <g id="mx2000-psm-dc-v--pull">
      <rect x="16.0" y="150.0" width="12.0" height="130.0" rx="6.0" fill="none" stroke="#7d8288" stroke-width="2.6" />
    </g>
    <g id="mx2000-psm-dc-v--label-patch">
      <rect x="8.0" y="300.0" width="28.0" height="90.0" rx="1.6" fill="#e6e8ea" stroke="#c0c4c8" stroke-width="0.4" />
    </g>
    <g id="mx2000-psm-dc-v--lamps">
      <circle id="mx2000-psm-dc-v--led-ps-fail" cx="12.0" cy="410.0" r="1.0" fill="#0f1113" stroke="#33373c" stroke-width="0.25" />
      <circle id="mx2000-psm-dc-v--led-out-ok" cx="22.0" cy="410.0" r="1.0" fill="var(--led-color, #3a3f44)" stroke="#33373c" stroke-width="0.25" />
      <circle id="mx2000-psm-dc-v--led-in-ok" cx="32.0" cy="410.0" r="1.0" fill="#0f1113" stroke="#33373c" stroke-width="0.25" />
    </g>
    <g id="mx2000-psm-dc-v--silkscreen">
      <g id="mx2000-psm-dc-v--t61-silkscreen">
        <text x="22.0" y="12.0" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="middle">INPUT</text>
      </g>
      <g id="mx2000-psm-dc-v--t62-silkscreen">
        <text x="22.0" y="145.0" font-family="Arial" font-size="1.5" fill="#3a3e43" text-anchor="middle">DC PSM</text>
      </g>
      <g id="mx2000-psm-dc-v--t63-silkscreen">
        <text x="12.0" y="415.5" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="middle">IN</text>
      </g>
      <g id="mx2000-psm-dc-v--t64-silkscreen">
        <text x="22.0" y="415.5" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="middle">OUT</text>
      </g>
      <g id="mx2000-psm-dc-v--t65-silkscreen">
        <text x="32.0" y="415.5" font-family="Arial" font-size="0.9" fill="#3a3e43" text-anchor="middle">!</text>
      </g>
    </g>
  </g>
</svg>
