    <path id="pcie-bracket-fh-2slot--window-1" d="M25.38 7.67 H31.23 V6.35 H103.07 V7.67 H107.31 V18.41 H25.38 Z" fill="#1b1f22" stroke="#41474d" stroke-width="0.35" data-path="pcie-bracket-fh-2slot/window-1" data-class="cutout" data-description="the I/O and venting window of the first slot, the one the card's PCB sits in" />
    <rect id="pcie-bracket-fh-2slot--window-2" x="25.38" y="26.67" width="81.93" height="12.06" rx="1.0" fill="#1b1f22" stroke="#41474d" stroke-width="0.35" data-path="pcie-bracket-fh-2slot/window-2" data-class="cutout" data-description="the I/O and venting window of the slot the card covers" />
