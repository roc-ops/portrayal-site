<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="76.0mm" height="39.8mm" viewBox="0 0 76.0 39.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex4500-psu-dc-fb@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/ex4500-psu-dc-fb@'] .state-green { --led-color: #39b54a; }</style>
  <g id="ex4500-psu-dc-fb" data-path="ex4500-psu-dc-fb" data-class="psu" data-behaviour="fills" data-ref="juniper/ex4500-psu-dc-fb@1:1.0.0" data-airflow="front-to-back" data-inlet="dc-terminal" data-input="-42 to -60 VDC, nominal -48 VDC, 30 A maximum (guide Table 42)" data-power-output-w="1200" data-role="dc-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex4500-psu-dc-fb</title>
    <rect id="ex4500-psu-dc-fb--face" x="0" y="0" width="76" height="39.8" rx="0.8" fill="#2c2f33" stroke="#17191c" stroke-width="0.4" />
    <g id="ex4500-psu-dc-fb--lever" data-path="ex4500-psu-dc-fb/lever" data-class="latch" data-z-out="1.2">
      <rect x="0.4" y="12.0" width="3.6" height="16.0" rx="0.8" fill="#3fa34d" stroke="#26632f" stroke-width="0.3" data-fill-from="handle-finish" data-stroke-derive="handle-finish" />
    </g>
    <g id="ex4500-psu-dc-fb--terminal-block">
      <rect x="4.6" y="6.0" width="24.0" height="27.8" rx="1.0" fill="#1c1e21" stroke="#4a4e54" stroke-width="0.4" />
      <g id="ex4500-psu-dc-fb--term-neg" data-path="ex4500-psu-dc-fb/term-neg" data-class="screw">
        <circle cx="8.4" cy="12.6" r="2.4" fill="#b9bdc2" stroke="#6f7378" stroke-width="0.3" />
        <path d="M 7.2 12.6 H 9.6 M 8.4 11.4 V 13.8" stroke="#4d5156" stroke-width="0.4" />
      </g>
      <g id="ex4500-psu-dc-fb--term-pos" data-path="ex4500-psu-dc-fb/term-pos" data-class="screw">
        <circle cx="8.4" cy="27.4" r="2.4" fill="#b9bdc2" stroke="#6f7378" stroke-width="0.3" />
        <path d="M 7.2 27.4 H 9.6 M 8.4 26.2 V 28.6" stroke="#4d5156" stroke-width="0.4" />
      </g>
      <rect x="13.4" y="8.6" width="12.6" height="22.6" rx="0.8" fill="#26292d" stroke="#3a3e43" stroke-width="0.3" />
    </g>
    <g id="ex4500-psu-dc-fb--fan-grille">
      <circle cx="59.0" cy="21.0" r="15.4" fill="#17191c" stroke="#4a4e54" stroke-width="0.4" />
      <circle cx="59.0" cy="21.0" r="11.6" fill="none" stroke="#3a3e43" stroke-width="0.4" />
      <circle cx="59.0" cy="21.0" r="7.6" fill="none" stroke="#3a3e43" stroke-width="0.4" />
      <circle cx="59.0" cy="21.0" r="3.2" fill="#3a3e43" />
      <path d="M 59 5.6 V 36.4 M 43.6 21 H 74.4 M 48.1 10.1 L 69.9 31.9 M 69.9 10.1 L 48.1 31.9" stroke="#3a3e43" stroke-width="0.35" />
    </g>
    <g id="ex4500-psu-dc-fb--handle">
      <rect x="38.0" y="18.4" width="38.0" height="5.0" rx="2.5" fill="#b9bdc2" stroke="#6f7378" stroke-width="0.3" transform="rotate(-54 57 21)" />
      <circle cx="65.2" cy="5.8" r="2.1" fill="#8d9197" stroke="#4d5156" stroke-width="0.3" />
      <circle cx="48.8" cy="36.2" r="2.1" fill="#8d9197" stroke="#4d5156" stroke-width="0.3" />
    </g>
    <circle id="ex4500-psu-dc-fb--led-status" cx="33.6" cy="33.9" r="1.2" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex4500-psu-dc-fb/led-status" data-class="led" data-states="green amber off" />
    <g id="ex4500-psu-dc-fb--silkscreen">
      <text x="30.4" y="36.8" font-family="sans-serif" font-size="1.7" fill="#d8dcdf" text-anchor="end">POK</text>
    </g>
  </g>
</svg>
