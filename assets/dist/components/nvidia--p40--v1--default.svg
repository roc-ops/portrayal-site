    <path id="p40--flange-fold" d="M119.6 0.6 V39.4" stroke="#5f666d" stroke-width="0.3" fill="none" data-z-out="9.4" data-z-color="#9aa1a8" />
    <defs>
      <pattern id="p40--truss" patternUnits="userSpaceOnUse" x="22.0" y="7.5" width="14.5" height="14.5">
        <path d="M0 0 L14.5 14.5 M14.5 0 L0 14.5" stroke="#a7aeb5" stroke-width="1.3" fill="none" />
      </pattern>
    </defs>
    <g id="p40--grille" data-path="p40/grille" data-class="bezel" data-z-out="0.8" data-z-color="#9aa1a8">
      <rect x="20.0" y="6.5" width="89.0" height="31.0" rx="2.0" fill="#a7aeb5" stroke="#5f666d" stroke-width="0.35" />
      <rect id="p40--vent" x="22.0" y="7.5" width="86.0" height="29.0" rx="1.0" fill="#141618" stroke="#41474d" stroke-width="0.3" data-path="p40/vent" data-class="vent" />
      <rect x="22.0" y="7.5" width="86.0" height="29.0" fill="url(#p40--truss)" />
      <g id="p40--screw-1" data-path="p40/screw-1" data-class="screw">
        <circle cx="21.0" cy="22.0" r="1.5" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25" />
        <circle cx="21.0" cy="22.0" r="0.55" fill="#4a4f55" />
      </g>
    </g>
  </g>
</svg>
