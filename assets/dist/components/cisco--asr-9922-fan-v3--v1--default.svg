<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="475.95mm" height="38.1mm" viewBox="0 0 475.95 38.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/asr-9922-fan-v3@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/asr-9922-fan-v3@'] .state-red { --led-color: #d0021b; }
    g[data-ref^='cisco/asr-9922-fan-v3@'] .state-yellow { --led-color: #f5c518; }</style>
  <g id="asr-9922-fan-v3" data-path="asr-9922-fan-v3" data-class="fan" data-behaviour="fills" data-ref="cisco/asr-9922-fan-v3@1:1.1.2" data-body-depth="584.2" data-wall="#4a4f55" data-eol="none-announced" data-fans="12 x 120 mm axial" data-model="ASR-9922-FAN-V3" data-power-draw-max-w="2800" data-role="fan-tray" data-weight-kg="8.16" transform="translate(0,0)">
    <title>asr-9922-fan-v3</title>
    <rect id="asr-9922-fan-v3--plate" x="20.48" y="2.38" width="434.97" height="35.72" rx="1.2" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.4" />
    <rect x="20.32" y="0" width="434.97" height="3.18" fill="#c8cdd2" />
    <g id="asr-9922-fan-v3--grip-l" data-z-out="4.2">
      <rect x="0" y="0.79" width="20.96" height="35.72" rx="2.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <g id="asr-9922-fan-v3--grip-r" data-z-out="4.2">
      <rect x="454.97" y="0.79" width="20.98" height="35.72" rx="2.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <g id="asr-9922-fan-v3--handle" data-z-uhandle="8.0">
      <rect x="183.09" y="15.45" width="109.85" height="7.2" rx="2.4" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="0.35" />
      <rect x="179.49" y="15.03" width="8.04" height="8.04" rx="1.2" fill="#c8cdd2" stroke="#9aa0a6" stroke-width="0.3" />
      <rect x="288.69" y="15.03" width="8.04" height="8.04" rx="1.2" fill="#c8cdd2" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <circle id="asr-9922-fan-v3--status" cx="34.0" cy="24.0" r="1.5" fill="var(--led-color, #39b54a)" stroke="#9aa0a6" stroke-width="0.25" data-path="asr-9922-fan-v3/status" data-class="led" data-states="green yellow red off" data-description="the fan tray's Run/Fail status LED, one per tray." data-z-dome="0.3" />
    <g id="asr-9922-fan-v3--silkscreen">
      <text x="39.0" y="30.3" transform="rotate(-90 39.0 30.3)" font-family="sans-serif" font-size="3.4" font-weight="bold" fill="#231f20">FAN STATUS</text>
      <rect x="229.47" y="4.35" width="18.57" height="8.77" rx="0.6" fill="#ffff99" stroke="#8a7a00" stroke-width="0.3" />
      <text x="238.75" y="11.19" font-family="sans-serif" font-size="6.31" font-weight="bold" text-anchor="middle" fill="#231f20">!</text>
      <rect x="229.47" y="25.78" width="18.57" height="8.77" rx="0.6" fill="#ffff99" stroke="#8a7a00" stroke-width="0.3" />
      <text x="238.75" y="32.62" font-family="sans-serif" font-size="6.31" font-weight="bold" text-anchor="middle" fill="#231f20">!</text>
      <rect x="444.39" y="4.0" width="6.4" height="30.5" fill="#ffffff" stroke="#6d7379" stroke-width="0.25" />
      <text x="448.09" y="34.5" transform="rotate(-90 448.09 34.5)" font-family="sans-serif" font-size="3.4" font-weight="bold" fill="#231f20">ASR-9922-FAN-V3</text>
    </g>
  </g>
</svg>
