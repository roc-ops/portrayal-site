<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="63.0mm" height="62.6mm" viewBox="0 0 63.0 62.6">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="dcs500-fan" data-path="dcs500-fan" data-class="fan" data-behaviour="fills" data-ref="edgecore/dcs500-fan@1:1.0.0" data-wall="#15181b" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>dcs500-fan</title>
    <defs>
      <pattern id="dcs500-fan--dcs500-fan-mesh" width="4.390" height="7.603" patternUnits="userSpaceOnUse">
        <path d="M 0.000 -2.147 L -1.860 -1.073 L -1.860 1.073 L 0.000 2.147 L 1.860 1.073 L 1.860 -1.073 Z" fill="#0b0d0f" />
        <path d="M 4.390 -2.147 L 2.530 -1.073 L 2.530 1.073 L 4.390 2.147 L 6.250 1.073 L 6.250 -1.073 Z" fill="#0b0d0f" />
        <path d="M 2.195 1.654 L 0.335 2.729 L 0.335 4.875 L 2.195 5.949 L 4.055 4.875 L 4.055 2.729 Z" fill="#0b0d0f" />
        <path d="M 0.000 5.456 L -1.860 6.530 L -1.860 8.676 L 0.000 9.751 L 1.860 8.676 L 1.860 6.530 Z" fill="#0b0d0f" />
        <path d="M 4.390 5.456 L 2.530 6.530 L 2.530 8.676 L 4.390 9.751 L 6.250 8.676 L 6.250 6.530 Z" fill="#0b0d0f" />
      </pattern>
    </defs>
    <rect id="dcs500-fan--body" x="0" y="0" width="63" height="62.6" rx="0.5" fill="#2b2f34" stroke="#1b1e22" stroke-width="0.4" />
    <g id="dcs500-fan--grille" data-path="dcs500-fan/grille" data-class="rotor" data-z-vent="55">
      <rect x="1.60" y="1.60" width="54.40" height="59.40" rx="0.4" fill="#9aa1a8" />
      <rect x="1.60" y="1.60" width="54.40" height="59.40" fill="url(#dcs500-fan--dcs500-fan-mesh)" />
      <circle cx="28.80" cy="31.30" r="22.50" fill="#e6eaec" fill-opacity="0.16" />
      <circle cx="28.80" cy="31.30" r="6.50" fill="#aab1b8" fill-opacity="0.25" />
    </g>
    <g id="dcs500-fan--handle" data-path="dcs500-fan/handle" data-class="handle" data-z-uhandle="24" data-z-dia="5.0">
      <rect x="57.00" y="19.40" width="6.00" height="27.70" rx="2.60" fill="#c0453f" stroke="#7d2b27" stroke-width="0.28" data-fill-from="handle-finish" />
      <rect x="58.60" y="21.40" width="2.80" height="23.70" rx="1.20" fill="none" stroke="#e2867f" stroke-width="0.32" />
    </g>
  </g>
</svg>
