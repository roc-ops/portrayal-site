    <rect id="dc-terminal-24--lip-top" x="0.45" y="0.45" width="23.7" height="2.6" rx="0.3" fill="#dde2e7" stroke="#8d949b" stroke-width="0.16" data-z-out="9.0" data-z-color="#dde2e7" />
    <rect id="dc-terminal-24--lip-bottom" x="0.45" y="11.35" width="23.7" height="2.6" rx="0.3" fill="#dde2e7" stroke="#8d949b" stroke-width="0.16" data-z-out="9.0" data-z-color="#dde2e7" />
