    <rect id="dc-terminal-24--pole-2" x="10.05" y="3.6" width="6.0" height="7.4" rx="0.3" fill="#eef1f4" stroke="#6e757c" stroke-width="0.18" data-path="dc-terminal-24/pole-2" data-class="terminal" data-z-out="7.9" data-z-color="#7d848c" />
    <rect id="dc-terminal-24--pole-3" x="17.6" y="3.6" width="6.0" height="7.4" rx="0.3" fill="#eef1f4" stroke="#6e757c" stroke-width="0.18" data-path="dc-terminal-24/pole-3" data-class="terminal" data-z-out="7.9" data-z-color="#7d848c" />
    <circle id="dc-terminal-24--screw-1" cx="5.5" cy="7.2" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" data-z-cyl="1.2" data-z-lift="7.9" data-z-color="#c3c9cf" />
    <circle id="dc-terminal-24--screw-2" cx="13.05" cy="7.2" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" data-z-cyl="1.2" data-z-lift="7.9" data-z-color="#c3c9cf" />
    <circle id="dc-terminal-24--screw-3" cx="20.6" cy="7.2" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2" data-z-cyl="1.2" data-z-lift="7.9" data-z-color="#c3c9cf" />
    <g id="dc-terminal-24--slots" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round">
      <path d="M 4.15 7.2 H 6.85 M 5.5 5.85 V 8.55" />
      <path d="M 11.7 7.2 H 14.4 M 13.05 5.85 V 8.55" />
      <path d="M 19.25 7.2 H 21.95 M 20.6 5.85 V 8.55" />
    </g>
    <g data-cp="dc-in" data-cp-at="13.05 7.2" data-cp-dir="front" />
  </g>
</svg>
