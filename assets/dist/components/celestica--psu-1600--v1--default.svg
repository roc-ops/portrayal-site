<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40.0mm" viewBox="0 0 73.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='celestica/psu-1600@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='celestica/psu-1600@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='celestica/psu-1600@'] .state-standby { --led-color: #f59e0b; }</style>
  <g id="psu-1600" data-path="psu-1600" data-class="psu" data-behaviour="fills" data-ref="celestica/psu-1600@1:1.3.0" data-input="ac" data-model="G1482-1600WRA" data-output-v="54.5" data-part-number="PR0B" data-power-output-low-line-w="1000" data-power-output-w="1600" data-vendor="Gospower" transform="translate(0,0)">
    <title>psu-1600</title>
    <rect id="psu-1600--body" x="0" y="0" width="73.5" height="40" rx="0.6" fill="#b9bec4" stroke="#8a9099" stroke-width="0.4" />
    <g id="psu-1600--fan">
      <circle id="psu-1600--fan-bore" cx="16" cy="20" r="13.5" fill="#17191c" />
      <g id="psu-1600--fan-guard" fill="none" stroke="#c9cdd1" stroke-width="0.7" data-z-dome="1.2">
        <circle cx="16" cy="20" r="13.2" />
        <circle cx="16" cy="20" r="9.4" />
        <circle cx="16" cy="20" r="5.6" />
        <circle cx="16" cy="20" r="2.0" fill="#8a9099" />
        <line x1="16" y1="6.8" x2="16" y2="33.2" />
        <line x1="2.8" y1="20" x2="29.2" y2="20" />
        <line x1="6.7" y1="10.7" x2="25.3" y2="29.3" />
        <line x1="6.7" y1="29.3" x2="25.3" y2="10.7" />
      </g>
    </g>
    <circle id="psu-1600--screw-a" cx="69" cy="9" r="1.4" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.25" />
    <circle id="psu-1600--screw-b" cx="69" cy="20" r="1.4" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.25" />
    <rect id="psu-1600--latch" x="60.5" y="8" width="4.2" height="21" rx="1" fill="#4b3f9e" stroke="#332a70" stroke-width="0.3" data-path="psu-1600/latch" data-class="latch" data-z-out="2.6" />
    <rect id="psu-1600--handle" x="3" y="12" width="26" height="4" rx="2" fill="#17191c" stroke="#0d0f11" stroke-width="0.3" data-path="psu-1600/handle" data-class="handle" data-z-uhandle="14" />
    <path id="psu-1600--inlet-frame" fill-rule="evenodd" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.3" d="     M 30.3 8 h 27.4 a 0.8 0.8 0 0 1 0.8 0.8 v 20.4 a 0.8 0.8 0 0 1 -0.8 0.8 h -27.4 a 0.8 0.8 0 0 1 -0.8 -0.8 v -20.4 a 0.8 0.8 0 0 1 0.8 -0.8 z     M 30.5 9 h 28 v 20 h -28 z" data-z-out="1.6" />
    <circle id="psu-1600--status-led" cx="69" cy="32.5" r="1.5" fill="var(--led-color, #3a3f44)" data-path="psu-1600/status-led" data-class="led" data-states="off ok fail standby" data-z-dome="0.4" />
    <g id="psu-1600--inlet" data-path="psu-1600/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(30.5,9)">
      <title>psu-1600--inlet</title>
      <rect id="psu-1600--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-1600/inlet/opening" data-class="cutout" />
      <path id="psu-1600--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-1600--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-1600--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-1600--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="42.75 19" data-cp-dir="front" />
  </g>
</svg>
