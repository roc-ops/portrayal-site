<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="425.4mm" height="35.4mm" viewBox="0 0 425.4 35.4">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="sr-7-12-slot-impedance-panel" data-path="sr-7-12-slot-impedance-panel" data-class="blank" data-behaviour="fills" data-ref="nokia/sr-7-12-slot-impedance-panel@1:1.0.0" data-model="SR-7/SR-12 Card Slot Impedance Panel" data-role="slot-blank" transform="translate(0,0)">
    <title>sr-7-12-slot-impedance-panel</title>
    <path id="sr-7-12-slot-impedance-panel--face" d="M 15.1 0 H 410.3 V 2.6 H 423.4 Q 425.4 2.6 425.4 4.6 V 30.8 Q 425.4 32.8 423.4 32.8 H 410.3 V 35.4 H 15.1 V 32.8 H 2.0 Q 0 32.8 0 30.8 V 4.6 Q 0 2.6 2.0 2.6 H 15.1 Z" fill="#2e3034" stroke="#1a1c1f" stroke-width="0.3" />
    <path id="sr-7-12-slot-impedance-panel--end-steps" d="M 15.1 0.3 V 2.6 M 15.1 32.8 V 35.1 M 410.3 0.3 V 2.6 M 410.3 32.8 V 35.1" stroke="#1a1c1f" stroke-width="0.25" />
    <rect id="sr-7-12-slot-impedance-panel--logo-zone" x="192.7" y="13.7" width="40.0" height="8.0" fill="none" data-path="sr-7-12-slot-impedance-panel/logo-zone" data-class="label" />
    <g id="sr-7-12-slot-impedance-panel--screw-left" data-path="sr-7-12-slot-impedance-panel/screw-left" data-class="screw" data-z-cyl="1.6">
      <circle cx="6.8" cy="22.6" r="4.9" fill="#b9bcc0" stroke="#6f757c" stroke-width="0.3" />
      <circle cx="6.8" cy="22.6" r="3.9" fill="none" stroke="#6f757c" stroke-width="0.25" />
      <path d="M 3.9 24.3 L 9.7 20.9" stroke="#55595e" stroke-width="0.7" />
    </g>
    <g id="sr-7-12-slot-impedance-panel--screw-right" data-path="sr-7-12-slot-impedance-panel/screw-right" data-class="screw" data-z-cyl="1.6">
      <circle cx="418.6" cy="22.6" r="4.9" fill="#b9bcc0" stroke="#6f757c" stroke-width="0.3" />
      <circle cx="418.6" cy="22.6" r="3.9" fill="none" stroke="#6f757c" stroke-width="0.25" />
      <path d="M 415.7 24.3 L 421.5 20.9" stroke="#55595e" stroke-width="0.7" />
    </g>
    <g data-cp="mate" data-cp-at="212.7 17.7" data-cp-dir="rear" />
  </g>
</svg>
