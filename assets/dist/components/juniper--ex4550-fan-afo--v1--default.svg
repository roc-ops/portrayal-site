<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="41.6mm" height="40.0mm" viewBox="0 0 41.6 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ex4550-fan-afo" data-path="ex4550-fan-afo" data-class="fan" data-behaviour="fills" data-ref="juniper/ex4550-fan-afo@1:1.0.0" data-airflow="front-to-back" data-power-draw-max-w="16.8" data-power-draw-typical-w="4.8" data-role="chassis-fan" data-states="absent" transform="translate(0,0)">
    <title>ex4550-fan-afo</title>
    <defs>
      <pattern id="ex4550-fan-afo--hex" width="2.6" height="4.5" patternUnits="userSpaceOnUse">
        <polygon points="1.3,0.1 2.25,0.65 2.25,1.75 1.3,2.3 0.35,1.75 0.35,0.65" fill="#050607" />
        <polygon points="0,2.35 0.95,2.9 0.95,4.0 0,4.55 -0.95,4.0 -0.95,2.9" fill="#050607" />
        <polygon points="2.6,2.35 3.55,2.9 3.55,4.0 2.6,4.55 1.65,4.0 1.65,2.9" fill="#050607" />
      </pattern>
    </defs>
    <rect id="ex4550-fan-afo--face" x="0.2" y="0.2" width="41.2" height="39.6" rx="2.0" fill="#e8731f" stroke="#8e4613" stroke-width="0.4" data-fill-from="handle-finish" data-stroke-derive="handle-finish" />
    <g id="ex4550-fan-afo--grille-top">
      <rect x="7.0" y="2.6" width="27.6" height="11.4" rx="3.2" fill="#1a1d20" />
      <rect x="7.0" y="2.6" width="27.6" height="11.4" rx="3.2" fill="url(#ex4550-fan-afo--hex)" />
    </g>
    <g id="ex4550-fan-afo--grille-bottom">
      <rect x="7.0" y="25.9" width="27.6" height="11.4" rx="3.2" fill="#1a1d20" />
      <rect x="7.0" y="25.9" width="27.6" height="11.4" rx="3.2" fill="url(#ex4550-fan-afo--hex)" />
    </g>
    <g id="ex4550-fan-afo--handle" data-path="ex4550-fan-afo/handle" data-class="latch" data-z-out="2.0">
      <rect x="4.6" y="15.6" width="32.4" height="8.6" rx="2.6" fill="#e8731f" stroke="#8e4613" stroke-width="0.35" data-fill-from="handle-finish" data-stroke-derive="handle-finish" />
      <rect x="4.6" y="15.6" width="32.4" height="8.6" rx="2.6" fill="#ffffff" fill-opacity="0.22" />
      <rect x="0.6" y="17.5" width="5.0" height="4.8" rx="0.6" fill="#000000" fill-opacity="0.2" />
      <rect x="36.0" y="17.5" width="5.0" height="4.8" rx="0.6" fill="#000000" fill-opacity="0.2" />
      <rect id="ex4550-fan-afo--airflow-chip" x="11.4" y="16.7" width="18.8" height="6.4" rx="0.7" fill="#6f7377" />
      <g id="ex4550-fan-afo--fan-symbol">
        <circle cx="14.6" cy="19.9" r="0.45" fill="#e8731f" data-fill-from="handle-finish" />
        <ellipse cx="14.6" cy="18.8" rx="0.6" ry="0.95" fill="#e8731f" data-fill-from="handle-finish" />
        <ellipse cx="14.6" cy="18.8" rx="0.6" ry="0.95" fill="#e8731f" data-fill-from="handle-finish" transform="rotate(90 14.6 19.9)" />
        <ellipse cx="14.6" cy="18.8" rx="0.6" ry="0.95" fill="#e8731f" data-fill-from="handle-finish" transform="rotate(180 14.6 19.9)" />
        <ellipse cx="14.6" cy="18.8" rx="0.6" ry="0.95" fill="#e8731f" data-fill-from="handle-finish" transform="rotate(270 14.6 19.9)" />
      </g>
      <g id="ex4550-fan-afo--silkscreen">
        <text x="23.4" y="19.4" font-family="sans-serif" font-size="2.0" fill="#e8eaec" text-anchor="middle">AIR OUT</text>
        <text x="23.4" y="22.1" font-family="sans-serif" font-size="1.8" fill="#e8eaec" text-anchor="middle">(AFO)</text>
      </g>
    </g>
  </g>
</svg>
