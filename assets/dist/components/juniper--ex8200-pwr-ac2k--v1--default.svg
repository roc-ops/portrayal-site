<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="70.1mm" height="104.0mm" viewBox="0 0 70.1 104.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex8200-pwr-ac2k@'] .state-disabled { --led-color: #eab308; }
    g[data-ref^='juniper/ex8200-pwr-ac2k@'] .state-failed { --led-color: #eab308; }
    g[data-ref^='juniper/ex8200-pwr-ac2k@'] .state-high-line { --led-color: #22c55e; }
    g[data-ref^='juniper/ex8200-pwr-ac2k@'] .state-low-line { --led-color: #eab308; }
    g[data-ref^='juniper/ex8200-pwr-ac2k@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='juniper/ex8200-pwr-ac2k@'] .state-overloaded { --led-color: #eab308; }
    g[data-ref^='juniper/ex8200-pwr-ac2k@'] .state-overloaded { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="ex8200-pwr-ac2k" data-path="ex8200-pwr-ac2k" data-class="psu" data-behaviour="fills" data-ref="juniper/ex8200-pwr-ac2k@1:1.0.0" data-airflow="front-to-back" data-input="100 to 120 VAC (13.8 A, 1200 W) or 200 to 240 VAC (12 A, 2000 W), 50 to 60 Hz; output 52 VDC" data-power-output-low-line-w="1200" data-power-output-w="2000" data-role="ac-power-supply" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex8200-pwr-ac2k</title>
    <rect id="ex8200-pwr-ac2k--face" x="0" y="0" width="70.1" height="104.0" rx="0.8" fill="#b3b7bb" stroke="#8a8f94" stroke-width="0.4" />
    <rect id="ex8200-pwr-ac2k--switch" x="46.3" y="12.4" width="10.9" height="15.0" rx="0.8" fill="#4a4f55" stroke="#2b2e33" stroke-width="0.3" data-path="ex8200-pwr-ac2k/switch" data-class="switch" />
    <rect x="48.0" y="16.0" width="7.5" height="7.8" rx="0.5" fill="#8a8f95" />
    <circle id="ex8200-pwr-ac2k--led-input-ok" cx="44.3" cy="32.0" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex8200-pwr-ac2k/led-input-ok" data-class="led" data-states="off high-line low-line" />
    <circle id="ex8200-pwr-ac2k--led-output-ok" cx="50.6" cy="32.0" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex8200-pwr-ac2k/led-output-ok" data-class="led" data-states="off ok disabled" />
    <circle id="ex8200-pwr-ac2k--led-fail" cx="56.9" cy="32.0" r="1.0" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3" data-path="ex8200-pwr-ac2k/led-fail" data-class="led" data-states="off failed overloaded" />
    <g id="ex8200-pwr-ac2k--silkscreen" font-family="sans-serif" font-size="1.3" fill="#2b2e33" text-anchor="middle">
      <text x="44.3" y="35.4">INPUT</text>
      <text x="44.3" y="37.0">OK</text>
      <text x="50.6" y="35.4">OUTPUT</text>
      <text x="50.6" y="37.0">OK</text>
      <text x="56.9" y="35.4">FAIL</text>
      <text x="51.8" y="10.4">ENABLE</text>
    </g>
    <g id="ex8200-pwr-ac2k--vents" fill="#4a4f55">
      <rect x="4.6" y="41.0" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="44.6" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="48.2" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="51.8" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="55.4" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="59.0" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="62.6" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="66.2" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="69.8" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="73.4" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="77.0" width="58.9" height="1.4" rx="0.5" />
      <rect x="4.6" y="80.6" width="58.9" height="1.4" rx="0.5" />
    </g>
    <rect id="ex8200-pwr-ac2k--handle" x="8.0" y="94.5" width="22.0" height="6.0" rx="2.5" fill="#6d7278" stroke="#4a4f55" stroke-width="0.3" data-path="ex8200-pwr-ac2k/handle" data-class="latch" />
    <g id="ex8200-pwr-ac2k--screw" data-path="ex8200-pwr-ac2k/screw" data-class="screw">
      <circle cx="46.6" cy="92.3" r="2.6" fill="#9ba0a6" stroke="#4a4f55" stroke-width="0.4" />
      <path d="M 44.9 92.3 H 48.3 M 46.6 90.6 V 94.0" stroke="#4a4f55" stroke-width="0.4" />
    </g>
    <g id="ex8200-pwr-ac2k--inlet" data-path="ex8200-pwr-ac2k/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-function="AC input" data-input="ac" data-media="ac" transform="translate(4.8,11.3)">
      <title>ex8200-pwr-ac2k--inlet</title>
      <rect id="ex8200-pwr-ac2k--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="ex8200-pwr-ac2k/inlet/opening" data-class="cutout" />
      <rect id="ex8200-pwr-ac2k--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="ex8200-pwr-ac2k--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex8200-pwr-ac2k--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="ex8200-pwr-ac2k--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
