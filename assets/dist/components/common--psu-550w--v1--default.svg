<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="84.0mm" height="40.0mm" viewBox="0 0 84.0 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="psu-550w" data-path="psu-550w" data-class="psu" data-behaviour="fills" data-ref="common/psu-550w@1:1.1.0" data-input="ac" data-power-output-w="550" transform="translate(0,0)">
    <title>psu-550w</title>
    <rect id="psu-550w--body" x="0.2" y="0.2" width="83.6" height="39.6" rx="1.2" fill="#41474d" stroke="#6b7278" stroke-width="0.4" />
    <circle id="psu-550w--fan-bore" cx="21" cy="20" r="15.5" fill="#1b1e21" stroke="#6b7278" stroke-width="0.5" />
    <circle cx="21" cy="20" r="4.2" fill="#2f3439" />
    <circle id="psu-550w--led" cx="30" cy="33" r="1.3" fill="var(--led-color, #3c4147)" />
    <rect id="psu-550w--handle" x="30" y="16" width="22" height="8" rx="1" fill="#3a4046" stroke="#6b7278" stroke-width="0.3" data-path="psu-550w/handle" data-class="handle" data-z-out="1.6" data-z-color="#3a4046" />
    <g id="psu-550w--inlet" data-path="psu-550w/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(52.0,10.0)">
      <title>psu-550w--inlet</title>
      <rect id="psu-550w--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-550w/inlet/opening" data-class="cutout" />
      <path id="psu-550w--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-550w--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-550w--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-550w--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
  </g>
</svg>
