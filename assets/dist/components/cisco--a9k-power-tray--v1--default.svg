<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="468.12mm" height="48.03mm" viewBox="0 0 468.12 48.03">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="a9k-power-tray" data-path="a9k-power-tray" data-class="power" data-behaviour="fills" data-ref="cisco/a9k-power-tray@1:1.0.0" data-wall="#4a4f55" data-eol="none-announced" data-generation="2" data-model="A9K Power Tray" data-module-bays="4" data-power-absent="not-applicable" data-role="power-tray" transform="translate(0,0)">
    <title>a9k-power-tray</title>
    <rect id="a9k-power-tray--plate" x="0" y="0" width="468.12" height="48.03" rx="1.2" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.4" />
    <rect id="a9k-power-tray--grip-l" x="0.0" y="2.8" width="17.46" height="42.43" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" data-z-out="4.2" />
    <rect id="a9k-power-tray--grip-r" x="450.66" y="2.8" width="17.46" height="42.43" rx="2.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" data-z-out="4.2" />
    <rect id="a9k-power-tray--bay-m0" x="17.46" y="0.44" width="108.35" height="43.53" rx="0.8" fill="#101214" />
    <rect id="a9k-power-tray--bay-m1" x="125.81" y="0.44" width="108.35" height="43.53" rx="0.8" fill="#101214" />
    <rect id="a9k-power-tray--bay-m2" x="234.16" y="0.44" width="108.35" height="43.53" rx="0.8" fill="#101214" />
    <rect id="a9k-power-tray--bay-m3" x="342.5" y="0.44" width="108.35" height="43.53" rx="0.8" fill="#101214" />
    <g id="a9k-power-tray--silkscreen">
      <text x="71.63" y="47.13" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">M0</text>
      <text x="179.99" y="47.13" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">M1</text>
      <text x="288.33" y="47.13" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">M2</text>
      <text x="396.68" y="47.13" font-family="sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#231f20">M3</text>
    </g>
  </g>
</svg>
