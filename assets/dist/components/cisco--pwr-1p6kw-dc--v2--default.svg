<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="74.94mm" height="40.2mm" viewBox="0 0 74.94 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/pwr-1p6kw-dc@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/pwr-1p6kw-dc@'] .state-amber-blink { --led-color: #f5a623; }
    g[data-ref^='cisco/pwr-1p6kw-dc@'] .state-amber-blink { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='cisco/pwr-1p6kw-dc@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/pwr-1p6kw-dc@'] .state-green-blink { --led-color: #39b54a; }
    g[data-ref^='cisco/pwr-1p6kw-dc@'] .state-green-blink { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="pwr-1p6kw-dc" data-path="pwr-1p6kw-dc" data-class="psu" data-behaviour="fills" data-ref="cisco/pwr-1p6kw-dc@2:2.0.0" data-wall="#4a4f55" data-eol="none-announced" data-fans="1" data-inlet="dc-terminal" data-input="dc" data-model="PWR-1.6KW-DC" data-power-output-w="1600" data-role="power-module" transform="translate(0,0)">
    <title>pwr-1p6kw-dc</title>
    <rect id="pwr-1p6kw-dc--plate" x="0" y="0" width="74.94" height="40.2" rx="1.0" fill="#1b1e21" stroke="#0d0f11" stroke-width="0.3" />
    <g id="pwr-1p6kw-dc--fan">
      <rect x="1.25" y="1.48" width="40.36" height="38.27" rx="1.2" fill="#101315" />
      <circle cx="21.44" cy="20.62" r="2.4" fill="none" stroke="#565b60" stroke-width="0.45" />
      <circle cx="21.44" cy="20.62" r="4.8" fill="none" stroke="#565b60" stroke-width="0.45" />
      <circle cx="21.44" cy="20.62" r="7.2" fill="none" stroke="#565b60" stroke-width="0.45" />
      <circle cx="21.44" cy="20.62" r="9.6" fill="none" stroke="#565b60" stroke-width="0.45" />
      <circle cx="21.44" cy="20.62" r="12.0" fill="none" stroke="#565b60" stroke-width="0.45" />
      <circle cx="21.44" cy="20.62" r="14.4" fill="none" stroke="#565b60" stroke-width="0.45" />
      <circle cx="21.44" cy="20.62" r="16.8" fill="none" stroke="#565b60" stroke-width="0.45" />
      <circle cx="21.44" cy="20.62" r="9.2" fill="#3c4045" />
    </g>
    <g id="pwr-1p6kw-dc--handle" data-z-uhandle="8.0">
      <path d="M 0.31 10.13 H 4.41 V 36.0 H 38.13 V 10.13 H 42.55 V 40.16 H 0.31 Z" fill="#a8adb2" stroke="#7d8287" stroke-width="0.3" />
    </g>
    <g id="pwr-1p6kw-dc--screw-l">
      <circle cx="5.03" cy="4.66" r="3.35" fill="#2f3337" stroke="#15181b" stroke-width="0.25" />
      <path d="M 2.92 4.66 H 7.13 M 5.03 2.56 V 6.76" stroke="#8d949c" stroke-width="0.7" fill="none" />
    </g>
    <g id="pwr-1p6kw-dc--screw-r">
      <circle cx="38.11" cy="4.66" r="3.35" fill="#2f3337" stroke="#15181b" stroke-width="0.25" />
      <path d="M 36.0 4.66 H 40.21 M 38.11 2.56 V 6.76" stroke="#8d949c" stroke-width="0.7" fill="none" />
    </g>
    <rect id="pwr-1p6kw-dc--inlet-block" x="42.62" y="1.02" width="23.98" height="31.95" rx="0.8" fill="#26292d" />
    <g id="pwr-1p6kw-dc--dc-connector">
      <rect x="45.86" y="3.69" width="17.49" height="26.61" rx="1.6" fill="#0d0f11" stroke="#3c4045" stroke-width="0.35" />
      <circle cx="54.61" cy="10.30" r="2.1" fill="#26292d" stroke="#5f6469" stroke-width="0.3" />
      <circle cx="54.61" cy="23.70" r="2.1" fill="#26292d" stroke="#5f6469" stroke-width="0.3" />
    </g>
    <g id="pwr-1p6kw-dc--silkscreen">
      <text x="64.82" y="8.60" font-family="sans-serif" font-size="3.0" font-weight="bold" fill="#e9ecef">+DC</text>
      <text x="64.82" y="31.20" font-family="sans-serif" font-size="3.0" font-weight="bold" fill="#e9ecef">-DC</text>
    </g>
    <rect id="pwr-1p6kw-dc--latch" x="69.32" y="13.09" width="3.61" height="15.97" rx="1.2" fill="#e9ecef" stroke="#9aa0a6" stroke-width="0.25" data-z-out="4.2" />
    <rect id="pwr-1p6kw-dc--tab" x="67.01" y="1.02" width="6.03" height="5.61" rx="0.6" fill="#a8adb2" />
    <circle id="pwr-1p6kw-dc--status" cx="68.83" cy="34.20" r="1.5" fill="var(--led-color, #4f5459)" stroke="#8d949c" stroke-width="0.3" data-path="pwr-1p6kw-dc/status" data-class="led" data-states="green green-blink amber amber-blink off" data-description="the module's STATUS lamp, one per module, at the bottom right of the inlet block." data-z-dome="0.3" />
  </g>
</svg>
