      <circle id="qfx10008-fan--led-ftc" cx="23.0" cy="27.6" r="1.0" fill="var(--led-color, #0f1113)" stroke="#33373c" stroke-width="0.25" data-path="qfx10008-fan/led-ftc" data-class="led" data-states="off ok fault" />
