      <path d="M 14.5 189.6 L 18.1 189.6 M 16.3 188.2 L 16.3 191.0" stroke="#1d2023" stroke-width="0.4" fill="none" />
      <text x="20.9" y="133.9" font-size="6.6" transform="rotate(-90 20.9 133.9)">7360 ISAM FX-4</text>
