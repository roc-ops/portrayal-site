    <g id="tm-7124s-psu-ac--switch" data-path="tm-7124s-psu-ac/switch" data-class="button">
      <rect x="45.17" y="7.94" width="20.14" height="14.32" rx="0.8" fill="#2b2e32" />
      <g id="tm-7124s-psu-ac--rocker-off" data-show-from="state" data-show="off" data-z-out="2.5" data-z-profile="0:1.1,17.1:2.5">
        <rect x="46.66" y="9.28" width="17.1" height="11.64" rx="0.6" fill="url(#tm-7124s-psu-ac--rocker-g-off)" stroke="#2b2e32" stroke-width="0.2" />
        <circle cx="51.9" cy="15.1" r="1.6" fill="none" stroke="#e6e8ea" stroke-width="0.5" />
        <rect x="57.6" y="14.8" width="3.0" height="0.6" fill="#e6e8ea" />
      </g>
      <g id="tm-7124s-psu-ac--rocker-on" data-show-from="state" data-show="on" display="none" data-z-out="2.5" data-z-profile="0:2.5,17.1:1.1">
        <rect x="46.66" y="9.28" width="17.1" height="11.64" rx="0.6" fill="url(#tm-7124s-psu-ac--rocker-g-on)" stroke="#2b2e32" stroke-width="0.2" />
        <circle cx="51.9" cy="15.1" r="1.6" fill="none" stroke="#e6e8ea" stroke-width="0.5" />
        <rect x="57.6" y="14.8" width="3.0" height="0.6" fill="#e6e8ea" />
      </g>
    </g>
