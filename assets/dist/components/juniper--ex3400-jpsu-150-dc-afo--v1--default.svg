<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="71.2mm" height="39.0mm" viewBox="0 0 71.2 39.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex3400-jpsu-150-dc-afo@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='juniper/ex3400-jpsu-150-dc-afo@'] .state-red { --led-color: #e03a2f; }</style>
  <g id="ex3400-jpsu-150-dc-afo" data-path="ex3400-jpsu-150-dc-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/ex3400-jpsu-150-dc-afo@1:1.0.0" data-airflow="front-to-back" data-inlet="dc-terminal" data-input="-48 through -60 VDC, 4.7 A maximum at -48 VDC" data-power-output-w="150" data-role="dc-power-supply" data-weight-kg="0.65" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex3400-jpsu-150-dc-afo</title>
    <rect id="ex3400-jpsu-150-dc-afo--face" x="0" y="0" width="71.2" height="39.0" rx="0.8" fill="#c9cccf" stroke="#8d9195" stroke-width="0.4" />
    <g id="ex3400-jpsu-150-dc-afo--fan">
      <circle cx="17.0" cy="18.8" r="14.4" fill="#1d1f22" />
      <g transform="translate(17.0 18.8)" fill="#c9cccf" stroke="#8d9195" stroke-width="0.2">
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(0)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(51.4)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(102.8)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(154.2)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(205.6)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(257)" />
        <path d="M 2.4 -2.6 C 8 -13.6 14 -9.4 12.2 -2.4 C 9.4 -4.6 5.6 -4.4 2.4 -2.6 Z" transform="rotate(308.4)" />
        <circle r="4.6" stroke="none" />
      </g>
      <rect id="ex3400-jpsu-150-dc-afo--airout-chip" x="10.5" y="15.3" width="13.0" height="7.0" rx="0.9" fill="#5b6066" />
      <circle cx="12.9" cy="18.8" r="1.5" fill="#ee6a1f" />
    </g>
    <g id="ex3400-jpsu-150-dc-afo--screws">
      <circle cx="5.0" cy="4.4" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
      <circle cx="5.0" cy="34.6" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
    </g>
    <g id="ex3400-jpsu-150-dc-afo--latch" data-path="ex3400-jpsu-150-dc-afo/latch" data-class="latch" data-z-out="1.6" data-z-color="#ee6a1f">
      <rect x="30.8" y="1.0" width="9.4" height="36.8" rx="1.2" fill="#ee6a1f" stroke="#b9500f" stroke-width="0.35" />
      <circle cx="35.5" cy="4.4" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
      <circle cx="35.5" cy="34.6" r="1.9" fill="#aeb2b6" stroke="#6f7378" stroke-width="0.3" />
    </g>
    <rect id="ex3400-jpsu-150-dc-afo--terminal-block" x="47.5" y="7.6" width="10.1" height="25.8" rx="0.6" fill="#a9adb1" stroke="#5e656c" stroke-width="0.3" />
    <g id="ex3400-jpsu-150-dc-afo--terminal-screws" fill="#d9dbdd" stroke="#5e656c" stroke-width="0.3">
      <circle cx="52.5" cy="15.4" r="1.7" />
      <circle cx="52.5" cy="20.8" r="1.7" />
      <circle cx="52.5" cy="26.0" r="1.7" />
    </g>
    <rect id="ex3400-jpsu-150-dc-afo--grip" x="64.0" y="9.6" width="4.0" height="18.0" rx="1.6" fill="#8d9195" stroke="#5e656c" stroke-width="0.3" />
    <g id="ex3400-jpsu-150-dc-afo--lamps">
      <circle id="ex3400-jpsu-150-dc-afo--led-out" cx="43.6" cy="3.7" r="1.3" fill="var(--led-color, #3d4044)" stroke="#2a2d30" stroke-width="0.3" data-path="ex3400-jpsu-150-dc-afo/led-out" data-class="led" data-states="green red off" />
      <circle id="ex3400-jpsu-150-dc-afo--led-in" cx="63.1" cy="3.7" r="1.3" fill="var(--led-color, #3d4044)" stroke="#2a2d30" stroke-width="0.3" data-path="ex3400-jpsu-150-dc-afo/led-in" data-class="led" data-states="green off" />
    </g>
    <g id="ex3400-jpsu-150-dc-afo--silkscreen" font-family="Arial" font-size="1.9" fill="#2a2d30" font-weight="bold">
      <text x="45.2" y="3.4">OUT</text>
      <text x="45.2" y="5.6">OK</text>
      <text x="59.6" y="3.4" text-anchor="end">IN</text>
      <text x="59.6" y="5.6" text-anchor="end">OK</text>
      <text x="59.2" y="16.2" font-size="2.6">+</text>
      <text x="59.2" y="21.6" font-size="2.6">-</text>
      <path d="M 60.0 24.2 V 27.0 M 58.8 27.0 H 61.2 M 59.3 27.9 H 60.7" fill="none" stroke="#2a2d30" stroke-width="0.3" />
      <text x="43.6" y="30.0" font-size="1.7" transform="rotate(-90 43.6 30.0)" fill="#2a2d30">-48 - -60V 4.7-2.8A</text>
      <text x="16.0" y="18.8" text-anchor="start" font-size="2.2" fill="#e8eaec" dx="0">AIR</text>
      <text x="16.0" y="21.4" text-anchor="start" font-size="2.2" fill="#e8eaec">OUT</text>
    </g>
  </g>
</svg>
