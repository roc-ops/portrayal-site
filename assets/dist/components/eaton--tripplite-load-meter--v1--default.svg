    g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='f'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='g'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='b'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='c'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='a'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='d'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='dp'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-4 [data-seg='e'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='a'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='f'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='g'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='c'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='d'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='b'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='dp'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-5 [data-seg='e'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='a'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='f'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='g'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='e'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='c'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='d'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='b'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-6 [data-seg='dp'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='a'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='b'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='c'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='d'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='dp'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='e'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='f'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-7 [data-seg='g'] { opacity: 0; }
