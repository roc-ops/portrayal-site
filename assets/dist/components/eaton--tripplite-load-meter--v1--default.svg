  <g id="tripplite-load-meter" data-path="tripplite-load-meter" data-class="display" data-ref="eaton/tripplite-load-meter@1:1.0.0" transform="translate(0,0)">
    <title>tripplite-load-meter</title>
    <rect id="tripplite-load-meter--outline" x="0.15" y="0.15" width="47.9" height="30.0" rx="0.6" fill="#2c2d2f" stroke="#3d3f42" stroke-width="0.3" />
    <rect id="tripplite-load-meter--window" x="13.7" y="3.1" width="20.6" height="16.9" rx="0.4" fill="#0e0f10" stroke="#3a3c3f" stroke-width="0.25" data-path="tripplite-load-meter/window" data-class="display" data-characters="2" data-description="the readout window, two seven-segment cells. It shows the load in amps, total or per bank, or the IP address two characters at a time; each cell's glyph set is on its digit." />
