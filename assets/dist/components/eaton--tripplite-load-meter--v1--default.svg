    g[data-ref^='eaton/tripplite-load-meter@'] .state-8 [data-seg='dp'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='a'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='b'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='c'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='d'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='f'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='g'] { opacity: 1; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='dp'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-9 [data-seg='e'] { opacity: 0; }
    g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='a'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='b'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='c'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='d'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='dp'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='e'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='f'] ,g[data-ref^='eaton/tripplite-load-meter@'] .state-blank [data-seg='g'] { opacity: 0; }
