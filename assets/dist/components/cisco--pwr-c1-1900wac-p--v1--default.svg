<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="82.55mm" height="40.1mm" viewBox="0 0 82.55 40.1">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/pwr-c1-1900wac-p@'] .state-fault { --led-color: #ef4444; }
    g[data-ref^='cisco/pwr-c1-1900wac-p@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="pwr-c1-1900wac-p" data-path="pwr-c1-1900wac-p" data-class="psu" data-behaviour="fills" data-ref="cisco/pwr-c1-1900wac-p@1:1.0.0" data-wall="#15171a" data-airflow="front-to-back" data-efficiency="platinum" data-inlet="c20" data-input="ac" data-input-current-max="12 A at 200 to 240 VAC, 16 A at 115 to 127 VAC" data-input-frequency="47 to 63 Hz" data-input-voltage="200 to 240 VAC for 1900 W, 115 to 127 VAC for 1500 W (autoranging)" data-model="PWR-C1-1900WAC-P" data-output="-56 V at 33.92 A (230 V input), -56 V at 26.78 A (115 V input)" data-power-output-w="1900" data-weight-kg="1.5" data-states="absent" transform="translate(0,0)">
    <title>pwr-c1-1900wac-p</title>
    <defs>
      <pattern id="pwr-c1-1900wac-p--c1-mesh" width="6.6" height="3.82" patternUnits="userSpaceOnUse">
        <path d="M 1.9 0 L 0.95 1.65 L -0.95 1.65 L -1.9 0 L -0.95 -1.65 L 0.95 -1.65 Z" fill="#0d0f11" />
        <path d="M 8.5 0 L 7.55 1.65 L 5.65 1.65 L 4.7 0 L 5.65 -1.65 L 7.55 -1.65 Z" fill="#0d0f11" />
        <path d="M 5.2 1.91 L 4.25 3.56 L 2.35 3.56 L 1.4 1.91 L 2.35 0.26 L 4.25 0.26 Z" fill="#0d0f11" />
        <path d="M 1.9 3.82 L 0.95 5.47 L -0.95 5.47 L -1.9 3.82 L -0.95 2.17 L 0.95 2.17 Z" fill="#0d0f11" />
        <path d="M 8.5 3.82 L 7.55 5.47 L 5.65 5.47 L 4.7 3.82 L 5.65 2.17 L 7.55 2.17 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="pwr-c1-1900wac-p--body" x="0" y="0" width="82.55" height="40.1" rx="0.6" fill="#2a2c30" stroke="#0d0f11" stroke-width="0.4" />
    <rect id="pwr-c1-1900wac-p--vents" x="1.0" y="12.0" width="80.55" height="27.0" fill="url(#pwr-c1-1900wac-p--c1-mesh)" />
    <rect id="pwr-c1-1900wac-p--inlet-bezel" x="37.5" y="3.5" width="35.4" height="27.4" rx="2.0" fill="#15171a" />
    <circle id="pwr-c1-1900wac-p--ac-ok" cx="11.7" cy="9.1" r="1.5" fill="var(--led-color, #4a4d51)" stroke="#9aa1a8" stroke-width="0.2" data-path="pwr-c1-1900wac-p/ac-ok" data-class="led" data-states="off ok" />
    <circle id="pwr-c1-1900wac-p--ps-ok" cx="32.9" cy="9.1" r="1.5" fill="var(--led-color, #4a4d51)" stroke="#9aa1a8" stroke-width="0.2" data-path="pwr-c1-1900wac-p/ps-ok" data-class="led" data-states="off ok fault" />
    <rect id="pwr-c1-1900wac-p--latch" x="28.2" y="29.5" width="11.0" height="9.0" rx="0.8" fill="#15171a" stroke="#4a4d51" stroke-width="0.3" data-path="pwr-c1-1900wac-p/latch" data-class="handle" />
    <rect id="pwr-c1-1900wac-p--retainer" x="60.0" y="31.5" width="12.7" height="7.0" rx="0.8" fill="#15171a" stroke="#4a4d51" stroke-width="0.3" data-path="pwr-c1-1900wac-p/retainer" data-class="handle" />
    <g id="pwr-c1-1900wac-p--silkscreen" font-family="sans-serif" fill="#e4e7ea">
      <text id="pwr-c1-1900wac-p--silk-ac-ok" x="11.7" y="5.0" font-size="2.2" text-anchor="middle">AC OK</text>
      <text id="pwr-c1-1900wac-p--silk-ps-ok" x="32.9" y="5.0" font-size="2.2" text-anchor="middle">PS OK</text>
      <text id="pwr-c1-1900wac-p--silk-model" x="18.0" y="38.0" font-size="2.2" text-anchor="middle">PWR-C1-1900WAC-P</text>
    </g>
    <g id="pwr-c1-1900wac-p--inlet" data-path="pwr-c1-1900wac-p/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(39.0,5.0)">
      <title>pwr-c1-1900wac-p--inlet</title>
      <rect id="pwr-c1-1900wac-p--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="pwr-c1-1900wac-p/inlet/opening" data-class="cutout" />
      <rect id="pwr-c1-1900wac-p--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="pwr-c1-1900wac-p--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="pwr-c1-1900wac-p--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="pwr-c1-1900wac-p--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
  </g>
</svg>
