<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="482.6mm" height="88.81mm" viewBox="0 0 482.6 88.81">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="uscmh-sfdabsb2u-cover" data-path="uscmh-sfdabsb2u-cover" data-class="mechanical" data-behaviour="mounts" data-ref="fs/uscmh-sfdabsb2u-cover@1:1.0.0" data-material="ABS" transform="translate(0,0)">
    <title>uscmh-sfdabsb2u-cover</title>
    <rect id="uscmh-sfdabsb2u-cover--plate" x="0" y="0" width="482.6" height="88.81" rx="0.8" fill="#333639" data-path="uscmh-sfdabsb2u-cover/plate" data-class="bezel" data-z-out="138.0" data-z-lift="136.5" data-z-color="#333639" />
    <rect id="uscmh-sfdabsb2u-cover--shoulder-top" x="0" y="0" width="482.6" height="11.5" fill="#2e3134" />
    <rect id="uscmh-sfdabsb2u-cover--shoulder-bottom" x="0" y="77.31" width="482.6" height="11.5" fill="#2e3134" />
    <rect id="uscmh-sfdabsb2u-cover--clip-1" x="24.2" y="5.5" width="18.4" height="3.1" fill="#1f2123" />
    <rect id="uscmh-sfdabsb2u-cover--clip-2" x="440.0" y="5.5" width="18.4" height="3.1" fill="#1f2123" />
    <rect id="uscmh-sfdabsb2u-cover--clip-3" x="24.2" y="80.21" width="18.4" height="3.1" fill="#1f2123" />
    <rect id="uscmh-sfdabsb2u-cover--clip-4" x="440.0" y="80.21" width="18.4" height="3.1" fill="#1f2123" />
    <rect id="uscmh-sfdabsb2u-cover--logo-zone" x="28.6" y="39.7" width="9.7" height="9.6" fill="none" data-path="uscmh-sfdabsb2u-cover/logo-zone" data-class="label" />
    <rect id="uscmh-sfdabsb2u-cover--lip-top" x="0" y="0" width="482.6" height="1.5" fill="#3d4043" data-path="uscmh-sfdabsb2u-cover/lip-top" data-class="bezel" data-z-out="138.0" data-z-lift="120.5" data-z-color="#333639" />
    <rect id="uscmh-sfdabsb2u-cover--lip-bottom" x="0" y="87.31" width="482.6" height="1.5" fill="#25272a" data-path="uscmh-sfdabsb2u-cover/lip-bottom" data-class="bezel" data-z-out="138.0" data-z-lift="120.5" data-z-color="#333639" />
  </g>
</svg>
