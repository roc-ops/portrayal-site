    <path id="cc3008--lip" d="M 0 16.0 H 44.0 Q 45.5 16.0 46.2 17.4 L 47.0 19.3 H 0 Z" fill="#4a4e53" />
    <rect x="41.9" y="0.6" width="9.6" height="15.0" rx="1.4" fill="#676b70" stroke="#4a4e53" stroke-width="0.2" />
