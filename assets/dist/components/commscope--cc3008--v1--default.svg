    </g>
    <rect x="8.4" y="7.4" width="9.0" height="4.0" rx="1.0" fill="#3f4247" />
    <g id="cc3008--silkscreen" fill="#eef0f2" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="5.2" y="7.0" font-size="2.2" transform="rotate(-90 5.2 7.0)">CC3008</text>
      <text x="12.9" y="4.1" font-size="1.9" transform="rotate(-45 12.9 4.1)">Micro</text>
      <text x="14.4" y="5.6" font-size="1.9" transform="rotate(-45 14.4 5.6)">USB</text>
      <path d="M 18.8 7.8 V 6.8 H 29.9 V 7.8" fill="none" stroke="#eef0f2" stroke-width="0.22" />
      <text x="24.8" y="5.8" font-size="1.9" transform="rotate(-45 24.8 5.8)">Status</text>
      <text x="34.2" y="6.4" font-size="1.9" transform="rotate(-45 34.2 6.4)">Access</text>
      <text x="38.6" y="7.6" font-size="1.9" transform="rotate(-45 38.6 7.6)">Fan</text>
    </g>
    <g id="cc3008--usb" data-path="cc3008/usb" data-class="port" data-ref="std/micro-usb@1:1.0.1" data-depth="5.9" data-wall="#8d949c" data-media="micro-usb-b" data-role="console" transform="translate(9.15,8.03)">
      <title>cc3008--usb</title>
      <rect id="cc3008--usb--shell" x="0" y="0" width="7.5" height="2.75" rx="0.5" fill="#c9cbcd" stroke="#5f6469" stroke-width="0.14" />
