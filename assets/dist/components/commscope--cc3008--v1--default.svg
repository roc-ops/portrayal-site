      <rect x="1.5" y="1.15" width="4.5" height="0.5" fill="#3a4046" />
      <g data-cp="mate" data-cp-at="3.755 1.38" data-cp-dir="front" />
    </g>
    <g id="cc3008--led-status-1" data-path="cc3008/led-status-1" data-class="led" data-ref="common/led-dot@1:1.1.0" data-function="status" transform="translate(18.9,10.3)">
