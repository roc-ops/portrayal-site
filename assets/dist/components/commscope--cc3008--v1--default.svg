    </g>
    <g id="cc3008--led-access" data-path="cc3008/led-access" data-class="led" data-ref="common/led-dot@1:1.1.0" data-function="activity" transform="translate(32.2,10.3)">
      <title>cc3008--led-access</title>
      <circle id="cc3008--led-access--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="cc3008--led-access--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="cc3008/led-access/lamp" data-class="led" data-states="off on" data-z-dome="0.3" />
