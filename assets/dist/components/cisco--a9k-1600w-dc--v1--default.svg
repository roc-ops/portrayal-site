<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="71.21mm" height="39.21mm" viewBox="0 0 71.21 39.21">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='cisco/a9k-1600w-dc@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='cisco/a9k-1600w-dc@'] .state-amber-blink { --led-color: #f5a623; }
    g[data-ref^='cisco/a9k-1600w-dc@'] .state-amber-blink { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='cisco/a9k-1600w-dc@'] .state-green { --led-color: #39b54a; }
    g[data-ref^='cisco/a9k-1600w-dc@'] .state-green-blink { --led-color: #39b54a; }
    g[data-ref^='cisco/a9k-1600w-dc@'] .state-green-blink { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="a9k-1600w-dc" data-path="a9k-1600w-dc" data-class="psu" data-behaviour="fills" data-ref="cisco/a9k-1600w-dc@1:1.0.0" data-wall="#4a4f55" data-eol="none-announced" data-fans="1" data-inlet="dc-terminal" data-input="dc" data-model="A9K-1600W-DC" data-power-output-w="1600" data-role="power-module" transform="translate(0,0)">
    <title>a9k-1600w-dc</title>
    <rect id="a9k-1600w-dc--plate" x="0" y="0" width="71.21" height="39.21" rx="0.8" fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.35" />
    <g id="a9k-1600w-dc--fan">
      <rect x="0.84" y="1.25" width="38.60" height="36.70" rx="1.0" fill="#15181b" />
      <circle cx="20.14" cy="19.60" r="2.6" fill="none" stroke="#8d949c" stroke-width="0.45" />
      <circle cx="20.14" cy="19.60" r="5.2" fill="none" stroke="#8d949c" stroke-width="0.45" />
      <circle cx="20.14" cy="19.60" r="7.8" fill="none" stroke="#8d949c" stroke-width="0.45" />
      <circle cx="20.14" cy="19.60" r="10.4" fill="none" stroke="#8d949c" stroke-width="0.45" />
      <circle cx="20.14" cy="19.60" r="13.0" fill="none" stroke="#8d949c" stroke-width="0.45" />
      <circle cx="20.14" cy="19.60" r="15.6" fill="none" stroke="#8d949c" stroke-width="0.45" />
      <circle cx="20.14" cy="19.60" r="18.0" fill="none" stroke="#8d949c" stroke-width="0.45" />
      <circle cx="20.14" cy="19.60" r="7.4" fill="#d8dadd" stroke="#9aa0a6" stroke-width="0.3" />
    </g>
    <g>
      <circle cx="3.6" cy="4.0" r="2.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.25" />
      <path d="M 2.2 4.0 H 5.0 M 3.6 2.6 V 5.4" stroke="#4a4f55" stroke-width="0.5" fill="none" />
    </g>
    <g>
      <circle cx="36.7" cy="4.0" r="2.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.25" />
      <path d="M 35.300000000000004 4.0 H 38.1 M 36.7 2.6 V 5.4" stroke="#4a4f55" stroke-width="0.5" fill="none" />
    </g>
    <g>
      <circle cx="3.6" cy="35.2" r="2.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.25" />
      <path d="M 2.2 35.2 H 5.0 M 3.6 33.800000000000004 V 36.6" stroke="#4a4f55" stroke-width="0.5" fill="none" />
    </g>
    <g>
      <circle cx="36.7" cy="35.2" r="2.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.25" />
      <path d="M 35.300000000000004 35.2 H 38.1 M 36.7 33.800000000000004 V 36.6" stroke="#4a4f55" stroke-width="0.5" fill="none" />
    </g>
    <g id="a9k-1600w-dc--inlet">
      <rect x="41.54" y="1.22" width="23.14" height="29.96" rx="2.2" fill="#15181b" stroke="#3c4045" stroke-width="0.35" />
      <circle cx="53.11" cy="9.60" r="3.2" fill="#26292d" stroke="#5f6469" stroke-width="0.35" />
      <circle cx="53.11" cy="22.80" r="3.2" fill="#26292d" stroke="#5f6469" stroke-width="0.35" />
    </g>
    <g id="a9k-1600w-dc--silkscreen">
      <text x="53.11" y="4.40" font-family="sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#e9ecef">+DC</text>
      <text x="53.11" y="30.00" font-family="sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#e9ecef">-DC</text>
    </g>
    <rect id="a9k-1600w-dc--latch" x="66.30" y="11.80" width="3.60" height="15.60" rx="1.2" fill="#e9ecef" stroke="#9aa0a6" stroke-width="0.25" data-z-out="4.2" />
    <circle id="a9k-1600w-dc--ok" cx="65.80" cy="4.70" r="1.5" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.3" data-path="a9k-1600w-dc/ok" data-class="led" data-states="green green-blink amber amber-blink off" data-description="the module's OK lamp - Cisco's legend for this chassis, where the ASR 9902 and ASR 9903 modules print STATUS. One per module." data-z-dome="0.3" />
  </g>
</svg>
