      <rect x="21.3" y="385.5" width="21.1" height="35.7" />
      <rect x="21.3" y="423.7" width="21.1" height="35.7" />
    </g>
    <rect id="ex8208-fan--handle" x="12.1" y="178.3" width="8.6" height="136.5" rx="4.0" fill="#8a8f95" stroke="#4a4f55" stroke-width="0.4" data-path="ex8208-fan/handle" data-class="latch" />
    <path d="M 20.1 12.9 L 33.6 35.3 L 6.6 35.3 Z" fill="none" stroke="#2b2e33" stroke-width="0.4" />
    <g id="ex8208-fan--screws" fill="#9ba0a6" stroke="#4a4f55" stroke-width="0.3">
      <circle cx="13.5" cy="483.0" r="2.0" />
      <circle cx="29.9" cy="483.0" r="2.0" />
    </g>
    <rect id="ex8208-fan--latch" x="7.8" y="490.0" width="28.0" height="6.0" rx="3.0" fill="#8a8f95" stroke="#4a4f55" stroke-width="0.3" />
    <g id="ex8208-fan--silkscreen" font-family="sans-serif" fill="#2b2e33" text-anchor="middle">
      <text x="22.4" y="8.7" font-size="3.3">EX8208 FAN</text>
      <text x="20.1" y="32.5" font-size="11">!</text>
      <g font-size="11">
