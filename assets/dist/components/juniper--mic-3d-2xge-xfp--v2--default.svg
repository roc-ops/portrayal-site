      </g>
      <g id="mic-3d-2xge-xfp--m2-silkscreen">
        <text x="11.50" y="11.00" font-family="Arial" fill="#3a3e43" font-size="1.4" text-anchor="middle" transform="rotate(-90 11.50 11.00)">OK/FAIL</text>
      </g>
      <g id="mic-3d-2xge-xfp--m3-silkscreen">
