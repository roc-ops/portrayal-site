    </g>
    <g id="mic-3d-2xge-xfp--port-1-0" data-path="mic-3d-2xge-xfp/port-1-0" data-class="port" data-ref="std/xfp@1:1.0.0" data-depth="61.7" data-wall="#aab0b7" data-media="xfp" transform="translate(82.0,13.5)">
      <title>mic-3d-2xge-xfp--port-1-0</title>
      <rect id="mic-3d-2xge-xfp--port-1-0--opening" x="0" y="0" width="19.5" height="9.7" rx="0.5" fill="#17191c" data-path="mic-3d-2xge-xfp/port-1-0/opening" data-class="cutout" />
      <rect id="mic-3d-2xge-xfp--port-1-0--collar" x="0.5" y="0.5" width="18.5" height="8.7" rx="0.4" fill="#0d0f11" data-z-out="1.0" data-z-color="#7d848c" />
      <rect id="mic-3d-2xge-xfp--port-1-0--module-slot" x="1.4" y="1.5" width="16.7" height="2.2" rx="0.3" fill="#2b2f33" />
      <rect id="mic-3d-2xge-xfp--port-1-0--latch-window" x="1.4" y="5.4" width="16.7" height="2.6" rx="0.3" fill="#000000" />
      <g data-cp="mate" data-cp-at="9.75 4.85" data-cp-dir="front" />
