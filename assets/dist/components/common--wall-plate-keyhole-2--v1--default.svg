    <path id="wall-plate-keyhole-2--plate" fill-rule="evenodd" fill="#3d4247" stroke="#2a2e32" stroke-width="0.3" d="M 1.5 0 H 54.5 A 1.5 1.5 0 0 1 56 1.5 V 28.5 A 1.5 1.5 0 0 1 54.5 30 H 1.5 A 1.5 1.5 0 0 1 0 28.5 V 1.5 A 1.5 1.5 0 0 1 1.5 0 Z M 12.3 9.8 a 1.7 1.7 0 0 1 3.4 0 V 15.6 a 3.4 3.4 0 1 1 -3.4 0 Z M 40.3 9.8 a 1.7 1.7 0 0 1 3.4 0 V 15.6 a 3.4 3.4 0 1 1 -3.4 0 Z" data-path="wall-plate-keyhole-2/plate" data-class="mechanical" data-z-out="1.5" data-z-color="#3d4247" data-z-shape="1" />
    <path id="wall-plate-keyhole-2--keyhole-1" fill="#15181b" d="M 12.3 9.8 a 1.7 1.7 0 0 1 3.4 0 V 15.6 a 3.4 3.4 0 1 1 -3.4 0 Z" data-path="wall-plate-keyhole-2/keyhole-1" data-class="mechanical" data-z-out="0.2" data-z-color="#15181b" />
    <path id="wall-plate-keyhole-2--keyhole-2" fill="#15181b" d="M 40.3 9.8 a 1.7 1.7 0 0 1 3.4 0 V 15.6 a 3.4 3.4 0 1 1 -3.4 0 Z" data-path="wall-plate-keyhole-2/keyhole-2" data-class="mechanical" data-z-out="0.2" data-z-color="#15181b" />
    <circle id="wall-plate-keyhole-2--screw-1" cx="14.0" cy="4.0" r="1.9" fill="#1f2226" stroke="#6b7177" stroke-width="0.25" data-path="wall-plate-keyhole-2/screw-1" data-class="mechanical" data-z-cyl="0.8" data-z-lift="1.5" data-z-color="#1f2226" />
    <circle id="wall-plate-keyhole-2--screw-2" cx="42.0" cy="4.0" r="1.9" fill="#1f2226" stroke="#6b7177" stroke-width="0.25" data-path="wall-plate-keyhole-2/screw-2" data-class="mechanical" data-z-cyl="0.8" data-z-lift="1.5" data-z-color="#1f2226" />
    <path d="M 13.1 4.0 H 14.9 M 14.0 3.1 V 4.9 M 41.1 4.0 H 42.9 M 42.0 3.1 V 4.9" stroke="#8a9096" stroke-width="0.35" />
  </g>
</svg>
