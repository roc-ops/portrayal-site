<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.2mm" viewBox="0 0 50.5 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-751-dc@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-fw-update { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-fw-update { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-input-lost { --led-color: #ef4444; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-input-lost { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-warning { --led-color: #22c55e; --led-color-alt: #ef4444; }
    g[data-ref^='ufispace/psu-751-dc@'] .state-warning { animation: portrayal-alternate 1s linear infinite; }</style>
  <g id="psu-751-dc" data-path="psu-751-dc" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-751-dc@1:1.0.0" data-input="dc" data-model="PSU-751-DESR" data-power-output-w="750" transform="translate(0,0)">
    <title>psu-751-dc</title>
    <rect id="psu-751-dc--body" x="0" y="0" width="50.5" height="40.2" rx="0.6" fill="#33373c" stroke="#22262a" stroke-width="0.4" />
    <g id="psu-751-dc--vent-field" data-z-vent="30">
      <rect x="16.6" y="2.6" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="21.9" y="2.6" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="27.2" y="2.6" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="31.9" y="2.6" width="3.4" height="5.2" fill="#0d0f11" />
      <rect x="5.8" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="11.1" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="16.6" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="21.9" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="27.2" y="9.8" width="4.2" height="5.2" fill="#0d0f11" />
      <rect x="31.9" y="9.8" width="3.4" height="5.2" fill="#0d0f11" />
    </g>
    <rect id="psu-751-dc--latch" x="0" y="4" width="2.5" height="12" rx="0.8" fill="#c22f2f" stroke="#8c1f1f" stroke-width="0.3" data-path="psu-751-dc/latch" data-class="latch" data-z-out="2.2" />
    <g id="psu-751-dc--terminal-block" data-path="psu-751-dc/terminal-block" data-class="inlet" data-z-out="8">
      <rect x="2.2" y="18.6" width="32" height="17" rx="0.8" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.35" />
      <rect x="3.4" y="19.8" width="29.6" height="14.6" rx="0.5" fill="#26292d" />
      <circle cx="8.6" cy="27.1" r="3.3" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <circle cx="18.2" cy="27.1" r="3.3" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <circle cx="27.8" cy="27.1" r="3.3" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3" />
      <line x1="6.3" y1="27.1" x2="10.9" y2="27.1" stroke="#4a4f55" stroke-width="0.5" />
      <line x1="15.9" y1="27.1" x2="20.5" y2="27.1" stroke="#4a4f55" stroke-width="0.5" />
      <line x1="25.5" y1="27.1" x2="30.1" y2="27.1" stroke="#4a4f55" stroke-width="0.5" />
    </g>
    <rect id="psu-751-dc--handle" x="36.2" y="2.5" width="3.6" height="35" rx="1.7" fill="#17191c" stroke="#0d0f11" stroke-width="0.3" data-path="psu-751-dc/handle" data-class="handle" data-z-uhandle="38" />
    <g id="psu-751-dc--slot-vents">
      <rect x="44.8" y="2.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="8.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="14.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="20.6" width="4.2" height="4.6" fill="#0d0f11" />
      <rect x="44.8" y="26.6" width="4.2" height="4.6" fill="#0d0f11" />
    </g>
    <rect id="psu-751-dc--spec-label" x="44.8" y="34.6" width="4.2" height="3.4" fill="#2e8b57" />
    <circle id="psu-751-dc--status-led" cx="12.8" cy="6.2" r="1.6" fill="var(--led-color, #3a3f44)" data-path="psu-751-dc/status-led" data-class="led" data-states="off ok fail standby fw-update input-lost warning" data-description="HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output ON and OK), Blinking Green 1/sec (standby state, only +5VSB on), Blinking Green 2/sec (power supply firmware updating, boot-loader mode), Red (critical event causing a shutdown - failure, over current, short circuit, over voltage, fan failure, over temperature), Blinking Red 1/sec (input power cord unplugged or input power lost with a second supply still fed), Blinking between Green and Red (warning while still operating - high temp, high power, high current, slow fan)" data-z-dome="0.4" />
  </g>
</svg>
