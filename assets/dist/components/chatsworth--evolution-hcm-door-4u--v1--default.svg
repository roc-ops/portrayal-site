<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="450.0mm" height="177.8mm" viewBox="0 0 450.0 177.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="evolution-hcm-door-4u" data-path="evolution-hcm-door-4u" data-class="mechanical" data-behaviour="mounts" data-ref="chatsworth/evolution-hcm-door-4u@1:1.0.1" data-material="Steel" transform="translate(0,0)">
    <title>evolution-hcm-door-4u</title>
    <rect id="evolution-hcm-door-4u--plate" x="0" y="0" width="450" height="177.8" rx="0.8" fill="#1b1c1e" data-fill-from="finish" data-path="evolution-hcm-door-4u/plate" data-class="bezel" data-z-out="206.0" data-z-lift="204.0" data-z-profile-y="0:205,7:206,170.8:206,177.8:205" />
    <rect id="evolution-hcm-door-4u--bevel-top" x="0" y="1.5" width="450" height="7" fill="#fff" fill-opacity="0.1" />
    <rect id="evolution-hcm-door-4u--bevel-top-edge" x="0" y="8.5" width="450" height="0.6" fill="#fff" fill-opacity="0.22" />
    <rect id="evolution-hcm-door-4u--bevel-bottom" x="0" y="169.3" width="450" height="7" fill="#000" fill-opacity="0.3" />
    <rect id="evolution-hcm-door-4u--bevel-bottom-edge" x="0" y="169.3" width="450" height="0.6" fill="#000" fill-opacity="0.35" />
    <rect id="evolution-hcm-door-4u--groove" x="0" y="84.4" width="450" height="9" fill="#000" fill-opacity="0.4" />
    <rect id="evolution-hcm-door-4u--strip" x="0" y="85.9" width="450" height="6" fill="#98a1a9" data-path="evolution-hcm-door-4u/strip" data-class="bezel" data-z-out="206.8" data-z-lift="206.0" />
    <rect id="evolution-hcm-door-4u--strip-lit" x="0" y="85.9" width="450" height="1" fill="#fff" fill-opacity="0.6" />
    <rect id="evolution-hcm-door-4u--strip-shade" x="0" y="90.9" width="450" height="1" fill="#000" fill-opacity="0.3" />
    <rect id="evolution-hcm-door-4u--lip-top" x="0" y="0" width="450" height="1.5" fill="#26282a" data-fill-from="finish" data-path="evolution-hcm-door-4u/lip-top" data-class="bezel" data-z-out="206.0" data-z-lift="190.0" />
    <rect id="evolution-hcm-door-4u--lip-bottom" x="0" y="176.3" width="450" height="1.5" fill="#121315" data-fill-from="finish" data-path="evolution-hcm-door-4u/lip-bottom" data-class="bezel" data-z-out="206.0" data-z-lift="190.0" />
  </g>
</svg>
