    <rect x="4.8" y="371.19" width="24.33" height="6.13" rx="0.8" fill="#2e7489" />
    <circle id="a9k-mod400-tr--status" cx="28.86" cy="373.95" r="1.77" fill="var(--led-color, #8d949c)" stroke="#5f6469" stroke-width="0.2" data-path="a9k-mod400-tr/status" data-class="led" data-states="green amber red off" data-description="install guide - Table 32, 'Port Status and Line Card Status LEDs', of the Ethernet Line Card Installation Guide, section 'Card Status LED (one per card)'. Green = booted properly and ready to pass, or passing, traffic; steady amber = boot underway, turning green once the Cisco IOS XR software finishes loading; blinking amber = a software configuration error keeps the card from passing traffic, though it may still be passing some in a degraded way; red = a hardware error, and no traffic passing; off = powered off, though the LED can also go dark for a moment while changing between the states above without the card powering off. Steady and blinking amber share one colour and are not carried as two states; the distinction is recorded here because it is the difference between a card booting and a card misconfigured. AN EARLIER VERSION OF THIS SENTENCE said Table 32 'is written for the fixed-port cards' and called this vocabulary a BORROWING. That was wrong. Table 32 sits in Chapter 3, 'Verifying and Troubleshooting the Line Card Installation', which is scoped to line cards generally and not to fixed-port ones - Table 33, the MPA lamp table, is in the same section, and MPAs only exist inside modular carriers. A modular line card is a line card and its Status lamp is a Card Status LED." data-z-dome="0.3" />
