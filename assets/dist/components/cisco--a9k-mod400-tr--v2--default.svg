      <rect id="a9k-mod400-tr--bay-1--opening" x="6.76" y="202.35" width="34.54" height="161.8" rx="0.5" fill="#3f4448" stroke="#2a2e31" stroke-width="0.25" />
      <g id="a9k-mod400-tr--bay-1--module" data-path="a9k-mod400-tr/bay-1/module" data-class="blank" data-behaviour="fills" data-ref="cisco/a9k-mpa-blank@1:1.0.0" data-body-depth="170.18" data-wall="#4a4f55" data-model="MPA blank" data-role="airflow-blank" transform="translate(6.76,202.35)">
