      <g id="a9k-mod400-tr--bay-0--module" data-path="a9k-mod400-tr/bay-0/module" data-class="blank" data-behaviour="fills" data-ref="cisco/a9k-mpa-blank@1:1.0.0" data-body-depth="170.18" data-wall="#4a4f55" data-model="MPA blank" data-role="airflow-blank" transform="translate(6.76,31.95)">
