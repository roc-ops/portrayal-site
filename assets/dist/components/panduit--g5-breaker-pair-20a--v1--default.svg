<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="45.8mm" height="80.7mm" viewBox="0 0 45.8 80.7">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="g5-breaker-pair-20a" data-path="g5-breaker-pair-20a" data-class="breaker" data-ref="panduit/g5-breaker-pair-20a@1:1.0.0" data-breakers="2" data-poles="1" data-rating-a="20" transform="translate(0,0)">
    <title>g5-breaker-pair-20a</title>
    <g id="g5-breaker-pair-20a--plate" transform="matrix(0,-1,1,0,0,80.7)">
      <rect x="0" y="0" width="80.7" height="45.8" rx="2.5" fill="#232528" stroke="#3b3e42" stroke-width="0.3" />
      <line x1="0" y1="22.9" x2="80.7" y2="22.9" stroke="#3b3e42" stroke-width="0.3" />
      <circle cx="5.0" cy="11.9" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2" />
      <circle cx="50.5" cy="11.9" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2" />
      <circle cx="5.0" cy="34.0" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2" />
      <circle cx="50.5" cy="34.0" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2" />
      <rect x="11.4" y="3.6" width="32.5" height="16.6" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2" />
      <rect x="11.4" y="24.9" width="32.5" height="17.1" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2" />
      <rect id="g5-breaker-pair-20a--rocker-1" x="16.0" y="6.4" width="13.0" height="11.0" rx="0.6" fill="#1b1c1e" stroke="#4d5257" stroke-width="0.2" data-path="g5-breaker-pair-20a/rocker-1" data-class="breaker" data-states="on off" />
      <rect id="g5-breaker-pair-20a--rocker-2" x="16.0" y="27.7" width="13.0" height="11.4" rx="0.6" fill="#1b1c1e" stroke="#4d5257" stroke-width="0.2" data-path="g5-breaker-pair-20a/rocker-2" data-class="breaker" data-states="on off" />
    </g>
    <g id="g5-breaker-pair-20a--silkscreen" font-family="sans-serif" fill="#d9dbde">
      <text x="10.0" y="12.2" font-size="6.0" text-anchor="middle" transform="rotate(-90 10.0 12.2)">B1</text>
      <text x="19.0" y="12.2" font-size="3.2" text-anchor="middle" font-weight="bold" transform="rotate(-90 19.0 12.2)">L-N</text>
      <text x="31.5" y="12.2" font-size="6.0" text-anchor="middle" transform="rotate(-90 31.5 12.2)">B2</text>
      <text x="38.5" y="12.2" font-size="3.2" text-anchor="middle" font-weight="bold" transform="rotate(-90 38.5 12.2)">L-N</text>
    </g>
  </g>
</svg>
