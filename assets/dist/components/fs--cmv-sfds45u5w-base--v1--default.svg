    <rect id="cmv-sfds45u5w-base--seam-left" x="0" y="976.9" width="54.5" height="0.6" fill="#0c0d0e" />
    <rect id="cmv-sfds45u5w-base--seam-right" x="114.5" y="976.9" width="54.5" height="0.6" fill="#0c0d0e" />
  </g>
</svg>
