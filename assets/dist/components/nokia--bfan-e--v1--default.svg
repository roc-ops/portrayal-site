<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32.9mm" height="345.0mm" viewBox="0 0 32.9 345.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='nokia/bfan-e@'] .state-closed-loop { --led-color: #39b54a; }
    g[data-ref^='nokia/bfan-e@'] .state-closed-loop { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='nokia/bfan-e@'] .state-fail { --led-color: #d0021b; }
    g[data-ref^='nokia/bfan-e@'] .state-on { --led-color: #39b54a; }
    g[data-ref^='nokia/bfan-e@'] .state-starting { --led-color: #39b54a; }
    g[data-ref^='nokia/bfan-e@'] .state-starting { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="bfan-e" data-path="bfan-e" data-class="fan" data-behaviour="fills" data-ref="nokia/bfan-e@1:1.0.1" data-body-depth="216.7" data-wall="#8d9298" data-airflow-m3h="6 x 192" data-dust-filter="3FE 64928 DA" data-fans="6" data-model="BFAN-E" data-part-number="3FE 66545 AA" data-power-draw-max-w="95" data-power-draw-typical-w="25" data-weight-kg="1.3" transform="translate(0,0)">
    <title>bfan-e</title>
    <rect id="bfan-e--face" x="0" y="0" width="32.9" height="345" rx="0.4" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.3" />
    <rect id="bfan-e--flange" x="24.2" y="0" width="8.7" height="345" fill="#b3b7bc" stroke="#9ba0a6" stroke-width="0.2" />
    <line id="bfan-e--fold" x1="2.4" y1="0" x2="2.4" y2="345" stroke="#9ba0a6" stroke-width="0.2" />
    <rect id="bfan-e--top-block" x="0" y="0" width="24.2" height="20.1" fill="#bfc3c7" stroke="#9ba0a6" stroke-width="0.2" />
    <rect id="bfan-e--window-left" x="4.3" y="25.1" width="8.5" height="43.9" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25" data-path="bfan-e/window-left" data-class="window" />
    <rect id="bfan-e--window-right" x="13.6" y="25.1" width="8.4" height="43.9" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25" data-path="bfan-e/window-right" data-class="window" />
    <rect id="bfan-e--caution-label" x="4.3" y="71.9" width="18.9" height="41.9" fill="#e9eaeb" stroke="#1d2023" stroke-width="0.25" data-path="bfan-e/caution-label" data-class="label" />
    <g id="bfan-e--esd-mark" data-path="bfan-e/esd-mark" data-class="label">
      <circle cx="14.25" cy="119.8" r="3.1" fill="none" stroke="#1d2023" stroke-width="0.35" />
      <path d="M 14.25 117.7 L 16.2 121.2 L 12.3 121.2 Z" fill="#1d2023" />
    </g>
    <rect id="bfan-e--label-window" x="4.3" y="179.7" width="9.5" height="27.9" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25" data-path="bfan-e/label-window" data-class="label" />
    <circle id="bfan-e--cover-boss" cx="15.4" cy="298.0" r="1.4" fill="#8d9298" stroke="#3a3f44" stroke-width="0.25" data-path="bfan-e/cover-boss" data-class="fastener" />
    <rect id="bfan-e--logo-zone" x="4.3" y="220.0" width="16.0" height="10.0" fill="none" data-path="bfan-e/logo-zone" data-class="label" />
    <g id="bfan-e--silkscreen">
      <path d="M 7.7 93.5 L 11.3 91.4 L 11.3 95.6 Z" fill="none" stroke="#1d2023" stroke-width="0.35" />
      <text x="15.6" y="92.4" font-family="Arial" font-weight="bold" font-size="3.0" fill="#1d2023" text-anchor="middle" transform="rotate(-90 15.6 92.4)">CAUTION</text>
      <text x="21.0" y="91.3" font-family="Arial" font-weight="bold" font-size="3.0" fill="#1d2023" text-anchor="middle" transform="rotate(-90 21.0 91.3)">ROTATING FAN BLADES</text>
    </g>
    <g id="bfan-e--grip" data-path="bfan-e/grip" data-class="handle" data-z-out="3.0">
      <rect x="11.1" y="129.8" width="13.8" height="34.8" fill="#b3b7bc" stroke="#3a3f44" stroke-width="0.3" />
      <line x1="21.0" y1="129.8" x2="21.0" y2="164.6" stroke="#3a3f44" stroke-width="0.25" />
    </g>
    <g id="bfan-e--captive-screw" data-path="bfan-e/captive-screw" data-class="fastener" data-z-cyl="6.0">
      <circle cx="15.5" cy="340.0" r="4.5" fill="#2e3236" stroke="#15171a" stroke-width="0.3" />
      <circle cx="15.5" cy="340.0" r="2.2" fill="none" stroke="#6f757b" stroke-width="0.3" />
      <path d="M 14.3 340.0 H 16.7 M 15.5 338.8 V 341.2" stroke="#6f757b" stroke-width="0.35" />
    </g>
    <g id="bfan-e--led-status" data-path="bfan-e/led-status" data-class="led" data-ref="common/led-indicator@1:1.2.0" transform="translate(5.65,317.45)" data-group="status-leds" data-group-role="indicator" data-description="the fan unit's single status lamp">
      <title>bfan-e--led-status</title>
      <circle id="bfan-e--led-status--bezel" cx="2" cy="2" r="1.6" fill="#1c1f23" stroke="#4a4f55" stroke-width="0.2" />
      <circle id="bfan-e--led-status--lamp" cx="2" cy="2" r="1.0" fill="var(--led-color, #3a3f44)" data-path="bfan-e/led-status/lamp" data-class="led" data-states="off starting on closed-loop fail" data-z-dome="0.45" />
    </g>
    <g data-cp="mate" data-cp-at="16.45 172.5" data-cp-dir="rear" />
  </g>
</svg>
