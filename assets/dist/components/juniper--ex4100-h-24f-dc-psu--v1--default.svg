<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="184.9mm" height="39.5mm" viewBox="0 0 184.9 39.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex4100-h-24f-dc-psu@'] .state-amber { --led-color: #f5a623; }
    g[data-ref^='juniper/ex4100-h-24f-dc-psu@'] .state-green { --led-color: #39b54a; }</style>
  <g id="ex4100-h-24f-dc-psu" data-path="ex4100-h-24f-dc-psu" data-class="psu" data-behaviour="fills" data-ref="juniper/ex4100-h-24f-dc-psu@1:1.0.0" data-cooling="fanless, convection cooled" data-inlet="none" data-input="20.4 through 72 VDC at the terminal block, nominal +24, -48 or -60 VDC" data-input-current="5.5 A at +24 V, 2.75 A at -48 V and 2.2 A at -60 V, as printed on the label" data-power-output-w="90" data-role="dc-power-supply" data-weight-kg="1.16" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex4100-h-24f-dc-psu</title>
    <rect id="ex4100-h-24f-dc-psu--flank" x="0" y="0" width="12.9" height="39.5" fill="#6a727f" />
    <rect id="ex4100-h-24f-dc-psu--body" x="12.5" y="0" width="172.4" height="39.5" rx="0.8" fill="#5b626e" stroke="#2f343b" stroke-width="0.4" />
    <rect x="13.5" y="32.8" width="170.4" height="5.6" fill="#4a505a" />
    <rect id="ex4100-h-24f-dc-psu--tab" x="0" y="18.3" width="15.4" height="15.0" rx="0.8" fill="#5d6471" stroke="#2f343b" stroke-width="0.35" />
    <g id="ex4100-h-24f-dc-psu--thumbscrew">
      <circle cx="7.1" cy="26.0" r="4.9" fill="#2b2f36" stroke="#8d949c" stroke-width="0.35" />
      <circle cx="7.1" cy="26.0" r="3.5" fill="#4a505a" stroke="#8d949c" stroke-width="0.3" />
      <path d="M 4.7 26.0 H 9.5 M 7.1 23.6 V 28.4" fill="none" stroke="#c9cdd2" stroke-width="0.6" stroke-linecap="round" />
    </g>
    <rect id="ex4100-h-24f-dc-psu--label" x="15.8" y="2.2" width="24.1" height="30.8" fill="#6b7280" stroke="#2f343b" stroke-width="0.3" />
    <g id="ex4100-h-24f-dc-psu--fins" fill="#363b44" stroke="#232730" stroke-width="0.2">
      <rect x="43.95" y="1.6" width="1.7" height="31.5" />
      <rect x="51.15" y="1.6" width="1.7" height="31.5" />
      <rect x="58.15" y="1.6" width="1.7" height="31.5" />
      <rect x="64.95" y="1.6" width="1.7" height="31.5" />
      <rect x="71.75" y="1.6" width="1.7" height="31.5" />
      <rect x="78.75" y="1.6" width="1.7" height="31.5" />
      <rect x="85.35" y="1.6" width="1.7" height="31.5" />
      <rect x="92.35" y="1.6" width="1.7" height="31.5" />
      <rect x="99.15" y="1.6" width="1.7" height="31.5" />
      <rect x="106.25" y="1.6" width="1.7" height="31.5" />
      <rect x="113.15" y="1.6" width="1.7" height="31.5" />
    </g>
    <g id="ex4100-h-24f-dc-psu--handle" data-path="ex4100-h-24f-dc-psu/handle" data-class="latch" data-z-out="1.6" data-z-color="#a2dd35">
      <rect x="120.5" y="0.0" width="37.5" height="28.0" rx="0.6" fill="#454b56" stroke="#232730" stroke-width="0.3" />
      <path d="M 125.2 1.3 V 28.0 M 129.8 1.3 V 28.0 M 134.4 1.3 V 28.0 M 139.0 1.3 V 28.0 M 143.6 1.3 V 28.0 M 148.2 1.3 V 28.0 M 152.8 1.3 V 28.0" fill="none" stroke="#2b2f36" stroke-width="0.8" />
      <path d="M 118.5 28.0 V 35.7 Q 118.5 38.0 120.8 38.0 H 157.6 Q 159.9 38.0 159.9 35.7 V 28.0" fill="none" stroke="#a2dd35" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M 120.6 28.0 V 35.2 H 157.8 V 28.0" fill="none" stroke="#7fb82a" stroke-width="0.4" />
    </g>
    <rect id="ex4100-h-24f-dc-psu--lamp-plate" x="163.6" y="1.8" width="15.3" height="30.7" fill="#6b7280" stroke="#2f343b" stroke-width="0.3" />
    <circle cx="174.6" cy="16.8" r="3.0" fill="#2b2f36" />
    <circle id="ex4100-h-24f-dc-psu--led-out-ok" cx="174.6" cy="16.8" r="2.5" fill="var(--led-color, #8a9099)" stroke="#2a2d30" stroke-width="0.3" data-path="ex4100-h-24f-dc-psu/led-out-ok" data-class="led" data-states="green amber off" />
    <path id="ex4100-h-24f-dc-psu--hot" d="M 170.7 23.8 L 174.7 30.5 H 166.7 Z" fill="none" stroke="#2b2f36" stroke-width="0.4" stroke-linejoin="round" />
    <path d="M 169.4 28.8 Q 170.2 27.6 169.4 26.7 M 170.7 28.8 Q 171.5 27.6 170.7 26.7 M 172.0 28.8 Q 172.8 27.6 172.0 26.7" fill="none" stroke="#2b2f36" stroke-width="0.3" />
    <g id="ex4100-h-24f-dc-psu--silkscreen" font-family="Arial" fill="#dfe2e6">
      <g font-size="2.5">
        <text x="18.2" y="8.4" font-weight="bold">DC INPUT</text>
        <text x="18.2" y="11.7">+24V = 5.5A</text>
        <text x="18.2" y="15.3">-48V = 2.75A</text>
        <text x="18.2" y="18.5">-60V = 2.2A</text>
      </g>
      <text x="171.2" y="10.9" text-anchor="middle" font-size="2.3" fill="#dfe2e6">OUT_OK</text>
    </g>
  </g>
</svg>
