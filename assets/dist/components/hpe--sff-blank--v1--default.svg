      <rect x="34.5" y="4.5" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
      <rect x="34.5" y="7.9" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
      <rect x="38.5" y="4.5" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
      <rect x="38.5" y="7.9" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
      <rect x="42.5" y="4.5" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
      <rect x="42.5" y="7.9" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
      <rect x="46.5" y="4.5" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
      <rect x="46.5" y="7.9" width="3" height="2.6" rx="0.5" fill="#0c0e10" />
