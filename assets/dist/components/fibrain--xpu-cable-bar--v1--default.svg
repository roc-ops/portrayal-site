    <path id="xpu-cable-bar--lower" fill="#22262a" fill-rule="evenodd" d="M 0 14.5 H 435.0 V 29.0 H 0 Z M 11.00 18.0 h 4 v 8 h -4 Z M 25.00 18.0 h 4 v 8 h -4 Z M 46.42 18.0 h 4 v 8 h -4 Z M 60.42 18.0 h 4 v 8 h -4 Z M 81.83 18.0 h 4 v 8 h -4 Z M 95.83 18.0 h 4 v 8 h -4 Z M 117.25 18.0 h 4 v 8 h -4 Z M 131.25 18.0 h 4 v 8 h -4 Z M 152.67 18.0 h 4 v 8 h -4 Z M 166.67 18.0 h 4 v 8 h -4 Z M 188.08 18.0 h 4 v 8 h -4 Z M 202.08 18.0 h 4 v 8 h -4 Z M 223.50 18.0 h 4 v 8 h -4 Z M 237.50 18.0 h 4 v 8 h -4 Z M 258.92 18.0 h 4 v 8 h -4 Z M 272.92 18.0 h 4 v 8 h -4 Z M 294.33 18.0 h 4 v 8 h -4 Z M 308.33 18.0 h 4 v 8 h -4 Z M 329.75 18.0 h 4 v 8 h -4 Z M 343.75 18.0 h 4 v 8 h -4 Z M 365.17 18.0 h 4 v 8 h -4 Z M 379.17 18.0 h 4 v 8 h -4 Z M 400.58 18.0 h 4 v 8 h -4 Z M 414.58 18.0 h 4 v 8 h -4 Z" data-path="xpu-cable-bar/lower" data-class="bezel" data-z-out="12.85" data-z-lift="11.65" data-z-color="#1b1e21" />
    <rect id="xpu-cable-bar--upright" x="8.6" y="13.9" width="417.8" height="1.2" fill="#0c0d0e" data-path="xpu-cable-bar/upright" data-class="bezel" data-z-out="30.65" data-z-lift="11.65" data-z-color="#1b1e21" />
  </g>
