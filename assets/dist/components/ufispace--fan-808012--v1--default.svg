<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="81.0mm" height="81.5mm" viewBox="0 0 81.0 81.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/fan-808012@'] .state-fault { --led-color: #f59e0b; }
    g[data-ref^='ufispace/fan-808012@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="fan-808012" data-path="fan-808012" data-class="fan" data-behaviour="fills" data-ref="ufispace/fan-808012@1:1.0.0" data-airflow="exhaust" data-model="FAN-808012-HCE" data-power-absent="not-published" transform="translate(0,0)">
    <title>fan-808012</title>
    <defs>
      <pattern id="fan-808012--hex808" width="4.2" height="2.42" patternUnits="userSpaceOnUse">
        <path d="M 1.21 0 L 0.605 1.047 L -0.605 1.047 L -1.21 0 L -0.605 -1.047 L 0.605 -1.047 Z" fill="#0d0f11" />
        <path d="M 5.41 0 L 4.805 1.047 L 3.595 1.047 L 2.99 0 L 3.595 -1.047 L 4.805 -1.047 Z" fill="#0d0f11" />
        <path d="M 3.31 1.21 L 2.705 2.257 L 1.495 2.257 L 0.89 1.21 L 1.495 0.163 L 2.705 0.163 Z" fill="#0d0f11" />
        <path d="M 1.21 2.42 L 0.605 3.467 L -0.605 3.467 L -1.21 2.42 L -0.605 1.373 L 0.605 1.373 Z" fill="#0d0f11" />
        <path d="M 5.41 2.42 L 4.805 3.467 L 3.595 3.467 L 2.99 2.42 L 3.595 1.373 L 4.805 1.373 Z" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="fan-808012--body" x="0" y="0" width="81" height="81.5" rx="0.8" fill="#2b2f33" stroke="#1a1d20" stroke-width="0.5" />
    <rect id="fan-808012--grille" x="2.0" y="2.0" width="77.0" height="77.5" rx="0.6" fill="url(#fan-808012--hex808)" data-z-vent="25" />
    <g id="fan-808012--handle" data-path="fan-808012/handle" data-class="handle" data-z-uhandle="29">
      <rect x="23.0" y="22.4" width="5.5" height="37.2" rx="2.7" fill="#c22f2f" />
      <rect x="17.6" y="22.4" width="6.4" height="3.4" rx="1.6" fill="#c22f2f" />
      <rect x="17.6" y="56.2" width="6.4" height="3.4" rx="1.6" fill="#c22f2f" />
    </g>
    <rect id="fan-808012--release-tab" x="0.5" y="30.6" width="5.2" height="21.3" rx="1.2" fill="#d13a3a" data-path="fan-808012/release-tab" data-class="latch" data-z-out="2.2" />
    <g id="fan-808012--silkscreen">
      <rect x="2.2" y="3.7" width="9.8" height="7.7" rx="0.8" fill="#d21f1f" />
      <text x="7.1" y="9.9" font-family="sans-serif" font-size="6.4" font-weight="bold" text-anchor="middle" fill="#0d0f11">E</text>
    </g>
    <circle id="fan-808012--status-led" cx="9.5" cy="19.6" r="1.5" fill="var(--led-color, #3a3f44)" data-path="fan-808012/status-led" data-class="led" data-states="off ok fault" data-description="S9321-64E HIG Fan FRU LED table - Off (BMC is not up), Green (Fan FRU function normal), Amber (Fan FRU is abnormal, the fan speed is under 4500rpm)" data-z-dome="0.4" />
  </g>
</svg>
