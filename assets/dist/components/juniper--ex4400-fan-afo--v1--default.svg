<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="41.8mm" height="41.8mm" viewBox="0 0 41.8 41.8">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/ex4400-fan-afo@'] .state-green { --led-color: #39b54a; }</style>
  <g id="ex4400-fan-afo" data-path="ex4400-fan-afo" data-class="fan" data-behaviour="fills" data-ref="juniper/ex4400-fan-afo@1:1.0.0" data-body-depth="115.7" data-airflow="front-to-back" data-hot-swap="yes" data-model="EX4400 fan module, airflow out (AFO)" data-role="chassis-fan" data-states="ok fault absent" transform="translate(0,0)">
    <title>ex4400-fan-afo</title>
    <defs>
      <pattern id="ex4400-fan-afo--hex" width="7.8" height="4.5" patternUnits="userSpaceOnUse">
        <polygon points="0.3,2.25 1.45,0.26 3.75,0.26 4.9,2.25 3.75,4.24 1.45,4.24" fill="none" stroke="#9aa0a6" stroke-width="0.45" />
        <polygon points="4.2,0 5.35,-1.99 7.65,-1.99 8.8,0 7.65,1.99 5.35,1.99" fill="none" stroke="#9aa0a6" stroke-width="0.45" />
        <polygon points="4.2,4.5 5.35,2.51 7.65,2.51 8.8,4.5 7.65,6.49 5.35,6.49" fill="none" stroke="#9aa0a6" stroke-width="0.45" />
        <polygon points="-3.6,0 -2.45,-1.99 -0.15,-1.99 1.0,0 -0.15,1.99 -2.45,1.99" fill="none" stroke="#9aa0a6" stroke-width="0.45" />
        <polygon points="-3.6,4.5 -2.45,2.51 -0.15,2.51 1.0,4.5 -0.15,6.49 -2.45,6.49" fill="none" stroke="#9aa0a6" stroke-width="0.45" />
      </pattern>
    </defs>
    <rect id="ex4400-fan-afo--face" x="0" y="0" width="41.8" height="41.8" rx="3.0" fill="#e8a010" stroke="#b57c0a" stroke-width="0.4" />
    <g id="ex4400-fan-afo--grille">
      <polygon points="9.6,3.9 34.0,3.9 37.5,7.4 37.5,35.1 34.0,38.6 7.3,38.6 3.3,34.6 3.3,9.8" fill="#0d0e10" />
      <polygon points="9.6,3.9 34.0,3.9 37.5,7.4 37.5,35.1 34.0,38.6 7.3,38.6 3.3,34.6 3.3,9.8" fill="url(#ex4400-fan-afo--hex)" />
    </g>
    <g id="ex4400-fan-afo--handle" data-path="ex4400-fan-afo/handle" data-class="latch" data-z-out="2.0" data-z-color="#e8a010">
      <polygon points="0.6,21.5 41.2,21.5 41.2,31.4 36.0,32.4 5.8,32.4 0.6,31.4" fill="#e8a010" stroke="#b57c0a" stroke-width="0.3" />
      <polygon points="5.1,24.9 10.7,25.6 10.7,28.6 5.1,29.3" fill="#0d0e10" />
      <polygon points="36.2,24.9 30.3,25.6 30.3,28.6 36.2,29.3" fill="#0d0e10" />
      <rect id="ex4400-fan-afo--airout-chip" x="14.0" y="24.2" width="13.0" height="6.6" rx="0.8" fill="#3a3b3d" />
      <g fill="#e8a010">
        <circle cx="16.9" cy="27.5" r="0.7" />
        <ellipse cx="16.0" cy="26.3" rx="1.0" ry="0.7" transform="rotate(-35 16.0 26.3)" />
        <ellipse cx="17.9" cy="26.3" rx="1.0" ry="0.7" transform="rotate(35 17.9 26.3)" />
        <ellipse cx="16.0" cy="28.7" rx="1.0" ry="0.7" transform="rotate(35 16.0 28.7)" />
        <ellipse cx="17.9" cy="28.7" rx="1.0" ry="0.7" transform="rotate(-35 17.9 28.7)" />
      </g>
      <g id="ex4400-fan-afo--silkscreen">
        <text x="23.2" y="27.0" font-family="Arial" font-size="2.4" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="23.2" y="29.9" font-family="Arial" font-size="2.4" fill="#e8eaec" text-anchor="middle">OUT</text>
      </g>
    </g>
    <g id="ex4400-fan-afo--screw" data-path="ex4400-fan-afo/screw" data-class="screw" data-z-cyl="2.0" data-z-knurl="1">
      <circle cx="4.3" cy="4.9" r="3.2" fill="#d6d8db" stroke="#8d9196" stroke-width="0.35" />
      <path d="M 2.6 4.9 H 6.0 M 4.3 3.2 V 6.6" stroke="#7a7e83" stroke-width="0.7" fill="none" />
    </g>
    <circle id="ex4400-fan-afo--led" cx="36.4" cy="37.6" r="1.3" fill="var(--led-color, #b8bcc2)" stroke="#8d9196" stroke-width="0.3" data-path="ex4400-fan-afo/led" data-class="led" data-states="green off" />
  </g>
</svg>
