<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40.9mm" height="41.5mm" viewBox="0 0 40.9 41.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ex4600-fan-afo" data-path="ex4600-fan-afo" data-class="fan" data-behaviour="fills" data-ref="juniper/ex4600-fan-afo@1:1.0.0" data-airflow="front-to-back" data-power-absent="not-published" data-role="chassis-fan" data-states="absent" transform="translate(0,0)">
    <title>ex4600-fan-afo</title>
    <defs>
      <pattern id="ex4600-fan-afo--hex" width="2.6" height="4.5" patternUnits="userSpaceOnUse">
        <polygon points="1.3,0.1 2.25,0.65 2.25,1.75 1.3,2.3 0.35,1.75 0.35,0.65" fill="#050607" />
        <polygon points="0,2.35 0.95,2.9 0.95,4.0 0,4.55 -0.95,4.0 -0.95,2.9" fill="#050607" />
        <polygon points="2.6,2.35 3.55,2.9 3.55,4.0 2.6,4.55 1.65,4.0 1.65,2.9" fill="#050607" />
      </pattern>
    </defs>
    <rect id="ex4600-fan-afo--face" x="0.2" y="0.2" width="40.5" height="41.1" rx="2.0" fill="#e8731f" stroke="#8e4613" stroke-width="0.4" data-fill-from="handle-finish" data-stroke-derive="handle-finish" />
    <g id="ex4600-fan-afo--grille-top">
      <rect x="7.4" y="4.3" width="27.4" height="11.2" rx="3.0" fill="#1a1d20" />
      <rect x="7.4" y="4.3" width="27.4" height="11.2" rx="3.0" fill="url(#ex4600-fan-afo--hex)" />
    </g>
    <g id="ex4600-fan-afo--grille-bottom">
      <rect x="7.2" y="26.7" width="27.5" height="10.3" rx="3.0" fill="#1a1d20" />
      <rect x="7.2" y="26.7" width="27.5" height="10.3" rx="3.0" fill="url(#ex4600-fan-afo--hex)" />
    </g>
    <g id="ex4600-fan-afo--handle" data-path="ex4600-fan-afo/handle" data-class="latch" data-z-out="2.0">
      <rect x="4.8" y="14.8" width="31.3" height="12.0" rx="3.0" fill="#e8731f" stroke="#8e4613" stroke-width="0.35" data-fill-from="handle-finish" data-stroke-derive="handle-finish" />
      <rect x="4.8" y="14.8" width="31.3" height="12.0" rx="3.0" fill="#ffffff" fill-opacity="0.22" />
      <rect x="0.6" y="19.0" width="5.2" height="4.6" rx="0.6" fill="#000000" fill-opacity="0.2" />
      <rect x="35.1" y="19.0" width="5.2" height="4.6" rx="0.6" fill="#000000" fill-opacity="0.2" />
      <rect id="ex4600-fan-afo--airflow-chip" x="12.5" y="17.4" width="12.9" height="6.8" rx="0.7" fill="#6f7377" />
      <g id="ex4600-fan-afo--fan-symbol">
        <circle cx="15.9" cy="20.8" r="0.45" fill="#e8731f" data-fill-from="handle-finish" />
        <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#e8731f" data-fill-from="handle-finish" />
        <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#e8731f" data-fill-from="handle-finish" transform="rotate(90 15.9 20.8)" />
        <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#e8731f" data-fill-from="handle-finish" transform="rotate(180 15.9 20.8)" />
        <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#e8731f" data-fill-from="handle-finish" transform="rotate(270 15.9 20.8)" />
      </g>
      <g id="ex4600-fan-afo--silkscreen">
        <text x="21.6" y="20.4" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">AIR</text>
        <text x="21.6" y="23.2" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">OUT</text>
      </g>
    </g>
    <g id="ex4600-fan-afo--screw" data-path="ex4600-fan-afo/screw" data-class="screw" data-z-cyl="2.5" data-z-knurl="1">
      <circle cx="4.7" cy="3.9" r="3.1" fill="#111214" stroke="#3a3e43" stroke-width="0.35" />
      <circle cx="4.7" cy="3.9" r="1.2" fill="#26292d" />
      <path d="M 3.5 3.9 H 5.9 M 4.7 2.7 V 5.1" stroke="#5a5f66" stroke-width="0.4" />
    </g>
  </g>
</svg>
