        <path d="M 2.6516 4.735 H 6.8184 M 4.735 2.6516 V 6.8184" fill="none" stroke="#4e5359" stroke-width="0.5682" stroke-linecap="round" />
      </g>
      <g data-cp="mate" data-cp-at="4.735 4.735" data-cp-dir="front" data-cp-on="a9k-ground-pad--2--head" />
