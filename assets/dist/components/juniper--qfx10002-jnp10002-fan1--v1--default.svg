      <polygon points="8.8,77.0 73.2,77.0 73.8,73.0 67.0,52.0 65.4,47.4 18.0,47.4 16.8,52.0 9.4,73.0" fill="url(#qfx10002-jnp10002-fan1--qfx10002-jnp10002-fan1-mesh)" />
    </g>
