      <polygon points="8.8,4.4 73.2,4.4 73.8,8.0 67.0,31.0 65.4,35.8 18.0,35.8 16.8,31.0 9.4,8.0" fill="url(#qfx10002-jnp10002-fan1--qfx10002-jnp10002-fan1-mesh)" />
