          <path d="M 5.88 2.598 L 5.19 3.793 L 3.81 3.793 L 3.12 2.598 L 3.81 1.403 L 5.19 1.403 Z" />
          <path d="M 3.63 1.299 L 2.94 2.494 L 1.56 2.494 L 0.87 1.299 L 1.56 0.104 L 2.94 0.104 Z" />
          <path d="M 3.63 -1.299 L 2.94 -0.104 L 1.56 -0.104 L 0.87 -1.299 L 1.56 -2.494 L 2.94 -2.494 Z" />
          <path d="M 3.63 3.897 L 2.94 5.092 L 1.56 5.092 L 0.87 3.897 L 1.56 2.702 L 2.94 2.702 Z" />
        </g>
      </pattern>
    </defs>
    <rect id="nc57-c3-fan1-fw--body" x="0" y="0" width="45.5" height="89" rx="0.6" fill="#c3c7cc" stroke="#6b7076" stroke-width="0.3" />
    <g id="nc57-c3-fan1-fw--fan-a" data-path="nc57-c3-fan1-fw/fan-a" data-class="rotor">
