    <circle id="nc57-c3-fan1-fw--status" cx="5.6" cy="84.5" r="1.4" fill="var(--led-color, #3a3f44)" stroke="#e6e8ea" stroke-width="0.3" data-path="nc57-c3-fan1-fw/status" data-class="led" data-states="off ok failed" />
  </g>
