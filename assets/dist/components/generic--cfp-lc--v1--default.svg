<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="82mm" height="14mm" viewBox="-2.4 -0.2 82 14">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="cfp-lc" data-path="cfp-lc" data-class="transceiver" data-behaviour="occupies" data-ref="generic/cfp-lc@1:1.0.1" data-depth="130.25" data-face="lc-duplex" data-form-factor="cfp" data-media="fiber" data-power-absent="not-applicable" transform="translate(0,0)">
    <title>cfp-lc</title>
    <rect id="cfp-lc--body" x="-2.3" y="-0.1" width="81.8" height="13.8" rx="0.6" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2" data-z-out="14.5" data-z-color="#9aa0a8" />
    <rect id="cfp-lc--opening" x="32.825" y="2.55" width="11.55" height="6.9" rx="0.4" fill="#2a2f34" />
    <g font-family="sans-serif" font-size="0.9" fill="#2a2f34" text-anchor="middle">
      <g id="cfp-lc--silkscreen">
        <text x="35.475" y="11.9">T</text>
        <text x="41.725" y="11.9">R</text>
        <text id="cfp-lc--label" x="38.6" y="13.2" data-from="label" font-size="0.7" />
      </g>
    </g>
    <g id="cfp-lc--tx" data-path="cfp-lc/tx" data-class="port" data-ref="std/lc-bore@3:3.0.2" data-depth="4.5" data-wall="#4a4f55" data-cavity="bore" data-connector="lc" data-media="fiber" transform="translate(33.125,2.85) rotate(180 2.35 3.15)" data-z-lift="14.5">
      <title>cfp-lc--tx</title>
      <path id="cfp-lc--tx--bore" fill="#15181b" d="     M 0 0 h 4.7 v 4.70     h -0.62 v 0.42 h 0.62 v 0.49     h -1.03 v 0.69 h -2.64 v -0.69     h -1.03 v -0.49 h 0.62 v -0.42 h -0.62 z" data-path="cfp-lc/tx/bore" data-class="cutout" />
      <rect id="cfp-lc--tx--key-neck" x="0.62" y="4.70" width="3.46" height="0.42" fill="#15181b" data-z-top="3.6" />
      <rect id="cfp-lc--tx--key-shoulder" x="0" y="5.12" width="4.7" height="0.49" fill="#15181b" data-z-top="2.9" />
      <rect id="cfp-lc--tx--key-tongue" x="1.03" y="5.61" width="2.64" height="0.69" fill="#15181b" data-z-top="2.2" />
      <circle id="cfp-lc--tx--sleeve" cx="2.35" cy="2.35" r="1.2" fill="#22262a" stroke="#3a4046" stroke-width="0.12" />
      <circle id="cfp-lc--tx--ferrule" cx="2.35" cy="2.35" r="0.625" fill="#e8ecef" data-z-top="3.6" data-z-color="#e8ecef" />
      <g data-cp="mate" data-cp-at="2.35 2.35" data-cp-dir="front" />
    </g>
    <g id="cfp-lc--rx" data-path="cfp-lc/rx" data-class="port" data-ref="std/lc-bore@3:3.0.2" data-depth="4.5" data-wall="#4a4f55" data-cavity="bore" data-connector="lc" data-media="fiber" transform="translate(39.375,2.85) rotate(180 2.35 3.15)" data-z-lift="14.5">
      <title>cfp-lc--rx</title>
      <path id="cfp-lc--rx--bore" fill="#15181b" d="     M 0 0 h 4.7 v 4.70     h -0.62 v 0.42 h 0.62 v 0.49     h -1.03 v 0.69 h -2.64 v -0.69     h -1.03 v -0.49 h 0.62 v -0.42 h -0.62 z" data-path="cfp-lc/rx/bore" data-class="cutout" />
      <rect id="cfp-lc--rx--key-neck" x="0.62" y="4.70" width="3.46" height="0.42" fill="#15181b" data-z-top="3.6" />
      <rect id="cfp-lc--rx--key-shoulder" x="0" y="5.12" width="4.7" height="0.49" fill="#15181b" data-z-top="2.9" />
      <rect id="cfp-lc--rx--key-tongue" x="1.03" y="5.61" width="2.64" height="0.69" fill="#15181b" data-z-top="2.2" />
      <circle id="cfp-lc--rx--sleeve" cx="2.35" cy="2.35" r="1.2" fill="#22262a" stroke="#3a4046" stroke-width="0.12" />
      <circle id="cfp-lc--rx--ferrule" cx="2.35" cy="2.35" r="0.625" fill="#e8ecef" data-z-top="3.6" data-z-color="#e8ecef" />
      <g data-cp="mate" data-cp-at="2.35 2.35" data-cp-dir="front" />
    </g>
    <g id="cfp-lc--screw-l" data-path="cfp-lc/screw-l" data-class="screw" data-ref="common/cfp-thumbscrew@1:1.0.0" data-role="fastener" transform="translate(-2.0,2.2)" data-z-lift="14.5">
      <title>cfp-lc--screw-l</title>
      <circle id="cfp-lc--screw-l--knob" cx="4.6" cy="4.6" r="4.6" fill="#6f6f6f" stroke="#444444" stroke-width="0.18" data-fill-from="latch-color" data-stroke-derive="latch-color" data-path="cfp-lc/screw-l/knob" data-class="screw" data-z-cyl="9.5" data-z-knurl="1" />
      <path id="cfp-lc--screw-l--cross" d="M 2.3 4.6 H 6.9 M 4.6 2.3 V 6.9" fill="none" stroke="#2a2f34" stroke-width="0.5" stroke-linecap="round" />
    </g>
    <g id="cfp-lc--screw-r" data-path="cfp-lc/screw-r" data-class="screw" data-ref="common/cfp-thumbscrew@1:1.0.0" data-role="fastener" transform="translate(70.0,2.2)" data-z-lift="14.5">
      <title>cfp-lc--screw-r</title>
      <circle id="cfp-lc--screw-r--knob" cx="4.6" cy="4.6" r="4.6" fill="#6f6f6f" stroke="#444444" stroke-width="0.18" data-fill-from="latch-color" data-stroke-derive="latch-color" data-path="cfp-lc/screw-r/knob" data-class="screw" data-z-cyl="9.5" data-z-knurl="1" />
      <path id="cfp-lc--screw-r--cross" d="M 2.3 4.6 H 6.9 M 4.6 2.3 V 6.9" fill="none" stroke="#2a2f34" stroke-width="0.5" stroke-linecap="round" />
    </g>
    <g data-cp="mate" data-cp-at="38.6 6.8" data-cp-dir="front" />
    <g data-cp="optical-rx" data-cp-at="41.725 6.8" data-cp-dir="front" />
    <g data-cp="optical-tx" data-cp-at="35.475 6.8" data-cp-dir="front" />
  </g>
</svg>
