    <circle id="dcp-2-psu-dc--lamp-status" cx="67.8" cy="36.2" r="1.8" fill="var(--led-color, #1d2124)" stroke="#5f646a" stroke-width="0.3" data-path="dcp-2-psu-dc/lamp-status" data-class="indicator" data-z-out="0.2" />
    <g data-cp="power" data-cp-at="50.5 20" data-cp-dir="rear" />
