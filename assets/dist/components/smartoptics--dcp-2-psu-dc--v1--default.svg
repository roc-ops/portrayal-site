      <circle id="dcp-2-psu-dc--screw-tr" cx="40.85" cy="9.70" r="1.70" data-path="dcp-2-psu-dc/screw-tr" data-class="fastener" data-z-dome="1.6" />
      <circle id="dcp-2-psu-dc--screw-bl" cx="10.15" cy="36.30" r="1.70" data-path="dcp-2-psu-dc/screw-bl" data-class="fastener" data-z-dome="1.6" />
