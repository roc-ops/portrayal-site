      <path d="M 72.6 37.4 V 42.6 M 74.2 37.4 V 42.6 M 75.8 37.4 V 42.6 M 77.4 37.4 V 42.6 M 79.0 37.4 V 42.6" stroke="#6e2c04" stroke-width="0.5" fill="none" />
