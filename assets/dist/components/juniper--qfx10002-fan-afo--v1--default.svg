      <polygon points="8.9,4.3 73.3,4.3 74.2,8.6 68.6,28.2 66.5,35.1 18.2,35.1 15.7,30.0 9.6,8.6" fill="url(#qfx10002-fan-afo--qfx10002-fan-afo-mesh)" />
      <polygon id="qfx10002-fan-afo--grille-bottom" points="8.9,77.4 73.3,77.4 74.2,73.1 68.6,53.5 66.5,46.6 18.2,46.6 15.7,51.7 9.6,73.1" fill="#17191b" data-path="qfx10002-fan-afo/grille-bottom" data-class="rotor" data-z-vent="60" />
      <polygon points="8.9,77.4 73.3,77.4 74.2,73.1 68.6,53.5 66.5,46.6 18.2,46.6 15.7,51.7 9.6,73.1" fill="url(#qfx10002-fan-afo--qfx10002-fan-afo-mesh)" />
    </g>
    <g id="qfx10002-fan-afo--screw">
      <circle cx="3.9" cy="5.1" r="3.3" fill="#2e3135" stroke="#17191c" stroke-width="0.25" />
      <circle cx="3.9" cy="5.1" r="2.0" fill="#555a60" />
      <path d="M 2.5 5.1 H 5.3 M 3.9 3.7 V 6.5" stroke="#17191c" stroke-width="0.4" fill="none" />
