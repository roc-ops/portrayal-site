    </g>
    <g id="qfx10002-fan-afo--silkscreen" font-family="sans-serif" font-weight="bold" font-size="2.3" fill="#ffffff">
      <text x="43.9" y="40.4" text-anchor="middle">AIR</text>
      <text x="43.9" y="43.5" text-anchor="middle">OUT</text>
    </g>
  </g>
