<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="190.7mm" height="39.5mm" viewBox="0 0 190.7 39.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ws-x4993-f" data-path="ws-x4993-f" data-class="fan" data-behaviour="fills" data-ref="cisco/ws-x4993-f@1:1.0.0" data-wall="#15181b" data-airflow="back-to-front" data-fans="4" data-model="WS-X4993-F" data-power-absent="not-published" data-states="absent" transform="translate(0,0)">
    <title>ws-x4993-f</title>
    <defs>
      <pattern id="ws-x4993-f--x4993f-mesh" width="3.4" height="2.9" patternUnits="userSpaceOnUse">
        <circle cx="0.85" cy="0.75" r="0.75" fill="#0d0f11" />
        <circle cx="2.55" cy="2.2" r="0.75" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="ws-x4993-f--body" x="0" y="0" width="190.7" height="39.5" rx="0.5" fill="#506b73" stroke="#2b3a40" stroke-width="0.4" />
    <g id="ws-x4993-f--grille" data-path="ws-x4993-f/grille" data-class="rotor" data-z-vent="26">
      <rect id="ws-x4993-f--grille-back" x="12.0" y="1.5" width="171.9" height="36.5" rx="0.5" fill="#3f565d" />
      <rect id="ws-x4993-f--grille-holes" x="12.0" y="1.5" width="171.9" height="36.5" fill="url(#ws-x4993-f--x4993f-mesh)" />
    </g>
    <g id="ws-x4993-f--screw-left" data-path="ws-x4993-f/screw-left" data-class="screw">
      <circle cx="5.7" cy="19.9" r="3.0" fill="#e9ecef" stroke="#8d949b" stroke-width="0.3" />
      <path d="M 4.0 19.9 H 7.4 M 5.7 18.2 V 21.6" stroke="#5c6167" stroke-width="0.45" />
    </g>
    <g id="ws-x4993-f--screw-right" data-path="ws-x4993-f/screw-right" data-class="screw">
      <circle cx="187.6" cy="19.9" r="3.0" fill="#e9ecef" stroke="#8d949b" stroke-width="0.3" />
      <path d="M 185.9 19.9 H 189.3 M 187.6 18.2 V 21.6" stroke="#5c6167" stroke-width="0.45" />
    </g>
    <rect id="ws-x4993-f--handle" x="66.7" y="17.8" width="57.3" height="5.2" rx="2.6" fill="#c9ced2" stroke="#8d949b" stroke-width="0.4" data-path="ws-x4993-f/handle" data-class="handle" data-z-uhandle="12.0" data-z-color="#c9ced2" />
    <g id="ws-x4993-f--silkscreen" font-family="sans-serif" fill="#e4e7ea">
      <text id="ws-x4993-f--silk-model" x="1.2" y="3.4" font-size="1.4" text-anchor="start">WS-X4993-F</text>
      <text id="ws-x4993-f--silk-ps1" x="5.7" y="34.6" font-size="1.7" text-anchor="middle">PS 1</text>
      <text id="ws-x4993-f--silk-ps2" x="186.4" y="34.6" font-size="1.7" text-anchor="middle">PS 2</text>
    </g>
  </g>
</svg>
