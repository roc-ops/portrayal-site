<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="63.0mm" height="14.5mm" viewBox="0 0 63.0 14.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="ex-um-2xfp" data-path="ex-um-2xfp" data-class="line-card" data-behaviour="fills" data-ref="juniper/ex-um-2xfp@1:1.0.0" data-model="EX-UM-2XFP" data-ports-note="two 10 Gbps XFP ports; interfaces xe-0/1/0 and xe-0/1/1 (EX3200 guide, PDF page 127)" data-xfp-10g="2" data-states="ok fail absent" transform="translate(0,0)">
    <title>ex-um-2xfp</title>
    <rect id="ex-um-2xfp--face" x="0" y="0" width="63" height="14.5" rx="0.6" fill="#b9bcc2" stroke="#7f8389" stroke-width="0.4" />
    <g id="ex-um-2xfp--end-holes" fill="#2a2c2e" stroke="#7a7e83" stroke-width="0.3">
      <circle cx="3.6" cy="7.25" r="1.3" />
      <circle cx="61.0" cy="12.4" r="0.9" />
    </g>
    <g id="ex-um-2xfp--port-0" data-path="ex-um-2xfp/port-0" data-class="port" data-ref="std/xfp@1:1.0.0" data-depth="61.7" data-wall="#aab0b7" data-media="xfp" data-speed="10g" transform="translate(7.2,2.2)" data-group="xfp-10g" data-group-role="traffic">
      <title>ex-um-2xfp--port-0</title>
      <rect id="ex-um-2xfp--port-0--opening" x="0" y="0" width="19.5" height="9.7" rx="0.5" fill="#17191c" data-path="ex-um-2xfp/port-0/opening" data-class="cutout" />
      <rect id="ex-um-2xfp--port-0--collar" x="0.5" y="0.5" width="18.5" height="8.7" rx="0.4" fill="#0d0f11" data-z-out="1.0" data-z-color="#7d848c" />
      <rect id="ex-um-2xfp--port-0--module-slot" x="1.4" y="1.5" width="16.7" height="2.2" rx="0.3" fill="#2b2f33" />
      <rect id="ex-um-2xfp--port-0--latch-window" x="1.4" y="5.4" width="16.7" height="2.6" rx="0.3" fill="#000000" />
      <g data-cp="mate" data-cp-at="9.75 4.85" data-cp-dir="front" />
    </g>
    <g id="ex-um-2xfp--port-1" data-path="ex-um-2xfp/port-1" data-class="port" data-ref="std/xfp@1:1.0.0" data-depth="61.7" data-wall="#aab0b7" data-media="xfp" data-speed="10g" transform="translate(35.1,2.2)" data-group="xfp-10g" data-group-role="traffic">
      <title>ex-um-2xfp--port-1</title>
      <rect id="ex-um-2xfp--port-1--opening" x="0" y="0" width="19.5" height="9.7" rx="0.5" fill="#17191c" data-path="ex-um-2xfp/port-1/opening" data-class="cutout" />
      <rect id="ex-um-2xfp--port-1--collar" x="0.5" y="0.5" width="18.5" height="8.7" rx="0.4" fill="#0d0f11" data-z-out="1.0" data-z-color="#7d848c" />
      <rect id="ex-um-2xfp--port-1--module-slot" x="1.4" y="1.5" width="16.7" height="2.2" rx="0.3" fill="#2b2f33" />
      <rect id="ex-um-2xfp--port-1--latch-window" x="1.4" y="5.4" width="16.7" height="2.6" rx="0.3" fill="#000000" />
      <g data-cp="mate" data-cp-at="9.75 4.85" data-cp-dir="front" />
    </g>
    <g id="ex-um-2xfp--led-0-status" data-path="ex-um-2xfp/led-0-status" data-class="led" data-ref="common/led-dot@1:1.1.0" data-function="status" transform="translate(28.8,1.3)" data-group="port-leds" data-group-role="indicator" data-description="Two lamps for each port - status above, link activity below, at the right of the cage. Numbered in printed order, left to right">
      <title>ex-um-2xfp--led-0-status</title>
      <circle id="ex-um-2xfp--led-0-status--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="ex-um-2xfp--led-0-status--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="ex-um-2xfp/led-0-status/lamp" data-class="led" data-states="off on" data-z-dome="0.3" />
    </g>
    <g id="ex-um-2xfp--led-0-link" data-path="ex-um-2xfp/led-0-link" data-class="led" data-ref="common/led-dot@1:1.1.0" data-function="link activity" transform="translate(28.8,6.2)" data-group="port-leds" data-group-role="indicator" data-description="Two lamps for each port - status above, link activity below, at the right of the cage. Numbered in printed order, left to right">
      <title>ex-um-2xfp--led-0-link</title>
      <circle id="ex-um-2xfp--led-0-link--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="ex-um-2xfp--led-0-link--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="ex-um-2xfp/led-0-link/lamp" data-class="led" data-states="off on" data-z-dome="0.3" />
    </g>
    <g id="ex-um-2xfp--led-1-status" data-path="ex-um-2xfp/led-1-status" data-class="led" data-ref="common/led-dot@1:1.1.0" data-function="status" transform="translate(58.9,1.3)" data-group="port-leds" data-group-role="indicator" data-description="Two lamps for each port - status above, link activity below, at the right of the cage. Numbered in printed order, left to right">
      <title>ex-um-2xfp--led-1-status</title>
      <circle id="ex-um-2xfp--led-1-status--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="ex-um-2xfp--led-1-status--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="ex-um-2xfp/led-1-status/lamp" data-class="led" data-states="off on" data-z-dome="0.3" />
    </g>
    <g id="ex-um-2xfp--led-1-link" data-path="ex-um-2xfp/led-1-link" data-class="led" data-ref="common/led-dot@1:1.1.0" data-function="link activity" transform="translate(58.9,6.2)" data-group="port-leds" data-group-role="indicator" data-description="Two lamps for each port - status above, link activity below, at the right of the cage. Numbered in printed order, left to right">
      <title>ex-um-2xfp--led-1-link</title>
      <circle id="ex-um-2xfp--led-1-link--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
      <circle id="ex-um-2xfp--led-1-link--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="ex-um-2xfp/led-1-link/lamp" data-class="led" data-states="off on" data-z-dome="0.3" />
    </g>
  </g>
</svg>
