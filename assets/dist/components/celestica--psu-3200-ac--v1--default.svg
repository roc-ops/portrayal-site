<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40.0mm" viewBox="0 0 73.5 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='celestica/psu-3200-ac@'] .state-fail { --led-color: #f59e0b; }
    g[data-ref^='celestica/psu-3200-ac@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="psu-3200-ac" data-path="psu-3200-ac" data-class="psu" data-behaviour="fills" data-ref="celestica/psu-3200-ac@1:1.0.0" data-input="ac" data-input-range="180-240 VAC auto-ranging, 47-63 Hz" data-power-output-w="3200" data-states="ok fail absent" transform="translate(0,0)">
    <title>psu-3200-ac</title>
    <rect id="psu-3200-ac--body" x="0.2" y="0.2" width="73.1" height="39.6" rx="1.0" fill="#b9bec4" stroke="#7d848c" stroke-width="0.4" />
    <g id="psu-3200-ac--fan-guard">
      <circle cx="21.2" cy="19.1" r="16.2" fill="#23272b" stroke="#8a9099" stroke-width="0.5" />
      <circle cx="21.2" cy="19.1" r="11.5" fill="none" stroke="#9aa0a8" stroke-width="0.6" />
      <circle cx="21.2" cy="19.1" r="6.5" fill="#6e747c" stroke="#9aa0a8" stroke-width="0.4" />
      <line x1="27.2" y1="21.6" x2="36.0" y2="25.2" stroke="#9aa0a8" stroke-width="0.7" />
      <line x1="23.7" y1="25.1" x2="27.3" y2="33.9" stroke="#9aa0a8" stroke-width="0.7" />
      <line x1="18.7" y1="25.1" x2="15.1" y2="33.9" stroke="#9aa0a8" stroke-width="0.7" />
      <line x1="15.2" y1="21.6" x2="6.4" y2="25.2" stroke="#9aa0a8" stroke-width="0.7" />
      <line x1="15.2" y1="16.6" x2="6.4" y2="13.0" stroke="#9aa0a8" stroke-width="0.7" />
      <line x1="18.7" y1="13.1" x2="15.1" y2="4.3" stroke="#9aa0a8" stroke-width="0.7" />
      <line x1="23.7" y1="13.1" x2="27.3" y2="4.3" stroke="#9aa0a8" stroke-width="0.7" />
      <line x1="27.2" y1="16.6" x2="36.0" y2="13.0" stroke="#9aa0a8" stroke-width="0.7" />
    </g>
    <circle cx="5.2" cy="3.6" r="1.6" fill="#c9ced3" stroke="#6e747c" stroke-width="0.25" />
    <circle cx="37.2" cy="3.6" r="1.6" fill="#c9ced3" stroke="#6e747c" stroke-width="0.25" />
    <circle cx="37.2" cy="35.7" r="1.6" fill="#c9ced3" stroke="#6e747c" stroke-width="0.25" />
    <circle cx="3.5" cy="35.9" r="1.9" fill="#1b1e21" />
    <rect id="psu-3200-ac--status-led" x="2.2" y="34.6" width="2.6" height="2.6" rx="1.3" fill="var(--led-color, #2c6b35)" data-path="psu-3200-ac/status-led" data-class="led" data-states="off ok fail" />
    <g id="psu-3200-ac--handle" data-path="psu-3200-ac/handle" data-class="handle" data-z-uhandle="18">
      <rect x="1.0" y="17.2" width="29.0" height="4.8" rx="1.2" fill="#d32f2f" data-fill-from="handle-finish" stroke="#811d1d" data-stroke-derive="handle-finish" stroke-width="0.3" />
      <rect x="17.8" y="15.6" width="7.4" height="8.0" rx="3.2" fill="#1b1e21" />
    </g>
    <rect id="psu-3200-ac--latch" x="67.8" y="11.0" width="4.8" height="18.0" rx="1.0" fill="#d32f2f" data-fill-from="handle-finish" stroke="#811d1d" data-stroke-derive="handle-finish" stroke-width="0.3" data-path="psu-3200-ac/latch" data-class="latch" data-z-out="2.0" />
    <g id="psu-3200-ac--inlet" data-path="psu-3200-ac/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.3.1" data-depth="15.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(38.5,7.8) rotate(270 16.2 12.2)">
      <title>psu-3200-ac--inlet</title>
      <rect id="psu-3200-ac--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="psu-3200-ac/inlet/opening" data-class="cutout" />
      <rect id="psu-3200-ac--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="psu-3200-ac--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="14.2" data-z-color="#c0c5cb" />
      <rect id="psu-3200-ac--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="14.2" data-z-color="#c0c5cb" />
      <rect id="psu-3200-ac--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="14.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="54.7 20" data-cp-dir="front" />
  </g>
</svg>
