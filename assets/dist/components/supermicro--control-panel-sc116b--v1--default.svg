<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="22.0mm" height="20.0mm" viewBox="0 0 22.0 20.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='supermicro/control-panel-sc116b@'] .state-activity { --led-color: #f59e0b; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-activity { animation: portrayal-blink 0.25s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-bmc-reset { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-bmc-reset { animation: portrayal-blink 0.5s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-checking { --led-color: #22c55e; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-checking { animation: portrayal-blink 0.25s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-fan-fail { --led-color: #ef4444; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-fan-fail { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-identify { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-on { --led-color: #22c55e; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-overheat { --led-color: #ef4444; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-power-fail { --led-color: #ef4444; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-power-fail { animation: portrayal-blink 4s linear infinite; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-uid-local { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-uid-remote { --led-color: #3b82f6; }
    g[data-ref^='supermicro/control-panel-sc116b@'] .state-uid-remote { animation: portrayal-blink 1s linear infinite; }</style>
  <g id="control-panel-sc116b" data-path="control-panel-sc116b" data-class="control-panel" data-ref="supermicro/control-panel-sc116b@1:1.0.0" transform="translate(0,0)">
    <title>control-panel-sc116b</title>
    <rect id="control-panel-sc116b--plate" x="0.15" y="0.15" width="21.7" height="19.7" rx="0.5" fill="#202326" stroke="#0e0f10" stroke-width="0.3" />
    <circle id="control-panel-sc116b--lamp-info" cx="4.4" cy="3.1" r="0.9" fill="var(--led-color, #2b2e31)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc116b/lamp-info" data-class="led" data-states="off overheat fan-fail power-fail uid-local uid-remote bmc-reset" data-description="Information LED. Solid red - overheat; red 1 Hz - fan failure; red 0.25 Hz - power failure; solid blue - UID activated locally; blue 1 Hz - UID activated from the BMC; blue 2 Hz - BMC resetting. Also: red solid with the power LED blinking green - fault; blue and red at 10 Hz - recovery mode; blue 4 Hz - BMC setting factory defaults; blue 10 Hz with the power LED blinking green - BMC or BIOS firmware updating." />
    <circle id="control-panel-sc116b--lamp-nic2" cx="7.8" cy="3.1" r="0.9" fill="var(--led-color, #2b2e31)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc116b/lamp-nic2" data-class="led" data-states="off activity" data-description="NIC2 LED. Flashing - network activity on LAN2. Colour and rate are not stated; drawn green at 4 Hz." />
    <circle id="control-panel-sc116b--lamp-nic1" cx="11.1" cy="3.1" r="0.9" fill="var(--led-color, #2b2e31)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc116b/lamp-nic1" data-class="led" data-states="off activity" data-description="NIC1 LED. Flashing - network activity on LAN1. Colour and rate are not stated; drawn green at 4 Hz." />
    <circle id="control-panel-sc116b--lamp-hdd" cx="14.5" cy="3.1" r="0.9" fill="var(--led-color, #2b2e31)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc116b/lamp-hdd" data-class="led" data-states="off activity" data-description="HDD LED. Flashing - activity on the storage drives. Colour and rate are not stated; drawn amber at 4 Hz." />
    <circle id="control-panel-sc116b--lamp-power" cx="18.1" cy="3.1" r="0.9" fill="var(--led-color, #2b2e31)" stroke="#0c0d0e" stroke-width="0.2" data-path="control-panel-sc116b/lamp-power" data-class="led" data-states="off on checking" data-description="Power LED. Steady on - power on; blinking at 4 Hz - checking BIOS/BMC integrity. Also 4 Hz with the information LED blue - BIOS firmware updating; two blinks and a pause - BMC firmware updating; 1 Hz with the information LED red - fault detected. The colour is not stated in the table; drawn green." />
    <g id="control-panel-sc116b--btn-uid" data-path="control-panel-sc116b/btn-uid" data-class="button" data-description="UID button. Turns the blue UID indicators on at the front and the rear; also resets the BMC (manual section 7.8).">
      <circle cx="5.7" cy="13.4" r="2.6" fill="#d5d8db" stroke="#7d848b" stroke-width="0.3" />
      <circle cx="5.7" cy="13.4" r="1.5" fill="#2b2e31" stroke="#7d848b" stroke-width="0.3" />
      <circle id="control-panel-sc116b--lamp-uid" cx="5.7" cy="13.4" r="0.7" fill="var(--led-color, #c9ced3)" data-path="control-panel-sc116b/lamp-uid" data-class="led" data-states="off identify" data-description="the UID lamp in the button. Blue when the unit identifier is activated." />
    </g>
    <circle id="control-panel-sc116b--btn-power" cx="17.0" cy="13.4" r="2.7" fill="#8f3a3f" stroke="#5c2327" stroke-width="0.3" data-path="control-panel-sc116b/btn-power" data-class="button" data-description="Power button. Applies or removes primary power, standby power stays; hold four seconds to force a shutdown." data-z-out="1.0" data-z-color="#8f3a3f" />
    <g id="control-panel-sc116b--silkscreen" fill="none" stroke="#c9ced3" stroke-width="0.22" font-family="sans-serif">
      <text x="4.4" y="7.4" font-size="2.2" font-style="italic" font-weight="bold" text-anchor="middle" fill="#c9ced3" stroke="none">i</text>
      <path d="M6.6 7.3 H9.0 L7.8 5.3 Z M7.5 5.6 H8.1" />
      <text x="7.8" y="9.3" font-size="1.3" text-anchor="middle" fill="#c9ced3" stroke="none">2</text>
      <path d="M9.9 7.3 H12.3 L11.1 5.3 Z M10.8 5.6 H11.4" />
      <text x="11.1" y="9.3" font-size="1.3" text-anchor="middle" fill="#c9ced3" stroke="none">1</text>
      <path d="M13.6 5.5 H15.4 V7.3 H13.6 Z M13.6 5.5 A0.9 0.35 0 0 1 15.4 5.5" />
      <path d="M18.1 5.3 A0.75 0.75 0 0 1 18.5 6.7 V7.3 H17.7 V6.7 A0.75 0.75 0 0 1 18.1 5.3 Z" />
      <text x="3.0" y="18.9" font-size="1.5" text-anchor="middle" fill="#c9ced3" stroke="none">UID</text>
      <path d="M17.9 17.6 A0.85 0.85 0 1 0 19.1 17.6 M18.5 17.0 V18.0" />
      <path d="M9.2 18.0 H13.4 M12.6 17.5 L13.4 18.0 L12.6 18.5 M10.3 18.0 L11.2 17.1 H11.9 M10.9 18.0 L11.8 18.9 H12.4" />
    </g>
  </g>
</svg>
