    </g>
    <rect id="ex8216-fan--handle" x="3.0" y="128.0" width="7.0" height="147.0" rx="3.5" fill="#8a8f95" stroke="#4a4f55" stroke-width="0.4" data-path="ex8216-fan/handle" data-class="latch" />
    <path d="M 14.5 14.0 L 25.4 33.0 L 3.6 33.0 Z" fill="none" stroke="#2b2e33" stroke-width="0.4" />
    <circle cx="30.0" cy="383.0" r="2.0" fill="#9ba0a6" stroke="#4a4f55" stroke-width="0.3" />
    <rect id="ex8216-fan--latch" x="8.0" y="380.5" width="14.0" height="5.0" rx="2.5" fill="#8a8f95" stroke="#4a4f55" stroke-width="0.3" />
    <g id="ex8216-fan--silkscreen" font-family="sans-serif" fill="#2b2e33" text-anchor="middle">
      <text x="23.0" y="7.0" font-size="2.6">EX8216 FAN</text>
