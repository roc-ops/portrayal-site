    </g>
    <rect id="sr-12-pem-blank--logo-zone" x="190.0" y="20.0" width="45.0" height="11.6" fill="none" data-path="sr-12-pem-blank/logo-zone" data-class="label" />
    <g data-cp="mate" data-cp-at="212.85 25.8" data-cp-dir="rear" />
  </g>
</svg>
