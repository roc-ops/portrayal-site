    <rect id="a9k-4x100ge-se--cpak-0" x="18.1" y="27.45" width="13.92" height="37.01" rx="0.5" fill="#2b2f33" stroke="#4a4f55" stroke-width="0.3" data-path="a9k-4x100ge-se/cpak-0" data-class="cutout" data-description="CPAK port 0. A drawn opening, not a composed aperture - see provenance.aperture." />
    <rect id="a9k-4x100ge-se--cpak-1" x="18.1" y="69.7" width="13.92" height="37.01" rx="0.5" fill="#2b2f33" stroke="#4a4f55" stroke-width="0.3" data-path="a9k-4x100ge-se/cpak-1" data-class="cutout" data-description="CPAK port 1. A drawn opening, not a composed aperture - see provenance.aperture." />
    <rect id="a9k-4x100ge-se--cpak-2" x="18.1" y="114.63" width="13.92" height="37.01" rx="0.5" fill="#2b2f33" stroke="#4a4f55" stroke-width="0.3" data-path="a9k-4x100ge-se/cpak-2" data-class="cutout" data-description="CPAK port 2. A drawn opening, not a composed aperture - see provenance.aperture." />
    <rect id="a9k-4x100ge-se--cpak-3" x="18.1" y="158.23" width="13.92" height="37.01" rx="0.5" fill="#2b2f33" stroke="#4a4f55" stroke-width="0.3" data-path="a9k-4x100ge-se/cpak-3" data-class="cutout" data-description="CPAK port 3. A drawn opening, not a composed aperture - see provenance.aperture." />
    <rect x="16.3" y="2.12" width="12.71" height="17.07" rx="1.0" fill="#bfbfbf" stroke="#9aa0a6" stroke-width="0.25" />
    <rect x="16.3" y="376.25" width="12.71" height="17.07" rx="1.0" fill="#bfbfbf" stroke="#9aa0a6" stroke-width="0.25" />
    <g>
      <circle cx="23.06" cy="8.04" r="3.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="23.06" cy="8.04" r="1.35" fill="#6d7379" />
    </g>
    <g>
      <circle cx="23.06" cy="386.95" r="3.0" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3" />
      <circle cx="23.06" cy="386.95" r="1.35" fill="#6d7379" />
    </g>
    <circle id="a9k-4x100ge-se--status" cx="23.92" cy="370.39" r="1.68" fill="#8d949c" stroke="#5f6469" stroke-width="0.2" data-path="a9k-4x100ge-se/status" data-class="led" data-states="green amber red off" data-description="the card's Status LED. Table 32, 'Port Status and Line Card Status LEDs', of the Ethernet Line Card Installation Guide, section 'Card Status LED (one per card)'. Green: line card has booted properly and is ready to pass or is passing traffic. Steady amber: boot process underway. Blinking amber: software configuration error that prevents the card passing traffic - it may still be passing traffic with some degradation. Red: hardware error, not passing traffic. Off: powered off. Steady and blinking amber share one colour and are not two states; the distinction is recorded because it is the difference between a card booting and a card misconfigured." data-z-dome="0.3" />
