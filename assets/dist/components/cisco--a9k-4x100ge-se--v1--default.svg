      <text x="33.58" y="22.65" transform="rotate(90 33.58 22.65)" font-family="sans-serif" font-size="2.14" fill="#231f20">CLASS 1 LASER</text>
      <text x="34.21" y="41.04" transform="rotate(90 34.21 41.04)" font-family="sans-serif" font-size="2.14" fill="#231f20">0</text>
      <text x="34.21" y="83.4" transform="rotate(90 34.21 83.4)" font-family="sans-serif" font-size="2.14" fill="#231f20">1</text>
      <text x="34.21" y="128.17" transform="rotate(90 34.21 128.17)" font-family="sans-serif" font-size="2.14" fill="#231f20">2</text>
      <text x="34.21" y="171.87" transform="rotate(90 34.21 171.87)" font-family="sans-serif" font-size="2.14" fill="#231f20">3</text>
      <text x="28.26" y="372.78" transform="rotate(90 28.26 372.78)" font-family="sans-serif" font-size="1.86" fill="#231f20">STATUS</text>
    </g>
