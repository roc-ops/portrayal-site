<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="55.2mm" height="39.0mm" viewBox="0 0 55.2 39.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='celestica/psu-1500-ac@'] .state-fail { --led-color: #ef4444; }
    g[data-ref^='celestica/psu-1500-ac@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="psu-1500-ac" data-path="psu-1500-ac" data-class="psu" data-behaviour="fills" data-ref="celestica/psu-1500-ac@1:1.0.0" data-input="ac" data-power-output-w="1500" data-states="absent" transform="translate(0,0)">
    <title>psu-1500-ac</title>
    <defs>
      <pattern id="psu-1500-ac--psu1500-mesh" width="3.6" height="3.6" patternUnits="userSpaceOnUse">
        <rect x="0.45" y="0.45" width="2.7" height="2.7" fill="#2a2e33" />
      </pattern>
    </defs>
    <rect id="psu-1500-ac--body" x="0" y="0" width="55.2" height="39" rx="0.6" fill="#b9bec4" stroke="#7a8087" stroke-width="0.3" />
    <rect id="psu-1500-ac--grille" x="1.0" y="1.0" width="27.4" height="37.0" fill="url(#psu-1500-ac--psu1500-mesh)" data-z-vent="20" />
    <rect id="psu-1500-ac--lamp-plate" x="1.0" y="21.6" width="15.6" height="16.4" fill="#b9bec4" stroke="#8a9098" stroke-width="0.2" />
    <circle id="psu-1500-ac--lamp-fault-ring" cx="6.5" cy="25.4" r="2.8" fill="#9aa0a7" stroke="#6c727a" stroke-width="0.25" />
    <circle id="psu-1500-ac--lamp-ok-ring" cx="6.5" cy="32.1" r="2.8" fill="#9aa0a7" stroke="#6c727a" stroke-width="0.25" />
    <g id="psu-1500-ac--silkscreen">
      <path d="M 11.2 23.4 L 11.2 26.0" stroke="#3a3f45" stroke-width="0.5" fill="none" />
      <circle cx="11.2" cy="27.0" r="0.3" fill="#3a3f45" />
      <path d="M 10.6 31.9 L 11.4 32.9 L 13.0 30.8" stroke="#3a3f45" stroke-width="0.45" fill="none" />
    </g>
    <path id="psu-1500-ac--inlet-frame" fill-rule="evenodd" fill="#9ea4ab" stroke="#6c727a" stroke-width="0.3" d="M 29.9 1.8 H 50.4 A 0.8 0.8 0 0 1 51.2 2.6 V 30.8 A 0.8 0.8 0 0 1 50.4 31.6 H 29.9 A 1.0 1.0 0 0 1 28.9 30.6 V 2.8 A 1.0 1.0 0 0 1 29.9 1.8 Z        M 30.75 2.7 V 30.7 H 50.75 V 2.7 Z" data-z-out="2.0" />
    <rect id="psu-1500-ac--handle" x="19.5" y="1.0" width="6.3" height="37.5" rx="3.1" fill="#1c1f23" stroke="#0b0d0f" stroke-width="0.25" data-fill-from="handle-finish" data-path="psu-1500-ac/handle" data-class="handle" data-z-uhandle="22" />
    <rect id="psu-1500-ac--latch" x="51.3" y="24.6" width="3.9" height="14.1" rx="1.2" fill="#f39c1e" stroke="#9a5f10" stroke-width="0.25" data-fill-from="latch-finish" data-path="psu-1500-ac/latch" data-class="latch" data-z-out="3.0" />
    <circle id="psu-1500-ac--lamp-fault" cx="6.5" cy="25.4" r="1.5" fill="var(--led-color, #d4d8dc)" data-path="psu-1500-ac/lamp-fault" data-class="led" data-states="off fail" data-description="the lamp beside the printed '!' - guide Rear Panel Status LEDs, PSU module row, Red (PSU error(s) detected), Off (PSU off)" data-z-dome="0.4" />
    <circle id="psu-1500-ac--lamp-ok" cx="6.5" cy="32.1" r="1.5" fill="var(--led-color, #d4d8dc)" data-path="psu-1500-ac/lamp-ok" data-class="led" data-states="off ok" data-description="the lamp beside the printed check mark - guide Rear Panel Status LEDs, PSU module row, Green (all PSUs operating normally), Off (PSU off)" data-z-dome="0.4" />
    <g id="psu-1500-ac--inlet" data-path="psu-1500-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(26.75,6.7) rotate(90 14.0 10.0)">
      <title>psu-1500-ac--inlet</title>
      <rect id="psu-1500-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-1500-ac/inlet/opening" data-class="cutout" />
      <path id="psu-1500-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-1500-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-1500-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <rect id="psu-1500-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="15.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="40.75 16.7" data-cp-dir="rear" />
  </g>
</svg>
