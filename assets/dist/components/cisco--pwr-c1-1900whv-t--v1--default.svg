      <path id="pwr-c1-1900whv-t--inlet--inlet-face" d="M 5.72 1.30 L 21.08 1.30 A 1.00 1.00 0 0 1 22.01 1.92 L 25.37 10.02 A 1.00 1.00 0 0 1 25.45 10.40 L 25.45 17.60 A 1.00 1.00 0 0 1 24.45 18.60 L 2.35 18.60 A 1.00 1.00 0 0 1 1.35 17.60 L 1.35 10.40 A 1.00 1.00 0 0 1 1.43 10.02 L 4.79 1.92 A 1.00 1.00 0 0 1 5.72 1.30 Z" fill="#06070a" />
      <path id="pwr-c1-1900whv-t--inlet--contact-web" fill="#858a90" d="M 8.80 5.25 L 18.00 5.25 L 18.00 8.45 L 22.10 8.45 L 23.10 9.45 L 23.10 10.35 L 18.00 10.35 L 18.00 13.75 L 23.10 13.75 L 23.10 15.55 L 16.00 15.55 L 16.00 10.05 L 16.80 9.25 L 17.20 9.25 L 17.20 7.05 L 9.60 7.05 L 9.60 9.25 L 10.00 9.25 L 10.80 10.05 L 10.80 15.55 L 3.70 15.55 L 3.70 13.75 L 8.80 13.75 L 8.80 10.35 L 3.70 10.35 L 3.70 9.45 L 4.70 8.45 L 8.80 8.45 Z" data-z-top="14.0" data-z-color="#858a90" />
      <g data-cp="mate" data-cp-at="13.4 9.95" data-cp-dir="front" />
    </g>
  </g>
</svg>
