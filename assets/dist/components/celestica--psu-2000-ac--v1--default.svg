<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="56.2mm" height="40.0mm" viewBox="0 0 56.2 40.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='celestica/psu-2000-ac@'] .state-fault { --led-color: #f59e0b; }
    g[data-ref^='celestica/psu-2000-ac@'] .state-ok { --led-color: #22c55e; }</style>
  <g id="psu-2000-ac" data-path="psu-2000-ac" data-class="psu" data-behaviour="fills" data-ref="celestica/psu-2000-ac@1:1.0.0" data-wall="#3a3e43" data-input="ac" data-input-range="100-240 VAC 47-63 Hz, or 180-300 VDC (auto input)" data-power-output-w="2000" data-states="absent" transform="translate(0,0)">
    <title>psu-2000-ac</title>
    <defs>
      <pattern id="psu-2000-ac--psu-2000-perf" x="0.8" y="0.8" width="2.7" height="2.7" patternUnits="userSpaceOnUse">
        <rect x="0.3" y="0.3" width="2.1" height="2.1" fill="#8c9298" />
      </pattern>
    </defs>
    <rect id="psu-2000-ac--body" x="0" y="0" width="56.2" height="40" rx="0.5" fill="#c9cdd1" stroke="#8d939a" stroke-width="0.4" />
    <rect x="0.6" y="0.6" width="55.0" height="38.8" rx="0.35" fill="none" stroke="#dde0e3" stroke-width="0.2" />
    <g id="psu-2000-ac--grille" data-path="psu-2000-ac/grille" data-class="rotor" data-z-vent="30">
      <rect id="psu-2000-ac--grille-plate" x="0.80" y="0.80" width="14.40" height="38.40" fill="#e8eaec" />
      <rect id="psu-2000-ac--grille-holes" x="0.80" y="0.80" width="14.40" height="38.40" fill="url(#psu-2000-ac--psu-2000-perf)" />
      <rect x="0.80" y="0.80" width="14.40" height="38.40" fill="none" stroke="#9aa0a6" stroke-width="0.25" />
    </g>
    <circle id="psu-2000-ac--led-1-bezel" cx="7.46" cy="6.70" r="2.70" fill="#3b3e43" stroke="#26282c" stroke-width="0.25" />
    <circle id="psu-2000-ac--led-2-bezel" cx="7.46" cy="12.95" r="2.70" fill="#3b3e43" stroke="#26282c" stroke-width="0.25" />
    <g id="psu-2000-ac--inlet-housing" data-path="psu-2000-ac/inlet-housing" data-class="bezel">
      <rect x="24.50" y="0.20" width="27.10" height="35.50" rx="1.00" fill="#34373c" stroke="#1e2023" stroke-width="0.30" />
    </g>
    <g id="psu-2000-ac--handle" data-path="psu-2000-ac/handle" data-class="handle" data-z-uhandle="27">
      <rect x="15.80" y="0.80" width="6.30" height="38.20" rx="3.15" fill="#2b2d31" stroke="#141517" stroke-width="0.25" />
      <rect x="17.30" y="6.00" width="3.30" height="27.80" rx="1.65" fill="none" stroke="#45484d" stroke-width="0.25" />
    </g>
    <g id="psu-2000-ac--latch" data-path="psu-2000-ac/latch" data-class="latch" data-z-out="1.2">
      <rect x="51.80" y="24.60" width="3.50" height="14.70" rx="1.40" fill="#232528" stroke="#151718" stroke-width="0.25" data-fill-from="latch-finish" data-stroke-derive="latch-finish" />
    </g>
    <g id="psu-2000-ac--led-1" data-path="psu-2000-ac/led-1" data-class="led" data-states="off ok fault" data-z-dome="0.3">
      <circle cx="7.46" cy="6.70" r="1.35" fill="var(--led-color, #3a3f44)" />
    </g>
    <g id="psu-2000-ac--led-2" data-path="psu-2000-ac/led-2" data-class="led" data-states="off ok fault" data-z-dome="0.3">
      <circle cx="7.46" cy="12.95" r="1.35" fill="var(--led-color, #3a3f44)" />
    </g>
    <g id="psu-2000-ac--inlet" data-path="psu-2000-ac/inlet" data-class="inlet" data-ref="std/c20-inlet@1:1.4.0" data-depth="19.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(22.0,5.45) rotate(90 16.2 12.2)">
      <title>psu-2000-ac--inlet</title>
      <rect id="psu-2000-ac--inlet--opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c" data-path="psu-2000-ac/inlet/opening" data-class="cutout" />
      <rect id="psu-2000-ac--inlet--inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11" />
      <rect id="psu-2000-ac--inlet--pin-earth" x="13.1" y="7.1" width="6.2" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-2000-ac--inlet--pin-line" x="7.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <rect id="psu-2000-ac--inlet--pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087" data-z-top="17.0" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="16.2 12.2" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="38.2 17.65" data-cp-dir="front" />
  </g>
</svg>
