    <path id="nema-l6-20p-plug--blade-y" d="M 31.5 37.13 A 11.88 11.88 0 0 1 23.85 38 L 24.18 36.51 A 10.35 10.35 0 0 0 30.84 35.75 Z" fill="#b08d57" stroke="#6d5734" stroke-width="0.12" data-z-out="18.6" data-z-color="#b08d57" data-z-shape="1" />
    <path id="nema-l6-20p-plug--blade-g" d="M 34.02 17.29 A 11.88 11.88 0 0 1 37.99 23.81 L 36.5 24.14 A 10.35 10.35 0 0 0 33.04 18.46 Z M 29.63 17.89 L 31.43 16.65 L 33.16 16.65 L 34.01 17.29 L 33.06 18.49 L 32.31 17.89 L 30.52 19.16 Z" fill="#b08d57" stroke="#6d5734" stroke-width="0.12" data-z-out="22.5" data-z-color="#b08d57" data-z-shape="1" />
  </g>
</svg>
