    <g id="sr-e-psu-ac--led-status" data-path="sr-e-psu-ac/led-status" data-class="led" data-ref="common/led-indicator@1:1.2.0" transform="translate(45.0,7.7)" data-group="status-leds" data-group-role="indicator" data-description="the one PSU status lamp">
      <title>sr-e-psu-ac--led-status</title>
