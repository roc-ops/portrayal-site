    </g>
    <g id="sr-e-psu-ac--inlet" data-path="sr-e-psu-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.4.0" data-depth="17.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(52.3,10.3) rotate(270 14.0 10.0)">
