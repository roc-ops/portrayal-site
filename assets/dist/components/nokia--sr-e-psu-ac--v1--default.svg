    <g id="sr-e-psu-ac--handle" data-path="sr-e-psu-ac/handle" data-class="handle" data-z-uhandle="15.0" data-z-color="#c8102e">
      <rect x="1.0" y="14.6" width="49.4" height="10.8" rx="5.4" fill="#c8102e" stroke="#7a0a1c" stroke-width="0.35" />
