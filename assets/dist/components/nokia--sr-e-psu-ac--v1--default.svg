      <line x1="15.55" y1="16.85" x2="7.51" y2="13.52" stroke="#6f757c" stroke-width="0.6" />
      <line x1="20.15" y1="12.25" x2="16.82" y2="4.21" stroke="#6f757c" stroke-width="0.6" />
      <line x1="26.65" y1="12.25" x2="29.98" y2="4.21" stroke="#6f757c" stroke-width="0.6" />
      <line x1="31.25" y1="16.85" x2="39.29" y2="13.52" stroke="#6f757c" stroke-width="0.6" />
    </g>
    <rect x="43.6" y="1.0" width="8.5" height="38.8" fill="none" stroke="#5a6066" stroke-width="0.25" />
    <g id="sr-e-psu-ac--led-bezel">
      <circle cx="47.0" cy="9.7" r="2.6" fill="#6f757c" stroke="#3a3f45" stroke-width="0.25" />
    </g>
    <g id="sr-e-psu-ac--cord-retainer" data-path="sr-e-psu-ac/cord-retainer" data-class="mechanical">
