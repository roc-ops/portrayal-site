      <circle cx="23.4" cy="20.1" r="15.2" fill="none" stroke="#6f757c" stroke-width="0.6" />
      <circle cx="23.4" cy="20.1" r="12.0" fill="none" stroke="#6f757c" stroke-width="0.6" />
      <circle cx="23.4" cy="20.1" r="8.5" fill="#8d9298" stroke="#6f757c" stroke-width="0.3" />
      <line x1="31.25" y1="23.35" x2="39.29" y2="26.68" stroke="#6f757c" stroke-width="0.6" />
