<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86.4mm" height="40.4mm" viewBox="0 0 86.4 40.4">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='nokia/sr-e-psu-ac@'] .state-fault { --led-color: #f5a623; }
    g[data-ref^='nokia/sr-e-psu-ac@'] .state-on { --led-color: #39b54a; }
    g[data-ref^='nokia/sr-e-psu-ac@'] .state-standby { --led-color: #39b54a; }
    g[data-ref^='nokia/sr-e-psu-ac@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='nokia/sr-e-psu-ac@'] .state-warning { --led-color: #f5a623; }
    g[data-ref^='nokia/sr-e-psu-ac@'] .state-warning { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='nokia/sr-e-psu-ac@'] .state-wrong-psu { --led-color: #d0021b; }</style>
  <g id="sr-e-psu-ac" data-path="sr-e-psu-ac" data-class="psu" data-behaviour="fills" data-ref="nokia/sr-e-psu-ac@1:1.0.0" data-body-depth="197.6" data-airflow="exhaust" data-inlet="c14" data-input="ac" data-model="PSU - 7750 SR-e AC" data-part-number="3HE09549AA" data-power-output-w="1600" data-weight-kg="1.06" transform="translate(0,0)">
    <title>sr-e-psu-ac</title>
    <rect id="sr-e-psu-ac--face" x="0" y="0" width="86.4" height="40.4" rx="0.4" fill="#8d9298" stroke="#1d2023" stroke-width="0.3" />
    <rect id="sr-e-psu-ac--fan-housing" x="3.6" y="0.6" width="39.50" height="39.20" rx="2.0" fill="#2b2e33" stroke="#1d2023" stroke-width="0.3" />
    <circle cx="6.90" cy="3.90" r="2.2" fill="#8d9298" stroke="#1d2023" stroke-width="0.3" />
    <circle cx="39.80" cy="3.90" r="2.2" fill="#8d9298" stroke="#1d2023" stroke-width="0.3" />
    <circle cx="6.90" cy="36.50" r="2.2" fill="#8d9298" stroke="#1d2023" stroke-width="0.3" />
    <circle cx="39.80" cy="36.50" r="2.2" fill="#8d9298" stroke="#1d2023" stroke-width="0.3" />
    <g id="sr-e-psu-ac--fan" data-path="sr-e-psu-ac/fan" data-class="vent" data-depth="6.0">
