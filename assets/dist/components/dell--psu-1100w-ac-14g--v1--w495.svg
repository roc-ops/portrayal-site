    <path id="psu-1100w-ac-14g--body" fill-rule="evenodd" d="M0.2 1.2 a1 1 0 0 1 1 -1 h83.90 a1 1 0 0 1 1 1 v36.70 a1 1 0 0 1 -1 1 h-83.90 a1 1 0 0 1 -1 -1 Z M10.10 5.50 h20.00 v28.00 h-20.00 Z" fill="#8d949c" stroke="#5f666d" stroke-width="0.4" />
    <path id="psu-1100w-ac-14g--inlet-bezel" fill-rule="evenodd" d="M7.55 4.70 a1.2 1.2 0 0 1 1.2 -1.2 h21.84 a1.2 1.2 0 0 1 1.2 1.2 v29.40 a1.2 1.2 0 0 1 -1.2 1.2 h-21.84 a1.2 1.2 0 0 1 -1.2 -1.2 Z M10.10 5.50 h20.00 v28.00 h-20.00 Z" fill="#1b1f22" stroke="#41474d" stroke-width="0.4" data-path="psu-1100w-ac-14g/inlet-bezel" data-class="inlet" data-description="the recess the C14 sits back inside. The CONNECTOR is std/c14-inlet@1, composed rather than drawn - see `inlet` in provenance." />
    <rect id="psu-1100w-ac-14g--latch-slot-top" x="0.4" y="12.5" width="4.3" height="2.8" rx="0.4" fill="#141719" />
    <rect id="psu-1100w-ac-14g--latch-slot-bottom" x="0.4" y="26.3" width="4.3" height="2.8" rx="0.4" fill="#141719" />
