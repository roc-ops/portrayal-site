    <path id="psu-1100w-ac-14g--lever" d="M7.47 12.99 h3.20 a2.6 2.6 0 0 1 2.6 2.6 v10.47 a2.6 2.6 0 0 1 -2.6 2.6 h-3.20 Z" fill="var(--led-color, #e8a33d)" stroke="#9a6a1e" stroke-width="0.35" data-z-out="19.05" data-z-color="#e8a33d" />
    <rect id="psu-1100w-ac-14g--grip" x="33.04" y="3.65" width="8.24" height="34.64" rx="1.2" fill="var(--led-color, #c9ced3)" stroke="#8b9299" stroke-width="0.35" data-path="psu-1100w-ac-14g/grip" data-class="led" data-states="off ok fault updating mismatch" data-description="The translucent handle, lit from within. ISM table 12 entire: green - a valid source is connected and the supply is operational; blinking amber - a problem with the supply; not illuminated - no power connected; blinking green - firmware is being updated. `mismatch` IS WHY THE SEQUENCE MECHANISM EXISTS, for the fourth time on this chassis: Dell's wording is &quot;the PSU handle blinks green five times at a rate of 4 Hz and turns off&quot;, which gives the phase length exactly - 4 Hz is 0.125 s lit and 0.125 s dark - and then a dark tail that the article does not time. The five blinks and their rate are Dell's; the 2 second tail is this library's reading of &quot;and turns off&quot;. NO RATE IS PUBLISHED for the amber fault or the firmware blink, so 1 Hz is a reading and not a figure - unlike the mismatch, where 4 Hz is stated." data-z-uhandle="25.4" data-z-color="#c9ced3" />
