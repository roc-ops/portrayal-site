<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.2mm" viewBox="0 0 50.5 40.2">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='ufispace/psu-151-ac@'] .state-critical { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-fw-update { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-fw-update { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-input-lost { --led-color: #eab308; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-input-lost { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-ok { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-standby { --led-color: #22c55e; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-standby { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-warning { --led-color: #22c55e; --led-color-alt: #eab308; }
    g[data-ref^='ufispace/psu-151-ac@'] .state-warning { animation: portrayal-alternate 1s linear infinite; }</style>
  <g id="psu-151-ac" data-path="psu-151-ac" data-class="psu" data-behaviour="fills" data-ref="ufispace/psu-151-ac@1:1.1.0" data-input="ac" data-model="PSU-151-AESR" data-power-output-w="150" transform="translate(0,0)">
    <title>psu-151-ac</title>
    <defs>
      <pattern id="psu-151-ac--sq" width="3.0" height="3.0" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="2.0" height="2.0" fill="#0d0f11" />
      </pattern>
    </defs>
    <rect id="psu-151-ac--body" x="0" y="0" width="50.5" height="40.2" rx="0.6" fill="#9aa0a8" stroke="#5a6068" stroke-width="0.4" />
    <rect id="psu-151-ac--vent-field" x="2.0" y="2.2" width="25.0" height="13.0" fill="url(#psu-151-ac--sq)" data-z-vent="30" />
    <rect id="psu-151-ac--vent-col" x="40.5" y="10.0" width="7.5" height="22.0" fill="url(#psu-151-ac--sq)" />
    <circle id="psu-151-ac--led-bezel" cx="45.0" cy="6.7" r="2.6" fill="#22262a" />
    <rect id="psu-151-ac--latch" x="0.4" y="0.6" width="6.4" height="3.6" rx="0.8" fill="#c22f2f" stroke="#8c1f1f" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge" data-path="psu-151-ac/latch" data-class="latch" data-z-out="2.2" />
    <rect id="psu-151-ac--handle" x="29.0" y="2.0" width="4.6" height="36.5" rx="2.2" fill="#17191c" stroke="#0d0f11" stroke-width="0.3" data-path="psu-151-ac/handle" data-class="handle" data-z-uhandle="38" />
    <circle id="psu-151-ac--status-led" cx="45.0" cy="6.7" r="1.6" fill="var(--led-color, #3a3f44)" data-path="psu-151-ac/status-led" data-class="led" data-states="off ok standby fw-update critical input-lost warning" data-description="S6301-56ST HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output ON and OK), Blinking Green 1/sec (standby state, input present, only +5VSB on), Blinking Green 2/sec (power supply firmware updating, boot-loader mode - same colour and behaviour token as standby, the table separates them only by blink rate), Yellow (critical event causing shutdown: failure, over current, short circuit, over voltage, fan failure, over temperature), Blinking Yellow 1/sec (power cord unplugged or input lost with the second supply still fed; or input present with 5VSB and 12V off via system control), Blinking between Green and Yellow (warning events where the supply continues to operate: high temp, high power, high current, slow fan)" data-z-dome="0.4" />
    <g id="psu-151-ac--inlet" data-path="psu-151-ac/inlet" data-class="inlet" data-ref="std/c14-inlet@1:1.3.0" data-depth="13.0" data-wall="#141619" data-cavity="inlet-face" data-input="ac" data-media="ac" transform="translate(0.8,16.8)">
      <title>psu-151-ac--inlet</title>
      <rect id="psu-151-ac--inlet--opening" x="0" y="0" width="28" height="20" rx="3" fill="#17191c" data-path="psu-151-ac/inlet/opening" data-class="cutout" />
      <path id="psu-151-ac--inlet--inlet-face" d="M 1.5 6 l 4.5 -4.5 h 16 l 4.5 4.5 v 12.5 h -25 z" fill="#0d0f11" />
      <rect id="psu-151-ac--inlet--pin-earth" x="12.8" y="5.0" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-151-ac--inlet--pin-line" x="6.6" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <rect id="psu-151-ac--inlet--pin-neutral" x="19.0" y="9.6" width="2.4" height="4.8" rx="0.3" fill="#7a8087" data-z-top="12.2" data-z-color="#c0c5cb" />
      <g data-cp="mate" data-cp-at="14 10" data-cp-dir="front" />
    </g>
    <g data-cp="power" data-cp-at="14.8 26.8" data-cp-dir="front" />
  </g>
</svg>
