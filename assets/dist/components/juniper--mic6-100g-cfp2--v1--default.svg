      </g>
      <g id="mic6-100g-cfp2--t1193-silkscreen">
        <text x="13.50" y="192.00" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="middle" transform="rotate(-90 13.50 192.00)">MIC6-100G-CFP2</text>
      </g>
    </g>
    <g id="mic6-100g-cfp2--port-0-0" data-path="mic6-100g-cfp2/port-0-0" data-class="port" data-ref="std/cfp2@2:2.0.0" data-depth="87.5" data-wall="#aab0b7" data-cavity="cavity" data-media="cfp2" transform="translate(-7.25,26.4) rotate(90 20.75 7.15)">
      <title>mic6-100g-cfp2--port-0-0</title>
      <rect id="mic6-100g-cfp2--port-0-0--opening" x="0" y="0" width="41.5" height="14.3" rx="0.5" fill="#17191c" data-path="mic6-100g-cfp2/port-0-0/opening" data-class="cutout" />
      <rect id="mic6-100g-cfp2--port-0-0--cavity" x="0" y="0.95" width="41.5" height="12.4" rx="0.5" fill="#0a0c0e" />
      <rect id="mic6-100g-cfp2--port-0-0--module-slot" x="2.0" y="5.75" width="37.5" height="2.8" rx="0.4" fill="#000000" />
      <path id="mic6-100g-cfp2--port-0-0--collar" fill-rule="evenodd" fill="#9aa0a8" d="M 0.05 0.05 h 41.4 v 14.2 h -41.4 z M 0.6 0.6 h 40.3 v 13.1 h -40.3 z" data-z-out="1.0" data-z-color="#7d848c" />
      <g data-cp="mate" data-cp-at="20.75 7.15" data-cp-dir="front" />
    </g>
    <g id="mic6-100g-cfp2--port-0-1" data-path="mic6-100g-cfp2/port-0-1" data-class="port" data-ref="std/cfp2@2:2.0.0" data-depth="87.5" data-wall="#aab0b7" data-cavity="cavity" data-media="cfp2" transform="translate(-7.25,69.5) rotate(90 20.75 7.15)">
      <title>mic6-100g-cfp2--port-0-1</title>
      <rect id="mic6-100g-cfp2--port-0-1--opening" x="0" y="0" width="41.5" height="14.3" rx="0.5" fill="#17191c" data-path="mic6-100g-cfp2/port-0-1/opening" data-class="cutout" />
      <rect id="mic6-100g-cfp2--port-0-1--cavity" x="0" y="0.95" width="41.5" height="12.4" rx="0.5" fill="#0a0c0e" />
      <rect id="mic6-100g-cfp2--port-0-1--module-slot" x="2.0" y="5.75" width="37.5" height="2.8" rx="0.4" fill="#000000" />
      <path id="mic6-100g-cfp2--port-0-1--collar" fill-rule="evenodd" fill="#9aa0a8" d="M 0.05 0.05 h 41.4 v 14.2 h -41.4 z M 0.6 0.6 h 40.3 v 13.1 h -40.3 z" data-z-out="1.0" data-z-color="#7d848c" />
      <g data-cp="mate" data-cp-at="20.75 7.15" data-cp-dir="front" />
    </g>
  </g>
