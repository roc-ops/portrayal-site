<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="14.0mm" height="12.0mm" viewBox="0 0 14.0 12.0">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="rj45-hd-plain" data-path="rj45-hd-plain" data-class="port" data-ref="common/rj45-hd-plain@1:1.2.0" data-media="rj45" transform="translate(0,0)">
    <title>rj45-hd-plain</title>
    <rect id="rj45-hd-plain--body" x="0" y="0" width="14" height="12" fill="#1c1f23" />
    <g id="rj45-hd-plain--jack" data-path="rj45-hd-plain/jack" data-class="port" data-ref="std/rj45-ganged@1:1.3.0" data-depth="16.0" data-wall="#b9bec4" data-cavity="cavity" data-media="rj45" transform="translate(0.65,0.5)">
      <title>rj45-hd-plain--jack</title>
      <rect id="rj45-hd-plain--jack--opening" x="0" y="0" width="12.7" height="11" rx="0.3" fill="#17191c" data-path="rj45-hd-plain/jack/opening" data-class="cutout" />
      <path id="rj45-hd-plain--jack--cavity" d="M 0.405 0.775 h 11.89 v 6.85 h -3.945 v 2.6 h -4 v -2.6 h -3.945 z" fill="#0a0c0e" />
      <g id="rj45-hd-plain--jack--pins" fill="#a8873c">
        <rect x="2.519" y="1.325" width="0.55" height="2.0" />
        <rect x="3.535" y="1.325" width="0.55" height="2.0" />
        <rect x="4.551" y="1.325" width="0.55" height="2.0" />
        <rect x="5.567" y="1.325" width="0.55" height="2.0" />
        <rect x="6.583" y="1.325" width="0.55" height="2.0" />
        <rect x="7.599" y="1.325" width="0.55" height="2.0" />
        <rect x="8.615" y="1.325" width="0.55" height="2.0" />
        <rect x="9.631" y="1.325" width="0.55" height="2.0" />
      </g>
    </g>
    <path id="rj45-hd-plain--bezel" fill-rule="evenodd" fill="#c9cdd1" stroke="#9aa0a8" stroke-width="0.18" d="     M 0.15 0.15 h 13.7 v 11.7 h -13.7 z     M 1.055 1.275 h 11.89 v 6.85 h -3.945 v 2.6 h -4 v -2.6 h -3.945 z" data-z-out="0.5" data-z-color="#9aa0a8" />
  </g>
</svg>
