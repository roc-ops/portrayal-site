<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32.8mm" height="12.5mm" viewBox="0 0 32.8 12.5">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <g id="serial-port-blank" data-path="serial-port-blank" data-class="blank" data-behaviour="fills" data-ref="hpe/serial-port-blank@1:1.0.0" transform="translate(0,0)">
    <title>serial-port-blank</title>
    <rect id="serial-port-blank--plate" x="0.15" y="0.75" width="32.5" height="10.9" rx="1.2" fill="#dfe2e5" stroke="#a0a7ae" stroke-width="0.3" />
    <circle cx="3.8" cy="5.5" r="1.2" fill="#2a2e32" />
    <circle cx="28.6" cy="5.5" r="1.2" fill="#2a2e32" />
    <g id="serial-port-blank--vents" data-path="serial-port-blank/vents" data-class="vent">
      <rect x="7.9" y="3.2" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="7.9" y="7.4" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="10.5" y="3.2" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="10.5" y="7.4" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="13.1" y="3.2" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="13.1" y="7.4" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="15.7" y="3.2" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="15.7" y="7.4" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="18.3" y="3.2" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="18.3" y="7.4" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="20.9" y="3.2" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="20.9" y="7.4" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="23.5" y="3.2" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
      <rect x="23.5" y="7.4" width="1.4" height="2.6" rx="0.3" fill="#1d2023" />
    </g>
  </g>
</svg>
