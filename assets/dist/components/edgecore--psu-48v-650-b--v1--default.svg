    <rect id="psu-48v-650-b--vent-field" x="9" y="1.8" width="43.2" height="36.4" fill="url(#psu-48v-650-b--mesh)" />
    <rect id="psu-48v-650-b--plate" x="31.6" y="1.8" width="20.6" height="36.4" fill="#b9bec4" />
