      <circle id="psu-48v-650-b--inlet--ear-hole-bottom" cx="5.18" cy="25.50" r="1.0" fill="#0d0f11" />
      <rect id="psu-48v-650-b--inlet--insulator" x="0.4" y="4.6" width="9.56" height="19.4" rx="0.4" fill="#2366ae" stroke="#17457a" stroke-width="0.3" />
      <rect id="psu-48v-650-b--inlet--lock-hole" x="4.38" y="4.9" width="1.6" height="0.9" fill="#0d1a2c" />
      <rect id="psu-48v-650-b--inlet--window" x="1.4" y="6.0" width="7.56" height="16.6" rx="0.6" fill="#0f2238" stroke="#17457a" stroke-width="0.25" />
