<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="83.06mm" height="40.39mm" viewBox="0 0 83.06 40.39">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    g[data-ref^='juniper/jpsu-2000-c-dc-afo@'] .state-blinking-green { --led-color: #39b54a; }
    g[data-ref^='juniper/jpsu-2000-c-dc-afo@'] .state-blinking-green { animation: portrayal-blink 1s linear infinite; }
    g[data-ref^='juniper/jpsu-2000-c-dc-afo@'] .state-green { --led-color: #39b54a; }</style>
  <g id="jpsu-2000-c-dc-afo" data-path="jpsu-2000-c-dc-afo" data-class="psu" data-behaviour="fills" data-ref="juniper/jpsu-2000-c-dc-afo@1:1.0.0" data-body-depth="225.55" data-airflow="front-to-back" data-hot-swap="yes" data-inlet="other" data-input-connector="D-sub, for the cable CBL-PWR-2K-DSUB4 (6 AWG) - -48 VDC input (V-), return (V+), and a middle ground pin" data-input-current="53 A" data-input-voltage="-48 VDC to -60 VDC rated operating voltage" data-power-output-w="2000" data-role="dc-power-supply" data-weight-kg="0.93" data-states="ok fault absent" transform="translate(0,0)">
    <title>jpsu-2000-c-dc-afo</title>
    <rect id="jpsu-2000-c-dc-afo--face" x="0" y="0" width="83.06" height="40.39" rx="0.8" fill="#c6c7c9" stroke="#8f9093" stroke-width="0.4" />
    <g id="jpsu-2000-c-dc-afo--fan">
      <rect x="2.0" y="2.0" width="41.0" height="36.4" rx="1.2" fill="#b3b4b6" />
      <circle cx="22.5" cy="20.7" r="17.2" fill="#0f1011" />
      <circle cx="22.5" cy="20.7" r="13.6" fill="none" stroke="#a6a7a9" stroke-width="1.2" />
      <circle cx="22.5" cy="20.7" r="9.6" fill="#bdbebf" stroke="#9c9da0" stroke-width="0.5" />
      <path d="M 22.5 3.8 L 22.5 11.0 M 22.5 30.4 L 22.5 37.6 M 5.6 20.7 L 12.8 20.7 M 32.2 20.7 L 39.4 20.7" stroke="#a6a7a9" stroke-width="1.0" fill="none" />
    </g>
    <g id="jpsu-2000-c-dc-afo--screws" fill="#d2d3d5" stroke="#8d8e90" stroke-width="0.3">
      <circle cx="5.4" cy="4.2" r="1.9" />
      <circle cx="37.8" cy="4.2" r="1.9" />
      <circle cx="5.4" cy="37.3" r="1.9" />
      <circle cx="37.8" cy="37.3" r="1.9" />
    </g>
    <g id="jpsu-2000-c-dc-afo--handle" data-path="jpsu-2000-c-dc-afo/handle" data-class="handle" data-z-out="6.0" data-z-color="#ef7e2d">
      <rect x="0.3" y="17.9" width="43.3" height="5.4" rx="0.5" fill="#ef7e2d" stroke="#b85a14" stroke-width="0.3" />
      <polygon points="0.3,15.4 3.4,17.9 3.4,23.3 0.3,25.8" fill="#ef7e2d" stroke="#b85a14" stroke-width="0.3" />
      <polygon points="43.6,15.4 40.5,17.9 40.5,23.3 43.6,25.8" fill="#ef7e2d" stroke="#b85a14" stroke-width="0.3" />
    </g>
    <g id="jpsu-2000-c-dc-afo--dc-input" data-path="jpsu-2000-c-dc-afo/dc-input" data-class="inlet">
      <rect x="60.0" y="3.0" width="11.5" height="34.4" rx="1.2" fill="#17181a" stroke="#b9babc" stroke-width="0.5" />
      <circle cx="65.7" cy="10.0" r="1.9" fill="#d9b13a" />
      <circle cx="65.7" cy="20.2" r="2.5" fill="#d9b13a" />
      <circle cx="65.7" cy="20.2" r="1.5" fill="#2a2415" />
      <circle cx="65.7" cy="30.4" r="1.9" fill="#d9b13a" />
    </g>
    <g id="jpsu-2000-c-dc-afo--silkscreen" font-family="Arial" font-size="1.3" fill="#3a3b3d">
      <text x="52.4" y="8.4" text-anchor="middle">DC</text>
      <text x="52.4" y="10.0" text-anchor="middle">OK</text>
    </g>
    <g id="jpsu-2000-c-dc-afo--led" data-path="jpsu-2000-c-dc-afo/led" data-class="led" data-states="green blinking-green off">
      <circle cx="52.4" cy="14.0" r="2.6" fill="#1b1c1e" />
      <circle cx="52.4" cy="14.0" r="1.2" fill="var(--led-color, #8c9094)" stroke="#5c5e60" stroke-width="0.25" />
    </g>
    <g id="jpsu-2000-c-dc-afo--latch" data-path="jpsu-2000-c-dc-afo/latch" data-class="latch" data-z-out="1.4" data-z-color="#9a9b9d">
      <rect x="71.8" y="9.3" width="6.1" height="17.9" rx="2.0" fill="#2d2e30" stroke="#17181a" stroke-width="0.3" />
      <rect x="77.9" y="10.8" width="4.6" height="14.9" fill="#dcdcde" />
    </g>
    <circle cx="52.4" cy="22.6" r="2.0" fill="#a9aaac" stroke="#808183" stroke-width="0.3" />
    <g data-cp="power" data-cp-at="65.7 20.2" data-cp-dir="rear" />
  </g>
</svg>
