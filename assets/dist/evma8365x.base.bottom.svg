  <g id="input" data-path="input" data-class="inlet" data-ref="eaton/g4-cord-cs8365c@1:1.0.0" data-cord-gauge="6 AWG / 4C" data-cord-length-ft="10" data-plug="cs8365c" data-rel-pos="1" transform="translate(7.55,22.05)" data-group="power-input" data-group-role="service">
    <title>input</title>
    <circle id="input--grommet" cx="18.45" cy="18.45" r="18.45" fill="#1b1c1e" stroke="#4a4d51" stroke-width="0.25" data-path="input/grommet" data-class="inlet" />
    <circle id="input--cord" cx="18.45" cy="18.45" r="15.05" fill="#0d0e0f" stroke="#3c3f43" stroke-width="0.3" />
  </g>
</svg>
