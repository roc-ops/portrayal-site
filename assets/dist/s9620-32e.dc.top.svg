<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="580mm" viewBox="0 0 436 580" data-device="s9620-32e" data-view="top" data-switching-capacity="25.6 Tbps" data-packet-buffer="32 GB deep buffer" data-power-typical-w="696" data-power-envelope="bare" data-input-ac="200 to 240V, 16A" data-input-dc="-48 to -60V, 80A" data-operating-temp="0 to 45 C" data-operating-humidity="5% to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5% to 93% RH non-condensing" data-asic="Broadcom Qumran3D BCM88870" data-cpu="Intel Ice Lake-D 8-core @ 1.9GHz with VROC support" data-memory="64 GB DDR4" data-storage="2 x 256 GB SSD" data-bmc="ASPEED AST2620" data-optics-qsfp-dd="800GE QSFP-DD OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8; 400GE QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4; 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/SR4/LR4 (datasheet Compatible Transceiver Types). The datasheet publishes no per-port optical power budget for this platform" data-optics-sfp-plus="the two management uplinks are listed only as '2 x 10G SFP+ management ports'; the datasheet's Compatible Transceiver Types block covers the QSFP-DD field alone, so no module list is published for them and none is inferred" data-optics-sfp28="the datasheet lists the four ports as 1/10/25G SFP28 and its Compatible Transceiver Types block covers only the QSFP-DD field, so no module list is carried for them" data-timing="Stratum 3E OCXO; SyncE; IEEE 1588v2 (Default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2), T-BC/OC, T-TC. The datasheet footnotes the whole row 'NOS integration is necessary to activate the specific feature' and marks SMPTE ST 2059-2 'Additional license is required'" data-forwarding="segment routing, SRv6, MPLS, advanced QoS, MACsec point-to-point, a large built-in TCAM and hardware-based forwarding with streaming telemetry (datasheet KEY BENEFITS and KEY FEATURES)" data-console="1x RJ45 RS-232 and 1x micro-USB, both labelled IOIOI" data-oob="1x 100/1000M RJ45 management port" data-oob-sfp="2x 10G SFP+ management ports, numbered 0 and 1 under an Ethernet-icon bracket, separate from the 32-35 SFP28 traffic ports" data-usb="1x USB 3.0 Type-A" data-timing-inputs="1x 1PPS input/output SMB and 1x 10MHz input/output SMB; the datasheet's Compatible Timing Cable Types names '50 ohms SMB coaxial cable with 10-32UNF-2A connector' for both" data-safety="UL 62368-1, IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; VCCI CISPR 32 Class A" data-environment="WEEE" data-eol="none-announced" data-airflow="front-to-back" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
