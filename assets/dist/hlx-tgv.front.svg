  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="HLX-TGV" x="0" y="0" width="172" height="40" rx="1.2" fill="#eceef0" stroke="#c2c7cc" stroke-width="0.5" />
  <defs>
    <pattern id="portrayal-ribs" width="7.2" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4.8" height="6" fill="#e8eaed" />
      <rect x="5.4" y="0" width="1.8" height="6" fill="#6a7075" />
    </pattern>
  </defs>
  <g id="--decor" data-class="decor">
    <rect id="ribs-field-0" data-kind="ribs-field" x="0" y="1" width="5" height="38" rx="0.6" fill="url(#portrayal-ribs)" />
    <rect id="ribs-field-1" data-kind="ribs-field" x="167" y="1" width="5" height="38" rx="0.6" fill="url(#portrayal-ribs)" />
  </g>
</svg>
