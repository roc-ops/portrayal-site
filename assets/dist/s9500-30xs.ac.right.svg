<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="302mm" height="43.5mm" viewBox="0 0 302 43.5" data-device="s9500-30xs" data-view="right" data-switching-capacity="300 Gbps" data-packet-buffer="3 GB deep buffer" data-power-typical-w="153.8" data-power-envelope="bare" data-input-ac="100 to 240 V, 6 A" data-input-dc="-36 to -75 V, 16 A" data-psu-redundancy="1+1 hot-swappable" data-fan-redundancy="4+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="-40 to 65 C (temperature hardened)" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Qumran-AX BCM88470" data-cpu="Intel Broadwell-DE 4-core @ 1.5 GHz" data-memory="8 GB DDR4 (premium SKU 16 GB, up to 32 GB)" data-storage="32 GB SSD (premium SKU 128 GB)" data-bmc="ASPEED AST2400" data-timing="Stratum 3E OCXO with optional holdover; SyncE (ITU-T); IEEE 1588v2 default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (additional licence), T-GM, T-BC/OC, T-TC. NOS integration is required to activate these, which the datasheet states with an asterisk against the whole timing block" data-gnss="internal receiver for master clock implementations" data-optics-qsfp28="100G SR4/LR4/ER4" data-optics-sfp28="25G SR/LR/ER" data-optics-sfp-plus="10G SR/LR/ER/ZR; 1G SX/LX/EX/ZX" data-macsec="MACsec on the backhaul uplinks, up to 120 km long-reach applications" data-compliance-programme="OCP Accepted and TIP DCSG compliant" data-timing-interfaces="GNSS SMA in; 1PPS SMA in/out; 10MHz SMA in/out; ToD RJ45 in; BITS RJ48 in" data-console="RJ45 RS-232 plus a micro-USB serial console" data-oob="1x RJ45 100/1000M" data-safety="UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI; VCCI CISPR 32, Class A; Anatel" data-nebs="NEBS GR-1089, GR-3108; NEBS GR-63; TP76200, GR-3108 Class 2 OSP (NEBS Level 3)" data-environment="RoHS; WEEE" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
