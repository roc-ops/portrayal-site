  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="DINRAIL4U" x="0" y="0" width="360" height="165.1" rx="1.2" fill="none" />
  <g id="--decor" data-class="decor" />
  <g id="side-left" data-path="side-left" data-class="bracket" data-behaviour="mounts" data-ref="fs/dinrail4u-side@1:1.0.0" data-rel-pos="2" transform="translate(0.0,0.0)" data-group="frame" data-group-role="furniture" data-description="the rail panel and the two side brackets">
    <title>side-left</title>
    <path transform="translate(360.0,0) scale(-1,1)" id="side-left--plate" fill="#1b1d20" fill-rule="evenodd" d="M0,0 H360.0 V165.1 H0 Z M65.70,12.50 h224.10 v5.00 h-224.10 Z M65.70,146.80 h224.10 v5.00 h-224.10 Z M38.00,70.60 h280.00 v22.10 h-280.00 Z" data-path="side-left/plate" data-class="bezel" data-z-out="1.5" data-z-color="#1b1d20" />
  </g>
</svg>
