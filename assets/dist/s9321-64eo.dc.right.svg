<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="762mm" height="87.7mm" viewBox="0 0 762 87.7" data-device="s9321-64eo" data-view="right" data-switching-capacity="51.2 Tbps" data-packet-buffer="165.2 MB" data-power-typical-w="925" data-power-max-w="2545" data-power-max-dc-w="2279" data-power-envelope="bare" data-power-max-scope="HIG Connecting Power - measured at 40 C ambient, optics fully populated and 100% traffic load; 2545 W is the AC figure and 2279 W the DC one" data-input-ac="200 to 240 V, 16 A per feed" data-input-dc="-40 to -72 V, 80 A per feed" data-psu-redundancy="1+1 active-active hot-swappable" data-fan-redundancy="3+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="0 to 40 C" data-operating-humidity="5 to 95% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 95% RH non-condensing" data-asic="Broadcom Tomahawk 5 BCM78900" data-cpu="Intel Xeon-D 4-core @ 1.9 GHz" data-memory="32 GB DDR4" data-storage="1x 128 GB M.2 SSD" data-bmc="Aspeed AST2620" data-optics-osfp="800GE OSFP OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8 and 400GE OSFP OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4 (datasheet compatible transceiver list); the HIG port table gives ports 0~63 as 400G/800G up to 2 km" data-optics-sfp28="1G/10G/25G on the management pair, up to 40 km per the HIG Port Overview table; the datasheet calls the same pair '2 x 10/25G SFP28 ports' and no module list is published for it" data-optic-power-classes="sixteen ports take a 30 W optic and the other forty-eight take 16 W (HIG Figure 9). The 30 W ports are 0, 6, 8, 14, 16, 22, 24, 30, 33, 39, 41, 47, 49, 55, 57 and 63 - the first and fourth cage rows of columns 1, 4, 5, 8, 9, 12, 13 and 16 counting from the left" data-timing="1PPS and 10MHz SMB input/output (premium), 50 ohm, cable not to exceed 3 m; Stratum 3E OCXO holdover and ITU-T Synchronous Ethernet (SyncE). The datasheet's compatible cable row names 'SMB coaxial cable with 10-32UNF-2A connector for 1PPS and 10MHz', and the HIG offers a converter where the far end is BNC" data-console="RJ45 RS-232 and micro-USB, both labelled IOIO, 115200 8N1 no flow control; the micro-USB needs a Silicon Labs CP210x driver (HIG Initial System Setup)" data-oob="1x RJ45 100/1000M plus the 2x SFP28 management pair" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; VCCI CISPR 32, Class A" data-environment="WEEE" data-nebs="NOT A CERTIFICATION - the HIG carries 'Cautions and regulatory compliance statements for NEBS': suitable for installation as part of the Common Bonding Network (CBN); an external Surge Protection Device must be used with AC powered equipment, installed at the AC power service entrance; can be installed in Network Telecommunications Facilities where the National Electric Code applies; the DC input terminals are DC-I (isolated DC return) and the RTN terminal should be isolated from the chassis or rack; the intra-building OOB Ethernet port is suitable for connection to intra-building or unexposed wiring only (Type 2, 4 or 4a per GR-1089). No NEBS level is claimed anywhere in the held documents" data-installation="restricted-access server or computer room only; suitable for Information Technology Rooms per Article 645 of the National Electrical Code and NFPA 75" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
