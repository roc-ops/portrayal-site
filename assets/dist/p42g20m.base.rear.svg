    <title>button-2</title>
    <circle id="button-2--flange" cx="9.2" cy="9.2" r="9.2" fill="#b7bcc1" stroke="#7b8187" stroke-width="0.25" data-path="button-2/flange" data-class="mount" />
    <circle cx="9.2" cy="9.2" r="4.6" fill="#cfd3d7" stroke="#7b8187" stroke-width="0.25" />
    <g data-cp="mate" data-cp-at="9.2 9.2" data-cp-dir="front" />
  </g>
