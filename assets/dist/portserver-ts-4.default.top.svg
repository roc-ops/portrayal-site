    <text x="15.7" y="129.6" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#f2f2f2" data-path="silk:0" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">ETHERNET</text>
    <text x="27.2" y="123.6" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#37855d" data-path="silk:1" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">LINK</text>
    <text x="27.2" y="129.6" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#d9d965" data-path="silk:2" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">ACT</text>
    <text x="48.7" y="129.6" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#f2f2f2" data-path="silk:3" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">RESET</text>
    <text x="61.8" y="123.6" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#37855d" data-path="silk:4" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">PWR</text>
    <text x="61.8" y="129.6" font-family="sans-serif" font-size="2.2" text-anchor="middle" fill="#d9d965" data-path="silk:5" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">READY</text>
    <text x="76.5" y="126.6" font-family="sans-serif" font-size="1.6" text-anchor="middle" fill="#f2f2f2" data-path="silk:6" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">9-30V DC</text>
    <text x="76.5" y="129.6" font-family="sans-serif" font-size="1.6" text-anchor="middle" fill="#f2f2f2" data-path="silk:7" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">525mA MAX</text>
    <text x="40" y="116" font-family="sans-serif" font-size="5" text-anchor="middle" fill="#8a8a8a" data-path="silk:8" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">PORTSERVER TS</text>
  </g>
