<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480mm" height="43.8mm" viewBox="0 0 480 43.8" data-device="s9110-32x" data-view="left" data-switching-capacity="3.2 Tbps" data-packet-buffer="32 MB" data-port-modes-qsfp28="40/100G" data-power-typical-w="184" data-power-max-w="530.7" data-power-envelope="bare" data-psus="2x 750 W 1+1 redundant, hot-swappable" data-input-ac="100-240 VAC, 10 A max per feed (HIG checklist adds 190-310 VDC, 5 A HVDC)" data-input-dc="-36 to -75 VDC, 28 A max per feed" data-fans="2+1 redundant, hot-swappable fan modules" data-airflow="back-to-front" data-operating-temp-front-to-back="0 to 45 C" data-operating-temp-back-to-front="0 to 40 C" data-operating-humidity="5 to 95 percent RH, non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 95 percent RH, non-condensing" data-asic="Broadcom Trident3-X7 BCM56870" data-cpu="Intel Denverton 4-core @ 1.6 GHz" data-memory="8 GB DDR4 (up to 32 GB)" data-storage="64 GB SSD" data-bmc="ASPEED AST2620" data-optics-qsfp28="100G QSFP28 SR4, LR4, ER4, ZR4" data-mgmt-ports="1x RJ45 100/1000M OOB, 1x 10G SFP+ management, 1x RJ45 serial console, 1x USB 3.0 Type-A" data-console="RJ45 RS-232, 115200 8N1" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; VCCI CISPR 32 Class A" data-environment="WEEE; MTCTE" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
