  <g id="power-led" data-path="power-led" data-class="led" data-ref="common/led-dot@1:1.1.0" data-rel-pos="1" transform="translate(357.5,14.9)" data-group="power-led" data-group-role="indicator" data-description="the green POWER ON lamp" data-for="chassis">
    <title>power-led</title>
    <circle id="power-led--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
    <circle id="power-led--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="power-led/lamp" data-class="led" data-states="off on" data-z-dome="0.3" />
  </g>
  <g id="breaker" data-path="breaker" data-class="breaker" data-ref="vertiv/rpdu-thermal-breaker@1:1.0.0" data-rel-pos="1" transform="translate(399.05,14.65)" data-group="breakers" data-group-role="service" data-description="the 15 A thermal breaker for all ten outlets">
    <title>breaker</title>
    <circle id="breaker--ring" cx="6.95" cy="6.95" r="6.75" fill="#3d3c3a" stroke="#5a5955" stroke-width="0.3" />
    <circle id="breaker--button" cx="6.95" cy="6.95" r="4.6" fill="#5c5b57" stroke="#2a2927" stroke-width="0.3" data-path="breaker/button" data-class="breaker" data-states="on off" />
    <g id="breaker--silkscreen" font-family="sans-serif" fill="#e6e5e0">
      <text id="breaker--rating" x="6.95" y="8.15" font-size="3.4" font-weight="bold" text-anchor="middle">15</text>
    </g>
  </g>
</svg>
