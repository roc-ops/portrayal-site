  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="7750 SR-3e" x="0" y="0" width="538.5" height="577.9" rx="1.2" fill="#3a3d42" stroke="#22262a" stroke-width="0.5" />
  <defs>
    <pattern id="portrayal-holes" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#3c4046" />
    </pattern>
  </defs>
  <g id="--decor" data-class="decor">
    <rect id="rear-bracket-0" data-kind="rear-bracket" x="520.5" y="0" width="18" height="577.9" rx="0.6" fill="#474b51" />
    <rect id="holes-field-0" data-kind="holes-field" x="428.5" y="8" width="70" height="30" rx="0.6" fill="url(#portrayal-holes)" />
  </g>
</svg>
