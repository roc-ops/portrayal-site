<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9720-56ed" data-view="top" data-switching-capacity="14.4 Tbps" data-packet-buffer="16 GB deep buffer" data-cluster-capacity="up to 921.6 Tbps as a DDC cluster of S9720-56ED line-card elements with an S9705-48D or S9725-64E fabric" data-power-typical-w="887" data-power-max-w="2339" data-power-envelope="fully-configured" data-power-max-conditions="HIG section 9 - 2339 W is the DC build with Open ZR+ optics; the vendor's other three published maxima for the same chassis are DC 2088 W and AC 2035 W under MSA optics and AC 2280 W with Open ZR+. All four are measured at 45 C ambient, fully populated optics and 100% traffic load" data-input-ac="200 to 240V, 16A. At 110V each supply delivers only 1500 W and hot-swap redundancy is lost, so 220V is required for 1+1 operation" data-input-dc="-40 to -72V, 80A" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5% to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5% to 93% RH non-condensing" data-asic="Broadcom Jericho 3 BCM88860" data-cpu="Intel Ice Lake-D 8-core @ 2.1GHz" data-memory="64 GB DDR4 (up to 128 GB)" data-storage="2 x 256 GB M.2 SSD" data-bmc="ASPEED AST2620" data-optics-qsfp-dd="800GE QSFP-DD OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8; 400GE QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4; 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/SR4/LR4 (datasheet Compatible Transceiver Types). HIG Port Overview gives the reach as up to 500 km on the service ports" data-fabric-cabling="the 20 fabric ports take 800GE QSFP-DD AEC, DAC, ACC and AOC cable assemblies (datasheet Compatible Fabric Cable Types); HIG Port Overview caps their link length at 300 m, which is why they are cabled rather than optical" data-optics-sfp28="the HIG's Port Overview lists ports 36-37 as SFP28 1/10/25G with up to 40 km reach; the datasheet's Compatible Transceiver Types block covers only the QSFP-DD field, so no module list is published for them and none is inferred" data-optics-sfp-plus="the datasheet lists the management pair only as '2 x 10G SFP+ management ports' and publishes no module list for them" data-timing="Stratum 3E OCXO; SyncE; IEEE 1588v2 (Default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2), T-BC/OC, T-TC; timing synchronization over fabric. The datasheet footnotes the whole row 'NOS integration is necessary to activate the specific feature' and marks SMPTE ST 2059-2 'Additional license is required'" data-forwarding="full Segment Routing over IPv6 (SRv6), flexibly configured fabric pipes for upstream connectivity, automatic fault detection and recovery, nonstop routing for control and data plane (datasheet KEY BENEFITS and KEY FEATURES)" data-redundancy="1+1 hot-swappable active-active PSUs and 3+1 hot-swappable fan modules (datasheet Redundancy row and HIG Installation Environment Requirements)" data-console="1x RJ45 RS-232 and 1x micro-USB, both labelled IOIOI; 115200 8N1, no flow control. The micro-USB path needs a Silicon Labs CP210x driver" data-oob="1x 100/1000M RJ45 management port" data-oob-sfp="2x 10G SFP+ management uplinks, numbered 0 and 1 under an Ethernet icon, separate from the 36-37 SFP28 traffic ports beside them" data-usb="1x USB 3.0 Type-A maintenance port" data-timing-inputs="1x 1PPS input/output SMB and 1x 10MHz input/output SMB; the datasheet's Compatible Timing Cable Types names 'SMB coaxial cable with 10-32UNF-2A connector', and the HIG caps either cable at 3 m and the 1PPS coax at 50 ohms" data-safety="UL 62368-1, IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A" data-environment="WEEE" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
