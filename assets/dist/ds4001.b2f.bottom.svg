<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="438.5mm" height="657.5mm" viewBox="0 0 438.5 657.5" data-device="ds4001" data-view="bottom" data-switching-capacity="12.8 Tbps" data-packet-buffer="70 MB" data-latency="low-latency cut-through mode supported" data-input-ac="100-240 V nominal (90-264 V max), 47-63 Hz" data-psu-redundancy="1+1 hot-swappable, 1500 W each" data-fan-redundancy="6+1 hot-swappable" data-port-power-f2b="28 x 15 W + 4 x 20 W (ports 1, 2, 31, 32)" data-port-power-b2f="24 x 5 W + 8 x 12 W (ports 25-32)" data-operating-temp="0 to 45 C at 900 m" data-operating-humidity="5 to 90% non-condensing" data-operating-temp-guide="5 to 40 C, either airflow" data-operating-humidity-guide="40 to 60% RH" data-storage-humidity="5 to 95% RH" data-cpu="Intel Xeon D, 4-core D-1627 on a COMe module (both SKUs); up to 8 cores per datasheet" data-memory="16 GB DDR4 ECC (both SKUs; up to 32 GB per datasheet)" data-storage="64 GB M.2 SSD (both SKUs)" data-bmc="BMC with 1 GB DDR4, dual 32 MB flash, NC-SI shared port, SOL, IPMI 2.0" data-breakout="168 x 50GbE, 128 x 100GbE or 64 x 200GbE using breakout cables" data-optics-qsfp-dd="10GBASE-CR/SR/LR/ER, 25GBASE-CR/SR/LR/ER, 40GBASE-CR4/SR4/LR4/ER4, 100GBASE-CR4/SR4/LR4/ER4/DR1/PSM4/CWDM4, 400GBASE-CR4/SR4/FR4/DR4/LR8 (shared guide Port Descriptions); DAC up to 3 m (datasheet)" data-optics-sfp-plus="10GbE (shared guide Port Descriptions)" data-tunnelling="IPinIP, IPinGRE, VXLAN" data-console="RJ45 RS-232, 115200 8N1, flow control XON/XOFF (labelled IOIOI)" data-oob="RJ45 10/100/1000, CPU/BMC shared" data-usb="USB 2.0 type A, data only (does not supply power)" data-emc="CN (GB/T9254-2008 Class A), EU (EN550032, EN55035, EN300386), FCC, VCCI, CCC" data-safety="UL/CSA/IEC/EN60950-1/62368-1, UL, CB, CCC (GB4943.1-2011)" data-environment="RoHS" data-eol="none-announced" data-airflow="back-to-front" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"device":"Celestica DS4001","device-version":"0.1.0","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{"common/compliance-sticker@1":"1.0.0"},"source-sha256":"eb3a38c5cf34281a411a47c3189a7bad1245fc4f0b02da33527df39ebbdd2883","view":"bottom"}</metadata>
