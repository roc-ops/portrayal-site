<svg xmlns="http://www.w3.org/2000/svg" width="438.4mm" height="536.0mm" viewBox="0 0 438.4 536.0" data-device="cor580" data-view="bottom" data-switching-capacity="9.6 Tbps" data-fabric-role="cell-based fabric element (FIF), single-stage and three-stage" data-fabric-scale="up to 24 COR550 (Jericho2) leaf interconnections, 96 Tbps total" data-serdes-modes="PAM4/50GE and NRZ/25GE, for J+/J2C interconnect" data-port-modes-qsfpdd="1x 400G, or breakout 2x 200G / 4x 100G / 1x 100G" data-features-fabric="self-routing with dynamic load balancing, fabric multicast and multicast load balancing, three pipes with flexible allocation (e.g. TDM/OTN, unicast data, multicast data)" data-power-max-w="800" data-power-envelope="unstated" data-input-ac="90-240 VAC, 50-60 Hz; 100-120 VAC 12 A max, 200-240 VAC 7.5 A max, 190-310 VDC 8-5 A" data-input-dc="-36 to -72 VDC (PSU rated 48 VDC, 1300 W; -40 V to -75 V, 40 A max)" data-airflow="front-to-back" data-temperature-operating="5 C to 40 C (41 F to 104 F); -5 C to 55 C short-term, 55 C at sea level" data-temperature-storage="-40 C to 70 C (-40 F to 158 F)" data-humidity-operating="5% to 95% non-condensing" data-asic="Broadcom BCM88795 Ramon (StrataDNX)" data-cpu="Intel Xeon Broadwell-DE D-1548, 8-core 2.0 GHz" data-memory="32 GB DDR4 (2x 16 GB SO-DIMM)" data-boot-flash="2x 16 MB SPI, redundant" data-storage="128 GB M.2 SSD" data-bmc="ASPEED AST2600 (AS9926-24DB only)" data-software="ONIE installer, open-source and commercial NOS options" data-optics-qsfp-dd="400G QSFP-DD, breakout to 2x 200G / 4x 100G / 100G" data-mgmt-ports="1x RJ-45 console, 1x micro-USB console, 1x RJ-45 10/100/1000BASE-T management, 2x SFP+ 10G out-of-band, 1x USB-A 2.0 storage" data-emc="EN 55032:2015+AC:2016 Class A, EN 61000-3-2:2014 Class A, EN 61000-3-3:2013, FCC Class A, VCCI Class A, CCC GB 9254-2008 Class A, BSMI CNS13438-1" data-immunity="EN 55024:2010+A1:2015, EN 55035:2017, IEC 61000-4-2/3/4/5/6/8/11" data-safety="UL (CSA 22.2 No 62368-1 &amp; UL62368-1), CB (IEC/EN60950-1 &amp; IEC/EN 62368-1), CCC GB4943.1-2011, BSMI CNS14336-1, CE Mark" data-nebs="GR-63-CORE, GR-1089-CORE, NEBS Level 3.0" data-rohs="RoHS-2.0 compliant; WEEE Directive 2002/96/EC" data-eol="none-announced" data-power="ac hvdc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
