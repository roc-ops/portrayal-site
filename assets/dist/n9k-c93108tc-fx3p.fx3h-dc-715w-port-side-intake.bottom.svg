<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436.8mm" height="457.3mm" viewBox="0 0 436.8 457.3" data-device="n9k-c93108tc-fx3p" data-view="bottom" data-weight-note="16 lb (7.26 kg) chassis without fans or PSUs, 23 lb (10.43 kg) with them. Fan module 0.26 lb (0.12 kg). Supplies 3 lb (1.36 kg), 3.6 lb (1.63 kg) for the 1900 W." data-power-typical-w="500" data-power-max-w="600" data-power-envelope="unstated" data-heat-dissipation-btu-hr="2047" data-power-input-ac="100 to 240 V, 50 to 60 Hz (1100 W); 115 to 120 V or 200 to 240 V (1900 W)" data-power-input-dc="-48 to -60 V nominal (715 W)" data-power-supply-options="1100W AC, 1900W AC or 715W DC (two)" data-operating-temp="0 to 55 C (32 to 131 F)" data-storage-temp="-40 to 70 C (-40 to 158 F)" data-humidity="5 to 85% non-operating" data-altitude="6,562 ft (2000 m) operating" data-ports-t="guide: &quot;48 100M/1/2.5/5/10GBASE-T ports (ports 1-48)&quot;" data-optics-qsfp28="guide: &quot;6 40/100-Gigabit ports QSFP28 (ports 49-54)&quot;" data-poe="guide: &quot;PoE is supported on ports 1-48.&quot;" data-management-ports="guide: &quot;Two management ports (one 10/100/1000BASE-T port and one SFP port)&quot;" data-usb="1 USB port" data-regulatory="Products should comply with CEMarkings according to directives 2004/108/EC and 2006/95/EC." data-safety="CAN/CSA-C22.2 No. 60950-1 Second Edition, CAN/CSA-C22.2 No. 62368-1-19 Third Edition, ANSI/UL 60950-1 Second edition, IEC 62368-1, EN 62368-1, AS/NZS 62368-1, GB4943, UL 62368-1" data-emissions="47CFR Part 15 (CFR 47) Class A, AS/NZS CISPR22 Class A, CISPR22 Class A, EN55022 Class A, ICES003 Class A, VCCI Class A, EN61000-3-2, EN61000-3-3, KN22 Class A, CNS13438 Class A" data-immunity="EN55024, CISPR24, EN300386, KN 61000-4 series" data-rohs="The product is RoH-6 compliant with exceptions for leaded-ball grid-array (BGA) balls and lead press-fit connectors." data-eol="none-announced" data-airflow="front-to-back" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
