<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9321-64e" data-view="top" data-switching-capacity="51.2 Tbps" data-packet-buffer="165.2 MB" data-power-typical-w="913" data-power-max-w="2589" data-power-max-dc-w="2496" data-power-envelope="fully-configured" data-input-ac="200 to 240V, 16A max x2" data-input-dc="-40 to -72V, 80A max x2" data-operating-temp="0 to 40 C" data-operating-humidity="5% to 95% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5% to 95% RH non-condensing" data-asic="Broadcom Tomahawk5 BCM78900" data-cpu="Intel Ice Lake-D 4-core @ 1.9GHz" data-memory="32 GB DDR4" data-storage="128 GB M.2 SSD" data-bmc="ASPEED AST2620" data-optics-qsfp-dd="800GE QSFP-DD OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8; 400GE QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4; 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/SR4/LR4 (datasheet Compatible Transceivers). Per-port optical power is budgeted 16 W on ports 0-31 and 23 W on ports 32-63 (HIG Figure 9 note)" data-optics-sfp28="1G/10G/25G SFP28 up to 40 km (HIG Port Overview table, ports 64-65; the datasheet's Compatible Transceivers list covers only the QSFP-DD field)" data-timing="Stratum 3E OCXO; SyncE; IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2); T-TC, T-BC/OC, T-GM" data-console="RJ45 RS-232 and micro-USB, both labelled IOIO, 115200 8N1 (micro-USB needs the Silicon Labs CP210x driver)" data-oob="1x 100M/1G RJ45 OOB management port" data-usb="1 x USB 3.0 Type-A maintenance port" data-timing-inputs="1x 1PPS in/out SMB and 1x 10MHz in/out SMB, both Premium-build only" data-safety="UL 62368-1, IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; VCCI CISPR 32 Class A" data-environment="WEEE" data-nebs="NEBS statements only (Common Bonding Network suitability, GR-1089 intra-building port restriction, external SPD required on AC) - the HIG prints the compliance statements without claiming a NEBS level, and none is claimed here" data-eol="none-announced" data-airflow="front-to-back" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
