<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="439.9mm" height="174.8mm" viewBox="0 0 439.9 174.8" data-device="qfx5220-128c" data-view="rear" data-weight-note="98 lb (44.45 kg) with power supplies and fans installed, 76 lb (34.47 kg) chassis only (guide Table 32)" data-throughput="12.8 Tbps (guide, QFX5220-128C Switch Description)" data-qsfp28-speeds="100 GbE and 40 GbE; 4 x 25 GbE on ports 0, 4, 8 to 124 (guide, Port Configurations)" data-power-typical-w="942" data-power-max-w="1506" data-power-envelope="as-tested" data-power-measurement-note="Maximum at 40 C ambient with SR optics at 100 percent load with IMIX traffic. Typical at 25 C with DACs at 50 percent load with IMIX traffic (guide Table 19)" data-power-dc-typical-w="955" data-power-dc-max-w="1530" data-power-input-ac="100 to 240 VAC, 50 to 60 Hz; 19.36 A at 100 to 127 VAC, 10.95 A at 200 to 240 VAC (guide Table 19)" data-power-input-dc="rated -48 to -60 VDC, operating -40 to -72 VDC, 40 A maximum (guide Table 26)" data-redundancy-note="four supplies, 2+2. The switch can run on two supplies if one is in slot 0 or 1 and the other in slot 2 or 3" data-fans="six fan modules of two fans each, (5x2+1)+1; the switch runs 30 seconds without thermal shutdown while one is replaced" data-airflow-note="AFO only, front-to-back (port-to-FRU); the 128C is not sold with back-to-front airflow" data-operating-temp="0 to 40 C (32 to 104 F) (guide Table 31)" data-storage-temp="-40 to 70 C (-40 to 158 F) in the shipping container" data-humidity="5 to 90 percent noncondensing, operating" data-altitude="no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C (guide Table 31)" data-cpu="Intel Xeon D-1518 (guide)" data-storage="two internal 50 GB SSDs" data-software="Junos OS Evolved, first release 19.2R1 (the guide names it the QFX5200-128C at that point)" data-optics-qsfp28="100 GbE QSFP28 and DAC, QSFP28 to SFP28 breakout DAC, 100 GbE AOC, 40 GbE QSFP+ and DAC (guide, Network Ports)" data-optics-sfp-plus="ports 128 and 129 take SFP+ modules at 10 GbE (the guide also says 1 GbE; see gaps)" data-ptp="clock input and output connectors for 10 MHz and 1 PPS, and an RJ-45 time-of-day port" data-oob="one RJ-45 management port (1000BASE-T)" data-console="one RJ-45 console port" data-usb="one USB 2.0 port" data-timing-outputs="PPS and 10 MHz clock connectors, in and out, and an RJ-45 time-of-day port" data-safety="CAN/CSA-C22.2 No. 60950-1; UL 62368-1; IEC 62368-1:2014; IEC 60950-1:2005/A2:2013 (CB scheme); EN 60825-1 (guide, Agency Approvals for the QFX Series)" data-emc="FCC 47 CFR Part 15 Class A. EN 55022 Class A. VCCI Class A. BSMI CNS 13438 Class A. AS/NZS CISPR 22 Class A. EN 55024. CISPR 24. EN 300 386. EN 61000-3-2. EN 61000-3-3. (guide, Agency Approvals for the QFX Series)" data-nebs="designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue 3 (guide Table 31)" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
