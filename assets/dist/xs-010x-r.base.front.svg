  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="XS-010X-R" data-sku="XS-010X-R" data-part-number="" x="0" y="0" width="135" height="30" rx="1.2" fill="#f7f7f7" stroke="#c9ccd0" stroke-width="0.5" />
  <g id="--decor" data-class="decor" />
</svg>
