<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440.0mm" height="649.2mm" viewBox="0 0 440.0 649.2" data-device="dcs520" data-view="top" data-weight-note="21.5 kg (47.4 lb) with 2 PSUs and 4 fans installed - both documents agree" data-jumbo-frames="up to 9416 bytes" data-packet-buffer="integrated 113.66 MB" data-mac-addresses="8K exact match, 128K without exact match (subject to NOS)" data-power-draw-max-w="2100" data-power-draw-min-w="287.75" data-power-budget-per-port-w="24 on ports 1-4, 29-36 and 61-64; 13 on all other ports" data-operating-temp="0 to 40 C (32 to 104 F) at sea level; 0 to 35 C (32 to 95 F) at 1828 m" data-storage-temp="-40 to 70 C (-40 to 158 F)" data-humidity="Operating: 5% to 95% non-condensing" data-altitude="Operating: 0-1828 m (0-6000 ft)" data-cpu="Intel Xeon D-1548, 8-core" data-switch-silicon="Broadcom Tomahawk 4" data-software="ONIE preloaded; compatible with Open Network Linux and Enterprise SONiC by Edgecore" data-optics-qsfp-dd="datasheet: each QSFP56-DD port takes 1 x 400G QSFP56-DD, 1 x 100G QSFP28 or 1 x 40G QSFP+, or breaks out to 2 x 200G (2 x 4 lanes 50G PAM4), 4 x 100G (4 x 2 lanes 50G PAM4), 2 x 50G (2 x 2 lanes 25G NRZ), 4 x 25G NRZ or 4 x 10G NRZ. The guide's lamp legend lists the same set and adds the 1 x 8 lanes 50G PAM4 mode for 400G." data-dac-reach="datasheet interfaces table: the sixteen 24 W ports &quot;Support 400G QSFP56-DD DAC up to 2.5m&quot; and the other forty-eight &quot;up to 1m&quot;. The extra watts buy reach." data-emissions="EN 55032 Class A, EN 61000-3-2, EN 61000-3-3, VCCI-CISPR 32 Class A, AS/NZS CISPR 32 Class A, ICES-003 Issue 7 Class A, FCC Class A" data-immunity="EN 55035, IEC 61000-4-2/3/4/5/6/8/11" data-safety="UL (CSA 22.2 No 62368-1 &amp; UL 62368-1), CB (IEC/EN 60950-1 &amp; IEC/EN 62368-1)" data-nebs="GR63-CORE (Pre-test)" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
