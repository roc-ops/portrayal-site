<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520.2mm" height="43.7mm" viewBox="0 0 520.2 43.7" data-device="qfx5120-48t" data-view="right" data-weight-note="24.25 lb (11 kg) with two power supplies and five fan modules installed (Table 9)" data-depth-note="20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)" data-aggregate-throughput="2.16 Tbps, bidirectional (Table 4)" data-rj45-speeds="10 or 1 GbE (guide Table 16)" data-qsfp28-speeds="100 or 40 GbE. Ports 50 and 51 channelize to 4 x 25 or 4 x 10 GbE. Ports 48 to 53 channelize to 2 x 50 GbE (Table 5)" data-power-typical-w="202" data-power-max-w="251" data-power-envelope="unstated" data-power-dc-typical-w="222" data-power-dc-max-w="227" data-power-input-ac="100 to 240 VAC, 50 to 60 Hz, 5 A" data-power-input-dc="rated -48 to -60 VDC, operating range -44 to -72 VDC, 10 A maximum" data-redundancy-note="two supplies, load-sharing and fully redundant; both should be installed" data-fans="five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one is replaced" data-operating-temp="0 to 40 C (32 to 104 F) normal operation" data-storage-temp="-40 to 70 C (-40 to 158 F) in the shipping container" data-humidity="5 to 90 percent noncondensing" data-altitude="no performance degradation to 1829 m (6000 ft)" data-cpu="2.2 GHz quad-core Intel" data-memory="16 GB" data-storage="100 GB SSD" data-software="Junos OS, first release 20.2R1" data-virtual-chassis="up to 2 switches of the same model; any non-channelized QSFP28 port (48 to 53) can be a virtual chassis port, from 20.2R1" data-timing="PPS OUT and 10M OUT measurement ports (DIN 1.0/2.3, TTL 5 V); PTP supported" data-optics-qsfp28="100 GbE or 40 GbE; channelizes as in guide Table 5" data-oob="one RJ-45 management port (MGMT) with link activity and status lamps" data-console="RJ-45 console port (CON)" data-usb="one USB port" data-eol="none-announced" data-airflow="back-to-front" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
