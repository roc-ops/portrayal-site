<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="609.6mm" height="87.7mm" viewBox="0 0 609.6 87.7" data-device="s9600-72xc" data-view="right" data-switching-capacity="2.4 Tbps" data-packet-buffer="4 GB deep buffer" data-power-typical-w="328" data-power-max-w="685" data-power-envelope="bare" data-input-ac="100 to 240 V, 12 A" data-input-dc="-40 to -75 V, 40 A" data-psu-redundancy="1+1 hot-swappable" data-fan-redundancy="3+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Qumran2c BCM88820 with optional Broadcom OP2 BCM16K external TCAM (premium SKU only)" data-cpu="Intel Skylake-D 8-core @ 1.9 GHz" data-memory="32 GB DDR4 (up to 64 GB)" data-storage="128 GB SSD" data-bmc="ASPEED AST2400" data-timing="Stratum 3E OCXO with optional holdover; SyncE (ITU-T); IEEE 1588v2 default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (additional licence), T-GM, T-BC/OC, T-TC; Time Sensitive Networking (TSN); Class C timing accuracy. NOS integration is required to activate these, which the datasheet states with an asterisk against the whole timing block" data-gnss="internal receiver for master clock implementations" data-routing="full Segment Routing over IPv6 (SRv6)" data-compliance-programme="IEEE 802.1CM fronthaul; ITU-T G.8273.2 T-BC Class C" data-roles="C-RAN hub 5G fronthaul transport aggregation; backhaul aggregation for BBU pooling; programmable as a Broadband Network Gateway (BNG)" data-optics-qsfp28="100G QSFP28 SR4/LR4/ER4/ZR4, up to 80 km per the HIG port table" data-optics-sfp28="25G SFP28 SR/LR/ER; 10G SFP+ SR/LR/ER; 1G SFP SX/LX/EX - the same cages take all three speeds, and the HIG's port table rates ports 0-63 to 40 km" data-timing-cables="the datasheet's Compatible Timing Cable Types row - 50 ohm SMA coaxial with a 1/4-36UNS-2B connector for GNSS; 50 ohm SMB coaxial with a 10-32UNF-2A connector for 1PPS and 10MHz; shielded RJ45 for ToD. The accessory kit ships two SMB-to-BNC converter cables" data-optics-sfp-plus="10G on the two SFP+ management ports. The datasheet's Compatible Transceiver Types list is one list for the whole box and names no management-only part, so the speed here is the port list's ('2 x 10G SFP+ management ports')" data-timing-interfaces="GNSS SMA in; 1PPS SMB in/out; 10MHz SMB in/out; ToD RJ45 in/out" data-console="RJ45 RS-232 plus a micro-USB serial console" data-oob="1x RJ45 100/1000M management port" data-safety="UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI; MTCTE; VCCI CISPR 32, Class A" data-nebs="NEBS GR-1089, GR-3108 (EMC); NEBS GR-63 (environment)" data-environment="ETSI 300 019; ETSI 300 132-2; RoHS; WEEE; MTCTE" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
