<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="762mm" height="87.7mm" viewBox="0 0 762 87.7" data-device="s9700-23d" data-view="left" data-switching-capacity="4.8 Tbps" data-packet-throughput="2000 Mpps" data-packet-buffer="8 GB" data-cluster-capacity="4 Tbps standalone, scaling to 192 Tbps in a DDC cluster" data-power-typical-w="410" data-power-max-w="993" data-power-envelope="bare" data-input-ac="200 to 240 V, 12.5 A" data-input-dc="-40 to -72 V, 60 A" data-psu-redundancy="1+1 hot-swappable" data-fan-redundancy="3+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Jericho2 BCM88690" data-tcam="Broadcom OP2 BCM16K external TCAM, up to 16 parallel searches" data-cpu="Intel Broadwell-DE 8-core @ 2.0 GHz" data-memory="64 GB DDR4" data-storage="128 GB SSD" data-bmc="Aspeed AST2400" data-deployment="standalone core or edge router, or a packet-forwarding building block of a distributed disaggregated chassis (DDC) when its fabric ports are cabled to a UfiSpace S9705-48D or S9725-64E fabric switch. (Keyed `deployment` rather than `role`: `role` is reserved for the structural one each GROUP carries, and two different meanings under one key is what that rule exists to stop)" data-fabric-ports="the 13 QSFP-DD ports of the fabric block are 400GE only and connect ONLY to the fabric ports of an S9705-48D or S9725-64E - the HIG's Port Overview says so explicitly - so they carry no customer traffic and take no optics from the service list" data-breakout="service ports support 4x100G break-out" data-routing="full Segment Routing over IPv6 (SRv6)" data-zr-ports="400ZR and OpenZR+ run on six of the ten service ports - 0, 1, 4, 5, 8 and 9, the left column of each ganged shell (datasheet prose, and HIG Figure 8's highlight read against the printed numbering)" data-optics-qsfp-dd="SERVICE ports, up to 600 km: 400GE QSFP-DD OpenZR+, ZR, SR8, ER4, LR4, DR4 and 100GE QSFP28 ZR4, ER4, LR4, SR4, with 400ZR and OpenZR+ on ports 0, 1, 4, 5, 8 and 9 only. FABRIC ports, up to 100 m: 400GE QSFP-DD DAC, AEC and AOC cable only - no optical transceiver is listed for them and they connect only to an S9705-48D or S9725-64E. One key covers both blocks because both are qsfp-dd media; which list applies is decided by the group, not by the cage" data-optics-sfp-plus="the two SFP+ management ports are 10G; the datasheet's Compatible Transceiver Types block names QSFP-DD and QSFP28 parts only and lists no SFP+ optic, so what is qualified in these two cages is not stated by the vendor" data-console="RJ45 RS-232 plus a micro-USB serial console, both labelled IOIO" data-oob="1x RJ45 100/1000M" data-inband="2x SFP+ 10G management ports" data-usb="1x USB 2.0 Type-A" data-safety="UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI; NOM" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI; VCCI CISPR 32, Class A; AS/NZS CISPR 32, Class A; Anatel; NEBS GR-1089" data-environment="NEBS GR-63; WEEE; RoHS" data-nebs="NEBS Level 3 (datasheet Key Benefits, 'Ideal for Core, Edge, and Central Office deployments (NEBS Level 3)')" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
