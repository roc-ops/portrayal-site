<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="438.4mm" height="648.0mm" viewBox="0 0 438.4 648.0" data-device="qfx5241-64qd" data-view="bottom" data-weight-note="22 kg (48.50 lb) fully loaded without optics (guide Table 9)" data-throughput="51.2 Tbps (guide Table 3)" data-breakout-ports="64 x 800 GbE (guide Table 3)" data-qsfpdd-speeds="800 GbE (guide Table 3)" data-power-typical-w="616" data-power-max-w="2258" data-power-envelope="as-tested" data-power-measurement-note="Typical and maximum power consumption of the QFX5241-64QD, guide Power System section; the guide gives no test conditions" data-power-input-ac="200 to 240 VAC, 50 to 60 Hz, 16 A (guide Table 6)" data-power-input-dc="-48 to -60 VDC, 80 A maximum a supply (guide Tables 6 and 17)" data-redundancy-note="two supplies, 1+1, hot-removable and hot-insertable (guide, Component Redundancy)" data-fans="four fan modules of two rotors, N+1 at rotor level; front-to-back only" data-airflow-note="AO is front-to-back (port-to-FRU, airflow out); the guide describes no back-to-front module" data-operating-temp="0 to 40 C (32 to 104 F) (guide Table 22)" data-storage-temp="-40 to 70 C (-40 to 158 F) in the shipping container" data-humidity="5 to 90 percent noncondensing, operating" data-altitude="no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C with DAC cables; sea level with optics (guide Table 22)" data-cpu="Intel Ice Lake D, 4 cores, 2.2 GHz" data-memory="32 GB DRAM" data-storage="two internal 480 GB NVMe SSDs" data-switch-chip="Broadcom Tomahawk 5 (BCM78900)" data-software="Junos OS Evolved" data-optics-qsfp-dd="800 GbE QSFP-DD; ports 1, 2, 5, 6, 9, 10 and so on in the two middle rows take high power optics such as 800G-ZR and ZR+ (up to 31 W a module at up to 35 C at sea level for 800G-ZR-M-HP) (guide, Ports Panel notes)" data-optics-sfp-plus="two SFP28 ports at 10 GbE" data-oob="one RJ-45 management port" data-console="one RJ-45 console port" data-tod="one RJ-45 time-of-day port" data-usb="one USB 3.0 port" data-timing-outputs="1 PPS and 10 MHz clock connectors" data-acoustic="86.5 dBA for the QFX5241-64QD-AO (guide Table 22)" data-nebs="designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue 3 (guide Table 22)" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
