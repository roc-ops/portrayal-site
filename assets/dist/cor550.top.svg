<svg xmlns="http://www.w3.org/2000/svg" width="440.0mm" height="635.0mm" viewBox="0 0 440.0 635.0" data-device="cor550" data-view="top" data-throughput="4.0 Tbps (non-blocking)" data-port-modes-qsfp28="40GE, 50GE and 100GE; DAC breakout to 2 x 50GE, 4 x 25GE or 4 x 10GE" data-port-modes-qsfp-dd="400GE fabric interconnect to a COR580 (Ramon) spine" data-power-max-w="1400" data-power-typical-w="1100" data-power-envelope="unstated" data-input-ac="90 to 264 VAC, 50-60 Hz" data-input-dc="40 to 72 VDC" data-power-redundancy="1+1 redundant, load-sharing, hot-swappable" data-airflow="front-to-back" data-cooling="4+1 redundant hot-swappable fan modules, behind a carrier-grade air filter" data-temperature-operating="0 C to 55 C" data-humidity-operating="0% to 90%" data-altitude="6000 ft" data-asic="Broadcom BCM88690 (Jericho 2)" data-tcam="Broadcom BCM16K (OP2)" data-cpu="Intel Xeon D-1548, 8-core 2.0 GHz" data-memory="DDR4 SO-DIMM 64 GB (32 GB x 2)" data-storage="M.2 SSD 128 GB" data-bmc="ASPEED AST2600" data-software="ONIE installer pre-loaded; open-source and commercial NOS options" data-port-summary="40 x 100G QSFP28, 13 x 400G QSFP-DD fabric" data-timing="Synchronous Ethernet, IEEE 1588v2 PTP, timing synchronization stack interfaces" data-mgmt-ports="1x RJ-45 RS-232 console, 1x RJ-45 10/100/1000BASE-T management, 2x RJ-45 PPS/ToD, 2x RJ-45 stacking-sync, 2x SFP+ 10G out-of-band, 1x USB 2.0 Type-A, 1x micro-USB console, 1x 1PPS/10MHz coaxial" data-safety="UL (CAN/CSA 22.2 No 60950-1 &amp; UL60950-1), IEC 62368-1:2014, CB (IEC/EN60950-1), CCC (GB4943.1-2011), BSMI (CNS14336-1)" data-emc="CE Mark, FCC Title 47 Part 15 Subpart B Class A, VCCI Class A" data-rohs="RoHS-2.0 compliant; WEEE Directive 2002/96/EC" data-nebs="GR-63-CORE, GR-1089-CORE (NEBS Level 3). The datasheet footnotes this line '* Pre-test. Certificate is by request with fees', so it is a pre-test claim and not a certification." data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
