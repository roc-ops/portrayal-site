  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="GL-8xEP" data-sku="GL-8xEP" data-part-number="" x="0" y="0" width="160" height="45.32" rx="1.2" fill="#17191c" stroke="#0e0f11" stroke-width="0.5" />
  <defs>
    <pattern id="portrayal-ribs" width="7.2" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4.8" height="6" fill="#e8eaed" />
      <rect x="5.4" y="0" width="1.8" height="6" fill="#6a7075" />
    </pattern>
  </defs>
  <g id="--decor" data-class="decor">
    <rect id="ribs-field-0" data-kind="ribs-field" x="2" y="2" width="156" height="41.3" rx="0.6" fill="url(#portrayal-ribs)" />
  </g>
</svg>
