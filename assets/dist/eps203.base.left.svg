<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="474.0mm" height="44.0mm" viewBox="0 0 474.0 44.0" data-device="eps203" data-view="left" data-weight-note="8.5 kg (18.74 lb)" data-power-consumption="Low-line 2000 W max; high-line 2400 W max" data-input-ac="Low-line 15 A for 90-136 VAC (1000 W); high-line 180-264 VAC (1200 W)" data-poe-budget="With a 30 W guard band - low-line 700 W with one PSU, 1700 W with two; high-line 900 W with one, 2100 W with two" data-operating-temp="0 to 45 C (32 to 113 F)" data-storage-temp="-40 to 70 C (-40 to 158 F)" data-humidity="Operating: 5% to 90% non-condensing" data-optics-sfp28="Four 10G/25G SFP28 uplinks, ports 49-52. The datasheet's transceiver list gives 10GBASE-RJ-45, 10G DAC/AOC, 25GBASE-SR/LR, 25G DAC/AOC, 40GBASE-SR4/LR4, 40G DAC/AOC, 100GBASE-SR4/CWDM4/LR4 and 100G DAC/AOC for the chassis as a whole; no per-cage breakout table is published, so none is stated here." data-optics-qsfp28="Two 100G QSFP28 ports, 53-54, sold as stacking ports - &quot;subject to NOS implementation, also can be used as data transmission ports&quot;. Whether stacking is available is a software question the hardware cannot answer, which is why it is here and not in a group's role." data-poe="All forty-eight RJ-45 ports deliver up to 90 W. The key-features list gives the standards per rate group: 36 x 1G/2.5G at IEEE 802.3af/at and bt Type 3/Type 4 90 W, and 12 x 1G/2.5G/5G/10G at the same. Cat 6 cabling, per the datasheet's prose." data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"device":"Edgecore AS4630-54NPE","device-version":"1.0.7","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{},"source-sha256":"af1c6eaf0e4df75dafac958c7b85af4c0313592e878ef3296409a0be78673356","view":"left"}</metadata>
