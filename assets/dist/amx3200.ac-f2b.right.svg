<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="430.0mm" height="43.5mm" viewBox="0 0 430.0 43.5" data-device="amx3200" data-view="right" data-config="ac-f2b" data-capacity="3.2 Tbps full duplex (1.6 Tbps per sled)" data-jumbo-frames="up to 9216 bytes" data-power-max-w="850" data-power-envelope="unstated" data-input-ac="100-240 VAC, 50-60 Hz (10.0 A max per PS at 100-127 V, 8.0 A at 200-240 V)" data-input-dc="-40 to -72 VDC, 40 A max per PS" data-power-redundancy="1+1 redundant, load-sharing, hot-swappable 1200 W supplies" data-airflow="front-to-back" data-temperature-operating="0 C to 45 C (32 F to 113 F)" data-temperature-storage="-40 C to 70 C (-40 F to 158 F)" data-humidity-operating="5% to 95% non-condensing" data-cpu="Intel Atom C3508" data-memory="DDR4 SO-DIMM 8 GB (up to 16 GB)" data-boot-flash="2x 16 MB SPI" data-storage="128 GB M.2 MLC SSD" data-tpm="TPM 2.0" data-software="ONIE installer pre-loaded; open-source and commercial NOS options" data-timing="IEEE 1588v2 PTP up to Class C; 1PPS output per sled" data-sleds="2x AMX-3200-SLED400 (2x 400G CFP2-DCO + 8x 100G QSFP28 each); a blank cover for an unused slot" data-mgmt-ports="1x RJ-45 RS-232 console, 1x RJ-45 100/1000BASE-T management, 1x 1G SFP management, 1x USB 2.0, 2x 1PPS coaxial (one per sled), 1x 4 mm banana receptacle" data-emc="EN 55032 Class A, EN 300 386 Class A, EN 61000-3-2, EN 61000-3-3, VCCI Class A, AS/NZS Class A, ICES-003 Class A, FCC Class A, BSMI Class A" data-immunity="EN 55024/55035, EN 300 386, IEC 61000-4-2/3/4/5/6/8/11" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
