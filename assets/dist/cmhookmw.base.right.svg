  <g id="--decor" data-class="decor">
    <rect id="plate" data-kind="base" x="114.7" y="0" width="2.3" height="70.1" rx="0" fill="#232527" />
    <rect id="neck" data-kind="base" x="102" y="22.3" width="12.7" height="25.5" rx="0" fill="#232527" />
