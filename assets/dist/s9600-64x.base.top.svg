<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9600-64x" data-view="top" data-weight-shipping-kg="34.04" data-switching-capacity="4.8 Tbps" data-packet-buffer="8 GB" data-port-modes-qsfp28="40/100G" data-port-modes-sfp28="1/10/25G" data-power-typical-w="565" data-power-max-dc-w="1140" data-power-max-ac-w="1160.2" data-power-envelope="as-tested" data-power-typical-scope="no transceiver installed (datasheet's own qualifier)" data-power-max-scope="45 C, optics fully populated, 100% traffic load" data-power-reserve-per-circuit-w="1600" data-input-ac="200 to 240 VAC, 10 A" data-input-dc="-40 to -72 VDC, 50 A" data-single-phase-110v-derating="both PSUs run at 1000 W each, 2000 W total, on a single 110 VAC source" data-airflow="front-to-back" data-fans="4 modules, 3+1 redundant, hot-swappable" data-operating-temp="0 to 45 C" data-storage-temp="-40 to 70 C" data-operating-humidity="5% to 85% RH, non-condensing" data-storage-humidity="5% to 93% RH, non-condensing" data-asic="Broadcom Qumran2c BCM88820" data-cpu="Intel Skylake-D 8-core @ 1.9 GHz" data-memory="32 GB DDR4" data-storage="128 GB SSD" data-bmc="ASPEED AST2400" data-timing="Stratum 3E OCXO, SyncE, IEEE 1588v2 (G.8265.1, G.8275.1, G.8275.2, T-GM, T-BC/OC, T-TC)" data-timing-profiles-licensed="SMPTE ST 2059-2 requires an additional license" data-timing-interfaces="GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, ToD RJ45 in/out" data-gnss="internal receiver for master clock implementations" data-timing-cables="50 ohm SMA coax with 1/4-36UNS-2B for GNSS, 50 ohm SMB coax with 10-32UNF-2A for 1PPS and 10MHz, shielded RJ45 for ToD" data-tsn="Time Sensitive Networking, Class C timing accuracy" data-srv6="full Segment Routing over IPv6" data-sfp28-sharing="SFP28 ports 0-3 break out of QSFP28 port 0; enabling them disables port 0" data-nos-required="NOS integration is necessary to activate the timing and sync features" data-optics-qsfp28="100G SR4/LR4/ER4/ZR4, up to 40 km" data-optics-sfp28="25G SR/LR/ER, 10G SFP+ SR/LR/ER, up to 40 km" data-console-serial="115200 8N1, no parity, no flow control" data-console-usb-driver="Silicon Labs CP210x USB-to-UART bridge" data-boot-time-s="100" data-oob-link-time-s="40" data-emc="FCC Part 15 Subpart B Class A, ICES-003 Class A, EN 55032 Class A, EN 55024, EN 55035, EN 62479, EN 50663, EN 300 386, EN 301 489, EN 303 413, BSMI, VCCI CISPR 32 Class A" data-safety="UL 62368-1, IEC 60950-1, IEC 62368-1, BSMI" data-environment="RoHS, WEEE" data-nebs="NEBS statements only - the guide carries the Common Bonding Network, SPD, DC-I return and intra-building OOB wording, and states no Level. It is not a certification claim" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
