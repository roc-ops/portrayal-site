<svg xmlns="http://www.w3.org/2000/svg" width="438.4mm" height="580.0mm" viewBox="0 0 438.4 580.0" data-device="dcs500" data-view="top" data-switching-capacity="6.4 Tbps (12.8 Tbps full duplex)" data-forwarding-rate="4.2 bpps" data-packet-buffer="42 MB integrated" data-jumbo-frames="up to 9 KB" data-port-modes-qsfp28="1x 100GbE or 1x 40GbE, or breakout 4x 25GbE / 4x 10GbE (128 logical ports max)" data-power-max-w="850" data-power-envelope="unstated" data-input-ac="100-240 VAC, 50-60 Hz, 12-6 A" data-power-redundancy="1+1 redundant, load-sharing, hot-swappable" data-airflow="front-to-back" data-temperature-operating="0 C to 45 C (32 F to 113 F)" data-temperature-storage="-40 C to 70 C (-40 F to 158 F)" data-humidity-operating="5% to 95% non-condensing" data-asic="Broadcom BCM56970 Tomahawk 2" data-cpu="Intel Xeon D-1518, 4-core 2.2 GHz" data-memory="2x 8 GB DDR4-2133 ECC SO-DIMM" data-boot-flash="2x 16 MB SPI" data-storage="32 GB M.2 MLC SSD (reserve mSATA connector)" data-software="ONIE installer pre-loaded; open-source and commercial NOS options" data-optics-qsfp28="100GBASE-CR4/AOC/SR4/LR4/CWDM4/PSM4, 40GBASE-CR4/SR4/LR4, 100G DAC, 40G DAC/AOC" data-mgmt-ports="1x RJ-45 serial console, 1x RJ-45 1000BASE-T management, 1x USB Type-A storage" data-emc="CE Mark, EN 55032, AS/NZS CISPR 32, EN 55024, EN 61000-3-2, EN 61000-3-3, FCC Part 15 Subpart B Class A, VCCI Class A" data-safety="CB, UL (CSA 22.2 No 62368-1; UL 62368-1), CNS15598-1" data-nebs="GR63-CORE (pre-test)" data-rohs="RoHS-6 compliant; WEEE Directive 2002/96/EC" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
