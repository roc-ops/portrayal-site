    <rect id="brush" data-kind="brush-field" data-bristle="vertical" x="12" y="6.3" width="416" height="33.4" rx="0" fill="url(#portrayal-brush-vertical)" data-groove="1" />
    <rect id="rivet-1" data-kind="rivet" x="30.5" y="2" width="3" height="3" rx="1.5" fill="#2a2d31" />
    <rect id="rivet-2" data-kind="rivet" x="155.5" y="2" width="3" height="3" rx="1.5" fill="#2a2d31" />
    <rect id="rivet-3" data-kind="rivet" x="281.5" y="2" width="3" height="3" rx="1.5" fill="#2a2d31" />
    <rect id="rivet-4" data-kind="rivet" x="406.5" y="2" width="3" height="3" rx="1.5" fill="#2a2d31" />
  </g>
  <g id="--passes" data-class="passes" pointer-events="none">
