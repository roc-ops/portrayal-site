  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="CRS309-1G-8S+IN" data-sku="CRS309-1G-8S+IN" data-part-number="" x="0" y="0" width="191" height="44" rx="1.2" fill="#d4d4d4" stroke="#22262a" stroke-width="0.5" />
  <g id="--decor" data-class="decor" />
</svg>
