  <g id="--decor" data-class="decor">
    <rect id="plate-0" data-kind="plate" x="0" y="0" width="6" height="622" rx="0.6" fill="#3a3d42" />
    <rect id="plate-1" data-kind="plate" x="437" y="0" width="6" height="622" rx="0.6" fill="#3a3d42" />
  </g>
</svg>
