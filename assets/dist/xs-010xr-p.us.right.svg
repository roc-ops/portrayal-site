  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="XS-010XR-P" x="0" y="0" width="142" height="34.3" rx="1.2" fill="#f7f7f7" stroke="#c9ccd0" stroke-width="0.5" />
  <g id="--decor" data-class="decor">
    <rect id="seam-upper" data-kind="plate" x="0" y="26.3" width="142" height="0.2" rx="0.6" fill="#d3d6d9" />
    <rect id="seam-lower" data-kind="plate" x="0" y="28.3" width="142" height="0.2" rx="0.6" fill="#d3d6d9" />
  </g>
</svg>
