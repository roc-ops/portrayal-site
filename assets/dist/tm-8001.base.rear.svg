  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="TM-8001" x="0" y="0" width="440" height="44" rx="1.2" fill="#d2d6d9" stroke="#22262a" stroke-width="0.5" />
  <g id="--decor" data-class="decor" />
</svg>
