<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="762mm" height="87.7mm" viewBox="0 0 762 87.7" data-device="s9600-28dx" data-view="left" data-config="ac" data-switching-capacity="2.4 Tbps" data-packet-buffer="4 GB deep buffer" data-reach-sfp28="40 km max (HIG port overview, ports 0/1-0/4)" data-reach-qsfp28="80 km max (HIG port overview, ports 0-23)" data-reach-qsfp-dd="600 km max (HIG port overview, ports 24-27)" data-power-typical-w="324" data-power-max-w="894" data-power-envelope="fully-configured" data-power-max-scope="45 C ambient, optics fully populated, 100% traffic load (HIG); 894 W on the DC version and 890 W on the AC version" data-power-typical-scope="no transceiver installed (datasheet's own qualifier)" data-psus="2x 1300 W 1+1 redundant, hot-swappable (exhaust airflow)" data-input-ac="100-240 VAC, 12 A max; 16 A fast-acting fuse in the PSU" data-input-dc="-40 to -75 VDC, 40 A max; 60 A fast-acting fuse in the PSU" data-fans="4 hot-swappable modules, 3+1 redundant, exhaust; front-to-back airflow" data-operating-temp="0 to 45 C" data-storage-temp="-40 to 70 C" data-operating-humidity="5% to 85% RH, non-condensing" data-storage-humidity="5% to 93% RH, non-condensing" data-altitude="rated for operation up to 5000 m (HIG, Connecting Power)" data-asic="Broadcom Qumran2c BCM88820" data-cpu="Intel Icelake-D 8-core @ 2.1 GHz" data-memory="32 GB DDR4" data-storage="128 GB SSD" data-bmc="ASPEED AST2620" data-srv6="full Segment Routing over IPv6" data-breakout="ports 0/1-0/4 are 25G SFP28 in-band ports sharing 100GE port 0" data-coherent="the four QSFP-DD ports support 400G ZR and OpenZR+ transceivers" data-timing="Stratum 3E OCXO with optional holdover, ITU-T SyncE, IEEE 1588v2 (G.8265.1 default, G.8275.1, G.8275.2, SMPTE ST 2059-2 with an additional licence), T-GM, T-BC/OC, T-TC, Class C accuracy, TSN" data-timing-interfaces="GNSS SMA in, 10MHz SMB in/out, 1PPS SMB in/out, ToD RJ45 in/out" data-timing-caveat="NOS integration is necessary to activate the specific feature (datasheet footnote)" data-gnss="internal receiver for master clock; edge Grandmaster with PRTC, distributing phase and time via PTP G.8275.1" data-optics-qsfp-dd="400G QSFP-DD SR, LR, ER, ZR, OpenZR+" data-optics-qsfp28="100G QSFP28 SR, LR, ER, ZR" data-optics-sfp28="25G SFP28 SR, LR, ER; 10G SFP+ SR, LR, ER; 1G SFP SX, LX, EX" data-console="RJ45 serial and micro-USB, 115200 8N1, no flow control; the micro-USB console needs a Silicon Labs CP210x USB-to-UART driver" data-usb="USB 3.0 Type-A port" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 55035; EN 300 386; EN 301 489; EN 303 413; EN 62479; EN 50663" data-environment="WEEE; NOM" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
