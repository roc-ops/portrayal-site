<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440.0mm" height="220.0mm" viewBox="0 0 440.0 220.0" data-device="ecs4530-54csfp" data-view="bottom" data-switching-capacity="256 Gbps" data-forwarding-rate="190.48 Mpps" data-mac-table="16K" data-jumbo-frames="10 KB" data-port-modes-qsfp="20G uplink - the datasheet says '20G QSFP+ Uplink' and nothing about the optics or modes behind it" data-port-modes-sfp-plus="1G / 10G; 10GBASE-SR/LR/ZR/ER, 1000BASE-SX/LX/LHX/ZX, 10G DAC/AOC" data-power-max-w="75.4" data-power-envelope="unstated" data-input-ac="100-240 VAC, 50-60 Hz" data-temperature-operating="0 C to 50 C" data-temperature-storage="-40 C to 70 C" data-humidity-operating="10% to 90% non-condensing" data-humidity-storage="10% to 90% non-condensing" data-flash="2 GB" data-dram="2 GB" data-optics-sfp="1G CSFP (two bidirectional fibre ports per module); 1000BASE-SX/LX/LHX/ZX; DDM" data-port-summary="24 CSFP cages (48 x 1G BiDi fibre), 4 x RJ-45 combo, 4 x 10G SFP+, 2 x 20G QSFP+" data-mgmt-ports="1x RJ-45 console, 1x RJ-45 GE out-of-band management" data-emc="FCC Class A, CE" data-rohs="RoHS; WEEE" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"device":"Edgecore ECS4530-54CSFP","device-version":"3.0.4","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{"common/compliance-sticker@1":"1.0.0"},"source-sha256":"784179166cce42a243fbe1484899190633c6adb23e3051093e8f15a6ab447245","view":"bottom"}</metadata>
