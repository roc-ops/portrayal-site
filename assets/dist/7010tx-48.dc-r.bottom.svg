<svg xmlns="http://www.w3.org/2000/svg" width="439.0mm" height="258.0mm" viewBox="0 0 439.0 258.0" data-device="7010tx-48" data-view="bottom" data-weight="3.9 kg (8.6 lb) for the 7010TX-48, -48C, -48-DC and -48C-DC (guide Table 1, data sheet)" data-size-over-ears="48.3 x 4.4 x 25.8 cm (19 x 1.75 x 10.0 in) with the mounting ears (guide Table 1)" data-depth-with-fans="27.6 cm (10.8 in) &quot;incl. fans&quot; (data sheet); the modelled 258.0 mm is the guide's" data-throughput="296 Gbps, non-blocking" data-packets-per-second="220 Mpps" data-latency="from 2.8 microseconds (25G SFP to RJ-45)" data-packet-buffer="4 MB fully shared packet buffer" data-mac-addresses-max="64000" data-ports-max-speed="52 ports of 1 Gbps; four ports of 10 Gbps; four ports of 25 Gbps" data-power-typical-w="75" data-power-max-w="100" data-power-envelope="unstated" data-psu-redundancy="1+1; two internal supplies, at least one of which must be connected" data-input-ac="100 - 240 VAC, 2.2 A, 50/60 Hz (guide Table 3), IEC 60320 C14" data-input-dc="-40 to -72 VDC, 2.5 A, AWG 14 to 18 ring lug (guide Tables 3 and 4)" data-efficiency="93 percent (Platinum) AC, 92 percent DC (data sheet)" data-airflow="back-to-front" data-noise="46.5 dBA typical at 27 C, 56.5 dBA maximum (data sheet)" data-operating-temp="0 to 40 C (32 to 104 F)" data-storage-temp="-25 to 70 C (guide Table 2); the data sheet says -40 to 70 C" data-humidity="5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent" data-altitude="0 to 3,000 m (10,000 ft) operating" data-cpu="Dual-Core x86" data-memory="4 GB for the 7010TX-48 and -48-DC; 8 GB for the -48C and -48C-DC (data sheet)" data-storage="8 GB flash" data-optics-sfp28="1000BASE-SX/LX, 10GBASE-CR, -AOC, -SR, -LR, -ER, -ZR and 25GBASE-CR, -AOC, -SR, -LR (data sheet)" data-eos-license="license group G2; minimum EOS 4.26.0 (7010TX-48, -48-DC), 4.31.1 (-48C), 4.33.2 (-48C-DC)" data-console="RJ-45 RS-232 serial on the front, 9600 baud 8N1, no flow control" data-oob="one 10/100/1000 management port on the front" data-usb="one USB port on the front, for software or configuration updates" data-emc="FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386" data-safety="EN 62368-1:2014 + A11:2017, IEC 62368-1:2014" data-certifications="BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI (data sheet)" data-rohs="RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)" data-eol="announced" data-eol-announcement="https://www.arista.com/en/support/advisories-notices/end-of-sale/22420-end-of-sale-of-the-arista-7010tx-48-switches" data-end-of-sale="2026-03-20" data-end-of-life="2031-03-20" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
