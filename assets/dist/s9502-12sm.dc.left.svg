<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="43.5mm" viewBox="0 0 250 43.5" data-device="s9502-12sm" data-view="left" data-config="dc" data-switching-capacity="32 Gbps" data-packet-buffer="1 GB deep buffer" data-power-typical-w="45.1" data-power-max-w="47.2" data-power-max-dc-w="45" data-power-envelope="unstated" data-input-ac="100 to 240V, 2A max x2" data-input-dc="-36 to -75V, 4.5A max x2" data-cooling="fanless; the rack must supply at least 1 m/s of airflow in any direction without recirculation (HIG Cooling), and 43.5 mm of clear space is required above and below the unit when the ambient is between 45 and 65 C" data-operating-temp="-40 to 65 C" data-operating-humidity="5% to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5% to 93% RH non-condensing" data-asic="Broadcom Qumran-UX BCM88273" data-cpu="Intel Denverton-NS 2-core @ 1.6GHz" data-memory="8 GB DDR4" data-storage="32 GB SSD" data-optics-sfp="1G SFP SX/LX/EX/ZX, up to 70 km (datasheet Compatible Transceivers; HIG Port Overview gives 100M/1G on ports 0-7)" data-optics-sfp-plus="10G SFP+ SR/LR/ER/ZR, up to 80 km (datasheet Compatible Transceivers; HIG Port Overview gives 1/10G on ports 8-11)" data-timing="Stratum 3E OCXO; SyncE; IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2, T-BC/OC, T-TC) - NOS integration required to activate, and SMPTE ST 2059-2 needs an additional licence (the vendor's own footnotes)" data-console="RJ45 RS-232 serial, 115200 8N1 (port labelled IOIO)" data-oob="1x 100M/1G RJ45 OOB management port" data-usb="1 x USB 2.0 Type-A maintenance port" data-timing-inputs="1x 1PPS in/out SMB, 1x 10MHz in/out SMB, 1x ToD in/out RJ45" data-safety="UL 62368-1, IEC 60950-1, IEC 62368-1, NRCS, BSMI" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 55035; EN 300 386; VCCI CISPR 32 Class A; SANS 2332 Class A; SANS 2335; BSMI" data-environment="RoHS, WEEE" data-eol="none-announced" data-airflow="passive" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
