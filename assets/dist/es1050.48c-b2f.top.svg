  <g id="--decor" data-class="decor">
    <rect id="lid-pad-1" data-kind="pressed-pad" x="150" y="40" width="60" height="30" rx="8" fill="#bfc3c7" data-groove="0.8" />
    <rect id="lid-pad-2" data-kind="pressed-pad" x="300" y="290" width="60" height="30" rx="8" fill="#bfc3c7" data-groove="0.8" />
    <rect id="lid-label-outline" data-kind="outline" x="270" y="250" width="110" height="60" rx="0.6" fill="none" stroke="#a5aaaf" stroke-width="0.4" />
  </g>
</svg>
