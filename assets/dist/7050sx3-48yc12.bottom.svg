<svg xmlns="http://www.w3.org/2000/svg" width="440.0mm" height="444.0mm" viewBox="0 0 440.0 444.0" data-device="7050sx3-48yc12" data-view="bottom" data-weight="9.2 kg (20.3 lbs) (guide Table 1); the data sheet says 20.3 lbs (9.22 kg)" data-size-over-ears="48.3 x 4.4 x 44.4 cm (19 x 1.75 x 17.5 in) with the mounting ears (guide Table 1)" data-throughput="2.4 (4.8) Tbps" data-packets-per-second="2 Bpps" data-latency="from 800 ns" data-packet-buffer="32 MB (dynamic buffer allocation)" data-ports-max-speed="12 ports of 100 Gbps; 24 of 50 Gbps; 12 of 40 Gbps; 96 of 25 Gbps; 96 of 10 Gbps; 48 of 1 Gbps" data-interfaces-max="96" data-power-typical-w="170" data-power-max-w="325" data-power-envelope="as-tested" data-power-measure="guide Table 4 typical and maximum, which the data sheet repeats; typical measured at 25 C ambient with 50 percent load on all ports, excluding transceivers (data sheet)" data-psu-redundancy="1+1" data-input-ac="100 - 240 VAC, 6.5 to 3.0 A (PWR-500AC), IEC 60320 C14" data-input-dc="-48 to -60 VDC, 15 A (PWR-500-DC)" data-efficiency="93 percent (Platinum) AC, 90 percent DC (data sheet)" data-airflow="front-to-back" data-fan-redundancy="4 hot-swap fan modules, N+1" data-operating-temp="0 to 40 C (32 to 104 F)" data-storage-temp="-25 to 70 C (guide Table 2); the data sheet says -40 to 70 C" data-humidity="5 to 90 percent non-condensing" data-altitude="0 to 3,000 m (10,000 ft) operating" data-cpu="Quad-Core x86" data-memory="8 GB" data-storage="8 GB flash" data-optics-sfp28="25G, 10G and 1G, in groups of four, in the 48 SFP cages (data sheet, &quot;SFP25&quot;)" data-optics-qsfp28="100G, 50G, 40G, 25G and 10G with breakout, in the twelve QSFP cages (data sheet)" data-eos-license="license group LIC-FIX-2; minimum EOS 4.20.5" data-console="RJ-45 RS-232 serial on the rear" data-oob="one 10/100/1000 management port on the rear" data-usb="one USB port on the rear" data-emc="FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386" data-safety="EN 62368-1, IEC 62368-1, CSA/UL 62368-1" data-certifications="BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)" data-rohs="RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
