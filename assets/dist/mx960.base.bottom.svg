  <g id="--decor" data-class="decor">
    <rect id="plate-0" data-kind="plate" x="0" y="0" width="6" height="584.2" rx="0.6" fill="#33373c" />
    <rect id="plate-1" data-kind="plate" x="435.1" y="0" width="6" height="584.2" rx="0.6" fill="#33373c" />
  </g>
