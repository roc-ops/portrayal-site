  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="CRS312-4C+8XG-RM" data-sku="CRS312-4C+8XG-RM" data-part-number="" x="0" y="0" width="443" height="44" rx="1.2" fill="#c4c4ca" stroke="#22262a" stroke-width="0.5" />
  <g id="--decor" data-class="decor" />
</svg>
