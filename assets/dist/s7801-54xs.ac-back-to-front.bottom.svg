<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440mm" height="440mm" viewBox="0 0 440 440" data-device="s7801-54xs" data-view="bottom" data-switching-capacity="1.28 Tbps" data-packet-buffer="32 MB" data-port-modes-sfp-plus="1G/10G" data-port-modes-qsfp28="40G/100G" data-power-typical-w="111.3" data-power-max-w="203.3" data-power-envelope="bare" data-input-ac="100 to 240V, 6A" data-input-dc="-36 to -75V, 16A" data-psu-redundancy="1+1 active-active, hot-swappable" data-fan-redundancy="4+1, hot-swappable" data-operating-temp="0C to 45C (32F to 113F)" data-operating-humidity="5% to 95% (RH), non-condensing" data-storage-temp="-40C to 70C (-40F to 158F)" data-storage-humidity="5% to 95% (RH), non-condensing" data-asic="Broadcom Trident3-X5 BCM56771" data-cpu="Intel Denverton 4-Core @ 1.6GHz" data-memory="8 GB DDR4 (Up to 32GB)" data-storage-ssd="32 GB SSD" data-bmc="AST2620" data-optics-sfp-plus="10G SFP+ SR/LR/ER" data-optics-qsfp28="100G QSFP28 SR/LR/ER" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; VCCI CISPR 32, Class A" data-environment="WEEE" data-other-approvals="MTCTE; NOM" data-eol="none-announced" data-airflow="back-to-front" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"device":"UfiSpace S7801-54XS","device-version":"5.0.3","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{"common/compliance-sticker@1":"1.0.0"},"source-sha256":"6b642f1559dbb61928d3894c745ffdbca79fb1c06191b4c00c991804717fdaeb","view":"bottom"}</metadata>
