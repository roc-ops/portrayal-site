<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="571.5mm" height="43.7mm" viewBox="0 0 571.5 43.7" data-device="n9k-c93180yc-ex" data-view="right" data-weight-note="7.8 kg (17.2 lb) without power supplies or fans" data-acoustics="48.5 dBA at 40% fan speed, 64.9 dBA at 70% fan speed, and 77.8 dBA at 100% fan speed" data-system-buffer="40 MB" data-lpm-routes-max="896,000" data-ip-host-entries-max="896,000" data-mac-entries-max="256,000" data-power-typical-w="210" data-power-max-w="470" data-power-envelope="unstated" data-heat-dissipation-btu-hr="1604" data-power-input-ac="100 to 240 V, 50 to 60 Hz" data-power-input-hvac="200 to 277 V" data-power-input-dc="-48 to -60 V" data-power-input-hvdc="-240 to -380 V" data-power-supply-options="500W AC, 650W AC, 930W DC, or 1200W HVAC/HVDC (up to 2)" data-operating-temp="0 to 40 C (32 to 104 F)" data-storage-temp="-40 to 70 C (-40 to 158 F)" data-humidity="5 to 95% (noncondensing)" data-altitude="0 to 4000 m (0 to 13,123 ft)" data-mtbf-hours="390,330" data-asic="Cisco Cloud Scale LSE" data-processor="4 cores" data-memory="24 GB" data-storage="64 GB SSD" data-minimum-nxos-image="NXOS-703I4.2" data-minimum-aci-image="ACI-N9KDK9-11.3" data-optics-sfp28="installation guide: &quot;48 10/25-Gigabit SFP+ downlink ports that support 1-Gigabit, 10-Gigabit, and 25-Gigabit Ethernet&quot;. SFP-10G-T-X is supported only in a stated checkerboard of ports, with the neighbours limited to passive copper." data-optics-qsfp28="installation guide: &quot;six fixed 40/100-Gigabit QSFP28 uplink ports that support combinations of 10-, 25-, 40-, 50-, and 100-Gigabit connectivity&quot;." data-usb-limit="USB 2.0 devices that use less than 2.5 W (0.5 A inclusive of surge current)" data-regulatory="Products should comply with CE Markings according to directives 2004/108/EC and 2006/95/EC" data-safety="UL 60950-1 Second Edition, CAN/CSA-C22.2 No. 60950-1 Second Edition, EN 60950-1 Second Edition, IEC 60950-1 Second Edition, AS/NZS 60950-1, GB4943" data-emissions="47CFR Part 15 (CFR 47) Class A, AS/NZS CISPR22 Class A, CISPR22 Class A, EN55022 Class A, ICES003 Class A, VCCI Class A, EN61000-3-2, EN61000-3-3, KN22 Class A, CNS13438 Class A" data-immunity="EN55024, CISPR24, EN300386, KN 61000-4 series" data-rohs="Yes" data-eol="announced" data-eol-announcement="https://www.cisco.com/c/en/us/products/collateral/switches/nexus-9000-series-switches/n9k-c93180yc-c93108tc-ex-eol.html" data-end-of-sale="2022-08-09" data-end-of-life="2027-08-31" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
