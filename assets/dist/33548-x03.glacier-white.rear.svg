    <rect id="brush-frame" data-kind="outline" x="43.3" y="30.52" width="156" height="72.3" rx="3" fill="none" stroke="#8b9299" stroke-width="1.4" />
    <rect id="brush-seam" data-kind="brush-seam" x="46.3" y="66.07" width="150" height="1.2" rx="0" fill="#6c737a" />
