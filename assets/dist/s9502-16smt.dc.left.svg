<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="43.5mm" viewBox="0 0 250 43.5" data-device="s9502-16smt" data-view="left" data-switching-capacity="32 Gbps" data-packet-buffer="1 GB deep buffer" data-power-typical-w="45.1" data-power-envelope="bare" data-input-ac="100 to 240 V, 2 A per feed" data-input-dc="-36 to -75 V, 4.5 A per feed" data-psu-redundancy="1+1 fixed dual feed, 120 W per supply (not field-replaceable)" data-cooling="fanless convection, six rear grilles" data-operating-temp="-40 to 65 C (temperature hardened)" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Qumran-UX BCM88273" data-cpu="Intel Denverton-NS 2-core @ 1.6 GHz" data-memory="8 GB DDR4" data-storage="32 GB SSD" data-timing="Stratum 3E OCXO with optional holdover; ITU-T SyncE; IEEE 1588v2 default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (extra licence), T-BC/OC, T-TC; Class C accuracy. NOS integration is required to activate the timing features" data-timing-interfaces="1PPS in/out on SMB, 10MHz in/out on SMB, ToD in/out on RJ45 - one connector per function (datasheet Timing Interfaces)" data-optics-sfp-plus="10G SR/LR/ER/ZR (datasheet compatible transceiver list)" data-optics-sfp="1G SX/LX/EX/ZX" data-timing-cables="50 ohm SMB coaxial with 10-32UNF-2A for 1PPS and 10MHz; shielded RJ45 for ToD (datasheet Compatible Timing Cable Types)" data-console="RJ45 RS-232 (labelled IOIOI)" data-oob="1x RJ45 100/1000M out-of-band management" data-safety="UL 62368-1; IEC 60950-1; IEC 62368-1; NRCS" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55035; EN 300 386; VCCI CISPR 32, Class A; SANS 2332, Class A; SANS 2335" data-environment="RoHS; WEEE" data-eol="none-announced" data-airflow="passive" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
