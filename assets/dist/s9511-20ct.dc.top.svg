<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440mm" height="250mm" viewBox="0 0 440 250" data-device="s9511-20ct" data-view="top" data-config="dc" data-switching-capacity="100 Gbps" data-packet-buffer="1 GB deep buffer" data-power-typical-w="63" data-power-envelope="bare" data-input-dc="-36 to -72 V, 8 A per feed" data-psu-redundancy="dual-feed one power stage, fixed (not field-replaceable)" data-fan-redundancy="3+1 fixed (not field-replaceable)" data-operating-temp="-40 to 70 C (temperature hardened)" data-operating-humidity="5 to 95% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Qumran2n BCM88295" data-cpu="Intel Denverton-NS 4-core @ 1.6 GHz" data-memory="8 GB DDR4" data-storage="32 GB eMMC" data-timing="Stratum 3E OCXO with optional holdover; ITU-T SyncE; IEEE 1588v2 default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (extra licence), T-GM, T-BC/OC, T-TC; Class C accuracy. NOS integration is required to activate the timing features" data-gnss="internal receiver for master clock implementations" data-timing-interfaces="GNSS in on SMA, 10MHz in/out on SMB, 1PPS in/out on SMB, ToD in/out on RJ45, BITS in on RJ48 (datasheet Timing Interfaces)" data-routing="full Segment Routing over IPv6 (SRv6)" data-combo-ports="ports 0-3 are 1G RJ45/SFP combo, configurable to either connection type; the faceplate presents both an RJ45 and an SFP aperture for each (HIG Port Overview)" data-optics-sfp28="25G SR/LR/ER (datasheet compatible transceiver list)" data-optics-sfp-plus="10G SR/LR/ER/ZR" data-optics-sfp="1G SX/LX/EX/ZX" data-timing-cables="50 ohm SMA coaxial with 1/4-36UNS-2B for GNSS; 50 ohm SMB coaxial with 10-32UNF-2A for 1PPS and 10MHz; shielded RJ45 for ToD; shielded RJ48 for BITS" data-console="RJ45 RS-232 (labelled IOIOI)" data-oob="1x RJ45 100/1000M out-of-band management" data-safety="UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 301 489; EN 303 413; EN 55035; EN 50663; EN 62479; BSMI" data-eol="none-announced" data-airflow="front-to-back" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
