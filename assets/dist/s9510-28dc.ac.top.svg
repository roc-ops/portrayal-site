<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440mm" height="302mm" viewBox="0 0 440 302" data-device="s9510-28dc" data-view="top" data-config="ac" data-switching-capacity="800 Gbps" data-packet-buffer="2 GB" data-port-modes-qsfp-dd="100/400G, OpenZR+ and 400ZR" data-port-modes-qsfp28="40/100G" data-port-modes-sfp28="1/10/25G" data-power-typical-w="137" data-power-max-dc-w="306" data-power-max-ac-w="301.2" data-psus="2x 400 W 1+1 redundant, hot-swappable (intake)" data-fans="4+1 redundant, hot-swappable (exhaust)" data-operating-temp="-40 to 65 C (temperature hardened)" data-asic="Broadcom Qumran2a BCM88483" data-cpu="Intel Denverton-NS 4-core @ 1.6 GHz (premium SKU 8-core @ 1.7 GHz)" data-memory="8 GB DDR4 (premium 16 GB)" data-storage="32 GB SSD (premium 128 GB)" data-bmc="ASPEED AST2620" data-software="ONIE (NOS required for timing/GNSS features)" data-timing="Stratum 3E OCXO, SyncE, IEEE 1588v2 (T-GM, T-BC/OC, T-TC), Class C, TSN" data-timing-interfaces="GNSS SMA in, 10MHz SMB in/out, 1PPS SMB in/out, ToD RJ45 in, BITS RJ48 in/out" data-gnss="internal receiver for master clock" data-flexe="OIF FlexE 1.1 and 2.0, 400G total bandwidth" data-optics-qsfp-dd="400G SR4/LR4/FR4/ZR4/OpenZR+" data-optics-qsfp28="100G SR4/LR4/ER4" data-optics-sfp28="25G SR/LR/ER, 10G SFP+ SR/LR/ER/ZR" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"config":"ac","device":"UfiSpace S9510-28DC","device-version":"5.0.4","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{},"source-sha256":"bccadac2a09c76de0e7e32baadf27f35b9280084eec8e3e930e4a4bc78d1392c","view":"top"}</metadata>
