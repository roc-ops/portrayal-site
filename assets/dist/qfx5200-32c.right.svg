<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520.2mm" height="43.7mm" viewBox="0 0 520.2 43.7" data-device="qfx5200-32c" data-view="right" data-weight-note="23.5 lb (10.66 kg) fully loaded, QFX5200-32C and QFX5200-32C-L (Table 31)" data-port-speeds="QSFP28 ports 0 to 31, 100 GbE by default; 50, 40, 25 or 10 GbE by configuration or with a breakout cable (up to 128 logical ports)" data-power-typical-w="200" data-power-max-w="312" data-power-envelope="unstated" data-power-32c-l-typical-w="195" data-power-input-ac="100 to 240 VAC, 50 to 60 Hz, 4.5 A at 100 to 120 VAC or 2.0 A at 200 to 240 VAC" data-power-input-dc="rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum" data-redundancy-note="two supplies, load-sharing; one may be removed at a time while the switch runs" data-fans="five fan modules; the switch runs 30 seconds without thermal shutdown while one is replaced" data-operating-temp="0 to 40 C (32 to 104 F)" data-storage-temp="-40 to 70 C (-40 to 158 F) in the shipping container" data-humidity="5 to 90 percent noncondensing (up to 93 percent short term)" data-altitude="no performance degradation to 2000 m (6562 ft)" data-cpu="1.8 GHz quad-core Intel" data-memory="16 GB" data-storage="two 32 GB SSDs" data-software="Junos OS (32C); Junos OS Evolved (32C-L)" data-virtual-chassis="up to three QFX5200-32C members (not the 32C-L)" data-timing="RJ45 grand master clock jack (GM), 1 PPS output, 10 MHz output" data-optics="100 GbE QSFP28, 40 GbE QSFP+, AOC, DAC and breakout cables; a QSFP+ to SFP+ adapter (QSA) from Junos OS 19.3R1" data-oob="SFP management cages C0 and C1 and an RJ45 C0 (10/100/1000 BASE-T); the 32C-L has no second management interface" data-console="RJ-45 console port (CON)" data-usb="one USB port" data-seismic="Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue 3 (Table 30 wording)" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
