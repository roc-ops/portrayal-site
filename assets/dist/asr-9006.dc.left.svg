<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="734.8mm" height="444.5mm" viewBox="0 0 734.8 444.5" data-device="asr-9006" data-view="left" data-weight-configured-kg="104.33" data-weight-configured-scope="fully configured using all card slots and six power modules" data-power-modules-v1="Version 1 power system - up to three AC or DC power modules per system" data-power-modules-v2="Version 2 power system - up to four AC or DC power modules per system" data-power-modules-v3-supported="false" data-power-ac-input-per-module-v1="3400 VA per AC power module" data-power-ac-input-per-module-v2="3290 VA (3000 W output module)" data-power-ac-input-voltage="200-240 VAC nominal (range 180 to 264 VAC); 220-240 VAC (UK)" data-power-ac-input-frequency="50/60 Hz nominal (range 47 to 63 Hz)" data-power-ac-input-current="15 A maximum at 200 VAC; 13 A maximum at 220 to 240 VRMS (UK)" data-power-ac-service-requirement="20 A North America; 16 A international; 13 A United Kingdom" data-power-ac-redundancy="at least two AC power modules required for N+1 redundancy for a fully configured system" data-power-dc-input-per-module-v1="1700 W (1500 W output module)" data-power-dc-input-per-module-v2="2300 W (2100 W output module)" data-power-dc-input-voltage="-48 VDC nominal in North America, -60 VDC nominal in the European Community (range -40.5 to -72 VDC, -75 VDC for 5 ms)" data-power-dc-input-current="49 A maximum at -48 VDC nominal; 39 A maximum at -60 VDC nominal" data-cooling-path="side-to-top-to-rear; inlet at the right side of the chassis, exhaust at the upper rear" data-fans-per-tray="6 fans in three groups of two, each group sharing a fan controller" data-fan-controller-redundancy="1:3 protected" data-operating-temp="41 to 104degF (5 to 40degC)" data-operating-temp-short-term="23 to 131degF (-5 to 55degC)" data-operating-temp-short-term-definition="not more than 96 consecutive hours and a total of no more than 15 days in 1 year" data-storage-temp="-40 to 158degF (-40 to 70degC)" data-humidity-operating="10 to 85 percent noncondensing" data-humidity-non-operating="5 to 95 percent noncondensing" data-altitude-operating="0 to 13,000 ft (0 to 4,000 m)" data-altitude-non-operating="0 to 15,000 ft (0 to 4,570 m)" data-acoustic-noise="78 dB at 80.6degF (27degC) maximum" data-shock-operating="halfsine, 21 in/sec (0.53 m/sec)" data-shock-non-operating="trapezoidal pulse, 20 G, 52 in/sec (1.32 m/sec)" data-vibration-operating="0.35 Grms from 3 to 500 Hz" data-vibration-non-operating="1.0 Grms from 3 to 500 Hz" data-operating-system="Cisco IOS XR" data-interface-path-id="rack/slot/module/port" data-nebs="SR-3580: NEBS Criteria Levels (Level 3)" data-nebs-emc-safety="GR-1089-CORE: NEBS EMC and Safety" data-nebs-physical="GR-63-CORE: NEBS Physical Protection" data-eol="none-announced" data-airflow="side">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
