<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9610-48dx" data-view="top" data-switching-capacity="7.2 Tbps" data-packet-buffer="8 GB" data-power-typical-w="548" data-power-max-w="1524" data-power-envelope="bare" data-input-ac="200 to 240 V, 12.5 A" data-input-dc="-40 to -72 V, 60 A" data-psu-redundancy="1+1 hot-swappable" data-fan-redundancy="3+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Qumran2c+ BCM88840" data-cpu="Intel Icelake-D 12-core @ 1.8 GHz" data-memory="64 GB DDR4" data-storage="2x 256 GB SSD" data-bmc="Aspeed AST2620" data-tcam="TCAM option available to meet diverse deployment requirements (datasheet)" data-timing="Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 with an additional licence), T-GM, T-BC/OC, T-TC, Class C timing accuracy; NOS integration is required to activate any of it" data-gnss="integrated receiver covering GPS/QZSS L1 C/A, GLONASS L1OF, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS, MSAS, GAGAN) and Galileo E1B/C, RF sensitivity -166 dBm; passive and active antennas are both supported and auto-detected (HIG Installing an Antenna)" data-antenna="an active GNSS antenna needs 50 ohm impedance matching, 5 V DC, a noise figure of 1.5 dB maximum and an internal LNA gain of 35-42 dB; the port supplies up to 5 V DC / 150 mA and a surge protector is required (HIG Installing an Antenna)" data-macsec="MACsec on all ports (datasheet feature list)" data-srv6="full Segment Routing over IPv6 (datasheet feature list)" data-optics-qsfp-dd="400G QSFP-DD SR/LR/ER/ZR/OpenZR+ (datasheet Compatible Transceivers)" data-optics-qsfp28="100G QSFP28 SR/LR/ER/ZR/OpenZR+, up to 80 km; 40G" data-optics-sfp28="25G SFP28 SR/LR; 10G SFP+ SR/LR, up to 40 km" data-optics-sfp-plus="the four SFP+ management ports take 10G SFP+ SR/LR from the datasheet's Compatible Transceivers list; no separate reach or media list is published for this block - the HIG's Port Overview table does not cover it at all (see the sfp-plus-management-role gap)" data-sfp28-sharing="the four SFP28/SFP-DD ports are in-band port share with 100GE port 0 (datasheet)" data-timing-cable="50 ohm SMA coaxial with a 1/4-36UNS-2B connector for GNSS, 50 ohm SMB coaxial with a 10-32UNF-2A connector for 1PPS and 10MHz, shielded RJ45 for ToD and shielded RJ48 for BITS, none longer than 3 m (datasheet Compatible Timing Cable Types; HIG section 12)" data-timing-interfaces="GNSS in on SMA, 10MHz in/out on SMB, 1PPS in/out on SMB, ToD in/out on RJ45, BITS in/out on RJ48" data-console="RJ45 RS-232 plus a micro-USB serial console" data-oob="1x RJ45 100/1000M" data-sfp-plus-management="4x 10G SFP+ management ports, numbered 0-3 in their own space" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 301 489; EN 303 413; EN 55035; EN 62479; EN 50663; VCCI CISPR 32, Class A; NEBS GR-1089" data-environment="NEBS GR-63; WEEE" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
