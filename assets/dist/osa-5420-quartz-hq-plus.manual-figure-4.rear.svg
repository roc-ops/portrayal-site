<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="443mm" height="44mm" viewBox="0 0 443 44" data-device="osa-5420-quartz-hq-plus" data-view="rear" data-config="manual-figure-4" data-weight-kg="3.2" data-weight-note="data sheet 3.2 kg; the manual says approximately 3 kg" data-overall-mm="443 x 44 x 219 (data sheet, W x H x D, with connectors)" data-body-mm="436 x 44 x 212 (manual, without brackets and without connectors)" data-ptp-clients="up to 1024 unicast at 128 pps" data-ntp-transactions="up to 8000 per second (NTP server without PTP/Syncjack)" data-holdover-16ppb="0.5 years (typical)" data-power-typical-w="25" data-power-max-w="35" data-power-envelope="bare" data-power-envelope-note="without line cards or SFPs, Vin 48 V (data sheet)" data-psu-rating="40 W AC or DC per module, two hot-swappable" data-input-voltage="100-240 VAC 47-63 Hz, or -48 to -60 VDC (tolerates -36 to -72)" data-cooling="passive convection, no fans or filters" data-operating-temp="AC -40 to +50 C, DC -40 to +65 C" data-storage-temp="-40 to +70 C" data-humidity="5 to 100 percent, with condensation" data-oscillator="high-quality OCXO, G.812 Type I" data-oscillator-aging="+/-2e-10 per day, +/-1e-10 effective after one month powered and three days locked" data-expansion-slots="2" data-gnss="GPS, GLONASS, BeiDou, Galileo; L1, 32 channels" data-optics-sfp="100/1000BaseX; SM/MM coloured or non-coloured SFP and copper SFP on every cage (data sheet); 1000BASE-SX/LX/ZX named for the network ports and 1000BASE-LX10/LH and BX10 for the access ports (manual p13)" data-operation-modes="PTP grandmaster, boundary clock, slave, probe; NTP server; SSU; GNSS fan-out" data-ptp-profiles="G.8265.1, G.8275.1, G.8275.2, enterprise, IEEE 1588 default, IEC/IEEE 61850-9-3, C37.238, SMPTE ST2059-2, AES67" data-syncjack="clock and PTP probes, TE/TIE/MTIE monitoring" data-local="RS-232 console on RJ-45, 10/100 management LAN on RJ-45" data-protocols="CLI, SNMP v1/v2c/v3, Web GUI, Telnet, SSH, HTTP/HTTPS, RADIUS, TACACS+" data-nebs="NEBS level 3 compliance" data-safety="EN 60950-1, 21CFR1040.10, EN 60825" data-emi="EN 55022 2010 Class A, EN 61000-3-2, EN 61000-3-3, EN 300 386, FCC Part 15 Class A, ICES-002 Class A" data-regulatory="CE, RoHS" data-eol="none-announced" data-airflow="passive">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
