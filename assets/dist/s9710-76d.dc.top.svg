<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9710-76d" data-view="top" data-weight-shipping-kg="36.5" data-switching-capacity="14.4 Tbps" data-deep-buffer="16 GB" data-cluster-capacity="14.4 Tbps standalone, up to 691.2 Tbps in a DDC cluster" data-power-typical-w="667" data-power-max-w="2314" data-power-max-dc-w="2351" data-power-envelope="fully-configured" data-input-ac="200 to 240V, 16A max x2" data-input-dc="-40 to -72V, 80A max x2" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5% to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5% to 93% RH non-condensing" data-asic="Broadcom Jericho2c+ BCM88850" data-tcam="Broadcom OP2 BCM16K external TCAM (premium SKU only)" data-cpu="Intel Skylake-D 8-core @ 1.9GHz" data-memory="32 GB DDR4 (up to 128 GB)" data-storage="1x 128 GB SSD (up to 2x 128 GB)" data-bmc="ASPEED AST2400" data-optics-qsfp-dd="400GE QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4; 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/SR4/LR4 (datasheet Compatible Transceivers). 4x100G break-out is supported on the service ports" data-optics-sfp-plus="10GE SFP+ on the two management uplinks (datasheet Physical section, '2 x 10G SFP+ management ports'; the Compatible Transceivers list covers only the QSFP-DD field, so no reach or media types are published for these two)" data-fabric-cables="400GE QSFP-DD AEC, DAC, ACC and AOC on the forty fabric ports (datasheet Compatible Fabric Cable Types); in standalone mode HIG section 4 requires a loopback module in every fabric port so the two J2C+ ASICs stay linked" data-zr-ports="OpenZR+ and ZR are supported on the service ports HIG Figure 10a highlights in brown - 00, 02, 03, 04, 05, 10, 11, 12, 13, 14, 15, 16, 18, 20, 21, 26, 27, 28, 29, 30, 31 and 34. That is 22 of the 36 and it is read off the figure, which is the only place the restriction appears: the datasheet says only '36 x 40/100/200/400G QSFP-DD service ports with 400G ZR/ZR+ support' without naming which" data-op2-option-ports="when the premium OP2 external TCAM is enabled, four service ports are taken for statistics and stop forwarding, leaving 32 - HIG Figure 10b/8b highlights them in yellow as ports 01, 17, 19 and 35" data-timing="Stratum 3E OCXO; SyncE; IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2); SMPTE ST 2059-2 (extra licence); T-BC/OC, T-TC" data-segment-routing="full SRv6" data-macsec="point-to-point MACsec" data-console="RJ45 RS-232 and micro-USB, both labelled IOIO, 115200 8N1 (micro-USB needs the Silicon Labs CP210x driver)" data-oob="1x 100M/1G RJ45 out-of-band management port" data-usb="1x USB 3.0 Type-A maintenance port" data-timing-inputs="1x 1PPS in/out SMB and 1x 10MHz in/out SMB, both premium-build only, 50 ohm, cable no longer than 3 m" data-safety="UL 62368-1, IEC 60950-1, IEC 62368-1, BSMI, MTCTE" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI; VCCI CISPR 32 Class A; MTCTE; Anatel" data-environment="RoHS, WEEE" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
