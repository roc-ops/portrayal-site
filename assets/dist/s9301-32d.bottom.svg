<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="645mm" viewBox="0 0 436 645" data-device="s9301-32d" data-view="bottom" data-switching-capacity="12.8 Tbps" data-packet-buffer="64 MB" data-power-typical-w="419" data-power-max-w="1246" data-power-envelope="bare" data-input-ac="200 to 240 V, 7.5 A per feed" data-input-dc="-40 to -75 V, 40 A per feed" data-psu-redundancy="1+1 hot-swappable active-active" data-fan-redundancy="5+1 hot-swappable" data-operating-temp="0 to 40 C" data-operating-humidity="5 to 95% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 95% RH non-condensing" data-asic="Broadcom Tomahawk 3 BCM56980" data-cpu="Intel Skylake-D 8-core @ 1.9 GHz" data-memory="32 GB DDR4" data-storage="1x 128 GB SSD" data-bmc="Aspeed AST2620" data-optics-qsfp-dd="400GE ZR/ER4/LR4/SR8/FR4/DR4/DR4+/PLR4 and OpenZR+; 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/LR4/SR4 (datasheet Compatible Transceivers Types)" data-optics-sfp-plus="1/10G on the MGMT pair, 10G on the OOB pair (datasheet port list)" data-zr-capacity="up to 8x 400G ZR in either airflow orientation, or up to 6 in total if any OpenZR+ is mixed in; ZR/OpenZR+ modules must not sit in adjacent ports (HIG Port Overview, Figures 12 and 13)" data-console="RJ45 RS-232, 115200 8N1 (labelled IOIOI)" data-oob="1x RJ45 100/1000M plus 2x SFP+ 10G, both reaching the x86 (HIG section 12)" data-safety="UL 62368-1; IEC 62368-1; BSMI; MTCTE" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; BSMI; VCCI CISPR 32, Class A; MTCTE" data-environment="RoHS; WEEE; MTCTE" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"device":"UfiSpace S9301-32D","device-version":"1.1.0","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{"common/compliance-sticker@1":"1.0.0"},"source-sha256":"843adf30ce0737993b32fb80c30d173b5b8bcfdcd8a67c1994f3fa3b0ea53c48","view":"bottom"}</metadata>
