    <text x="104.68" y="126.9" font-family="sans-serif" font-size="2.2" text-anchor="start" fill="#333333" transform="rotate(-90 104.68 126.9)" data-path="silk:1" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="led-pon">PON</text>
    <text x="122.68" y="126.9" font-family="sans-serif" font-size="2.2" text-anchor="start" fill="#333333" transform="rotate(-90 122.68 126.9)" data-path="silk:2" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="led-data">DATA</text>
  </g>
  <g id="led-power" data-path="led-power" data-class="led" data-ref="common/led-dot@1:1.1.0" data-rel-pos="1" transform="translate(85.0,128.2)" data-group="leds" data-group-role="indicator" data-description="the three lamps on the top face" data-states="off on firmware-load" data-for="chassis">
