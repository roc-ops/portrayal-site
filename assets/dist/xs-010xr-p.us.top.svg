<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="208.0mm" height="142.0mm" viewBox="0 0 208.0 142.0" data-device="xs-010xr-p" data-view="top" data-mounting="desktop, wall (horizontal by keyholes, vertical on bracket 3FE49972AA), or outdoor enclosure 3FE54221AH" data-size-with-fibre-tray="208 x 232 x 48 mm, 0.85 kg" data-pon-line-rate="10 Gb/s downstream and upstream (ITU-T G.9807.1 XGS-PON)" data-max-frame-bytes="9216" data-vlans="4094" data-multicast-groups="1024" data-power-max-w="10.6" data-power-min-w="4.54" data-power-typical-w="7.75" data-power-standby-w="4.6" data-power-input="12 V DC 1 A adapter, or PoE on the 10GE port (802.3af PD)" data-operating-temp="-40 to 65 C" data-operating-temp-in-enclosure="-40 to 58 C outside the outdoor enclosure" data-humidity="5% to 95% non-condensing" data-memory="256 MB DDR3" data-flash="128 MB" data-wan="xgs-pon" data-pon-wavelengths="1260-1280 nm upstream, 1575-1580 nm downstream" data-remote="OMCI, Nokia AMS or Altiplano" data-regulatory="FCC compliant, UL 62368" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    #led-pon.state-down, #led-pon .state-down { --led-color: #e02020; }
    #led-power.state-firmware-load, #led-power .state-firmware-load { --led-color: #22c55e; }
    #led-power.state-firmware-load [data-class='led'], #led-power .state-firmware-load { animation: portrayal-blink 1s linear infinite; }
    #led-data.state-link-1g, #led-data .state-link-1g { --led-color: #22c55e; }
    #led-data.state-link-2g5-or-above, #led-data .state-link-2g5-or-above { --led-color: #f5d90a; }
    #led-power.state-on, #led-power .state-on { --led-color: #22c55e; }
    #led-pon.state-out-of-range, #led-pon .state-out-of-range { --led-color: #e02020; }
    #led-pon.state-out-of-range [data-class='led'], #led-pon .state-out-of-range { animation: portrayal-blink 1s linear infinite; }
    #led-pon.state-ranging, #led-pon .state-ranging { --led-color: #22c55e; }
    #led-pon.state-ranging [data-class='led'], #led-pon .state-ranging { animation: portrayal-blink 1s linear infinite; }
    #led-pon.state-up, #led-pon .state-up { --led-color: #22c55e; }
</style>
