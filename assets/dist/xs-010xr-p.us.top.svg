    <title>led-pon</title>
    <circle id="led-pon--bezel" cx="1" cy="1" r="0.95" fill="#17191c" />
    <circle id="led-pon--lamp" cx="1" cy="1" r="0.7" fill="var(--led-color, #3a3f44)" data-path="led-pon/lamp" data-class="led" data-states="off up ranging down out-of-range" data-z-dome="0.3" />
  </g>
  <g id="led-data" data-path="led-data" data-class="led" data-ref="common/led-dot@1:1.1.0" data-rel-pos="3" transform="translate(121.0,128.2)" data-group="leds" data-group-role="indicator" data-description="the three lamps on the top face" data-states="off link-1g link-2g5-or-above" data-for="/rear/port-10ge">
    <title>led-data</title>
