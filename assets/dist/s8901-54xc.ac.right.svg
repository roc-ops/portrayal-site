<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440mm" height="43.8mm" viewBox="0 0 440 43.8" data-device="s8901-54xc" data-view="right" data-switching-capacity="2.0 Tbps" data-packet-buffer="32 MB" data-port-modes-sfp28="1/10/25G" data-port-modes-qsfp28="40/100G" data-power-typical-w="120" data-power-max-w="396.5" data-power-envelope="bare" data-input-ac="100 to 240V AC, 6A max per feed" data-input-dc="-36 to -75V DC, 16A max per feed" data-psu-options="PSU-401-DESR / PSU-401-DISB-1 (400W DC), PSU-401-AESR / PSU-401-AISB (400W AC); exhaust or intake airflow" data-fan-redundancy="4+1 hot-swappable" data-fan-options="FAN-402825-HD (exhaust) / FAN-402825-CD (intake)" data-operating-temp="0 to 45 C" data-storage-temp="-40 to 70 C" data-humidity="5 to 95% RH non-condensing" data-asic="Broadcom Trident3-X5 BCM56770" data-cpu="Intel Denverton 4-core @ 1.6 GHz" data-memory="8 GB DDR4 (up to 32 GB)" data-storage="32 GB SSD" data-bmc="ASPEED AST2620" data-optics-qsfp28="100G SR/LR/ER" data-optics-sfp28="25G SR/LR/ER, per datasheet Compatible Transceivers" data-console="RJ45 serial, 115200 8N1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; VCCI CISPR 32 Class A; AS/NZS CISPR 32 Class A" data-safety="UL 62368-1; IEC 62368-1" data-environment="WEEE" data-other-approvals="MTCTE; NOM" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"device":"UfiSpace S8901-54XC","device-version":"4.0.4","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{"common/rivet@1":"1.0.0"},"source-sha256":"71a23c82dbc366ad2ed643f126b493e957ac948a933d24a333eddea7e61a0506","view":"right"}</metadata>
