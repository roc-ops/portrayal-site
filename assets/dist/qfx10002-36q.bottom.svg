<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="441.0mm" height="787.0mm" viewBox="0 0 441.0 787.0" data-device="qfx10002-36q" data-view="bottom" data-weight="24.5 kg (54 lb) with two AC supplies, two blanks and three fan modules fitted; 24.3 kg (53.6 lb) for the DC build (Table 30)" data-mounting="four-post rack kit in the box; spare kits EX4500-4PST-RMK" data-throughput="2.88 Tbps and 1 Bpps of forwarding capacity (Q5 ASICs); 144 x 10 GbE, 36 x 40 GbE or 12 x 100 GbE ports (Table 2)" data-packet-buffer="deep buffer from hybrid memory cubes (HMC)" data-power-typical-w="560" data-power-max-w="800" data-power-envelope="fully-configured" data-psu-ac-input="100 to 127 VAC and 200 to 240 VAC at 50 to 60 Hz, 9.5 A at 100-120 VAC (Table 21); each supply has one input" data-psu-dc-input="-48 to -60 VDC rated, -40 to -72 VDC operating range, 40 A maximum; a 40 A breaker is recommended" data-psu-redundancy="four bays, 2N recommended; one supply runs the 36Q at 110 VAC or 220 VAC" data-heat-dissipation="1,911 BTU/hr typical and 2,730 BTU/hr maximum (Tables 21 and 25)" data-airflow="front-to-back" data-operating-temp="0 C to 40 C (32 F to 104 F)" data-storage-temp="-40 C to 70 C (-40 F to 158 F) in the shipping container" data-humidity="5 to 90 percent noncondensing; short term 5 to 93 percent" data-altitude="no performance degradation to 1828.8 m (6000 ft)" data-cpu="2.5-GHz quad-core Intel" data-memory="16 GB SDRAM" data-storage="two 25 GB SSDs (the hardware inventory text also names a 25 GB NAND flash drive)" data-asic="Q5 packet forwarding ASICs with hybrid memory cubes" data-timing="1PPS and 10 MHz SMB connectors and a PTP Ethernet SFP port" data-oob="MGMT RJ-45 (em0), 10/100/1000BASE-T, and MGMT SFP (em1), 1000BASE-X" data-console="RJ-45 console (CON), RS-232" data-usb="one USB port" data-seismic="Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue 3" data-eol="announced" data-eol-announcement="https://support.juniper.net/support/eol/product/qfx_series/" data-end-of-sale="2026-01-15" data-end-of-support="2031-01-15" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
