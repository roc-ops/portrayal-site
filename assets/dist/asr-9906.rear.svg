<svg xmlns="http://www.w3.org/2000/svg" width="447.0mm" height="619.51mm" viewBox="0 0 447.0 619.51" data-device="asr-9906" data-view="rear" data-weight-configured-kg="113.9" data-weight-configured-scope="configured with two fan trays, two RSPs, five fabric cards, and one PEM" data-depth-with-cable-management-mm="798.8" data-power-modules-v3="Version 3 power system - up to three AC power modules per system" data-power-ac-input-per-module-v3="6510 VA (6000 W output module)" data-power-ac-input-voltage="200-240 VAC nominal (range 180 to 264 VAC); 220-240 VAC (UK)" data-power-ac-input-frequency="50/60 Hz nominal (range 47 to 63 Hz)" data-power-ac-input-current="15 A maximum at 200 VAC; 13 A maximum at 220 to 240 VRMS (UK)" data-power-ac-service-requirement="20 A North America; 16 A international; 13 A United Kingdom" data-power-ac-redundancy="at least two AC power modules required for N+1 redundancy for a fully configured system" data-cooling-path="front-to-top-to-rear; inlet at the bottom front, exhaust at the lower rear" data-fan-trays="two, FT0 above FT1, to the right of the card cage" data-air-filter-location="underneath the card cage" data-operating-temp="41 to 104degF (5 to 40degC)" data-operating-temp-short-term="23 to 131degF (-5 to 55degC)" data-storage-temp="-40 to 158degF (-40 to 70degC)" data-humidity-operating="10 to 85 percent noncondensing" data-humidity-non-operating="5 to 95 percent noncondensing" data-altitude-operating="0 to 13,000 ft (0 to 4,000 m)" data-acoustic-noise="78 dB at 80.6degF (27degC) maximum" data-operating-system="Cisco IOS XR" data-interface-path-id="rack/slot/module/port" data-nebs="SR-3580: NEBS Criteria Levels (Level 3)" data-nebs-emc-safety="GR-1089-CORE: NEBS EMC and Safety" data-nebs-physical="GR-63-CORE: NEBS Physical Protection" data-eol="none-announced" data-airflow="front-to-back">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
