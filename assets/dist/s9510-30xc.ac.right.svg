<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="302mm" height="43.5mm" viewBox="0 0 302 43.5" data-device="s9510-30xc" data-view="right" data-switching-capacity="360 Gbps" data-packet-buffer="2 GB deep buffer" data-power-typical-w="126" data-power-envelope="unstated" data-input-ac="100 to 240V, 6A" data-input-dc="-36 to -75V, 16A" data-operating-temp="-40 to 65 C (temperature hardened)" data-operating-humidity="5% to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5% to 93% RH non-condensing" data-asic="Broadcom Qumran2u BCM88284" data-cpu="Intel Denverton-NS 4-core @ 1.6GHz" data-memory="8 GB DDR4" data-storage="32 GB SSD" data-bmc="ASPEED AST2620" data-optics-sfp28="25G SFP28 SR/LR/ER, 10G SFP+ SR/LR/ER/ZR (datasheet Compatible Transceiver Types; HIG Port Overview gives 1/10/25G on these ports)" data-optics-qsfp28="100G QSFP28 SR4/LR4/ER4 (datasheet Compatible Transceiver Types; 40/100G with FlexE support)" data-timing="Stratum 3E OCXO; SyncE; IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2, T-GM, T-BC/OC, T-TC); TSN; Class C accuracy - NOS integration required to activate, and SMPTE ST 2059-2 needs an additional licence (the vendor's own footnotes)" data-gnss="internal receiver for master clock implementations" data-flexe="OIF FlexE 1.1 and 2.0, 200G total bandwidth" data-srv6="full Segment Routing over IPv6" data-console="RJ45 RS-232 serial, 115200 8N1 (port labelled IOIO)" data-oob="1x 100M/1G RJ45 management port" data-usb="1 x USB 3.0 Type-A port" data-timing-inputs="GNSS SMA in, 10MHz SMB in/out, 1PPS SMB in/out, ToD RJ45 in, BITS RJ48 in/out" data-safety="UL 62368-1, IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; EN 301 489; EN 303 413; EN 62479; EN 50663; VCCI CISPR 32 Class A" data-nebs="NEBS GR-63, GR-1089 and GR-3108 named in the datasheet's Regulatory Compliance section; no NEBS level is claimed there and none is claimed here" data-environment="WEEE" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
