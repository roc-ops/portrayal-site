  <g id="--decor" data-class="decor" />
  <g id="--silkscreen" data-class="silkscreen">
    <text x="304" y="6" font-family="sans-serif" font-size="3" text-anchor="middle" fill="#e6e8ea" transform="rotate(180 304 6)" data-path="silk:0" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">FAN 1</text>
    <text x="219.2" y="6" font-family="sans-serif" font-size="3" text-anchor="middle" fill="#e6e8ea" transform="rotate(180 219.2 6)" data-path="silk:1" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">FAN 2</text>
    <text x="134.4" y="6" font-family="sans-serif" font-size="3" text-anchor="middle" fill="#e6e8ea" transform="rotate(180 134.4 6)" data-path="silk:2" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">FAN 3</text>
    <text x="49.5" y="6" font-family="sans-serif" font-size="3" text-anchor="middle" fill="#e6e8ea" transform="rotate(180 49.5 6)" data-path="silk:3" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">FAN 4</text>
  </g>
</svg>
