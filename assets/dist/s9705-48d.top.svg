<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9705-48d" data-view="top" data-config="base" data-switching-capacity="8 billion cells per second" data-cluster-capacity="up to 691 Tb/s in an S9700-series DDC cluster" data-power-typical-w="377" data-power-max-w="1433" data-power-max-ac-w="1229" data-power-envelope="fully-configured" data-input-ac="200 to 240 V, 12.5 A" data-input-dc="-40 to -72 V, 60 A" data-psu-redundancy="1+1 hot-swappable, active-active" data-circuit-reserve="2000 W recommended on each of two feeds" data-fan-redundancy="3+1 hot-swappable" data-airflow="front-to-back" data-operating-temp="0 to 45 C" data-operating-humidity="5 to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5 to 93% RH non-condensing" data-asic="Broadcom Ramon BCM88790" data-cpu="Intel Broadwell-DE 8-core @ 2.0 GHz" data-memory="64 GB DDR4 R-DIMM with ECC" data-storage="128 GB SSD" data-bmc="Aspeed AST2400" data-optics-qsfp-dd="400GE QSFP-DD SR8, LR8, DR4 and FR4; 400GE QSFP-DD DAC, AEC and AOC (datasheet Compatible Fabric Transceiver Types and Compatible Fabric Cable Types)" data-optics-sfp-plus="NOT PUBLISHED FOR THESE PORTS. The datasheet's Compatible Fabric Transceiver Types and Compatible Fabric Cable Types blocks cover the forty-eight QSFP-DD fabric ports only; no held document names a single optic for the two 10G SFP+ management ports, which the port list describes as '2 x 10G SFP+ management ports' and nothing more. The cages are drawn to the SFP/SFP+ standard on that description" data-fabric-only="the forty-eight QSFP-DD ports are CELL-BASED fabric ports and the guide says they 'should only be used to interconnect with other fabric ports of the S9700 series' - they are not general Ethernet ports" data-cell-switching="cell-based switching eliminates Ethernet overhead and load-balances every fabric link, at 8 billion cells per second, with internal data-cell memory" data-ddc="backplane switch fabric for a Distributed Disaggregated Chassis built from S9700-series routers, scaling horizontally in a pay-as-you-grow model" data-console="RJ45 serial console and micro USB, both legended IOIO on the faceplate; 115200 8N1, no parity, no flow control (HIG Initial System Setup). The micro USB needs the Silicon Labs CP210x driver" data-oob="1x RJ45 100/1000M out-of-band management port with link and activity lamps" data-sfp-management="2x 10G SFP+ management ports" data-boot-time="approximately 110 s from power-on and 40 s for the OOB port to link, both measured on Ubuntu Linux and NOS-dependent (HIG NEBS statements)" data-safety="UL 62368-1; IEC 62368-1; IEC 60950-1; BSMI; NOM" data-emc="FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 301 489; EN 303 413; EN 55024; EN 55035; EN 62479; EN 50663; BSMI; VCCI CISPR 32, Class A; RCM AS/NZS CISPR 32, Class A; Anatel" data-nebs="NEBS GR-1089 (EMC); NEBS GR-63 (environment)" data-environment="WEEE; RoHS (EU 2011/65/EU with amendment 2015/863)" data-eol="none-announced" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
