<svg xmlns="http://www.w3.org/2000/svg" width="668.0mm" height="1955.8mm" viewBox="0 0 668.0 1955.8" data-device="asr-9922" data-view="left" data-weight-configured-kg="470.28" data-weight-configured-scope="fully configured using all card slots and four power modules" data-depth-with-cable-management-mm="762.0" data-depth-with-front-doors-mm="777.7" data-power-modules-v2="Version 2 power system - up to sixteen AC power modules per system, four per tray" data-power-modules-v3="Version 3 power system - up to twelve AC power modules per system, three per tray" data-power-ac-input-per-module-v2="3290 VA (3000 W output module)" data-power-ac-input-per-module-v3="6510 VA (6000 W output module)" data-power-ac-input-voltage="200-240 VAC nominal (range 180 to 264 VAC); 220-240 VAC (UK)" data-power-ac-redundancy="AC power modules operate in N+N redundancy mode" data-cooling-path="front-to-rear; inlet at the front of the middle cage, exhaust at the upper AND lower rear" data-fan-trays="four - FT0 and FT1 above the RP/FC cage, FT2 and FT3 below it" data-air-filter-location="three filters (left, center, right) on the front of the middle card cage" data-operating-temp="41 to 104degF (5 to 40degC)" data-operating-temp-short-term="23 to 122degF (-5 to 50degC)" data-storage-temp="-40 to 158degF (-40 to 70degC)" data-humidity-operating="10 to 85 percent noncondensing" data-altitude-operating="0 to 13,000 ft (0 to 4,000 m)" data-acoustic-noise="78 dB at 80.6degF (27degC) maximum" data-operating-system="Cisco IOS XR" data-interface-path-id="rack/slot/module/port" data-nebs="SR-3580: NEBS Criteria Levels (Level 3)" data-nebs-emc-safety="GR-1089-CORE: NEBS EMC and Safety" data-nebs-physical="GR-63-CORE: NEBS Physical Protection" data-eol="none-announced" data-airflow="front-to-back">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
