  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="EX2200-24T" data-sku="EX2200-24T-4G" data-part-number="" x="0" y="0" width="445" height="267" rx="1.2" fill="#919599" stroke="#22262a" stroke-width="0.5" />
  <g id="--decor" data-class="decor" />
</svg>
