  <g id="--decor" data-class="decor">
    <rect id="end-cap" data-kind="end-cap" x="0" y="0" width="52" height="53" rx="0.6" fill="#26282b" />
  </g>
  <g id="input" data-path="input" data-class="inlet" data-ref="eaton/g4-cord-l21-30p@1:1.0.0" data-cord-gauge="10 AWG / 5C" data-cord-length-ft="10" data-plug="nema-l21-30p" data-rel-pos="1" transform="translate(7.55,10.05)" data-group="power-input" data-group-role="service">
    <title>input</title>
    <circle id="input--grommet" cx="18.45" cy="18.45" r="18.45" fill="#1b1c1e" stroke="#4a4d51" stroke-width="0.25" data-path="input/grommet" data-class="inlet" />
    <circle id="input--cord" cx="18.45" cy="21.05" r="9.1" fill="#0d0e0f" stroke="#3c3f43" stroke-width="0.3" />
  </g>
</svg>
