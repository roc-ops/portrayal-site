    <rect id="floor" data-kind="floor" x="1.9" y="87" width="72.4" height="1.9" rx="0.6" fill="#33383d" />
    <rect id="tab-outline" data-kind="tab" x="1.9" y="67" width="1.9" height="20" rx="0.6" fill="#3a3f45" />
