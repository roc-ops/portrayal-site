<svg xmlns="http://www.w3.org/2000/svg" width="240.0mm" height="44.0mm" viewBox="0 0 240.0 44.0" data-device="csr200" data-view="right" data-switching-capacity="64 Gbps" data-processing-rate="125 Mpps" data-power-max-w="119" data-power-envelope="as-tested" data-input-dc="36 V - 72 V, 6 A" data-airflow="side" data-cooling="built-in redundant fan modules (not field-replaceable)" data-temperature-operating="-40 C to 70 C (-40 F to 158 F)" data-temperature-storage="-40 C to 85 C (-40 F to 185 F)" data-humidity-operating="5% to 95% non-condensing" data-altitude="5000 m at 40 C" data-temperature-operating-transceiver="-40 C to 65 C" data-asic="Broadcom BCM88272 Qumran-UX" data-cpu="Intel Atom C3308, 2-core" data-memory="DDR4 8 GB" data-storage="32 GB M.2 SSD" data-oscillator="Stratum 3E compliant OCXO" data-software="ONIE installer pre-loaded; Open Network Linux (ONL) compatible" data-timing="IEEE 1588v2 and SyncE in hardware" data-timing-ports="BITS (RJ-45), ToD/1PPS (RJ-45), 1PPS I/O (SMB), 10MHz I/O (SMB)" data-standards="TIP OOPT DCSG specification" data-optics-sfp-plus="10GBASE-SR/LR/ER/ZR/RJ45, 10G DAC/AOC" data-optics-sfp="1000BASE-SX/LX/EX/ZX/RJ45" data-mgmt-ports="1x RJ-45 1000BASE-T management, 1x RJ-45 serial console, 1x USB 2.0 storage" data-emissions="EN 55032:2015+AC:2016 Class B, BS EN 55032:2015+A1:2020, EN 300 386 V2.1.1, FCC 47 CFR Part 15 Subpart B Class A (datasheet) / Class B (quick start), VCCI-CISPR32 Class B, BSMI Class B CNS 13438, ICES-003 Issue 7 Class B" data-immunity="EN 55035:2017/A11:2020, EN 55024:2010+A1:2015, IEC 61000-4-2/3/4/5/6/8/11" data-safety="CSA/IEC/EN 60950-1, CSA/IEC/EN 62368-1, BSMI" data-environmental-classes="ETSI EN 300 019-1-1 Class 1.1 storage, 1-2 Class 2.3 transport, 1-3 Class 3.2 operating" data-rohs="RoHS, WEEE, REACH" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
