    <text x="27.3" y="38.6" font-family="sans-serif" font-size="2.4" text-anchor="middle" fill="#e8e8e8" data-path="silk:1" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">PDU30BHVT8R</text>
    <text x="82" y="15.76" font-family="sans-serif" font-size="1.8" text-anchor="middle" fill="#c8c8c8" data-path="silk:2" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="led-bank-1">BANK 1</text>
    <text x="82" y="30.86" font-family="sans-serif" font-size="1.8" text-anchor="middle" fill="#c8c8c8" data-path="silk:3" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="led-bank-2">BANK 2</text>
  </g>
  <g id="led-bank-1" data-path="led-bank-1" data-class="led" data-ref="cyberpower/pdu-bank-led@1:1.0.0" data-rel-pos="1" transform="translate(72.2,12.2)" data-group="bank-leds" data-group-role="indicator" data-description="the two green bank lamps on the front, BANK 1 and BANK 2" data-states="off on" data-for="chassis">
    <title>led-bank-1</title>
    <circle id="led-bank-1--bezel" cx="3" cy="3" r="3" fill="#17191c" />
    <circle id="led-bank-1--lamp" cx="3" cy="3" r="2.5" fill="var(--led-color, #3a3f44)" data-path="led-bank-1/lamp" data-class="led" data-states="off on" data-z-dome="0.4" />
  </g>
  <g id="led-bank-2" data-path="led-bank-2" data-class="led" data-ref="cyberpower/pdu-bank-led@1:1.0.0" data-rel-pos="2" transform="translate(72.0,27.3)" data-group="bank-leds" data-group-role="indicator" data-description="the two green bank lamps on the front, BANK 1 and BANK 2" data-states="off on" data-for="chassis">
    <title>led-bank-2</title>
    <circle id="led-bank-2--bezel" cx="3" cy="3" r="3" fill="#17191c" />
    <circle id="led-bank-2--lamp" cx="3" cy="3" r="2.5" fill="var(--led-color, #3a3f44)" data-path="led-bank-2/lamp" data-class="led" data-states="off on" data-z-dome="0.4" />
  </g>
