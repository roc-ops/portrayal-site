<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="43.5mm" viewBox="0 0 250 43.5" data-device="m3000-14xc" data-view="right" data-coverage="One FHM supports up to 8 RUs; cascading can be used to extend coverage" data-jumbo-frame="up to 9000 bytes" data-reach-sfp-plus="80 km max (HIG port overview, ports 0-11)" data-reach-qsfp28="10 km max at 40/100G (HIG port overview, ports 12-13)" data-power-max-w="103.9" data-power-envelope="unstated" data-psus="2x 200 W 1+1 active-active, hot-swappable (intake airflow)" data-input-ac="100-240 VAC, 3 A max" data-input-dc="-36 to -75 VDC, 8 A max" data-fans="4 fixed fans, front-to-back airflow" data-operating-temp="-40 to 70 C (datasheet; HIG checklist says -40 to 65 C - see gaps)" data-storage-temp="-40 to 70 C" data-operating-humidity="5% to 95% RH, non-condensing" data-storage-humidity="5% to 93% RH, non-condensing" data-cpu="ARM Cortex-A53 4-core 64-bit @ 1.0 GHz" data-memory="4 GB DDR4" data-fpga="Intel Stratix 10 TX (O-RAN shared cell function)" data-oran="O-RAN shared cell, Cascade-FHM mode" data-fronthaul="various fiber length delay compensation; configurable data compression mode, IQ data width and U/C plane VLAN ID" data-timing="Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 T-TC (G.8275.1; T-BC, T-GM and G.8264 ESMC available with future premium versions), Class C" data-timing-interfaces="GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, BITS RJ48 in/out, ToD RJ45 in/out" data-gnss="GPS L1C/A, GLONASS L1OF, BeiDou B1, Galileo E1B/C; passive or active antenna auto-detected (active supply 5 V DC / 150 mA, min RF sensitivity -166 dBm); activated with a software license key on future premium versions" data-optics-sfp-plus="10G SFP+ SR, LR, ER (datasheet supported accessories)" data-optics-qsfp28="none published - the QSFP28 ports are reserved and the datasheet's supported-accessories list carries only 10G SFP+ optics" data-protocols="CLI, SNMP, NETCONF" data-console="RJ45 serial, 115200 8N1, no flow control" data-safety="UL 62368-1; IEC 62368-1; BSMI" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; EN 303 413; EN 301 489; BSMI; VCCI CISPR 32 Class A; KS C 9832 Class A; KS C 9835" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
