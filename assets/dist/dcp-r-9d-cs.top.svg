  <g id="--decor" data-class="decor">
    <rect id="plate-0" data-kind="plate" x="0" y="0" width="440" height="505" rx="0.6" fill="#b9bec4" />
    <rect id="plate-1" data-kind="plate" x="0" y="492.3" width="440" height="12.7" rx="0.6" fill="#17191c" />
