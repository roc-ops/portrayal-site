<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="447.0mm" height="43.7mm" viewBox="0 0 447.0 43.7" data-device="ex9251" data-view="rear" data-weight-note="22.7 lb (10.3 kg) chassis, with the power supplies and fan trays installed (guide Table 4); the datasheet says 23.15 lb (10.5 kg) fully loaded" data-depth-note="18.5 in (47 cm), or 20.43 in (51.89 cm) with the fan tray and power supply handles (guide Table 4)" data-width-note="19 in (48.26 cm) with the brackets in the guide, 17.6 in (44.7 cm) in the datasheet; the body is modelled" data-switching-capacity="up to 400 Gbps throughput (guide, EX9251 Switch Hardware Overview); the datasheet says up to 800 Gbps" data-sfp-plus-speeds="10 GbE on each of the eight SFP+ ports" data-rate-selectable-speeds="100, 40 or 10 GbE on each QSFP28 port; 4 x 10 GbE with a breakout cable" data-wire-speed-density="24 x 10 GbE, 4 x 40 GbE or 4 x 100 GbE at wire speed (datasheet, Table 4)" data-power-typical-w="240" data-power-max-w="280" data-power-envelope="fully-configured" data-power-envelope-note="fully loaded switch; 240 W typical at 25 C, 280 W maximum at 55 C (guide Table 12)" data-power-input-ac="100 to 240 VAC, 50 to 60 Hz; 3.2 A at 100 VAC, 1.37 A at 240 VAC; system input power 312 W" data-power-input-dc="operating -44 to -72 VDC, nominal -48 and -60 VDC; 20 A at -44 VDC maximum; system input power 331 W" data-power-datasheet-max-w="300 W on AC and 312 W on DC (datasheet Table 3)" data-redundancy-note="two supplies, 1+1 feed redundancy; one supply carries the maximum configuration" data-thermal-output="1705 BTU/hour (500 W) maximum in the guide's Table 20; 1,275 BTU/hour (360 W) in the datasheet" data-fans="three fan trays, each with one counter-rotating fan, and a fan in each supply" data-operating-temp="0 to 40 C (32 to 104 F)" data-storage-temp="-40 to 70 C (-40 to 158 F) in the shipping container" data-humidity="5 to 90 percent noncondensing in operation; the datasheet gives 5 to 95 percent non-operating" data-altitude="up to 10,000 ft (3,048 m) with no performance degradation" data-cpu="1.6 GHz Intel 8-core x86 (guide, Routing Engine)" data-memory="32 GB DDR4" data-storage="2 x 100 GB SATA SSD" data-software="Junos OS, first release 18.1R1" data-optics-sfp-plus="10 GbE SFP+ transceivers and direct attach copper cables" data-optics-qsfp28="QSFP28 and QSFP+ transceivers; a QSFP28 port runs as 100 GbE, 40 GbE or 4 x 10 GbE" data-junos-fusion="Junos Fusion Enterprise" data-ptp="the GM/PTP grandmaster clock port; support is not available in the release the guide covers" data-oob="one RJ-45 management Ethernet port (MGMT), 10/100/1000" data-console="RJ-45 serial console port (CON), RS-232" data-usb="one USB port for installing Junos OS" data-clock-and-time-io="BITS RJ-45, ToD RJ-45, 1PPS and 10MHz SMB in and out, GM/PTP SFP" data-safety="CAN/CSA-22.2 No. 60950-00/UL 1950, EN 60950, IEC 60950-1, EN 60825-1 (datasheet)" data-emc="FCC 47 CFR Part 15 Class A, EN 55022, VCCI, BSMI CNS 13438, AS/NZS CISPR22 (datasheet)" data-nebs="SR-3580 NEBS Criteria Level 3, GR-63-Core, GR-1089-Core (as the datasheet lists them)" data-materials="RoHS 5/6 (datasheet)" data-seismic="Telcordia Technologies Zone 4 earthquake requirements" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }

    #led-fan-0.state-fault, #led-fan-0 .state-fault, #led-fan-1.state-fault, #led-fan-1 .state-fault, #led-fan-2.state-fault, #led-fan-2 .state-fault { --led-color: #ef4444; }
    #led-fan-0.state-initialising, #led-fan-0 .state-initialising, #led-fan-1.state-initialising, #led-fan-1 .state-initialising, #led-fan-2.state-initialising, #led-fan-2 .state-initialising { --led-color: #22c55e; }
    #led-fan-0.state-initialising [data-class='led'], #led-fan-0 .state-initialising, #led-fan-1.state-initialising [data-class='led'], #led-fan-1 .state-initialising, #led-fan-2.state-initialising [data-class='led'], #led-fan-2 .state-initialising { animation: portrayal-blink 1s linear infinite; }
    #led-fan-0.state-ok, #led-fan-0 .state-ok, #led-fan-1.state-ok, #led-fan-1 .state-ok, #led-fan-2.state-ok, #led-fan-2 .state-ok { --led-color: #22c55e; }
</style>
