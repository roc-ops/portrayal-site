<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="501.9mm" height="44.0mm" viewBox="0 0 501.9 44.0" data-device="agr130" data-view="right" data-switching-capacity="800 Gbps" data-processing-rate="700 Mpps" data-power-max-w="450" data-power-envelope="unstated" data-input-ac="100-240 VAC, 50-60 Hz, 6 A maximum" data-input-dc="-36 to -72 VDC, 28-14 A" data-airflow="front-to-back" data-cooling="5+1 redundant hot-swappable fan modules" data-temperature-operating="0 C to 40 C (32 F to 104 F)" data-temperature-storage="-40 C to 70 C (-40 F to 158 F)" data-humidity-operating="5% to 95% non-condensing" data-asic="Broadcom BCM88375 Qumran-MX" data-tcam="BCM52311" data-cpu="Intel Xeon D-1548, 8-core 2.0 GHz" data-memory="DDR4 SO-DIMM, 2 x 16 GB" data-storage="128 GB MLC M.2 SSD" data-bmc="yes, 1 x BMC" data-software="ONIE installer pre-loaded; Open Network Linux (ONL) compatible" data-timing="IEEE 1588v2 and SyncE in hardware" data-optics-sfp-plus="10GBASE-SR/LR, 10G DAC/AOC, 1000BASE-T/SX/LX" data-optics-qsfp28="100GBASE-CR4/SR4/LR4/PSM4 and AOC, 40GBASE-CR4/SR4/LR4, 25GBASE-CR4 and AOC, 10GBASE-CR/SR/LR" data-port-leds-sfp-plus="green 10 Gbps, amber 1 Gbps" data-port-leds-qsfp28="four per port, one per lane - 1 green 100 Gbps, 1 blue 40 Gbps, 1-4 amber 25 Gbps breakout, 1-4 purple 10 Gbps breakout" data-mgmt-ports="1x RJ-45 100/1000BASE-T management, 1x RJ-45 serial console, 1x USB-A storage, 1x BMC" data-emissions="EN 55032:2015+AC:2016 Class A, EN 61000-3-2:2014 Class A, EN 61000-3-3:2013, FCC Class A, VCCI Class A, CE Mark, BSMI Class A CNS 13438" data-immunity="EN 55024:2010+A1:2015, IEC 61000-4-2/3/4/5/6/8/11" data-safety="UL (CSA 22.2 No 60950-1 &amp; UL60950-1), CB (IEC/EN60950-1), BSMI Class A CNS 14336-1" data-nebs="NEBS Level 3" data-rohs="RoHS 2.0 compliant" data-taiwan-rohs="CNS 15663" data-eol="none-announced" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
