  <g id="--decor" data-class="decor" />
  <rect id="region--side-handle" data-path="region:side-handle" data-class="region" x="0" y="0" width="0" height="0" rx="0.8" fill="none" stroke="none" data-extent="none" pointer-events="none" />
  <rect id="region--mounting-bracket" data-path="region:mounting-bracket" data-class="region" x="0" y="0" width="0" height="0" rx="0.8" fill="none" stroke="none" data-extent="none" pointer-events="none" />
