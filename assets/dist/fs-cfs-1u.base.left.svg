  <rect id="chassis-faceplate" data-path="chassis" data-class="chassis" data-model="FS-CFS-1U" x="0" y="0" width="250.2" height="44" rx="1.2" fill="none" />
  <g id="--decor" data-class="decor" />
  <g id="side" data-path="side" data-class="mechanical" data-ref="fs/fs-cfs-1u-side@1:1.0.0" data-rel-pos="5" transform="translate(0.0,0.0)" data-group="shelf" data-group-role="furniture" data-description="the floor, its side walls and its rear lip">
    <title>side</title>
    <g id="side--wall" transform="translate(250.2,0) scale(-1,1)" data-path="side/wall" data-class="bezel">
      <polygon points="0.00,0.00 237.30,28.70 246.00,31.00 250.20,38.50 250.20,42.00 0.00,42.00" fill="#1b1d20" />
      <rect x="0" y="42" width="250.2" height="2" fill="#2a2d31" />
    </g>
  </g>
</svg>
