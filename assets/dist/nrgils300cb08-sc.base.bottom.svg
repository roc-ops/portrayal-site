<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="373.2mm" viewBox="0 0 431.8 373.2" data-device="nrgils300cb08-sc" data-view="bottom" data-weight-empty-kg="6.4" data-weight-configured-kg="8.66" data-weight-configured-scope="populated, 19.1 lb in the nrgILS datasheet; unpopulated is 14.1 lb" data-overall-mm="431.8 x 44 x 387.9 without brackets, as the nrgILS300CB08: the nrgILS datasheet prints this version's dimension row with no figures (gap depth)" data-mounting="19 inch brackets included; 23 inch brackets sold separately" data-input-voltage="-48 VDC nominal (gap input-voltage)" data-input-dc="dual feed; maximum input load 325 A at 45 C per panel, de-rated to 200 A at 70 C; input wire 2/0 AWG to 350 MCM; output wire #14 to #6 AWG in P40 connectors" data-short-circuit-withstand-a="5000" data-output-breaker-max="60 A single-pole; the UL rating holds to 48 A continuous per output" data-input-interrupt-max="125 percent of the panel rating" data-cooling="passive, perforated lid and base" data-operating-temp="to 70 C - 325 A per panel at 45 C, de-rated to 200 A at 70 C; no lower limit is stated" data-load-shedding="per-circuit solid-state switching under software control: scheduled on/off, power cycle after failed pings, manual override; a DIP switch per circuit forces it on" data-monitoring="feed and per-circuit voltage and current; one analog (nrgTEMP) and one digital I2C (nrgILSTEMP) temperature probe" data-ethernet="one Ethernet connection, 10/100/1000 with PoE, in the datasheet (gap ethernet-ports)" data-interfaces="HTTPS web interface, REST API, SNMP v1, v2c and v3, SNTP, syslog; IPv4 and IPv6" data-alarm-contacts="Form C relay per side, 2 A at 30 VDC and 0.6 A at 60 VDC, on wire-wrap terminals" data-safety="UL Listed" data-nebs="Level 3" data-eol="none-announced" data-airflow="passive">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
