<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="762mm" viewBox="0 0 436 762" data-device="s9725-64e" data-view="top" data-switching-rate="21.6 billion cells per second" data-fabric-capacity="64x 800G cell-switched fabric ports; clusters scale to 921.6 Tbps of routing capacity with S9700-series line-card boxes" data-power-typical-w="738" data-power-max-w="2394" data-power-max-dc-w="2279" data-power-envelope="fully-configured" data-input-ac="200 to 240V, 16A max x2" data-input-dc="-40 to -72V, 80A max x2" data-ac-derate="HIG Connecting Power, AC Version: on a 110V source each PSU provides 1500 W for a total of 3000 W, and the vendor notes that in that case a single PSU failure leaves output insufficient to sustain the router" data-operating-temp="0 to 45 C" data-operating-humidity="5% to 85% RH non-condensing" data-storage-temp="-40 to 70 C" data-storage-humidity="5% to 93% RH non-condensing" data-asic="Broadcom Ramon 3 BCM88920 cell switch" data-cpu="Intel Ice Lake 4-core @ 1.9GHz" data-memory="32 GB DDR4 (2x 16 GB DDR4 R-DIMM with ECC)" data-storage="2x 256 GB M.2 SSD" data-bmc="ASPEED AST2620" data-optics-qsfp-dd="800GE QSFP-DD SR8/LR8/DR4/FR4 and 400GE QSFP-DD SR8; 800GE and 400GE QSFP-DD DAC, AEC and AOC cable assemblies (datasheet Compatible Fabric Transceiver Types and Compatible Fabric Cable Types). Link length up to 300 m (HIG Port Overview)" data-optics-sfp-plus="10G SFP+ on the two management uplinks; the datasheet's compatible optics list covers only the fabric field and names nothing for these two" data-timing="Stratum 3E OCXO; SyncE; IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2); SMPTE ST 2059-2 (extra licence); T-BC/OC, T-TC. NOS integration is required to activate any of them" data-cell-switching="cell-based rather than Ethernet switching, which removes the Ethernet overhead and load-balances every fabric link; three flexibly configured fabric pipes manage upstream connectivity" data-deployment="DDC fabric element - a backplane switch fabric for UfiSpace S9700-series disaggregated open core/edge routers, not a customer-facing router. Keyed `deployment` rather than `role`, which is reserved for the structural role each GROUP carries" data-console="RJ45 RS-232 and micro-USB, both labelled IOIOI" data-oob="1x 100M/1G RJ45 OOB management port" data-usb="1 x USB 3.0 Type-A port" data-uplinks="2x 10G SFP+ management ports, numbered 0 and 1 outside the fabric range" data-timing-inputs="1x 1PPS in/out SMB and 1x 10MHz in/out SMB, both Premium build only" data-safety="UL 62368-1, IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; VCCI CISPR 32 Class A; AS/NZS CISPR 32 Class A" data-environment="WEEE" data-nebs="NEBS statements only - the HIG prints a section headed &quot;Cautions and regulatory compliance statements for NEBS&quot; and the datasheet claims no NEBS level, so none is claimed here" data-preliminary="datasheet footer: &quot;Specifications in this document are preliminary and subject to change without notice&quot;" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A SWITCHED OUTLET WITH NO LAMP is dimmed when it is off, as absent is but
       less (docs/pdu-model-design.md section 3.2): every switched PDU in the
       library has a lamp per outlet, and this is the fallback so the first one
       without does not invent a lamp. An outlet a lamp is bound to by `for:`
       carries data-lamped (mark_lamped) and is never dimmed: its lamp says it. */
    [data-class='inlet'][data-states~='off'].state-off:not([data-lamped]) { opacity: 0.55; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
