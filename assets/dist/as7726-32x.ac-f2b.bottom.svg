<svg xmlns="http://www.w3.org/2000/svg" width="438.4mm" height="515mm" viewBox="0 0 438.4 515" data-device="as7726-32x" data-view="bottom" data-config="ac-f2b" data-switching-capacity="3.2 Tbps (6.4 Tbps full duplex)" data-forwarding-rate="2003.4 Mpps" data-packet-buffer="32 MB" data-jumbo-frames="9416 bytes" data-mac-table="32 K min / 288 K max (NOS-dependent)" data-logical-ports-max="128" data-port-modes-qsfp28="1x 100G, 2x 50G, 4x 25G, 1x 40G, 4x 10G (breakout via DAC)" data-power-min-w="149.8" data-power-typical-w="296.73" data-psus="2x 650 W redundant, load-sharing, hot-swappable" data-fans="5+1 redundant, hot-swappable" data-tpm="TPM 1.2" data-asic="Broadcom BCM56870 Trident 3" data-cpu="Intel Xeon D-1518, 4-core @ 2.2 GHz" data-memory="16 GB DDR4 (2x 8 GB SO-DIMM)" data-storage="64 GB M.2 SSD (MLC)" data-boot-flash="2x 16 MB" data-software="ONIE installer" data-optics-qsfp28="100GBASE-SR4/CWDM4/LR4/ER4/ZR4/PSM4-2/DR1/FR1/LR1, 100G-DAC/AOC, 40GBASE-SR4/LR4, 40G-DAC/AOC" data-mgmt-ports="1x RJ-45 console, 1x RJ-45 1000BASE-T, 2x SFP+ 10G, 1x USB-A storage" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
  <metadata>{"config":"ac-f2b","device":"Edgecore AS7726-32X","device-version":"2.0.3","generator":{"tool":"portrayal-render","version":"0.1.0"},"resolved-components":{"common/compliance-sticker@1":"1.0.0","common/device-label@1":"1.1.0"},"source-sha256":"7b09e1e69e2c7d412635df1479ebd611c9fb97cba05653549d73e4ed372c3afe","view":"bottom"}</metadata>
