<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="438.4mm" height="536.0mm" viewBox="0 0 438.4 536.0" data-device="dcs510" data-view="top" data-switching-capacity="12.8 Tbps (25.6 Tbps full duplex)" data-forwarding-rate="7.93 Bpps" data-packet-buffer="64 MB integrated" data-jumbo-frames="up to 9 Kbytes" data-mac-table="8 K (NOS-dependent)" data-vlan-ids="4 K (NOS-dependent)" data-l3-host-table="IPv4 UC 16 K / IPv4 MC 8 K / IPv6 UC 8 K / IPv6 MC 4 K (NOS-dependent)" data-port-modes-qsfpdd="1x 400G, 1x 100G, or breakout 4x 100G / 4x 25G" data-power-max-w="1300" data-power-envelope="unstated" data-input-ac="100-240 VAC, 50-60 Hz" data-input-ac-current="12 A max at 100-120 VAC; 7.5 A max at 200-240 VAC" data-input-hvdc="190-310 VDC, 8-5 A" data-airflow="back-to-front" data-temperature-operating="0 C to 45 C (32 F to 113 F)" data-temperature-storage="-40 C to 70 C (-40 F to 158 F)" data-humidity-operating="5% to 95% non-condensing" data-asic="Broadcom BCM56980 Tomahawk 3" data-cpu="Intel Xeon D-1518, 4-core" data-memory="16 GB DDR4 (2x 8 GB SO-DIMM)" data-boot-flash="2x 16 MB SPI" data-storage="50 GB M.2 SSD (MLC)" data-software="ONIE installer, open-source and commercial NOS options" data-optics-qsfp-dd="400GBASE-SR8/DR4/FR4, 400G-DAC/AOC, 100GBASE-SR4/CWDM4/LR4, 100G-DAC/AOC, 40GBASE-SR4/LR4, 40G-DAC" data-mgmt-ports="1x RJ-45 console, 1x RJ-45 1000BASE-T, 2x SFP+ 10G, 1x USB-A storage, 10 MHz / 1PPS / ToD timing" data-emc="EN 55032 Class A, EN 61000-3-2, EN 61000-3-3, FCC Class A, VCCI Class A, BSMI Class A, ICES-003 Class A, AS/NZS CISPR32 Class A, CISPR 32/24/35" data-immunity="EN 55024/55035, IEC 61000-4-2/3/4/5/6/8/11" data-safety="UL (CSA 22.2 No 62368-1 &amp; UL62368-1), CB (IEC/EN60950-1 &amp; IEC/EN 62368-1), BSMI CNS15598-1, EN60950/UL60950, CE Mark, CCC" data-nebs="GR63-CORE (Pre-test)" data-rohs="RoHS-2.0 compliant; WEEE Directive 2002/96/EC" data-eol="none-announced" data-power="ac hvdc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
