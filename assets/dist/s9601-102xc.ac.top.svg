<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436mm" height="609.6mm" viewBox="0 0 436 609.6" data-device="s9601-102xc" data-view="top" data-switching-capacity="2.4 Tbps" data-packet-buffer="4 GB" data-reach-sfp28="40 km max (HIG Port Overview, ports 0-95)" data-reach-qsfp28="80 km max (HIG Port Overview, ports 96-101)" data-power-typical-w="399" data-power-envelope="bare" data-psus="2x 1300 W 1+1 redundant, hot-swappable (exhaust airflow)" data-input-ac="100-240 VAC, 12 A max" data-input-dc="-40 to -75 VDC, 40 A max" data-fans="4x hot-swappable 3+1 redundant, exhaust airflow; system front-to-back" data-operating-temp="0 to 45 C" data-storage-temp="-40 to 70 C" data-operating-humidity="5% to 85% RH, non-condensing" data-storage-humidity="5% to 93% RH, non-condensing" data-cpu="Intel Icelake-D 8-core @ 2.1 GHz (Standard) or Icelake-D 16-core @ 2.0 GHz (Premium), with VROC support" data-memory="64 GB DDR4 R-DIMM with ECC" data-storage="2x 256 GB SSD" data-asic="Broadcom Qumran2c BCM88820" data-lookup-engine="Broadcom OP2 BCM16K" data-bmc="ASPEED AST2620" data-timing="Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 (G.8265.1 default, G.8275.1, G.8275.2, SMPTE ST 2059-2 with additional licence; T-GM, T-BC/OC, T-TC), Time Sensitive Networking, Class C accuracy" data-timing-interfaces="GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, ToD RJ45 in/out" data-gnss="internal receiver for master clock implementations" data-timing-cables="50 ohm SMA coax with 1/4-36UNS-2B for GNSS; 50 ohm SMB coax with 10-32UNF-2A for 1PPS and 10MHz; shielded RJ45 for ToD" data-routing="full Segment Routing over IPv6 (SRv6)" data-nos="NOS integration is necessary to activate the timing features" data-optics-sfp28="25G SFP28 SR, LR, ER; 10G SFP+ SR, LR, ER; 1G SFP SX, LX, EX (datasheet Compatible Transceivers Types)" data-optics-qsfp28="100G QSFP28 SR4, LR4, ER4, ZR4 (datasheet Compatible Transceivers Types)" data-optics-sfp-plus="10G SFP+ SR, LR, ER (datasheet Compatible Transceivers Types; the two 10G management ports take the same optics as the SFP28 cages do at 10G)" data-console="RJ45 serial, 115200 8N1" data-reset="recessed front-panel pinhole, warm-resets the host CPU when held for less than 10 seconds; HIG section 4.5 warns against sharp tools and asks for the UfiSpace fixture or a flat paperclip" data-safety="UL 62368-1; IEC 62368-1" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 55035; EN 300 386; EN 301 489; EN 303 413; BSMI" data-environment="WEEE; ETSI 300 019; ETSI 300 132-2" data-eol="none-announced" data-airflow="front-to-back" data-power="ac">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
