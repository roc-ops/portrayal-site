<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440mm" height="302mm" viewBox="0 0 440 302" data-device="s9501-28smt" data-view="top" data-config="dc" data-switching-capacity="120 Gbps" data-packet-buffer="1 GB deep buffer" data-reach-rj45="100 m (HIG port overview, ports 0-3)" data-reach-sfp="70 km max (HIG port overview, ports 4-19)" data-reach-sfp-plus="80 km max (HIG port overview, ports 20-27)" data-power-typical-w="60" data-power-max-w="96.9" data-power-envelope="unstated" data-power-typical-scope="no transceiver installed (datasheet's own qualifier)" data-psus="2x 200 W 1+1 active-active, hot-swappable (intake airflow)" data-input-ac="100-240 VAC, 3 A max; 12 A fast-acting fuse in the PSU" data-input-dc="-36 to -75 VDC, 8 A max; 20 A fast-acting fuse in the PSU" data-fans="3 hot-swappable modules, 2+1 redundant, exhaust; front-to-back airflow" data-operating-temp="-40 to 65 C, temperature hardened" data-storage-temp="-40 to 70 C" data-operating-humidity="5% to 85% RH, non-condensing" data-storage-humidity="5% to 93% RH, non-condensing" data-altitude="rated for operation up to 5000 m (HIG, Connecting Power)" data-asic="Broadcom Qumran-UX BCM88270" data-cpu="Intel Denverton-NS 4-core @ 1.6 GHz" data-memory="8 GB DDR4" data-storage="32 GB SSD" data-bmc="ASPEED AST2620" data-macsec="supported; the two cyan-banded SFP+ ports 26-27 are the MACsec pair" data-timing="Stratum 3E OCXO with optional holdover, ITU-T SyncE, IEEE 1588v2 (G.8265.1 default, G.8275.1, G.8275.2, SMPTE ST 2059-2 with an additional licence), T-GM, T-BC/OC, T-TC, T-TSC, Class C accuracy" data-timing-interfaces="GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, ToD RJ45 in/out, BITS RJ48 in" data-timing-caveat="NOS integration is necessary to activate the specific feature (datasheet footnote, and nine rows of the HIG LED tables repeat it)" data-gnss="internal receiver for master clock; GPS/QZSS L1 C/A, GLONASS L1OF, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS, MSAS, GAGAN), Galileo E1B/C; passive or active antenna auto-detected, active supply 5 V DC / 150 mA, minimum RF sensitivity -166 dBm, 30 dB minimum signal strength" data-cable-limits="ToD, BITS, 1PPS and 10MHz cables must not exceed 3 m (HIG section 12)" data-optics-sfp-plus="10G SFP+ SR, LR, ER, ZR (datasheet compatible transceiver types)" data-optics-sfp="1G SFP SX, LX, EX, ZX (datasheet compatible transceiver types)" data-console="RJ45 serial, 115200 8N1, no flow control" data-usb="USB 2.0 Type-A maintenance port" data-bmc-scope="individual BMC for automatic and remote platform health monitoring" data-safety="UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI" data-emc="FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI; VCCI CISPR 32 Class A" data-environment="RoHS; WEEE" data-eol="none-announced" data-airflow="front-to-back" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
