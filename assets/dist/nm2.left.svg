    <rect id="ring-bar-upper" data-kind="finger-wall" x="0" y="6" width="175" height="3" rx="0.6" fill="#0d0f10" />
    <rect id="ring-bar-lower" data-kind="finger-wall" x="0" y="79" width="175" height="3" rx="0.6" fill="#0d0f10" />
    <rect id="ring-hook" data-kind="finger-wall" x="172" y="56.7" width="3" height="25.3" rx="0.6" fill="#101214" />
    <rect id="plate" data-kind="base" x="175" y="0" width="17.3" height="88" rx="0.6" fill="#232527" data-groove="0.05" />
    <rect id="wall-upper" data-kind="finger-wall" x="192.3" y="0" width="106" height="10" rx="0.6" fill="#26282a" />
    <rect id="wall-lower" data-kind="finger-wall" x="192.3" y="78" width="106" height="10" rx="0.6" fill="#26282a" />
  </g>
