  <g id="--decor" data-class="decor">
    <rect id="fold-top" data-kind="flange" x="75.4" y="0" width="13.2" height="1.2" rx="0" fill="#1b1d20" />
    <rect id="fold-bottom" data-kind="flange" x="75.4" y="42.3" width="13.2" height="1.2" rx="0" fill="#1b1d20" />
