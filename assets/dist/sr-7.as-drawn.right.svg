<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="647.7mm" height="355.6mm" viewBox="0 0 647.7 355.6" data-device="sr-7" data-view="right" data-config="as-drawn" data-part-number="3HE10766AA / 3HE00186AA" data-ru="8" data-weight-kg="34" data-weight-installed-kg="41" data-weight-full-kg="70" data-width-over-flanges-mm="482.6" data-mounting="mid-mount, factory-installed brackets" data-power-max-w="3750" data-power-envelope="fully-configured" data-power-max-scope="heat dissipation with worst-case IOM and MDAs (SR-7 guide p94 Table 29)" data-power-input-dc="-40 to -72 VDC into two DC PEM-3 (100 A breaker each), one -48 V / RTN pair per PEM-3; one PEM-3 carries the system, two give redundancy" data-rated-voltage-dc="-40 to -72 VDC; PEM-3 4000 W at -40 to -72 VDC, 4600 W at -46 to -72 VDC" data-power-input-ac="none on the chassis; an external split rectifier shelf (OmniOn L21 3HE20676AA, Eltek HM34J) feeds the PEM-3 terminals" data-acoustic-dba="77.6" data-operating-temp="5 C to 40 C; short-term -5 C to 55 C" data-acoustic-noise="77.6 dBA at low fan RPM (3300), 91.7 at high (6000), 99.6 at full (7900), with PEM-3s and Enhanced Fan Trays" data-storage-temp="-40 C to 70 C" data-humidity="5 to 85 percent non-condensing; short-term 5 to 90" data-altitude="60 m below to 1800 m above sea level at 40 C; 1800 to 4000 m at 30 C" data-family="7750 SR" data-card-slots="5" data-sfm-slots="2" data-fan-slots="1" data-pem-slots="2" data-eol="none-announced" data-airflow="side" data-power="dc">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
