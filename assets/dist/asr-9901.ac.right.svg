<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="599.95mm" height="87.12mm" viewBox="0 0 599.95 87.12" data-device="asr-9901" data-view="right" data-rack-face-width-mm="482.6" data-rack-aperture-min-mm="450.85" data-weight-chassis-only-kg="21.6" data-rack-mounting="19-in. two-post and four-post" data-capacity="456 Gbps nonblocking full-duplex" data-integrated-interfaces="16 x 1GE SFP, 24 x 1/10GE SFP/SFP+, 2 x 100GE QSFP28" data-port-modes-sfp="1GbE only - data sheet Table 2, &quot;16x1 GE&quot;, and the install guide, &quot;16 ports that support 1 GbE (using SFP)&quot;. Cisco publishes no per-optic list for this chassis" data-port-modes-sfp-plus="1GbE or 10GbE dual-rate - install guide, &quot;24 ports that support 1 GbE (using SFP) or 10 GbE (using SFP+)&quot;, with the note that 1 GE copper transceivers work from IOS-XR 7.0.1 at 1 GE only, and that 10 and 100 Mbps are not supported" data-port-modes-qsfp28="100GbE - data sheet Table 2, &quot;2x100 GE&quot;. Figure 121 numbers them 20 and 21" data-power-typical-w="850" data-power-max-w="1100" data-power-input-ac="90-265 VAC, 50-60 Hz" data-power-input-dc="-40 to -72 VDC" data-power-supply-pids="A9K-1600W-AC, A9K-1600W-DC" data-power-cord-family="Saf-D-Grid: CAB-AC-16A-SG-* at 16 A 250 VAC, CAB-AC-20A-SG-US/US1 at 20 A 110/125 VAC" data-airflow="front-to-back" data-operating-temp="5 to 40 C (41 to 104 F) nominal, -5 to 55 C short-term" data-storage-temp="-40 to 70 C (-40 to 158 F)" data-operating-humidity="10 to 85 percent nominal, 5 to 90 percent short-term" data-storage-humidity="5 to 95 percent" data-operating-altitude="0 to 4000 m" data-route-processor="integrated" data-software="Cisco IOS XR 64-bit only" data-timing="2 x BITS/J.211 SYNC RJ-45, IEEE 1588 service LAN and ToD RJ-45, 10 MHz and 1 PPS SMB" data-display="four-character LED matrix" data-console="RJ-45 serial" data-auxiliary="RJ-45 serial" data-mgmt-ethernet="2 x RJ-45" data-cmp-port="1 x RJ-45 connectivity management processor" data-usb="1 x USB class A" data-nebs="designed to meet SR-3580 NEBS Criteria Level 3 and GR-1089-CORE NEBS EMC and Safety" data-eol="none-announced">
  <style>
    [data-path] { cursor: pointer; }
    .state-on    { --led-color: #22c55e; }
    .state-up    { --led-color: #22c55e; }
    /* link and up are the same fact on an Ethernet lamp; see docs/rj45-family-design.md */
    .state-link  { --led-color: #22c55e; }
    .state-activity { --led-color: #86efac; }
    .state-ok    { --led-color: #22c55e; }
    .state-fault { --led-color: #ef4444; }
    .state-fail  { --led-color: #ef4444; }
    .state-locate { --led-color: #3b82f6; }
    .state-absent { opacity: 0.35; }
    /* A state is a colour AND a behaviour. Solid and blinking of the same colour
       are different facts on real hardware: on the S9510-28DC a solid green PWR
       is "system power good" and a blinking green PWR is "power good but BMC
       power fail". A blinking state that renders solid is the same failure as a
       state class nothing paints - it looks modelled and is not.
       blink animates opacity rather than fill, because each skin carries its own
       unlit colour in the fill fallback and a keyframe cannot name it. alternate
       animates fill, because two colours is the whole point, and takes its first
       value from the element's own fill. */
    @keyframes portrayal-blink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes portrayal-alternate {
      0%, 49.9% { fill: var(--led-color, #3a3f44); }
      50%, 100% { fill: var(--led-color-alt, #3a3f44); }
    }
    .portrayal-highlight { filter: drop-shadow(0 0 1.2px #f59e0b) drop-shadow(0 0 0.5px #f59e0b); }
    .portrayal-dim { opacity: 0.25; }
    [data-class='region'].portrayal-highlight { stroke: #f59e0b; stroke-width: 0.7; filter: none; }
    .state-fail[data-class='psu'], .state-fail[data-class='fan'] { filter: drop-shadow(0 0 1.4px #ef4444); }
</style>
