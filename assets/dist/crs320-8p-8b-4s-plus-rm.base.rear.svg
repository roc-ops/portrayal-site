    <text x="252.5" y="37.1" font-family="sans-serif" font-size="1.7" text-anchor="middle" fill="#2b2b2b" data-path="silk:2" data-class="silkscreen" data-group="silkscreen" data-group-role="marking" data-for="chassis">POWER 2 / POWER 1</text>
