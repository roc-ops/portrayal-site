comments: 'Juniper 4100 W DC power supply (PWR-MX960-4100-DC) of the EX9214. It is the high-capacity DC
  supply of the MX960. It stands upright in PEM0 to PEM3 at the rear. It has two DC power inputs: INP0
  at the top of the supply and INP1 in a feed above it. It has a switch behind a door, a vertical handle
  and a lower terminal block under a cover. The four lamps are INP0 OK, INP1 OK, DC OK and PS FAIL. The
  supplies work in two zones. PEM0 and PEM2 feed one zone, and PEM1 and PEM3 feed the other.


  Facts carried in the model that this schema has no field for:

  - input-voltage: -40 to -72 VDC

  - power-output-w: 4100

  - redundancy: 1+1 per zone

  Contract version 1.0.0 (juniper/ex9214-pwr-mx960-4100-dc).'
